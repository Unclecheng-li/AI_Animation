<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#b4452f"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --paper:#efe9dc; --ink:#191714; --muted:#8b8376; }
      * { box-sizing:border-box; }
      html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--paper); }
      body { font-family:Arial,Helvetica,sans-serif; color:var(--ink); }
      #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper); }
      #main-clip { position:absolute; inset:0; overflow:hidden; }
      #ground { position:absolute; inset:0; background-image:linear-gradient(rgba(25,23,20,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(25,23,20,.055) 1px,transparent 1px); background-size:54px 54px; }
      #ground::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 58% 45%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 38%); }
      .topline { position:absolute; left:92px; right:92px; top:70px; display:flex; align-items:center; justify-content:space-between; border-top:3px solid var(--ink); padding-top:18px; z-index:4; }
      .kicker { font-size:22px; font-weight:800; letter-spacing:.22em; }
      .counter { font:700 20px "Courier New",monospace; letter-spacing:.08em; }
      #viewport { position:absolute; left:490px; top:135px; width:940px; height:760px; display:grid; place-items:center; z-index:2; }
      .level { position:absolute; width:660px; height:660px; display:grid; place-items:center; opacity:0; transform-origin:center; }
      .level-title { position:absolute; left:-340px; top:265px; width:290px; text-align:right; }
      .level-title b { display:block; font:900 72px/.9 Georgia,serif; letter-spacing:-.05em; }
      .level-title span { display:block; margin-top:18px; font:700 18px/1.3 "Courier New",monospace; color:var(--accent); text-transform:uppercase; letter-spacing:.1em; }
      .no-labels .level-title,.no-labels .topline,.no-labels #scale { opacity:0; }
      .scope { position:absolute; width:650px; height:650px; border:3px solid var(--ink); border-radius:50%; }
      .scope::before,.scope::after { content:""; position:absolute; background:var(--ink); opacity:.45; }
      .scope::before { width:760px; height:2px; left:-55px; top:324px; }
      .scope::after { width:2px; height:760px; top:-55px; left:324px; }
      .scope-ring { position:absolute; border:2px solid var(--accent); border-radius:50%; opacity:.5; }
      #atom .scope-ring:nth-of-type(1){width:240px;height:95px;transform:rotate(25deg)}
      #atom .scope-ring:nth-of-type(2){width:240px;height:95px;transform:rotate(-35deg)}
      #atom .scope-ring:nth-of-type(3){width:240px;height:95px;transform:rotate(85deg)}
      .nucleus { width:72px; height:72px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 18px color-mix(in srgb,var(--accent) 18%,transparent); }
      .electron { position:absolute; width:16px; height:16px; border-radius:50%; background:var(--ink); }
      .e1{transform:translate(105px,-55px)} .e2{transform:translate(-70px,105px)} .e3{transform:translate(-120px,-30px)}
      #cell .membrane { width:410px; height:335px; border:12px double var(--accent); border-radius:53% 47% 58% 42%/44% 61% 39% 56%; position:relative; background:color-mix(in srgb,var(--accent) 8%,transparent); }
      #cell .core { position:absolute; width:120px; height:105px; border-radius:50%; background:var(--ink); left:145px; top:110px; }
      #cell .organelle { position:absolute; width:82px; height:32px; border:5px solid var(--accent); border-radius:50%; }
      #cell .o1{left:52px;top:58px;transform:rotate(-25deg)} #cell .o2{right:44px;bottom:55px;transform:rotate(18deg)} #cell .o3{left:48px;bottom:60px;transform:rotate(35deg)}
      #human .height-line { position:absolute; width:3px; height:500px; background:var(--accent); right:102px; top:82px; }
      #human .height-line::before,#human .height-line::after { content:""; position:absolute; right:-14px; width:31px; height:3px; background:var(--accent); }
      #human .height-line::before{top:0} #human .height-line::after{bottom:0}
      #human .figure { width:180px; height:500px; position:relative; }
      #human .head { position:absolute; left:57px; width:68px; height:68px; border-radius:50%; background:var(--ink); }
      #human .torso { position:absolute; top:86px; left:48px; width:86px; height:210px; background:var(--ink); clip-path:polygon(20% 0,80% 0,100% 100%,0 100%); }
      #human .limb { position:absolute; background:var(--ink); border-radius:20px; transform-origin:top center; }
      #human .arm-a{width:28px;height:220px;left:25px;top:100px;transform:rotate(12deg)} #human .arm-b{width:28px;height:220px;right:25px;top:100px;transform:rotate(-12deg)}
      #human .leg-a{width:34px;height:225px;left:52px;top:280px;transform:rotate(5deg)} #human .leg-b{width:34px;height:225px;right:52px;top:280px;transform:rotate(-5deg)}
      #city .city-grid { width:520px; height:520px; transform:rotateX(58deg) rotateZ(-43deg); display:grid; grid-template-columns:repeat(5,1fr); gap:18px; }
      #city .block { background:var(--ink); border:8px solid var(--paper); box-shadow:0 0 0 3px var(--accent); }
      #city .block:nth-child(3n){transform:scale(.72)} #city .block:nth-child(4n){background:var(--accent)}
      #earth .globe { width:500px; height:500px; border-radius:50%; background:var(--ink); position:relative; overflow:hidden; box-shadow:0 0 0 20px color-mix(in srgb,var(--accent) 18%,transparent); }
      #earth .land { position:absolute; background:var(--accent); border-radius:48% 52% 58% 42%; }
      #earth .l1{width:220px;height:145px;left:40px;top:95px;transform:rotate(14deg)} #earth .l2{width:150px;height:210px;right:55px;bottom:45px;transform:rotate(-22deg)}
      #earth .lat { position:absolute; inset:0; border:2px solid rgba(239,233,220,.35); border-radius:50%; transform:scaleY(.45); }
      #scale { position:absolute; left:92px; right:92px; bottom:62px; height:84px; z-index:4; }
      .scale-line { position:absolute; left:0; right:0; top:22px; height:4px; background:var(--ink); transform-origin:left; }
      .ticks { display:grid; grid-template-columns:repeat(5,1fr); position:absolute; inset:0; }
      .tick { position:relative; padding-top:42px; font:700 19px "Courier New",monospace; color:var(--muted); }
      .tick::before { content:""; position:absolute; top:12px; left:0; width:4px; height:24px; background:var(--ink); }
      .tick.active { color:var(--ink); }
      .tick.active::before { background:var(--accent); height:36px; top:0; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="broll-scale-shift" data-start="0" data-duration="9" data-fps="30" data-width="1920" data-height="1080">
      <div id="main-clip" class="clip" data-start="0" data-duration="9" data-track-index="1">
        <div id="ground"></div>
        <header class="topline"><div class="kicker">ORDERS OF MAGNITUDE</div><div class="counter" id="exponent">10⁻¹⁰ METRES</div></header>
        <main id="viewport">
          <section class="level" id="atom"><div class="level-title"><b>ATOM</b><span>10⁻¹⁰ m</span></div><div class="scope"></div><div class="scope-ring"></div><div class="scope-ring"></div><div class="scope-ring"></div><div class="nucleus"></div><i class="electron e1"></i><i class="electron e2"></i><i class="electron e3"></i></section>
          <section class="level" id="cell"><div class="level-title"><b>CELL</b><span>10⁻⁵ m</span></div><div class="scope"></div><div class="membrane"><div class="core"></div><i class="organelle o1"></i><i class="organelle o2"></i><i class="organelle o3"></i></div></section>
          <section class="level" id="human"><div class="level-title"><b>HUMAN</b><span>10⁰ m</span></div><div class="scope"></div><div class="figure"><div class="head"></div><div class="torso"></div><i class="limb arm-a"></i><i class="limb arm-b"></i><i class="limb leg-a"></i><i class="limb leg-b"></i></div><div class="height-line"></div></section>
          <section class="level" id="city"><div class="level-title"><b>CITY</b><span>10⁴ m</span></div><div class="scope"></div><div class="city-grid"><i class="block b0"></i><i class="block b1"></i><i class="block b2"></i><i class="block b3"></i><i class="block b4"></i><i class="block b5"></i><i class="block b6"></i><i class="block b7"></i><i class="block b8"></i><i class="block b9"></i><i class="block b10"></i><i class="block b11"></i><i class="block b12"></i><i class="block b13"></i><i class="block b14"></i><i class="block b15"></i><i class="block b16"></i><i class="block b17"></i><i class="block b18"></i><i class="block b19"></i><i class="block b20"></i><i class="block b21"></i><i class="block b22"></i><i class="block b23"></i><i class="block b24"></i></div></section>
          <section class="level" id="earth"><div class="level-title"><b>EARTH</b><span>10⁷ m</span></div><div class="scope"></div><div class="globe"><i class="land l1"></i><i class="land l2"></i><i class="lat"></i></div></section>
        </main>
        <footer id="scale"><div class="scale-line"></div><div class="ticks"><div class="tick">10⁻¹⁰</div><div class="tick">10⁻⁵</div><div class="tick">10⁰</div><div class="tick">10⁴</div><div class="tick">10⁷ m</div></div></footer>
      </div>
    </div>
    <script>
      const vars = window.__hyperframes.getVariables();
      if (!vars.showLabels) document.getElementById('stage').classList.add('no-labels');
      const ids = ['atom','cell','human','city','earth'];
      const exponents = ['10⁻¹⁰ METRES','10⁻⁵ METRES','10⁰ METRES','10⁴ METRES','10⁷ METRES'];
      const tl = gsap.timeline({ paused:true });
      ids.forEach((id,index) => {
        const t = index * 1.65;
        tl.fromTo('#'+id,{autoAlpha:0,scale:.18,rotation:index%2?3:-3},{autoAlpha:1,scale:1,rotation:0,duration:.72,ease:'expo.out'},t);
        if (index < ids.length - 1) {
          tl.to('#'+id,{scale:4.8,autoAlpha:0,duration:.74,ease:'expo.in'},t+1.08);
        }
        tl.set('#exponent',{textContent:exponents[index]},t+.05);
        tl.set('.tick',{className:'tick'},t+.05);
        tl.set('.tick:nth-child('+(index+1)+')',{className:'tick active'},t+.05);
      });
      tl.fromTo('.scale-line',{scaleX:0},{scaleX:1,duration:7.4,ease:'none'},0);
      tl.fromTo('.topline',{y:-40,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);
      tl.fromTo('.electron',{scale:.2,autoAlpha:0},{scale:1,autoAlpha:1,duration:.42,stagger:.08,ease:'back.out(1.8)'},.35);
      tl.fromTo('#cell .organelle',{scale:.3,autoAlpha:0},{scale:1,autoAlpha:1,duration:.45,stagger:.07,ease:'back.out(1.5)'},2);
      tl.fromTo('#city .block',{scale:0,autoAlpha:0},{scale:1,autoAlpha:1,duration:.35,stagger:{each:.018,from:'center'},ease:'power2.out'},5.15);
      tl.fromTo('#earth .land',{scale:.6,autoAlpha:0},{scale:1,autoAlpha:1,duration:.55,stagger:.12,ease:'power3.out'},6.9);
      tl.to('#earth .globe',{scale:1.045,duration:.65,ease:'sine.inOut'},8.05);
      tl.to('#main-clip',{autoAlpha:0,duration:.28,ease:'power2.in'},8.72);
      tl.seek(0);
      window.__timelines['broll-scale-shift'] = tl;
    </script>
  </body>
</html>
