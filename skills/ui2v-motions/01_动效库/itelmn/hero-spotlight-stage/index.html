<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050505; }
      .stage {
        position: absolute; left: 360px; top: 180px; width: 1200px; height: 720px;
        background: #111; border-radius: 8px; overflow: hidden;
      }
      .actor {
        position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);
        font-family: Georgia, serif; font-size: 120px; color: #fafafa; letter-spacing: -0.03em; text-align: center;
        width: 900px;
      }
      .spot {
        position: absolute; left: 50%; top: -20%; width: 900px; height: 1200px; margin-left: -450px;
        background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 32%, transparent 62%);
        mix-blend-mode: screen; pointer-events: none;
      }
      .curtain-l, .curtain-r {
        position: absolute; top: 0; width: 50%; height: 100%; background: #7f1d1d;
      }
      .curtain-l { left: 0; }
      .curtain-r { right: 0; }
      .caption {
        position: absolute; left: 0; right: 0; bottom: 90px; text-align: center;
        font-family: "Segoe UI", sans-serif; font-size: 28px; letter-spacing: 0.35em; text-transform: uppercase; color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="stage" class="clip stage" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="actor" id="actor">Spotlight Stage</div>
        <div class="spot" id="spot"></div>
        <div class="curtain-l" id="cl"></div>
        <div class="curtain-r" id="cr"></div>
      </div>
      <div id="caption" class="clip caption" data-start="0" data-duration="4.5" data-track-index="1">Theatrical reveal · Feature debut</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#stage", { opacity: 0, scale: 0.96 });
      gsap.set("#actor", { opacity: 0, y: 30 });
      gsap.set("#spot", { opacity: 0, scaleY: 0.6, transformOrigin: "50% 0%" });
      gsap.set("#caption", { opacity: 0, y: 12 });
      gsap.set("#cl", { x: 0 });
      gsap.set("#cr", { x: 0 });
      tl.to("#stage", { opacity: 1, scale: 1, duration: 0.5 }, 0.1)
        .to("#cl", { x: "-100%", duration: 1.1, ease: "power3.inOut" }, 0.4)
        .to("#cr", { x: "100%", duration: 1.1, ease: "power3.inOut" }, 0.4)
        .to("#spot", { opacity: 1, scaleY: 1, duration: 0.8, ease: "power2.out" }, 1.1)
        .to("#actor", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.3)
        .to("#caption", { opacity: 1, y: 0, duration: 0.5 }, 1.7)
        .to("#spot", { x: 40, duration: 2.0, ease: "sine.inOut" }, 2.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
