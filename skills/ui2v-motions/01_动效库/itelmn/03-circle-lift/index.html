<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Section Title","default":"Introduction"},
  {"id":"steps","type":"string","label":"Steps (JSON array)","default":"[{\"letter\":\"I\",\"heading\":\"Introduction\",\"body\":\"Overview of key concepts and learning objectives for this module.\"},{\"letter\":\"II\",\"heading\":\"Core Principles\",\"body\":\"The fundamental principles that underpin effective practice in this domain.\"},{\"letter\":\"III\",\"heading\":\"Key Frameworks\",\"body\":\"Explore the major frameworks and models used by industry professionals.\"},{\"letter\":\"IV\",\"heading\":\"Practical Applications\",\"body\":\"Real-world scenarios where these concepts come together in practice.\"},{\"letter\":\"V\",\"heading\":\"Summary & Next Steps\",\"body\":\"Recap of what we have covered and what to expect in the next module.\"}]"},
  {"id":"circleColor","type":"color","label":"Circle Color","default":"#285f9f"},
  {"id":"accentColor","type":"color","label":"Accent / Divider Color","default":"#cd5746"},
  {"id":"bgColor","type":"color","label":"Background Color","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStep","type":"number","label":"Seconds per Step","default":4,"min":1.5,"max":6,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --circle-color: #285f9f; --accent-color: #cd5746; --bg-color: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body { width: 1920px; height: 1080px; background-color: var(--bg-color); background-image: var(--base-plate); background-size: 1920px 1080px; background-position: 0 0; background-repeat: no-repeat; font-family: 'Inter', Arial, Helvetica, sans-serif; overflow: hidden; position: relative; }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .divider { position: absolute; left: 50%; top: 0; width: 6px; height: 100%; background: var(--accent-color); transform: translateX(-50%); opacity: 0.85; }
    .circle { position: absolute; left: 50%; top: 50%; width: 128px; height: 128px; border-radius: 50%; background: var(--circle-color); transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 38px; font-weight: 700; letter-spacing: 1px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .text-block { position: absolute; top: 50%; transform: translateY(-50%); width: 700px; min-height: 360px; opacity: 0; }
    .text-block.right { left: calc(50% + 170px); }
    .text-block.left { right: calc(50% + 170px); text-align: right; }
    .text-block .heading { font-size: 46px; font-weight: 700; margin-bottom: 22px; color: var(--circle-color); line-height: 1.16; }
    .text-block .body { font-size: 25px; line-height: 1.5; color: #5a6e78; }
    .step-indicator { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 20; }
    .step-dot { width: 14px; height: 14px; border-radius: 50%; background: #d8d2c8; }
  </style>
</head>
<body>
  <div data-composition-id="circle-lift" data-width="1920" data-height="1080" data-duration="18" data-start="0">
    <div id="el-fade"></div>
    <div class="divider"></div>
    <div class="circle" id="circle"></div>
    <div class="text-block right" id="textRight"></div>
    <div class="text-block left" id="textLeft"></div>
    <div class="step-indicator" id="dots"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var steps = JSON.parse(vars.steps || '[]');
      var circleColor = vars.circleColor || '#285f9f';
      var accentColor = vars.accentColor || '#cd5746';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var durPerStep = Number(vars.durationPerStep) || 2.5;
      var root = document.documentElement;
      root.style.setProperty('--circle-color', circleColor);
      root.style.setProperty('--accent-color', accentColor);
      root.style.setProperty('--bg-color', bgColor);
      root.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');

      var circle = document.getElementById('circle');
      var textRight = document.getElementById('textRight');
      var textLeft = document.getElementById('textLeft');
      var dotsEl = document.getElementById('dots');
      var dotEls = [];

      steps.forEach(function(_, i) {
        var d = document.createElement('div'); d.className = 'step-dot';
        dotsEl.appendChild(d); dotEls.push(d);
      });

      // Build all text blocks as panels
      var rightPanels = [], leftPanels = [];
      steps.forEach(function(s, i) {
        var rp = document.createElement('div');
        rp.innerHTML = '<div class="heading">' + s.heading + '</div><div class="body">' + s.body + '</div>';
        if (i === 0) { rp.style.position = 'relative'; rp.style.opacity = '1'; }
        else { rp.style.position = 'absolute'; rp.style.inset = '0'; rp.style.opacity = '0'; }
        textRight.appendChild(rp); rightPanels.push(rp);

        var lp = document.createElement('div');
        lp.innerHTML = '<div class="heading">' + s.heading + '</div><div class="body">' + s.body + '</div>';
        lp.style.position = 'absolute'; lp.style.inset = '0'; lp.style.opacity = '0';
        textLeft.appendChild(lp); leftPanels.push(lp);
      });

      // Pre-build circle letter panels
      var circlePanels = [];
      steps.forEach(function(s, i) {
        var cp = document.createElement('div');
        cp.textContent = s.letter;
        cp.style.position = 'absolute';
        cp.style.inset = '0';
        cp.style.display = 'flex';
        cp.style.alignItems = 'center';
        cp.style.justifyContent = 'center';
        cp.style.opacity = (i === 0) ? '1' : '0';
        circle.appendChild(cp);
        circlePanels.push(cp);
      });
      gsap.set(dotEls[0], { backgroundColor: circleColor, width: 18, height: 18 });

      var TOTAL = steps.length * durPerStep + 2;
      var tl = gsap.timeline({ paused: true });
      tl.from('#circle', { scale: 0, opacity: 0, duration: 0.6, ease: 'back.out(1.7)' }, 0);
      tl.to(textRight, { opacity: 1, duration: 0.5 }, 0.3);

      for (var i = 1; i < steps.length; i++) {
        (function(idx) {
          var t = idx * durPerStep;
          var isRight = idx % 2 === 0;
          var prevRight = (idx - 1) % 2 === 0;
          var prevPanel = prevRight ? rightPanels[idx - 1] : leftPanels[idx - 1];
          var nextEl = isRight ? textRight : textLeft;
          var nextPanel = isRight ? rightPanels[idx] : leftPanels[idx];
          var prevEl = isRight ? textLeft : textRight;

          tl.to('#circle', { scale: 0, duration: 0.25, ease: 'power2.in' }, t);
          tl.to(prevPanel, { opacity: 0, duration: 0.2 }, t);
          tl.to(prevEl, { opacity: 0, duration: 0.2 }, t);
          tl.to(circlePanels[idx - 1], { opacity: 0, duration: 0.15 }, t);

          tl.to('#circle', { scale: 1, duration: 0.5, ease: 'back.out(1.7)' }, t + 0.25);
          tl.to(circlePanels[idx], { opacity: 1, duration: 0.3 }, t + 0.25);
          tl.to(nextEl, { opacity: 1, duration: 0.5 }, t + 0.3);
          tl.to(nextPanel, { opacity: 1, duration: 0.5 }, t + 0.35);
          tl.to(dotEls[idx - 1], { backgroundColor: '#d8d2c8', width: 14, height: 14, duration: 0.2 }, t);
          tl.to(dotEls[idx], { backgroundColor: circleColor, width: 18, height: 18, duration: 0.2 }, t + 0.1);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="circle-lift"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['circle-lift'] = tl;
    </script>
  </div>
</body>
</html>
