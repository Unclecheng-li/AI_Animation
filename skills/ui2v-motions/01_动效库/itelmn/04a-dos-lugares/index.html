<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
      /* recetas CSS de motion-anything (Animate.css): seek-safe. Sobre SVG: transform-box fill-box. */
      @keyframes tada {
  from {
    transform: scale3d(1, 1, 1);
  }

  10%,
  20% {
    transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
  }

  30%,
  50%,
  70%,
  90% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
  }

  40%,
  60%,
  80% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes jello {
  from,
  11.1%,
  to {
    transform: translate3d(0, 0, 0);
  }

  22.2% {
    transform: skewX(-12.5deg) skewY(-12.5deg);
  }

  33.3% {
    transform: skewX(6.25deg) skewY(6.25deg);
  }

  44.4% {
    transform: skewX(-3.125deg) skewY(-3.125deg);
  }

  55.5% {
    transform: skewX(1.5625deg) skewY(1.5625deg);
  }

  66.6% {
    transform: skewX(-0.78125deg) skewY(-0.78125deg);
  }

  77.7% {
    transform: skewX(0.390625deg) skewY(0.390625deg);
  }

  88.8% {
    transform: skewX(-0.1953125deg) skewY(-0.1953125deg);
  }
}
@keyframes bounce {
  from,
  20%,
  53%,
  to {
    animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0);
  }

  40%,
  43% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -30px, 0) scaleY(1.1);
  }

  70% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -15px, 0) scaleY(1.05);
  }

  80% {
    transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0) scaleY(0.95);
  }

  90% {
    transform: translate3d(0, -4px, 0) scaleY(1.02);
  }
}
@keyframes headShake {
  0% {
    transform: translateX(0);
  }

  6.5% {
    transform: translateX(-6px) rotateY(-9deg);
  }

  18.5% {
    transform: translateX(5px) rotateY(7deg);
  }

  31.5% {
    transform: translateX(-3px) rotateY(-5deg);
  }

  43.5% {
    transform: translateX(2px) rotateY(3deg);
  }

  50% {
    transform: translateX(0);
  }
}
@keyframes rubberBand {
  from {
    transform: scale3d(1, 1, 1);
  }

  30% {
    transform: scale3d(1.25, 0.75, 1);
  }

  40% {
    transform: scale3d(0.75, 1.25, 1);
  }

  50% {
    transform: scale3d(1.15, 0.85, 1);
  }

  65% {
    transform: scale3d(0.95, 1.05, 1);
  }

  75% {
    transform: scale3d(1.05, 0.95, 1);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes swing {
  20% {
    transform: rotate3d(0, 0, 1, 15deg);
  }

  40% {
    transform: rotate3d(0, 0, 1, -10deg);
  }

  60% {
    transform: rotate3d(0, 0, 1, 5deg);
  }

  80% {
    transform: rotate3d(0, 0, 1, -5deg);
  }

  to {
    transform: rotate3d(0, 0, 1, 0deg);
  }
}
@keyframes wobble {
  from {
    transform: translate3d(0, 0, 0);
  }

  15% {
    transform: translate3d(-25%, 0, 0) rotate3d(0, 0, 1, -5deg);
  }

  30% {
    transform: translate3d(20%, 0, 0) rotate3d(0, 0, 1, 3deg);
  }

  45% {
    transform: translate3d(-15%, 0, 0) rotate3d(0, 0, 1, -3deg);
  }

  60% {
    transform: translate3d(10%, 0, 0) rotate3d(0, 0, 1, 2deg);
  }

  75% {
    transform: translate3d(-5%, 0, 0) rotate3d(0, 0, 1, -1deg);
  }

  to {
    transform: translate3d(0, 0, 0);
  }
}

      .anim { transform-box: fill-box; transform-origin: 50% 50%; animation-fill-mode: both; animation-timing-function: ease; }
      
    #office-ghost { animation: jello 1.2s .6s both, swing 1.2s 6.5s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #bench-hands { animation: bounce 1.1s 3.4s both, tada 1s 8.5s both; transform-box: fill-box; transform-origin: 50% 100%; }
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="12">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern></defs>
  <rect width="1920" height="1080" fill="#0E1317"/><rect width="1920" height="1080" fill="url(#dots)"/>

  <g id="title">
    <text x="960" y="110" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">El agente vive en dos lugares</text>
    <text x="960" y="160" text-anchor="middle" font-size="28" fill="#85DDCB">uno piensa y guarda las llaves; el otro ejecuta y se puede tirar</text>
  </g>

  <!-- ===== Lugar 1: app runtime = la oficina ===== -->
  <g id="office">
    <rect x="140" y="260" width="740" height="520" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="140" y="260" width="740" height="520" rx="16" fill="#141C21" stroke="#85DDCB" stroke-width="4"/>
    <rect x="140" y="260" width="740" height="60" rx="16" fill="#85DDCB"/><rect x="140" y="300" width="740" height="20" fill="#85DDCB"/>
    <text x="510" y="302" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">1 · app runtime (tu proceso Node)</text>
    <g id="office-ghost"><image xlink:href="assets/ghosty.png" x="180" y="380" width="200" height="232" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="office-items" font-size="24" fill="#F2F5F4">
      <text x="420" y="400">🧠  habla con el modelo</text>
      <text x="420" y="450">🔑  guarda API keys y secretos</text>
      <text x="420" y="500">📋  escribe los checkpoints</text>
      <text x="420" y="550">🛠  decide qué tool llamar</text>
      <text x="420" y="600" fill="#85DDCB">nunca ejecuta código del modelo</text>
    </g>
    <text x="510" y="740" text-anchor="middle" font-size="24" fill="#7C8A8E">aquí Ghosty piensa</text>
  </g>

  <!-- ===== Lugar 2: sandbox = la mesa de trabajo ===== -->
  <g id="bench">
    <rect x="1040" y="260" width="740" height="520" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="1040" y="260" width="740" height="520" rx="16" fill="#37AB93" stroke="#F2F5F4" stroke-width="4"/>
    <rect x="1040" y="260" width="740" height="60" rx="16" fill="#F2F5F4"/><rect x="1040" y="300" width="740" height="20" fill="#F2F5F4"/>
    <text x="1410" y="302" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">2 · sandbox (contenedor, VM o caja)</text>
    <rect x="1070" y="350" width="680" height="380" rx="10" fill="#0E1317"/>
    <g id="bench-items" font-size="24" fill="#F2F5F4">
      <text x="1100" y="400">💻  corre bash y scripts</text>
      <text x="1100" y="450">📁  tiene /workspace (persiste)</text>
      <text x="1100" y="500">🚫  sin llaves, sin secretos</text>
      <text x="1100" y="550">🌐  red que tú decides</text>
      <text x="1100" y="600" fill="#85DDCB">se apaga sin perder la sesión</text>
    </g>
    <g id="bench-hands"><image xlink:href="assets/ghosty.png" x="1590" y="380" width="130" height="152" preserveAspectRatio="xMidYMid meet"/></g>
    <text x="1410" y="690" text-anchor="middle" font-size="24" fill="#7C8A8E">aquí Ghosty hace</text>
  </g>

  <g id="footer">
    <text x="960" y="860" text-anchor="middle" font-size="26" fill="#7C8A8E">si el sandbox se rompe, se tira y se levanta otro; la sesión sigue viva en el runtime</text>
    <text x="960" y="904" text-anchor="middle" font-size="26" fill="#F2F5F4">self-hosted (ejemplo oficial): los dos en la misma máquina, el runtime como proceso y el sandbox como contenedor</text>
    <text x="960" y="948" text-anchor="middle" font-size="26" fill="#7C8A8E">Vercel managed: servicios separados · EasyBits: dos cajas (siguiente lámina)</text>
  </g>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

    // foco alternado: se levanta el lugar que se nombra
    const focus = (sel, t) => { tl.to(sel, { y: -14, duration: .35, ease: "back.out(2)" }, t); tl.to(sel, { y: 0, duration: .35 }, t + 2.4); };
    focus("#office", 0.5); focus("#bench", 3.3);
    tl.to("#office-items text", { x: 6, duration: .2, stagger: .25, yoyo: true, repeat: 1 }, 0.9);
    tl.to("#bench-items text", { x: 6, duration: .2, stagger: .25, yoyo: true, repeat: 1 }, 3.7);
  
      tl.set({}, {}, 12);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
