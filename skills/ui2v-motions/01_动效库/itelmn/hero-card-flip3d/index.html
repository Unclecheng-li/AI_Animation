<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ecfeff; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #cffafe 0%, #ecfeff 60%);
        perspective: 1600px;
      }
      .card {
        position: absolute; left: 50%; top: 50%; width: 640px; height: 400px;
        margin: -200px 0 0 -320px; transform-style: preserve-3d;
      }
      .face {
        position: absolute; inset: 0; border-radius: 28px; backface-visibility: hidden;
        display: grid; place-items: center;
        box-shadow: 0 28px 70px rgba(8, 145, 178, 0.25);
      }
      .front { background: #fff; border: 1px solid #a5f3fc; }
      .back {
        background: #0e7490; color: #ecfeff; transform: rotateY(180deg);
        font-family: "Segoe UI", sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -0.03em;
      }
      .chip {
        width: 180px; height: 120px; border-radius: 18px; background: linear-gradient(135deg, #22d3ee, #0891b2);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="card" class="clip card" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="face front"><div class="chip"></div></div>
        <div class="face back">READY</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#card", { rotateY: 0, opacity: 0, scale: 0.9 });
      tl.to("#card", { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.2)
        .to("#card", { rotateY: 180, duration: 1.4, ease: "power2.inOut" }, 1.2)
        .to("#card", { y: -12, duration: 1.4, ease: "sine.inOut" }, 2.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
