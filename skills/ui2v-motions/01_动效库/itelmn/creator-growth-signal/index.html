</style></head><body><div id="stage" data-composition-id="growth-signal" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080"><section id="growth-signal-scene" class="clip" data-start="0" data-duration="8" data-track-index="0"><div class="header"><span class="eyebrow">DATA / IN FOCUS</span><span class="tag">SIGNAL — 03</span></div><div class="rule"></div><div class="growth-title"><h1 class="title"><span class="reveal"><span id="g-title">把变化，看清楚</span></span></h1></div><div class="growth-badge"><i></i> GROWTH OBSERVED</div><div class="growth-main"><div class="metric-label">从起点到终点 · 增长幅度</div><div class="big-num"><span class="plus">+</span><span id="count">0</span><span class="unit">%</span></div><div class="metric-rule"></div><p class="metric-desc" id="metric-desc">40 → 136<span style="display:block">四个阶段，一条清晰的上升轨迹。</span></p></div><div class="growth-divider"></div><div class="chart"><svg viewBox="0 0 954 506"><defs><linearGradient id="chartfill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7ff3f" stop-opacity=".18"/><stop offset="1" stop-color="#d7ff3f" stop-opacity="0"/></linearGradient></defs><g class="chart-grid"><path d="M30 460.5 H916"/><path d="M30 330.5 H916"/><path d="M30 200.5 H916"/><path d="M30 70.5 H916"/></g><g class="bars"><rect class="chart-bar" x="4" y="363" width="52" height="97.5" rx="10"/><rect class="chart-bar" x="284" y="304.5" width="52" height="156" rx="10"/><rect class="chart-bar" x="564" y="197.25" width="52" height="263.25" rx="10"/><rect class="chart-bar" x="844" y="51" width="52" height="409.5" rx="10"/></g><path class="chart-area" d="M30 363 L310 304.5 L590 197.25 L870 51 L870 460.5 L30 460.5 Z"/><path class="chart-line" d="M30 363 L310 304.5 L590 197.25 L870 51"/><circle class="chart-dots d0" cx="30" cy="363" r="8"/><circle class="chart-dots d1" cx="310" cy="304.5" r="8"/><circle class="chart-dots d2" cx="590" cy="197.25" r="8"/><circle class="chart-dots d3" cx="870" cy="51" r="8"/><circle class="chart-ring" cx="870" cy="51" r="24"/></svg><span class="chart-y" style="top:447px">0</span><span class="chart-y" style="top:317px">40</span><span class="chart-y" style="top:187px">80</span><span class="chart-y" style="top:57px">120</span><span class="chart-values v0" style="left:-3px;top:297px">40</span><span class="chart-label" style="left:-3px">阶段一</span><span class="chart-values v1" style="left:277px;top:238.5px">58</span><span class="chart-label" style="left:277px">阶段二</span><span class="chart-values v2" style="left:557px;top:131.25px">91</span><span class="chart-label" style="left:557px">阶段三</span><span class="chart-values v3" style="left:837px;top:-15px">136</span><span class="chart-label" style="left:837px">阶段四</span></div><div class="callout">FINAL / 136</div><div class="data-note">统一纵轴 · 从零起算</div><div class="footer"><span>演示数据 · 非实际统计</span><span class="mono">CHANGE MADE VISIBLE</span></div><div class="progress"></div></section></div><script>
const tl=gsap.timeline({paused:true});
const CONFIG={headline:'把变化，看清楚',values:[40,58,91,136],labels:['阶段一','阶段二','阶段三','阶段四'],accent:'#d7ff3f'};
document.querySelector('#g-title').textContent=CONFIG.headline;document.querySelector('#stage').style.setProperty('--accent',CONFIG.accent);
const maxY=Math.max(160,Math.ceil(Math.max(...CONFIG.values)/40)*40),xs=[30,310,590,870],ys=CONFIG.values.map(v=>460.5-v/maxY*520);
document.querySelector('.chart-line').setAttribute('d',xs.map((x,i)=>(i?'L':'M')+x+' '+ys[i]).join(' '));document.querySelector('.chart-area').setAttribute('d',xs.map((x,i)=>(i?'L':'M')+x+' '+ys[i]).join(' ')+' L870 460.5 L30 460.5 Z');
document.querySelectorAll('.chart-values').forEach((el,i)=>{el.textContent=CONFIG.values[i];el.style.top=(ys[i]-66)+'px'});document.querySelectorAll('.chart-label').forEach((el,i)=>el.textContent=CONFIG.labels[i]);document.querySelectorAll('.chart-y').forEach((el,i)=>el.textContent=i*maxY/4);
document.querySelectorAll('.chart-dots').forEach((el,i)=>el.setAttribute('cy',ys[i]));document.querySelector('.chart-ring').setAttribute('cy',ys[3]);document.querySelectorAll('.chart-bar').forEach((el,i)=>{el.setAttribute('y',ys[i]);el.setAttribute('height',460.5-ys[i])});document.querySelector('.callout').textContent='FINAL / '+CONFIG.values[3];document.querySelector('#metric-desc').firstChild.textContent=CONFIG.values[0]+' → '+CONFIG.values[3];
const growth=Math.round((CONFIG.values[3]/CONFIG.values[0]-1)*100);
tl.fromTo('#g-title',{yPercent:110},{yPercent:0,duration:1,ease:'power4.out'},.1);
tl.fromTo('.growth-main',{y:32,opacity:0},{y:0,opacity:1,duration:.9,ease:'power3.out'},.55);
tl.fromTo('#count',{innerText:0},{innerText:growth,snap:{innerText:1},duration:3.5,ease:'power2.out'},1.2);
tl.fromTo('#count',{scale:.94},{scale:1,duration:3.5,ease:'power2.out'},1.2);
tl.fromTo('.unit',{y:24,opacity:0},{y:0,opacity:1,duration:.6,ease:'power2.out'},3.8);
const p=document.querySelector('.chart-line'),l=p.getTotalLength();p.style.strokeDasharray=l;tl.fromTo(p,{strokeDashoffset:l},{strokeDashoffset:0,duration:3.4,ease:'power1.inOut'},1.15);
tl.fromTo('.chart-area',{opacity:0},{opacity:1,duration:1.2},3.7);
document.querySelectorAll('.chart-bar').forEach((el,i)=>{tl.fromTo(el,{scaleY:0,transformOrigin:'center bottom'},{scaleY:1,duration:.9,ease:'power3.out'},1.25+i*.8)});
document.querySelectorAll('.chart-dots').forEach((el,i)=>tl.fromTo(el,{opacity:0,scale:.2,transformOrigin:'center'},{opacity:1,scale:1,duration:.4,ease:'back.out(1.5)'},1.2+i*1.1));
document.querySelectorAll('.chart-values').forEach((el,i)=>tl.fromTo(el,{y:14,opacity:0},{y:0,opacity:1,duration:.55},1.3+i*1.05));
tl.fromTo('.chart-label,.chart-y',{opacity:0},{opacity:1,duration:.7,stagger:.04},.9);
tl.fromTo('.callout',{y:15,opacity:0},{y:0,opacity:1,duration:.6},4.7);
tl.fromTo('.chart-ring',{scale:.5,opacity:0},{scale:1.8,opacity:.65,duration:.7,ease:'power2.out'},4.65);tl.to('.chart-ring',{scale:2.3,opacity:0,duration:1},5.35);
tl.fromTo('.growth-badge',{opacity:0},{opacity:1,duration:.6},5.1);

tl.fromTo('.progress',{scaleX:0},{scaleX:1,duration:8,ease:'none'},0);
window.__timelines=window.__timelines||{};window.__timelines['growth-signal']=tl;tl.seek(0);
</script></body></html>
