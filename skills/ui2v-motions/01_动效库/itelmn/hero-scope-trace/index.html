<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      .copy {
        position: absolute; left: 140px; top: 300px; color: #e2e8f0;
        font-family: "Segoe UI", sans-serif;
      }
      .eyebrow { color: #22d3ee; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; }
      .title { font-size: 100px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 24px; font-size: 30px; color: #94a3b8; }
      .scope {
        position: absolute; left: 820px; top: 180px; width: 920px; height: 720px;
        border: 2px solid #164e63; background: #04111d; border-radius: 16px; overflow: hidden;
      }
      .grid {
        position: absolute; inset: 0;
        background:
          linear-gradient(rgba(34,211,238,0.08) 1px, transparent 1px) 0 0 / 100% 60px,
          linear-gradient(90deg, rgba(34,211,238,0.05) 1px, transparent 1px) 0 0 / 80px 100%;
      }
      .wave {
        position: absolute; left: 40px; top: 260px; width: 840px; height: 200px;
      }
      .trace {
        fill: none; stroke: #22d3ee; stroke-width: 4;
        stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1400; stroke-dashoffset: 1400;
        filter: drop-shadow(0 0 8px rgba(34,211,238,0.7));
      }
      .beam {
        position: absolute; top: 0; bottom: 0; width: 3px; left: 40px; background: rgba(34,211,238,0.55);
        box-shadow: 0 0 16px rgba(34,211,238,0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Signal · Lab</div>
        <div class="title">Scope Trace</div>
        <div class="sub">Oscilloscope line draws the pulse</div>
      </div>
      <div id="scope" class="clip scope" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="grid"></div>
        <svg class="wave" viewBox="0 0 840 200" preserveAspectRatio="none">
          <path id="trace" class="trace" d="M0,100 C60,100 60,30 120,30 S180,170 240,170 S300,40 360,40 S420,160 480,160 S540,50 600,50 S660,140 720,140 S780,100 840,100" />
        </svg>
        <div class="beam" id="beam"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#scope", { opacity: 0, y: 24 });
      gsap.set("#trace", { strokeDashoffset: 1400 });
      gsap.set("#beam", { x: 0, opacity: 0 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#scope", { opacity: 1, y: 0, duration: 0.55 }, 0.25)
        .to("#beam", { opacity: 1, duration: 0.2 }, 0.7)
        .to("#trace", { strokeDashoffset: 0, duration: 2.6, ease: "none" }, 0.8)
        .to("#beam", { x: 840, duration: 2.6, ease: "none" }, 0.8)
        .to("#beam", { opacity: 0, duration: 0.3 }, 3.4)
        .to("#scope", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
