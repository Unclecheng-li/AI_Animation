<!doctype html><html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"accent","type":"color","label":"Distribution accent","default":"#ffbf69"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--bg:#17152d;--ink:#f3f0ff;--violet:#8a72ff;--muted:#9890b8}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}#clip{position:absolute;inset:0;overflow:hidden}
.aura{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(138,114,255,.25),transparent 38%),radial-gradient(circle at 22% 70%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 26%)}
header{position:absolute;left:90px;right:90px;top:70px;display:flex;justify-content:space-between;align-items:flex-start}
header small{font:700 18px "Courier New",monospace;color:var(--accent);letter-spacing:.14em}header h1{margin:10px 0 0;font:800 60px/.95 Arial,sans-serif;letter-spacing:-.04em}
.sample-count{text-align:right;font:700 18px/1.5 "Courier New",monospace;color:var(--muted)}.sample-count b{display:block;font-size:44px;color:var(--ink)}
#plot{position:absolute;left:120px;top:215px;width:1680px;height:700px;border-left:3px solid #5a5478;border-bottom:3px solid #5a5478}
#plot:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(243,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(243,240,255,.045) 1px,transparent 1px);background-size:70px 70px}
#dots{position:absolute;inset:0}.dot{position:absolute;width:17px;height:17px;border-radius:50%;background:var(--violet);box-shadow:0 0 16px rgba(138,114,255,.45);will-change:transform}.dot:nth-child(6n){background:var(--accent);width:22px;height:22px}
#mean{position:absolute;left:50%;top:34px;bottom:0;width:3px;background:var(--accent);transform-origin:bottom}
#mean:before{content:"μ";position:absolute;left:-22px;top:-42px;font:900 38px Georgia,serif;color:var(--accent)}
.axis-x{position:absolute;left:115px;right:115px;bottom:18px;display:flex;justify-content:space-between;font:700 17px "Courier New",monospace;color:var(--muted)}
.phase{position:absolute;left:90px;bottom:52px;font:800 24px "Courier New",monospace;letter-spacing:.08em;color:var(--accent)}
.explain{position:absolute;right:90px;bottom:49px;width:650px;text-align:right;font:400 25px/1.3 Georgia,serif;color:#cbc5e3}.no-labels header,.no-labels .axis-x,.no-labels .phase,.no-labels .explain,#stage.no-labels #mean:before{opacity:0}
</style></head><body>
<div id="stage" data-composition-id="broll-probability-cloud" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080"><div id="clip" class="clip" data-start="0" data-duration="8" data-track-index="1">
<div class="aura"></div><header><div><small>STATISTICAL MECHANICS / 05</small><h1>PROBABILITY CLOUD</h1></div><div class="sample-count">OBSERVATIONS<b id="count">000</b></div></header>
<main id="plot"><div id="dots"></div><div id="mean"></div><div class="axis-x"><span>−3σ</span><span>−2σ</span><span>−1σ</span><span>μ</span><span>+1σ</span><span>+2σ</span><span>+3σ</span></div></main>
<div class="phase" id="phase">UNRESOLVED SAMPLES</div><div class="explain">Repeated observations reveal a distribution—not a single certain outcome.</div>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const holder=document.getElementById('dots'),counts=[1,2,4,7,11,15,18,15,11,7,4,2,1],items=[];let k=0;
counts.forEach((n,col)=>{for(let row=0;row<n;row++){const el=document.createElement('i');el.className='dot';const sx=70+((k*149)%1510),sy=60+((k*97+k*k*11)%430);const fx=118+col*121,fy=620-row*27;el.style.left=sx+'px';el.style.top=sy+'px';holder.appendChild(el);items.push({el,dx:fx-sx,dy:fy-sy});k++;}});
const tally={v:0};const tl=gsap.timeline({paused:true});
tl.fromTo('header',{y:-35,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);
tl.fromTo('.dot',{scale:0,autoAlpha:0},{scale:1,autoAlpha:.78,duration:.4,stagger:{each:.004,from:'center'},ease:'back.out(1.6)'},.2);
tl.fromTo('#mean',{scaleY:0,autoAlpha:0},{scaleY:1,autoAlpha:.28,duration:.55,ease:'power2.out'},.5);
tl.to('.dot:nth-child(3n)',{scale:.82,duration:.4,yoyo:true,repeat:2,ease:'sine.inOut'},.8);
items.forEach((o,i)=>tl.to(o.el,{x:o.dx,y:o.dy,autoAlpha:1,duration:2.35+((i%6)*.06),ease:'power3.inOut'},2.05+((i%13)*.012)));
tl.to(tally,{v:98,duration:2.7,ease:'power2.inOut',onUpdate:()=>document.getElementById('count').textContent=Math.round(tally.v).toString().padStart(3,'0')},2.05);
tl.set('#phase',{textContent:'DISTRIBUTION EMERGES'},3.65);
tl.to('#mean',{autoAlpha:1,duration:.45,ease:'power2.out'},4.75);
tl.to('.dot:nth-child(6n)',{scale:1.28,duration:.42,yoyo:true,repeat:1,ease:'sine.inOut'},5.15);
tl.set('#phase',{textContent:'MEAN LOCKED / μ'},5.55);
tl.to('#plot',{scale:1.012,duration:.8,ease:'sine.inOut'},6.45);
tl.to('#clip',{autoAlpha:0,duration:.34,ease:'power2.in'},7.62);
tl.seek(0);window.__timelines['broll-probability-cloud']=tl;
</script></body></html>
