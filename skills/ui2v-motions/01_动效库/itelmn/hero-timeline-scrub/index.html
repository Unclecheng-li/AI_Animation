<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0a09; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0c0a09;
      }
      .copy {
        position: absolute; left: 140px; top: 160px; color: #fafaf9;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #fb7185; margin-bottom: 18px; font-weight: 600;
      }
      .title { font-size: 84px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 20px; font-size: 28px; color: #a8a29e; }
      .timeline {
        position: absolute; left: 140px; right: 140px; top: 420px; height: 320px;
        background: #1c1917; border-radius: 24px; border: 1px solid #292524;
        padding: 40px 48px; overflow: hidden;
      }
      .ruler {
        display: flex; justify-content: space-between;
        font-family: "Segoe UI", sans-serif; font-size: 20px; color: #78716c; margin-bottom: 28px;
      }
      .track {
        position: relative; height: 72px; background: #292524; border-radius: 14px; overflow: hidden;
      }
      .clip-a {
        position: absolute; left: 4%; top: 10px; bottom: 10px; width: 28%;
        background: #57534c; border-radius: 10px;
      }
      .clip-b {
        position: absolute; left: 34%; top: 10px; bottom: 10px; width: 36%;
        background: #fb7185; border-radius: 10px;
      }
      .clip-c {
        position: absolute; left: 72%; top: 10px; bottom: 10px; width: 22%;
        background: #57534c; border-radius: 10px;
      }
      .head {
        position: absolute; top: 88px; bottom: 40px; left: 4%; width: 3px; background: #fafaf9;
        box-shadow: 0 0 16px rgba(250, 250, 249, 0.5);
      }
      .head::before {
        content: ""; position: absolute; top: -12px; left: -8px;
        border-left: 10px solid transparent; border-right: 10px solid transparent;
        border-top: 14px solid #fafaf9;
      }
      .time {
        position: absolute; right: 48px; top: 36px;
        font-family: Consolas, "Courier New", monospace; font-size: 28px; color: #fb7185;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Editor · Scrub</div>
        <div class="title">Timeline Scrub</div>
        <div class="sub">Playhead crosses the active clip on an edit timeline.</div>
      </div>
      <div id="tlui" class="clip timeline" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="time" id="clock">0:00.0</div>
        <div class="ruler">
          <span>0:00</span><span>0:01</span><span>0:02</span><span>0:03</span><span>0:04</span>
        </div>
        <div class="track">
          <div class="clip-a"></div>
          <div class="clip-b" id="active"></div>
          <div class="clip-c"></div>
        </div>
        <div class="head" id="head"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const clock = document.getElementById("clock");
      const state = { t: 0 };
      const paint = () => {
        const t = state.t;
        const sec = Math.floor(t);
        const tenth = Math.floor((t % 1) * 10);
        clock.textContent = "0:0" + sec + "." + tenth;
        document.getElementById("head").style.left = (4 + t / 4.5 * 92) + "%";
      };
      gsap.set("#copy", { opacity: 0, y: 14 });
      gsap.set("#tlui", { opacity: 0, y: 24 });
      paint();
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to("#tlui", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to(state, { t: 4.2, duration: 2.8, ease: "none", onUpdate: paint }, 1.0)
        .to("#active", { filter: "brightness(1.25)", duration: 0.35 }, 2.0)
        .to("#active", { filter: "brightness(1)", duration: 0.45 }, 2.5)
        .to("#tlui", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
