<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
      /* recetas CSS de motion-anything (Animate.css): seek-safe. Sobre SVG: transform-box fill-box. */
      @keyframes tada {
  from {
    transform: scale3d(1, 1, 1);
  }

  10%,
  20% {
    transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
  }

  30%,
  50%,
  70%,
  90% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
  }

  40%,
  60%,
  80% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes jello {
  from,
  11.1%,
  to {
    transform: translate3d(0, 0, 0);
  }

  22.2% {
    transform: skewX(-12.5deg) skewY(-12.5deg);
  }

  33.3% {
    transform: skewX(6.25deg) skewY(6.25deg);
  }

  44.4% {
    transform: skewX(-3.125deg) skewY(-3.125deg);
  }

  55.5% {
    transform: skewX(1.5625deg) skewY(1.5625deg);
  }

  66.6% {
    transform: skewX(-0.78125deg) skewY(-0.78125deg);
  }

  77.7% {
    transform: skewX(0.390625deg) skewY(0.390625deg);
  }

  88.8% {
    transform: skewX(-0.1953125deg) skewY(-0.1953125deg);
  }
}
@keyframes bounce {
  from,
  20%,
  53%,
  to {
    animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0);
  }

  40%,
  43% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -30px, 0) scaleY(1.1);
  }

  70% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -15px, 0) scaleY(1.05);
  }

  80% {
    transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0) scaleY(0.95);
  }

  90% {
    transform: translate3d(0, -4px, 0) scaleY(1.02);
  }
}
@keyframes headShake {
  0% {
    transform: translateX(0);
  }

  6.5% {
    transform: translateX(-6px) rotateY(-9deg);
  }

  18.5% {
    transform: translateX(5px) rotateY(7deg);
  }

  31.5% {
    transform: translateX(-3px) rotateY(-5deg);
  }

  43.5% {
    transform: translateX(2px) rotateY(3deg);
  }

  50% {
    transform: translateX(0);
  }
}
@keyframes rubberBand {
  from {
    transform: scale3d(1, 1, 1);
  }

  30% {
    transform: scale3d(1.25, 0.75, 1);
  }

  40% {
    transform: scale3d(0.75, 1.25, 1);
  }

  50% {
    transform: scale3d(1.15, 0.85, 1);
  }

  65% {
    transform: scale3d(0.95, 1.05, 1);
  }

  75% {
    transform: scale3d(1.05, 0.95, 1);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes swing {
  20% {
    transform: rotate3d(0, 0, 1, 15deg);
  }

  40% {
    transform: rotate3d(0, 0, 1, -10deg);
  }

  60% {
    transform: rotate3d(0, 0, 1, 5deg);
  }

  80% {
    transform: rotate3d(0, 0, 1, -5deg);
  }

  to {
    transform: rotate3d(0, 0, 1, 0deg);
  }
}
@keyframes wobble {
  from {
    transform: translate3d(0, 0, 0);
  }

  15% {
    transform: translate3d(-25%, 0, 0) rotate3d(0, 0, 1, -5deg);
  }

  30% {
    transform: translate3d(20%, 0, 0) rotate3d(0, 0, 1, 3deg);
  }

  45% {
    transform: translate3d(-15%, 0, 0) rotate3d(0, 0, 1, -3deg);
  }

  60% {
    transform: translate3d(10%, 0, 0) rotate3d(0, 0, 1, 2deg);
  }

  75% {
    transform: translate3d(-5%, 0, 0) rotate3d(0, 0, 1, -1deg);
  }

  to {
    transform: translate3d(0, 0, 0);
  }
}

      .anim { transform-box: fill-box; transform-origin: 50% 50%; animation-fill-mode: both; animation-timing-function: ease; }
      
    #left-ghost { animation: jello 1.2s .4s both, headshake 1s 7.2s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #secrets { animation: heartbeat 1.3s 7.2s both; transform-box: fill-box; transform-origin: 50% 50%; }
    #net { animation: shakex .8s 9.4s both; transform-box: fill-box; transform-origin: 50% 50%; }
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="12">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern></defs>
  <rect width="1920" height="1080" fill="#0E1317"/><rect width="1920" height="1080" fill="url(#dots)"/>

  <g id="title">
    <text x="960" y="110" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">Qué cruza la frontera y qué no</text>
    <text x="960" y="160" text-anchor="middle" font-size="28" fill="#85DDCB">una llamada de tool: va un comando, vuelve un resultado</text>
  </g>

  <!-- frontera vertical -->
  <g id="border">
    <line x1="960" y1="230" x2="960" y2="800" stroke="#F2F5F4" stroke-width="6" stroke-dasharray="18 14"/>
    <rect x="880" y="230" width="160" height="44" rx="8" fill="#F2F5F4"/>
    <text x="960" y="261" text-anchor="middle" font-size="22" font-weight="900" fill="#0E1317">frontera</text>
  </g>

  <!-- lado runtime -->
  <g id="left">
    <text x="520" y="320" text-anchor="middle" font-size="30" font-weight="900" fill="#85DDCB">app runtime</text>
    <g id="left-ghost"><image xlink:href="assets/ghosty.png" x="200" y="380" width="180" height="210" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="secrets">
      <rect x="420" y="620" width="380" height="120" rx="12" fill="#0E1317" transform="translate(10,10)"/>
      <rect x="420" y="620" width="380" height="120" rx="12" fill="#141C21" stroke="#85DDCB" stroke-width="4"/>
      <text x="610" y="668" text-anchor="middle" font-size="24" font-weight="900" fill="#F2F5F4">🔑 ANTHROPIC_API_KEY</text>
      <text x="610" y="708" text-anchor="middle" font-size="24" font-weight="900" fill="#F2F5F4">🔑 tokens de MCP</text>
    </g>
    <text x="610" y="790" text-anchor="middle" font-size="24" fill="#85DDCB" font-weight="900">se quedan de este lado</text>
  </g>

  <!-- lado sandbox -->
  <g id="right">
    <text x="1400" y="320" text-anchor="middle" font-size="30" font-weight="900" fill="#85DDCB">sandbox</text>
    <rect x="1120" y="360" width="560" height="260" rx="12" fill="#0E1317" transform="translate(10,10)"/>
    <rect x="1120" y="360" width="560" height="260" rx="12" fill="#141C21" stroke="#F2F5F4" stroke-width="4"/>
    <g id="shell" font-size="26" fill="#F2F5F4">
      <text x="1150" y="410" fill="#85DDCB">/workspace $</text>
      <text x="1150" y="460">python analysis/run.py</text>
      <text x="1150" y="510" fill="#8DCF6E">promedio: 7.4</text>
      <text x="1150" y="560" fill="#7C8A8E">exit 0</text>
    </g>
    <g id="net">
      <line x1="1690" y1="490" x2="1780" y2="490" stroke="#7C8A8E" stroke-width="6" stroke-dasharray="12 12"/>
      <circle cx="1820" cy="490" r="34" fill="#0E1317" stroke="#F2F5F4" stroke-width="4"/>
      <line x1="1796" y1="466" x2="1844" y2="514" stroke="#F2F5F4" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="1400" y="700" text-anchor="middle" font-size="24" fill="#7C8A8E">si necesita internet, tú abres la puerta (allow-all)</text>
    <text x="1400" y="740" text-anchor="middle" font-size="24" fill="#7C8A8E">o la dejas cerrada (deny-all), como el ejemplo oficial</text>
  </g>

  <!-- flechas que cruzan -->
  <g id="arrow-cmd" fill="none" stroke="#F2F5F4" stroke-width="7" stroke-linecap="round">
    <path d="M400,440 C700,440 800,430 1100,430"/>
    <polygon points="1110,430 1086,416 1086,444" fill="#F2F5F4" stroke="none"/>
  </g>
  <rect x="640" y="380" width="380" height="40" rx="8" fill="#0E1317"/>
  <text x="830" y="408" text-anchor="middle" font-size="22" font-weight="900" fill="#F2F5F4">va: el comando (bash, write_file)</text>

  <g id="arrow-res" fill="none" stroke="#8DCF6E" stroke-width="7" stroke-linecap="round">
    <path d="M1100,560 C800,560 700,570 400,570"/>
    <polygon points="390,570 414,556 414,584" fill="#8DCF6E" stroke="none"/>
  </g>
  <rect x="600" y="585" width="460" height="40" rx="8" fill="#0E1317"/>
  <text x="830" y="613" text-anchor="middle" font-size="22" font-weight="900" fill="#8DCF6E">vuelve: exitCode + stdout + stderr</text>

  <g id="footer">
    <text x="960" y="900" text-anchor="middle" font-size="26" fill="#F2F5F4">el modelo nunca toca una llave: pide, y el runtime ejecuta por él del lado seguro</text>
  </g>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

    draw("#arrow-cmd path", 1.5, .6);
    tl.from("#shell text:nth-of-type(2), #shell text:nth-of-type(3), #shell text:nth-of-type(4)", { opacity: 0, duration: .15, stagger: .6, immediateRender: false }, 2.3);
    draw("#arrow-res path", 4.6, .6);
    tl.to("#border line", { strokeDashoffset: -64, duration: 2, ease: "none", repeat: 4 }, 0);
  
      tl.set({}, {}, 12);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
