<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Tuckman&#39;s Team Development Model"},
  {"id":"stages","type":"string","label":"Stages (JSON)","default":"[{\"name\":\"Forming\",\"desc\":\"Team members meet and learn about the project. Roles and responsibilities are unclear. People are polite and positive but work independently. The leader provides clear direction and structure.\",\"x\":8,\"y\":68},{\"name\":\"Storming\",\"desc\":\"Conflict arises as team members push against boundaries. Different working styles clash. Frustration and disagreement are common as the team navigates power dynamics and competing ideas.\",\"x\":25,\"y\":45},{\"name\":\"Norming\",\"desc\":\"The team resolves differences and establishes cohesion. Roles are accepted, processes are agreed upon, and collaboration becomes smoother. Commitment to team goals strengthens.\",\"x\":50,\"y\":38},{\"name\":\"Performing\",\"desc\":\"The team operates at peak effectiveness. Members work autonomously, trust is high, and the focus is on achieving goals. The leader can delegate and the team is largely self-managing.\",\"x\":75,\"y\":42}]"},
  {"id":"xAxisLabel","type":"string","label":"X-Axis Label","default":"Time"},
  {"id":"yAxisLabel","type":"string","label":"Y-Axis Label","default":"Effectiveness"},
  {"id":"curveColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"dotColor","type":"color","label":"Active Color","default":"#0aa0d8"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStage","type":"number","label":"Seconds per Stage","default":5.5,"min":2,"max":10,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #285f9f;
      --active: #0aa0d8;
      --bg: #f5f2ea;
      --ink: #16202a;
      --muted: #62707d;
      --line: rgba(40, 95, 159, 0.26);
      --base-plate: url("v2-base-blue.png");
    }
    body {
      width: 1920px;
      height: 1080px;
      background-color: var(--bg);
      background-image: var(--base-plate);
      background-size: 1920px 1080px;
      background-position: 0 0;
      background-repeat: no-repeat;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      overflow: hidden;
      position: relative;
      color: var(--ink);
    }
    #tuckman-model {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    #el-fade {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      z-index: 99;
      pointer-events: none;
    }
    .top-rule {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 12px;
      background: var(--primary);
    }
    .main-title {
      position: absolute;
      left: 78px;
      top: 54px;
      width: 980px;
      font-size: 43px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--ink);
      opacity: 0;
    }
    .subtitle {
      position: absolute;
      left: 82px;
      top: 112px;
      font-size: 18px;
      line-height: 1.45;
      color: #87919b;
      opacity: 0;
    }
    .model {
      position: absolute;
      left: 118px;
      top: 150px;
      width: 1508px;
      height: 690px;
      opacity: 0;
    }
    .axis {
      position: absolute;
      left: 0;
      top: 0;
      width: 1040px;
      height: 610px;
    }
    .axis-line-x,
    .axis-line-y {
      position: absolute;
      background: rgba(24, 34, 44, 0.24);
      transform-origin: left center;
    }
    .axis-line-x {
      left: 24px;
      bottom: 40px;
      width: 1040px;
      height: 2px;
    }
    .axis-line-y {
      left: 24px;
      top: 20px;
      width: 2px;
      height: 548px;
      transform-origin: bottom center;
    }
    .arrow-x,
    .arrow-y {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0.5;
    }
    .arrow-x {
      right: -48px;
      bottom: 35px;
      border-left: 10px solid rgba(24, 34, 44, 0.38);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }
    .arrow-y {
      left: 19px;
      top: 12px;
      border-bottom: 10px solid rgba(24, 34, 44, 0.38);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }
    .axis-label {
      position: absolute;
      color: #25313c;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .x-label {
      left: 532px;
      bottom: 4px;
      transform: translateX(-50%);
    }
    .y-label {
      left: -42px;
      top: 300px;
      transform: rotate(-90deg) translateX(-50%);
      transform-origin: left top;
    }
    .ghost-arrow {
      position: absolute;
      left: 206px;
      top: 78px;
      width: 360px;
      height: 170px;
      opacity: 0.42;
    }
    .ghost-arrow path {
      stroke: rgba(24, 34, 44, 0.08);
      stroke-width: 28;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .stage-layer {
      position: absolute;
      left: 80px;
      top: 28px;
      width: 1000px;
      height: 520px;
    }
    .stage {
      position: absolute;
      width: 250px;
      min-height: 172px;
      transform: translateY(18px);
      opacity: 0;
    }
    .stage-circle {
      position: absolute;
      left: 50%;
      top: 0;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      border: 2px solid rgba(0,0,0,0.18);
      box-shadow: 14px 18px 24px rgba(20, 28, 36, 0.18);
      display: grid;
      place-items: center;
      color: #fff;
      text-align: center;
      font-size: 18px;
      line-height: 1.12;
      font-weight: 700;
    }
    .stage-index {
      display: block;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.75;
      margin-bottom: 4px;
    }
    .stage-bar {
      position: absolute;
      left: 0;
      top: 126px;
      width: 224px;
      height: 46px;
      background: rgba(40, 95, 159, 0.12);
      border-left: 0;
      display: flex;
      align-items: center;
      padding-left: 58px;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      overflow: hidden;
    }
    .stage-icon {
      position: absolute;
      left: 0;
      top: 0;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.18);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }
    .stage-note {
      position: absolute;
      left: 14px;
      top: 176px;
      width: 210px;
      font-size: 15px;
      line-height: 1.28;
      color: #1e2a34;
    }
    .stage-shadow {
      position: absolute;
      left: 28px;
      top: 102px;
      width: 122px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.34) 0%, rgba(0,0,0,0.14) 42%, rgba(0,0,0,0) 74%);
      filter: blur(2px);
    }
    .stage-0 { left: 12px; top: 326px; }
    .stage-1 { left: 270px; top: 244px; }
    .stage-2 { left: 540px; top: 160px; }
    .stage-3 { left: 812px; top: 76px; }
    .stage-4 { left: 774px; top: 330px; }
    .stage-4 .stage-circle {
      width: 94px;
      height: 94px;
      font-size: 16px;
      box-shadow: 10px 14px 20px rgba(20, 28, 36, 0.15);
    }
    .stage-4 .stage-bar {
      top: 108px;
      height: 38px;
      font-size: 16px;
      opacity: 0.9;
    }
    .stage-4 .stage-icon {
      width: 38px;
      height: 38px;
      font-size: 24px;
    }
    .stage-4 .stage-note { top: 160px; font-size: 15px; }
    .insight {
      position: absolute;
      right: -96px;
      top: 170px;
      width: 410px;
      min-height: 390px;
      background: #ffffff;
      border-top: 8px solid var(--active);
      box-shadow: 0 24px 46px rgba(26, 39, 52, 0.14);
      padding: 48px 46px 36px 52px;
      opacity: 0;
      transform: translateX(18px);
    }
    .insight-kicker {
      font-size: 15px;
      line-height: 1;
      font-weight: 800;
      color: var(--active);
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 20px;
    }
    .insight-name {
      font-size: 38px;
      line-height: 1.04;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 22px;
    }
    .insight-desc {
      font-size: 17px;
      line-height: 1.5;
      color: #26313b;
    }
    .active-caption {
      position: absolute;
      right: -96px;
      top: 610px;
      width: 410px;
      height: 116px;
      background: #d93b62;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 38px;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 800;
      opacity: 0;
    }
    .insight-panel {
      position: absolute;
      inset: 0;
      opacity: 0;
    }
    .insight-panel:first-child {
      position: relative;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="tuckman-model" data-composition-id="tuckman-model" data-width="1920" data-height="1080" data-duration="23" data-start="0">
    <div id="el-fade"></div>
    <div class="top-rule"></div>
    <div class="main-title" id="mainTitle"></div>
    <div class="subtitle">Effectiveness rises as the team moves from orientation, through productive tension, into shared rhythm.</div>
    <div class="model" id="model">
      <div class="axis">
        <div class="axis-line-x"></div>
        <div class="axis-line-y"></div>
        <div class="arrow-x"></div>
        <div class="arrow-y"></div>
        <div class="axis-label x-label" id="xLabel"></div>
        <div class="axis-label y-label" id="yLabel"></div>
        <svg class="ghost-arrow" viewBox="0 0 360 170" aria-hidden="true">
          <path d="M18 134 L152 58 L104 42 M152 58 L132 146"></path>
          <path d="M218 58 L286 28 L272 82"></path>
        </svg>
      </div>
      <div class="stage-layer" id="stageLayer"></div>
      <div class="insight" id="insight"><div id="insightInner"></div></div>
      <div class="active-caption" id="activeCaption">Teams do not skip stages. They get better by managing the stage they are in.</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var stages = JSON.parse(vars.stages || '[]');
      var primary = vars.curveColor || '#285f9f';
      var activeColor = vars.dotColor || '#0aa0d8';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var durPer = Number(vars.durationPerStage) || 5.5;
      var palette = ['#0aa0d8', '#254f82', '#12bfa5', '#6554b8', '#d93b62'];
      var notes = {
        'Forming': 'Clarity, structure, and shared expectations.',
        'Storming': 'Turn tension into useful decisions.',
        'Norming': 'Trust and repeatable collaboration.',
        'Performing': 'Delegate and keep outcomes visible.',
        'Adjourning': 'Close the work, capture lessons, and make the transition deliberate.'
      };
      var root = document.documentElement;
      root.style.setProperty('--primary', primary);
      root.style.setProperty('--active', activeColor);
      root.style.setProperty('--bg', bgColor);
      root.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');
      document.getElementById('mainTitle').textContent = vars.title || "Tuckman's Team Development Model";
      document.getElementById('xLabel').textContent = vars.xAxisLabel || 'Time';
      document.getElementById('yLabel').textContent = vars.yAxisLabel || 'Effectiveness';

      var layer = document.getElementById('stageLayer');
      var inner = document.getElementById('insightInner');
      var stageEls = [];
      var circleEls = [];
      var barEls = [];
      var panelEls = [];

      stages.forEach(function(stage, i) {
        var color = palette[i % palette.length];
        var el = document.createElement('div');
        el.className = 'stage stage-' + i;
        el.innerHTML =
          '<div class="stage-shadow"></div>' +
          '<div class="stage-circle"><div><span class="stage-index">0' + (i + 1) + '</span>' + stage.name + '</div></div>' +
          '<div class="stage-bar"><div class="stage-icon">&#8599;</div><span>' + stage.name + '</span></div>' +
          '<div class="stage-note">' + (stage.short || notes[stage.name] || stage.desc) + '</div>';
        layer.appendChild(el);
        var circle = el.querySelector('.stage-circle');
        var bar = el.querySelector('.stage-bar');
        circle.style.backgroundColor = color;
        bar.style.backgroundColor = color;
        stageEls.push(el);
        circleEls.push(circle);
        barEls.push(bar);

        var panel = document.createElement('div');
        panel.className = 'insight-panel';
        panel.innerHTML =
          '<div class="insight-kicker">Stage ' + (i + 1) + '</div>' +
          '<div class="insight-name">' + stage.name + '</div>' +
          '<div class="insight-desc">' + stage.desc + '</div>';
        if (i === 0) {
          panel.style.position = 'relative';
          panel.style.opacity = '1';
        }
        inner.appendChild(panel);
        panelEls.push(panel);
      });

      gsap.set(circleEls, { scale: 0.92, opacity: 0.92 });
      gsap.set(barEls, { filter: 'saturate(0.78)', opacity: 0.82 });
      gsap.set(circleEls[0], { scale: 1.08, opacity: 1, boxShadow: '0 18px 34px rgba(20,28,36,0.22), 0 0 0 10px ' + activeColor + '22' });
      gsap.set(barEls[0], { opacity: 1, filter: 'saturate(1)' });
      for (var p = 1; p < panelEls.length; p++) gsap.set(panelEls[p], { opacity: 0 });

      var TOTAL = stages.length * durPer + 1;
      var tl = gsap.timeline({ paused: true });
      tl.to('.main-title', { opacity: 1, y: -8, duration: 0.5, ease: 'power2.out' }, 0);
      tl.to('.subtitle', { opacity: 1, duration: 0.45 }, 0.15);
      tl.to('#model', { opacity: 1, duration: 0.45 }, 0.35);
      tl.from('.axis-line-x', { scaleX: 0, duration: 0.65, ease: 'power2.out' }, 0.5);
      tl.from('.axis-line-y', { scaleY: 0, duration: 0.65, ease: 'power2.out' }, 0.55);
      tl.from('.ghost-arrow path', { opacity: 0, scale: 0.92, transformOrigin: '50% 50%', duration: 0.6, stagger: 0.08 }, 0.7);
      tl.to(stageEls, { opacity: 1, y: 0, duration: 0.48, stagger: 0.12, ease: 'power2.out' }, 0.9);
      tl.to('#insight', { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 1.25);
      tl.to('#activeCaption', { opacity: 1, y: -8, duration: 0.45, ease: 'power2.out' }, 1.55);

      for (var i = 1; i < stages.length; i++) {
        (function(idx) {
          var t = idx * durPer + 0.45;
          var prev = idx - 1;
          var activeStageColor = palette[idx % palette.length];
          tl.to(panelEls[prev], { opacity: 0, duration: 0.22, overwrite: 'auto' }, t);
          tl.to(panelEls[idx], { opacity: 1, duration: 0.38, overwrite: 'auto' }, t + 0.16);
          tl.to(circleEls[prev], { scale: 0.92, boxShadow: '14px 18px 24px rgba(20,28,36,0.18)', duration: 0.28, overwrite: 'auto' }, t);
          tl.to(barEls[prev], { opacity: 0.82, filter: 'saturate(0.78)', duration: 0.28, overwrite: 'auto' }, t);
          tl.to(circleEls[idx], { scale: 1.08, boxShadow: '0 18px 34px rgba(20,28,36,0.22), 0 0 0 10px ' + activeStageColor + '22', duration: 0.32, ease: 'back.out(1.6)', overwrite: 'auto' }, t + 0.05);
          tl.to(barEls[idx], { opacity: 1, filter: 'saturate(1)', duration: 0.28, overwrite: 'auto' }, t + 0.05);
          tl.to('#insight', { scale: 0.98, duration: 0.12, overwrite: 'auto' }, t + 0.05);
          tl.to('#insight', { scale: 1, duration: 0.35, ease: 'back.out(1.3)', overwrite: 'auto' }, t + 0.17);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.getElementById('tuckman-model').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['tuckman-model'] = tl;
    </script>
  </div>
</body>
</html>
