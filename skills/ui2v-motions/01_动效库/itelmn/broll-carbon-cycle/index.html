<!doctype html><html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"carbon","type":"color","label":"Carbon token","default":"#a94730"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--paper:#f3edda;--ink:#27352c;--green:#326a49;--blue:#3f8291;--soil:#8a5c3c}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}#clip{position:absolute;inset:0;overflow:hidden}
.texture{position:absolute;inset:0;background-image:radial-gradient(rgba(39,53,44,.11) .7px,transparent .7px);background-size:11px 11px;opacity:.4}
header{position:absolute;left:88px;right:88px;top:62px;display:flex;justify-content:space-between;align-items:flex-start;z-index:4}header h1{margin:0;font:900 60px/.95 Arial,sans-serif;letter-spacing:-.045em}
header small{font:700 18px "Courier New",monospace;letter-spacing:.14em;color:var(--carbon);padding-top:15px}
#cycle{position:absolute;left:95px;top:160px;width:1730px;height:760px}.path{fill:none;stroke:#6d766d;stroke-width:5;stroke-linecap:round;stroke-dasharray:13 13}.arrow{fill:#6d766d}
.reservoir{filter:drop-shadow(0 14px 0 rgba(39,53,44,.1))}.card{stroke:var(--ink);stroke-width:4}.atmo{fill:#d6e2dd}.forest{fill:#b9d2b2}.ground{fill:#d5b891}.sea{fill:#a8cfda}
.r-title{fill:var(--ink);font:900 27px Arial,sans-serif;text-anchor:middle}.r-sub{fill:#405047;font:700 16px "Courier New",monospace;letter-spacing:.06em;text-anchor:middle}
.cloud{fill:#fffdf4;stroke:var(--ink);stroke-width:3}.tree{fill:var(--green);stroke:var(--ink);stroke-width:3}.trunk{fill:var(--soil)}.soil-line{stroke:var(--soil);stroke-width:12}.wave{fill:none;stroke:var(--blue);stroke-width:8;stroke-linecap:round}
.token{fill:var(--carbon);stroke:#fffdf4;stroke-width:4;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--carbon) 45%,transparent))}
#center{fill:var(--ink)}#center-ring{fill:none;stroke:var(--carbon);stroke-width:5}.center-c{fill:var(--paper);font:900 100px Georgia,serif;text-anchor:middle}.exchange{fill:var(--ink);font:800 16px "Courier New",monospace;letter-spacing:.06em;text-anchor:middle}
.footer{position:absolute;left:88px;right:88px;bottom:52px;display:flex;justify-content:space-between;border-top:2px solid #8b9289;padding-top:15px;font:700 17px "Courier New",monospace;letter-spacing:.07em;color:#59665d}.footer b{color:var(--carbon)}
.no-labels header,.no-labels .r-title,.no-labels .r-sub,.no-labels .exchange,.no-labels .footer{opacity:0}
</style></head><body>
<div id="stage" data-composition-id="broll-carbon-cycle" data-start="0" data-duration="9" data-fps="30" data-width="1920" data-height="1080"><div id="clip" class="clip" data-start="0" data-duration="9" data-track-index="1"><div class="texture"></div>
<header><h1>CARBON MOVES BETWEEN RESERVOIRS</h1><small>EARTH SYSTEMS / CARBON CYCLE</small></header>
<svg id="cycle" viewBox="0 0 1730 760" aria-label="Carbon exchange between atmosphere forest soil and ocean">
<path id="p1" class="path" d="M780 135 C560 80 390 135 345 250"/><path class="arrow" d="M340 258 l-5 -38 34 17 z"/><text class="exchange" x="540" y="112">PHOTOSYNTHESIS</text>
<path id="p2" class="path" d="M315 385 C300 505 420 595 620 610"/><path class="arrow" d="M628 611 l-35 17 7 -37 z"/><text class="exchange" x="375" y="525">DECOMPOSITION</text>
<path id="p3" class="path" d="M800 630 C1040 690 1280 625 1375 495"/><path class="arrow" d="M1380 486 l-7 38 -31 -23 z"/><text class="exchange" x="1090" y="672">DISSOLVED CARBON</text>
<path id="p4" class="path" d="M1410 350 C1420 205 1230 105 995 125"/><path class="arrow" d="M985 126 l35 -18 -6 39 z"/><text class="exchange" x="1290" y="158">OCEAN–AIR EXCHANGE</text>
<g class="reservoir" id="atmosphere"><rect class="card atmo" x="720" y="40" width="310" height="180" rx="34"/><circle class="cloud" cx="810" cy="118" r="38"/><circle class="cloud" cx="850" cy="98" r="49"/><circle class="cloud" cx="900" cy="120" r="42"/><rect class="cloud" x="775" y="118" width="164" height="42" rx="20"/><text class="r-title" x="875" y="187">ATMOSPHERE</text></g>
<g class="reservoir" id="forest"><rect class="card forest" x="80" y="250" width="360" height="250" rx="34"/><rect class="trunk" x="242" y="335" width="34" height="86"/><path class="tree" d="M259 285 l-82 118 h164 z"/><path class="tree" d="M259 245 l-65 105 h130 z"/><text class="r-title" x="260" y="464">FOREST</text><text class="r-sub" x="260" y="490">LIVING BIOMASS</text></g>
<g class="reservoir" id="soil"><rect class="card ground" x="620" y="545" width="390" height="175" rx="34"/><line class="soil-line" x1="670" y1="610" x2="960" y2="610"/><line class="soil-line" x1="700" y1="645" x2="925" y2="645"/><text class="r-title" x="815" y="690">SOIL</text></g>
<g class="reservoir" id="ocean"><rect class="card sea" x="1290" y="270" width="360" height="250" rx="34"/><path class="wave" d="M1335 350 q45 -38 90 0 t90 0 t90 0 M1335 395 q45 -38 90 0 t90 0 t90 0"/><text class="r-title" x="1470" y="474">OCEAN</text><text class="r-sub" x="1470" y="500">DISSOLVED RESERVOIR</text></g>
<circle id="center-ring" cx="875" cy="380" r="120"/><circle id="center" cx="875" cy="380" r="92"/><text class="center-c" x="875" y="412">C</text>
<g id="t1" transform="translate(780 135)"><circle class="token" r="19"/></g><g id="t2" transform="translate(315 385)"><circle class="token" r="19"/></g><g id="t3" transform="translate(800 630)"><circle class="token" r="19"/></g><g id="t4" transform="translate(1410 350)"><circle class="token" r="19"/></g>
</svg>
<div class="footer"><span>RESERVOIRS EXCHANGE CARBON AT DIFFERENT RATES</span><span>ACTIVE PATH <b id="active">ATMOSPHERE → FOREST</b></span></div>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const paths=['p1','p2','p3','p4'].map(id=>document.getElementById(id)),tokens=['t1','t2','t3','t4'].map(id=>document.getElementById(id)),names=['ATMOSPHERE → FOREST','FOREST → SOIL','SOIL → OCEAN','OCEAN → ATMOSPHERE'];const drivers=paths.map(()=>({p:0}));const tl=gsap.timeline({paused:true});
function mover(i){return()=>{const p=paths[i].getPointAtLength(drivers[i].p*paths[i].getTotalLength());tokens[i].setAttribute('transform','translate('+p.x+' '+p.y+')');};}
tl.fromTo('header',{y:-38,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);
tl.fromTo('.reservoir',{scale:.55,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.55,stagger:.12,ease:'back.out(1.5)'},.2);
paths.forEach((p,i)=>{const l=p.getTotalLength();p.setAttribute('stroke-dasharray',l);p.setAttribute('stroke-dashoffset',l);tl.to(p,{attr:{'stroke-dashoffset':0},duration:.8,ease:'power2.inOut'},.45+i*.18);tl.fromTo(tokens[i],{autoAlpha:0},{autoAlpha:1,duration:.3,ease:'power2.out'},1.0+i*.18);tl.to(drivers[i],{p:1,duration:2.2,ease:'power1.inOut',onUpdate:mover(i)},1.2+i*1.18);tl.set('#active',{textContent:names[i]},1.2+i*1.18);});
tl.fromTo('#center-ring',{scale:.4,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.7,ease:'power3.out'},1.1);
tl.to('#center-ring',{scale:1.12,opacity:.35,duration:.65,yoyo:true,repeat:6,ease:'sine.inOut'},2);
tl.to('#clip',{autoAlpha:0,duration:.34,ease:'power2.in'},8.62);tl.seek(0);window.__timelines['broll-carbon-cycle']=tl;
</script></body></html>
