<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ecfdf5; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ecfdf5; }
      .copy {
        position: absolute; left: 140px; top: 280px;
        font-family: Georgia, "Times New Roman", serif; color: #064e3b;
      }
      .eyebrow { font-family: "Segoe UI", sans-serif; letter-spacing: 0.28em; text-transform: uppercase; color: #059669; margin-bottom: 18px; font-size: 22px; }
      .title { font-size: 96px; letter-spacing: -0.03em; }
      .sub { margin-top: 22px; font-family: "Segoe UI", sans-serif; font-size: 30px; color: #047857; }
      .compass {
        position: absolute; left: 980px; top: 180px; width: 640px; height: 640px;
        border-radius: 50%; background: #fff; border: 10px solid #065f46;
        box-shadow: 0 24px 50px rgba(6, 78, 59, 0.18);
      }
      .ring {
        position: absolute; inset: 36px; border-radius: 50%; border: 2px dashed #6ee7b7;
      }
      .mark {
        position: absolute; font-family: "Segoe UI", sans-serif; font-weight: 700; color: #065f46; font-size: 28px;
      }
      .n { top: 48px; left: 50%; transform: translateX(-50%); }
      .e { right: 48px; top: 50%; transform: translateY(-50%); }
      .s { bottom: 48px; left: 50%; transform: translateX(-50%); }
      .w { left: 48px; top: 50%; transform: translateY(-50%); }
      .needle {
        position: absolute; left: 50%; top: 50%; width: 24px; height: 280px;
        margin-left: -12px; margin-top: -140px; transform-origin: 50% 50%;
      }
      .needle::before, .needle::after {
        content: ""; position: absolute; left: 0; width: 24px; height: 140px;
      }
      .needle::before {
        top: 0; background: #dc2626;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .needle::after {
        bottom: 0; background: #134e4a;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }
      .hub {
        position: absolute; left: 50%; top: 50%; width: 28px; height: 28px;
        margin: -14px 0 0 -14px; border-radius: 50%; background: #fbbf24; border: 3px solid #065f46;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Orientation</div>
        <div class="title">Compass Spin</div>
        <div class="sub">Needle settles on true north</div>
      </div>
      <div id="compass" class="clip compass" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="ring"></div>
        <div class="mark n">N</div>
        <div class="mark e">E</div>
        <div class="mark s">S</div>
        <div class="mark w">W</div>
        <div class="needle" id="needle"></div>
        <div class="hub"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -18 });
      gsap.set("#compass", { opacity: 0, scale: 0.92 });
      gsap.set("#needle", { rotation: -220 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#compass", { opacity: 1, scale: 1, duration: 0.55 }, 0.3)
        .to("#needle", { rotation: 18, duration: 1.6, ease: "power2.out" }, 0.9)
        .to("#needle", { rotation: -6, duration: 0.55, ease: "power2.inOut" }, 2.5)
        .to("#needle", { rotation: 0, duration: 0.5, ease: "power3.out" }, 3.05)
        .to("#compass", { scale: 1.03, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
