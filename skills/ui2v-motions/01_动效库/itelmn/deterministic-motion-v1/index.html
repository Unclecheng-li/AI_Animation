<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --navy: #0b1633;
        --warm-white: #f4f0e6;
        --teal: #38c6b5;
        --coral: #f06b5b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--navy);
      }

      #choice-branches-s04 {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--navy);
      }

      .paper-field {
        position: absolute;
        inset: 96px;
        border: 2px solid rgba(244, 240, 230, 0.16);
        background:
          linear-gradient(rgba(244, 240, 230, 0.07) 2px, transparent 2px) 0 0 / 100% 240px,
          linear-gradient(90deg, rgba(244, 240, 230, 0.055) 2px, transparent 2px) 0 0 / 222px 100%;
      }

      .paper-field::before,
      .paper-field::after {
        content: "";
        position: absolute;
        background: rgba(244, 240, 230, 0.08);
      }

      .paper-field::before {
        top: 0;
        right: 0;
        width: 222px;
        height: 480px;
      }

      .paper-field::after {
        bottom: 0;
        left: 0;
        width: 444px;
        height: 240px;
      }

      .tree-stage {
        position: absolute;
        inset: 96px;
      }

      svg {
        display: block;
        width: 888px;
        height: 1728px;
        overflow: visible;
      }

      .route-underlay,
      .route-main,
      .route-branch {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .route-underlay {
        stroke: var(--warm-white);
        stroke-width: 30;
        opacity: 0.12;
      }

      .route-main {
        stroke: var(--teal);
        stroke-width: 22;
      }

      .route-branch {
        stroke: var(--teal);
        stroke-width: 14;
      }

      .branch-node {
        fill: var(--coral);
        stroke: var(--navy);
        stroke-width: 10;
        transform-box: fill-box;
        transform-origin: center;
      }

      .leaf-dot {
        fill: var(--warm-white);
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <main
      id="choice-branches-s04"
      data-composition-id="choice-branches-s04"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      aria-label="abstract branching path motion graphic"
    >
      <section id="editorial-grid" class="paper-field clip" data-start="0" data-duration="5" data-track-index="0" data-layout-ignore></section>
      <section id="branching-tree" class="tree-stage clip" data-start="0" data-duration="5" data-track-index="1" data-layout-ignore>
        <svg viewBox="0 0 888 1728" role="img" aria-label="abstract path branching into a tree">
          <path class="route-underlay" d="M444 1570 C444 1400 436 1235 444 1092 C452 944 444 808 444 654" />
          <path id="trunk" class="route-main" d="M444 1570 C444 1400 436 1235 444 1092 C452 944 444 808 444 654" />

          <path id="branch-a" class="route-branch" d="M444 1110 C360 1010 292 912 238 792" />
          <path id="branch-b" class="route-branch" d="M444 1110 C548 1018 610 914 650 786" />
          <path id="branch-c" class="route-branch" d="M444 830 C354 760 324 662 300 548" />
          <path id="branch-d" class="route-branch" d="M444 830 C532 748 562 650 580 528" />

          <path id="twig-a1" class="route-branch" d="M238 792 C158 720 134 632 128 526" />
          <path id="twig-a2" class="route-branch" d="M238 792 C262 698 236 606 216 494" />
          <path id="twig-b1" class="route-branch" d="M650 786 C706 706 720 620 724 506" />
          <path id="twig-b2" class="route-branch" d="M650 786 C630 684 654 592 684 466" />
          <path id="twig-c1" class="route-branch" d="M300 548 C248 470 220 390 208 298" />
          <path id="twig-c2" class="route-branch" d="M300 548 C350 468 374 388 382 286" />
          <path id="twig-d1" class="route-branch" d="M580 528 C536 444 516 360 510 270" />
          <path id="twig-d2" class="route-branch" d="M580 528 C648 458 684 374 706 270" />

          <circle id="node-lower" class="branch-node" cx="444" cy="1110" r="30" />
          <circle id="node-upper" class="branch-node" cx="444" cy="830" r="26" />
          <circle class="branch-node node-mid" cx="238" cy="792" r="22" />
          <circle class="branch-node node-mid" cx="650" cy="786" r="22" />
          <circle class="branch-node node-high" cx="300" cy="548" r="18" />
          <circle class="branch-node node-high" cx="580" cy="528" r="18" />

          <circle class="leaf-dot" cx="128" cy="526" r="11" />
          <circle class="leaf-dot" cx="216" cy="494" r="11" />
          <circle class="leaf-dot" cx="724" cy="506" r="11" />
          <circle class="leaf-dot" cx="684" cy="466" r="11" />
          <circle class="leaf-dot" cx="208" cy="298" r="11" />
          <circle class="leaf-dot" cx="382" cy="286" r="11" />
          <circle class="leaf-dot" cx="510" cy="270" r="11" />
          <circle class="leaf-dot" cx="706" cy="270" r="11" />
        </svg>
      </section>
    </main>

    <script>
      window.__timelines = window.__timelines || {};

      const drawPaths = [
        "#trunk",
        "#branch-a",
        "#branch-b",
        "#branch-c",
        "#branch-d",
        "#twig-a1",
        "#twig-a2",
        "#twig-b1",
        "#twig-b2",
        "#twig-c1",
        "#twig-c2",
        "#twig-d1",
        "#twig-d2"
      ];

      drawPaths.forEach((selector) => {
        const path = document.querySelector(selector);
        const length = path.getTotalLength();
        gsap.set(path, { strokeDasharray: length, strokeDashoffset: length, opacity: 0 });
      });

      gsap.set(".branch-node", { scale: 0, opacity: 0 });
      gsap.set(".leaf-dot", { scale: 0, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      tl.set("#trunk", { opacity: 1 }, 0.2)
        .to("#trunk", { strokeDashoffset: 0, duration: 0.95, ease: "sine.inOut" }, 0.2)
        .to("#node-lower", { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(1.7)" }, 0.98)
        .set(["#branch-a", "#branch-b"], { opacity: 1 }, 1.08)
        .to(["#branch-a", "#branch-b"], { strokeDashoffset: 0, duration: 0.72, stagger: 0.1, ease: "power2.out" }, 1.08)
        .to("#node-upper", { scale: 1, opacity: 1, duration: 0.24, ease: "expo.out" }, 1.58)
        .set(["#branch-c", "#branch-d"], { opacity: 1 }, 1.68)
        .to(["#branch-c", "#branch-d"], { strokeDashoffset: 0, duration: 0.66, stagger: 0.08, ease: "sine.inOut" }, 1.68)
        .to(".node-mid", { scale: 1, opacity: 1, duration: 0.18, stagger: 0.08, ease: "back.out(1.5)" }, 1.74)
        .set(["#twig-a1", "#twig-a2", "#twig-b1", "#twig-b2"], { opacity: 1 }, 2.26)
        .to(["#twig-a1", "#twig-a2", "#twig-b1", "#twig-b2"], { strokeDashoffset: 0, duration: 0.58, stagger: 0.07, ease: "power1.out" }, 2.26)
        .to(".node-high", { scale: 1, opacity: 1, duration: 0.2, stagger: 0.1, ease: "expo.out" }, 2.3)
        .set(["#twig-c1", "#twig-c2", "#twig-d1", "#twig-d2"], { opacity: 1 }, 2.78)
        .to(["#twig-c1", "#twig-c2", "#twig-d1", "#twig-d2"], { strokeDashoffset: 0, duration: 0.6, stagger: 0.08, ease: "sine.inOut" }, 2.78)
        .to(".leaf-dot", { scale: 1, opacity: 0.9, duration: 0.24, stagger: 0.045, ease: "power2.out" }, 3.42)
        .to(".branch-node", { scale: 0.92, duration: 0.16, yoyo: true, repeat: 1, stagger: 0.035, ease: "sine.inOut" }, 3.46);

      window.__timelines["choice-branches-s04"] = tl;
    </script>
  </body>
</html>
