<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>邦多利社区 - 微信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #e5e5e5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1100px;
            height: calc(100vh - 32px);
            max-height: calc(900px - 32px);
            margin-top: 32px;
            display: flex;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15);
        }

        /* ========== 左侧边栏 ========== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: #2e2e2e;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* 个人信息栏 */
        .profile-section {
            padding: 20px 16px 16px;
            background: #2e2e2e;
            border-bottom: 1px solid #3a3a3a;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .profile-avatar {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-status-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #07c160;
            border: 2px solid #2e2e2e;
            border-radius: 50%;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-status {
            font-size: 12px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-icon {
            width: 6px;
            height: 6px;
            background: #07c160;
            border-radius: 50%;
        }

        /* 搜索栏 */
        .search-bar {
            display: flex;
            align-items: center;
            background: #3a3a3a;
            border-radius: 6px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-icon {
            width: 14px;
            height: 14px;
            color: #888;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: #888;
        }

        /* 标签栏 */
        .tab-bar {
            display: flex;
            padding: 12px 16px 0;
            gap: 24px;
            border-bottom: 1px solid #3a3a3a;
        }

        .tab-item {
            font-size: 14px;
            color: #888;
            padding-bottom: 10px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            user-select: none;
        }

        .tab-item:hover {
            color: #ccc;
        }

        .tab-item.active {
            color: #fff;
            font-weight: 500;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #07c160;
            border-radius: 1px;
        }

        /* 群组列表 */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .chat-item:hover {
            background: #3a3a3a;
        }

        .chat-item.active {
            background: #3a3a3a;
        }

        .chat-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: #07c160;
            border-radius: 0 2px 2px 0;
        }

        .chat-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .unread-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: #fa5151;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #2e2e2e;
            box-sizing: content-box;
        }

        .chat-item-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .chat-item-name {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-time {
            font-size: 11px;
            color: #888;
            flex-shrink: 0;
        }

        .chat-item-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .chat-item-preview {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-item-preview.mention {
            color: #07c160;
        }

        .mute-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0.5;
        }

        /* 底部工具栏 */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .footer-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            color: #888;
            transition: all 0.2s;
        }

        .footer-btn:hover {
            background: #3a3a3a;
            color: #fff;
        }

        .footer-btn.active {
            color: #07c160;
        }

        /* ========== 右侧聊天区域 ========== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            min-width: 0;
        }

        /* 顶部导航栏 */
        .chat-header {
            background: #f5f5f5;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e5e5;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            overflow: hidden;
            display: none;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-title-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .header-subtitle {
            font-size: 12px;
            color: #999;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            color: #666;
        }

        .header-btn:hover {
            background: #e5e5e5;
        }

        .more-icon {
            width: 20px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }

        .more-dot {
            width: 3px;
            height: 3px;
            background: currentColor;
            border-radius: 50%;
        }

        /* 聊天区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 20px;
            background: #f5f5f5;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
        }

        /* 时间分隔线 */
        .time-divider {
            text-align: center;
            margin: 16px 0;
            font-size: 12px;
            color: #999;
        }

        /* 消息行 */
        .message-row {
            display: flex;
            margin-bottom: 16px;
            position: relative;
            animation: messageAppear 0.3s ease-out;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row.self {
            flex-direction: row-reverse;
        }

        /* 头像 */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 消息内容区 */
        .message-content {
            max-width: 65%;
            display: flex;
            flex-direction: column;
            margin: 0 12px;
        }

        .message-row.self .message-content {
            align-items: flex-end;
        }

        .message-row.other .message-content {
            align-items: flex-start;
        }

        .sender-name {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        /* 消息气泡 */
        .message-bubble {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            cursor: default;
            transition: transform 0.2s;
        }

        .message-bubble:hover {
            transform: scale(1.01);
        }

        .message-row.self .message-bubble {
            background: #95ec69;
            color: #000;
            border-top-right-radius: 2px;
        }

        .message-row.other .message-bubble {
            background: #fff;
            color: #000;
            border-top-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* 文件消息气泡 */
        .file-bubble {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
            cursor: pointer;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            background: #f5f5f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-icon svg {
            width: 28px;
            height: 28px;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 15px;
            color: #000;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 12px;
            color: #999;
        }

        /* 表情包图片消息 */
        .image-bubble {
            max-width: 200px;
            border-radius: 6px;
            overflow: hidden;
        }

        .image-bubble img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* 时间戳提示 */
        .message-time {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .message-row.self .message-time {
            left: -70px;
        }

        .message-row.other .message-time {
            right: -70px;
        }

        .message-row:hover .message-time {
            opacity: 1;
        }

        /* 底部输入区 */
        .chat-input-area {
            background: #f7f7f7;
            border-top: 1px solid #e5e5e5;
            padding: 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .voice-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #666;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .voice-btn:hover {
            background: #e5e5e5;
        }

        .voice-icon {
            width: 20px;
            height: 24px;
            border: 2px solid currentColor;
            border-radius: 10px;
            position: relative;
        }

        .voice-icon::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 6px;
            border-bottom: 2px solid currentColor;
            border-radius: 0 0 4px 4px;
        }

        .input-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 6px;
            min-height: 40px;
            max-height: 120px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #e5e5e5;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #07c160;
        }

        .message-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            line-height: 20px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
            background: transparent;
        }

        .emoji-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 22px;
            color: #666;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .emoji-btn:hover {
            background: #e5e5e5;
        }

        .more-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #666;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .more-btn:hover {
            background: #e5e5e5;
        }

        .plus-icon {
            width: 24px;
            height: 24px;
            border: 2px solid currentColor;
            border-radius: 50%;
            position: relative;
        }

        .plus-icon::before,
        .plus-icon::after {
            content: '';
            position: absolute;
            background: currentColor;
            border-radius: 1px;
        }

        .plus-icon::before {
            width: 12px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .plus-icon::after {
            width: 2px;
            height: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .send-btn {
            background: #07c160;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: none;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #06ad56;
        }

        .send-btn:active {
            background: #059a4c;
        }

        .send-btn.visible {
            display: block;
        }

        /* 免责声明提示条 */
        .disclaimer-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 6px 16px;
            font-size: 11px;
            color: #888;
            text-align: center;
            z-index: 200;
            border-bottom: 1px solid #e5e5e5;
            line-height: 1.4;
        }

        .disclaimer-bar svg {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            fill: #ff9800;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            color: #999;
            font-size: 14px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .app-wrapper {
                border-radius: 0;
                max-height: 100vh;
                height: 100vh;
                margin-top: 0;
            }

            .disclaimer-bar {
                font-size: 10px;
                padding: 5px 10px;
            }

            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 260px;
                min-width: 260px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: none;
                position: absolute;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 40;
            }

            .sidebar-overlay.show {
                display: block;
            }

            .header-avatar {
                display: block;
            }

            .chat-container {
                width: 100%;
            }
        }

        @media (min-width: 769px) {
            .app-wrapper {
                height: calc(90vh - 32px);
            }

            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- 免责声明提示条 -->
    <div class="disclaimer-bar">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
        </svg>
        为避免泄密与侵犯个人隐私，此聊天场景为演绎效果，根据真实聊天记录改编
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">加载中...</div>
    </div>

    <div class="app-wrapper">
        <!-- 左侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <!-- 个人信息栏 -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <img src="png/soyo.jpg" alt="长崎爽世" id="profileAvatar">
                        <div class="profile-status-dot"></div>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name">长崎爽世</div>
                        <div class="profile-status">
                            <span class="status-icon"></span>
                            <span>在线</span>
                        </div>
                    </div>
                </div>
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" placeholder="搜索">
                </div>
            </div>

            <!-- 标签栏 -->
            <div class="tab-bar">
                <div class="tab-item active">消息</div>
                <div class="tab-item">联系人</div>
                <div class="tab-item">收藏</div>
            </div>

            <!-- 群组列表 -->
            <div class="chat-list" id="chatList">
                <!-- 群组项将通过JS动态生成 -->
            </div>

            <!-- 底部工具栏 -->
            <div class="sidebar-footer">
                <div class="footer-btn active" title="聊天">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <div class="footer-btn" title="通讯录">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="footer-btn" title="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
            </div>
        </aside>

        <!-- 移动端遮罩 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 右侧聊天区域 -->
        <div class="chat-container">
            <!-- 顶部群信息栏 -->
            <div class="chat-header">
                <div class="header-left">
                    <div class="header-avatar" id="headerAvatar">
                        <img src="png/mygo.jpg" alt="群头像">
                    </div>
                    <div class="header-title-wrap">
                        <div class="header-title">[邦多利社区]第十四届Mygo杯攻防演练</div>
                        <div class="header-subtitle">5人在线</div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-btn" title="搜索聊天记录">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                    </div>
                    <div class="header-btn" title="更多">
                        <div class="more-icon">
                            <div class="more-dot"></div>
                            <div class="more-dot"></div>
                            <div class="more-dot"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 聊天消息区域 -->
            <div class="chat-messages" id="chatMessages">
                <div class="time-divider">昨天 14:30</div>
                <!-- 消息将通过JS动态插入 -->
            </div>

            <!-- 底部输入框 -->
            <div class="chat-input-area">
                <div class="voice-btn" title="语音输入">
                    <div class="voice-icon"></div>
                </div>
                <div class="input-wrapper">
                    <textarea class="message-input" id="messageInput" rows="1" placeholder=""></textarea>
                </div>
                <div class="emoji-btn" title="表情">😊</div>
                <div class="more-btn" id="moreBtn" title="更多">
                    <div class="plus-icon"></div>
                </div>
                <button class="send-btn" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 群成员配置
        const members = {
            gsd: {
                name: '高松灯',
                avatar: 'png/gsd.jpg',
                role: '队长'
            },
            allin: {
                name: '千早爱音',
                avatar: 'png/allin.jpg'
            },
            yuenai: {
                name: '要乐奈',
                avatar: 'png/yuenai.jpg'
            },
            soyo: {
                name: '长崎爽世',
                avatar: 'png/soyo.jpg'
            },
            rikky: {
                name: '椎名立希',
                avatar: 'png/rikky.jpg'
            }
        };

        // 群组列表数据
        const chatGroups = [
            {
                id: 'mygo',
                name: '[邦多利社区]第十四届Mygo杯攻防演练',
                avatar: 'png/mygo.jpg',
                preview: '高松灯: AI攻防从入门到精通.pdf',
                time: '14:38',
                unread: 12,
                active: true,
                mention: false
            },
            {
                id: 'gsd',
                name: '高松灯',
                avatar: 'png/gsd.jpg',
                preview: '好的，没问题',
                time: '12:30',
                unread: 0,
                active: false,
                mention: false
            },
            {
                id: 'allin',
                name: '千早爱音',
                avatar: 'png/allin.jpg',
                preview: '你们还没在用吗？',
                time: '昨天',
                unread: 3,
                active: false,
                mention: true
            },
            {
                id: 'yuenai',
                name: '要乐奈',
                avatar: 'png/yuenai.jpg',
                preview: '非常一流，中上级水平吧。',
                time: '昨天',
                unread: 0,
                active: false,
                mention: false
            },
            {
                id: 'rikky',
                name: '椎名立希',
                avatar: 'png/rikky.jpg',
                preview: '+1 +1 +10086',
                time: '14:37',
                unread: 8,
                active: false,
                mention: false
            },
            {
                id: 'bandori',
                name: '邦多利大群',
                avatar: 'png/mygo.jpg',
                preview: '下周有live演出，记得来！',
                time: '周一',
                unread: 0,
                active: false,
                mention: false,
                muted: true
            }
        ];

        // 预设对话内容
        const presetMessages = [
            {
                id: 'gsd',
                content: '所以说，真的压力好大，前几天我参加了一个hvv不方便说奥，公益的，攻击队，都特么AI攻防了，那报告写的绝了！',
                time: '14:32'
            },
            {
                id: 'allin',
                content: '不是，AI攻防工具都那么多了，你们还没在用吗？',
                time: '14:33'
            },
            {
                id: 'allin',
                type: 'image',
                imageUrl: 'png/wow.jpg',
                content: '',
                time: '14:33'
            },
            {
                id: 'yuenai',
                content: '对，AI攻击队，Oh my god (○´･д･)ﾉ，非常一流，中上级水平吧。',
                time: '14:34'
            },
            {
                id: 'soyo',
                content: '大佬求教程！！！',
                time: '14:35'
            },
            {
                id: 'rikky',
                content: '同求同求，灯队长带带我们！',
                time: '14:35'
            },
            {
                id: 'soyo',
                content: '这个AI攻防到底怎么玩的啊，我也想学',
                time: '14:36'
            },
            {
                id: 'soyo',
                type: 'image',
                imageUrl: 'png/cry.gif',
                content: '',
                time: '14:36'
            },
            {
                id: 'rikky',
                content: '灯酱~ 求求了，发个教程吧',
                time: '14:36'
            },
            {
                id: 'soyo',
                content: '我已经迫不及待了，欧内该，我什么都会做的',
                time: '14:37'
            },
            {
                id: 'rikky',
                content: '+1 +1 +10086',
                time: '14:37'
            },
            {
                id: 'gsd',
                type: 'file',
                fileName: 'AI攻防从入门到精通.pdf',
                fileSize: '12.8 MB',
                content: '',
                time: '14:38'
            }
        ];

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const moreBtn = document.getElementById('moreBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const chatList = document.getElementById('chatList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const headerAvatar = document.getElementById('headerAvatar');

        let currentUser = 'soyo';

        // 消息队列管理
        const messageQueue = [];
        let isProcessingQueue = false;
        const MESSAGE_INTERVAL = 2000; // 2秒间隔
        let hasShownMessage = false; // 标记是否已显示过消息

        // 将消息加入队列
        function enqueueMessage(messageData) {
            messageQueue.push(messageData);
            if (!isProcessingQueue) {
                processQueue();
            }
        }

        // 处理消息队列
        async function processQueue() {
            if (messageQueue.length === 0) {
                isProcessingQueue = false;
                return;
            }

            isProcessingQueue = true;
            const msg = messageQueue.shift();

            // 发送消息到界面
            addMessage(msg, msg.id === currentUser, true);

            // 等待2秒后处理下一条
            await delay(MESSAGE_INTERVAL);

            // 递归处理下一条消息
            processQueue();
        }

        // 延迟函数
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 渲染群组列表
        function renderChatList() {
            chatList.innerHTML = '';
            chatGroups.forEach(group => {
                const item = document.createElement('div');
                item.className = `chat-item ${group.active ? 'active' : ''}`;
                item.dataset.id = group.id;

                item.innerHTML = `
                    <div class="chat-avatar-wrap">
                        <div class="chat-avatar">
                            <img src="${group.avatar}" alt="${group.name}" loading="lazy">
                        </div>
                        ${group.unread > 0 ? `<div class="unread-badge">${group.unread > 99 ? '99+' : group.unread}</div>` : ''}
                    </div>
                    <div class="chat-item-info">
                        <div class="chat-item-top">
                            <div class="chat-item-name">${group.name}</div>
                            <div class="chat-item-time">${group.time}</div>
                        </div>
                        <div class="chat-item-bottom">
                            <div class="chat-item-preview ${group.mention ? 'mention' : ''}">${group.mention ? '[有人@我] ' : ''}${group.preview}</div>
                            ${group.muted ? `<svg class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>` : ''}
                        </div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.chat-item').forEach(el => {
                        el.classList.remove('active');
                        const badge = el.querySelector('.unread-badge');
                        if (badge) badge.remove();
                    });
                    item.classList.add('active');

                    // 移动端关闭侧边栏
                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('open');
                        sidebarOverlay.classList.remove('show');
                    }
                });

                chatList.appendChild(item);
            });
        }

        // 创建消息元素
        function createMessageElement(messageData, isSelf = false) {
            const member = members[messageData.id];
            const row = document.createElement('div');
            row.className = `message-row ${isSelf ? 'self' : 'other'}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const img = document.createElement('img');
            img.src = member.avatar;
            img.alt = member.name;
            img.loading = 'lazy';
            img.onerror = function() {
                this.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%23ddd"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="%23999">' + member.name.charAt(0) + '</text></svg>';
            };
            avatar.appendChild(img);

            const content = document.createElement('div');
            content.className = 'message-content';

            const name = document.createElement('div');
            name.className = 'sender-name';
            name.textContent = member.role ? `${member.name}(${member.role})` : member.name;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (messageData.type === 'file') {
                bubble.innerHTML = `
                    <div class="file-bubble">
                        <div class="file-icon">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="#FF6B6B"/>
                                <path d="M14 2V8H20" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M16 13H8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M16 17H8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M10 9H9H8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="file-info">
                            <div class="file-name">${messageData.fileName}</div>
                            <div class="file-size">${messageData.fileSize}</div>
                        </div>
                    </div>
                `;
                bubble.addEventListener('click', function() {
                    window.open('file:///F:/video/AI网安/素材/report/kfc ai.pdf', '_blank');
                });
            } else if (messageData.type === 'image') {
                bubble.innerHTML = `
                    <div class="image-bubble">
                        <img src="${messageData.imageUrl}" alt="表情包" loading="lazy">
                    </div>
                `;
            } else {
                bubble.textContent = messageData.content;
            }

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = messageData.time || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            content.appendChild(name);
            content.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(content);
            row.appendChild(time);

            return row;
        }

        // 添加消息到聊天区域
        function addMessage(messageData, isSelf = false, scroll = true) {
            const messageEl = createMessageElement(messageData, isSelf);
            chatMessages.appendChild(messageEl);

            // 第一条消息显示后立即隐藏加载层
            if (!hasShownMessage) {
                hasShownMessage = true;
                loadingOverlay.classList.add('hidden');
            }

            if (scroll) {
                scrollToBottom();
            }

            return messageEl;
        }

        // 滚动到底部
        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        // 初始化预设消息 - 使用队列逐条发送，间隔2秒
        function initMessages() {
            // 将所有预设消息加入队列
            presetMessages.forEach(msg => {
                enqueueMessage(msg);
            });
        }

        // 发送消息 - 加入队列
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content) return;

            const messageData = {
                id: currentUser,
                content: content,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
            };

            // 加入消息队列，按顺序发送
            enqueueMessage(messageData);

            messageInput.value = '';
            messageInput.style.height = 'auto';
            toggleSendButton();
        }

        // 切换发送按钮显示
        function toggleSendButton() {
            if (messageInput.value.trim().length > 0) {
                sendBtn.classList.add('visible');
                moreBtn.style.display = 'none';
            } else {
                sendBtn.classList.remove('visible');
                moreBtn.style.display = 'flex';
            }
        }

        // 移动端侧边栏切换
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('show');
        }

        // 事件监听
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            toggleSendButton();
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('show');
        });

        headerAvatar.addEventListener('click', toggleSidebar);

        // 标签切换
        document.querySelectorAll('.tab-item').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 底部按钮切换
        document.querySelectorAll('.footer-btn').forEach((btn, index) => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.footer-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderChatList();
            initMessages();
        });

        // 窗口大小改变时处理
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('show');
            }
        });
    </script>
</body>
</html>
