<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      .copy {
        position: absolute; left: 140px; top: 320px; color: #ecfdf5;
        font-family: "Segoe UI", sans-serif;
      }
      .eyebrow {
        font-size: 24px; letter-spacing: 0.32em; text-transform: uppercase; color: #4ade80; margin-bottom: 22px;
      }
      .title { font-size: 110px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95; }
      .sub { margin-top: 28px; font-size: 32px; color: #86efac; }
      .scope {
        position: absolute; left: 980px; top: 140px; width: 760px; height: 760px; border-radius: 50%;
        border: 2px solid #166534;
        background: radial-gradient(circle at 50% 50%, #052e16 0%, #020617 72%);
        box-shadow: inset 0 0 80px rgba(34, 197, 94, 0.12), 0 0 40px rgba(22, 101, 52, 0.35);
        overflow: hidden;
      }
      .ring {
        position: absolute; left: 50%; top: 50%; border: 1px solid rgba(34, 197, 94, 0.35);
        border-radius: 50%; transform: translate(-50%, -50%);
      }
      .r1 { width: 28%; height: 28%; }
      .r2 { width: 56%; height: 56%; }
      .r3 { width: 84%; height: 84%; }
      .cross-h, .cross-v {
        position: absolute; background: rgba(34, 197, 94, 0.25);
      }
      .cross-h { left: 8%; right: 8%; top: 50%; height: 1px; }
      .cross-v { top: 8%; bottom: 8%; left: 50%; width: 1px; }
      .sweep {
        position: absolute; left: 50%; top: 50%; width: 48%; height: 3px; margin-top: -1px;
        background: linear-gradient(90deg, transparent, rgba(74, 222, 128, 0.15) 30%, #4ade80);
        transform-origin: 0% 50%;
        box-shadow: 0 0 18px rgba(74, 222, 128, 0.55);
      }
      .blip {
        position: absolute; width: 14px; height: 14px; border-radius: 50%;
        background: #4ade80; box-shadow: 0 0 14px #4ade80;
      }
      .b1 { left: 68%; top: 30%; }
      .b2 { left: 38%; top: 68%; }
      .b3 { left: 74%; top: 58%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Ops · Detection</div>
        <div class="title">Radar Sweep</div>
        <div class="sub">Find signal in the noise</div>
      </div>
      <div id="scope" class="clip scope" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="cross-h"></div>
        <div class="cross-v"></div>
        <div class="sweep" id="sweep"></div>
        <div class="blip b1" id="b1"></div>
        <div class="blip b2" id="b2"></div>
        <div class="blip b3" id="b3"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -22 });
      gsap.set("#scope", { opacity: 0, scale: 0.88, transformOrigin: "50% 50%" });
      gsap.set("#sweep", { rotation: -20 });
      gsap.set(["#b1", "#b2", "#b3"], { opacity: 0, scale: 0 });
      tl.to("#scope", { opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" }, 0.1)
        .to("#copy", { opacity: 1, x: 0, duration: 0.55 }, 0.3)
        .to("#sweep", { rotation: 340, duration: 3.7, ease: "none" }, 0.5)
        .to("#b1", { opacity: 1, scale: 1, duration: 0.28 }, 1.15)
        .to("#b2", { opacity: 1, scale: 1, duration: 0.28 }, 2.05)
        .to("#b3", { opacity: 1, scale: 1, duration: 0.28 }, 2.9)
        .to(["#b1", "#b2", "#b3"], { opacity: 0.4, duration: 0.55, yoyo: true, repeat: 1 }, 3.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
