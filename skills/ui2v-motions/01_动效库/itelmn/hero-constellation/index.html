<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .node { fill: #e2e8f0; }
      .link { stroke: rgba(148, 163, 184, 0.35); stroke-width: 1.5; fill: none; }
      .core { fill: #38bdf8; filter: drop-shadow(0 0 12px rgba(56,189,248,0.7)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <svg class="clip" id="sky" data-start="0" data-duration="4.5" data-track-index="0" viewBox="0 0 1920 1080">
        <g id="links"></g>
        <g id="nodes"></g>
      </svg>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const pts = [
        [960, 540], [720, 360], [1180, 320], [640, 620], [1280, 680],
        [860, 240], [1100, 780], [520, 420], [1420, 480], [980, 160],
        [760, 820], [1340, 260]
      ];
      const linksEl = document.getElementById("links");
      const nodesEl = document.getElementById("nodes");
      const edges = [[0,1],[0,2],[0,3],[0,4],[1,5],[2,8],[3,7],[4,6],[0,9],[0,10],[2,11],[1,7]];
      edges.forEach(([a, b], i) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", pts[a][0]); line.setAttribute("y1", pts[a][1]);
        line.setAttribute("x2", pts[b][0]); line.setAttribute("y2", pts[b][1]);
        line.setAttribute("class", "link"); line.id = "e" + i;
        linksEl.appendChild(line);
      });
      pts.forEach((p, i) => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]);
        c.setAttribute("r", i === 0 ? 10 : 5);
        c.setAttribute("class", i === 0 ? "core" : "node");
        c.id = "n" + i;
        nodesEl.appendChild(c);
      });
      const tl = gsap.timeline({ paused: true });
      gsap.set("#links line", { opacity: 0 });
      gsap.set("#nodes circle", { opacity: 0, scale: 0, transformOrigin: "50% 50%", svgOrigin: "960 540" });
      tl.to("#n0", { opacity: 1, scale: 1, duration: 0.4 }, 0.15)
        .to("#nodes circle", { opacity: 1, scale: 1, duration: 0.5, stagger: 0.06, ease: "back.out(1.8)" }, 0.4)
        .to("#links line", { opacity: 1, duration: 0.35, stagger: 0.05 }, 0.9)
        .to("#sky", { rotation: 6, duration: 2.4, ease: "sine.inOut", transformOrigin: "960px 540px", svgOrigin: "960 540" }, 1.8)
        .to("#n0", { attr: { r: 14 }, duration: 0.8, yoyo: true, repeat: 1 }, 2.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
