<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f0fdfa; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(160deg, #f0fdfa 0%, #ccfbf1 50%, #f8fafc 100%);
      }
      .copy {
        position: absolute; left: 140px; top: 280px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #134e4a;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #0f766e; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #0f766e; max-width: 520px; line-height: 1.45; }
      .panel {
        position: absolute; right: 150px; top: 250px; width: 820px;
        background: #fff; border-radius: 28px; padding: 56px 56px 48px;
        box-shadow: 0 24px 60px rgba(19, 78, 74, 0.12);
        border: 1px solid #99f6e4;
        font-family: "Segoe UI", sans-serif;
      }
      .panel h3 { font-size: 28px; color: #0f766e; margin-bottom: 12px; }
      .value {
        font-size: 72px; font-weight: 700; color: #134e4a; letter-spacing: -0.04em; margin-bottom: 40px;
      }
      .track {
        height: 14px; background: #ccfbf1; border-radius: 999px; position: relative;
      }
      .fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
        background: #0f766e; border-radius: 999px;
      }
      .thumb {
        position: absolute; top: 50%; left: 0%; width: 36px; height: 36px;
        margin: -18px 0 0 -18px; border-radius: 50%; background: #fff;
        border: 4px solid #0f766e; box-shadow: 0 8px 18px rgba(19, 78, 74, 0.2);
      }
      .ticks {
        margin-top: 22px; display: flex; justify-content: space-between;
        font-size: 22px; color: #14b8a6;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Control · Range</div>
        <div class="title">Slider Settle</div>
        <div class="sub">A quality slider scrubs then rests on the chosen value.</div>
      </div>
      <div id="panel" class="clip panel" data-start="0" data-duration="4.5" data-track-index="1">
        <h3>Render quality</h3>
        <div class="value"><span id="val">0</span>%</div>
        <div class="track">
          <div class="fill" id="fill"></div>
          <div class="thumb" id="thumb"></div>
        </div>
        <div class="ticks"><span>Draft</span><span>Balanced</span><span>Final</span></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const val = document.getElementById("val");
      const state = { p: 0 };
      const apply = () => {
        const p = state.p;
        val.textContent = String(Math.round(p));
        document.getElementById("fill").style.width = p + "%";
        document.getElementById("thumb").style.left = p + "%";
      };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#panel", { opacity: 0, y: 24 });
      apply();
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#panel", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to(state, { p: 88, duration: 1.6, ease: "power2.out", onUpdate: apply }, 0.95)
        .to(state, { p: 72, duration: 0.55, ease: "power2.inOut", onUpdate: apply }, 2.6)
        .to(state, { p: 75, duration: 0.4, ease: "power3.out", onUpdate: apply }, 3.2)
        .to("#panel", { y: -8, duration: 0.9, ease: "sine.inOut" }, 3.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
