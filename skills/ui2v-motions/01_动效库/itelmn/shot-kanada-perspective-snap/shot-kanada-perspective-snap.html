<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Card accent","default":"#b45309"}]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .kps-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e9e7e2;
          font-family: Inter, sans-serif;
          color: #292824;
        }
        .kps-title {
          position: absolute;
          left: 120px;
          top: 96px;
          font-size: 54px;
          font-weight: 900;
        }
        .kps-slot {
          position: absolute;
          left: 680px;
          top: 350px;
          width: 560px;
          height: 380px;
          border: 3px dashed #aaa79f;
          border-radius: 22px;
        }
        .kps-persp {
          position: absolute;
          left: 700px;
          top: 370px;
          width: 520px;
          height: 340px;
          perspective: 300px;
          perspective-origin: 30% 50%;
        }
        .kps-card {
          width: 520px;
          height: 340px;
          padding: 40px;
          border: 2px solid #c9c6bf;
          border-radius: 20px;
          background: #faf9f5;
          box-shadow: 70px 52px 36px rgba(0, 0, 0, 0.3);
          transform-origin: 20% 50%;
          filter: blur(2px);
        }
        .kps-k {
          width: 130px;
          height: 15px;
          border-radius: 8px;
          background: var(--accent);
        }
        .kps-v {
          width: 260px;
          height: 56px;
          margin-top: 34px;
          border-radius: 12px;
          background: #5e5d57;
        }
        .kps-lines {
          height: 95px;
          margin-top: 40px;
          border-radius: 12px;
          background: repeating-linear-gradient(
            to bottom,
            #d0cdc6 0 12px,
            transparent 12px 28px
          );
        }
      </style>
      <div
        data-hf-id="hf-kps-root"
        id="kps-root"
        data-composition-id="shot-kanada-perspective-snap"
        data-start="0"
        data-duration="4.333"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="kps-fill" style="--accent: #b45309">
          <div id="kps-stage">
            <div class="kps-title">KANADA PERSPECTIVE SNAP</div>
            <div class="kps-slot"></div>
            <div id="kps-persp" class="kps-persp">
              <article
                data-hf-id="hf-kps-card"
                id="kps-card"
                class="kps-card"
                data-layout-allow-overflow
              >
                <div class="kps-k"></div>
                <div class="kps-v"></div>
                <div class="kps-lines"></div>
              </article>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            root = document.getElementById("kps-root"),
            fill = root.querySelector(".kps-fill"),
            tl = gsap.timeline({ paused: true });
          fill.style.setProperty("--accent", v.accent || "#b45309");
          gsap.set("#kps-card", {
            x: -700,
            scale: 1.7,
            rotateX: 29,
            rotateY: 58,
            rotateZ: 6,
          });
          tl.to(
            "#kps-persp",
            { perspective: 1500, duration: 0.6, ease: "power3.out" },
            0,
          )
            .to(
              "#kps-card",
              {
                x: 0,
                scale: 1,
                rotateX: 0,
                rotateY: 5,
                rotateZ: 0,
                filter: "blur(0px)",
                boxShadow: "24px 22px 24px rgba(0,0,0,.2)",
                duration: 0.6,
                ease: "power3.out",
              },
              0,
            )
            .to(
              "#kps-card",
              {
                rotateY: 0,
                boxShadow: "0 8px 14px rgba(0,0,0,.16)",
                duration: 0.133,
                ease: "power3.out",
              },
              0.6,
            )
            .to(
              "#kps-stage",
              {
                keyframes: [
                  { x: 5, y: -3, duration: 0.034 },
                  { x: -3, y: 2, duration: 0.034 },
                  { x: 0, y: 0, duration: 0.034 },
                ],
                ease: "none",
              },
              0.6,
            );
          window.__timelines["shot-kanada-perspective-snap"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
