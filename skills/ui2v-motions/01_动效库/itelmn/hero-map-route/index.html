<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ecfdf5; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #ecfdf5;
      }
      .map {
        position: absolute; left: 180px; top: 160px; width: 1560px; height: 760px;
        border-radius: 28px; background: #fff; border: 2px solid #a7f3d0;
      }
      .route {
        position: absolute; left: 280px; top: 420px; width: 1200px; height: 6px;
        background: #d1fae5; border-radius: 999px; overflow: hidden;
      }
      .progress {
        position: absolute; left: 0; top: 0; height: 100%; width: 0; background: #059669;
      }
      .node {
        position: absolute; width: 28px; height: 28px; margin: -11px 0 0 -11px;
        border-radius: 50%; background: #fff; border: 4px solid #059669;
      }
      .label {
        position: absolute; font-family: "Segoe UI", sans-serif; font-size: 28px; color: #065f46; font-weight: 600;
      }
      .title {
        position: absolute; left: 220px; top: 220px;
        font-family: Georgia, serif; font-size: 92px; color: #064e3b; letter-spacing: -0.03em;
      }
      .sub {
        position: absolute; left: 220px; top: 340px;
        font-family: "Segoe UI", sans-serif; font-size: 30px; color: #047857;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="map" class="clip map" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="1">Map Route</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="4.5" data-track-index="2">Logistics path from origin to delivery</div>
      <div id="route" class="clip route" data-start="0" data-duration="4.5" data-track-index="3">
        <div class="progress" id="progress"></div>
      </div>
      <div id="n1" class="clip node" style="left:280px;top:420px" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <div id="n2" class="clip node" style="left:880px;top:420px" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="n3" class="clip node" style="left:1480px;top:420px" data-start="0" data-duration="4.5" data-track-index="6"></div>
      <div id="l1" class="clip label" style="left:250px;top:470px" data-start="0" data-duration="4.5" data-track-index="7">Origin</div>
      <div id="l2" class="clip label" style="left:840px;top:470px" data-start="0" data-duration="4.5" data-track-index="8">Hub</div>
      <div id="l3" class="clip label" style="left:1420px;top:470px" data-start="0" data-duration="4.5" data-track-index="9">Arrive</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#map", { opacity: 0, y: 24 });
      gsap.set(["#title","#sub"], { opacity: 0, y: 18 });
      gsap.set(["#n1","#n2","#n3"], { scale: 0, opacity: 0 });
      gsap.set(["#l1","#l2","#l3"], { opacity: 0, y: 8 });
      gsap.set("#progress", { width: 0 });
      tl.to("#map", { opacity: 1, y: 0, duration: 0.6 }, 0.1)
        .to("#title", { opacity: 1, y: 0, duration: 0.5 }, 0.25)
        .to("#sub", { opacity: 1, y: 0, duration: 0.5 }, 0.4)
        .to("#n1", { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.6)
        .to("#l1", { opacity: 1, y: 0, duration: 0.3 }, 0.7)
        .to("#progress", { width: "50%", duration: 1.0, ease: "power1.inOut" }, 0.9)
        .to("#n2", { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 1.7)
        .to("#l2", { opacity: 1, y: 0, duration: 0.3 }, 1.8)
        .to("#progress", { width: "100%", duration: 1.1, ease: "power1.inOut" }, 2.1)
        .to("#n3", { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.0)
        .to("#l3", { opacity: 1, y: 0, duration: 0.3 }, 3.1);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
