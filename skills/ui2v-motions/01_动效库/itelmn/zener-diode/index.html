<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Zener Diode Animation</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #050507;
        --accent-blue: #00f2ff;
        --accent-purple: #bd00ff;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --grid-color: rgba(255, 255, 255, 0.05);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Outfit', sans-serif;
      }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-color);
        color: var(--text-primary);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(var(--grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      .clip {
        position: absolute;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Typography */
      .title {
        font-size: 120px;
        font-weight: 700;
        top: 80px;
        left: 100px;
        background: linear-gradient(90deg, #fff, var(--accent-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        font-size: 48px;
        font-weight: 300;
        top: 220px;
        left: 105px;
        color: var(--text-secondary);
      }

      /* Diode Symbol */
      .diode-container {
        top: 350px;
        left: 200px;
        width: 600px;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .diode-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.3));
      }

      .label {
        font-size: 32px;
        font-weight: 400;
        color: var(--accent-blue);
        text-transform: uppercase;
        letter-spacing: 4px;
      }

      /* Graph */
      .graph-container {
        top: 250px;
        right: 150px;
        width: 700px;
        height: 700px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        backdrop-filter: blur(10px);
      }

      .axis {
        stroke: rgba(255, 255, 255, 0.5);
        stroke-width: 2;
      }

      .curve {
        fill: none;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .forward-curve {
        stroke: var(--accent-blue);
      }

      .reverse-curve {
        stroke: var(--accent-purple);
      }

      /* Electron Path */
      .electron {
        fill: var(--accent-blue);
        filter: blur(2px);
      }

      /* Highlights */
      .highlight-box {
        background: rgba(189, 0, 255, 0.1);
        border: 1px solid var(--accent-purple);
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 24px;
        color: var(--accent-purple);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      
      <!-- Intro Section -->
      <div id="title" class="clip title" data-start="0" data-duration="20" data-track-index="1">
        ZENER DIODE
      </div>
      <div id="subtitle" class="clip subtitle" data-start="0.5" data-duration="19.5" data-track-index="2">
        Voltage Regulation & Breakdown
      </div>

      <!-- Diode Symbol Section -->
      <div id="symbol-group" class="clip diode-container" data-start="1" data-duration="19" data-track-index="3">
        <svg viewBox="-20 0 440 200" class="diode-svg">
          <!-- Anode side -->
          <line x1="0" y1="100" x2="150" y2="100" stroke="white" stroke-width="4" />
          <!-- Diode Triangle -->
          <path d="M 150 50 L 150 150 L 250 100 Z" fill="none" stroke="white" stroke-width="4" />
          <!-- Zener Line (Cathode) -->
          <path d="M 250 50 L 250 150 M 230 50 L 250 50 M 250 150 L 270 150" fill="none" stroke="white" stroke-width="4" id="zener-line" />
          <!-- Cathode side -->
          <line x1="250" y1="100" x2="400" y2="100" stroke="white" stroke-width="4" />
          
          <!-- Current Flow Indicator -->
          <circle id="electron" r="6" cx="0" cy="100" class="electron" />
        </svg>
      </div>

      <div id="anode-label" class="clip label" data-start="1.5" data-duration="18.5" data-track-index="4" style="top: 380px; left: 160px;">Anode (+)</div>
      <div id="cathode-label" class="clip label" data-start="1.5" data-duration="18.5" data-track-index="5" style="top: 380px; left: 680px;">Cathode (-)</div>

      <!-- Graph Section -->
      <div id="graph-group" class="clip graph-container" data-start="2" data-duration="18" data-track-index="6">
        <svg viewBox="0 0 400 400" width="100%" height="100%">
          <!-- Grid -->
          <line x1="0" y1="200" x2="400" y2="200" class="axis" /> <!-- V axis -->
          <line x1="200" y1="0" x2="200" y2="400" class="axis" /> <!-- I axis -->
          
          <!-- Axis Labels -->
          <text x="380" y="220" fill="white" font-size="14">+V</text>
          <text x="10" y="220" fill="white" font-size="14">-V</text>
          <text x="210" y="20" fill="white" font-size="14">+I</text>
          <text x="210" y="390" fill="white" font-size="14">-I</text>

          <!-- Forward Bias Curve -->
          <path id="forward-path" d="M 200 200 Q 250 200, 280 50" class="curve forward-curve" stroke-dasharray="200" stroke-dashoffset="200" />
          
          <!-- Reverse Bias Curve -->
          <path id="reverse-path" d="M 200 200 L 100 200 L 100 350" class="curve reverse-curve" stroke-dasharray="400" stroke-dashoffset="400" />
          
          <!-- Breakdown Marker -->
          <circle id="breakdown-point" cx="100" cy="200" r="8" fill="var(--accent-purple)" style="opacity: 0;" />
        </svg>
        
        <div id="vz-label" class="clip highlight-box" data-start="12" data-duration="8" data-track-index="7" style="position: absolute; left: 40px; top: 160px;">
          Zener Voltage (Vz)
        </div>
      </div>

      <!-- Descriptive Text -->
      <div id="desc-1" class="clip" data-start="3" data-duration="4" data-track-index="8" style="top: 850px; left: 100px; font-size: 36px; width: 800px;">
        Acts as a normal diode in <span style="color: var(--accent-blue)">Forward Bias</span>.
      </div>
      <div id="desc-2" class="clip" data-start="8" data-duration="11" data-track-index="9" style="top: 850px; left: 100px; font-size: 36px; width: 800px;">
        But in <span style="color: var(--accent-purple)">Reverse Bias</span>, it allows current to flow after reaching a specific voltage.
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Intro
      tl.to("#title", { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 0)
        .to("#subtitle", { opacity: 1, x: 0, duration: 1, ease: "power3.out" }, 0.5);

      // Symbol Appearance
      tl.to("#symbol-group", { opacity: 1, scale: 1, duration: 1.5, ease: "back.out(1.7)" }, 1)
        .to(["#anode-label", "#cathode-label"], { opacity: 1, duration: 0.8, stagger: 0.2 }, 1.5);

      // Graph Appearance
      tl.to("#graph-group", { opacity: 1, x: 0, duration: 1.2, ease: "power2.out" }, 2);

      // Forward Bias Sequence (3s - 7s)
      tl.to("#desc-1", { opacity: 1, y: -20, duration: 1 }, 3)
        .to("#forward-path", { strokeDashoffset: 0, duration: 3, ease: "power1.inOut" }, 3.5)
        .to("#electron", {
          cx: 400,
          opacity: 1,
          repeat: 5,
          duration: 0.8,
          ease: "none"
        }, 3.5);

      tl.to("#desc-1", { opacity: 0, duration: 0.5 }, 7);

      // Reverse Bias Sequence (8s - 20s)
      tl.to("#desc-2", { opacity: 1, y: -20, duration: 1 }, 8);
      
      // First, show reverse voltage increasing but NO current
      tl.to("#reverse-path", { 
        strokeDashoffset: 300, 
        duration: 3, 
        ease: "power1.in" 
      }, 9);

      // Hit breakdown point
      tl.to("#breakdown-point", { opacity: 1, scale: 1.5, duration: 0.5, yoyo: true, repeat: 1 }, 12)
        .to("#vz-label", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out" }, 12);

      // Breakdown current flow (The steep drop)
      tl.to("#reverse-path", { 
        strokeDashoffset: 0, 
        duration: 2, 
        ease: "power2.in" 
      }, 12.5);

      // Reverse current flow indicator (moving backward)
      tl.to("#electron", {
        cx: 0,
        fill: "#bd00ff",
        filter: "blur(4px)",
        opacity: 1,
        repeat: 10,
        duration: 0.4,
        ease: "none"
      }, 13);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
