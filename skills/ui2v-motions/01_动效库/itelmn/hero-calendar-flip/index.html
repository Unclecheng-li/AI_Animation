<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fee2e2; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fee2e2; }
      .label {
        position: absolute; left: 160px; top: 120px;
        font-family: Georgia, serif; font-size: 64px; color: #7f1d1d;
      }
      .cal {
        position: absolute; left: 640px; top: 220px; width: 640px; height: 680px;
        border-radius: 28px; overflow: hidden; background: #fff;
        box-shadow: 0 28px 70px rgba(127, 29, 29, 0.18);
      }
      .head {
        height: 140px; background: #dc2626; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", sans-serif; font-size: 42px; font-weight: 700; letter-spacing: 0.12em;
      }
      .day {
        height: 540px; display: flex; align-items: center; justify-content: center;
        font-family: Georgia, serif; font-size: 280px; color: #1c1917; position: relative;
      }
      .page {
        position: absolute; inset: 140px 0 0 0; background: #fff;
        transform-origin: 50% 0%;
        display: flex; align-items: center; justify-content: center;
        font-family: Georgia, serif; font-size: 280px; color: #1c1917;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      }
      .note {
        position: absolute; left: 160px; bottom: 160px;
        font-family: "Segoe UI", sans-serif; font-size: 32px; color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="label" class="clip label" data-start="0" data-duration="4.5" data-track-index="0">Calendar Flip</div>
      <div id="cal" class="clip cal" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="head">AUGUST</div>
        <div class="day">3</div>
        <div class="page" id="page">4</div>
      </div>
      <div id="note" class="clip note" data-start="0" data-duration="4.5" data-track-index="2">Ship day flips forward</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#label", "#note"], { opacity: 0, y: 14 });
      gsap.set("#cal", { opacity: 0, y: 30, scale: 0.96 });
      gsap.set("#page", { rotateX: 0, opacity: 1, transformOrigin: "50% 0%" });
      tl.to("#label", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#cal", { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" }, 0.25)
        .to("#note", { opacity: 1, y: 0, duration: 0.4 }, 0.55)
        .to("#page", { rotateX: -95, opacity: 0.15, duration: 1.1, ease: "power2.in" }, 1.5)
        .to("#page", { opacity: 0, duration: 0.2 }, 2.6)
        .to("#cal", { y: -8, duration: 1.5, ease: "sine.inOut" }, 2.8);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
