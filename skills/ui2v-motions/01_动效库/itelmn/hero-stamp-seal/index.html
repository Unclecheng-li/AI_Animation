<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fafaf9; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #fafaf9;
      }
      .paper {
        position: absolute; left: 280px; top: 160px; width: 1360px; height: 760px;
        background: #fff; border: 1px solid #e7e5e4;
        box-shadow: 0 24px 60px rgba(28, 25, 23, 0.08);
        padding: 80px 100px;
      }
      .doc-title {
        font-family: Georgia, serif; font-size: 64px; color: #1c1917; margin-bottom: 28px;
      }
      .doc-body {
        font-family: "Segoe UI", sans-serif; font-size: 30px; line-height: 1.6; color: #57534c; max-width: 820px;
      }
      .stamp {
        position: absolute; right: 180px; bottom: 160px; width: 280px; height: 280px;
        border-radius: 50%; border: 10px solid #b91c1c; color: #b91c1c;
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: "Segoe UI", sans-serif; font-weight: 800; font-size: 42px;
        letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.15;
        background: rgba(185, 28, 28, 0.04);
        box-shadow: inset 0 0 0 4px rgba(185, 28, 28, 0.35);
      }
      .stamp small { display: block; font-size: 22px; font-weight: 700; margin-top: 8px; letter-spacing: 0.2em; }
      .brand {
        position: absolute; left: 160px; top: 60px;
        font-family: "Segoe UI", sans-serif; font-size: 24px; letter-spacing: 0.28em;
        text-transform: uppercase; color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="brand" class="clip brand" data-start="0" data-duration="4.5" data-track-index="0">Approval · Object</div>
      <div id="paper" class="clip paper" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="doc-title">Release Certificate</div>
        <div class="doc-body">
          This HyperFrames composition has passed lint, seeks cleanly, and is cleared for registry publish under MIT-0.
        </div>
      </div>
      <div id="stamp" class="clip stamp" data-start="0" data-duration="4.5" data-track-index="2">
        Approved
        <small>UI2V</small>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#brand", { opacity: 0 });
      gsap.set("#paper", { opacity: 0, y: 24 });
      gsap.set("#stamp", { opacity: 0, scale: 1.6, rotate: -18, transformOrigin: "50% 50%" });
      tl.to("#brand", { opacity: 1, duration: 0.35 }, 0.1)
        .to("#paper", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25)
        .to("#stamp", { opacity: 0.92, scale: 1, rotate: -12, duration: 0.5, ease: "power4.in" }, 1.35)
        .to("#stamp", { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1 }, 1.95)
        .to("#stamp", { rotate: -8, duration: 1.5, ease: "sine.inOut" }, 2.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
