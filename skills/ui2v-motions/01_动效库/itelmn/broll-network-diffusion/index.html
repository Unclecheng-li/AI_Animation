<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"accent","type":"color","label":"Signal color","default":"#ff7058"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root{--bg:#071421;--ink:#e8efe9;--muted:#6f8794}
    *{box-sizing:border-box} html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
    body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
    #clip{position:absolute;inset:0;overflow:hidden}
    .field{position:absolute;inset:0;background:radial-gradient(circle at 37% 52%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 26%),radial-gradient(circle at 78% 48%,rgba(60,117,142,.2),transparent 34%)}
    .field:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(232,239,233,.11) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
    header{position:absolute;left:86px;top:72px;z-index:4}
    header small{display:block;font:700 18px "Courier New",monospace;letter-spacing:.16em;color:var(--accent)}
    header h1{margin:10px 0 0;font:800 56px/1 Arial,sans-serif;letter-spacing:-.035em}
    .legend{position:absolute;right:88px;top:78px;display:flex;gap:28px;font:700 17px "Courier New",monospace;color:var(--muted);z-index:4}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;background:currentColor}
    #network{position:absolute;left:90px;top:165px;width:1740px;height:760px;overflow:visible}
    .edge{fill:none;stroke:#315365;stroke-width:4;stroke-linecap:round}
    .edge.hot{stroke:var(--accent);stroke-width:6;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--accent) 70%,transparent))}
    .node:not(#source){opacity:0}.node .halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:.35}
    .node .core{fill:var(--bg);stroke:#9bb0b8;stroke-width:4}
    .node text{fill:var(--ink);font:700 18px "Courier New",monospace;letter-spacing:.08em}
    .node.active .core{fill:var(--accent);stroke:var(--ink)}
    #source .core{fill:var(--accent);stroke:var(--ink);stroke-width:6}
    #source text{font-size:21px}
    .ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
    .status{position:absolute;left:88px;bottom:66px;width:1744px;border-top:2px solid #315365;padding-top:18px;display:flex;justify-content:space-between;font:700 17px "Courier New",monospace;letter-spacing:.08em;color:var(--muted)}
    #packet-count{color:var(--ink)} .no-labels header,.no-labels .legend,.no-labels .status,.no-labels .node text{opacity:0}
  </style>
</head>
<body>
<div id="stage" data-composition-id="broll-network-diffusion" data-start="0" data-duration="8.5" data-fps="30" data-width="1920" data-height="1080">
  <div id="clip" class="clip" data-start="0" data-duration="8.5" data-track-index="1">
    <div class="field"></div>
    <header><small>NETWORK DYNAMICS / 02</small><h1>INFORMATION DIFFUSION</h1></header>
    <div class="legend"><span><i style="color:var(--accent)"></i>ACTIVE</span><span><i></i>DORMANT</span></div>
    <svg id="network" viewBox="0 0 1740 760" aria-label="Branching information network">
      <path id="e01" class="edge" d="M260 380 C390 380 430 220 570 220"/>
      <path id="e02" class="edge" d="M260 380 C400 380 445 500 590 500"/>
      <path id="e13" class="edge" d="M570 220 C690 220 730 115 850 115"/>
      <path id="e14" class="edge" d="M570 220 C700 220 735 300 875 300"/>
      <path id="e25" class="edge" d="M590 500 C715 500 755 415 890 415"/>
      <path id="e26" class="edge" d="M590 500 C720 500 760 625 900 625"/>
      <path id="e37" class="edge" d="M850 115 C990 115 1025 65 1165 65"/>
      <path id="e38" class="edge" d="M850 115 C995 115 1035 195 1180 195"/>
      <path id="e49" class="edge" d="M875 300 C1015 300 1050 275 1200 275"/>
      <path id="e410" class="edge" d="M875 300 C1020 300 1060 365 1215 365"/>
      <path id="e511" class="edge" d="M890 415 C1030 415 1080 465 1230 465"/>
      <path id="e612" class="edge" d="M900 625 C1040 625 1090 570 1240 570"/>
      <path id="e613" class="edge" d="M900 625 C1060 625 1110 690 1280 690"/>
      <path id="e714" class="edge" d="M1165 65 C1300 65 1380 115 1530 115"/>
      <path id="e1015" class="edge" d="M1215 365 C1360 365 1410 325 1580 325"/>
      <path id="e1116" class="edge" d="M1230 465 C1380 465 1430 500 1600 500"/>
      <circle class="ring" cx="260" cy="380" r="58"/><circle class="ring" cx="260" cy="380" r="58"/><circle class="ring" cx="260" cy="380" r="58"/>
      <g class="node active" id="source" transform="translate(260 380)"><circle class="halo" r="58"/><circle class="core" r="27"/><text x="-70" y="84">SOURCE</text></g>
      <g class="node" id="n1" transform="translate(570 220)"><circle class="halo" r="39"/><circle class="core" r="18"/><text x="-24" y="60">N1</text></g>
      <g class="node" id="n2" transform="translate(590 500)"><circle class="halo" r="39"/><circle class="core" r="18"/><text x="-24" y="60">N2</text></g>
      <g class="node" id="n3" transform="translate(850 115)"><circle class="core" r="15"/><text x="-22" y="48">N3</text></g>
      <g class="node" id="n4" transform="translate(875 300)"><circle class="core" r="15"/><text x="-22" y="48">N4</text></g>
      <g class="node" id="n5" transform="translate(890 415)"><circle class="core" r="15"/><text x="-22" y="48">N5</text></g>
      <g class="node" id="n6" transform="translate(900 625)"><circle class="core" r="15"/><text x="-22" y="48">N6</text></g>
      <g class="node" id="n7" transform="translate(1165 65)"><circle class="core" r="12"/></g><g class="node" id="n8" transform="translate(1180 195)"><circle class="core" r="12"/></g>
      <g class="node" id="n9" transform="translate(1200 275)"><circle class="core" r="12"/></g><g class="node" id="n10" transform="translate(1215 365)"><circle class="core" r="12"/></g>
      <g class="node" id="n11" transform="translate(1230 465)"><circle class="core" r="12"/></g><g class="node" id="n12" transform="translate(1240 570)"><circle class="core" r="12"/></g>
      <g class="node" id="n13" transform="translate(1280 690)"><circle class="core" r="12"/></g><g class="node" id="n14" transform="translate(1530 115)"><circle class="core" r="10"/></g>
      <g class="node" id="n15" transform="translate(1580 325)"><circle class="core" r="10"/></g><g class="node" id="n16" transform="translate(1600 500)"><circle class="core" r="10"/></g>
    </svg>
    <div class="status"><span>HOPS <b id="hop">00</b></span><span id="packet-count">01 NODE REACHED</span><span>PROPAGATION / ASYNCHRONOUS</span></div>
  </div>
</div>
<script>
  const vars=window.__hyperframes.getVariables(); if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
  const waves=[['e01','n1'],['e02','n2'],['e13','n3'],['e14','n4'],['e25','n5'],['e26','n6'],['e37','n7'],['e38','n8'],['e49','n9'],['e410','n10'],['e511','n11'],['e612','n12'],['e613','n13'],['e714','n14'],['e1015','n15'],['e1116','n16']];
  const starts=[.7,.92,2.05,2.25,2.42,2.62,3.45,3.62,3.8,3.98,4.16,4.34,4.52,5.65,5.9,6.15];
  const tl=gsap.timeline({paused:true});
  tl.fromTo('header',{x:-50,autoAlpha:0},{x:0,autoAlpha:1,duration:.6,ease:'power3.out'},0);
  tl.fromTo('.status',{y:28,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,ease:'power2.out'},.15);
  tl.fromTo('#source',{scale:.35,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.55,ease:'back.out(1.8)'},.25);
  tl.fromTo('.ring',{scale:.3,autoAlpha:.55,transformOrigin:'center'},{scale:4.8,autoAlpha:0,duration:1.55,stagger:.22,ease:'power2.out'},.35);
  waves.forEach(([edge,node],i)=>{
    const path=document.getElementById(edge); const len=path.getTotalLength();
    path.setAttribute('stroke-dasharray',len); path.setAttribute('stroke-dashoffset',len);
    tl.set(path,{attr:{class:'edge hot'}},starts[i]);
    tl.to(path,{attr:{'stroke-dashoffset':0},duration:.72,ease:'power2.inOut'},starts[i]);
    tl.set('#'+node,{attr:{class:'node active'}},starts[i]+.47);
    tl.fromTo('#'+node,{scale:.25,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.36,ease:'back.out(1.7)',immediateRender:false},starts[i]+.48);
    tl.set('#hop',{textContent:String(Math.min(4,Math.floor(i/2)+1)).padStart(2,'0')},starts[i]+.5);
    tl.set('#packet-count',{textContent:String(i+2).padStart(2,'0')+' NODES REACHED'},starts[i]+.5);
  });
  tl.to('.node .halo',{scale:1.2,opacity:.08,duration:.65,stagger:.025,ease:'sine.inOut'},6.8);
  tl.to('#clip',{autoAlpha:0,duration:.35,ease:'power2.in'},8.1);
  tl.seek(0); window.__timelines['broll-network-diffusion']=tl;
</script>
</body></html>
