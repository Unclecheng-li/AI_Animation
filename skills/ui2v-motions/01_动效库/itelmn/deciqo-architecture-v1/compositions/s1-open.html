      <script>
        (function () {
          const Q = [
            "tidak sesuai gambar", "barang tidak lengkap", "dikirimnya lama", "bahan nya tipis", "packing tidak ada pengamanan",
            "Laptop 14 inci saya tidak muat.", "respon buruk parah", "yang saya pesan merah d kirim abu", "sedikit kebesaran", "yang ini sempit",
            "paket datang kardus penyok & robek", "tidak jelas apa ukuran nya", "minta size 43 yang dikirim size 44", "chat tidak pernah di bls",
            "Tas kekecilan untuk laptop saya", "benar benar ukuran super mini", "tidak bisa di gunakan", "kecewa ga sesuai pesenan",
            "Bahannya bagus tetapi laptop tidak muat.", "manual pake bahasa china sulit dipahami", "cover buku tidak bagus", "spekernya mati sebelah",
            "saya khawatir ini tidak ori", "dikirim bor nya kurang satu", "hanya plastik hitam mudah robek", "Masih tidak muat laptop 14 inch saya.",
            "tidak dapet warna pink", "sudah seminggu statusnya rumah kosong", "Desain: tidak sesuai gambar", "lama nya kirim barang nya",
          ];
          // seeded PRNG (deterministic)
          let seed = 20260926;
          const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
          const F = document.getElementById("s1-field");
          const rows = [];
          const ROWS = 11;
          let html = "";
          for (let r = 0; r < ROWS; r++) {
            const depth = [0.55, 0.8, 1.0, 0.65, 1.25, 0.9, 1.45, 0.7, 1.05, 0.6, 0.85][r];
            const fs = Math.round(22 * depth + 6);
            const h = Math.round(fs * 2.3);
            let row = `<div class="s1-row" id="s1-r${r}" style="top:${60 + r * 136}px;font-size:${fs}px;opacity:${Math.min(1, 0.25 + depth * 0.55)}">`;
            for (let k = 0; k < 14; k++) {
              const q = Q[Math.floor(rnd() * Q.length)];
              const n = 1 + Math.floor(rnd() * 3);
              const hot = /muat|kekecilan/.test(q);
              row += `<div class="s1-card${hot ? " hot" : ""}" style="height:${h}px"><span class="st" style="font-size:${Math.round(fs * 0.8)}px">${"★".repeat(n)}<s>${"★".repeat(5 - n)}</s></span>${q}</div>`;
            }
            row += "</div>";
            html += row;
            rows.push({ depth, dir: r % 2 ? 1 : -1 });
          }
          F.innerHTML = html;

          const tl = gsap.timeline({ paused: true });
          gsap.set(["#s1-line", "#s1-dot"], { opacity: 0 });
          gsap.set("#s1-field", { rotation: -7, scale: 1.05 });
          rows.forEach((r, i) => {
            const speed = 160 * r.depth + 60;
            const x0 = r.dir < 0 ? -200 - i * 37 : -2600 + i * 41;
            tl.fromTo(`#s1-r${i}`, { x: x0 }, { x: x0 + r.dir * -1 * speed * 7.2 * -1, duration: 7.2, ease: "none" }, 0);
            tl.fromTo(`#s1-r${i}`, { y: 40 }, { y: 0, duration: 1.6, ease: "power3.out" }, 0.05 * i);
          });
          tl.fromTo("#s1-field", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);
          tl.to("#s1-field", { scale: 1.18, duration: 6.4, ease: "sine.in" }, 0);
          tl.fromTo("#s1-eyebrow", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.fromTo("#s1-src", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.6);
          // beat 1: words slam in on the grid
          tl.fromTo("#s1-t1 span", { y: 120, opacity: 0, scale: 1.15 }, { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: "power4.out", stagger: 0.5 }, 1.0);
          tl.to("#s1-t1", { scale: 0.9, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, 3.4);
          // beat 2
          tl.fromTo("#s1-t2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.75);
          tl.fromTo("#s1-t2 em", { color: "#e9eef9" }, { color: "#a9c2ff", duration: 0.3 }, 4.5);
          // collapse into a line, then a dot
          tl.to("#s1-t2", { scaleY: 0.02, scaleX: 0.6, opacity: 0.0, duration: 0.5, ease: "power4.in" }, 6.0);
          tl.to("#s1-field", { scaleY: 0.004, duration: 0.6, ease: "power4.in" }, 5.9);
          tl.to(["#s1-eyebrow", "#s1-src"], { opacity: 0, duration: 0.3 }, 5.9);
          tl.fromTo("#s1-line", { opacity: 0, scaleX: 1.2 }, { opacity: 1, scaleX: 1, duration: 0.2 }, 6.45);
          tl.set("#s1-field", { opacity: 0 }, 6.55);
          tl.to("#s1-line", { scaleX: 0.02, duration: 0.65, ease: "expo.in" }, 6.66);
          tl.fromTo("#s1-dot", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 7.2);
          tl.set("#s1-line", { opacity: 0 }, 7.3);
          tl.to("#s1-dot", { scale: 1.35, duration: 0.5, ease: "sine.inOut" }, 7.45);
          tl.to("#s1-glow", { opacity: 0.4, duration: 1.2 }, 6.4);
          window.__timelines["s1-open"] = tl;
        })();
      </script>
