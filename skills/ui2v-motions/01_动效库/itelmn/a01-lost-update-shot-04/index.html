<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start  ——  canonical source: brand/tokens.css · sync with `node tools/brand.mjs`
   Brand is typography, colour SEMANTICS, stroke language and motion timing.
   Brand is NOT geometry. Nothing here positions anything. */
:root {
  /* ground — near-black with a trace of warm ink, so off-white reads as printed */
  --ground:      #0C0D0F;
  --ground-lift: #14161A;   /* the only permitted "panel" value, used sparingly */

  /* ink */
  --ink:      #EDEAE4;      /* primary. warm off-white, never #FFF */
  --ink-mid:  #9AA0A6;
  --ink-dim:  #8B9198;   /* raised from #6E7378: 3.8:1 failed AA on this ground */
  --ink-ghost:#3A3E42;

  /* structure — hairlines and rules carry the layout, not boxes */
  --rule:       #23272A;
  --rule-bright:#3D4348;
  --hair: 1.5px;

  /* COLOUR IS SEMANTIC. Each of these means one thing for the whole channel. */
  --authoritative: #C9A227;  /* the value of record — the committed truth */
  --stale:         #E0533D;  /* derived from a value that has since changed */
  --lost:          #6A6F74;  /* work that was discarded — 3.6:1, recessive but legible */
  --boundary:      #4E8C7D;  /* a trust / ownership / tenancy edge */
  --pressure:      #B4623A;  /* accumulation, backlog, amplification */
  --counterfactual:#7A8086;  /* the value that SHOULD have existed — expected vs actual */

  /* type — two families, one voice. Values are monospace because they are data. */
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;

  --t-hero:  200px;  /* a number that is the subject of the frame */
  --t-value:  64px;
  --t-body:   36px;
  --t-label:  26px;  /* floor for a phone. nothing smaller ships. */
  --track-label: 0.18em;

  /* motion personality: fast attack, long settle. nothing bounces, nothing glows. */
  --e-reveal: power3.out;
  --e-travel: power2.inOut;
  --d-reveal: 0.45;
  --d-travel: 0.9;
  --d-hold:   0.8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-label);
  /* no border-radius anywhere by default; no box-shadow; no filter: blur/glow */
}

.label {
  font-family: var(--font-label);
  font-size: var(--t-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--ink-dim);
  font-weight: 500;
}
.value { font-family: var(--font-value); font-variant-numeric: tabular-nums; font-weight: 600; }
.rule  { background: var(--rule); }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }

/* ---------------------------------------------------------------------------
   SPATIAL SYSTEM — two hairlines, three zones that mean something:

     y <  560     THE ROW        what is stored, and what it used to be
     560 – 1380   IN FLIGHT      values that have left the row and are being
                                 computed on. Reads descend on rails; writes
                                 press back up against the boundary.
     y > 1380     THE RECKONING  what this cost

   Nothing crosses a boundary invisibly. Left margin 120px throughout.
   Caption band below y=1574 stays clear.
--------------------------------------------------------------------------- */
#boundary { position: absolute; left: 120px; top: 560px;  width: 840px; height: var(--hair);
            background: var(--rule-bright); transform-origin: left center; }
#reckon   { position: absolute; left: 120px; top: 1380px; width: 840px; height: var(--hair);
            background: var(--rule); transform-origin: left center; }

#rowLabel { position: absolute; left: 120px; top: 140px; }

/* --- the row's value: one slot, three successive occupants ---------------- */
#ledger { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.lv    { position: absolute; left: 120px; top: 220px; display: flex; align-items: flex-end;
         gap: 26px; transform-origin: left top; }
.lv .n { font-family: var(--font-value); font-weight: 600; font-size: var(--t-hero);
         line-height: 1; letter-spacing: -.02em; color: var(--authoritative); }
.lv .v { font-family: var(--font-value); font-size: 26px; color: var(--ink-dim); padding-bottom: 18px; }

#supLabel  { position: absolute; left: 120px; top: 482px; }
#neverRead { position: absolute; left: 812px; top: 482px; color: var(--stale); }
#ev-a_lock   { position: absolute; left: 120px; top: 560px; width: 700px; height: 92px; }
#ev-a_lock i { position: absolute; left: 0; top: 0; width: 440px; height: 4px;
               background: var(--boundary); transform-origin: left center; }
#ev-a_lock span { position: absolute; left: 480px; top: 42px; color: var(--boundary); white-space: nowrap; }
#ev-a_unlock { position: absolute; left: 600px; top: 664px; color: var(--ink-dim); white-space: nowrap; }
#waiting     { position: absolute; left: 372px; top: 626px; color: var(--stale); white-space: nowrap; }

/* --- a read is a rail: the route a copy took out of the row --------------- */
.read       { position: absolute; width: 13px; }
.readnode   { position: absolute; width: 13px; height: 13px; }
.readnode .node { position: absolute; left: -6px; top: -6px; width: 13px; height: 13px; background: var(--ink-mid); }  /* needs a real box: a 0x0 wrapper never counts as visible */
.read .node { position: absolute; left: -6px; top: -6px; width: 13px; height: 13px; background: var(--ink-mid); }
.read .rail { position: absolute; left: 0; top: 0; width: var(--hair);
              background: var(--rule-bright); transform-origin: top center; }

/* --- a value in flight ---------------------------------------------------- */
.site      { position: absolute; }
.site .who { position: absolute; top: -74px; left: 0; white-space: nowrap; }
.roll      { position: relative; height: 112px; }
.rv        { position: absolute; left: 0; top: 0; font-family: var(--font-value); font-weight: 600;
             font-size: 96px; line-height: 1; letter-spacing: -.02em; color: var(--ink); }
.basis     { position: absolute; top: 128px; left: 0; font-family: var(--font-value);
             font-size: 26px; color: var(--ink-dim); white-space: nowrap; }
.op        { position: absolute; font-family: var(--font-value); font-size: 48px; color: var(--ink-mid); }

/* --- the reckoning -------------------------------------------------------- */
.tally        { position: absolute; top: 1456px; display: flex; align-items: flex-end; gap: 20px; }
.tally .n     { font-family: var(--font-value); font-weight: 600; font-size: 72px; line-height: 1; }
.tally .k     { position: absolute; top: -48px; left: 0; white-space: nowrap; }
#should   .n  { color: var(--boundary); }
#lostMark .n  { color: var(--lost); }
#lostMark .tag{ font-family: var(--font-label); font-size: 26px; letter-spacing: var(--track-label);
                text-transform: uppercase; color: var(--boundary); padding-bottom: 10px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="13"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="13" data-track-index="0">

    <div id="boundary"></div>
    <div id="reckon"></div>
    <div id="rowLabel" class="label">inventory &middot; row 4471</div>

    <div id="ledger">
      <div class="lv" id="ledgerV0"><span class="n">100</span><span class="v">v0</span></div>
      <div class="lv" id="ev-a_write"><span class="n">90</span><span class="v">v1</span></div>
      <div class="lv" id="ev-b_write"><span class="n">70</span><span class="v">v2</span></div>
    </div>

    <div id="ev-a_lock"><i></i><span class="label">locked by a</span></div>
    <div id="ev-a_unlock" class="label">lock released</div>
    <div id="waiting" class="label">waiting</div>
    <div id="supLabel"  class="label">superseded</div>
    <div id="neverRead" class="label">never read</div>

    <!-- two rails from beneath one figure. that is the whole shot. -->
    <div class="read" id="ev-a_read" style="left: 170px; top: 560px; height: 140px;">
      <span class="node"></span><span class="rail" style="height: 140px"></span>
    </div>
    <div id="ev-b_lock" class="readnode" style="left: 340px; top: 560px;"><span class="node"></span></div>
    <div class="read" id="ev-b_read" style="left: 340px; top: 560px; height: 510px;">
      <span class="rail" style="height: 510px"></span>
    </div>

    <div class="site" id="copyA" style="left: 120px; top: 580px;">
      <div class="who label">request a</div>
      <div class="roll" data-layout-allow-overlap>
        <div class="rv" id="a-v100">100</div>
        <div class="rv" id="a-v90">90</div>
      </div>
      <div class="basis" id="a-basis">read at v0</div>
      <div class="op" id="a-op" style="left: 262px; top: 30px;">&minus;10</div>
    </div>

    <div class="site" id="copyB" style="left: 310px; top: 580px;">
      <div class="who label">request b</div>
      <div class="roll" data-layout-allow-overlap>
        <div class="rv" id="b-v90">90</div>
        <div class="rv" id="b-v70">70</div>
      </div>
      <div class="basis" id="b-basis">read at v1</div>
      <div class="op" id="b-op" style="left: 262px; top: 30px;">&minus;20</div>
    </div>

    <div class="tally" id="should"   style="left: 120px;">
      <span class="k label">final</span><span class="n">70</span>
    </div>
    <div class="tally" id="lostMark" style="left: 560px;">
      <span class="k label">work discarded</span><span class="n">0</span><span class="tag">nothing lost</span>
    </div>

  </div>
</div>

<script>
/* SHOT 04 — deliberately the same frame as SHOT 02. Same ledger slot, same rails,
   same in-flight sites, same rhythm. The only thing the viewer can notice changing
   is the mechanism, because nothing else changed. The silhouette diagnostic is
   expected to flag this against shot_02; that flag is the intent, not a defect. */
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out', T = 'power2.inOut';

gsap.set(['#ev-a_write', '#ev-b_write', '#ev-a_read', '#ev-b_read', '#supLabel', '#neverRead',
          '#b-v70', '#a-v90', '#a-op', '#b-op', '#should', '#lostMark',
          '#copyA', '#copyB', '#copyA .who', '#copyB .who', '#rowLabel',
          '#ev-a_lock', '#ev-a_unlock', '#waiting', '#ev-b_lock'], { opacity: 0 });
gsap.set(['#boundary', '#reckon'], { scaleX: 0 });
gsap.set(['#ev-a_read .rail', '#ev-b_read .rail'], { scaleY: 0 });
gsap.set('#ev-a_lock i', { scaleX: 0 });

/* ---- 0.0-1.0  an identical opening ------------------------------------- */
tl.to('#boundary', { scaleX: 1, duration: .70, ease: R }, 0.10)
  .to('#reckon',   { scaleX: 1, duration: .70, ease: R }, 0.30)
  .to('#rowLabel', { opacity: 1, duration: .40, ease: R }, 0.20)
  .fromTo('#ledgerV0', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .55, ease: R }, 0.40);

/* ---- 1.13  A TAKES THE LOCK --------------------------------------------
   The boundary itself closes. Nothing can be extracted through a closed one. */
tl.to('#ev-a_lock', { opacity: 1, duration: .25, ease: R }, 1.125)
  .to('#ev-a_lock i', { scaleX: 1, duration: .50, ease: R }, 1.14);

/* ---- 2.50  A READS, through the boundary it is holding ----------------- */
tl.to('#ev-a_read', { opacity: 1, duration: .25, ease: R }, 2.50)
  .to('#ev-a_read .rail', { scaleY: 1, duration: .40, ease: R }, 2.52)
  .to('#copyA .who', { opacity: 1, duration: .30, ease: R }, 2.76)
  .to('#copyA', { opacity: 1, duration: .30, ease: 'none' }, 2.84)
  .to('#copyA', { y: 210, duration: .62, ease: T }, 2.84);

/* ---- 3.25  B ARRIVES AND STOPS ----------------------------------------
   The node appears on the boundary and NO rail grows from it. In shot 02 this
   is the exact moment a second copy was taken. Here nothing is taken at all. */
tl.to('#ev-b_lock', { opacity: 1, duration: .25, ease: R }, 3.25)
  .to('#waiting',   { opacity: 1, duration: .32, ease: R }, 3.42);

/* ---- 4.6-5.3  A computes on the only copy in existence ----------------- */
tl.to('#a-op',   { opacity: 1, duration: .30, ease: R }, 4.58)
  .to('#a-v100', { opacity: 0, y: -36, duration: .42, ease: R }, 4.80)
  .fromTo('#a-v90', { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: .42, ease: R }, 4.88)
  .to('#a-op',   { opacity: 0, duration: .30 }, 5.30);

/* ---- 5.4-6.1  A WRITES ------------------------------------------------- */
tl.to('#copyA', { y: 0, duration: .62, ease: T }, 5.36)
  .to('#copyA .who', { opacity: 0, duration: .28 }, 5.60)
  .to('#copyA', { opacity: 0, scale: .90, duration: .20, ease: 'power2.in' }, 5.86)
  .to('#ledgerV0', { x: 400, scale: .28, duration: .26, ease: T }, 5.84)
  .to('#ledgerV0', { y: 250, duration: .30, ease: T }, 6.10)
  .to('#ledgerV0 .n', { color: 'var(--lost)', duration: .34 }, 5.84)
  .to('#ledgerV0 .v', { opacity: 0, duration: .30 }, 6.10)
  .to('#supLabel', { opacity: 1, duration: .35, ease: R }, 6.30)
  .fromTo('#ev-a_write', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .40, ease: R }, 6.02)
  .to('#ev-a_read', { opacity: 0, duration: .45 }, 6.14);

/* ---- 7.25  THE BOUNDARY OPENS ----------------------------------------- */
tl.to('#ev-a_lock i', { scaleX: 0, duration: .45, ease: R }, 7.25)
  .to('#ev-a_lock span', { opacity: 0, duration: .30 }, 7.25)
  .to('#ev-a_unlock', { opacity: 1, duration: .35, ease: R }, 7.28)
  .to('#waiting', { opacity: 0, duration: .35 }, 7.40);

/* ---- 9.00  B READS, and takes 90 because that is what is there --------
   Same rail, same site, same descent as shot 02. Different number.        */
tl.to('#ev-b_read', { opacity: 1, duration: .20, ease: R }, 9.00)
  .to('#ev-b_read .rail', { scaleY: 1, duration: .58, ease: R }, 9.02)
  .to('#copyB .who', { opacity: 1, duration: .30, ease: R }, 9.24)
  .to('#copyB', { opacity: 1, duration: .30, ease: 'none' }, 9.32)
  .to('#copyB', { y: 580, duration: .90, ease: T }, 9.32);

/* ---- 10.2-10.9  B computes on the current value ----------------------- */
tl.to('#b-op',  { opacity: 1, duration: .30, ease: R }, 10.18)
  .to('#b-v90', { opacity: 0, y: -36, duration: .42, ease: R }, 10.38)
  .fromTo('#b-v70', { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: .42, ease: R }, 10.46)
  .to('#b-op',  { opacity: 0, duration: .30 }, 10.88);

/* ---- 10.9-11.6  B WRITES over nothing -------------------------------- */
tl.to('#copyB', { y: 0, duration: .58, ease: T }, 10.92)
  .to('#copyB .who', { opacity: 0, duration: .28 }, 11.10)
  .to('#copyB', { opacity: 0, scale: .90, duration: .20, ease: 'power2.in' }, 11.30)
  .to('#ev-a_write', { x: 580, scale: .28, duration: .26, ease: T }, 11.28)
  .to('#ev-a_write', { y: 250, duration: .30, ease: T }, 11.54)
  .to('#ev-a_write .n', { color: 'var(--lost)', duration: .34 }, 11.28)
  .to('#ev-a_write .v', { opacity: 0, duration: .30 }, 11.54)
  .fromTo('#ev-b_write', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .40, ease: R }, 11.50)
  .to(['#ev-b_read', '#ev-b_lock'], { opacity: 0, duration: .45 }, 11.62);

/* ---- 11.9-13.0  the same reckoning band, a different reckoning ------- */
tl.fromTo('#lostMark', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .48, ease: R }, 11.94)
  .fromTo('#should',   { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .52, ease: R }, 12.30);

window.__timelines['main'] = tl;
</script>
</body>
</html>
