<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="15">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern>
    <clipPath id="boxHole"><rect x="1010" y="230" width="640" height="520" rx="14"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#0E1317"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- ===== terminal ===== -->
  <g id="terminal">
    <rect x="140" y="260" width="720" height="560" rx="14" fill="#0E1317"/>
    <rect x="128" y="248" width="720" height="560" rx="14" fill="#141C21" stroke="#F2F5F4" stroke-width="4"/>
    <rect x="128" y="248" width="720" height="52" rx="14" fill="#F2F5F4"/><rect x="128" y="286" width="720" height="14" fill="#F2F5F4"/>
    <circle cx="164" cy="274" r="9" fill="#0E1317"/><circle cx="192" cy="274" r="9" fill="#7C8A8E"/><circle cx="220" cy="274" r="9" fill="#85DDCB"/>
    <text x="488" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#0E1317">eve dev --no-ui</text>
    <g font-size="26" fill="#F2F5F4">
      <text class="ln" id="ln1" x="168" y="350" opacity="0">[process_batch] <tspan fill="#8DCF6E">paso 1</tspan> · pid 96343</text>
      <text class="ln" id="ln2" x="168" y="394" opacity="0">[process_batch] <tspan fill="#8DCF6E">paso 2</tspan> · pid 96343</text>
      <text class="ln" id="ln3" x="168" y="438" opacity="0">[process_batch] <tspan fill="#8DCF6E">paso 3</tspan> · pid 96343</text>
      <text class="ln" id="lnkill" x="168" y="500" opacity="0" fill="#85DDCB">$ pkill -9 -f "eve dev"</text>
      <text class="ln" id="lndead" x="168" y="544" opacity="0" fill="#7C8A8E">[1] killed</text>
      <text class="ln" id="lnstart" x="168" y="606" opacity="0" fill="#85DDCB">$ npx eve dev --no-ui</text>
      <text class="ln" id="ln4" x="168" y="668" opacity="0">[process_batch] <tspan fill="#8DCF6E">paso 4</tspan> · pid 97510</text>
      <text class="ln" id="ln5" x="168" y="712" opacity="0">[process_batch] <tspan fill="#8DCF6E">paso 5</tspan> · pid 97510</text>
      <text class="ln" id="ln6" x="168" y="756" opacity="0">[process_batch] <tspan fill="#8DCF6E">paso 6</tspan> · pid 97510</text>
    </g>
    <rect id="cursor" x="168" y="330" width="16" height="30" fill="#F2F5F4"/>
  </g>

  <!-- ===== caja ===== -->
  <g id="box">
    <rect x="1016" y="236" width="660" height="580" rx="16" fill="#0E1317"/>
    <polygon points="1000,220 1040,180 1700,180 1660,220" fill="#37AB93" stroke="#F2F5F4" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="1660,220 1700,180 1700,760 1660,800" fill="#2C8C79" stroke="#F2F5F4" stroke-width="4" stroke-linejoin="round"/>
    <rect id="boxfront" x="1000" y="220" width="660" height="580" rx="16" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
    <g stroke="#F2F5F4" stroke-width="3">
      <circle class="lamp" cx="1040" cy="770" r="9" fill="#8DCF6E"/><circle class="lamp" cx="1070" cy="770" r="9" fill="#8DCF6E"/><circle class="lamp" cx="1100" cy="770" r="9" fill="#F2F5F4"/>
    </g>
    <text id="boxlbl" x="1620" y="778" text-anchor="end" font-size="20" font-weight="700" fill="#0E1317">sb_af93 · on</text>
    <rect x="1010" y="230" width="640" height="520" rx="14" fill="#0E1317"/>
    <g clip-path="url(#boxHole)">
      <rect x="1010" y="640" width="640" height="120" fill="#1C262B"/>
      <rect x="1140" y="560" width="400" height="18" rx="4" fill="#F2F5F4"/>
      <rect x="1160" y="578" width="14" height="80" fill="#F2F5F4"/><rect x="1506" y="578" width="14" height="80" fill="#F2F5F4"/>
      <g class="chip" id="chip1"><rect x="1150" y="500" width="56" height="56" rx="8" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="3"/><text x="1178" y="540" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">1</text></g><g class="chip" id="chip2"><rect x="1216" y="500" width="56" height="56" rx="8" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="3"/><text x="1244" y="540" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">2</text></g><g class="chip" id="chip3"><rect x="1282" y="500" width="56" height="56" rx="8" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="3"/><text x="1310" y="540" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">3</text></g><g class="chip" id="chip4"><rect x="1348" y="500" width="56" height="56" rx="8" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="3"/><text x="1376" y="540" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">4</text></g><g class="chip" id="chip5"><rect x="1414" y="500" width="56" height="56" rx="8" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="3"/><text x="1442" y="540" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">5</text></g><g class="chip" id="chip6"><rect x="1480" y="500" width="56" height="56" rx="8" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="3"/><text x="1508" y="540" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">6</text></g>
      <!-- Ghosty: grupo limpio para GSAP (svgOrigin absoluto) -->
      <g id="ghosty"><image xlink:href="assets/ghosty.png" x="1230" y="268" width="200" height="232" preserveAspectRatio="xMidYMid meet"/></g>
      <!-- ficha en la mano: se reutiliza para 1,2,3 y 4,5,6 -->
      <g id="hand"><rect id="handrect" x="1372" y="422" width="56" height="56" rx="8" fill="#85DDCB" stroke="#F2F5F4" stroke-width="3"/><text id="handnum" x="1400" y="462" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">1</text></g>
      <!-- escarcha -->
      <g id="frost" fill="#DDF4F0">
        <polygon id="fr1" points="1010,230 1090,230 1060,262 1130,246 1100,290 1010,300"/>
        <polygon id="fr2" points="1650,230 1570,230 1600,268 1540,256 1580,304 1650,310"/>
        <polygon id="fr3" points="1010,750 1010,680 1050,720 1070,690 1100,750"/>
        <polygon id="fr4" points="1650,750 1650,670 1610,716 1590,690 1560,750"/>
        <g id="flakes"><circle cx="1120" cy="340" r="5"/><circle cx="1540" cy="380" r="4"/><circle cx="1480" cy="300" r="6"/><circle cx="1180" cy="440" r="4"/><circle cx="1600" cy="600" r="5"/></g>
      </g>
    </g>
    <rect x="1010" y="230" width="640" height="520" rx="14" fill="none" stroke="#F2F5F4" stroke-width="4"/>
  </g>

  <!-- ===== etiqueta ===== -->
  <g id="label">
    <rect x="1008" y="868" width="440" height="64" rx="12" fill="#0E1317"/>
    <rect x="1000" y="860" width="440" height="64" rx="12" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
    <text id="labeltxt" x="1220" y="903" text-anchor="middle" font-size="30" font-weight="900" fill="#0E1317">trabajando</text>
  </g>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const chipX = (n) => 1150 + [0, 66, 132, 198, 264, 330][n];

      // estado inicial (fotograma 0 completo: caja encendida, Ghosty con la ficha 1 en la mano)
      tl.set("#frost polygon, #flakes circle", { scale: 0, transformOrigin: "50% 50%" }, 0);
      tl.set("#ghosty", { rotation: -6, svgOrigin: "1330 400" }, 0);
      tl.set("#hand", { rotation: 14, svgOrigin: "1400 450" }, 0);

      // Ghosty se mece mientras trabaja (bucle finito)
      tl.to("#ghosty", { rotation: 6, svgOrigin: "1330 400", duration: .6, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0);
      tl.to("#cursor", { opacity: 0, duration: .3, yoyo: true, repeat: 40, ease: "none" }, 0);

      // coloca ficha n en la mesa: la mano baja, la ficha de la mesa se pinta verde, línea en la terminal
      // la mano baja en línea recta (sólo x/y, la rotación no cambia durante el tween: sin vibración)
      const place = (n, t, yLine) => {
        tl.to("#hand", { x: chipX(n - 1) - 1372, y: 78, duration: .35, ease: "power2.in" }, t);
        tl.to("#chip" + n + " rect", { fill: "#8DCF6E", duration: .15 }, t + .35);
        tl.set("#hand", { opacity: 0 }, t + .35);
        tl.set("#hand", { x: 0, y: 0 }, t + .36);
        tl.set("#handnum", { textContent: String(n + 1) }, t + .36);
        tl.to("#hand", { opacity: 1, duration: .15 }, t + .45);
        tl.to("#ln" + n, { opacity: 1, duration: .05 }, t + .35);
        tl.to("#cursor", { attr: { y: yLine }, duration: .01 }, t + .35);
      };
      place(1, 1.2, 374); place(2, 2.4, 418); place(3, 3.6, 480);

      // kill: se escribe el comando, la caja se apaga, Ghosty queda a medio movimiento con la 4
      tl.to("#lnkill", { opacity: 1, duration: .05 }, 5.2);
      tl.to("#cursor", { attr: { y: 524 }, duration: .01 }, 5.2);
      tl.to("#lndead", { opacity: 1, duration: .05 }, 5.55); tl.to("#cursor", { attr: { y: 580 }, duration: .01 }, 5.55);
      tl.to("#ghosty", { rotation: -8, svgOrigin: "1330 400", duration: .12, ease: "none", overwrite: "auto" }, 5.5);
      tl.to("#boxfront", { fill: "#3E5A5C", duration: .12 }, 5.6000000000000005);
      tl.to(".lamp", { fill: "#7C8A8E", duration: .1, stagger: .06 }, 5.6000000000000005);
      tl.set("#boxlbl", { textContent: "sb_af93 · off", fill: "#F2F5F4" }, 5.7);
      tl.to("#labeltxt", { opacity: 0, duration: .1 }, 5.6000000000000005);
      tl.set("#labeltxt", { textContent: "congelado en el paso 4" }, 5.7);
      tl.to("#labeltxt", { opacity: 1, duration: .1 }, 5.9);
      tl.to("#frost polygon", { scale: 1, duration: .5, stagger: .1, ease: "power2.out" }, 5.9);
      tl.to("#flakes circle", { scale: 1, duration: .3, stagger: .08, ease: "back.out(2)" }, 6.2);

      // reinicio: comando nuevo, lámparas, escarcha se va, Ghosty suelta la 4 y sigue
      tl.to("#lnstart", { opacity: 1, duration: .05 }, 9);
      tl.to("#cursor", { attr: { y: 630 }, duration: .01 }, 9);
      tl.to("#boxfront", { fill: "#85DDCB", duration: .2 }, 9.5);
      tl.to(".lamp", { fill: (i) => (i === 2 ? "#F2F5F4" : "#8DCF6E"), duration: .1, stagger: .08 }, 9.5);
      tl.set("#boxlbl", { textContent: "sb_af93 · on", fill: "#0E1317" }, 9.6);
      tl.to("#frost polygon, #flakes circle", { scale: 0, duration: .5, stagger: .04, ease: "power2.in" }, 9.6);
      tl.to("#labeltxt", { opacity: 0, duration: .1 }, 9.6);
      tl.set("#labeltxt", { textContent: "sigue en el paso 4" }, 9.7);
      tl.to("#labeltxt", { opacity: 1, duration: .1 }, 9.8);
      tl.to("#ghosty", { rotation: 6, svgOrigin: "1330 400", duration: .6, yoyo: true, repeat: 7, ease: "sine.inOut" }, 9.8);
      // fichas 4, 5, 6: la 4 va al hueco entre 3 y 5
      const place2 = (n, t, yLine) => {
        tl.to("#hand", { x: chipX(n - 1) - 1372, y: 78, duration: .35, ease: "power2.in" }, t);
        tl.to("#chip" + n + " rect", { fill: "#8DCF6E", duration: .15 }, t + .35);
        tl.set("#hand", { opacity: 0 }, t + .35);
        tl.set("#hand", { x: 0, y: 0 }, t + .36);
        tl.set("#handnum", { textContent: String(n + 1) }, t + .36);
        if (n < 6) tl.to("#hand", { opacity: 1, duration: .15 }, t + .45);
        tl.to("#ln" + n, { opacity: 1, duration: .05 }, t + .35);
        tl.to("#cursor", { attr: { y: yLine }, duration: .01 }, t + .35);
      };
      place2(4, 10.3, 692); place2(5, 11.5, 736); place2(6, 12.7, 780);
      tl.to("#labeltxt", { opacity: 0, duration: .1 }, 13.2);
      tl.set("#labeltxt", { textContent: "6 de 6 · sin repetir" }, 13.299999999999999);
      tl.to("#labeltxt", { opacity: 1, duration: .1 }, 13.399999999999999);
      tl.set({}, {}, 15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
