<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #090b12; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(135deg, #111827 0%, #090b12 50%, #1e1b4b 100%);
      }
      .panel {
        position: absolute; width: 420px; height: 540px; border-radius: 28px;
        transform-origin: 50% 50%;
      }
      .p1 { left: 980px; top: 220px; background: linear-gradient(160deg, #22d3ee, #2563eb); }
      .p2 { left: 1120px; top: 280px; background: linear-gradient(160deg, #a78bfa, #db2777); opacity: 0.9; }
      .p3 { left: 1260px; top: 340px; background: linear-gradient(160deg, #fbbf24, #f97316); opacity: 0.85; }
      .copy { position: absolute; left: 140px; top: 340px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(251, 191, 36, 0.9); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); max-width: 720px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="p1" class="clip panel p1" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="p2" class="clip panel p2" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="p3" class="clip panel p3" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="3">
        <div class="eyebrow">UI2V · Color</div>
        <div class="title">Prism Fold</div>
        <div class="sub">Layered planes that fold into depth</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#p1", { x: 180, rotationY: -40, opacity: 0 });
      gsap.set("#p2", { x: 240, rotateY: -50, opacity: 0 });
      gsap.set("#p3", { x: 300, rotateY: -60, opacity: 0 });
      gsap.set("#copy", { opacity: 0, y: 28 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 24 });
      gsap.set(".sub", { opacity: 0, y: 16 });
      tl.to("#p1", { x: 0, rotateY: -8, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.1)
        .to("#p2", { x: 0, rotateY: -14, opacity: 0.92, duration: 0.95, ease: "power3.out" }, 0.25)
        .to("#p3", { x: 0, rotateY: -20, opacity: 0.88, duration: 1.0, ease: "power3.out" }, 0.4)
        .to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.5)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.5)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.65)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.9)
        .to("#p1", { x: -20, rotateY: 4, duration: 2.4, ease: "sine.inOut" }, 1.5)
        .to("#p2", { x: 10, rotateY: -6, duration: 2.4, ease: "sine.inOut" }, 1.5)
        .to("#p3", { x: 30, rotateY: -12, duration: 2.4, ease: "sine.inOut" }, 1.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
