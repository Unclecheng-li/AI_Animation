<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
      /* recetas CSS de motion-anything (Animate.css): seek-safe. Sobre SVG: transform-box fill-box. */
      @keyframes tada {
  from {
    transform: scale3d(1, 1, 1);
  }

  10%,
  20% {
    transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
  }

  30%,
  50%,
  70%,
  90% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
  }

  40%,
  60%,
  80% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes jello {
  from,
  11.1%,
  to {
    transform: translate3d(0, 0, 0);
  }

  22.2% {
    transform: skewX(-12.5deg) skewY(-12.5deg);
  }

  33.3% {
    transform: skewX(6.25deg) skewY(6.25deg);
  }

  44.4% {
    transform: skewX(-3.125deg) skewY(-3.125deg);
  }

  55.5% {
    transform: skewX(1.5625deg) skewY(1.5625deg);
  }

  66.6% {
    transform: skewX(-0.78125deg) skewY(-0.78125deg);
  }

  77.7% {
    transform: skewX(0.390625deg) skewY(0.390625deg);
  }

  88.8% {
    transform: skewX(-0.1953125deg) skewY(-0.1953125deg);
  }
}
@keyframes bounce {
  from,
  20%,
  53%,
  to {
    animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0);
  }

  40%,
  43% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -30px, 0) scaleY(1.1);
  }

  70% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -15px, 0) scaleY(1.05);
  }

  80% {
    transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0) scaleY(0.95);
  }

  90% {
    transform: translate3d(0, -4px, 0) scaleY(1.02);
  }
}
@keyframes headShake {
  0% {
    transform: translateX(0);
  }

  6.5% {
    transform: translateX(-6px) rotateY(-9deg);
  }

  18.5% {
    transform: translateX(5px) rotateY(7deg);
  }

  31.5% {
    transform: translateX(-3px) rotateY(-5deg);
  }

  43.5% {
    transform: translateX(2px) rotateY(3deg);
  }

  50% {
    transform: translateX(0);
  }
}
@keyframes rubberBand {
  from {
    transform: scale3d(1, 1, 1);
  }

  30% {
    transform: scale3d(1.25, 0.75, 1);
  }

  40% {
    transform: scale3d(0.75, 1.25, 1);
  }

  50% {
    transform: scale3d(1.15, 0.85, 1);
  }

  65% {
    transform: scale3d(0.95, 1.05, 1);
  }

  75% {
    transform: scale3d(1.05, 0.95, 1);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes swing {
  20% {
    transform: rotate3d(0, 0, 1, 15deg);
  }

  40% {
    transform: rotate3d(0, 0, 1, -10deg);
  }

  60% {
    transform: rotate3d(0, 0, 1, 5deg);
  }

  80% {
    transform: rotate3d(0, 0, 1, -5deg);
  }

  to {
    transform: rotate3d(0, 0, 1, 0deg);
  }
}
@keyframes wobble {
  from {
    transform: translate3d(0, 0, 0);
  }

  15% {
    transform: translate3d(-25%, 0, 0) rotate3d(0, 0, 1, -5deg);
  }

  30% {
    transform: translate3d(20%, 0, 0) rotate3d(0, 0, 1, 3deg);
  }

  45% {
    transform: translate3d(-15%, 0, 0) rotate3d(0, 0, 1, -3deg);
  }

  60% {
    transform: translate3d(10%, 0, 0) rotate3d(0, 0, 1, 2deg);
  }

  75% {
    transform: translate3d(-5%, 0, 0) rotate3d(0, 0, 1, -1deg);
  }

  to {
    transform: translate3d(0, 0, 0);
  }
}

      .anim { transform-box: fill-box; transform-origin: 50% 50%; animation-fill-mode: both; animation-timing-function: ease; }
      
    #instance1-ghost-gone { animation: jello 1.2s .5s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #instance2-ghost { animation: tada 1s 9.6s both, bounce 1.1s 12.2s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #postgres-body { animation: rubberband .9s 3.9s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #chip4 { animation: bounce 1s 10.4s both; transform-box: fill-box; transform-origin: 50% 100%; }
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="14">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0E1317"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <g id="title">
    <text x="960" y="110" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">El estado sale del proceso</text>
    <text x="960" y="160" text-anchor="middle" font-size="28" fill="#85DDCB">cada step es un checkpoint en Postgres; una instancia nueva lo lee y reanuda</text>
  </g>

  <!-- ===== Instancia 1: proceso terminado ===== -->
  <g id="instance1">
    <rect x="130" y="300" width="460" height="420" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="130" y="300" width="460" height="420" rx="16" fill="#141C21" stroke="#7C8A8E" stroke-width="4"/>
    <rect x="130" y="300" width="460" height="56" rx="16" fill="#7C8A8E"/>
    <rect x="130" y="340" width="460" height="16" fill="#7C8A8E"/>
    <text x="360" y="338" text-anchor="middle" font-size="24" font-weight="900" fill="#0E1317">instancia 1 · pid 1664</text>
    <g id="instance1-log" font-size="28" fill="#7C8A8E">
      <text x="170" y="420">step 1 ✓</text>
      <text x="170" y="470">step 2 ✓</text>
      <text x="170" y="520">step 3 ✓</text>
      <text x="170" y="590" fill="#F2F5F4">kill -9</text>
    </g>
    <g id="instance1-ghost-gone" opacity="0.25">
      <image xlink:href="assets/ghosty.png" x="400" y="440" width="150" height="175" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <text x="360" y="770" text-anchor="middle" font-size="26" font-weight="900" fill="#7C8A8E">proceso terminado</text>
  </g>

  <!-- ===== Postgres: base de datos compartida (cilindro) ===== -->
  <g id="postgres">
    <g id="postgres-body">
      <ellipse cx="960" cy="730" rx="200" ry="40" fill="#0E1317" transform="translate(12,12)"/>
      <rect x="760" y="400" width="400" height="330" fill="#37AB93" stroke="#F2F5F4" stroke-width="5"/>
      <ellipse cx="960" cy="730" rx="200" ry="40" fill="#37AB93" stroke="#F2F5F4" stroke-width="5"/>
      <ellipse cx="960" cy="400" rx="200" ry="40" fill="#85DDCB" stroke="#F2F5F4" stroke-width="5"/>
    </g>
    <!-- tablas como filas dentro del cilindro -->
    <g id="table-runs">
      <rect x="800" y="460" width="320" height="52" rx="8" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
      <text x="820" y="495" font-size="26" font-weight="900" fill="#0E1317">workflow_runs</text>
    </g>
    <g id="table-steps">
      <rect x="800" y="524" width="320" height="96" rx="8" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
      <text x="820" y="559" font-size="26" font-weight="900" fill="#0E1317">workflow_steps</text>
      <g id="step-rows" font-size="22" font-weight="900" text-anchor="middle" fill="#0E1317">
        <rect id="row1" x="820" y="574" width="34" height="34" rx="6" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="3"/><text x="837" y="599">1</text>
        <rect id="row2" x="860" y="574" width="34" height="34" rx="6" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="3"/><text x="877" y="599">2</text>
        <rect id="row3" x="900" y="574" width="34" height="34" rx="6" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="3"/><text x="917" y="599">3</text>
      </g>
    </g>
    <g id="table-events">
      <rect x="800" y="632" width="320" height="52" rx="8" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
      <text x="820" y="667" font-size="26" font-weight="900" fill="#0E1317">workflow_events</text>
    </g>
    <text x="960" y="810" text-anchor="middle" font-size="26" font-weight="900" fill="#85DDCB">Postgres · estado durable</text>
  </g>

  <!-- ===== Instancia 2: reanuda ===== -->
  <g id="instance2">
    <rect x="1330" y="300" width="460" height="420" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="1330" y="300" width="460" height="420" rx="16" fill="#141C21" stroke="#85DDCB" stroke-width="4"/>
    <rect x="1330" y="300" width="460" height="56" rx="16" fill="#85DDCB"/>
    <rect x="1330" y="340" width="460" height="16" fill="#85DDCB"/>
    <text x="1560" y="338" text-anchor="middle" font-size="24" font-weight="900" fill="#0E1317">instancia 2 · pid 2327</text>
    <g id="instance2-log" font-size="28" fill="#7C8A8E">
      <text x="1370" y="420">step 1 · leído</text>
      <text x="1370" y="470">step 2 · leído</text>
      <text x="1370" y="520">step 3 · leído</text>
      <text x="1370" y="590" fill="#8DCF6E" font-weight="900">step 4 ▶</text>
    </g>
    <g id="instance2-ghost">
      <image xlink:href="assets/ghosty.png" x="1630" y="410" width="150" height="175" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <g id="chip4">
      <rect x="1596" y="600" width="56" height="56" rx="8" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
      <text x="1624" y="640" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">4</text>
    </g>
    <text x="1560" y="770" text-anchor="middle" font-size="26" font-weight="900" fill="#85DDCB">reanuda en el step 4</text>
  </g>

  <!-- ===== Flechas (animables con stroke-dashoffset) ===== -->
  <g id="arrow-checkpoint" fill="none" stroke="#F2F5F4" stroke-width="6" stroke-linecap="round">
    <path d="M600,470 C680,470 700,520 750,520"/>
    <polygon points="760,520 738,506 738,534" fill="#F2F5F4" stroke="none"/>
  </g>
  <text x="675" y="440" text-anchor="middle" font-size="22" font-weight="900" fill="#F2F5F4">checkpoint</text>
  <g id="arrow-resume" fill="none" stroke="#8DCF6E" stroke-width="6" stroke-linecap="round">
    <path d="M1170,520 C1230,520 1250,470 1320,470"/>
    <polygon points="1330,470 1308,456 1308,484" fill="#8DCF6E" stroke="none"/>
  </g>
  <text x="1245" y="440" text-anchor="middle" font-size="22" font-weight="900" fill="#8DCF6E">reanudar</text>

  <g id="footer">
    <text x="960" y="900" text-anchor="middle" font-size="26" fill="#7C8A8E">world local: el estado vivía en el disco del proceso (.eve/.workflow-data)</text>
    <text x="960" y="944" text-anchor="middle" font-size="26" fill="#F2F5F4">world-postgres: el estado vive en la base; cualquier instancia lo lee</text>
  </g>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

    // fotograma 0 completo. Instancia 1 viva al inicio (Ghosty visible), las filas se escriben una a una
    tl.set("#instance1-ghost-gone", { opacity: 1 }, 0.01);
    tl.set("#instance2", { opacity: .55 }, 0.01);
    tl.set("#row1, #row2, #row3", { fill: "#D9D3C4" }, 0.01);
    draw("#arrow-checkpoint path", 1.2, .5);
    [1,2,3].forEach((n, i) => tl.to("#row" + n, { fill: "#8DCF6E", duration: .2 }, 2.0 + i * .8));
    // kill: instancia 1 se apaga, Ghosty se desvanece
    tl.to("#instance1-ghost-gone", { opacity: .25, duration: .4 }, 5.2);
    tl.to("#instance1", { opacity: .6, duration: .3 }, 5.4);
    // instancia 2 despierta, lee (parpadean las filas) y reanuda
    tl.to("#instance2", { opacity: 1, duration: .3 }, 7.0);
    tl.to("#row1, #row2, #row3", { fill: "#85DDCB", duration: .15, stagger: .2, yoyo: true, repeat: 1 }, 7.6);
    draw("#arrow-resume path", 8.8, .5);
  
      tl.set({}, {}, 14);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
