  <div data-hf-id="hf-xwv5" id="root" data-composition-id="03-cascade" data-start="0" data-duration="6.5" data-width="1080" data-height="1080">

    <div data-hf-id="hf-fcti" id="f3-ground" class="f3-ground clip" data-start="0" data-duration="6.5" data-track-index="0"></div>

    <!-- approved frame video hoisted by assemble-index -->

    <div data-hf-id="hf-typh" class="f3-counter-wrap clip" id="f3-counter-wrap" data-start="0" data-duration="6.5" data-track-index="2">
      <span data-hf-id="hf-fbgz" class="f3-counter" id="f3-counter">2,400</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });
      const counter = document.getElementById("f3-counter");
      const state = { value: 2400 };
      const write = () => {
        counter.textContent = Math.round(state.value).toLocaleString("en-US");
      };

      // The longest frame and the one that carries the feeling. No text lands
      // here at all — the board emptying and the number spinning are the whole
      // shot. The acceleration is the engine's own: one ball at the start,
      // ~180 by the end as multiball compounds.
      //
      // Scene 1 (0.0-1.6s) the camera starts easing back (baked into the clip),
      // Scene 2 (1.6-4.2s) multiball compounds and the board visibly opens up,
      // Scene 3 (4.2-6.5s) the pull-back lands and the last few dozen go at once.
      //
      // The counter runs one continuous accelerating fall across all three so
      // there is no seam mid-frame; it stays unreadable throughout and hands
      // frame 4 a value close enough to zero that the landing reads as arrival.
      tl.to(state, { value: 120, duration: 6.5, ease: "power2.in", onUpdate: write }, 0);

      window.__timelines["03-cascade"] = tl;
    })();
  </script>
