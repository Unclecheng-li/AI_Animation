  <style>

    @font-face {

    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/Inter-700.ttf") format("truetype");

      font-weight: 700;
      font-display: swap;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      color: #f4f0e8;
      font-family: "Inter";
      font-synthesis: none;
      isolation: isolate;
    }

    [id="f01-one-brief-ground"] {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 5, 0);
    }

    [id="f01-one-brief-context-video"] {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
    }

    [id="f01-one-brief-context-overlay"] {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    [id="f01-one-brief-context-copy"] {
      position: absolute;
      left: 5cqw;
      top: 19cqh;
      width: 62cqw;
      margin: 0;
      color: #f4f0e8;
      font-size: 4.2cqw;
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    [id="f01-one-brief-composer-stage"] {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    [id="f01-one-brief-camera-outer"],
    [id="f01-one-brief-camera-inner"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    [id="f01-one-brief-camera-outer"] {
      transform-origin: 50% 50%;
    }

    [id="f01-one-brief-glass-window"] {
      position: absolute;
      left: 350px;
      top: 26px;
      width: 1220px;
      height: 820px;
      box-sizing: border-box;
      padding: 9px;
      overflow: hidden;
      border: 1.5px solid rgba(205, 186, 145, 0.2);
      border-radius: 14px;
      background: rgba(205, 186, 145, 0.055);
    }

    [id="f01-one-brief-composer-image"] {
      display: block;
      width: 1200px;
      height: 800px;
      border-radius: 10px;
      object-fit: contain;
    }

    [id="f01-one-brief-composer-target"] {
      position: absolute;
      left: 180px;
      top: 314px;
      width: 870px;
      height: 284px;
      pointer-events: none;
    }

    [id="f01-one-brief-edge-highlight"] {
      position: absolute;

      height: 2px;
      border-radius: 6px;
      background: linear-gradient(
        90deg,
        rgba(205, 186, 145, 0),
        rgba(205, 186, 145, 0.92),
        rgba(205, 186, 145, 0)
      );
      will-change: transform;
    }

    [id="f01-one-brief-outcome-line"] {
      position: absolute;
      left: 350px;
      top: 858px;
      width: 1220px;
      margin: 0;
      color: #cdba91;
      font-size: 1.4cqw;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.12em;
      text-align: center;
    }
  </style>

  <div id="root" data-composition-id="01-one-brief" data-width="1920" data-height="1080">
    <div
      id="f01-one-brief-ground"
      class="clip"
      data-start="0"
      data-duration="2.2"
      data-track-index="0"
    ></div>

    <!-- approved frame video hoisted by assemble-index -->

    <div
      id="f01-one-brief-context-overlay"
      class="clip"
      data-start="0"
      data-duration="0.72"
      data-track-index="3"
    >
      <p id="f01-one-brief-context-copy">AI VIDEO MOVES FAST.</p>
    </div>

    <div
      id="f01-one-brief-composer-stage"
      class="clip"
      data-start="0.72"
      data-duration="1.48"
      data-track-index="2"
    >
      <div id="f01-one-brief-camera-outer">
        <div id="f01-one-brief-camera-inner">
          <div id="f01-one-brief-glass-window">
            <img
              id="f01-one-brief-composer-image"
              src="assets/01-home.png"
              alt="CutSteward outcome composer"
            />
            <div id="f01-one-brief-composer-target" aria-hidden="true"></div>
            <div id="f01-one-brief-edge-highlight" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <p id="f01-one-brief-outcome-line">START WITH THE OUTCOME</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "01-one-brief";
      const cameraOuter = document.getElementById("f01-one-brief-camera-outer");
      const cameraInner = document.getElementById("f01-one-brief-camera-inner");
      const target = document.getElementById("f01-one-brief-composer-target");
      const contextCopy = document.getElementById("f01-one-brief-context-copy");
      const composerStage = document.getElementById("f01-one-brief-composer-stage");
      const outcomeLine = document.getElementById("f01-one-brief-outcome-line");
      const edgeHighlight = document.getElementById("f01-one-brief-edge-highlight");
      const ground = document.getElementById("f01-one-brief-ground");

      const canvasWidth = 1920;
      const canvasHeight = 1080;
      const targetBounds = target.getBoundingClientRect();
      const targetOffsetX = targetBounds.left + targetBounds.width / 2 - canvasWidth / 2;
      const targetOffsetY = targetBounds.top + targetBounds.height / 2 - canvasHeight / 2;
      const targetMaxScale = Math.min(
        (0.88 * canvasWidth) / targetBounds.width,
        (0.88 * canvasHeight) / targetBounds.height,
      );
      const zoomScale = Math.min(1.9, targetMaxScale);
      const counterX = -targetOffsetX;
      const counterY = -targetOffsetY;

      const tl = gsap.timeline({ paused: true });

      tl.set(ground, { backgroundColor: "#050505" }, 0.72);

      tl.fromTo(
        contextCopy,
        { autoAlpha: 0, y: 26 },
        { autoAlpha: 1, y: 0, duration: 0.36, ease: "power3.out" },
        0.08,
      );

      tl.fromTo(
        composerStage,
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.001, ease: "none" },
        0.72,
      );
      tl.fromTo(
        cameraOuter,
        { scale: zoomScale },
        { scale: 1, duration: 0.83, ease: "power3.out" },
        0.72,
      );
      tl.fromTo(
        cameraInner,
        { x: counterX, y: counterY },
        { x: 0, y: 0, duration: 0.83, ease: "power3.out" },
        0.72,
      );

      tl.fromTo(
        outcomeLine,
        { autoAlpha: 0, y: 10 },
        { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" },
        1.55,
      );
      tl.fromTo(
        edgeHighlight,
        { x: -260 },
        { x: 1240, duration: 0.55, ease: "power2.inOut" },
        1.6,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;
    })();
  </script>
