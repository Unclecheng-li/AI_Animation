<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #1f2937 0%, #111827 70%);
      }
      .copy {
        position: absolute; left: 0; right: 0; top: 160px; text-align: center;
        font-family: "Segoe UI", system-ui, sans-serif; color: #f9fafb;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase;
        color: #60a5fa; margin-bottom: 18px; font-weight: 600;
      }
      .title { font-size: 84px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 20px; font-size: 28px; color: #9ca3af; }
      .otp {
        position: absolute; left: 50%; top: 460px; transform: translateX(-50%);
        display: flex; gap: 24px;
      }
      .cell {
        width: 120px; height: 140px; border-radius: 20px;
        background: #1f2937; border: 2px solid #374151;
        display: grid; place-items: center;
        font-family: "Segoe UI", sans-serif; font-size: 64px; font-weight: 700; color: #f9fafb;
        box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      }
      .cell.on { border-color: #60a5fa; box-shadow: 0 0 0 6px rgba(96, 165, 250, 0.18); }
      .hint {
        position: absolute; left: 0; right: 0; bottom: 180px; text-align: center;
        font-family: "Segoe UI", sans-serif; font-size: 26px; color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Verify · Secure</div>
        <div class="title">OTP Fill</div>
        <div class="sub">One-time passcode cells fill digit by digit</div>
      </div>
      <div id="otp" class="clip otp" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="cell" id="c1"></div>
        <div class="cell" id="c2"></div>
        <div class="cell" id="c3"></div>
        <div class="cell" id="c4"></div>
        <div class="cell" id="c5"></div>
        <div class="cell" id="c6"></div>
      </div>
      <div id="hint" class="clip hint" data-start="0" data-duration="4.5" data-track-index="2">Code sent to ····4821</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const digits = ["8", "4", "2", "9", "1", "6"];
      const cells = ["#c1", "#c2", "#c3", "#c4", "#c5", "#c6"];
      gsap.set("#copy", { opacity: 0, y: 16 });
      gsap.set("#otp", { opacity: 0, y: 20 });
      gsap.set("#hint", { opacity: 0 });
      cells.forEach((sel) => gsap.set(sel, { opacity: 0.55 }));
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.5 }, 0.1)
        .to("#otp", { opacity: 1, y: 0, duration: 0.5 }, 0.3)
        .to("#hint", { opacity: 1, duration: 0.4 }, 0.5);
      digits.forEach((d, i) => {
        const sel = cells[i];
        const t = 0.95 + i * 0.35;
        tl.to(sel, { opacity: 1, duration: 0.01 }, t)
          .to({}, {
            duration: 0.01,
            onStart: () => {
              const el = document.querySelector(sel);
              el.textContent = d;
              el.classList.add("on");
              cells.forEach((other) => {
                if (other !== sel) document.querySelector(other).classList.remove("on");
              });
            }
          }, t);
      });
      tl.to({}, {
        duration: 0.01,
        onStart: () => {
          cells.forEach((sel) => document.querySelector(sel).classList.add("on"));
          document.getElementById("hint").textContent = "Verified · continuing";
          document.getElementById("hint").style.color = "#60a5fa";
        }
      }, 3.2)
        .to("#otp", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
