<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ecfdf5; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(165deg, #ecfdf5 0%, #d1fae5 45%, #f0fdf4 100%);
      }
      .copy {
        position: absolute; left: 140px; top: 300px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #064e3b;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #059669; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #047857; max-width: 520px; line-height: 1.45; }
      .drop {
        position: absolute; right: 160px; top: 200px; width: 780px; height: 680px;
        border: 3px dashed #34d399; border-radius: 32px; background: rgba(255,255,255,0.72);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; box-shadow: 0 24px 60px rgba(6, 78, 59, 0.1);
      }
      .drop.active { border-color: #059669; background: #fff; border-style: solid; }
      .icon {
        width: 120px; height: 120px; border-radius: 28px; background: #d1fae5;
        display: grid; place-items: center; color: #059669;
        font-family: "Segoe UI", sans-serif; font-size: 56px; font-weight: 700;
      }
      .drop h3 {
        font-family: "Segoe UI", sans-serif; font-size: 40px; color: #064e3b; font-weight: 700;
      }
      .drop p { font-family: "Segoe UI", sans-serif; font-size: 26px; color: #059669; }
      .file {
        position: absolute; width: 420px; background: #fff; border-radius: 18px;
        padding: 28px 30px; box-shadow: 0 18px 40px rgba(6, 78, 59, 0.16);
        border: 1px solid #a7f3d0; left: 180px; top: 120px;
        font-family: "Segoe UI", sans-serif;
      }
      .file strong { display: block; font-size: 28px; color: #064e3b; margin-bottom: 10px; }
      .file span { font-size: 22px; color: #6ee7b7; }
      .bar {
        margin-top: 18px; height: 10px; background: #d1fae5; border-radius: 999px; overflow: hidden;
      }
      .fill { height: 100%; width: 0%; background: #059669; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Assets · Import</div>
        <div class="title">Upload Drop</div>
        <div class="sub">Drag a package onto the zone and watch the fill bar complete.</div>
      </div>
      <div id="drop" class="clip drop" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="icon">↑</div>
        <h3>Drop package here</h3>
        <p>registry-item.json · index.html · assets/</p>
        <div class="file" id="file">
          <strong>hero-pack.zip</strong>
          <span id="pct">0% · uploading</span>
          <div class="bar"><div class="fill" id="fill"></div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pct = document.getElementById("pct");
      const drop = document.getElementById("drop");
      const prog = { v: 0 };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#drop", { opacity: 0, y: 24 });
      gsap.set("#file", { opacity: 0, y: -40, scale: 0.96 });
      gsap.set("#fill", { width: "0%" });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#drop", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#file", { opacity: 1, y: 160, scale: 1, duration: 0.7, ease: "power3.out" }, 1.0)
        .to({}, { duration: 0.01, onStart: () => { drop.classList.add("active"); } }, 1.5)
        .to("#fill", { width: "100%", duration: 1.8, ease: "power1.inOut" }, 1.6)
        .to(prog, {
          v: 100, duration: 1.8, ease: "power1.inOut",
          onUpdate: () => { pct.textContent = Math.round(prog.v) + "% · uploading"; }
        }, 1.6)
        .to({}, { duration: 0.01, onStart: () => { pct.textContent = "100% · ready to publish"; pct.style.color = "#047857"; } }, 3.45)
        .to("#drop", { y: -8, duration: 0.9, ease: "sine.inOut" }, 3.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
