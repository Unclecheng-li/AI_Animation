  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });
      const counter = document.getElementById("f2-counter");
      const state = { value: 3089 };
      const write = () => {
        counter.textContent = Math.round(state.value).toLocaleString("en-US");
      };

      // Scene 1 (0.0-0.5s) — the board is whole, the number is the one from
      // frame 1. The ball is on its way up inside the clip.

      // Scene 2 (0.5-1.7s) — at 0.52s the first brick breaks. The counter drops
      // on the SAME frame, and by the real amount that day was worth
      // (3,089 → 3,085): the sync is what makes the rest believable.
      tl.to(state, { value: 3085, duration: 0.12, ease: "power4.out", onUpdate: write }, 0.52);
      tl.fromTo("#f2-counter", { scale: 1 }, { scale: 0.94, duration: 0.12, ease: "power4.out" }, 0.52);
      tl.to("#f2-counter", { scale: 1, duration: 0.5, ease: "power3.out" }, 0.64);

      // …then it spins past reading speed and stays there. Mid-values are one
      // person's contribution counts — meaningless to a viewer, and legible ones
      // would break the self-identification frame 1 just built.
      tl.to(state, { value: 2400, duration: 3.74, ease: "power2.in", onUpdate: write }, 0.64);

      // Scene 4 (3.1-4.5s) — "崩せます" lands on a hard cut, no fade, once, then holds.
      tl.fromTo("#f2-shout", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 3.1);

      window.__timelines["02-break"] = tl;
    })();
