<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Liquid Glass</title><script src="assets/gsap.min.js"></script><style>@font-face{font-family:'Montserrat';src:url('assets/montserrat-100-900.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}@font-face{font-family:'IBM Plex Mono';src:url('assets/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}@font-face{font-family:'IBM Plex Mono';src:url('assets/ibm-plex-mono-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:block}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{font-family:Montserrat,sans-serif;color:#ffffff;background:#16282f}#root{position:relative;width:1920px;height:1080px;overflow:hidden;--accent:#ecffb0;--bg:#16282f;--fg:#ffffff}.clip,.stage{position:absolute;inset:0;width:1920px;height:1080px}.stage{overflow:hidden}.abs,.vector{position:absolute}.mono{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.06em}.eyebrow{position:absolute;left:80px;top:62px;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.16em}.index{position:absolute;right:80px;top:62px;font-family:'IBM Plex Mono',monospace;font-size:22px}.footer{position:absolute;left:80px;bottom:56px;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.06em}.progress{position:absolute;left:80px;bottom:33px;width:1760px;height:2px;background:#ffffff24}.progress i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:left}.title{font-size:74px;font-weight:700;letter-spacing:-.055em;line-height:1.08}.small{font-size:25px;line-height:1.5}.label{font-size:21px;font-family:'IBM Plex Mono',monospace}.card{position:absolute;border-radius:28px}.metric{font-size:66px;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.vector{inset:0}.muted{opacity:.72}

<div class="progress"><i></i></div></div></div></div><script>
window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
const pop=(s,t=0,d=.7)=>tl.fromTo(s,{opacity:0,y:32,scale:.94},{opacity:1,y:0,scale:1,duration:d,ease:'power3.out'},t);
const draw=(s,t=0,d=1)=>document.querySelectorAll(s).forEach((p,i)=>{let l=p.getTotalLength();tl.fromTo(p,{strokeDasharray:l,strokeDashoffset:l},{strokeDashoffset:0,duration:d,ease:'power2.inOut'},t+i*.08)});

pop('.title',0);pop('.small',.3);pop('.hero',.15,1.3);pop('.satellite',3.1,1);pop('.c1',5.2);pop('.c2',5.4);tl.fromTo('.hero',{rotationY:-13,rotationX:7,transformPerspective:1400},{rotationY:2,rotationX:-2,duration:8,ease:'sine.inOut'},.2);tl.fromTo('.o1',{x:0,y:0},{x:-240,y:90,duration:12,ease:'sine.inOut'},0);tl.fromTo('.o2',{x:0},{x:210,duration:12,ease:'sine.inOut'},0);tl.fromTo('.glass-bar i',{scaleX:.12},{scaleX:.78,duration:3.5,ease:'power2.inOut'},2.8);tl.fromTo('.toggle-dot',{x:0},{x:65,duration:.55,ease:'power3.inOut'},6.8);tl.fromTo('.toggle',{backgroundColor:'#ffffff40'},{backgroundColor:'#a6c764',duration:.5},6.8);tl.fromTo('.sheen',{x:0},{x:1300,duration:3,ease:'sine.inOut'},6);tl.fromTo('.satellite',{y:0},{y:-18,duration:3,ease:'sine.inOut',repeat:1,yoyo:true},6);
