<!-- ============================================================
     镜头演示动画 · 底盘模板（「全网最基础AI渗透教程」video-demo 约定）
     用法：复制本文件 → 只改 ①~⑤ 五个标记区 → 底盘（引导/音效/时间轴/镜头/HUD）一字不动
       ① 页面标题       ② 字体与舞台外观
       ③ 画面层 CSS     ④ 画面层 HTML     ⑤ DUR 与 cue 表
     QA：URL 加 #auto,t=毫秒 → 起播后冻结在该时刻（无头截图用，必须保留钩子）
     ============================================================ -->
<script>
/* ===== [不动] 播放器引导：虚拟时钟黑场启动 ===== */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();};
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
    if(location.hash.indexOf('auto')>=0)setTimeout(function(){b.click();},80); /* QA 无头自动起播 */
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
/* ===== [不动] SFX 引擎：WebAudio 合成 ===== */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';var f=330+Math.random()*90;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);
    env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);
  }
  function whoosh(durS,vol){
    if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
    bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);
  }
  function swipe(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;
    bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);
    var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);
  }
  function type(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=1400+Math.random()*900;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;
    env(g,t,0.004,0.1*vol,0.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);
  }
  function ding(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime;
    [[660,0.2],[990,0.09]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];
      env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);
    });
  }
  function thud(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);
  }
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

<!-- ① 页面标题 -->
<title>镜头 0-25 · 复制粘贴 · 22s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- ② 字体（v4）：Inter × Noto Sans SC × IBM Plex Mono -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0EFEB;--card:#FFFFFF;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6;--accent:#F5572F;--dark:#1C1C1A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Noto Sans SC',sans-serif}
body.paused *{animation-play-state:paused!important}
/* ② 舞台：纸灰操作台 + 发丝网格（v4） */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);overflow:hidden;
  background:var(--paper)}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:linear-gradient(rgba(28,28,26,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(28,28,26,.045) 1px,transparent 1px);
  background-size:64px 64px}

/* ===== [不动] 镜头层 ===== */
#cam{position:absolute;inset:0;transform-origin:0 0;transform:scale(1);transition:transform var(--cd,1.4s) cubic-bezier(.16,1,.3,1);z-index:10}

/* ============ ③ 画面层 CSS ============ */
#head{position:absolute;left:176px;top:40px;z-index:30;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(-12px);transition:all .6s cubic-bezier(.16,1,.3,1);
  background:#fff;border:1px solid var(--grid);border-radius:10px;padding:9px 16px;box-shadow:0 8px 20px rgba(28,28,26,.12)}
#head.in{opacity:1;transform:none}
#head .no{display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;letter-spacing:3px;
  color:var(--paper);background:var(--ink);border-radius:4px;padding:4px 12px}
#head h1{font-family:'Inter','Noto Sans SC',sans-serif;font-weight:800;font-size:25px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
#head h1 b{color:var(--accent)}

/* ── 主视觉：终端（抽象态） ── */
#term{position:absolute;left:176px;top:172px;width:1424px;height:648px;z-index:12;border-radius:10px;overflow:hidden;
  background:#0b0b0d;box-shadow:0 28px 70px rgba(28,28,26,.35),0 0 0 1px rgba(240,239,235,.2);
  opacity:0;transform:translateY(30px) scale(.978);transition:all .65s cubic-bezier(.16,1,.3,1)}
#term.in{opacity:1;transform:none}
.ttabs{height:44px;display:flex;align-items:center;gap:2px;padding:0 10px;background:#1b1b1e;border-bottom:1px solid #2a2a2e}

.ttabs .cc{margin-left:auto;display:flex;gap:4px}
.ttabs .cc span{width:40px;height:28px;display:flex;align-items:center;justify-content:center;color:#9a9aa2;border-radius:5px}
.tbody{position:absolute;inset:44px 0 0 0;padding:24px 30px;font-family:'IBM Plex Mono',monospace;font-size:18px;line-height:2.5}

.tline.in{opacity:1;transform:none}
.ps1{color:#F0EFEB;font-weight:700;flex:none}
.cmdwrap{position:relative;display:flex;align-items:center}
.cmdwrap.sel .selTag{opacity:1;transform:translateY(-50%) scale(1)}
.cmd{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:18px;color:#F0EFEB;letter-spacing:.4px;white-space:pre}
.blk{position:relative;height:14px;border-radius:3px;background:linear-gradient(90deg,rgba(190,205,225,.5),rgba(190,205,225,.13))}
.blk.sel{background:rgba(240,239,235,.85);box-shadow:0 0 0 2px rgba(240,239,235,.6)}
.blk.o{background:linear-gradient(90deg,rgba(150,160,180,.34),rgba(150,160,180,.08))}
.caret2{width:11px;height:22px;background:#f2f2f2;animation:blink2 1.05s steps(1) infinite}
@keyframes blink2{50%{opacity:0}}
.selTag{position:absolute;left:calc(100% + 14px);top:50%;font-family:'Noto Sans SC',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;
  color:#14181f;background:#F0EFEB;border-radius:999px;padding:3px 13px;white-space:nowrap;
  opacity:0;transform:translateY(-50%) scale(.5);transition:all .32s cubic-bezier(.2,1.6,.4,1)}
.blk.sel .selTag{opacity:1;transform:translateY(-50%) scale(1)}
#termNote{position:absolute;right:16px;bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;color:rgba(240,239,235,.5)}

/* ── 右键菜单 ── */
#ctx{position:absolute;left:0;top:0;width:220px;z-index:34;background:#26262b;border:1px solid #3a3a42;border-radius:8px;
  padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.65);opacity:0;transform:scale(.94);transition:all .16s ease}
#ctx.in{opacity:1;transform:none}
.citem{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:#dcdce2;border-radius:5px;
  padding:9px 12px;font-family:'Noto Sans SC'}
.citem .kk{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8b8b93}
.citem.hot{background:var(--accent);color:#fff}
.citem.hot .kk{color:rgba(255,255,255,.82)}

/* ── 剪贴板飞行 ── */
#clip{position:absolute;left:0;top:0;z-index:38;opacity:0;pointer-events:none;
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.6))}
#clip.on{opacity:1}
#clip .card{width:150px;height:120px;background:#fff;border:2px solid var(--ink);
  border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}
#clip .card::before{content:'';position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:44px;height:20px;
  background:#DEDDD6;border:2px solid var(--ink);border-radius:5px}
#clip .card .lb{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;color:var(--ink);letter-spacing:0;line-height:1.25;text-align:center;padding:0 8px;word-break:break-word}
#clip .card .ln{width:58px;height:7px;border-radius:2px;background:rgba(28,28,26,.5)}
#clip .card .ln.s{width:42px}
/* 剪贴板落位框 */
#clipSlot{position:absolute;left:1152px;top:246px;width:168px;height:150px;z-index:16;border-radius:10px;
  border:2px dashed rgba(240,239,235,.6);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.9);transition:all .4s cubic-bezier(.2,1.4,.4,1)}
#clipSlot.in{opacity:1;transform:none}
#clipSlot.done{border-style:solid;border-color:#F0EFEB;background:rgba(240,239,235,.1)}
#clipSlot .sl{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-family:'Noto Sans SC',sans-serif;font-weight:700;
  font-size:13px;letter-spacing:2px;color:var(--ink);background:#F0EFEB;border-radius:999px;padding:3px 14px;white-space:nowrap}
#clipSlot.done .sl{background:#F0EFEB}
.trail{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:0;z-index:37}

/* ── 右栏：键帽 ── */
#side{position:absolute;left:1638px;top:172px;width:246px;height:648px;z-index:13;opacity:0;transform:translateX(24px);
  transition:all .6s cubic-bezier(.16,1,.3,1) .1s}
#side.in{opacity:1;transform:none}
#side .st{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;letter-spacing:4px;color:var(--muted)}
.kbox{margin-top:16px;border-radius:12px;padding:16px 16px 18px;background:#fff;
  border:1px solid var(--grid);opacity:0;transform:translateY(14px);transition:all .45s cubic-bezier(.2,1.3,.4,1)}
.kbox.in{opacity:1;transform:none}
.kbox.hot{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,87,47,.12)}
.kbox.warn{border-color:var(--ink)}
.kbox.warn.hot{box-shadow:0 0 0 3px rgba(245,87,47,.15)}
.kbox .kt{display:flex;gap:7px;flex-wrap:wrap}
.kc{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;color:var(--ink);background:#fff;
  border:1.5px solid var(--ink);border-bottom-width:4px;border-radius:8px;padding:6px 11px}
.kbox.warn .kc{border-color:var(--ink)}
.kc.hit{background:var(--accent);color:#fff;transform:translateY(2px);border-bottom-width:2px}
.kbox.warn .kc.hit{background:var(--accent);color:#fff}
.kbox .kd{margin-top:11px;font-size:14.5px;color:var(--muted);line-height:1.5}
.kbox .kd b{color:var(--ink)}
.kbox.warn .kd b{color:var(--accent)}

/* ── 底部：三步条 ── */
#strip{position:absolute;left:176px;top:846px;width:1708px;height:106px;z-index:14;display:flex;align-items:center;gap:16px;
  opacity:0;transform:translateY(16px);transition:all .55s cubic-bezier(.16,1,.3,1)}
#strip.in{opacity:1;transform:none}
.sstep{flex:1;display:flex;align-items:center;gap:14px;background:#fff;
  border:1px solid var(--grid);border-radius:12px;padding:0 20px;height:100%}
.sstep .sn{font-family:'Inter',sans-serif;font-weight:800;font-size:30px;color:var(--accent);width:44px}
.sstep .si{flex:1}
.sstep .si .a{font-family:'Inter','Noto Sans SC',sans-serif;font-weight:800;font-size:23px;color:var(--ink);letter-spacing:0}
.sstep .si .b{margin-top:3px;font-size:13.5px;color:var(--muted)}
.sarrow{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--faint)}

/* ── 大肥鱼 ── */
.fish{position:absolute;width:224px;z-index:35;opacity:0;transform:translateY(24px) scale(.68);
  transition:all .45s cubic-bezier(.34,1.6,.64,1);pointer-events:none;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55))}
.fish.show{opacity:1;transform:none}
.fish img{width:100%;display:block}
.fish .say{position:absolute;width:224px;background:#fff;border:1px solid var(--ink);border-radius:14px;
  padding:11px 15px;font-size:18.5px;font-weight:700;color:var(--ink);line-height:1.45;
  opacity:0;transform:scale(.6);transition:all .4s cubic-bezier(.34,1.6,.64,1) .15s;box-shadow:0 10px 26px rgba(28,28,26,.22)}
.fish.show .say{opacity:1;transform:none}
.fish .say b{color:var(--accent)}
#fish1{left:1298px;top:524px}
#fish1 .say{left:-244px;top:4px}
#fish1 .say::after{content:'';position:absolute;right:-14px;top:56px;border:7px solid transparent;border-left:12px solid #fff}

/* ── 角注 / HUD（一般不动） ── */
.corner{position:absolute;font-family:'Inter','IBM Plex Mono',sans-serif;font-size:13.5px;color:var(--muted);letter-spacing:.06em;z-index:41}
#chap{left:56px;bottom:28px}
#src{right:56px;bottom:28px}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:60;font-family:'IBM Plex Mono',monospace;pointer-events:none}
#track{height:5px;background:var(--grid)}
#bar{height:100%;width:0;background:var(--ink);box-shadow:none}

@keyframes pulse{50%{opacity:.5}}
/* ============ ③ 结束 ============ */
</style>
</head>
<body>
<div id="stage">
  <!-- ============ ④ 画面层 HTML ============ -->
  <div id="cam">

    <!-- 主视觉：终端 -->
    <div id="term">
      <div class="ttabs">
        <span class="tstab"><span class="ic"></span>命令提示符</span>
        <span class="cc"><span>─</span><span>▢</span><span>✕</span></span>
      </div>
      <div class="tbody" id="tbody"></div>
      <span id="termNote">抽象态 · 不含真实回显</span>
    </div>

    <!-- 右键菜单 -->
    <div id="ctx">
      <div class="citem" id="ctCopy">复制</div>
      <div class="citem" id="ctPaste">粘贴<span class="kk">Shift+Insert</span></div>
    </div>

    <!-- 剪贴板落位框 -->
    <div id="clipSlot"><span class="sl">剪贴板</span></div>

    <!-- 剪贴板飞行块 -->
    <div id="clip">
      <div class="card"><div class="lb">ping 127.0.0.1</div><div class="ln"></div><div class="ln s"></div></div>
    </div>

    <!-- 右栏键帽 -->
    <div id="side">
      <div class="st">KEYS</div>
      <div class="kbox warn" id="kbStop">
        <div class="kt"><span class="kc">Ctrl</span><span class="kc">C</span></div>
        <div class="kd"><b>中断命令</b><br>在这个窗口里不是复制</div>
      </div>
      <div class="kbox" id="kbCopy">
        <div class="kt"><span class="kc">右键</span></div>
        <div class="kd"><b>复制 / 粘贴</b><br>选中后右键一下即复制</div>
      </div>
      <div class="kbox" id="kbPaste">
        <div class="kt"><span class="kc">Shift</span><span class="kc">Insert</span></div>
        <div class="kd"><b>同样是粘贴</b><br>通用快捷键，到处好使</div>
      </div>
    </div>

    <!-- 底部三步 -->
    <div id="strip">
      <div class="sstep"><div class="sn">01</div><div class="si"><div class="a">选中</div><div class="b">框住要的那段</div></div></div>
      <div class="sarrow">›</div>
      <div class="sstep"><div class="sn">02</div><div class="si"><div class="a">右键复制</div><div class="b">一下即复制</div></div></div>
      <div class="sarrow">›</div>
      <div class="sstep"><div class="sn">03</div><div class="si"><div class="a">右键粘贴</div><div class="b">落进提示符里执行</div></div></div>
    </div>

    <!-- 大肥鱼 -->
    <div class="fish" id="fish1">
      <div class="say">选中再<b>右键</b>，两下就好</div>
      <img src="Shark-GIF/026_双手合十微笑请求拜托.gif" alt="大肥鱼">
    </div>

  </div>

  <!-- 固定 UI 层 -->
  <div id="head">
    <span class="no">SHOT 0-25</span>
    <h1>命令行的<b>复制粘贴</b> · 和别人不一样</h1>
  </div>
  <div class="corner" id="chap">第二章 · 命令行 / 复制粘贴</div>
  <div class="corner" id="src">命令为真实字符串 · 回显抽象示意（不伪造输出）</div>
</div>

<div id="hud">
  <div id="track"><div id="bar"></div></div>
  <div id="hudrow"><span>镜头 0-25 · 复制粘贴 · 22s</span><span><span id="tc" style="margin-right:10px">00:00</span><button id="pauseBtn">暂停</button><button id="replay" onclick="location.reload()">重播</button></span></div>
</div>

<script>
/* ===== [不动] 时间轴引擎 ===== */
const DUR=22000; /* ←⑤ DUR = 分镜时长(ms) */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}
function camCut(tx,ty,s){cam.style.setProperty('--cd','0.001s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}

/* ── 终端命令行（真实命令仿真 · 回显保持抽象行块） ── */
const CMD='ping 127.0.0.1';
(function(){
  const body=$('#tbody');
  /* 第 1 行：上一条真实命令 */
  const r0=document.createElement('div');r0.className='tline';
  r0.innerHTML='<span class="ps1">C:\\&gt;</span><span class="cmd">ipconfig</span>';
  body.appendChild(r0);
  /* 第 2 行：本次要选中的真实命令（打字机逐字输入） */
  const r1=document.createElement('div');r1.className='tline';
  r1.innerHTML='<span class="ps1">C:\\&gt;</span><span class="cmdwrap" id="cmdWrap"><span class="cmd" id="cmdText"></span><span class="selTag">选中这段</span></span>';
  body.appendChild(r1);
  /* 第 3 行：抽象回显行（不伪造真实输出） */
  const r2=document.createElement('div');r2.className='tline';r2.style.paddingLeft='76px';
  const b2=document.createElement('div');b2.className='blk o';b2.style.width='340px';r2.appendChild(b2);
  body.appendChild(r2);
  /* 尾行：空提示符 + 光标 */
  const tail=document.createElement('div');tail.className='tline';
  tail.innerHTML='<span class="ps1">C:\\&gt;</span>';
  const car=document.createElement('div');car.className='caret2';tail.appendChild(car);
  body.appendChild(tail);
})();
const TLINES=$$('#tbody .tline');
const TARGET=$('#cmdWrap');   // 要被选中的那段（真实命令字符串）

/* ── 剪贴板飞行（含粒子尾迹） ── */
const clipEl=$('#clip');
const trail=[];
for(let i=0;i<6;i++){const d=document.createElement('div');d.className='trail';$('#cam').appendChild(d);trail.push(d);}
function pathPt(x0,y0,cx,cy,x1,y1,p){const q=1-p;return [q*q*x0+2*q*p*cx+p*p*x1, q*q*y0+2*q*p*cy+p*p*y1];}
function flyClip(x0,y0,x1,y1,start,dur,arcX,arcY){
  for(let i=tws.length-1;i>=0;i--)if(tws[i].tag==='clip')tws.splice(i,1);
  const cx=(x0+x1)/2+(arcX||0), cy=(y0+y1)/2+(arcY||-150);
  clipEl.classList.add('on');
  tws.push({tag:'clip',t:start,d:dur,e:eio,f:p=>{
    const pt=pathPt(x0,y0,cx,cy,x1,y1,p);
    clipEl.style.transform=`translate(${pt[0]-75}px,${pt[1]-60}px) rotate(${(1-p)*8-4}deg)`;
    trail.forEach((t,i)=>{
      const pp=Math.max(0,p-i*0.06);
      const q=pathPt(x0,y0,cx,cy,x1,y1,pp);
      t.style.transform='translate('+(q[0]-4)+'px,'+(q[1]-4)+'px)';
      t.style.opacity=(0.46-i*0.07)*(pp<=0?0:1);
    });
  },done:()=>{trail.forEach(t=>t.style.opacity=0)}});
}
/* ── 右键菜单定位 ── */
function ctxAt(x,y,hot){
  const c=$('#ctx');c.style.left=x+'px';c.style.top=y+'px';
  $('#ctCopy').classList.toggle('hot',hot==='copy');
  $('#ctPaste').classList.toggle('hot',hot==='paste');
  c.classList.add('in');
}

/* ============ ⑤ DUR 与 cue 表 ============
   镜头起点 11:09 · cue = 口播句起点 − 11:09
*/
on(120,()=>{$('#head').classList.add('in');camTo(-16,0,1.01,1.8);__sfx.pop(.6)}); // 11:09「好我们接下来先说第一个操作就是复制粘贴」
on(900,()=>{$('#term').classList.add('in');$('#side').classList.add('in');__sfx.thud(.85)}); // 场景装配（终端 + 侧栏入场）
on(1000,()=>{TLINES.forEach((l,i)=>setTimeout(()=>l.classList.add('in'),i*120))});
on(1500,()=>{                                                          // 真实命令逐字输入（打字机）
  const el=$('#cmdText'),n=CMD.length;let last=0;
  tws.push({t:1500,d:n*95,e:p=>p,f:p=>{
    const k=Math.ceil(p*n);if(k!==last){last=k;el.textContent=CMD.slice(0,k);__sfx.type(.5);}
  }});
});
on(1200,()=>{['#kbStop','#kbCopy','#kbPaste'].forEach((id,i)=>setTimeout(()=>$(id).classList.add('in'),i*140))});
on(3000,()=>{camTo(-44,-10,1.03,0.7)});                              // 11:12「命令行的复制和别的地方是不一样的」
on(3400,()=>{$('#kbStop').classList.add('hot');__sfx.pop(.7)});
on(4200,()=>{$('#kbStop').querySelectorAll('.kc').forEach(k=>k.classList.add('hit'));__sfx.thud(.7)});
on(7900,()=>{
  $('#kbStop').querySelectorAll('.kc').forEach(k=>k.classList.remove('hit'));
  $('#kbStop').classList.remove('hot');
  $('#kbCopy').classList.add('hot');__sfx.ding(.6);                   // 11:17「复制另有其他按键」
});
on(6000,()=>camTo(-16,0,1.01,0.7));
on(9000,()=>{camTo(-64,-16,1.05,0.7);__sfx.pop(.6)});                // 11:18「命令提示符的复制其实很直接」
on(11000,()=>{                                                       // 11:20「就是选中文本」
  camTo(-70,-18,1.05,0.7);
  TARGET.classList.add('sel');__sfx.swipe(.8);
  $('#kbCopy').classList.add('hot');
});
on(12000,()=>{                                                       // 11:21「然后右键一下就是复制」
  ctxAt(740,326,'copy');__sfx.pop(.8);
  $('#clipSlot').classList.add('in');
  flyClip(660,292,1236,321,12250,950,-40,-160);
  __sfx.whoosh(0.7,.7);
});
on(13200,()=>{$('#ctx').classList.remove('in');$('#clipSlot').classList.add('done');__sfx.ding(.7)});
on(14000,()=>{                                                       // 11:23「再点一下右键就是粘贴」
  ctxAt(500,420,'paste');__sfx.pop(.8);
  flyClip(1236,321,470,392,14000,950,40,170);
  __sfx.whoosh(0.7,.7);
});
on(14600,()=>{                                                       // 落进提示符
  const out=document.createElement('div');out.className='tline in';
  out.innerHTML='<div class="blk o" style="width:0px;margin-left:76px"></div>';
  $('#tbody').appendChild(out);
  tws.push({t:14600,d:600,f:p=>{out.firstChild.style.width=(420*p)+'px'}});
  __sfx.thud(.75);
});
on(15000,()=>{                                                       // 11:24「我们可以再记一个通用快捷键」
  $('#ctx').classList.remove('in');
  clipEl.classList.remove('on');
  $('#clipSlot').classList.remove('in');
  camTo(-16,0,1.01,0.7);
  $('#kbPaste').classList.add('hot');__sfx.ding(.6);
});
on(16000,()=>{$('#kbPaste').querySelectorAll('.kc').forEach(k=>k.classList.add('hit'));__sfx.thud(.7)}); // 11:26「就是shift加insert也是粘贴」
on(17500,()=>$('#kbPaste').querySelectorAll('.kc').forEach(k=>k.classList.remove('hit')));
on(12500,()=>$('#fish1').classList.add('show'));  // 大肥鱼提前定场（原 15000 偏晚）
on(18200,()=>$('#fish1').classList.remove('show'));
on(19000,()=>{                                                       // 11:28「复制来的命令就靠这些操作来粘贴进终端了」
  camTo(0,0,1,0.7);
  TARGET.classList.remove('sel');
  $('#strip').classList.add('in');__sfx.thud(.9);__sfx.ding(.75);
});

/* ===== [不动] QA 专用（正常播放不触发）：hash 带 t=毫秒 → 起播后跳转该时刻并冻结 ===== */
(function(){
  var m=/t=(\d+)/.exec(location.hash||'');
  if(!m)return;
  var MS=+m[1];
  var st=document.createElement('style');st.textContent='*{transition:none!important}';
  var orig=window.__startPlayback;
  window.__startPlayback=function(){
    orig();
    t0=performance.now()-MS;
    tick(performance.now());
    paused=true;document.body.classList.add('paused');document.head.appendChild(st);
  };
})();
</script>
</body>
</html>
