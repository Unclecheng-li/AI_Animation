<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0f14; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0c0f14;
      }
      .track {
        position: absolute; left: 140px; right: 140px; top: 620px; height: 4px;
        background: rgba(148, 163, 184, 0.35);
      }
      .tick {
        position: absolute; top: 600px; width: 4px; height: 44px;
        background: #e2e8f0; border-radius: 2px;
      }
      .train {
        position: absolute; top: 560px; left: 140px; width: 180px; height: 28px;
        border-radius: 8px; background: linear-gradient(90deg, #f97316, #fbbf24);
        box-shadow: 0 0 28px rgba(249, 115, 22, 0.45);
      }
      .station {
        position: absolute; top: 670px; font-family: "Segoe UI", sans-serif;
        font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(226, 232, 240, 0.7);
      }
      .copy { position: absolute; left: 140px; top: 260px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(251, 146, 60, 0.9); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">UI2V · Timing</div>
        <div class="title">Metro Tick</div>
        <div class="sub">Schedule rhythm for precise reveals</div>
      </div>
      <div id="track" class="clip track" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="train" class="clip train" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="t0" class="clip tick" style="left:220px" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div id="t1" class="clip tick" style="left:520px" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <div id="t2" class="clip tick" style="left:820px" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="t3" class="clip tick" style="left:1120px" data-start="0" data-duration="4.5" data-track-index="6"></div>
      <div id="t4" class="clip tick" style="left:1420px" data-start="0" data-duration="4.5" data-track-index="7"></div>
      <div id="t5" class="clip tick" style="left:1720px" data-start="0" data-duration="4.5" data-track-index="8"></div>
      <div id="s0" class="clip station" style="left:200px" data-start="0" data-duration="4.5" data-track-index="9">Init</div>
      <div id="s1" class="clip station" style="left:800px" data-start="0" data-duration="4.5" data-track-index="10">Build</div>
      <div id="s2" class="clip station" style="left:1400px" data-start="0" data-duration="4.5" data-track-index="11">Ship</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, y: 24 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 22 });
      gsap.set(".sub", { opacity: 0, y: 14 });
      gsap.set("#track", { scaleX: 0, transformOrigin: "0% 50%", opacity: 0 });
      gsap.set(["#t0","#t1","#t2","#t3","#t4","#t5"], { scaleY: 0, transformOrigin: "50% 100%", opacity: 0 });
      gsap.set(["#s0","#s1","#s2"], { opacity: 0, y: 10 });
      gsap.set("#train", { x: 0, opacity: 0 });
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.1)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.25)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.5)
        .to("#track", { opacity: 1, scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.55)
        .to(["#t0","#t1","#t2","#t3","#t4","#t5"], { opacity: 1, scaleY: 1, duration: 0.45, stagger: 0.08, ease: "power2.out" }, 0.9)
        .to(["#s0","#s1","#s2"], { opacity: 1, y: 0, duration: 0.4, stagger: 0.12 }, 1.1)
        .to("#train", { opacity: 1, duration: 0.2 }, 1.2)
        .to("#train", { x: 1480, duration: 2.6, ease: "power1.inOut" }, 1.25);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
