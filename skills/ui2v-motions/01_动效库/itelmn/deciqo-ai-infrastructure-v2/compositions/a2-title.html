<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--bone); }
        #a2-block { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; background: var(--ai); }
        .a2-w { position: absolute; left: 0; right: 0; text-align: center; font-size: 330px; white-space: nowrap; }
        #a2-l1 { top: 110px; color: var(--ai); }
        #a2-l2 { top: 430px; color: var(--ai); }
        #a2-l3 { top: 110px; color: var(--bone); }
        #a2-l4 { top: 430px; color: var(--bone); }
        #a2-sub { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 34px; color: var(--dim); white-space: nowrap; }
        #a2-l5 { position: absolute; left: 0; right: 0; top: 850px; text-align: center; font-size: 110px; color: var(--seller); white-space: nowrap; }
        .a2-bar { position: absolute; left: 0; width: 1920px; height: 360px; }
        #a2-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 96px 96px; }
      </style>
      <div data-hf-id="hf-13vv" id="root" data-composition-id="a2-title" data-width="1920" data-height="1080">
        <div data-hf-id="hf-rkj5" id="a2-grid"></div>
        <div data-hf-id="hf-eee8" id="a2-block"></div>
        <div data-hf-id="hf-r3lw" class="a2-w disp" id="a2-l1"></div>
        <div data-hf-id="hf-zrhr" class="a2-w disp" id="a2-l2"></div>
        <div data-hf-id="hf-vtdq" class="a2-w disp" id="a2-l3"></div>
        <div data-hf-id="hf-4h9l" class="a2-w disp" id="a2-l4"></div>
        <div data-hf-id="hf-pbtt" id="a2-sub"></div>
        <div data-hf-id="hf-lb7t" class="disp" id="a2-l5"></div>
        <div data-hf-id="hf-tr15" class="a2-bar" id="a2-wipe" style="top:0;height:1080px;background:var(--ai)"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          gsap.set("#a2-block", { rotation: 45, scale: 0.8 });
          gsap.set("#a2-wipe", { scaleY: 0, transformOrigin: "50% 100%" });
          gsap.set("#a2-grid", { opacity: 0 });
          // block spins and explodes into the first word
          tl.to("#a2-block", { rotation: 225, scale: 0.2, duration: 0.35, ease: "power3.in" }, 0.05);
          tl.to("#a2-block", { scaleX: 16, scaleY: 0.05, duration: 0.25, ease: "expo.out" }, 0.4);
          tl.to("#a2-block", { opacity: 0, duration: 0.2 }, 0.6);
          tl.to("#a2-grid", { opacity: 1, duration: 0.8 }, 0.4);
          V2.scramble(tl, "#a2-l1", "THE MODEL", 0.45, 0.55);
          V2.scramble(tl, "#a2-l2", "PROPOSES.", 0.85, 0.55);
          tl.fromTo(["#a2-l1", "#a2-l2"], { scale: 1.08 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0.45);
          // hard swap on the beat
          tl.set(["#a2-l1", "#a2-l2"], { opacity: 0 }, 2.0);
          V2.scramble(tl, "#a2-l3", "CODE", 2.0, 0.4);
          V2.scramble(tl, "#a2-l4", "DECIDES.", 2.3, 0.5);
          tl.fromTo(["#a2-l3", "#a2-l4"], { scale: 1.08 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 2.0);
          V2.type(tl, "#a2-sub", "// what is allowed through to the seller", 3.1, 0.7);
          tl.to(["#a2-l3", "#a2-l4"], { y: -60, duration: 0.6, ease: "power3.inOut" }, 3.9);
          tl.to("#a2-sub", { y: -60, duration: 0.6, ease: "power3.inOut" }, 3.9);
          V2.scramble(tl, "#a2-l5", "THE SELLER DECIDES WHAT HAPPENS.", 4.2, 0.8);
          // violet wipe up → into the infra map
          tl.to("#a2-wipe", { scaleY: 1, duration: 0.45, ease: "expo.in" }, 5.9);
          window.__timelines["a2-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
