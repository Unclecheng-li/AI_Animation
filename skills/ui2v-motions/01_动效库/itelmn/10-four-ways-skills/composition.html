<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Four Ways to Build Skills"},
  {"id":"steps","type":"string","label":"Steps (JSON)","default":"[{\"num\":\"1\",\"heading\":\"Deliberate Practice\",\"body\":\"Focused, intentional repetition with immediate feedback. Not just doing the task - studying the gaps and fixing them systematically. This is how elite performers accelerate past their peers.\"},{\"num\":\"2\",\"heading\":\"Learn from Others\",\"body\":\"Mentorship, peer learning, and observation compress the time it takes to absorb tacit knowledge. Shadowing an expert for one week can replace months of trial and error.\"},{\"num\":\"3\",\"heading\":\"Stretch Assignments\",\"body\":\"Taking on projects slightly beyond your current skill level forces adaptive learning. The discomfort zone is where growth happens - the goal is 70% confidence, not 100%.\"},{\"num\":\"4\",\"heading\":\"Reflect and Document\",\"body\":\"A weekly reflection habit - journaling what worked, what failed, and why - converts raw experience into durable knowledge. Without reflection, experience is just time served.\"}]"},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"accentColor","type":"color","label":"Accent Color","default":"#d9534e"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStep","type":"number","label":"Seconds per Step","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #285f9f;
      --accent: #d9534e;
      --bg: #f5f2ea;
      --ink: #182026;
      --plate-image: url("v2-base-blue.png");
    }
    body {
      width: 1920px;
      height: 1080px;
      background-color: var(--bg);
      background-image: var(--plate-image);
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      overflow: hidden;
      position: relative;
    }
    #four-ways-skills {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--bg);
      background-image: var(--plate-image);
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
    }
    #four-ways-skills > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .title {
      position: absolute;
      top: 60px;
      left: 100px;
      max-width: 900px;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.18;
      color: var(--primary);
      opacity: 0;
    }
    .flow-area {
      position: absolute;
      left: 100px;
      top: 180px;
      width: 880px;
      height: 700px;
      opacity: 0;
    }
    .flow-node {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .node-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .node-label {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
    }
    .info-panel {
      position: absolute;
      left: 965px;
      top: 292px;
      width: 760px;
      height: 520px;
      opacity: 0;
    }
    .info-block {
      position: absolute;
      inset: 0;
      overflow: visible;
    }
    .info-number {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 86px;
      font-weight: 800;
      color: var(--accent);
      opacity: 1;
      line-height: 1;
      z-index: 1;
    }
    .info-heading {
      font-size: 42px;
      font-weight: 700;
      color: var(--primary);
      margin: 138px 0 30px;
      position: relative;
      z-index: 2;
    }
    .info-desc {
      font-size: 23px;
      line-height: 1.55;
      color: var(--ink);
      max-width: 720px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="four-ways-skills" data-composition-id="four-ways-skills" data-width="1920" data-height="1080" data-duration="17" data-start="0">
    <div id="el-fade"></div>
    <div class="title" id="mainTitle"></div>
    <div class="flow-area" id="flowArea">
      <svg style="position:absolute;inset:0;pointer-events:none;width:880px;height:700px" viewBox="0 0 880 700">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#285f9f" opacity="0.3"/>
          </marker>
        </defs>
        <line x1="62" y1="72" x2="62" y2="590" stroke="#285f9f" stroke-width="2" opacity="0.15" marker-end="url(#arrowhead)"/>
      </svg>
    </div>
    <div class="info-panel" id="infoPanel"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var steps = JSON.parse(vars.steps || '[]');
      var primary = vars.primaryColor || '#285f9f';
      var accent = vars.accentColor || '#d9534e';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlate = vars.basePlateImage || 'v2-base-blue.png';
      var dur = Number(vars.durationPerStep) || 4;
      var TOTAL = steps.length * dur + 1;

      var root = document.documentElement;
      root.style.setProperty('--primary', primary);
      root.style.setProperty('--accent', accent);
      root.style.setProperty('--bg', bgColor);
      root.style.setProperty('--plate-image', 'url("' + basePlate + '")');

      var comp = document.querySelector('[data-composition-id="four-ways-skills"]');
      comp.style.backgroundImage = 'url("' + basePlate + '")';
      comp.style.backgroundColor = bgColor;
      comp.setAttribute('data-duration', TOTAL);
      document.body.style.backgroundImage = 'url("' + basePlate + '")';
      document.body.style.backgroundColor = bgColor;
      document.getElementById('mainTitle').textContent = vars.title || 'Four Ways to Build Skills';

      function stepHeading(step) {
        return step.heading || step.name || step.label || '';
      }

      var flowArea = document.getElementById('flowArea');
      var infoPanel = document.getElementById('infoPanel');
      var circles = [], blocks = [];

      steps.forEach(function(step, i) {
        var id = step.num || step.id || String(i + 1).padStart(2, '0');
        var heading = stepHeading(step);
        var node = document.createElement('div');
        node.className = 'flow-node';
        node.style.left = '30px';
        node.style.top = (40 + i * 160) + 'px';
        node.innerHTML = '<div class="node-circle" id="nc' + i + '">' + id + '</div><span class="node-label">' + heading + '</span>';
        flowArea.appendChild(node);
        circles.push(node.querySelector('.node-circle'));

        var block = document.createElement('div');
        block.className = 'info-block';
        block.innerHTML = '<div class="info-number">' + id + '</div><div class="info-heading">' + heading + '</div><div class="info-desc">' + step.body + '</div>';
        infoPanel.appendChild(block);
        blocks.push(block);
        if (i !== 0) gsap.set(block, { opacity: 0 });
      });

      if (circles[0]) {
        gsap.set(circles[0], {
          backgroundColor: accent,
          scale: 1.2,
          boxShadow: '0 4px 20px ' + accent + '55'
        });
      }

      var tl = gsap.timeline({ paused: true });
      tl.to('#mainTitle', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0);
      tl.to('#flowArea', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.3);
      tl.from('.flow-node', { opacity: 0, x: -28, duration: 0.4, stagger: 0.14, ease: 'power2.out' }, 0.5);
      tl.to('#infoPanel', { opacity: 1, x: -14, duration: 0.5, ease: 'power2.out' }, 1.1);

      for (var i = 1; i < steps.length; i++) {
        (function(idx) {
          var t = idx * dur;
          var prev = idx - 1;
          tl.to(blocks[prev], { opacity: 0, duration: 0.22, ease: 'power2.in', overwrite: 'auto' }, t);
          tl.to(blocks[idx], { opacity: 1, duration: 0.45, ease: 'power2.out', overwrite: 'auto' }, t + 0.22);
          tl.to(circles[prev], { backgroundColor: primary, scale: 1, boxShadow: 'none', duration: 0.3, overwrite: 'auto' }, t);
          tl.to(circles[idx], {
            backgroundColor: accent,
            scale: 1.2,
            boxShadow: '0 4px 20px ' + accent + '55',
            duration: 0.3,
            overwrite: 'auto'
          }, t + 0.1);
          tl.to('#infoPanel', { scale: 0.97, duration: 0.12, overwrite: 'auto' }, t + 0.1);
          tl.to('#infoPanel', { scale: 1, duration: 0.45, ease: 'back.out(1.3)', overwrite: 'auto' }, t + 0.22);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['four-ways-skills'] = tl;
    </script>
  </div>
</body>
</html>
