<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
      /* recetas CSS de motion-anything (Animate.css): seek-safe. Sobre SVG: transform-box fill-box. */
      @keyframes tada {
  from {
    transform: scale3d(1, 1, 1);
  }

  10%,
  20% {
    transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
  }

  30%,
  50%,
  70%,
  90% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
  }

  40%,
  60%,
  80% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes jello {
  from,
  11.1%,
  to {
    transform: translate3d(0, 0, 0);
  }

  22.2% {
    transform: skewX(-12.5deg) skewY(-12.5deg);
  }

  33.3% {
    transform: skewX(6.25deg) skewY(6.25deg);
  }

  44.4% {
    transform: skewX(-3.125deg) skewY(-3.125deg);
  }

  55.5% {
    transform: skewX(1.5625deg) skewY(1.5625deg);
  }

  66.6% {
    transform: skewX(-0.78125deg) skewY(-0.78125deg);
  }

  77.7% {
    transform: skewX(0.390625deg) skewY(0.390625deg);
  }

  88.8% {
    transform: skewX(-0.1953125deg) skewY(-0.1953125deg);
  }
}
@keyframes bounce {
  from,
  20%,
  53%,
  to {
    animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0);
  }

  40%,
  43% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -30px, 0) scaleY(1.1);
  }

  70% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -15px, 0) scaleY(1.05);
  }

  80% {
    transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0) scaleY(0.95);
  }

  90% {
    transform: translate3d(0, -4px, 0) scaleY(1.02);
  }
}
@keyframes headShake {
  0% {
    transform: translateX(0);
  }

  6.5% {
    transform: translateX(-6px) rotateY(-9deg);
  }

  18.5% {
    transform: translateX(5px) rotateY(7deg);
  }

  31.5% {
    transform: translateX(-3px) rotateY(-5deg);
  }

  43.5% {
    transform: translateX(2px) rotateY(3deg);
  }

  50% {
    transform: translateX(0);
  }
}
@keyframes rubberBand {
  from {
    transform: scale3d(1, 1, 1);
  }

  30% {
    transform: scale3d(1.25, 0.75, 1);
  }

  40% {
    transform: scale3d(0.75, 1.25, 1);
  }

  50% {
    transform: scale3d(1.15, 0.85, 1);
  }

  65% {
    transform: scale3d(0.95, 1.05, 1);
  }

  75% {
    transform: scale3d(1.05, 0.95, 1);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes swing {
  20% {
    transform: rotate3d(0, 0, 1, 15deg);
  }

  40% {
    transform: rotate3d(0, 0, 1, -10deg);
  }

  60% {
    transform: rotate3d(0, 0, 1, 5deg);
  }

  80% {
    transform: rotate3d(0, 0, 1, -5deg);
  }

  to {
    transform: rotate3d(0, 0, 1, 0deg);
  }
}
@keyframes wobble {
  from {
    transform: translate3d(0, 0, 0);
  }

  15% {
    transform: translate3d(-25%, 0, 0) rotate3d(0, 0, 1, -5deg);
  }

  30% {
    transform: translate3d(20%, 0, 0) rotate3d(0, 0, 1, 3deg);
  }

  45% {
    transform: translate3d(-15%, 0, 0) rotate3d(0, 0, 1, -3deg);
  }

  60% {
    transform: translate3d(10%, 0, 0) rotate3d(0, 0, 1, 2deg);
  }

  75% {
    transform: translate3d(-5%, 0, 0) rotate3d(0, 0, 1, -1deg);
  }

  to {
    transform: translate3d(0, 0, 0);
  }
}

      .anim { transform-box: fill-box; transform-origin: 50% 50%; animation-fill-mode: both; animation-timing-function: ease; }
      
      #ghosty { animation: jello 1.2s .8s both, tada .9s 4.0s both, swing 1.4s 7.0s both; }
      #drawer-steps { animation: headshake .8s 3.95s both; }
      #paper1 { animation: bounce 1s 4.4s both, rubberband 1s 6.2s both; }
      #tray { animation: swing 1.2s 6.2s both; }
      #ghosty, #drawer-steps, #paper1, #tray { transform-box: fill-box; transform-origin: 50% 100%; animation-fill-mode: both; }
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="12">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0E1317"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <!-- piso -->
  <rect x="0" y="780" width="1920" height="300" fill="#151E23"/>
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#F2F5F4" stroke-width="4"/>

  <!-- ===== Archivero = Storage (tres cajones) ===== -->
  <g id="cabinet">
    <rect x="240" y="260" width="420" height="520" rx="12" fill="#0E1317" transform="translate(14,14)"/>
    <rect x="240" y="260" width="420" height="520" rx="12" fill="#37AB93" stroke="#F2F5F4" stroke-width="5"/>
    <!-- runs -->
    <rect x="268" y="290" width="364" height="140" rx="10" fill="#85DDCB" stroke="#F2F5F4" stroke-width="5"/>
    <rect x="420" y="380" width="60" height="16" rx="8" fill="#F2F5F4"/>
    <text x="292" y="336" font-size="34" font-weight="900" fill="#0E1317">runs</text>
    <!-- steps: abierto, sobresale -->
    <g id="drawer-steps">
    <rect x="268" y="452" width="420" height="140" rx="10" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="268" y="452" width="420" height="140" rx="10" fill="#85DDCB" stroke="#F2F5F4" stroke-width="5"/>
    <text x="292" y="498" font-size="34" font-weight="900" fill="#0E1317">steps</text>
    <g font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">
      <rect x="292" y="516" width="58" height="58" rx="8" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="4"/><text x="321" y="557">1</text>
      <rect x="362" y="516" width="58" height="58" rx="8" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="4"/><text x="391" y="557">2</text>
      <rect x="432" y="516" width="58" height="58" rx="8" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="4"/><text x="461" y="557">3</text>
      <rect id="slot4" x="502" y="516" width="58" height="58" rx="8" fill="none" stroke="#F2F5F4" stroke-width="4" stroke-dasharray="8 8"/><text id="slot4num" x="531" y="557" opacity="0">4</text>
    </g>
    </g>
    <!-- eventos -->
    <rect x="268" y="614" width="364" height="140" rx="10" fill="#85DDCB" stroke="#F2F5F4" stroke-width="5"/>
    <rect x="420" y="704" width="60" height="16" rx="8" fill="#F2F5F4"/>
    <text x="292" y="660" font-size="34" font-weight="900" fill="#0E1317">eventos</text>
  </g>
  <text x="450" y="860" text-anchor="middle" font-size="34" font-weight="900" fill="#85DDCB">Storage</text>
  <text x="450" y="900" text-anchor="middle" font-size="24" fill="#7C8A8E">lo que ya pasó</text>

  <!-- ===== Ghosty al centro, llevando la ficha 4 al cajón ===== -->
  <g id="ghosty"><g transform="rotate(-10 960 520)">
    <image xlink:href="assets/ghosty.png" x="810" y="380" width="300" height="350" preserveAspectRatio="xMidYMid meet"/>
  </g></g>
  <g id="chip4hand"><g transform="rotate(-16 760 600)">
    <rect x="720" y="560" width="80" height="80" rx="10" fill="#0E1317" transform="translate(8,8)"/>
    <rect x="720" y="560" width="80" height="80" rx="10" fill="#85DDCB" stroke="#F2F5F4" stroke-width="5"/>
    <text x="760" y="616" font-size="44" font-weight="900" text-anchor="middle" fill="#0E1317">4</text>
  </g></g>
  <path id="chip4path" d="M700,600 q-60,-20 -110,-30" fill="none" stroke="#F2F5F4" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 14"/>
  <text x="960" y="860" text-anchor="middle" font-size="34" font-weight="900" fill="#F2F5F4">Ghosty</text>
  <text x="960" y="900" text-anchor="middle" font-size="24" fill="#7C8A8E">guarda cada paso antes de seguir</text>

  <!-- ===== Charola = Queue (pendientes) ===== -->
  <g id="tray">
    <rect x="1260" y="720" width="440" height="60" rx="10" fill="#0E1317" transform="translate(14,14)"/>
    <rect x="1260" y="720" width="440" height="60" rx="10" fill="#37AB93" stroke="#F2F5F4" stroke-width="5"/>
    <rect x="1260" y="600" width="24" height="140" fill="#37AB93" stroke="#F2F5F4" stroke-width="5"/>
    <rect x="1676" y="600" width="24" height="140" fill="#37AB93" stroke="#F2F5F4" stroke-width="5"/>
    <!-- papeles: 6, 5 abajo; el de arriba dice "paso 4" -->
    <rect id="paper3" x="1310" y="690" width="340" height="34" rx="6" fill="#D9D3C4" stroke="#0E1317" stroke-width="4"/>
    <rect id="paper2" x="1320" y="656" width="340" height="34" rx="6" fill="#E8E4D8" stroke="#0E1317" stroke-width="4"/>
    <g id="paper1"><rect x="1330" y="622" width="340" height="34" rx="6" fill="#F2F5F4" stroke="#0E1317" stroke-width="4"/>
    <text id="nextlbl" x="1500" y="647" text-anchor="middle" font-size="24" font-weight="900" fill="#0E1317">siguiente: paso 4</text></g>
  </g>
  <text x="1480" y="860" text-anchor="middle" font-size="34" font-weight="900" fill="#85DDCB">Queue</text>
  <text x="1480" y="900" text-anchor="middle" font-size="24" fill="#7C8A8E">lo que sigue</text>

  <!-- ===== título ===== -->
  <text x="960" y="150" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">El World, sin branding</text>
  <text x="960" y="200" text-anchor="middle" font-size="28" fill="#85DDCB">un archivero de lo que ya pasó + una charola de lo que sigue</text>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

      // fotograma 0 completo. Lo "vivo" va por CSS (recetas motion-anything); GSAP sólo mueve la ficha y cambia textos.
      tl.to("#chip4hand", { x: -229, y: -55, duration: .9, ease: "power2.inOut" }, 3.0);
      tl.to("#chip4hand", { opacity: 0, duration: .08 }, 3.9);
      tl.to("#chip4path", { opacity: 0, duration: .2 }, 3.9);
      tl.to("#slot4", { fill: "#8DCF6E", strokeDasharray: "0 0", duration: .15 }, 3.92);
      tl.to("#slot4num", { opacity: 1, duration: .05 }, 3.95);
      tl.set("#nextlbl", { textContent: "siguiente: paso 5" }, 4.5);
  
      tl.set({}, {}, 12);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
