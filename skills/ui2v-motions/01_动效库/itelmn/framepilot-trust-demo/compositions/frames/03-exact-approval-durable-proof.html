      const domPrefix = "f03-exact-approval-durable-proof";

        document.getElementById(`${domPrefix}-output-row`),

      const focusLength = focusPath.getTotalLength();
      focusPath.style.strokeDasharray = `${focusLength}`;
      focusPath.style.strokeDashoffset = `${focusLength}`;

      const tl = gsap.timeline({ paused: true });

      tl.addLabel("approval-arrives", 0);
      tl.fromTo(
        approvalStage,
        { opacity: 0, y: 52, scale: 0.96, rotation: -1.6 },
        { opacity: 1, y: 0, scale: 1, rotation: -0.6, duration: 0.6, ease: "power3.out" },

        0.18,

      tl.fromTo(
        sensitiveLine,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.46, ease: "power3.out" },
        0.25,
      );

      tl.addLabel("exact-wait", 0.72);
      tl.to(
        focusPath,
        { strokeDashoffset: 0, duration: 0.56, ease: "power2.out" },
        0.72,
      );
      tl.fromTo(
        exactLabel,
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.34, ease: "power3.out", immediateRender: false },
        0.84,

      tl.fromTo(
        decisionLabel,

        { opacity: 1, x: 0, duration: 0.34, ease: "power3.out", immediateRender: false },
        1.24,

      tl.to(
        approvalStage,
        { opacity: 0.05, scale: 0.76, rotation: 0, duration: 0.5, ease: "power2.in" },
        1.92,

      tl.to(
        [sensitiveRail, sensitiveLine, exactLabel, decisionLabel],
        { opacity: 0, x: -10, duration: 0.28, ease: "power2.in" },
        1.92,

        finalStage,
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.72, ease: "power3.out", immediateRender: false },
        2.02,
      );
      receiptRows.forEach((row, index) => {
        tl.fromTo(
          row,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", immediateRender: false },
          2.2 + index * 0.22,

      });

      tl.to(approvalStage, { opacity: 0, duration: 0.16, ease: "power1.out" }, 3.1);

        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false },

        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.32, ease: "power2.out", immediateRender: false },
        3.14,
      );
