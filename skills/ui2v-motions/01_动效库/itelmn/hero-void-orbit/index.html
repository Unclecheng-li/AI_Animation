<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hero — Lattice Shear</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #03050c;
      }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
      }
      .full-bleed { position: absolute; inset: 0; }
      #bg { background: #03050c; }
      #floor {
        position: absolute; left: -25%; right: -25%; top: 50%;
        height: 140%;
        transform-origin: 50% 0%;
        transform: perspective(1100px) rotateX(64deg);
        background-image:
          linear-gradient(rgba(100, 160, 255, 0.2) 1px, transparent 1px),
          linear-gradient(90deg, rgba(100, 160, 255, 0.2) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent 70%);
        -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent 70%);
      }
      #ceiling {
        position: absolute; left: -25%; right: -25%; bottom: 52%;
        height: 120%;
        transform-origin: 50% 100%;
        transform: perspective(1100px) rotateX(-64deg);
        background-image:
          linear-gradient(rgba(170, 110, 255, 0.14) 1px, transparent 1px),
          linear-gradient(90deg, rgba(170, 110, 255, 0.14) 1px, transparent 1px);
        background-size: 84px 84px;
        mask-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent 68%);
        -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent 68%);
      }
      #center {
        position: absolute; left: 50%; top: 48%;
        width: 880px; height: 480px;
        transform: translate(-50%, -50%);
        background: radial-gradient(ellipse at center, #03050c 0%, #03050c 40%, transparent 72%);
      }
      .beam {
        position: absolute; top: 0; bottom: 0; width: 1px;
        background: linear-gradient(180deg, transparent, rgba(120,190,255,0.55), transparent);
        box-shadow: 0 0 16px rgba(80,160,255,0.35);
      }
      #beam-l { left: 260px; }
      #beam-r {
        right: 260px;
        background: linear-gradient(180deg, transparent, rgba(190,130,255,0.5), transparent);
        box-shadow: 0 0 16px rgba(160,100,255,0.3);
      }
      .hz {
        position: absolute; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent 10%, rgba(120,200,255,0.45) 50%, transparent 90%);
        box-shadow: 0 0 18px rgba(80,200,255,0.25);
      }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hero-lattice-shear"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4.5"
    >
      <div id="bg" class="full-bleed"></div>
      <section class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="floor"></div>
        <div id="ceiling"></div>
        <div class="beam" id="beam-l"></div>
        <div class="beam" id="beam-r"></div>
        <div class="hz" id="hz" style="top: 50%"></div>
        <div id="center"></div>
      </section>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Continuous shear — already mid-motion at t=0
        tl.fromTo("#floor",
          { backgroundPosition: "0px 0px", x: 0 },
          { backgroundPosition: "0px 288px", x: -56, duration: 4.5, ease: "none" },
          0);
        tl.fromTo("#ceiling",
          { backgroundPosition: "0px 0px", x: 0 },
          { backgroundPosition: "0px -252px", x: 40, duration: 4.5, ease: "none" },
          0);
        tl.fromTo("#hz",
          { y: -90, opacity: 0.35 },
          { y: 90, opacity: 0.85, duration: 2.25, yoyo: true, repeat: 1, ease: "sine.inOut" },
          0);
        tl.fromTo(["#beam-l", "#beam-r"],
          { opacity: 0.35 },
          { opacity: 0.9, duration: 1.1, yoyo: true, repeat: 3, ease: "sine.inOut", stagger: 0.15 },
          0);

        window.__timelines["hero-lattice-shear"] = tl;
      })();
    </script>
  </body>
</html>
