<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body style="margin:0;">
  <div id="stage" data-composition-id="TheInterval" data-width="1920" data-height="1080" data-fps="30" data-start="0" data-duration="50">
    <div id="timeline-layer" class="clip" data-start="0" data-duration="50" data-track-index="0"></div>
    <audio id="music-bed" src="public/music-bed.mp3" data-start="0" data-duration="50" data-track-index="10"></audio>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines.TheInterval = gsap.timeline({ paused: true });
  </script>
  <script type="module">
    import { buildComposition } from "./js/composition.js";
    buildComposition(document.getElementById("timeline-layer"), document.getElementById("music-bed"), window.__timelines.TheInterval);
  </script>
</body>
</html>
