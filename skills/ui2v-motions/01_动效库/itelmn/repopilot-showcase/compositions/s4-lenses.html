<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #0d1117;
        }
        .glow {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            82% 64% at 50% 36%,
            rgba(150, 168, 194, 0.1) 0%,
            rgba(150, 168, 194, 0.035) 46%,
            rgba(150, 168, 194, 0) 74%
          );
        }
        .kicker {
          position: absolute;
          left: 120px;
          top: 88px;
          display: block;
          font-size: 38px;
          line-height: 1.2;
          color: #818b98;
        }
        /* Left: the same findings throughout. Only their order changes. */
        .findings {
          position: absolute;
          left: 120px;
          top: 170px;
          width: 520px;
          height: 618px;
        }
        .finding {
          position: absolute;
          left: 0;
          width: 520px;
          height: 96px;
          padding: 14px 18px;
          border-radius: 12px;
          background: #151b23;
          border: 1px solid #2b3440;
          border-left: 5px solid #2b3440;
        }
        .finding-text {
          display: block;
          font-size: 25px;
          line-height: 1.32;
          color: #aab3bd;
        }
        .grid {
          position: absolute;
          left: 680px;
          top: 150px;
          width: 1120px;
          display: grid;
          grid-template-columns: 540px 540px;
          grid-auto-rows: 206px;
          gap: 20px 40px;
        }
        .pcard {
          position: relative;
          display: block;
          width: 540px;
          height: 206px;
          border-radius: 18px;
          background: #1a212b;
          border: 1px solid #2b3440;
          overflow: hidden;
        }
        .pcard-glow {
          position: absolute;
          inset: 0;
          display: block;
          border-radius: 18px;
          background: #173b39;
          border: 2px solid #2b6c67;
          opacity: 0;
        }
        .pcard-body {
          position: absolute;
          inset: 0;
          display: block;
          padding: 28px 32px;
        }
        .pcard-label {
          display: block;
          font-size: 32px;
          line-height: 1.15;
          color: #edf1f5;
        }
        .pcard-blurb {
          display: block;
          margin-top: 14px;
          font-size: 27px;
          line-height: 1.34;
          color: #aab3bd;
        }
        .strip {
          position: absolute;
          left: 120px;
          top: 828px;
          width: 1680px;
          height: 172px;
          background: #151b23;
          border: 1px solid #2b3440;
          border-left: 6px solid #49b9ad;
          border-radius: 10px;
          overflow: hidden;
        }
        .strip-item {
          position: absolute;
          inset: 0;
          display: block;
          padding: 22px 34px;
          opacity: 0;
        }
        .strip-role {
          display: block;
          font-size: 28px;
          line-height: 1.2;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #49b9ad;
        }
        .strip-text {
          display: block;
          margin-top: 14px;
          font-size: 40px;
          line-height: 1.3;
          color: #edf1f5;
        }
      </style>

      <div id="root" data-composition-id="s4-lenses" data-width="1920" data-height="1080">
        <div class="fill"></div>
        <div class="glow"></div>

        <div id="s4-kicker" class="kicker">Six lenses, or describe your own.</div>

        <div id="s4-findings" class="findings" data-layout-ignore></div>

        <div id="s4-grid" class="grid"></div>

        <div id="s4-strip" class="strip" data-layout-allow-caption-zone>
          <span id="s4-find-0" class="strip-item">
            <span class="strip-role">Security reviewer</span>
            <span class="strip-text"
              >Session identity is asserted by the web app; the API trusts the cookie.</span
            >
          </span>
          <span id="s4-find-1" class="strip-item">
            <span class="strip-role">Maintainer</span>
            <span class="strip-text"
              >Three capabilities are implemented but gated off — their eval gates missed.</span
            >
          </span>
          <span id="s4-find-2" class="strip-item">
            <span class="strip-role">Learner</span>
            <span class="strip-text"
              >Intent is captured before analysis; every downstream agent reads it.</span
            >
          </span>
        </div>
      </div>

      <script>
        (function () {
          const PERSONAS = [
            ["Open-source contributor", "Where to make a first change, and what protects it."],
            ["Competitive analyst", "Capabilities, limits, and where the seams are."],
            ["Security reviewer", "Trust boundaries, inputs, secrets, and authz."],
            ["Adopter / integrator", "Public API, config, and cost of adoption."],
            ["Learner", "How the system is shaped and why."],
            ["Maintainer", "Fragility, debt, and what needs attention."],
          ];

          // The same six findings all the way through. A lens changes which
          // rise to the top, never which exist — that is the whole argument.
          const FINDINGS = [
            "Session cookie is the only identity assertion.",
            "Three capabilities are gated off; eval gates missed.",
            "Intent is captured before any analysis runs.",
            "Provider keys are encrypted at rest.",
            "Six deterministic tools; the AST builds the graph.",
            "Python parses to exact spans; other languages chunk.",
          ];
          // Which findings each lens puts first, by index.
          const ORDER = {
            security: [0, 3, 4, 1, 2, 5],
            maintainer: [1, 4, 3, 0, 5, 2],
            learner: [2, 5, 4, 0, 1, 3],
          };

          const ROW = 103; // 96px card + 7px gap
          const host = document.getElementById("s4-findings");
          FINDINGS.forEach((text, i) => {
            const row = document.createElement("div");
            row.className = "finding";
            row.id = "s4-f-" + i;
            row.style.top = i * ROW + "px";
            const body = document.createElement("span");
            body.className = "finding-text";
            body.textContent = text;
            row.appendChild(body);
            host.appendChild(row);
          });

          const grid = document.getElementById("s4-grid");
          PERSONAS.forEach((p, i) => {
            const card = document.createElement("div");
            card.className = "pcard";
            card.id = "s4-card-" + i;
            const glow = document.createElement("span");
            glow.className = "pcard-glow";
            glow.id = "s4-glow-" + i;
            const body = document.createElement("span");
            body.className = "pcard-body";
            const label = document.createElement("span");
            label.className = "pcard-label";
            label.textContent = p[0];
            const blurb = document.createElement("span");
            blurb.className = "pcard-blurb";
            blurb.textContent = p[1];
            body.appendChild(label);
            body.appendChild(blurb);
            card.appendChild(glow);
            card.appendChild(body);
            grid.appendChild(card);
          });

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s4-kicker", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
          tl.fromTo(
            ".finding",
            { opacity: 0, x: -20 },
            { opacity: 1, x: 0, duration: 0.34, ease: "power2.out", stagger: { each: 0.06 } },
            0.45,
          );
          tl.fromTo(
            ".pcard",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: { each: 0.08 } },
            0.7,
          );
          tl.fromTo("#s4-strip", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.5);

          const BEATS = [
            { at: 1.75, card: 2, order: ORDER.security },
            { at: 4.45, card: 5, order: ORDER.maintainer },
            { at: 7.35, card: 4, order: ORDER.learner },
          ];

          BEATS.forEach((beat, bi) => {
            const t = beat.at;
            if (bi > 0) {
              tl.to("#s4-glow-" + BEATS[bi - 1].card, { opacity: 0, duration: 0.24, ease: "power2.in" }, t - 0.14);
              tl.to("#s4-find-" + (bi - 1), { opacity: 0, duration: 0.18, ease: "none" }, t - 0.14);
            }
            tl.fromTo("#s4-glow-" + beat.card, { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, t);
            tl.to("#s4-card-" + beat.card, { scale: 1.03, duration: 0.18, ease: "power2.out" }, t);
            tl.to("#s4-card-" + beat.card, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.18);

            // Reorder: every row slides to its new slot, and the two this lens
            // leads with take the accent. Transform-only, so nothing reflows.
            beat.order.forEach((findingIndex, slot) => {
              const lead = slot < 2;
              tl.to(
                "#s4-f-" + findingIndex,
                {
                  y: (slot - findingIndex) * ROW,
                  opacity: lead ? 1 : 0.34,
                  borderLeftColor: lead ? "#49b9ad" : "#2b3440",
                  duration: 0.5,
                  ease: "power3.inOut",
                },
                t + 0.06,
              );
            });

            tl.fromTo("#s4-find-" + bi, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "none" }, t + 0.1);
          });

          window.__timelines["s4-lenses"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
