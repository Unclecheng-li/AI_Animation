<!doctype html>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; }
      body { font-family: "Noto Sans TC", sans-serif; }

      .content-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(192,132,252,0.22); border-radius: 20px; padding: 50px 60px; max-width: 1450px; text-align: center; }
      .icon-circle { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 24px; background: linear-gradient(135deg, #7e22ce, #c084fc); display: flex; align-items: center; justify-content: center; font-size: 44px; }
      h1 { font-size: 64px; font-weight: 900; color: #fff; margin-bottom: 16px; letter-spacing: 0.05em; }
      h2 { font-size: 36px; font-weight: 700; color: #c084fc; margin-bottom: 20px; }
      p { font-size: 30px; font-weight: 400; color: #cbd5e1; line-height: 1.7; }
      .highlight { color: #c084fc; font-weight: 700; }
      .law-ref { font-size: 26px; color: #94a3b8; margin-top: 26px; padding: 14px 28px; background: rgba(126,34,206,0.2); border-radius: 12px; display: inline-block; }
      .role-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 16px; margin-top: 20px; }
      .role { background: rgba(192,132,252,0.07); border: 1px solid rgba(192,132,252,0.25); border-radius: 16px; padding: 24px 14px; text-align: center; }
      .role .emoji { font-size: 38px; margin-bottom: 8px; }
      .role .name { font-size: 22px; color: #c084fc; font-weight: 700; margin-bottom: 8px; }
      .role .use { font-size: 17px; color: #e2e8f0; line-height: 1.5; }
      .path-list { text-align: left; margin-top: 16px; }
      .path-row { background: rgba(192,132,252,0.06); border: 1px solid rgba(192,132,252,0.2); border-radius: 14px; padding: 14px 24px; margin-top: 10px; display: flex; gap: 16px; align-items: center; }
      .path-row .badge { width: 56px; height: 56px; border-radius: 50%; background: #c084fc; color: #1a0c2e; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
      .path-row .t { font-size: 24px; color: #e2e8f0; }
      .path-row .t b { color: #c084fc; }
      .callout { margin-top: 26px; font-size: 30px; font-weight: 700; color: #fbbf24; }
    </style>
