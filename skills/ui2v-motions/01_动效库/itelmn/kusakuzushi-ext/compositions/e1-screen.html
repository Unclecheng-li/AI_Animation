    <style>
      * { margin:0; padding:0; box-sizing:border-box; }

      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; font-family:"IBM Plex Sans JP", sans-serif; }

  <body>
    <div id="root" data-composition-id="e1-screen" data-start="0" data-width="1080" data-height="1080" data-duration="17.1" data-fps="60">

          </svg>

    <script>
      (function () {
        // Cursor path data, loaded from assets/ext/cursor-path.json at authoring time
        // and inlined as constants (no fetch at render). Values are final page
        // CSS coordinates (canvasLeft + recorded paddleX already applied).
        const CURSOR_Y = 841.0;
        const HOOK = [1172,1161,1150,1139,1129,1118,1107,1096,1085,1074,1064,1074,1085,1074,1064,1074,1064,1074,1085,1096,1107,1096,1085,1096,1085,1074,1085,1074,1085,1074,1085,1096,1085,1096,1085,1074,1085,1096,1107,1118,1129,1139,1150,1148,1137,1126,1115,1126,1137,1126,1115,1126,1137,1148,1137,1126,1115,1109,1106,1103,1101,1098,1095,1084,1073,1084,1073,1063,1052,1041,1052,1063,1068,1066,1077,1087,1077,1066,1077,1087,1077,1066,1055,1044,1055,1066,1055,1044,1033,1025,1022,1020,1017,1015,1004,993,982,972,961,972,982,993,993,991,988,977,988,999,1010,999,1010,1021,1010,999,988,977,966,958,955,944,951,948,959,948,941,952,941,952,941,931,920,926,923,934,945,956,967,956,945,934,945,956,967,956,967,977,988,999,1010,999,1010,1021,1032,1021,1010,1021,1010,999,1010,1021,1032,1042,1053,1064,1075,1064,1053,1064,1053,1064,1075,1064,1053,1064,1075,1086,1096,1107,1096,1086];
        const EARLY = [1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1060.83,1071,1077,1077,1077,1077,1078,1078,1078,1078,1078,1078,1078,1078,1078,1078,1078,1078,1078,1078,1077,1077,1077,1077,1076,1076,1076,1075,1075,1074,1074,1073,1073,1071,1069,1066,1064,1061,1058,1056,1053,1050,1048,1045,1042,1040,1037,1034,1031,1029,1026,1023,1020,1018,1015,1012,1010,1007,1004,1002,999,996,994,991,988,986,983,982,984,985,986,987,988,990,991,992,994,995,997,998,999,1001,1003,1004,1006,1007,1007,1005,1004,1002,1000,999,997,995,994,992,991,989,988,986,985,984,982,981,980,979,979,982,984,987,990,992,995,998,1001,1003,1006,1009,1012,1015,1017,1020,1023,1026,1029,1031,1034,1037,1040,1043,1046,1048,1051,1054,1057,1060,1062,1065,1068,1071,1072,1073,1074,1075,1075,1076,1088,1104,1105,1104,1102,1101,1099,1098,1096,1095,1093,1091,1090,1088,1086,1084,1082,1080,1090,1090,1090,1090,1089,1089,1089,1088,1088,1088,1087,1087,1086,1086,1084,1081,1078,1075,1073,1082,1099,1100,1102,1103,1102,1091,1069,1066,1062,1058,1055,1051];
        const END = [1003,1025,1035,1046,1068,1089,1079,1089,1111,1089,1079,1068,1068,1068,1057,1046,1025,1003,1014,1025,1003,1003,1014,1003,981,1003,1014,1025,1046,1046,1035,1025,1003,1003,1014,1025,1025,1025,1035,1046,1068,1089,1099,1110,1131,1110,1121,1110,1088,1067,1077,1088,1110,1131,1142,1153,1175,1196,1207,1218,1196,1175,1186,1196,1175,1153,1142,1131,1110,1088,1077,1067,1045,1023,1013,1002,980,1002,991,980,980,958,948,937,915,894,883,872,872,872,883,872,872,872,883,894,915,937,948,958,980,958,948,937,915,915,926,937,915,915,926,937,937,937,926,915,894,872,861,850,872,894,904,915,937,937,926,915,915,937,948,958,980,1002,1013,1023,1045,1045,1056,1067,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088,1088];

        function clampIdx(i, max) { return i < 0 ? 0 : (i > max ? max : i); }

        // Pure function of timeline time -> only touches the cursor position
        // during the three array-tracking windows. Outside those windows this
        // is a no-op and discrete tl.to/tl.set calls below own the position,
        // so no two mechanisms ever write x/y for the same instant.
        function updateCursor(t) {
          if (t >= 0 && t < 3.0) {
            gsap.set("#e1-cursor", { x: HOOK[clampIdx(Math.floor(t * 60), HOOK.length - 1)], y: CURSOR_Y });
          } else if (t >= 4.25 && t < 7.65) {
            gsap.set("#e1-cursor", { x: EARLY[clampIdx(Math.floor((t - 3.75) * 60), EARLY.length - 1)], y: CURSOR_Y });
          } else if (t >= 7.65 && t < 10.50) {
            gsap.set("#e1-cursor", { x: END[clampIdx(Math.floor((t - 7.65) * 60), END.length - 1)], y: CURSOR_Y });
          }
        }

        // Bottom edge sits exactly on the capture's bottom (CSS y 1080): GitHub's #0d1117 must never give way to the root ground.
        gsap.set("#camera", {x:-923.46, y:-432, scale:1.4, transformOrigin:"0 0"});
        gsap.set("#e1-cursor", {x:HOOK[0], y:CURSOR_Y, opacity:1});
        gsap.set("#e1-cursor-crosshair", {opacity:1});
        gsap.set("#e1-cursor-arrow", {opacity:0});
        gsap.set("#e1-cursor-pointer", {opacity:0});

        const tl = gsap.timeline({ paused: true });

        // Single whole-timeline proxy tween drives the array-tracking segments.
        const cursorProxy = { t: 0 };
        tl.to(cursorProxy, { t: 17.1, duration: 17.1, ease: "none", onUpdate: () => updateCursor(cursorProxy.t) }, 0);

        // 3.00 — hook tracking ends; arrow appears off to the side and moves to
        // the "🎮 崩す" button center (705.2, 819). Enters the button at 3.28.
        tl.set("#e1-cursor-crosshair", {opacity:0}, 3.00);
        tl.set("#e1-cursor-arrow", {opacity:1}, 3.00);
        tl.set("#e1-cursor", {x:1180, y:1000}, 3.00);
        tl.to("#e1-cursor", {x:705.2, y:819, duration:0.33, ease:"power2.inOut"}, 3.00);
        tl.set("#e1-cursor-arrow", {opacity:0}, 3.28);
        tl.set("#e1-cursor-pointer", {opacity:1}, 3.28);
        tl.fromTo("#e1-cursor", {scale:0.85}, {scale:1, duration:0.12, ease:"power2.out"}, 3.65);

        // 3.75 — card grows past the click point, so the cursor is now resting
        // on plain card ground (arrow) until it moves onto the board.
        tl.set("#e1-cursor-pointer", {opacity:0}, 3.75);
        tl.set("#e1-cursor-arrow", {opacity:1}, 3.75);

        // 3.85 -> 4.25 — move onto the board, landing exactly where early[]
        // tracking will read at t=4.25 (index computed the same way as
        // updateCursor, so there is no seam at the handoff).
        tl.to("#e1-cursor", {x:EARLY[Math.floor((4.25 - 3.75) * 60)], y:CURSOR_Y, duration:0.40, ease:"power2.inOut"}, 3.85);
        tl.set("#e1-cursor-arrow", {opacity:0}, 3.87);
        tl.set("#e1-cursor-crosshair", {opacity:1}, 3.87);
        tl.fromTo("#e1-cursor", {scale:0.85}, {scale:1, duration:0.12, ease:"power2.out"}, 4.40);

        // 9.983 — the result banner appears (baked into e-end.mp4); the cursor
        // is now over UI chrome rather than the game canvas.
        tl.set("#e1-cursor-crosshair", {opacity:0}, 9.983);
        tl.set("#e1-cursor-arrow", {opacity:1}, 9.983);

        // 10.50 -> 10.95 — move onto the result banner's "やめる" button
        // (center 1062.81, 853.5). Starts from wherever end[] tracking left
        // the cursor (frozen at the board's last frame by this point).
        tl.to("#e1-cursor", {x:1062.81, y:853.5, duration:0.45, ease:"power2.inOut"}, 10.50);
        tl.set("#e1-cursor-arrow", {opacity:0}, 10.90);
        tl.set("#e1-cursor-pointer", {opacity:1}, 10.90);
        tl.fromTo("#e1-cursor", {scale:0.85}, {scale:1, duration:0.12, ease:"power2.out"}, 11.25);

        // 11.35 — grass restored; cursor rests over plain page, then fades.
        tl.set("#e1-cursor-pointer", {opacity:0}, 11.35);
        tl.set("#e1-cursor-arrow", {opacity:1}, 11.35);
        tl.to("#e1-cursor", {opacity:0, duration:0.30, ease:"none"}, 11.60);

        // endcard reveal
        tl.fromTo("#endcard .endcard-title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 13.1 + 0.0);
        tl.fromTo("#endcard .endcard-url",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 13.1 + 0.15);
        tl.fromTo("#endcard .endcard-btn",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 13.1 + 0.3);

        tl.seek(0);
        window.__timelines["e1-screen"] = tl;
      })();
    </script>
