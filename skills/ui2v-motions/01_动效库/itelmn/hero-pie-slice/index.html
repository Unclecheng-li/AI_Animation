<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      .copy {
        position: absolute; left: 140px; top: 300px; color: #f8fafc;
        font-family: "Segoe UI", sans-serif;
      }
      .eyebrow {
        font-size: 24px; letter-spacing: 0.3em; text-transform: uppercase; color: #fb923c; margin-bottom: 22px;
      }
      .title { font-size: 108px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.95; }
      .sub { margin-top: 28px; font-size: 32px; color: #94a3b8; max-width: 620px; }
      .chart {
        position: absolute; left: 980px; top: 180px; width: 720px; height: 720px;
      }
      .pie {
        width: 720px; height: 720px; border-radius: 50%;
        background: conic-gradient(
          #fb923c 0deg var(--a, 0deg),
          #38bdf8 var(--a, 0deg) var(--b, 0deg),
          #a78bfa var(--b, 0deg) var(--c, 0deg),
          #334155 var(--c, 0deg) 360deg
        );
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }
      .hole {
        position: absolute; left: 50%; top: 50%; width: 280px; height: 280px;
        margin: -140px 0 0 -140px; border-radius: 50%; background: #111827;
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", sans-serif; font-size: 64px; font-weight: 700; color: #f8fafc;
      }
      .legend {
        position: absolute; left: 140px; bottom: 160px; display: flex; gap: 28px;
        font-family: "Segoe UI", sans-serif; font-size: 24px; color: #cbd5e1;
      }
      .swatch { width: 18px; height: 18px; border-radius: 4px; display: inline-block; margin-right: 10px; vertical-align: -2px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Data · Share</div>
        <div class="title">Pie Slice</div>
        <div class="sub">Category mix reveals one wedge at a time</div>
      </div>
      <div id="chart" class="clip chart" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="pie" id="pie"></div>
        <div class="hole" id="hole">0%</div>
      </div>
      <div id="legend" class="clip legend" data-start="0" data-duration="4.5" data-track-index="2">
        <div><span class="swatch" style="background:#fb923c"></span>Product</div>
        <div><span class="swatch" style="background:#38bdf8"></span>Docs</div>
        <div><span class="swatch" style="background:#a78bfa"></span>Community</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const state = { a: 0, b: 0, c: 0, pct: 0 };
      const pie = document.getElementById("pie");
      const hole = document.getElementById("hole");
      function paint() {
        pie.style.setProperty("--a", state.a + "deg");
        pie.style.setProperty("--b", state.b + "deg");
        pie.style.setProperty("--c", state.c + "deg");
        hole.textContent = Math.round(state.pct) + "%";
      }
      gsap.set("#copy", { opacity: 0, x: -20 });
      gsap.set("#chart", { opacity: 0, scale: 0.86, transformOrigin: "50% 50%" });
      gsap.set("#legend", { opacity: 0, y: 16 });
      paint();
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.5 }, 0.15)
        .to("#chart", { opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" }, 0.3)
        .to(state, {
          a: 130, b: 130, c: 130, pct: 36,
          duration: 0.95,
          ease: "power2.out",
          onUpdate: paint,
        }, 0.85)
        .to(state, {
          a: 130, b: 230, c: 230, pct: 64,
          duration: 0.85,
          ease: "power2.out",
          onUpdate: paint,
        }, 1.85)
        .to(state, {
          a: 130, b: 230, c: 320, pct: 89,
          duration: 0.9,
          ease: "power2.out",
          onUpdate: paint,
        }, 2.75)
        .to("#legend", { opacity: 1, y: 0, duration: 0.45 }, 2.2)
        .to("#chart", { scale: 1.03, duration: 1.2, ease: "sine.inOut" }, 3.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
