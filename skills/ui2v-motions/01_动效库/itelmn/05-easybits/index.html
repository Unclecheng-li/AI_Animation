<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
      /* recetas CSS de motion-anything (Animate.css): seek-safe. Sobre SVG: transform-box fill-box. */
      @keyframes tada {
  from {
    transform: scale3d(1, 1, 1);
  }

  10%,
  20% {
    transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
  }

  30%,
  50%,
  70%,
  90% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
  }

  40%,
  60%,
  80% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes jello {
  from,
  11.1%,
  to {
    transform: translate3d(0, 0, 0);
  }

  22.2% {
    transform: skewX(-12.5deg) skewY(-12.5deg);
  }

  33.3% {
    transform: skewX(6.25deg) skewY(6.25deg);
  }

  44.4% {
    transform: skewX(-3.125deg) skewY(-3.125deg);
  }

  55.5% {
    transform: skewX(1.5625deg) skewY(1.5625deg);
  }

  66.6% {
    transform: skewX(-0.78125deg) skewY(-0.78125deg);
  }

  77.7% {
    transform: skewX(0.390625deg) skewY(0.390625deg);
  }

  88.8% {
    transform: skewX(-0.1953125deg) skewY(-0.1953125deg);
  }
}
@keyframes bounce {
  from,
  20%,
  53%,
  to {
    animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0);
  }

  40%,
  43% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -30px, 0) scaleY(1.1);
  }

  70% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -15px, 0) scaleY(1.05);
  }

  80% {
    transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0) scaleY(0.95);
  }

  90% {
    transform: translate3d(0, -4px, 0) scaleY(1.02);
  }
}
@keyframes headShake {
  0% {
    transform: translateX(0);
  }

  6.5% {
    transform: translateX(-6px) rotateY(-9deg);
  }

  18.5% {
    transform: translateX(5px) rotateY(7deg);
  }

  31.5% {
    transform: translateX(-3px) rotateY(-5deg);
  }

  43.5% {
    transform: translateX(2px) rotateY(3deg);
  }

  50% {
    transform: translateX(0);
  }
}
@keyframes rubberBand {
  from {
    transform: scale3d(1, 1, 1);
  }

  30% {
    transform: scale3d(1.25, 0.75, 1);
  }

  40% {
    transform: scale3d(0.75, 1.25, 1);
  }

  50% {
    transform: scale3d(1.15, 0.85, 1);
  }

  65% {
    transform: scale3d(0.95, 1.05, 1);
  }

  75% {
    transform: scale3d(1.05, 0.95, 1);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes swing {
  20% {
    transform: rotate3d(0, 0, 1, 15deg);
  }

  40% {
    transform: rotate3d(0, 0, 1, -10deg);
  }

  60% {
    transform: rotate3d(0, 0, 1, 5deg);
  }

  80% {
    transform: rotate3d(0, 0, 1, -5deg);
  }

  to {
    transform: rotate3d(0, 0, 1, 0deg);
  }
}
@keyframes wobble {
  from {
    transform: translate3d(0, 0, 0);
  }

  15% {
    transform: translate3d(-25%, 0, 0) rotate3d(0, 0, 1, -5deg);
  }

  30% {
    transform: translate3d(20%, 0, 0) rotate3d(0, 0, 1, 3deg);
  }

  45% {
    transform: translate3d(-15%, 0, 0) rotate3d(0, 0, 1, -3deg);
  }

  60% {
    transform: translate3d(10%, 0, 0) rotate3d(0, 0, 1, 2deg);
  }

  75% {
    transform: translate3d(-5%, 0, 0) rotate3d(0, 0, 1, -1deg);
  }

  to {
    transform: translate3d(0, 0, 0);
  }
}

      .anim { transform-box: fill-box; transform-origin: 50% 50%; animation-fill-mode: both; animation-timing-function: ease; }
      
    #mother-ghost { animation: jello 1.2s .5s both, swing 1.2s 9s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #child-a-ghost { animation: bounce 1s 3.2s both; transform-box: fill-box; transform-origin: 50% 100%; }
    #child-a { animation: bounce 1s 2.6s both; } #child-b { animation: bounce 1s 4.4s both; } #child-c { animation: headshake 1s 6.4s both; }
    #child-a, #child-b, #child-c { transform-box: fill-box; transform-origin: 50% 100%; }
    #adapter { animation: tada 1s 2.2s both; transform-box: fill-box; transform-origin: 50% 50%; }
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="14">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern></defs>
  <rect width="1920" height="1080" fill="#0E1317"/><rect width="1920" height="1080" fill="url(#dots)"/>

  <g id="title">
    <text x="960" y="100" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">En EasyBits las dos son cajas</text>
    <text x="960" y="150" text-anchor="middle" font-size="28" fill="#85DDCB">la caja madre corre eve; cuando el modelo pide bash, eve pide una caja hija</text>
  </g>

  <!-- ===== Caja madre ===== -->
  <g id="mother">
    <rect x="140" y="250" width="640" height="470" rx="14" fill="#0E1317" transform="translate(14,14)"/>
    <polygon points="140,250 170,220 810,220 780,250" fill="#37AB93" stroke="#F2F5F4" stroke-width="4" stroke-linejoin="round"/>
    <rect x="140" y="250" width="640" height="470" rx="14" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
    <text x="460" y="292" text-anchor="middle" font-size="26" font-weight="900" fill="#0E1317">caja madre · template eve-nitro</text>
    <rect x="160" y="310" width="600" height="340" rx="10" fill="#0E1317"/>
    <g id="mother-items" font-size="24" fill="#F2F5F4">
      <text x="190" y="360" fill="#8DCF6E">$ eve start --host 0.0.0.0</text>
      <text x="190" y="408">Node 24 · eve 0.58</text>
      <text x="190" y="456">Postgres (o /data)</text>
      <text x="190" y="504">llaves · checkpoints</text>
      <text x="190" y="552" fill="#85DDCB">puerto 3000 expuesto</text>
    </g>
    <g id="mother-ghost"><image xlink:href="assets/ghosty.png" x="580" y="380" width="150" height="175" preserveAspectRatio="xMidYMid meet"/></g>
    <g stroke="#F2F5F4" stroke-width="3"><circle cx="176" cy="690" r="8" fill="#8DCF6E"/><circle cx="202" cy="690" r="8" fill="#8DCF6E"/><circle cx="228" cy="690" r="8" fill="#F2F5F4"/></g>
    <text x="460" y="770" text-anchor="middle" font-size="24" fill="#7C8A8E">aquí Ghosty piensa</text>
  </g>

  <!-- ===== Etiqueta del adaptador ===== -->
  <g id="adapter">
    <rect x="830" y="700" width="260" height="46" rx="8" fill="#0E1317" transform="translate(8,8)"/>
    <rect x="830" y="700" width="260" height="46" rx="8" fill="#F2F5F4"/>
    <text x="960" y="732" text-anchor="middle" font-size="22" font-weight="900" fill="#0E1317">backend: easybits()</text>
  </g>

  <!-- ===== Cajas hijas (una por sesión) ===== -->
  <g id="child-a">
    <rect x="1180" y="250" width="560" height="130" rx="12" fill="#0E1317" transform="translate(10,10)"/>
    <rect x="1180" y="250" width="560" height="130" rx="12" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
    <text x="1200" y="286" font-size="22" font-weight="900" fill="#0E1317">caja hija · sesión A</text>
    <rect x="1196" y="300" width="528" height="66" rx="8" fill="#0E1317"/>
    <text x="1216" y="342" font-size="22" fill="#8DCF6E">/workspace $ python run.py</text>
    <g id="child-a-ghost"><image xlink:href="assets/ghosty.png" x="1640" y="292" width="70" height="82" preserveAspectRatio="xMidYMid meet"/></g>
  </g>
  <g id="child-b">
    <rect x="1180" y="420" width="560" height="130" rx="12" fill="#0E1317" transform="translate(10,10)"/>
    <rect x="1180" y="420" width="560" height="130" rx="12" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
    <text x="1200" y="456" font-size="22" font-weight="900" fill="#0E1317">caja hija · sesión B</text>
    <rect x="1196" y="470" width="528" height="66" rx="8" fill="#0E1317"/>
    <text x="1216" y="512" font-size="22" fill="#8DCF6E">/workspace $ bash</text>
  </g>
  <g id="child-c">
    <rect x="1180" y="590" width="560" height="130" rx="12" fill="#0E1317" transform="translate(10,10)"/>
    <rect x="1180" y="590" width="560" height="130" rx="12" fill="#7C8A8E" stroke="#F2F5F4" stroke-width="4"/>
    <text x="1200" y="626" font-size="22" font-weight="900" fill="#0E1317">caja hija · sesión C</text>
    <rect x="1196" y="640" width="528" height="66" rx="8" fill="#0E1317"/>
    <text x="1216" y="682" font-size="20" fill="#7C8A8E">suspendida · resume ≈ 3 s · /workspace vivo</text>
    <!-- carámbanos en el borde superior -->
    <g id="child-c-frost" fill="#DDF4F0">
      <polygon points="1200,718 1240,718 1220,758"/><polygon points="1300,718 1330,718 1315,746"/>
      <polygon points="1420,718 1470,718 1445,766"/><polygon points="1560,718 1590,718 1575,744"/>
      <polygon points="1660,718 1710,718 1685,762"/>
    </g>
  </g>

  <!-- ===== Flechas madre → hijas ===== -->
  <g id="arrows" fill="none" stroke="#F2F5F4" stroke-width="6" stroke-linecap="round">
    <path id="arrow-a" d="M780,400 C900,400 1000,315 1170,315"/>
    <path id="arrow-b" d="M780,440 C900,440 1000,485 1170,485"/>
    <path id="arrow-c" d="M780,480 C900,480 1000,655 1170,655" stroke="#7C8A8E" stroke-dasharray="12 12"/>
  </g>
  <g fill="#F2F5F4"><polygon points="1180,315 1158,301 1158,329"/><polygon points="1180,485 1158,471 1158,499"/></g>
  <polygon points="1180,655 1158,641 1158,669" fill="#7C8A8E"/>

  <g id="footer">
    <text x="960" y="870" text-anchor="middle" font-size="26" fill="#7C8A8E">mismo aislamiento (Firecracker) para las dos: la madre crea, usa y suspende a las hijas</text>
    <text x="960" y="914" text-anchor="middle" font-size="26" fill="#F2F5F4">prewarm = snapshot · create = fork ≈ 7 s · stop = suspend · resume ≈ 3 s</text>
  </g>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

    draw("#arrow-a", 2.2, .5); draw("#arrow-b", 4.0, .5); draw("#arrow-c", 6.0, .5);
    // la hija C hiberna: carámbanos crecen
    tl.set("#child-c-frost polygon", { scaleY: 0, transformOrigin: "50% 0%" }, 0.01);
    tl.to("#child-c-frost polygon", { scaleY: 1, duration: .5, stagger: .08, ease: "power2.out" }, 6.6);
  
      tl.set({}, {}, 14);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
