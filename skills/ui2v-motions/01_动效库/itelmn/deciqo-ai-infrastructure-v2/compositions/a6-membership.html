<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--bone); }
        #a6-title { position: absolute; left: 80px; top: 60px; font-size: 110px; white-space: nowrap; }
        #a6-title span { color: var(--ai); }
        #a6-sub { position: absolute; left: 84px; top: 180px; font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--dim); white-space: nowrap; }
        #a6-grid { position: absolute; left: 80px; top: 290px; width: 1110px; height: 740px; }
        .a6-d { position: absolute; width: 50px; height: 50px; border-radius: 8px; background: #1c1c21; border: 3px solid #2a2a30; box-sizing: border-box; }
        .a6-b { position: absolute; left: -14px; width: 1138px; border: 4px solid var(--ai); border-radius: 12px; box-sizing: border-box; }
        .a6-bl { position: absolute; right: 12px; top: -40px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 20px; color: var(--ai2); letter-spacing: 0.1em; }
        #a6-side { position: absolute; left: 1290px; top: 300px; width: 560px; }
        .a6-lg { display: flex; align-items: center; gap: 22px; height: 76px; font-family: "JetBrains Mono", monospace; font-size: 26px; white-space: nowrap; }
        .a6-sw { width: 44px; height: 44px; border-radius: 8px; box-sizing: border-box; flex: none; }
        #a6-note { position: absolute; left: 1290px; top: 700px; width: 560px; font-size: 76px; line-height: 0.95; }
        #a6-note2 { position: absolute; left: 1294px; top: 870px; font-family: "JetBrains Mono", monospace; font-size: 24px; color: var(--dim); white-space: nowrap; }
      </style>
      <div data-hf-id="hf-uvdj" id="root" data-composition-id="a6-membership" data-width="1920" data-height="1080">
        <div data-hf-id="hf-gpn5" id="a6-title" class="disp">Call 2 · <span data-hf-id="hf-p805">Membership</span></div>
        <div data-hf-id="hf-xica" id="a6-sub">every stored review is read, not only the ones discovery quoted</div>
        <div data-hf-id="hf-ialx" id="a6-grid"></div>
        <div data-hf-id="hf-why8" id="a6-side">
          <div data-hf-id="hf-xqxk" class="a6-lg" id="a6-l1"><span data-hf-id="hf-gui1" class="a6-sw" style="background:var(--ai)"></span>supports the finding</div>
          <div data-hf-id="hf-j8lq" class="a6-lg" id="a6-l2"><span data-hf-id="hf-6nwe" class="a6-sw" style="border:4px solid var(--ok)"></span>contradicts it</div>
          <div data-hf-id="hf-jxh9" class="a6-lg" id="a6-l3"><span data-hf-id="hf-p3iq" class="a6-sw" style="background:#1c1c21;border:3px solid #2a2a30"></span>doesn't discuss it</div>
          <div data-hf-id="hf-8bxv" class="a6-lg" id="a6-l4" style="color:var(--dim)">≤ 150 reviews · balanced batches ≤ 50</div>
        </div>
        <div data-hf-id="hf-4sdb" id="a6-note" class="disp">Still just<br data-hf-id="hf-x5px">proposals.</div>
        <div data-hf-id="hf-8ilt" id="a6-note2">code decides what counts →</div>
      </div>
      <script>
        (function () {
          const COLS = 15, ROWS = 10, CELL = 74;
          let seed = 7;
          const rnd = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
          const lab = [];
          let html = "";
          for (let i = 0; i < COLS * ROWS; i++) {
            const r = rnd();
            lab.push(r < 0.2 ? "s" : r < 0.26 ? "c" : "n");
            html += `<div class="a6-d" id="a6-d${i}" style="left:${(i % COLS) * CELL}px;top:${Math.floor(i / COLS) * CELL}px"></div>`;
          }
          // three batches of 50 rows: rows 0-3.33 … use row bands 0-3, 3-6, 6-10 (50 each = 3⅓ rows) → draw as brackets
          const bands = [[0, 50], [50, 100], [100, 150]];
          bands.forEach(([a, b], k) => {
            const top = Math.floor(a / COLS) * CELL - 12, bot = Math.ceil(b / COLS) * CELL - 12;
            html += `<div class="a6-b" id="a6-b${k}" style="top:${top}px;height:${bot - top}px"><span class="a6-bl">BATCH ${k + 1} · 50</span></div>`;
          });
          document.getElementById("a6-grid").innerHTML = html;
          const tl = gsap.timeline({ paused: true });
          gsap.set([".a6-b", "#a6-note", "#a6-note2"], { opacity: 0 });
          gsap.set(["#a6-l1", "#a6-l2", "#a6-l3", "#a6-l4"], { opacity: 0 });
          tl.fromTo("#a6-title", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
          tl.fromTo("#a6-sub", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
          tl.fromTo(".a6-d", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: { each: 0.004, from: "start" } }, 0.2);
          bands.forEach(([a, b], k) => {
            const t = 1.2 + k * 1.1;
            tl.to(`#a6-b${k}`, { opacity: 1, duration: 0.15 }, t);
            if (k > 0) tl.to(`#a6-b${k - 1}`, { opacity: 0, duration: 0.2 }, t);
            for (let i = a; i < b; i++) {
              const tt = t + 0.15 + ((i - a) / 50) * 0.8;
              if (lab[i] === "s") tl.to(`#a6-d${i}`, { backgroundColor: "#8b6cff", borderColor: "#b9a8ff", duration: 0.12 }, tt);
              else if (lab[i] === "c") tl.to(`#a6-d${i}`, { borderColor: "#46f0a4", duration: 0.12 }, tt);
              else tl.to(`#a6-d${i}`, { opacity: 0.35, duration: 0.12 }, tt);
            }
          });
          tl.to("#a6-b2", { opacity: 0, duration: 0.2 }, 4.6);
          tl.to(["#a6-l1", "#a6-l2", "#a6-l3", "#a6-l4"], { opacity: 1, duration: 0.3, stagger: 0.12 }, 1.4);
          tl.to("#a6-note", { opacity: 1, duration: 0.01 }, 4.9);
          V2.scramble(tl, "#a6-note", "Still just proposals.", 4.9, 0.5);
          tl.to("#a6-note2", { opacity: 1, duration: 0.3 }, 5.5);
          window.__timelines["a6-membership"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
