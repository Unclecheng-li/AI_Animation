<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Deciqo — architecture flight (v4)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07070b; }
      :root { --bone: #ece9df; --dim: #aaaaa5; --ai: #8b6cff; --ai2: #b9a8ff; --seller: #ffb43d; --ok: #46f0a4; --bad: #ff5145; --gold: #f5c451; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07070b; color: var(--bone); }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .ov { position: absolute; inset: 0; pointer-events: none; }
      .disp { font-family: "League Gothic", sans-serif; text-transform: uppercase; line-height: 1.0; letter-spacing: 0.005em; }
      .mono { font-family: "JetBrains Mono", monospace; }
      #vig { background: radial-gradient(ellipse 80% 75% at 50% 48%, rgba(7,7,11,0) 55%, rgba(0,0,0,0.62) 100%); }
      #shade { background: linear-gradient(90deg, rgba(7,7,11,0.8) 0%, rgba(7,7,11,0.4) 34%, rgba(7,7,11,0) 60%); }
      .ic { display: block; width: 40px; height: 40px; background: var(--c, var(--bone)); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
      #hud { position: absolute; left: 56px; top: 44px; display: flex; align-items: center; gap: 16px; font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      #hud img { width: 34px; height: 34px; }
      .pills { position: absolute; right: 56px; top: 40px; width: 440px; height: 48px; }
      .pill { position: absolute; right: 0; top: 0; display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 20px; border-radius: 24px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 20px; letter-spacing: 0.1em; white-space: nowrap; }
      .pill .ic { width: 26px; height: 26px; }
      #pAI { background: rgba(139,108,255,0.16); color: var(--ai2); border: 2px solid var(--ai); --c: var(--ai2); }
      #pRU { background: rgba(236,233,223,0.10); color: var(--bone); border: 2px solid var(--bone); --c: var(--bone); }
      .chap { position: absolute; left: 56px; bottom: 52px; display: flex; align-items: center; gap: 18px; }
      .chap .b { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: rgba(12,12,18,0.8); border: 2px solid var(--c); }
      .chap .n { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px; color: var(--c); letter-spacing: 0.1em; }
      .chap .t { font-size: 72px; }
      #lock { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; }
      #lock .row { display: flex; align-items: center; gap: 40px; }
      #lock .mk { width: 190px; height: 190px; background: url(assets/mark.png) center / contain no-repeat; }
      #lock .word { font-size: 300px; }
      #triad { display: flex; gap: 26px; margin-top: 56px; }
      .chip { display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 30px; border-radius: 38px; background: rgba(12,12,18,0.85); border: 2px solid var(--c); font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.06em; color: var(--c); }
      .chip .ic { width: 38px; height: 38px; }
      .arrow { align-self: center; width: 34px; height: 34px; --c: var(--dim); }
      #flash { background: #fff; }
      #lockShade { background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(7,7,11,0.82) 0%, rgba(7,7,11,0.55) 55%, rgba(7,7,11,0) 100%); }
      .fontprime { font-family: "League Gothic"; } .fontprime2 { font-family: "JetBrains Mono"; } .fontprime3 { font-family: "Montserrat"; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ruvo" id="root" data-composition-id="main" data-start="0" data-duration="150" data-width="1920" data-height="1080">
      <canvas data-hf-id="hf-iu2q" id="gl" width="1920" height="1080" data-layout-allow-overflow=""></canvas>
      <div data-hf-id="hf-usch" class="ov" id="vig"></div>
      <div data-hf-id="hf-erh0" class="ov" id="shade"></div>

      <div data-hf-id="hf-y9uw" id="hud"><img data-hf-id="hf-lrv4" src="assets/mark.png" alt="">Deciqo · gap-v1.9 · verify-v2.2</div>
      <div data-hf-id="hf-c9cw" class="pills">
        <div data-hf-id="hf-7fcr" class="pill" id="pAI"><i data-hf-id="hf-ol2d" class="ic" style="--m:url(assets/icons/sparkles.svg)"></i>OpenAI key on</div>
        <div data-hf-id="hf-anuc" class="pill" id="pRU"><i data-hf-id="hf-9us3" class="ic" style="--m:url(assets/icons/cog.svg)"></i>Rule mode · no model</div>
      </div>

      <!-- chapter tags: icon + number + one word -->
      <div data-hf-id="hf-tfhp" class="chap" id="c1" style="--c:var(--bone)"><div data-hf-id="hf-goiq" class="b"><i data-hf-id="hf-w0b1" class="ic" style="--m:url(assets/icons/server.svg)"></i></div><div data-hf-id="hf-7h2p" class="n">01</div><div data-hf-id="hf-wh2h" class="t disp">System</div></div>
      <div data-hf-id="hf-2z5j" class="chap" id="c2" style="--c:var(--seller)"><div data-hf-id="hf-ys5i" class="b"><i data-hf-id="hf-99qk" class="ic" style="--m:url(assets/icons/plug-zap.svg)"></i></div><div data-hf-id="hf-8nzs" class="n">02</div><div data-hf-id="hf-3pvu" class="t disp">Sources</div></div>
      <div data-hf-id="hf-a8zh" class="chap" id="c3" style="--c:var(--ai2)"><div data-hf-id="hf-z6gj" class="b"><i data-hf-id="hf-3c60" class="ic" style="--m:url(assets/icons/filter.svg)"></i></div><div data-hf-id="hf-89or" class="n">03</div><div data-hf-id="hf-h3ls" class="t disp">Triage</div></div>
      <div data-hf-id="hf-mtpo" class="chap" id="c4" style="--c:var(--ai2)"><div data-hf-id="hf-zkrk" class="b"><i data-hf-id="hf-fy3y" class="ic" style="--m:url(assets/icons/key-round.svg)"></i></div><div data-hf-id="hf-6a5m" class="n">04</div><div data-hf-id="hf-k8tz" class="t disp">API key</div></div>
      <div data-hf-id="hf-0j9h" class="chap" id="c5" style="--c:var(--gold)"><div data-hf-id="hf-wsmd" class="b"><i data-hf-id="hf-auaa" class="ic" style="--m:url(assets/icons/coins.svg)"></i></div><div data-hf-id="hf-5vul" class="n">05</div><div data-hf-id="hf-msg3" class="t disp">Credit flow</div></div>
      <div data-hf-id="hf-jtsa" class="chap" id="c6" style="--c:var(--bone)"><div data-hf-id="hf-x6xe" class="b"><i data-hf-id="hf-vgqb" class="ic" style="--m:url(assets/icons/cog.svg)"></i></div><div data-hf-id="hf-72ro" class="n">06</div><div data-hf-id="hf-ypsu" class="t disp">Fallback</div></div>
      <div data-hf-id="hf-8jk7" class="chap" id="c7" style="--c:var(--ok)"><div data-hf-id="hf-xl8f" class="b"><i data-hf-id="hf-kaga" class="ic" style="--m:url(assets/icons/shield-check.svg)"></i></div><div data-hf-id="hf-6ogn" class="n">07</div><div data-hf-id="hf-b76f" class="t disp">Code veto</div></div>
      <div data-hf-id="hf-vk9t" class="chap" id="c8" style="--c:var(--seller)"><div data-hf-id="hf-xzjg" class="b"><i data-hf-id="hf-2vhk" class="ic" style="--m:url(assets/icons/ruler.svg)"></i></div><div data-hf-id="hf-b1ty" class="n">08</div><div data-hf-id="hf-skkt" class="t disp">Fact gate</div></div>
      <div data-hf-id="hf-w4sl" class="chap" id="c9" style="--c:var(--ok)"><div data-hf-id="hf-v7e9" class="b"><i data-hf-id="hf-6lj4" class="ic" style="--m:url(assets/icons/radar.svg)"></i></div><div data-hf-id="hf-anix" class="n">09</div><div data-hf-id="hf-cr77" class="t disp">Watch</div></div>

      <div class="ov" id="lockShade"></div>
      <div data-hf-id="hf-sgcw" id="lock">
        <div data-hf-id="hf-xf7h" class="row" id="lockRow"><div data-hf-id="hf-e15o" class="mk"></div><div data-hf-id="hf-8chz" class="word disp">Deciqo</div></div>
        <div data-hf-id="hf-0vfr" id="triad">
          <div data-hf-id="hf-m3mv" class="chip" id="k1" style="--c:var(--ai2)"><i data-hf-id="hf-6prt" class="ic" style="--m:url(assets/icons/sparkles.svg)"></i>model proposes</div>
          <i data-hf-id="hf-2nyj" class="ic arrow" id="a1" style="--m:url(assets/icons/chevron-right.svg)"></i>
          <div data-hf-id="hf-i4ze" class="chip" id="k2" style="--c:var(--bone)"><i data-hf-id="hf-v2fa" class="ic" style="--m:url(assets/icons/cog.svg)"></i>code decides</div>
          <i data-hf-id="hf-u5lg" class="ic arrow" id="a2" style="--m:url(assets/icons/chevron-right.svg)"></i>
          <div data-hf-id="hf-ovuk" class="chip" id="k3" style="--c:var(--seller)"><i data-hf-id="hf-0o4w" class="ic" style="--m:url(assets/icons/user-round.svg)"></i>seller decides</div>
        </div>
      </div>
      <div data-hf-id="hf-m1xp" class="ov" id="flash"></div>
      <span data-hf-id="hf-1dco" class="fontprime" style="position:absolute;opacity:0">a</span><span data-hf-id="hf-5u40" class="fontprime2" style="position:absolute;opacity:0">a</span><span data-hf-id="hf-5n0b" class="fontprime3" style="position:absolute;opacity:0">a</span>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      function beat(sel, a, b, y = 30) {
        tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, a);
        tl.to(sel, { opacity: 0, y: -14, duration: 0.35, ease: "power2.in" }, b - 0.35);
      }
      gsap.set(".chap, .pill, #lock, #lockShade, #hud, #flash, #shade, .chip, .arrow", { opacity: 0 });
      tl.to("#hud", { opacity: 1, duration: 0.6 }, 8.4).to("#hud", { opacity: 0, duration: 0.4 }, 140.4);
      beat("#c1", 8.6, 19.8);
      beat("#c2", 20.4, 34.8);
      beat("#c3", 35.2, 41.9);
      beat("#c4", 42.3, 47.8);
      beat("#c5", 48.2, 73.2);
      beat("#c6", 73.6, 85.8);
      beat("#c7", 86.4, 99.8);
      beat("#c8", 100.2, 119.8);
      beat("#c9", 120.2, 135.8);
      tl.to("#pAI", { opacity: 1, duration: 0.3 }, 45.4).to("#pAI", { opacity: 0, duration: 0.2 }, 74.0);
      tl.to("#pRU", { opacity: 1, duration: 0.3 }, 74.3).to("#pRU", { opacity: 0, duration: 0.3 }, 86.0);
      // flashes on the two whips and the phone buzz
      tl.set("#flash", { opacity: 0 }, 0);
      [[3.95, 0.22], [104.3, 0.12], [116.1, 0.12]].forEach(([at, k]) => tl.to("#flash", { opacity: k, duration: 0.06 }, at).to("#flash", { opacity: 0, duration: 0.45 }, at + 0.07));
      // closing lock-up
      tl.to("#shade", { opacity: 0.0, duration: 0.1 }, 0);
      tl.to("#lockShade", { opacity: 1, duration: 1.0 }, 141.0);
      tl.fromTo("#lock", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 141.2);
      ["#k1", "#a1", "#k2", "#a2", "#k3"].forEach((s, i) => tl.fromTo(s, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 142.4 + i * 0.35));
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as THREE from "three";
      import { loadAssets } from "./assets/v4/icons.js";
      import { buildFilm } from "./assets/v4/film.js";
      import { drive } from "./assets/v4/engine.js";

      const ICONS = ["user-round", "file-text", "clipboard-paste", "store", "layout-grid", "server", "container", "sparkles", "send", "globe", "plug-zap", "shield-check",
        "wallet", "eye-off", "hash", "package", "message-square-text", "ruler", "check", "receipt", "bell", "timer", "cpu", "list-checks", "filter", "key-round",
        "octagon-x", "lock", "shield-alert", "braces", "scale", "layers", "cog", "truck", "gem", "quote", "x", "chart-column", "search", "hourglass", "circle-check",
        "clock", "rotate-ccw"];
      const LOGOS = { openai: "openai.svg", telegram: "telegram.svg", woocommerce: "woocommerce.svg", lazada: "lazada.png", shopee: "shopee.svg", tokopedia: "tokopedia.svg",
        docker: "docker.svg", fastapi: "fastapi.svg", sqlite: "sqlite.svg", react: "react.svg", nginx: "nginx.svg", python: "python.svg" };

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = (async () => {
        await Promise.all([
          document.fonts.load('700 40px "JetBrains Mono"'), document.fonts.load('500 40px "JetBrains Mono"'), document.fonts.load('600 40px "JetBrains Mono"'),
          document.fonts.load('100px "League Gothic"'), document.fonts.load('600 40px "Montserrat"'),
        ]);
        await loadAssets(ICONS, LOGOS);
        const loader = new THREE.TextureLoader();
        const footage = await Promise.all(["R1_sources", "R4_needs_fact_crop", "R5_type_fact_crop", "R6_ready_crop", "R7_came_back_crop"].map(async (n) => {
          const t = await loader.loadAsync(`assets/footage/${n}.png`);
          t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
        }));
        const film = await buildFilm(document.getElementById("gl"), footage);
        drive(film.render);
      })();
    </script>
  </body>
</html>
