<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Johari Window Model"},
  {"id":"quadrants","type":"string","label":"Quadrants (JSON)","default":"[{\"name\":\"ARENA\",\"desc\":\"Known to self and known to others. This is the public self — behaviours, attitudes, and skills that are openly shared and understood by everyone.\",\"x\":\"right\",\"y\":\"top\"},{\"name\":\"BLIND\",\"desc\":\"Unknown to self but known to others. Others see things about you that you may not recognise — feedback from colleagues can help reduce this area.\",\"x\":\"left\",\"y\":\"top\"},{\"name\":\"HIDDEN\",\"desc\":\"Known to self but unknown to others. Private feelings, fears, and hidden agendas. Building trust encourages sharing and reduces this area.\",\"x\":\"right\",\"y\":\"bottom\"},{\"name\":\"UNKNOWN\",\"desc\":\"Unknown to self and unknown to others. Untapped potential, unconscious motives, and undiscovered talents. Exploration and new experiences bring these to light.\",\"x\":\"left\",\"y\":\"bottom\"}]"},
  {"id":"xTopLabel","type":"string","label":"X-Axis Top Label","default":"Known by others"},
  {"id":"xBottomLabel","type":"string","label":"X-Axis Bottom Label","default":"Unknown by others"},
  {"id":"yLeftLabel","type":"string","label":"Y-Axis Left Label","default":"Known by self"},
  {"id":"yRightLabel","type":"string","label":"Y-Axis Right Label","default":"Unknown by self"},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#34efff"},
  {"id":"bgColor","type":"color","label":"Background","default":"#0a1628"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-charcoal.png"},
  {"id":"durationPerQuadrant","type":"number","label":"Seconds per Quadrant","default":3,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #34efff; --bg: #0a1628; --base-plate: url("v2-base-charcoal.png"); --coral: #cc785c; --cream: #faf9f5; --surface: #112236; --surface-raised: #17304a; --border: #1f3a5c; --muted: #b2c4dc; }
    body { width: 1920px; height: 1080px; background: var(--bg); font-family: 'Inter', Arial, Helvetica, sans-serif; overflow: hidden; position: relative; color: var(--cream); }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; display: flex; overflow: hidden; background: radial-gradient(ellipse 1200px 760px at 42% 48%, #123050 0%, #0a1628 58%, #050a13 100%); }
    [data-composition-id] > * { z-index: 2; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .cockpit-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    .cockpit-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(52,239,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(52,239,255,0.06) 1px, transparent 1px); background-size: 72px 72px; opacity: 0.78; mask-image: radial-gradient(ellipse 74% 64% at 45% 50%, #000 0%, transparent 100%); }
    .cockpit-glow { position: absolute; left: 42%; top: 57%; width: 1180px; height: 660px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(52,239,255,0.18) 0%, rgba(52,239,255,0.06) 44%, transparent 72%); filter: blur(18px); }
    .cockpit-coral { position: absolute; right: 130px; top: 120px; width: 620px; height: 420px; background: radial-gradient(ellipse, rgba(204,120,92,0.2), transparent 68%); filter: blur(22px); }
    .scanline { position: absolute; left: 0; right: 0; top: -140px; height: 140px; background: linear-gradient(180deg, transparent, rgba(52,239,255,0.18), transparent); opacity: 0.55; }
    .topbar { position: absolute; left: 84px; right: 84px; top: 48px; height: 54px; display: flex; align-items: center; justify-content: space-between; z-index: 4; border-bottom: 1px solid rgba(52,239,255,0.18); }
    .topbar .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--primary); }
    .topbar .status { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
    .topbar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 20px rgba(204,120,92,0.9); }
    .matrix-area { position: relative; width: 1000px; height: 100%; display: flex; align-items: center; justify-content: center; padding-top: 36px; }
    .matrix-shell { position: absolute; width: 780px; height: 780px; border: 1px solid rgba(52,239,255,0.18); border-radius: 28px; background: rgba(10,22,40,0.42); box-shadow: inset 0 0 80px rgba(52,239,255,0.04), 0 24px 80px rgba(0,0,0,0.22); }
    .matrix { position: relative; width: 680px; height: 680px; }
    .axis-h, .axis-v { position: absolute; background: linear-gradient(90deg, transparent, var(--primary), transparent); box-shadow: 0 0 18px rgba(52,239,255,0.5); }
    .axis-h { left: 0; top: 50%; width: 100%; height: 2px; }
    .axis-v { left: 50%; top: 0; width: 2px; height: 100%; background: linear-gradient(180deg, transparent, var(--primary), transparent); }
    .axis-label { position: absolute; font-size: 18px; font-weight: 800; color: var(--cream); text-shadow: 0 0 16px rgba(52,239,255,0.52); }
    .axis-label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-right: 8px; box-shadow: 0 0 14px rgba(52,239,255,0.9); vertical-align: 1px; }
    .quadrant { position: absolute; width: 310px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 18px; overflow: hidden; backdrop-filter: blur(4px); }
    .quadrant::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 45%, rgba(52,239,255,0.08)); opacity: 0.88; }
    .quadrant::after { content: ""; position: absolute; left: 24px; right: 24px; top: 22px; height: 2px; background: linear-gradient(90deg, transparent, currentColor, transparent); opacity: 0.44; }
    .q-name { position: relative; z-index: 1; font-size: 31px; font-weight: 900; letter-spacing: 2px; text-align: center; text-shadow: 0 0 18px currentColor; }
    .q-index { position: absolute; left: 22px; bottom: 18px; z-index: 1; font-size: 13px; font-weight: 800; letter-spacing: 2px; color: rgba(250,249,245,0.66); }
    .quadrant.active { transform: scale(1.08); z-index: 5; box-shadow: 0 0 0 1px rgba(250,249,245,0.3), 0 20px 70px rgba(52,239,255,0.18); }
    .info-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 100px 92px 80px 40px; }
    .info-card { background: rgba(24,23,21,0.92); border: 1px solid rgba(52,239,255,0.24); border-radius: 18px; padding: 62px 68px; max-width: 720px; width: 100%; box-shadow: 0 24px 90px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.06); opacity: 0; position: relative; overflow: hidden; }
    .info-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--coral); box-shadow: 0 0 26px rgba(204,120,92,0.86); }
    .info-card::after { content: "SELF-AWARENESS DIAGNOSTIC"; position: absolute; right: 34px; top: 26px; color: rgba(178,196,220,0.42); font-size: 12px; font-weight: 800; letter-spacing: 3px; }
    .info-inner { position: relative; }
    .info-block { position: absolute; inset: 0; opacity: 0; }
    .info-block:first-child { position: relative; opacity: 1; }
    .card-name { font-size: 54px; font-weight: 900; color: var(--primary); letter-spacing: 1px; margin-bottom: 26px; text-shadow: 0 0 20px rgba(52,239,255,0.42); }
    .card-desc { font-size: 23px; line-height: 1.65; color: #d3dfec; }
  </style>
</head>
<body>
  <div data-composition-id="johari-window" data-width="1920" data-height="1080" data-duration="12" data-start="0">
    <div id="el-fade"></div>
    <div class="cockpit-bg" aria-hidden="true">
      <div class="cockpit-grid"></div>
      <div class="cockpit-glow"></div>
      <div class="cockpit-coral"></div>
      <div class="scanline" id="scanline"></div>
    </div>
    <div class="topbar">
      <div class="eyebrow">JOHARI WINDOW / INTERPERSONAL RADAR</div>
      <div class="status"><span class="dot"></span><span>LIVE MODEL SCAN</span></div>
    </div>
    <div class="matrix-area">
      <div class="matrix-shell"></div>
      <div class="matrix" id="matrix">
        <div class="axis-h"></div><div class="axis-v"></div>
        <div class="axis-label" style="top:-28px;left:50%;transform:translateX(-50%)" id="xTop"></div>
        <div class="axis-label" style="bottom:-28px;left:50%;transform:translateX(-50%)" id="xBottom"></div>
        <div class="axis-label" style="left:-140px;top:0;width:130px;text-align:right" id="yLeft"></div>
        <div class="axis-label" style="right:-180px;top:0;width:150px;text-align:left" id="yRight"></div>
      </div>
    </div>
    <div class="info-panel">
      <div class="info-card" id="infoCard">
        <div class="info-inner" id="infoInner"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var quadrants = JSON.parse(vars.quadrants || '[]');
      var activeQ = Number(vars.activeQuadrant) || 0;
      var primaryColor = vars.primaryColor || '#34efff';
      var bgColor = vars.bgColor || '#0a1628';
      var basePlateImage = vars.basePlateImage || 'v2-base-charcoal.png';
      var durPerQ = Number(vars.durationPerQuadrant) || 3;
      document.documentElement.style.setProperty('--primary', primaryColor);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');
      document.getElementById('xTop').textContent = vars.xTopLabel || 'Known by others';
      document.getElementById('xBottom').textContent = vars.xBottomLabel || 'Unknown by others';
      document.getElementById('yLeft').textContent = vars.yLeftLabel || 'Known by self';
      document.getElementById('yRight').textContent = vars.yRightLabel || 'Unknown by self';

      var matrix = document.getElementById('matrix');
      var infoInner = document.getElementById('infoInner');
      var colors = ['#34efff', '#cc785c', '#5db8a6', '#e8a55a'];
      var qEls = [], infoPanels = [];

      quadrants.forEach(function(q, i) {
        var el = document.createElement('div');
        el.className = 'quadrant' + (i === activeQ ? ' active' : '');
        el.style.left = (q.x === 'left' ? '0px' : '370px');
        el.style.top = (q.y === 'top' ? '10px' : '370px');
        el.style.background = colors[i] + '18';
        el.style.border = '1px solid ' + colors[i] + '66';
        el.style.color = colors[i];
        el.innerHTML = '<div class="q-name" style="color:' + colors[i] + '">' + q.name + '</div><div class="q-index">0' + (i + 1) + ' / 04</div>';
        matrix.appendChild(el); qEls.push(el);

        var panel = document.createElement('div');
        panel.innerHTML = '<div class="card-name" style="color:' + colors[i] + '">' + q.name + '</div><div class="card-desc">' + q.desc + '</div>';
        if (i === activeQ) { panel.style.position = 'relative'; panel.style.opacity = '1'; }
        else { panel.className = 'info-block'; }
        infoInner.appendChild(panel); infoPanels.push(panel);
        if (i !== activeQ) gsap.set(panel, { opacity: 0 });
      });

      gsap.set(qEls[activeQ], { scale: 1.08, boxShadow: '0 0 0 1px rgba(250,249,245,0.3), 0 20px 70px rgba(52,239,255,0.18)', background: colors[activeQ] + '30' });

      var TOTAL = quadrants.length * durPerQ + 1;
      var tl = gsap.timeline({ paused: true });
      tl.fromTo('#scanline', { y: 0, opacity: 0.15 }, { y: 1120, opacity: 0.58, duration: TOTAL - 0.4, ease: 'none' }, 0);
      tl.from('.topbar', { opacity: 0, y: -16, duration: 0.45, ease: 'power2.out' }, 0);
      tl.from('.matrix-shell', { opacity: 0, scale: 0.96, duration: 0.65, ease: 'power2.out' }, 0.1);
      tl.from('.axis-h', { scaleX: 0, duration: 0.6 }, 0);
      tl.from('.axis-v', { scaleY: 0, duration: 0.6 }, 0.2);
      tl.from(qEls, { opacity: 0, scale: 0.8, duration: 0.4, stagger: 0.1, ease: 'back.out(1.4)' }, 0.4);
      tl.to('#infoCard', { opacity: 1, x: -20, duration: 0.5 }, 0.8);

      for (var i = 1; i < quadrants.length; i++) {
        (function(idx) {
          var t = idx * durPerQ + 0.3;
          var prev = idx - 1;
          tl.to(infoPanels[prev], { opacity: 0, duration: 0.2 }, t);
          tl.to(infoPanels[idx], { opacity: 1, duration: 0.4, ease: 'power2.out' }, t + 0.25);
          tl.to(qEls[prev], { scale: 1, boxShadow: 'none', background: colors[prev] + '18', duration: 0.3, overwrite: 'auto' }, t);
          tl.to(qEls[idx], { scale: 1.08, boxShadow: '0 0 0 1px rgba(250,249,245,0.3), 0 20px 70px rgba(52,239,255,0.18)', background: colors[idx] + '30', duration: 0.35, overwrite: 'auto' }, t + 0.1);
          tl.to('#infoCard', { scale: 0.97, duration: 0.12, overwrite: 'auto' }, t + 0.15);
          tl.to('#infoCard', { scale: 1, duration: 0.45, ease: 'back.out(1.3)', overwrite: 'auto' }, t + 0.27);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="johari-window"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['johari-window'] = tl;
    </script>
  </div>
</body>
</html>
