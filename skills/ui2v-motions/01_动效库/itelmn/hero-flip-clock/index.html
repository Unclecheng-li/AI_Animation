<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      .label {
        position: absolute; left: 160px; top: 200px;
        font-family: "Segoe UI", sans-serif; font-size: 26px; letter-spacing: 0.32em;
        text-transform: uppercase; color: #f59e0b;
      }
      .title {
        position: absolute; left: 160px; top: 260px;
        font-family: Georgia, "Times New Roman", serif; font-size: 96px; color: #fafafa;
        letter-spacing: -0.03em;
      }
      .row {
        position: absolute; left: 160px; top: 450px; display: flex; gap: 22px;
      }
      .card {
        width: 210px; height: 270px; border-radius: 16px;
        background: linear-gradient(180deg, #262626 0%, #171717 48%, #0f0f0f 52%, #171717 100%);
        border: 2px solid #404040;
        display: flex; align-items: center; justify-content: center;
        font-family: Consolas, "Courier New", monospace;
        font-size: 132px; font-weight: 700; color: #fafafa;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px rgba(0,0,0,0.45);
        overflow: hidden;
      }
      .card.sep { width: 90px; background: #111; border-color: #333; font-size: 96px; color: #f59e0b; }
      .sub {
        position: absolute; left: 160px; top: 780px;
        font-family: "Segoe UI", sans-serif; font-size: 32px; color: #a3a3a3;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="label" class="clip label" data-start="0" data-duration="4.5" data-track-index="0">Launch window</div>
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="1">Flip Clock</div>
      <div id="row" class="clip row" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="card" id="d1">0</div>
        <div class="card" id="d2">9</div>
        <div class="card sep" id="d3">:</div>
        <div class="card" id="d4">0</div>
        <div class="card" id="d5">0</div>
      </div>
      <div id="sub" class="clip sub" data-start="0" data-duration="4.5" data-track-index="3">Mechanical time cards for product launches</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#label", "#title", "#sub"], { opacity: 0, y: 18 });
      gsap.set(["#d1", "#d2", "#d3", "#d4", "#d5"], { rotateX: -90, opacity: 0, transformOrigin: "50% 50%" });
      tl.to("#label", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#title", { opacity: 1, y: 0, duration: 0.55 }, 0.25)
        .to("#d1", { opacity: 1, rotateX: 0, duration: 0.45, ease: "power3.out" }, 0.5)
        .to("#d2", { opacity: 1, rotateX: 0, duration: 0.45, ease: "power3.out" }, 0.65)
        .to("#d3", { opacity: 1, rotateX: 0, duration: 0.35 }, 0.8)
        .to("#d4", { opacity: 1, rotateX: 0, duration: 0.45, ease: "power3.out" }, 0.95)
        .to("#d5", { opacity: 1, rotateX: 0, duration: 0.45, ease: "power3.out" }, 1.1)
        .to("#sub", { opacity: 1, y: 0, duration: 0.45 }, 1.3)
        .add(() => { document.getElementById("d2").textContent = "8"; }, 2.0)
        .to("#d2", { rotateX: -65, duration: 0.14, yoyo: true, repeat: 1 }, 2.0)
        .add(() => { document.getElementById("d5").textContent = "5"; }, 2.7)
        .to("#d5", { rotateX: -65, duration: 0.14, yoyo: true, repeat: 1 }, 2.7)
        .add(() => { document.getElementById("d5").textContent = "0"; }, 3.4)
        .to("#d5", { rotateX: -65, duration: 0.14, yoyo: true, repeat: 1 }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
