<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      .dial-wrap {
        position: absolute; left: 1080px; top: 200px; width: 560px; height: 560px;
      }
      .ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 28px solid rgba(148,163,184,0.2);
      }
      .arc {
        position: absolute; inset: 0; border-radius: 50%;
        border: 28px solid transparent; border-top-color: #38bdf8; border-right-color: #38bdf8;
        transform: rotate(-90deg);
      }
      .needle {
        position: absolute; left: 50%; top: 50%; width: 8px; height: 210px;
        margin: -210px 0 0 -4px; background: #f8fafc; border-radius: 8px; transform-origin: 50% 100%;
      }
      .hub {
        position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px;
        border-radius: 50%; background: #38bdf8;
      }
      .value {
        position: absolute; left: 140px; top: 340px; color: #f8fafc;
        font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em;
      }
      .value .num { font-size: 180px; font-weight: 800; line-height: 1; }
      .value .unit { font-size: 48px; color: #38bdf8; margin-left: 12px; }
      .value .label { margin-top: 20px; font-size: 34px; color: rgba(226,232,240,0.75); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="value" class="clip value" data-start="0" data-duration="4.5" data-track-index="0">
        <div><span class="num" id="num">0</span><span class="unit">%</span></div>
        <div class="label">Render capacity dial</div>
      </div>
      <div id="dial" class="clip dial-wrap" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="ring"></div>
        <div class="arc" id="arc"></div>
        <div class="needle" id="needle"></div>
        <div class="hub"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { v: 0 };
      const num = document.getElementById("num");
      gsap.set("#value", { opacity: 0, x: -24 });
      gsap.set("#dial", { opacity: 0, scale: 0.85 });
      gsap.set("#needle", { rotation: -120 });
      gsap.set("#arc", { rotation: -90, opacity: 0.4 });
      tl.to("#dial", { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.15)
        .to("#value", { opacity: 1, x: 0, duration: 0.55 }, 0.3)
        .to("#needle", { rotation: 48, duration: 2.4, ease: "power2.out" }, 0.55)
        .to("#arc", { opacity: 1, duration: 2.4 }, 0.55)
        .to(counter, {
          v: 86,
          duration: 2.4,
          ease: "power2.out",
          onUpdate: () => { num.textContent = String(Math.round(counter.v)); },
        }, 0.55)
        .to("#needle", { rotation: 54, duration: 0.8, ease: "sine.inOut" }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
