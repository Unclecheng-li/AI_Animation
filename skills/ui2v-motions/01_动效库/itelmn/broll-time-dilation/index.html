<!doctype html><html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"accent","type":"color","label":"Gravity accent","default":"#d88a5e"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--bg:#070708;--ink:#f2eddf;--muted:#918b82}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}#clip{position:absolute;inset:0;overflow:hidden}
.space{position:absolute;inset:0;background:radial-gradient(circle at 51% 52%,color-mix(in srgb,var(--accent) 19%,transparent),transparent 25%),radial-gradient(circle at 50% 50%,#17151a,transparent 62%)}
header{position:absolute;left:90px;right:90px;top:66px;display:flex;justify-content:space-between;z-index:3}
header small{font:700 18px "Courier New",monospace;letter-spacing:.15em;color:var(--accent)}header h1{margin:10px 0 0;font:800 58px/.95 Arial,sans-serif;letter-spacing:-.045em}
.formula{font:400 34px Georgia,serif;padding-top:18px}.formula i{color:var(--accent)}
#field{position:absolute;left:70px;top:145px;width:1780px;height:820px}
.warp{fill:none;stroke:#343039;stroke-width:2}.warp.major{stroke:#5b5260;stroke-width:3}.well{fill:none;stroke:var(--accent);stroke-width:3;opacity:.45}
.mass{fill:#0b0b0d;stroke:var(--accent);stroke-width:8;filter:drop-shadow(0 0 42px color-mix(in srgb,var(--accent) 42%,transparent))}
.mass-core{fill:var(--accent);opacity:.18}
.clock-face{fill:#0e0e11;stroke:var(--ink);stroke-width:5}.clock-tick{stroke:var(--ink);stroke-width:4;stroke-linecap:round}.clock-hand{stroke:var(--accent);stroke-width:9;stroke-linecap:round}.clock-center{fill:var(--ink)}
.clock-label{fill:var(--ink);font:800 20px "Courier New",monospace;letter-spacing:.1em;text-anchor:middle}.clock-value{fill:var(--accent);font:900 35px Arial,sans-serif;text-anchor:middle}
.divider{stroke:var(--accent);stroke-width:2;stroke-dasharray:9 12}
.caption{position:absolute;left:90px;bottom:58px;font:400 26px/1.25 Georgia,serif;color:#c2bcb0;width:650px}.status{position:absolute;right:90px;bottom:58px;text-align:right;font:700 18px/1.5 "Courier New",monospace;letter-spacing:.08em;color:var(--muted)}
.no-labels header,.no-labels .caption,.no-labels .status,.no-labels .clock-label,.no-labels .clock-value{opacity:0}
</style></head><body>
<div id="stage" data-composition-id="broll-time-dilation" data-start="0" data-duration="9" data-fps="30" data-width="1920" data-height="1080"><div id="clip" class="clip" data-start="0" data-duration="9" data-track-index="1"><div class="space"></div>
<header><div><small>RELATIVITY / GRAVITATIONAL FIELD</small><h1>TIME DOES NOT TICK EQUALLY</h1></div><div class="formula">Δt′ = Δt √<i>(1 − 2GM/rc²)</i></div></header>
<svg id="field" viewBox="0 0 1780 820" aria-label="Two clocks ticking at different rates around a gravity well">
<path class="warp major" d="M30 120 C430 80 690 150 890 350 C1090 150 1350 80 1750 120"/><path class="warp" d="M20 210 C430 165 700 220 890 385 C1080 220 1350 165 1760 210"/>
<path class="warp" d="M10 300 C410 270 690 300 890 420 C1090 300 1370 270 1770 300"/><path class="warp major" d="M0 410 C420 390 700 390 890 455 C1080 390 1360 390 1780 410"/>
<path class="warp" d="M10 520 C410 550 690 520 890 490 C1090 520 1370 550 1770 520"/><path class="warp" d="M20 610 C430 655 700 600 890 525 C1080 600 1350 655 1760 610"/>
<path class="warp major" d="M30 700 C430 740 690 670 890 560 C1090 670 1350 740 1750 700"/>
<path class="warp" d="M250 40 C330 250 420 340 650 410 C420 480 330 570 250 790"/><path class="warp" d="M520 20 C560 230 650 330 810 410 C650 490 560 590 520 800"/>
<path class="warp major" d="M780 10 C780 240 830 345 890 410 C950 345 1000 240 1000 10"/><path class="warp" d="M1260 20 C1220 230 1130 330 970 410 C1130 490 1220 590 1260 800"/><path class="warp" d="M1530 40 C1450 250 1360 340 1130 410 C1360 480 1450 570 1530 790"/>
<circle class="well" cx="890" cy="410" r="245"/><circle class="well" cx="890" cy="410" r="305"/><circle class="mass-core" cx="890" cy="410" r="168"/><circle class="mass" cx="890" cy="410" r="118"/>
<line class="divider" x1="600" y1="85" x2="600" y2="740"/>
<g id="far-clock"><circle class="clock-face" cx="330" cy="410" r="128"/><line class="clock-tick" x1="330" y1="296" x2="330" y2="317"/><line class="clock-tick" x1="330" y1="503" x2="330" y2="524"/><line class="clock-tick" x1="216" y1="410" x2="237" y2="410"/><line class="clock-tick" x1="423" y1="410" x2="444" y2="410"/><line id="far-hand" class="clock-hand" data-layout-ignore x1="330" y1="410" x2="330" y2="328"/><circle class="clock-center" cx="330" cy="410" r="12"/><text class="clock-label" x="330" y="575">FAR FROM MASS</text><text id="far-value" class="clock-value" x="330" y="620">0.0 s</text></g>
<g id="near-clock"><circle class="clock-face" cx="1290" cy="410" r="128"/><line class="clock-tick" x1="1290" y1="296" x2="1290" y2="317"/><line class="clock-tick" x1="1290" y1="503" x2="1290" y2="524"/><line class="clock-tick" x1="1176" y1="410" x2="1197" y2="410"/><line class="clock-tick" x1="1383" y1="410" x2="1404" y2="410"/><line id="near-hand" class="clock-hand" data-layout-ignore x1="1290" y1="410" x2="1290" y2="328"/><circle class="clock-center" cx="1290" cy="410" r="12"/><text class="clock-label" x="1290" y="575">DEEPER IN GRAVITY</text><text id="near-value" class="clock-value" x="1290" y="620">0.0 s</text></g>
</svg>
<div class="caption">Closer to a massive object, less proper time elapses relative to a distant observer.</div><div class="status">ILLUSTRATIVE RELATIVE RATE<br/>NOT TO SCALE</div>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const elapsed={far:0,near:0};const paths=[...document.querySelectorAll('.warp')];const tl=gsap.timeline({paused:true});
paths.forEach(p=>{const l=p.getTotalLength();p.setAttribute('stroke-dasharray',l);p.setAttribute('stroke-dashoffset',l);tl.to(p,{attr:{'stroke-dashoffset':0},duration:1.3,ease:'power2.inOut'},.2);});
tl.fromTo('header',{y:-42,autoAlpha:0},{y:0,autoAlpha:1,duration:.58,ease:'power3.out'},0);
tl.fromTo('.well',{scale:.5,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:.45,duration:.8,stagger:.1,ease:'power3.out'},.65);
tl.fromTo('.mass',{scale:.25,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.65,ease:'back.out(1.5)'},.8);
tl.fromTo('#far-clock,#near-clock',{scale:.55,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.65,stagger:.16,ease:'back.out(1.5)'},1.05);
tl.to('#far-hand',{rotation:1080,svgOrigin:'330 410',duration:5.2,ease:'none'},1.65);
tl.to('#near-hand',{rotation:504,svgOrigin:'1290 410',duration:5.2,ease:'none'},1.65);
tl.to(elapsed,{far:3,near:1.4,duration:5.2,ease:'none',onUpdate:()=>{document.getElementById('far-value').textContent=elapsed.far.toFixed(1)+' s';document.getElementById('near-value').textContent=elapsed.near.toFixed(1)+' s';}},1.65);
tl.to('.mass-core',{scale:1.12,opacity:.27,transformOrigin:'center',duration:.75,yoyo:true,repeat:5,ease:'sine.inOut'},1.7);
tl.to('#near-clock',{filter:'drop-shadow(0 0 24px var(--accent))',duration:.5,yoyo:true,repeat:1,ease:'sine.inOut'},6.9);
tl.to('#clip',{autoAlpha:0,duration:.34,ease:'power2.in'},8.62);tl.seek(0);window.__timelines['broll-time-dilation']=tl;
</script></body></html>
