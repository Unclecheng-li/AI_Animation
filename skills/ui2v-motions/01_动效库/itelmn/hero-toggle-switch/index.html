<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #eff6ff; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 70% 40%, #dbeafe 0%, #eff6ff 55%, #f8fafc 100%);
      }
      .copy {
        position: absolute; left: 140px; top: 300px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #0f172a;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #2563eb; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #475569; max-width: 540px; line-height: 1.45; }
      .panel {
        position: absolute; right: 180px; top: 260px; width: 720px;
        background: #fff; border-radius: 28px; padding: 48px 52px;
        box-shadow: 0 24px 60px rgba(37, 99, 235, 0.12);
        border: 1px solid #bfdbfe;
      }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 28px 0; border-bottom: 1px solid #e2e8f0;
      }
      .row:last-child { border-bottom: 0; }
      .row h4 { font-family: "Segoe UI", sans-serif; font-size: 32px; color: #0f172a; font-weight: 700; }
      .row p { margin-top: 8px; font-size: 22px; color: #64748b; font-family: "Segoe UI", sans-serif; }
      .switch {
        width: 108px; height: 60px; border-radius: 999px; background: #cbd5e1;
        position: relative; flex: none;
      }
      .knob {
        position: absolute; top: 6px; left: 6px; width: 48px; height: 48px;
        border-radius: 50%; background: #fff;
        box-shadow: 0 8px 16px rgba(15, 23, 42, 0.18);
      }
      .status {
        margin-top: 28px; font-family: "Segoe UI", sans-serif; font-size: 24px;
        color: #64748b; letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Settings · Prefer</div>
        <div class="title">Toggle Switch</div>
        <div class="sub">Preference flips from off to on with a clear status line.</div>
      </div>
      <div id="panel" class="clip panel" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="row">
          <div>
            <h4>Auto-publish</h4>
            <p>Ship approved motions without a second confirm</p>
          </div>
          <div class="switch" id="sw">
            <div class="knob" id="knob"></div>
          </div>
        </div>
        <div class="row">
          <div>
            <h4>Email digests</h4>
            <p>Weekly registry highlights</p>
          </div>
          <div class="switch" style="opacity:0.45">
            <div class="knob"></div>
          </div>
        </div>
        <div class="status" id="status">OFF · awaiting change</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const status = document.getElementById("status");
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#panel", { opacity: 0, y: 24 });
      gsap.set("#knob", { x: 0 });
      gsap.set("#sw", { backgroundColor: "#cbd5e1" });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#panel", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#knob", { x: 48, duration: 0.55, ease: "power3.inOut" }, 1.35)
        .to("#sw", { backgroundColor: "#2563eb", duration: 0.55, ease: "power3.inOut" }, 1.35)
        .to({}, {
          duration: 0.01,
          onStart: () => { status.textContent = "ON · auto-publish enabled"; status.style.color = "#2563eb"; }
        }, 1.9)
        .to("#panel", { y: -8, duration: 1.4, ease: "sine.inOut" }, 2.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
