<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Destination accent","default":"#ff7354"}]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .bs-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e9e7e0;
          color: #171a18;
          font-family: Inter, sans-serif;
          --accent: #ff7354;
        }
        .bs-page {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          padding: 78px 96px;
          background: #e9e7e0;
        }
        .bs-b-ui {
          background: #171a18;
          color: #f5f3ed;
        }
        .bs-head {
          display: flex;
          justify-content: space-between;
          font-size: 17px;
          font-weight: 900;
          letter-spacing: 3px;
        }
        .bs-page h1 {
          margin-top: 52px;
          font-size: 76px;
          letter-spacing: -4px;
        }
        .bs-grid {
          display: grid;
          grid-template-columns: 310px 1fr;
          gap: 28px;
          margin-top: 58px;
        }
        .bs-panel {
          height: 650px;
          padding: 28px;
          border: 1px solid #c9c7c0;
          border-radius: 22px;
          background: #faf9f5;
        }
        .bs-b-ui .bs-panel {
          border-color: #424642;
          background: #252a26;
        }
        .bs-line {
          width: 68%;
          height: 14px;
          margin-bottom: 18px;
          border-radius: 7px;
          background: #939590;
        }
        .bs-main:after {
          content: "";
          display: block;
          height: 390px;
          margin-top: 95px;
          border-radius: 20px;
          background: #d4d2cb;
        }
        .bs-b-ui .bs-main:after {
          background: linear-gradient(135deg, var(--accent), #8e2e21);
        }
        .bs-base-b {
          position: absolute;
          inset: 0;
        }
        .bs-strips {
          position: absolute;
          inset: 0;
        }
        .bs-strip {
          position: absolute;
          top: 0;
          width: 160px;
          height: 1080px;
          overflow: hidden;
        }
        .bs-face {
          position: absolute;
          inset: 0;
          width: 160px;
          height: 1080px;
          overflow: hidden;
        }
        .bs-sheet {
          position: absolute;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        .bs-seam {
          position: absolute;
          left: -8px;
          top: 0;
          width: 16px;
          height: 1080px;
          opacity: 0;
        }
        .bs-seam:before,
        .bs-seam:after,
        .bs-seam i {
          content: "";
          position: absolute;
          left: 50%;
          top: 0;
          height: 1080px;
          transform: translateX(-50%);
        }
        .bs-seam:before {
          width: 16px;
          background: rgba(255, 255, 255, 0.45);
        }
        .bs-seam:after {
          width: 6px;
          background: rgba(0, 0, 0, 0.55);
        }
        .bs-seam i {
          width: 3px;
          background: rgba(255, 255, 255, 0.95);
        }
        .bs-caption {
          position: absolute;
          left: 54px;
          bottom: 38px;
          z-index: 30;
          padding: 10px 14px;
          border-radius: 8px;
          background: rgba(20, 22, 20, 0.9);
          color: #fff;
          font-size: 14px;
          font-weight: 900;
          letter-spacing: 3px;
        }
      </style>
      <div
        id="bs-root"
        data-hf-id="hf-bs-root"
        data-composition-id="shot-blinds-slice"
        data-start="0"
        data-duration="5"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="bs-fill">
          <div class="bs-base-b">
            <div class="bs-page bs-b-ui">
              <div class="bs-head">
                <span data-layout-allow-overlap>PAGE B</span
                ><span data-layout-allow-overlap>COMPLETE</span>
              </div>
              <h1 data-layout-allow-overlap>The wave reveals the next page.</h1>
              <div class="bs-grid">
                <div class="bs-panel">
                  <div class="bs-line"></div>
                  <div class="bs-line"></div>
                </div>
                <div class="bs-panel bs-main"><div class="bs-line"></div></div>
              </div>
            </div>
          </div>
          <div class="bs-source-a" style="display: none">
            <div class="bs-page">
              <div class="bs-head">
                <span data-layout-allow-overlap>PAGE A</span
                ><span data-layout-allow-overlap>12 SLICES</span>
              </div>
              <h1 data-layout-allow-overlap>Every blind turns in sequence.</h1>
              <div class="bs-grid">
                <div class="bs-panel">
                  <div class="bs-line"></div>
                  <div class="bs-line"></div>
                </div>
                <div class="bs-panel bs-main"><div class="bs-line"></div></div>
              </div>
            </div>
          </div>
          <div class="bs-source-b" style="display: none">
            <div class="bs-page bs-b-ui">
              <div class="bs-head">
                <span data-layout-allow-overlap>PAGE B</span
                ><span data-layout-allow-overlap>COMPLETE</span>
              </div>
              <h1 data-layout-allow-overlap>The wave reveals the next page.</h1>
              <div class="bs-grid">
                <div class="bs-panel">
                  <div class="bs-line"></div>
                  <div class="bs-line"></div>
                </div>
                <div class="bs-panel bs-main"><div class="bs-line"></div></div>
              </div>
            </div>
          </div>
          <div class="bs-strips" data-layout-allow-overflow></div>
          <div class="bs-caption">12 BLINDS / 2F STAGGER / SEAM LIGHT</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var root = document.querySelector("#bs-root"),
            v = window.__hyperframes.getVariables(),
            fill = root.querySelector(".bs-fill"),
            holder = root.querySelector(".bs-strips"),
            srcA = root.querySelector(".bs-source-a .bs-page"),
            srcB = root.querySelector(".bs-source-b .bs-page"),
            tl = gsap.timeline({ paused: true });
          fill.style.setProperty("--accent", v.accent || "#ff7354");
          for (var i = 0; i < 12; i++) {
            var strip = document.createElement("div"),
              aw = document.createElement("div"),
              bw = document.createElement("div"),
              as = document.createElement("div"),
              bs = document.createElement("div"),
              seam = document.createElement("div");
            strip.className = "bs-strip";
            strip.style.left = i * 160 + "px";
            aw.className = "bs-face bs-a-face";
            bw.className = "bs-face bs-b-face";
            as.className = "bs-sheet";
            bs.className = "bs-sheet";
            as.style.left = -i * 160 + "px";
            bs.style.left = -i * 160 + "px";
            as.appendChild(srcA.cloneNode(true));
            bs.appendChild(srcB.cloneNode(true));
            aw.appendChild(as);
            bw.appendChild(bs);
            seam.className = "bs-seam";
            seam.innerHTML = "<i></i>";
            strip.appendChild(aw);
            strip.appendChild(bw);
            strip.appendChild(seam);
            holder.appendChild(strip);
            gsap.set(bw, { scaleX: 0, transformOrigin: "100% 50%" });
            gsap.set(aw, { scaleX: 1, transformOrigin: "0% 50%" });
            gsap.set(seam, { x: 160 });
            var start = 0.667 + i * 0.067;
            tl.set(seam, { opacity: 1 }, start)
              .to(aw, { scaleX: 0, duration: 0.333, ease: "power3.in" }, start)
              .to(bw, { scaleX: 1, duration: 0.333, ease: "power3.in" }, start)
              .to(seam, { x: 0, duration: 0.333, ease: "power3.in" }, start)
              .to(
                seam,
                { opacity: 0, duration: 0.067, ease: "none" },
                start + 0.266,
              );
          }
          tl.set(holder, { display: "none" }, 1.735);
          window.__timelines["shot-blinds-slice"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
