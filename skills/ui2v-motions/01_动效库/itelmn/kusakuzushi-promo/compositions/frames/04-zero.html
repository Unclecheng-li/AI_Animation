<template>
  <style>
    @font-face {
      font-family: "DotGothic16";
      src: url("assets/fonts/dotgothic16-subset.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "DotGothic16", sans-serif;
    }

    .f4-ground {
      position: absolute;
      inset: 0;
      background: #0c110d;
    }

    /* Identical geometry to frame 1's board — same left, same top, same height.
       Everything about the shot is the same except that the year is gone. */
    .f4-board {
      position: absolute;
      left: 0;
      top: 660px;
      width: 1080px;
      height: 152px;
      display: block;
    }

    .f4-counter-wrap {
      position: absolute;
      left: 0;
      top: 300px;
      width: 1080px;
      height: 232px;
      text-align: center;
    }

    .f4-counter {
      display: inline-block;
      font-family: "DotGothic16", sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 232px;
      line-height: 0.9;
      color: #ffb224;
      transform-origin: center center;
    }
  </style>

  <div data-hf-id="hf-jlef" id="root" data-composition-id="04-zero" data-start="0" data-duration="3.5" data-width="1080" data-height="1080">

    <div data-hf-id="hf-93og" id="f4-ground" class="f4-ground clip" data-start="0" data-duration="3.5" data-track-index="0"></div>

    <img data-hf-id="hf-thaz" class="f4-board clip" id="f4-board" src="assets/board-empty.png" alt="" data-start="0" data-duration="3.5" data-track-index="1">

    <div data-hf-id="hf-dvka" class="f4-counter-wrap clip" id="f4-counter-wrap" data-start="0" data-duration="3.5" data-track-index="2">
      <span data-hf-id="hf-ubm0" class="f4-counter" id="f4-counter">120</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });
      const counter = document.getElementById("f4-counter");
      const state = { value: 120 };
      const write = () => {
        counter.textContent = Math.round(state.value).toLocaleString("en-US");
      };

      // The mirror of frame 1: same position, same face, same move — but this
      // count runs down and lands on 0, and the strip underneath has nothing
      // left in it.
      //
      // Scene 1 (0.0-0.9s) the empty strip sits where the year used to be while
      // the counter is still spinning down.
      // Scene 2 (0.9-1.7s) it lands on 0 and swells a step on arrival.
      tl.to(state, { value: 0, duration: 0.8, ease: "power3.out", onUpdate: write }, 0.9);
      tl.fromTo("#f4-counter", { scale: 1 }, { scale: 1.16, duration: 0.8, ease: "power3.out" }, 0.9);

      // Scene 3 (1.7-3.5s) dead still. No jitter, no drift — the stop is the point.

      window.__timelines["04-zero"] = tl;
    })();
  </script>
