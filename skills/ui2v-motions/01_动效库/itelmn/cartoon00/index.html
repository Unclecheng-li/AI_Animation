<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #FFD700;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
    }

    .clip {
      position: absolute;
    }

    .bg-vibrant {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #ff9d00 0%, #ff5e00 100%);
      z-index: 0;
    }

    .sunburst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3000px;
      height: 3000px;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(from 0deg,
          rgba(255, 255, 255, 0.18) 0deg 15deg,
          transparent 15deg 30deg);
      z-index: 1;
    }

    .character-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .doraemon-pos {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: 110px;
      color: #fff;
      text-shadow: 8px 8px 0px rgba(0, 0, 0, 0.25);
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <!-- Background -->
    <div id="bg" class="clip bg-vibrant" data-start="0" data-duration="10" data-track-index="0">
      <div id="sunburst" class="sunburst"></div>
    </div>

    <!-- Doraemon Section -->
    <div id="doraemon-group" class="clip character-container doraemon-pos" data-start="0" data-duration="10"
      data-track-index="1">
      <svg viewBox="0 0 400 520" width="600" height="780">
        <!-- Tail -->
        <g id="dora-tail">
          <line x1="120" y1="420" x2="90" y2="420" stroke="#000" stroke-width="5" />
          <circle cx="80" cy="420" r="18" fill="#E40011" stroke="#000" stroke-width="4" />
        </g>

        <!-- Feet -->
        <g id="dora-feet">
          <ellipse cx="155" cy="485" rx="55" ry="30" fill="#FFF" stroke="#000" stroke-width="5" />
          <ellipse cx="245" cy="485" rx="55" ry="30" fill="#FFF" stroke="#000" stroke-width="5" />
        </g>

        <!-- Body -->
        <path id="dora-body"
          d="M110 460 Q100 460 100 440 L100 320 Q100 280 200 280 Q300 280 300 320 L300 440 Q300 460 290 460 Z"
          fill="#00A0E9" stroke="#000" stroke-width="5" />

        <!-- Belly & Pocket -->
        <circle cx="200" cy="390" r="95" fill="#FFF" stroke="#000" stroke-width="5" />
        <path d="M140 390 A60 60 0 0 0 260 390 Z" fill="#FFF" stroke="#000" stroke-width="5" />

        <!-- Arms -->
        <g id="dora-arm-l">
          <path d="M100 330 L50 380" fill="none" stroke="#000" stroke-width="45" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M100 330 L50 380" fill="none" stroke="#00A0E9" stroke-width="35" stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="50" cy="380" r="30" fill="#FFF" stroke="#000" stroke-width="5" />
        </g>
        <g id="dora-arm-r">
          <path d="M300 330 L350 380" fill="none" stroke="#000" stroke-width="45" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M300 330 L350 380" fill="none" stroke="#00A0E9" stroke-width="35" stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="350" cy="380" r="30" fill="#FFF" stroke="#000" stroke-width="5" />
        </g>

        <!-- Head Group -->
        <g id="dora-head">
          <circle cx="200" cy="180" r="160" fill="#00A0E9" stroke="#000" stroke-width="5" />
          <circle cx="200" cy="210" r="130" fill="#FFF" stroke="#000" stroke-width="5" />

          <!-- Eyes -->
          <g id="dora-eyes-container">
            <!-- Left Eye -->
            <ellipse cx="165" cy="130" rx="35" ry="45" fill="#FFF" stroke="#000" stroke-width="5" />
            <!-- Right Eye -->
            <ellipse cx="235" cy="130" rx="35" ry="45" fill="#FFF" stroke="#000" stroke-width="5" />

            <!-- Happy Eye Curves -->
            <path d="M145 130 Q165 110 185 130" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />
            <path d="M215 130 Q235 110 255 130" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />
          </g>

          <!-- Face Details -->
          <circle cx="200" cy="175" r="20" fill="#E40011" stroke="#000" stroke-width="4" />
          <circle cx="192" cy="168" r="6" fill="#FFF" opacity="0.8" /> <!-- Nose highlight -->

          <line x1="200" y1="195" x2="200" y2="280" stroke="#000" stroke-width="4" />

          <!-- Smile -->
          <path d="M100 240 Q200 350 300 240" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />

          <!-- Whiskers -->
          <g id="dora-whiskers">
            <line x1="140" y1="210" x2="70" y2="190" stroke="#000" stroke-width="4" />
            <line x1="140" y1="230" x2="70" y2="230" stroke="#000" stroke-width="4" />
            <line x1="140" y1="250" x2="70" y2="270" stroke="#000" stroke-width="4" />
            <line x1="260" y1="210" x2="330" y2="190" stroke="#000" stroke-width="4" />
            <line x1="260" y1="230" x2="330" y2="230" stroke="#000" stroke-width="4" />
            <line x1="260" y1="250" x2="330" y2="270" stroke="#000" stroke-width="4" />
          </g>
        </g>

        <!-- Collar & Bell -->
        <rect x="130" y="300" width="140" height="22" rx="11" fill="#E40011" stroke="#000" stroke-width="5" />
        <g id="dora-bell-container">
          <circle id="dora-bell" cx="200" cy="335" r="28" fill="#FFD700" stroke="#000" stroke-width="5" />
          <circle cx="200" cy="335" r="6" fill="#333" />
          <line x1="200" y1="341" x2="200" y2="363" stroke="#000" stroke-width="4" />
          <line x1="178" y1="322" x2="222" y2="322" stroke="#000" stroke-width="3" />
        </g>
      </svg>
      <div id="doraemon-title" class="title">Doraemon</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Sunburst rotation
    tl.to("#sunburst", {
      rotation: 360,
      duration: 15,
      ease: "none",
      repeat: 0 // Composition is only 10s
    }, 0);

    // Doraemon Happy Animation
    tl.to("#doraemon-group", {
      y: "-=30",
      duration: 1.5,
      ease: "sine.inOut",
      repeat: 5, // floor(10/1.5) - 1 = 5
      yoyo: true
    }, 0);

    tl.to("#dora-arm-r", {
      rotation: 40,
      transformOrigin: "left top",
      duration: 0.4,
      repeat: 24, // floor(10/0.4) - 1 = 24
      yoyo: true,
      ease: "power1.inOut"
    }, 0);

    tl.to("#dora-bell", {
      rotation: 15,
      duration: 0.5,
      repeat: 19, // floor(10/0.5) - 1 = 19
      yoyo: true,
      transformOrigin: "top center"
    }, 0);


    // Title entrance
    tl.from(".title", {
      scale: 0,
      opacity: 0,
      duration: 1.2,
      stagger: 0.4,
      ease: "elastic.out(1, 0.5)"
    }, 0.5);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>
