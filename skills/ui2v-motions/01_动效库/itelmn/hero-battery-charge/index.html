<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #18181b; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 60% 45%, #27272a 0%, #18181b 65%);
      }
      .copy {
        position: absolute; left: 140px; top: 300px; color: #fafafa;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #a3e635; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #a1a1aa; max-width: 520px; line-height: 1.45; }
      .batt {
        position: absolute; right: 220px; top: 280px; width: 620px; height: 320px;
        border: 10px solid #e4e4e7; border-radius: 42px; padding: 24px;
        background: #09090b; box-shadow: 0 28px 70px rgba(0,0,0,0.45);
      }
      .tip {
        position: absolute; right: -36px; top: 110px; width: 28px; height: 100px;
        background: #e4e4e7; border-radius: 0 10px 10px 0;
      }
      .fill {
        height: 100%; width: 8%; border-radius: 24px; background: #ef4444;
      }
      .pct {
        position: absolute; left: 0; right: 40px; top: 640px; text-align: center;
        font-family: "Segoe UI", sans-serif; font-size: 48px; font-weight: 700; color: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Device · Power</div>
        <div class="title">Battery Charge</div>
        <div class="sub">Fill climbs from critical red to healthy lime.</div>
      </div>
      <div id="batt" class="clip batt" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="tip"></div>
        <div class="fill" id="fill"></div>
      </div>
      <div id="pct" class="clip pct" data-start="0" data-duration="4.5" data-track-index="2">8%</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pct = document.getElementById("pct");
      const fill = document.getElementById("fill");
      const state = { v: 8 };
      const paint = () => {
        const v = state.v;
        pct.textContent = Math.round(v) + "%";
        fill.style.width = v + "%";
        if (v < 20) fill.style.background = "#ef4444";
        else if (v < 55) fill.style.background = "#f59e0b";
        else fill.style.background = "#a3e635";
      };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#batt", { opacity: 0, y: 24 });
      gsap.set("#pct", { opacity: 0 });
      paint();
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#batt", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#pct", { opacity: 1, duration: 0.35 }, 0.5)
        .to(state, { v: 100, duration: 2.6, ease: "power1.inOut", onUpdate: paint }, 1.0)
        .to("#batt", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
