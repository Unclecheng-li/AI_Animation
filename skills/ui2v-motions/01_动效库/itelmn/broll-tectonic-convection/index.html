<!doctype html><html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"mantle","type":"color","label":"Mantle color","default":"#c35d3e"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--paper:#e9dfca;--ink:#24211d;--ocean:#197b82;--crust:#73513a;--core:#efa342}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}#clip{position:absolute;inset:0;overflow:hidden}
.paper{position:absolute;inset:0;background-image:radial-gradient(rgba(36,33,29,.11) .8px,transparent .8px);background-size:8px 8px;opacity:.34}
header{position:absolute;left:86px;right:86px;top:62px;display:flex;justify-content:space-between;border-top:4px solid var(--ink);padding-top:18px;z-index:3}

.plate{fill:var(--crust);stroke:var(--ink);stroke-width:4}.sediment{fill:#b69368}.ridge{fill:var(--mantle);stroke:var(--ink);stroke-width:4}
.flow{fill:none;stroke:#f4cf96;stroke-width:10;stroke-linecap:round;stroke-dasharray:18 18}.flow-arrow{fill:#f4cf96}.magma{fill:var(--core);stroke:var(--ink);stroke-width:4}

.note{position:absolute;left:88px;bottom:52px;font:400 25px/1.3 Georgia,serif;width:720px}.key{position:absolute;right:88px;bottom:54px;display:flex;gap:24px;font:700 17px "Courier New",monospace;letter-spacing:.07em}
.key i{display:inline-block;width:20px;height:12px;margin-right:8px}.no-labels header,.no-labels .label,.no-labels .callout,.no-labels .note,.no-labels .key{opacity:0}
</style></head><body>

<header><h1>PLATES RIDE ON A MOVING MANTLE</h1><small>EARTH SYSTEMS / CONVECTION</small></header>

<text class="label label-light" x="225" y="185">OCEANIC PLATE</text><text class="label label-light" x="1370" y="185">OCEANIC PLATE</text><text class="label" x="815" y="42">MID-OCEAN RIDGE</text>

<div class="note">Heat-driven circulation in the mantle helps move lithospheric plates over geological time.</div><div class="key"><span><i style="background:var(--ocean)"></i>OCEAN</span><span><i style="background:var(--crust)"></i>CRUST</span><span><i style="background:var(--mantle)"></i>MANTLE</span></div>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const lp=document.getElementById('left-flow'),rp=document.getElementById('right-flow'),ml=document.getElementById('magma-left'),mr=document.getElementById('magma-right');const ll=lp.getTotalLength(),rl=rp.getTotalLength(),flow={p:0};const tl=gsap.timeline({paused:true});
function move(){let a=lp.getPointAtLength((flow.p%1)*ll),b=rp.getPointAtLength((flow.p%1)*rl);ml.setAttribute('cx',a.x);ml.setAttribute('cy',a.y);mr.setAttribute('cx',b.x);mr.setAttribute('cy',b.y);}
tl.fromTo('header',{y:-38,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);
tl.fromTo('#earth',{y:55,autoAlpha:0},{y:0,autoAlpha:1,duration:.72,ease:'power3.out'},.15);
tl.fromTo('.flow',{strokeDashoffset:260},{strokeDashoffset:0,duration:1.3,ease:'power2.out'},.5);
tl.fromTo('#ridge',{scaleY:.15,transformOrigin:'bottom center'},{scaleY:1,duration:1.1,ease:'back.out(1.35)'},1.1);
tl.to('#left-plate',{x:-30,duration:3.8,ease:'power2.inOut'},1.65);tl.to('#right-plate',{x:30,duration:3.8,ease:'power2.inOut'},1.65);
tl.to(flow,{p:2.35,duration:5.5,ease:'none',onUpdate:move},1.2);
tl.to('#ridge',{filter:'drop-shadow(0 -12px 18px var(--core))',duration:.7,yoyo:true,repeat:5,ease:'sine.inOut'},1.8);
tl.to('.surface-arrow,.surface-arrow-head',{stroke:'var(--mantle)',fill:'var(--mantle)',duration:.5,yoyo:true,repeat:3,ease:'sine.inOut'},3.1);
tl.to('#clip',{autoAlpha:0,duration:.34,ease:'power2.in'},8.62);tl.seek(0);window.__timelines['broll-tectonic-convection']=tl;
</script></body></html>
