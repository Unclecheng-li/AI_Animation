<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 35%, #0f172a 0%, #020617 70%);
      }
      .copy {
        position: absolute; left: 140px; top: 180px; color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #22c55e; margin-bottom: 18px; font-weight: 600;
      }
      .title { font-size: 84px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 20px; font-size: 28px; color: #94a3b8; max-width: 560px; }
      .pipe {
        position: absolute; left: 140px; right: 140px; top: 420px;
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px;
      }
      .stage {
        background: #0f172a; border: 1px solid #1e293b; border-radius: 22px;
        padding: 36px 32px; min-height: 280px;
        font-family: "Segoe UI", sans-serif; position: relative;
      }
      .stage.pass { border-color: #16a34a; box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35); }
      .stage h4 {
        font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #64748b; margin-bottom: 22px;
      }
      .stage strong { display: block; font-size: 36px; color: #e2e8f0; margin-bottom: 18px; }
      .status { font-size: 24px; color: #64748b; }
      .status.ok { color: #22c55e; font-weight: 700; }
      .dot {
        position: absolute; top: 28px; right: 28px; width: 18px; height: 18px;
        border-radius: 50%; background: #334155;
      }
      .dot.on { background: #22c55e; box-shadow: 0 0 12px rgba(34, 197, 94, 0.7); }
      .conn {
        position: absolute; top: 560px; left: 140px; right: 140px; height: 4px;
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 0 12.5%;
        pointer-events: none;
      }
      .conn i {
        display: block; height: 4px; background: #1e293b; border-radius: 999px; overflow: hidden;
      }
      .conn i b {
        display: block; height: 100%; width: 0%; background: #22c55e;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">CI · Ship</div>
        <div class="title">Deploy Pipeline</div>
        <div class="sub">Lint → Test → Build → Deploy lights green in sequence.</div>
      </div>
      <div id="pipe" class="clip pipe" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="stage" id="s1">
          <div class="dot" id="d1"></div>
          <h4>Stage 01</h4>
          <strong>Lint</strong>
          <div class="status" id="st1">queued</div>
        </div>
        <div class="stage" id="s2">
          <div class="dot" id="d2"></div>
          <h4>Stage 02</h4>
          <strong>Test</strong>
          <div class="status" id="st2">queued</div>
        </div>
        <div class="stage" id="s3">
          <div class="dot" id="d3"></div>
          <h4>Stage 03</h4>
          <strong>Build</strong>
          <div class="status" id="st3">queued</div>
        </div>
        <div class="stage" id="s4">
          <div class="dot" id="d4"></div>
          <h4>Stage 04</h4>
          <strong>Deploy</strong>
          <div class="status" id="st4">queued</div>
        </div>
      </div>
      <div id="conn" class="clip conn" data-start="0" data-duration="4.5" data-track-index="2">
        <i><b id="b1"></b></i><i><b id="b2"></b></i><i><b id="b3"></b></i>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pass = (n, label) => {
        document.getElementById("s" + n).classList.add("pass");
        document.getElementById("d" + n).classList.add("on");
        const st = document.getElementById("st" + n);
        st.textContent = label;
        st.classList.add("ok");
      };
      gsap.set("#copy", { opacity: 0, y: 14 });
      gsap.set("#pipe", { opacity: 0, y: 24 });
      gsap.set("#conn", { opacity: 0 });
      gsap.set(["#b1", "#b2", "#b3"], { width: "0%" });
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to("#pipe", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.25)
        .to("#conn", { opacity: 1, duration: 0.3 }, 0.5)
        .to({}, { duration: 0.01, onStart: () => { document.getElementById("st1").textContent = "running…"; } }, 0.85)
        .to({}, { duration: 0.01, onStart: () => pass(1, "passed · 0 errors") }, 1.25)
        .to("#b1", { width: "100%", duration: 0.35 }, 1.3)
        .to({}, { duration: 0.01, onStart: () => { document.getElementById("st2").textContent = "running…"; } }, 1.7)
        .to({}, { duration: 0.01, onStart: () => pass(2, "passed · 128 tests") }, 2.15)
        .to("#b2", { width: "100%", duration: 0.35 }, 2.2)
        .to({}, { duration: 0.01, onStart: () => { document.getElementById("st3").textContent = "running…"; } }, 2.6)
        .to({}, { duration: 0.01, onStart: () => pass(3, "artifact ready") }, 3.05)
        .to("#b3", { width: "100%", duration: 0.35 }, 3.1)
        .to({}, { duration: 0.01, onStart: () => pass(4, "live on ui2v.com") }, 3.5)
        .to("#pipe", { y: -8, duration: 0.85, ease: "sine.inOut" }, 3.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
