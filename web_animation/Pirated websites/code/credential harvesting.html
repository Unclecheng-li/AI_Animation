<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@kali:~/target — Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            height: 100vh;
            overflow: hidden;
        }

        /* CRT scanline overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Subtle screen glow */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20, 50, 20, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 99;
        }

        .terminal {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Tmux-style status bar TOP */
        .tmux-bar {
            height: 22px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 11px;
            color: #5faf5f;
            font-weight: 700;
        }

        .tmux-left {
            display: flex;
            gap: 2px;
        }

        .tmux-tab {
            padding: 2px 12px;
            background: #5faf5f;
            color: #000;
        }

        .tmux-tab.inactive {
            background: #333;
            color: #888;
        }

        .tmux-right {
            margin-left: auto;
            display: flex;
            gap: 12px;
            color: #888;
        }

        .tmux-right span {
            color: #5faf5f;
        }

        /* Terminal body */
        .terminal-body {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #d0d0d0;
        }

        .terminal-body::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-body::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: #333;
        }

        .line {
            display: flex;
            align-items: flex-start;
            gap: 0;
            margin-bottom: 1px;
            opacity: 0;
            animation: fadeIn 0.03s ease forwards;
            white-space: pre-wrap;
            word-break: break-all;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Prompt style: root@kali:~/target# */
        .prompt {
            color: #5faf5f;
            font-weight: 700;
        }

        .prompt-user { color: #5faf5f; }
        .prompt-host { color: #5faf5f; }
        .prompt-path { color: #5f87d7; }
        .prompt-sym { color: #d0d0d0; }

        .text { color: #d0d0d0; }
        .text.dim { color: #666; }
        .text.green { color: #5faf5f; }
        .text.red { color: #d75f5f; }
        .text.yellow { color: #d7af5f; }
        .text.blue { color: #5f87d7; }
        .text.cyan { color: #5fafd7; }
        .text.magenta { color: #d75faf; }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background: #5faf5f;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Section headers with ASCII art style */
        .section-hr {
            color: #444;
            margin: 4px 0;
            letter-spacing: 2px;
        }

        /* Credential block - no border, just indentation and color */
        .cred-block {
            margin: 2px 0 2px 24px;
            padding: 4px 0;
            border-left: 2px solid #333;
            padding-left: 12px;
        }

        .cred-title {
            color: #d75faf;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .cred-item {
            color: #af87d7;
            line-height: 1.6;
            font-size: 11px;
        }

        /* Key reveal - dark background, monospace */
        .key-dump {
            background: #151515;
            margin: 2px 0 2px 24px;
            padding: 6px 10px;
            font-size: 10px;
            color: #d75f5f;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.7;
            border-left: 2px solid #d75f5f;
        }

        /* Verify block */
        .verify-block {
            margin: 2px 0 2px 24px;
            padding: 4px 0;
            border-left: 2px solid #d7af5f;
            padding-left: 12px;
        }

        .verify-title {
            color: #d7af5f;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .verify-item {
            color: #af875f;
            line-height: 1.6;
            font-size: 11px;
        }

        .verify-ok { color: #5faf5f; }
        .verify-fail { color: #d75f5f; }

        /* Final summary block */
        .summary-block {
            margin: 4px 0;
            padding: 8px 12px;
            background: #151515;
            border-left: 3px solid #d75f5f;
        }

        .summary-title {
            color: #d75f5f;
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .summary-item {
            color: #d7af5f;
            padding-left: 12px;
            line-height: 1.7;
            font-size: 11px;
        }

        /* Progress bar ascii style */
        .progress-bar {
            color: #5faf5f;
            font-size: 11px;
        }

        .progress-empty {
            color: #333;
        }

        /* Tmux status bar BOTTOM */
        .tmux-bottom {
            height: 22px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 11px;
            color: #888;
        }

        .tmux-bottom-left {
            display: flex;
            gap: 8px;
        }

        .tmux-bottom-right {
            margin-left: auto;
            display: flex;
            gap: 12px;
        }

        .tmux-bottom-right span {
            color: #5faf5f;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="tmux-bar">
            <div class="tmux-left">
                <span class="tmux-tab">0:bash*</span>
                <span class="tmux-tab inactive">1:vim</span>
                <span class="tmux-tab inactive">2:ssh</span>
            </div>
            <div class="tmux-right">
                "kali" <span>12:34</span> 01-Jun-26
            </div>
        </div>

        <div class="terminal-body" id="terminal"></div>

        <div class="tmux-bottom">
            <div class="tmux-bottom-left">
                [root@kali] [~/target]
            </div>
            <div class="tmux-bottom-right">
                bash <span>UTF-8</span> 80x24
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');

        function createLine(html, delay = 0) {
            const line = document.createElement('div');
            line.className = 'line';
            line.style.animationDelay = delay + 's';
            line.innerHTML = html;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function prompt() {
            return '<span class="prompt"><span class="prompt-user">root</span>@<span class="prompt-host">kali</span>:<span class="prompt-path">~/target</span><span class="prompt-sym"># </span></span>';
        }

        async function run() {
            // 初始命令
            createLine(prompt() + '<span class="text">npm install axios</span>');
            await sleep(500);

            createLine('<span class="text dim">npm WARN config global `--global`, `--local` are deprecated. Use `--location=global` instead.</span>');
            await sleep(200);

            createLine('');
            createLine('<span class="text dim">added 3 packages, and audited 42 packages in 2s</span>');
            await sleep(300);

            createLine('<span class="text dim">found 0 vulnerabilities</span>');
            await sleep(400);

            createLine('');

            // ========== 攻击开始 ==========
            createLine('<span class="text yellow">[!] postinstall script triggered: node_modules/axios/scripts/setup.js</span>');
            await sleep(400);

            createLine('<span class="text dim">  [setup] Checking peer dependencies...</span>');
            await sleep(150);
            createLine('<span class="text dim">  [setup] Running optimization...</span>');
            await sleep(200);
            createLine('<span class="text dim">  [setup] Fetching remote config...</span>');
            await sleep(300);

            createLine('');
            createLine('<span class="text red">[!] SUSPICIOUS ACTIVITY DETECTED</span>');
            await sleep(500);

            // ========== 凭证收割 ==========
            createLine('');
            createLine('<span class="text section-hr">--------------------------------------------------------------------------------</span>');
            createLine('<span class="text magenta">[*] Harvesting credentials...</span>');
            createLine('<span class="text section-hr">--------------------------------------------------------------------------------</span>');
            await sleep(300);

            createLine('<span class="text dim">  [scan] ~/.aws/credentials</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.azure/</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.config/gcloud/</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.ssh/</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.npmrc</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.git-credentials</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.docker/config.json</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] ~/.env, .env.local, .env.production</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] process.env</span>');
            await sleep(80);
            createLine('<span class="text dim">  [scan] CI/CD variables (GITHUB_TOKEN, GITLAB_TOKEN, CIRCLE_TOKEN)</span>');
            await sleep(400);

            // AWS 密钥
            createLine('');
            createLine('<span class="text green">  [+] AWS credentials found in ~/.aws/credentials</span>');
            await sleep(200);
            createLine('<div class="key-dump">[default]<br>aws_access_key_id = AKIAIOSFODNN7EXAMPLE<br>aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY<br>region = us-east-1<br><br>[production]<br>aws_access_key_id = AKIAI44QH8DHBEXAMPLE<br>aws_secret_access_key = je7MtGbClwBF/2Zp9Utk/h3yCo8nvbEXAMPLEKEY<br>region = ap-northeast-1</div>');
            await sleep(500);

            // Azure 配置
            createLine('<span class="text green">  [+] Azure Service Principal found in ~/.azure/</span>');
            await sleep(200);
            createLine('<div class="key-dump">{"clientId":"a1b2c3d4-e5f6-7890-abcd-ef1234567890",<br>"clientSecret":"d-FL95Q19q7MQmFpd7hHD0Ty~8XyZ",<br>"subscriptionId":"12345678-1234-1234-1234-123456789012",<br>"tenantId":"abcdef12-3456-7890-abcd-ef1234567890"}</div>');
            await sleep(500);

            // GCP 密码
            createLine('<span class="text green">  [+] GCP service account key found in ~/.config/gcloud/</span>');
            await sleep(200);
            createLine('<div class="key-dump">{"type":"service_account","project_id":"my-project-123",<br>"private_key_id":"a1b2c3d4e5f67890abcdef1234567890abcdef12",<br>"client_email":"deploy@my-project-123.iam.gserviceaccount.com",<br>"client_id":"123456789012345678901",<br>"auth_uri":"https://accounts.google.com/o/oauth2/auth",<br>"token_uri":"https://oauth2.googleapis.com/token"}</div>');
            await sleep(500);

            // SSH 密钥
            createLine('<span class="text green">  [+] SSH private key found in ~/.ssh/id_rsa</span>');
            await sleep(200);
            createLine('<div class="key-dump">-----BEGIN OPENSSH PRIVATE KEY-----<br>b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW<br>QyNTUxOQAAACB0sD+8K6iV3F7bg4gN1XTVu6V0g6kP5Q7kQ9s2V7b8QAAAAFHRlc3R1c2Vy<br>@GV4YW1wbGUuY29tAAAACXN0b2xlLWtleQ==<br>-----END OPENSSH PRIVATE KEY-----</div>');
            await sleep(400);

            // GitHub 令牌
            createLine('<span class="text green">  [+] GitHub token found in ~/.git-credentials</span>');
            await sleep(200);
            createLine('<div class="key-dump">https://ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@github.com</div>');
            await sleep(300);
            createLine('<span class="text green">  [+] GITHUB_TOKEN found in environment variables</span>');
            await sleep(200);
            createLine('<div class="key-dump">ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789</div>');
            await sleep(400);

            // CI/CD 密钥
            createLine('<span class="text green">  [+] CI/CD secrets found in environment variables</span>');
            await sleep(200);
            createLine('<div class="key-dump">GITLAB_TOKEN=glpat-xxxxxxxxxxxxxxxxxxxx<br>CIRCLE_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx<br>TRAVIS_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx<br>NPM_TOKEN=npm_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</div>');
            await sleep(400);

            // 环境变量
            createLine('<span class="text green">  [+] Database credentials found in .env.production</span>');
            await sleep(200);
            createLine('<div class="key-dump">DATABASE_URL=postgresql://admin:SuperSecret123@prod.db.internal:5432/app<br>REDIS_URL=redis://:RedisPass456@cache.internal:6379/0<br>MONGODB_URI=mongodb+srv://app_user:MongoPass789@cluster0.mongodb.net/app</div>');
            await sleep(400);

            createLine('<span class="text green">  [+] API keys found in process.env</span>');
            await sleep(200);
            createLine('<div class="key-dump">OPENAI_API_KEY=sk-proj-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx<br>STRIPE_SECRET_KEY=sk_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx<br>SENDGRID_API_KEY=SG.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</div>');
            await sleep(500);

            // ========== TruffleHog 验证 ==========
            createLine('');
            createLine('<span class="text section-hr">--------------------------------------------------------------------------------</span>');
            createLine('<span class="text yellow">[*] Running TruffleHog verification...</span>');
            createLine('<span class="text section-hr">--------------------------------------------------------------------------------</span>');
            await sleep(400);

            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> AWS Access Key ID: AKIAIOSFODNN7EXAMPLE — sts:GetCallerIdentity success</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> AWS Secret Key — ListBuckets: 23 buckets accessible</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> Azure Service Principal — az account show: subscription active</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> GCP Service Account — gcloud projects list: 7 projects accessible</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> GitHub Token — repo, workflow, admin:org scopes confirmed</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> GitLab Token — api, read_repository, write_repository scopes confirmed</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> SSH Key — ssh -T git@github.com: authenticated as "deploy-user"</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> OpenAI API Key — /v1/models: GPT-4 access confirmed</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> Stripe Secret Key — /v1/charges: live mode, $12,847.32 balance</span>');
            await sleep(150);
            createLine('<span class="verify-item"><span class="verify-ok">[VALID]</span> Database URL — psql connection: 47 tables, 2.3M rows</span>');
            await sleep(500);

            // ========== 数据外传 ==========
            createLine('');
            createLine('<span class="text red">[!] EXFILTRATING DATA TO REMOTE SERVER...</span>');
            await sleep(300);

            createLine('<span class="text dim">  Connecting to 185.220.101.47:443 via TLS...</span>');
            await sleep(400);
            createLine('<span class="text green">  Connected. TLS 1.3 handshake complete.</span>');
            await sleep(200);

            createLine('<span class="text dim">  Compressing harvested data...</span>');
            await sleep(300);
            createLine('<span class="text green">  Compressed: 12 credentials -> harvest_20241215_034712.tar.gz (8.4 KB)</span>');
            await sleep(200);

            createLine('<span class="text dim">  Uploading to C2 server...</span>');
            await sleep(200);
            createLine('<span class="text green">  [===================>] 100%  8.4 KB  0.3s</span>');
            await sleep(100);
            createLine('<span class="text green">  Upload complete. Server response: 200 OK</span>');
            await sleep(200);

            createLine('<span class="text dim">  Verifying remote receipt...</span>');
            await sleep(200);
            createLine('<span class="text green">  Server confirmed: 12 valid credentials received</span>');
            await sleep(300);

            createLine('');
            createLine('<span class="text dim">  Cleaning up traces...</span>');
            await sleep(150);
            createLine('<span class="text dim">  Removing ~/.npm/_cacache/tmp/...</span>');
            await sleep(150);
            createLine('<span class="text dim">  Clearing shell history...</span>');
            await sleep(200);
            createLine('<span class="text dim">  Removing setup.js artifact...</span>');
            await sleep(150);
            createLine('<span class="text green">  Cleanup complete. No traces left.</span>');
            await sleep(400);

            // 最终统计
            createLine('');
            createLine('<div class="summary-block">' +
                '<div class="summary-title">[!] 攻击完成 — 凭证收割统计</div>' +
                '<div class="summary-item">* AWS: 2 组凭证（含 production 环境），23 个 S3 存储桶可访问</div>' +
                '<div class="summary-item">* Azure: 1 组 Service Principal，订阅内所有资源可管理</div>' +
                '<div class="summary-item">* GCP: 1 组 Service Account Key，7 个项目可访问</div>' +
                '<div class="summary-item">* SSH: 1 个私钥，可免密登录所有关联服务器</div>' +
                '<div class="summary-item">* GitHub/GitLab: 2 个 Token，含仓库/工作流/组织管理权限</div>' +
                '<div class="summary-item">* CI/CD: 4 个 Token（CircleCI, Travis, NPM），可篡改构建流程</div>' +
                '<div class="summary-item">* API Keys: OpenAI, Stripe, SendGrid 等 3 个，可直接调用收费接口</div>' +
                '<div class="summary-item">* Database: 3 组连接串，生产数据库 2.3M 行数据暴露</div>' +
                '<div class="summary-item">* 总计: 12 个有效凭证，全部通过 TruffleHog 验证可用</div>' +
                '<div class="summary-item">* 外发: 8.4 KB 压缩包，耗时 3.2 秒，目标 185.220.101.47</div>' +
                '</div>');
            await sleep(600);

            createLine('');
            createLine(prompt() + '<span class="cursor"></span>');
        }

        // 等待用户按回车键开始
        createLine(prompt() + '<span class="text">npm install axios</span><span class="cursor"></span>');

        let running = false;
        document.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && !running) {
                running = true;
                terminal.innerHTML = '';
                await run();
            }
        });
    </script>
</body>
</html>
