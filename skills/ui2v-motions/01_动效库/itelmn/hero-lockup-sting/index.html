<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090d; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(70% 60% at 50% 45%, #151822 0%, #08090d 70%);
      }
      .mark {
        position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
        font-family: "Segoe UI", sans-serif; font-weight: 800; letter-spacing: -0.06em;
        font-size: 220px; color: #f8fafc;
      }
      .rule {
        position: absolute; left: 50%; top: 56%; width: 0; height: 4px;
        margin-left: 0; background: linear-gradient(90deg, #22d3ee, #a78bfa); border-radius: 999px;
        transform: translateX(-50%);
      }
      .tag {
        position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
        font-family: "Segoe UI", sans-serif; font-size: 34px; letter-spacing: 0.35em;
        text-transform: uppercase; color: rgba(226, 232, 240, 0.75);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="mark" class="clip mark" data-start="0" data-duration="4.5" data-track-index="0">UI2V</div>
      <div id="rule" class="clip rule" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="tag" class="clip tag" data-start="0" data-duration="4.5" data-track-index="2">HyperFrames Registry</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#mark", { opacity: 0, scale: 0.86, transformOrigin: "50% 50%" });
      gsap.set("#rule", { width: 0, opacity: 0 });
      gsap.set("#tag", { opacity: 0, y: 18 });
      tl.to("#mark", { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" }, 0.15)
        .to("#rule", { opacity: 1, width: 420, duration: 0.7, ease: "power2.out" }, 0.85)
        .to("#tag", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.15)
        .to("#mark", { scale: 1.03, duration: 2.2, ease: "sine.inOut" }, 1.8)
        .to("#rule", { width: 520, duration: 2.2, ease: "sine.inOut" }, 1.8);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
