<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Negotiation Guidelines"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"Like any negotiation, it is a process — back and forth, ironing out and amending. Below are a few simple guidelines that can assist you throughout the whole process."},
  {"id":"steps","type":"string","label":"Steps (JSON array)","default":"[{\"label\":\"1\",\"name\":\"Prepare Thoroughly\",\"body\":\"Research the other party, understand their needs and constraints. Define your objectives, your best alternative to a negotiated agreement, and your walk-away point before entering discussions.\"},{\"label\":\"2\",\"name\":\"Build Rapport\",\"body\":\"Establish a respectful, professional relationship. Listen actively and acknowledge the other party’s perspective. Trust and mutual respect create the foundation for productive negotiation.\"},{\"label\":\"3\",\"name\":\"Explore Options\",\"body\":\"Generate multiple possibilities before committing. Use open-ended questions to uncover interests behind positions. The best solutions often emerge from creative problem-solving, not positional bargaining.\"},{\"label\":\"4\",\"name\":\"Negotiate Terms\",\"body\":\"Trade concessions strategically — give on low-priority items to gain on high-priority ones. Keep the discussion focused on objective criteria and mutual benefit rather than personal wins and losses.\"},{\"label\":\"5\",\"name\":\"Close & Document\",\"body\":\"Summarise agreements clearly and confirm mutual understanding. Document all terms in writing promptly. A handshake is good; a signed agreement is better. Follow up to ensure commitments are honoured.\"}]"},
  {"id":"activeStep","type":"number","label":"Active Step (0-based)","default":0,"min":0,"max":4},
  {"id":"primaryColor","type":"color","label":"Primary / Plate Color","default":"#285f9f"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"bgColor","type":"color","label":"Background Color","default":"#f5f2ea"},
  {"id":"cardColor","type":"color","label":"Card Background","default":"#fffdfa"},
  {"id":"durationPerStep","type":"number","label":"Seconds per Step","default":4,"min":2,"max":10,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #285f9f;
      --bg: #f5f2ea;
      --card: #fffdfa;
      --ink: #182026;
      --ink-muted: #5a6e78;
      --idle-circle: #d8d2c8;
      --idle-text: #8a9ba8;
      --plate-image: url("v2-base-blue.png");
    }

    body {
      width: 1920px;
      height: 1080px;
      background: var(--bg);
      overflow: hidden;
      position: relative;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    #process-flow {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-image: var(--plate-image);
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 88px;
    }

    #process-flow > * { z-index: 1; }

    /* Header */
    .pf-title {
      font-size: 46px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      opacity: 0;
    }

    .pf-subtitle {
      font-size: 20px;
      color: var(--ink-muted);
      max-width: 900px;
      margin-top: 18px;
      line-height: 1.55;
      text-align: center;
      opacity: 0;
    }

    /* Step Track */
    .step-track {
      display: flex;
      align-items: center;
      margin-top: 52px;
      opacity: 0;
    }

    .step-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .step-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--idle-circle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--idle-text);
    }

    .step-lbl {
      font-size: 14px;
      font-weight: 600;
      color: var(--idle-text);
      text-align: center;
      max-width: 130px;
      line-height: 1.3;
    }

    .step-connector {
      width: 130px;
      height: 3px;
      background: var(--idle-circle);
      margin: 0 -4px 28px;
    }

    /* Content Card */
    .content-card {
      width: 1100px;
      height: 400px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(24, 32, 38, 0.09);
      position: relative;
      overflow: hidden;
      margin-top: 36px;
      opacity: 0;
    }

    .step-panel {
      position: absolute;
      inset: 0;
      padding: 60px 80px;
    }

    .step-panel .num-bg {
      position: absolute;
      top: 24px;
      right: 44px;
      font-size: 80px;
      font-weight: 800;
      color: var(--primary);
      opacity: 0.08;
      line-height: 1;
      pointer-events: none;
    }

    .step-panel .panel-heading {
      font-size: 34px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .step-panel .panel-body {
      font-size: 22px;
      line-height: 1.7;
      color: var(--ink);
      max-width: 880px;
    }
  </style>
</head>
<body>
  <div id="process-flow"
       data-composition-id="process-flow"
       data-width="1920"
       data-height="1080"
       data-duration="21"
       data-start="0"
       data-track-index="0">

    <div class="pf-title" id="pfTitle"></div>
    <div class="pf-subtitle" id="pfSubtitle"></div>
    <div class="step-track" id="stepTrack"></div>
    <div class="content-card" id="contentCard"></div>

    <div id="el-fade" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const vars       = __hyperframes.getVariables();
      const title      = vars.title        || 'Negotiation Guidelines';
      const subtitle   = vars.subtitle     || '';
      const steps      = JSON.parse(vars.steps || '[]');
      const primary    = vars.primaryColor || '#285f9f';
      const basePlate  = vars.basePlateImage || 'v2-base-blue.png';
      const bgColor    = vars.bgColor      || '#f5f2ea';
      const cardColor  = vars.cardColor    || '#fffdfa';
      const durPerStep = Number(vars.durationPerStep) || 4;
      const TOTAL      = steps.length * durPerStep + 1;

      // Apply CSS variables
      const r = document.documentElement;
      r.style.setProperty('--primary', primary);
      r.style.setProperty('--bg', bgColor);
      r.style.setProperty('--card', cardColor);
      const comp = document.getElementById('process-flow');
      comp.style.backgroundImage    = `url("${basePlate}")`;
      comp.style.backgroundColor    = bgColor;
      comp.setAttribute('data-duration', TOTAL);

      // Header text
      document.getElementById('pfTitle').textContent    = title;
      document.getElementById('pfSubtitle').textContent = subtitle;

      // ── Step Track ────────────────────────────────────────────────
      const trackEl    = document.getElementById('stepTrack');
      const circles    = [];
      const lbls       = [];
      const connectors = [];

      steps.forEach((step, i) => {
        const node = document.createElement('div');
        node.className = 'step-node';
        node.innerHTML =
          '<div class="step-circle" id="c' + i + '">' + step.label + '</div>' +
          '<div class="step-lbl" id="l' + i + '">' + step.name + '</div>';
        trackEl.appendChild(node);
        circles.push(document.getElementById('c' + i));
        lbls.push(document.getElementById('l' + i));

        if (i < steps.length - 1) {
          const conn = document.createElement('div');
          conn.className = 'step-connector';
          conn.id = 'conn' + i;
          trackEl.appendChild(conn);
          connectors.push(conn);
        }
      });

      // Pre-set step 0 as active
      gsap.set(circles[0], { backgroundColor: primary, color: '#fff', scale: 1.2, boxShadow: '0 4px 16px ' + primary + '55' });
      gsap.set(lbls[0], { color: primary });

      // ── Content Panels ────────────────────────────────────────────
      const card   = document.getElementById('contentCard');
      const panels = [];

      steps.forEach((step, i) => {
        const p = document.createElement('div');
        p.className = 'step-panel';
        p.id = 'p' + i;
        p.innerHTML =
          '<div class="num-bg">' + step.label + '</div>' +
          '<div class="panel-heading">' + step.name + '</div>' +
          '<div class="panel-body">' + step.body + '</div>';
        card.appendChild(p);
        panels.push(p);
        if (i !== 0) gsap.set(p, { opacity: 0 });
      });

      // ── Timeline ──────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // Intro
      tl.to('#pfTitle',     { opacity: 1, y: -12, duration: 0.6,  ease: 'power2.out' }, 0);
      tl.to('#pfSubtitle',  { opacity: 1,          duration: 0.5,  ease: 'power2.out' }, 0.25);
      tl.to('#stepTrack',   { opacity: 1, y: -10,  duration: 0.55, ease: 'power2.out' }, 0.45);
      tl.to('#contentCard', { opacity: 1, y: -14,  duration: 0.5,  ease: 'power2.out' }, 0.65);

      // Step transitions — step 0 pre-loaded; iterate 1 … n-1
      for (var i = 1; i < steps.length; i++) {
        (function(idx) {
          var t    = idx * durPerStep;
          var prev = idx - 1;

          // Panel crossfade
          tl.to(panels[prev], { opacity: 0, duration: 0.25, ease: 'power2.in'  }, t);
          tl.to(panels[idx],  { opacity: 1, duration: 0.45, ease: 'power2.out' }, t + 0.25);

          // Deactivate previous
          tl.to(circles[prev], { backgroundColor: '#d8d2c8', color: '#8a9ba8', scale: 1, boxShadow: 'none', duration: 0.3 }, t);
          tl.to(lbls[prev],    { color: '#8a9ba8', duration: 0.3 }, t);

          // Activate current
          tl.to(circles[idx], { backgroundColor: primary, color: '#fff', scale: 1.2, boxShadow: '0 4px 16px ' + primary + '55', duration: 0.3 }, t + 0.1);
          tl.to(lbls[idx],    { color: primary, duration: 0.3 }, t + 0.1);

          // Connector done
          if (connectors[prev]) {
            tl.to(connectors[prev], { backgroundColor: primary, duration: 0.3 }, t);
          }

          // Card micro-bounce
          tl.to('#contentCard', { scale: 0.985, duration: 0.13 }, t + 0.1);
          tl.to('#contentCard', { scale: 1, duration: 0.4, ease: 'back.out(1.3)' }, t + 0.23);
        })(i);
      }

      // Fade-to-black outro (V3 standard)
      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);

      window.__timelines = window.__timelines || {};
      window.__timelines['process-flow'] = tl;
    </script>
  </div>
</body>
</html>
