<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #022c22; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #022c22; }
      .grid {
        position: absolute; inset: -80px;
        display: grid; grid-template-columns: repeat(24, 1fr); grid-template-rows: repeat(14, 1fr);
        gap: 2px;
      }
      .cell {
        background: rgba(52, 211, 153, 0.12);
        border-radius: 2px;
      }
      .rip {
        position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px;
        border-radius: 50%; border: 3px solid rgba(167, 243, 208, 0.8);
        box-shadow: 0 0 40px rgba(52, 211, 153, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="grid" class="clip grid" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="rip1" class="clip rip" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="rip2" class="clip rip" data-start="0" data-duration="4.5" data-track-index="2"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const grid = document.getElementById("grid");
      const cells = [];
      for (let i = 0; i < 24 * 14; i++) {
        const el = document.createElement("div");
        el.className = "cell";
        grid.appendChild(el);
        cells.push(el);
      }
      const tl = gsap.timeline({ paused: true });
      gsap.set("#grid", { opacity: 0 });
      gsap.set(["#rip1", "#rip2"], { scale: 0.2, opacity: 0 });
      gsap.set(cells, { opacity: 0.35, scale: 0.85 });
      tl.to("#grid", { opacity: 1, duration: 0.4 }, 0.1)
        .to(cells, { opacity: 1, scale: 1, duration: 0.6, stagger: { each: 0.004, from: "center" }, ease: "power2.out" }, 0.3)
        .to("#rip1", { opacity: 1, scale: 18, duration: 2.0, ease: "power2.out" }, 1.0)
        .to("#rip1", { opacity: 0, duration: 0.6 }, 2.4)
        .to("#rip2", { opacity: 1, scale: 14, duration: 1.8, ease: "power2.out" }, 2.2)
        .to("#rip2", { opacity: 0, duration: 0.5 }, 3.6)
        .to(cells, { opacity: 0.55, duration: 0.8, stagger: { each: 0.002, from: "center" } }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
