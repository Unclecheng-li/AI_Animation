<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Build the System. Find the Market. Keep Going."},
  {"id":"tips","type":"string","label":"Tips (JSON)","default":"[{\"heading\":\"You Only Build This Once\",\"body\":\"The freelance life is real work, but it is also a shot at owning your time. Keep going, but do it with systems: offers, proposals, delivery checklists, follow-ups, and cash-flow rules that make momentum repeatable.\"},{\"heading\":\"Build to Market, Not Ego\",\"body\":\"Do not disappear for months making the perfect product. Talk to buyers, test the pain, pre-sell the outcome, and prove people will pay before you go all in.\"},{\"heading\":\"Opportunity Likes Structure\",\"body\":\"There is demand out there, but it rewards the freelancers who look easy to trust. Package your service, show proof, define scope, and make the next step obvious.\"},{\"heading\":\"Risk Is Part of the Plan\",\"body\":\"Back yourself, but protect the downside. Validate product fit, keep a runway, cap early experiments, and use contracts so one exciting opportunity does not become a business-ending surprise.\"}]"},
  {"id":"accentColor","type":"color","label":"Accent Color","default":"#7678ed"},
  {"id":"bgColor","type":"color","label":"Background","default":"#22223b"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":""},
  {"id":"durationPerTip","type":"number","label":"Seconds per Tip","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Lato:wght@400;700&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #7678ed;
      --bg: #22223b;
      --base-plate: none;
      --cyan: #46f0ff;
      --magenta: #ff4fd8;
      --paper: #f2e9e4;
      --muted: #9a8c98;
    }
    body {
      width: 1920px;
      height: 1080px;
      background-color: var(--bg);
      background-image: var(--base-plate);
      background-size: 1920px 1080px;
      background-position: 0 0;
      background-repeat: no-repeat;
      font-family: "Lato", Arial, Helvetica, sans-serif;
      overflow: hidden;
      position: relative;
      color: var(--paper);
    }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    .bp-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.026) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.95;
    }
    .radial-split {
      position: absolute;
      left: -190px;
      top: -70px;
      width: 1300px;
      height: 1200px;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(118,120,237,0.34) 0 10%,
          rgba(70,240,255,0.18) 11% 16%,
          rgba(255,79,216,0.18) 17% 22%,
          rgba(34,34,59,0) 42%);
      filter: saturate(1.35);
      opacity: 0.9;
      transform: scale(0.94);
    }
    .radial-split::before,
    .radial-split::after {
      content: "";
      position: absolute;
      inset: 150px;
      border: 2px solid rgba(118,120,237,0.3);
      border-radius: 50%;
      box-shadow:
        18px 0 0 rgba(70,240,255,0.12),
        -18px 0 0 rgba(255,79,216,0.12),
        0 0 80px rgba(118,120,237,0.18);
    }
    .radial-split::after {
      inset: 275px;
      border-color: rgba(242,233,228,0.08);
      box-shadow:
        28px 0 0 rgba(70,240,255,0.1),
        -28px 0 0 rgba(255,79,216,0.1);
    }
    .scanline {
      position: absolute;
      inset: 0;
      height: 180px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.035), transparent);
      opacity: 0.45;
      transform: translateY(-220px);
    }
    .bp-number {
      position: absolute;
      left: 60px;
      top: 42px;
      font-family: "Space Mono", monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.82;
    }
    .title-strip {
      position: absolute;
      left: 170px;
      top: 102px;
      width: 1120px;
      font-family: "Bebas Neue", sans-serif;
      font-size: 58px;
      letter-spacing: 0.055em;
      color: var(--paper);
      text-shadow: 3px 0 0 rgba(70,240,255,0.22), -3px 0 0 rgba(255,79,216,0.2);
      opacity: 0;
    }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .sidebar {
      position: absolute;
      left: 0;
      top: 0;
      width: 92px;
      height: 100%;
      background: rgba(118,120,237,0.12);
      border-right: 1px solid rgba(118,120,237,0.24);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
    }
    .s-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(242,233,228,0.25);
      border: 1px solid rgba(242,233,228,0.35);
      box-shadow: 0 0 0 rgba(118,120,237,0);
    }
    .content {
      position: absolute;
      left: 150px;
      top: 0;
      right: 0;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 120px 80px 80px 80px;
    }
    .card {
      max-width: 1160px;
      width: 100%;
      opacity: 0;
      padding: 46px 54px 52px 54px;
      background: rgba(20,20,39,0.66);
      border: 1px solid rgba(118,120,237,0.28);
      box-shadow: 0 24px 90px rgba(0,0,0,0.24), inset 0 0 0 1px rgba(255,255,255,0.035);
      backdrop-filter: blur(2px);
    }
    .card .divider {
      width: 90px;
      height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--accent), var(--magenta));
      border-radius: 2px;
      margin-bottom: 24px;
      box-shadow: 0 0 26px rgba(118,120,237,0.45);
    }
    .card-inner { position: relative; }
    .tip-block { position: absolute; inset: 0; opacity: 0; }
    .tip-block:first-child { position: relative; opacity: 1; }
    .t-heading {
      font-family: "Bebas Neue", sans-serif;
      font-size: 64px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--accent);
      line-height: 1.02;
      margin-bottom: 22px;
      text-shadow: 2px 0 0 rgba(70,240,255,0.18), -2px 0 0 rgba(255,79,216,0.18);
    }
    .t-body {
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      line-height: 1.68;
      color: var(--paper);
      max-width: 960px;
      opacity: 0.86;
    }
    .market-tag {
      position: absolute;
      right: 64px;
      bottom: 52px;
      font-family: "Space Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0.72;
    }
  </style>
</head>
<body>
  <div data-composition-id="freelancer-tips" data-width="1920" data-height="1080" data-duration="16" data-start="0">
    <div class="bp-grid"></div>
    <div class="radial-split" id="radialSplit"></div>
    <div class="scanline" id="scanline"></div>
    <div class="bp-number">11 / 20</div>
    <div class="title-strip" id="titleStrip"></div>
    <div id="el-fade"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="content">
      <div class="card" id="card">
        <div class="divider"></div>
        <div class="card-inner" id="cardInner"></div>
      </div>
    </div>
    <div class="market-tag">Validate demand / cap risk / ship with systems</div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var tips = JSON.parse(vars.tips || '[]');
      var accentColor = vars.accentColor || '#7678ed';
      var bgColor = vars.bgColor || '#22223b';
      var basePlateImage = vars.basePlateImage || '';
      var dur = Number(vars.durationPerTip) || 4;
      document.documentElement.style.setProperty('--accent', accentColor);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', basePlateImage ? 'url("' + basePlateImage + '")' : 'none');
      document.getElementById('titleStrip').textContent = vars.title || 'Build the System. Find the Market. Keep Going.';

      var sidebar = document.getElementById('sidebar');
      var cardInner = document.getElementById('cardInner');
      var dotEls = [], tipPanels = [];

      tips.forEach(function(tip, i) {
        var d = document.createElement('div');
        d.className = 's-dot';
        if (i === 0) {
          d.style.background = '#f2e9e4';
          d.style.boxShadow = '0 0 28px rgba(118,120,237,0.8)';
        }
        sidebar.appendChild(d);
        dotEls.push(d);

        var panel = document.createElement('div');
        panel.innerHTML = '<div class="t-heading">' + tip.heading + '</div><div class="t-body">' + tip.body + '</div>';
        if (i === 0) {
          panel.style.position = 'relative';
          panel.style.opacity = '1';
        } else {
          panel.className = 'tip-block';
        }
        cardInner.appendChild(panel);
        tipPanels.push(panel);
        if (i !== 0) gsap.set(panel, { opacity: 0 });
      });

      var TOTAL = tips.length * dur + 1;
      var tl = gsap.timeline({ paused: true });
      tl.to('#sidebar', { opacity: 1, duration: 0.5 }, 0);
      tl.to('#titleStrip', { opacity: 1, y: -12, duration: 0.7, ease: 'power2.out' }, 0.15);
      tl.to('#radialSplit', { scale: 1.03, rotation: 2, duration: TOTAL - 0.4, ease: 'none' }, 0);
      tl.to('#scanline', { y: 1260, duration: TOTAL - 0.2, ease: 'none' }, 0);
      tl.to('#card', { opacity: 1, x: -30, duration: 0.5, ease: 'power2.out' }, 0.35);
      tl.from('.divider', { width: 0, duration: 0.6, ease: 'power2.out' }, 0.5);

      for (var i = 1; i < tips.length; i++) {
        (function(idx) {
          var t = idx * dur;
          var prev = idx - 1;
          tl.to(tipPanels[prev], { opacity: 0, x: -14, duration: 0.22, overwrite: 'auto' }, t);
          tl.fromTo(tipPanels[idx], { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.42, ease: 'power2.out', overwrite: 'auto' }, t + 0.22);
          tl.to(dotEls[prev], { backgroundColor: 'rgba(242,233,228,0.25)', width: 14, height: 14, boxShadow: '0 0 0 rgba(118,120,237,0)', duration: 0.2, overwrite: 'auto' }, t);
          tl.to(dotEls[idx], { backgroundColor: '#f2e9e4', width: 18, height: 18, boxShadow: '0 0 28px rgba(118,120,237,0.8)', duration: 0.2, overwrite: 'auto' }, t + 0.1);
          tl.fromTo('#radialSplit', { x: 0 }, { x: (idx % 2 ? 18 : -18), duration: 0.38, yoyo: true, repeat: 1, ease: 'power2.inOut', overwrite: 'auto' }, t + 0.02);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="freelancer-tips"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['freelancer-tips'] = tl;
    </script>
  </div>
</body>
</html>
