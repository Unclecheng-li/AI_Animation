<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hero — Aurora Ribbon</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #02030a;
      }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
      }
      .full-bleed { position: absolute; inset: 0; }
      #bg {
        background:
          radial-gradient(ellipse 50% 42% at 50% 50%, transparent 0%, rgba(2,3,10,0.7) 70%, #02030a 100%),
          radial-gradient(ellipse 45% 40% at 0% 85%, rgba(0, 190, 210, 0.16), transparent 60%),
          radial-gradient(ellipse 42% 38% at 100% 12%, rgba(130, 50, 255, 0.16), transparent 58%),
          #02030a;
      }
      #ribbons { position: absolute; inset: 0; }
      #ribbons svg { width: 100%; height: 100%; display: block; }
      .ribbon {
        fill: none; stroke-linecap: round; stroke-linejoin: round;
      }
      #r1 { stroke: url(#g1); stroke-width: 14; filter: url(#glow); }
      #r2 { stroke: url(#g2); stroke-width: 9; filter: url(#glow); }
      #r3 { stroke: url(#g3); stroke-width: 5; opacity: 0.85; }
      #center {
        position: absolute; left: 50%; top: 48%;
        width: 920px; height: 500px;
        transform: translate(-50%, -50%);
        background: radial-gradient(ellipse at center, #02030a 0%, #02030a 38%, transparent 70%);
      }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hero-aurora-ribbon"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4.5"
    >
      <div id="bg" class="full-bleed"></div>
      <section class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="ribbons">
          <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3de7ff" stop-opacity="0.1" />
                <stop offset="50%" stop-color="#6ad4ff" stop-opacity="0.95" />
                <stop offset="100%" stop-color="#8a5cff" stop-opacity="0.15" />
              </linearGradient>
              <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#b06bff" stop-opacity="0.15" />
                <stop offset="50%" stop-color="#8b5cff" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#49d7ff" stop-opacity="0.12" />
              </linearGradient>
              <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5fffd0" stop-opacity="0.08" />
                <stop offset="50%" stop-color="#4ef0c8" stop-opacity="0.7" />
                <stop offset="100%" stop-color="#6a8dff" stop-opacity="0.1" />
              </linearGradient>
              <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
                <feGaussianBlur stdDeviation="5" result="b" />
                <feMerge>
                  <feMergeNode in="b" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <path id="r1" class="ribbon" pathLength="1"
              d="M -60 860 C 280 780, 420 980, 760 920 C 1100 860, 1280 1000, 1620 920 C 1860 860, 1980 940, 2100 820" />
            <path id="r2" class="ribbon" pathLength="1"
              d="M 2100 200 C 1780 120, 1600 280, 1280 180 C 960 80, 780 40, 480 140 C 220 220, 80 60, -80 160" />
            <path id="r3" class="ribbon" pathLength="1"
              d="M -40 520 C 100 360, 60 160, 260 100 C 460 40, 520 240, 360 360 C 200 500, 80 620, -80 700" />
          </svg>
        </div>
        <div id="center"></div>
      </section>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Fully drawn from frame 0 — no stroke-draw "cover" intro
        gsap.set(["#r1", "#r2", "#r3"], { strokeDasharray: 1, strokeDashoffset: 0 });

        tl.to("#r1", { y: -36, duration: 4.5, ease: "sine.inOut" }, 0);
        tl.to("#r2", { y: 30, duration: 4.5, ease: "sine.inOut" }, 0);
        tl.to("#r3", { x: 24, y: -18, duration: 4.5, ease: "sine.inOut" }, 0);
        tl.to("#r1", { opacity: 0.55, duration: 1.5, yoyo: true, repeat: 2, ease: "sine.inOut" }, 0);
        tl.to("#r2", { opacity: 0.5, duration: 1.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.4);

        window.__timelines["hero-aurora-ribbon"] = tl;
      })();
    </script>
  </body>
</html>
