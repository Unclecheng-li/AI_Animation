<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Plotbeat — Scatter Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./generated/data.js"></script>
    <script src="./runtime/plotbeat-styles.js"></script>
    <script src="./runtime/plotbeat-template-scenes.js"></script>
    <style>
      :root { --bg:#07100f; --panel:#0d1817; --fg:#f4f7f2; --muted:#88928e; --grid:#21312e; --accent:#c8ff57; }
      * { box-sizing:border-box; } html,body { width:1920px;height:1080px;margin:0;overflow:hidden; } body { background:var(--bg);color:var(--fg);font-family:Inter,sans-serif; }
      #root,.clip,.scene { position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden; } .pb-ambient { position:absolute;left:240px;top:-100px;width:1200px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(130,221,255,.11),transparent 67%);filter:blur(24px); }
      .pb-header { position:absolute;left:82px;right:82px;top:58px;display:flex;justify-content:space-between;align-items:flex-start; }.pb-header p { margin:0;color:var(--accent);font-size:16px;font-weight:900;letter-spacing:.18em;text-transform:uppercase; }.pb-header h1 { max-width:1300px;margin:9px 0 0;font-size:66px;line-height:.96;font-weight:900;letter-spacing:-.05em; }.pb-mode { margin-top:8px;padding:12px 17px;border:1px solid #385049;color:#d6dfdb;font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase; }
      .pb-stage { position:absolute;inset:184px 62px 92px;display:grid;grid-template-columns:minmax(0,1fr) 365px;gap:26px; }.pb-plot-shell,.pb-side-rail { position:relative;border:1px solid #243a35;background:rgba(13,24,23,.72); }.pb-plot-shell svg { width:100%;height:100%; }.pb-grid { stroke:var(--grid);stroke-width:2; }.pb-axis-caption { fill:var(--muted);font-size:17px;font-weight:800;text-transform:uppercase; }.pb-scatter-path { fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round; }.pb-point-halo { opacity:.18; }.pb-point { stroke:#07100f;stroke-width:4; }.pb-live-chip { position:absolute;bottom:18px;min-width:120px;padding:10px 14px;background:var(--accent);color:#07100f;font-size:17px;font-weight:900;text-align:center;transform:translateX(-50%); }.pb-side-rail { padding:27px; }.pb-side-rail>p { margin:0 0 26px;color:var(--muted);font-size:14px;font-weight:900;letter-spacing:.16em;text-transform:uppercase; }.pb-rail-row { display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:72px;border-bottom:1px solid #263a35; }.pb-rail-row i { width:12px;height:12px;border-radius:50%; }.pb-rail-row strong { font-size:19px; }.pb-rail-row span { color:var(--accent);font-size:17px;font-weight:900;font-variant-numeric:tabular-nums; }
      .pb-footer { position:absolute;left:82px;right:82px;bottom:36px;display:flex;justify-content:space-between;color:#75817d;font-size:15px;font-weight:700; }.pb-footer b { color:var(--accent);letter-spacing:.12em; }.transition-panel { position:absolute;left:0;width:1920px;height:544px;background:var(--bg); }.transition-top { top:0; }.transition-bottom { bottom:0; }
      .pb-map-shell { position:relative;grid-column:1/-1;border:1px solid #243a35;background:rgba(13,24,23,.72);overflow:hidden; }.pb-map-shell svg { width:100%;height:100%; }.pb-land path { fill:#142622;stroke:#365048;stroke-width:2; }.pb-map-link { fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round; }.pb-map-halo { opacity:.2; }.pb-map-point { stroke:#07100f;stroke-width:4; }.pb-map-label { fill:#f4f7f2;font-size:17px;font-weight:900; }.pb-map-caption { position:absolute;left:34px;bottom:30px;min-width:360px;padding:20px;border:1px solid #365048;background:#07100f;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center; }.pb-map-caption span { color:#88928e;font-size:13px;font-weight:900; }.pb-map-caption strong { font-size:25px; }.pb-map-caption b { color:var(--accent);font-size:20px; }
      .pb-kpi-grid { grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-right:390px; }.pb-kpi-card { min-height:245px;padding:22px;border:1px solid #2b423c;background:#0d1817;transition:none; }.pb-kpi-card>div:first-child { display:flex;justify-content:space-between;color:#78847f;font-size:13px;font-weight:900; }.pb-kpi-card>div:first-child i { width:12px;height:12px;border-radius:50%; }.pb-kpi-card p { margin:34px 0 8px;color:#aab4b0;font-size:17px;font-weight:800; }.pb-kpi-card>strong { display:block;font-size:60px;line-height:.9;letter-spacing:-.05em; }.pb-kpi-card small { display:block;margin-top:12px;color:#77837e;font-weight:700; }.pb-kpi-track { height:6px;margin-top:30px;background:#21312e;overflow:hidden; }.pb-kpi-track i { display:block;width:100%;height:6px;transform-origin:left; }.pb-kpi-card>b { display:block;margin-top:14px;color:var(--accent);font-size:16px; }.pb-kpi-radial { grid-template-columns:repeat(3,214px);align-content:center;justify-content:space-around; }.pb-kpi-radial .pb-kpi-card { min-height:214px;padding:28px;border-radius:50%;text-align:center; }.pb-kpi-radial .pb-kpi-card p { margin:20px 0 8px; }.pb-kpi-radial .pb-kpi-card>strong { font-size:52px; }.pb-kpi-radial .pb-kpi-card small { display:none; }.pb-kpi-radial .pb-kpi-track { margin-top:20px; }.pb-kpi-summary { position:absolute;right:0;top:0;width:365px;height:100%;padding:38px;border:1px solid #2b423c;background:var(--accent);color:#07100f;display:flex;flex-direction:column;justify-content:flex-end; }.pb-kpi-summary span { margin-bottom:auto;font-size:15px;font-weight:900;letter-spacing:.14em;text-transform:uppercase; }.pb-kpi-summary strong { font-size:102px;line-height:.85;letter-spacing:-.08em; }.pb-kpi-summary p { font-size:20px;font-weight:800; }
      .pb-timeline-shell { position:relative;grid-column:1/-1;border:1px solid #243a35;background:rgba(13,24,23,.72); }.pb-timeline-line { position:absolute;left:5%;right:5%;top:50%;height:4px;background:#2a3d37; }.pb-timeline-line>i { display:block;width:100%;height:4px;background:var(--accent);transform-origin:left; }.pb-timeline-line>span { position:absolute;top:50%;width:24px;height:24px;border:5px solid #07100f;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%); }.pb-milestone { position:absolute;width:210px;display:flex;flex-direction:column;opacity:0; }.pb-milestone.above { bottom:54%; }.pb-milestone.below { top:54%; }.pb-milestone>i { width:14px;height:14px;border:3px solid #07100f;border-radius:50%;margin:0 auto 12px; }.pb-milestone.below>i { order:-1; }.pb-milestone time { color:var(--accent);font-size:13px;font-weight:900; }.pb-milestone strong { margin-top:6px;font-size:20px;line-height:1.05; }.pb-milestone p { margin:8px 0 0;color:#8b9792;font-size:13px;line-height:1.35; }.pb-timeline-chapters .pb-timeline-line { top:auto;bottom:56px; }.pb-timeline-chapters .pb-milestone { width:225px;padding:18px;border:1px solid #365048;background:#0d1817; }.pb-timeline-chapters .pb-milestone.above,.pb-timeline-chapters .pb-milestone.below { top:76px;bottom:auto; }.pb-timeline-chapters .pb-milestone>i { margin:0 0 12px; }.pb-timeline-live { position:absolute;right:28px;bottom:26px;padding:18px 20px;border:1px solid #365048;background:#07100f;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;align-items:center; }.pb-timeline-live span { grid-row:1/3;color:#87928e;font-size:13px;font-weight:900; }.pb-timeline-live strong { font-size:22px; }.pb-timeline-live time { color:var(--accent);font-size:15px;font-weight:900; }
      .pb-kpi-card small { color:#8b9792; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      <section id="plotbeat-scene" class="scene clip" data-start="0" data-duration="18" data-track-index="1"></section>
      <audio id="background-music" src="./assets/audio/upbeat-data-loop.mp3" preload="auto" data-start="0" data-duration="18" data-track-index="2" data-volume="0.56" aria-label="Upbeat electronic background music"></audio>
      <section id="transition-overlay" class="clip" data-start="0" data-duration="18" data-track-index="3" data-layout-ignore style="pointer-events:none"><div id="transition-top" class="transition-panel transition-top"></div><div id="transition-bottom" class="transition-panel transition-bottom"></div></section>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      window.PlotbeatStyles.apply(window.HF_VIDEO_SPEC.style);
      const root = document.getElementById("plotbeat-scene");
      const renderProgress = window.PlotbeatScenes.mount(root, window.HF_DATA, window.HF_VIDEO_SPEC);
      renderProgress(0);
      const driver = { progress: 0 };
      const backgroundMusic = document.getElementById("background-music");
      const tl = gsap.timeline({ paused: true });
      tl.set("#transition-top, #transition-bottom", { yPercent: 0 }, 0);
      tl.to("#transition-top", { yPercent: -100, duration: .82, ease: "power3.inOut" }, .22);
      tl.to("#transition-bottom", { yPercent: 100, duration: .82, ease: "power3.inOut" }, .22);
      tl.fromTo(".pb-header", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: .65, ease: "power3.out" }, .72);
      tl.fromTo(".pb-stage", { y: 24 }, { y: 0, duration: .7, ease: "power3.out" }, .84);
      tl.to(driver, { progress: 1, duration: 15.45, ease: "none", onUpdate: () => renderProgress(driver.progress) }, 1.15);
      tl.to("#transition-top", { yPercent: 0, duration: .82, ease: "power3.inOut" }, 17.02);
      tl.to("#transition-bottom", { yPercent: 0, duration: .82, ease: "power3.inOut" }, 17.02);
      tl.fromTo(backgroundMusic, { volume: 0 }, { volume: .56, duration: .8 }, 0);
      tl.to(backgroundMusic, { volume: 0, duration: 1.15 }, 16.85);
      tl.seek(0); window.__timelines.main = tl;
    </script>
  </body>
</html>
