<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f4f0e8; }
      .panel {
        position: absolute; top: 0; height: 1080px; width: 960px;
      }
      .left { left: 0; background: #101010; color: #f4f0e8; }
      .right { left: 960px; background: #f4f0e8; color: #101010; }
      .wipe {
        position: absolute; left: 960px; top: 0; width: 24px; height: 1080px;
        background: #e11d48; z-index: 3;
      }
      .big {
        position: absolute; left: 80px; top: 360px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 140px; font-weight: 700; line-height: 0.9; letter-spacing: -0.03em;
      }
      .right .big { left: 80px; }
      .kicker {
        position: absolute; left: 80px; top: 260px;
        font-family: "Segoe UI", sans-serif; font-size: 24px; letter-spacing: 0.35em; text-transform: uppercase;
      }
      .issue {
        position: absolute; right: 80px; bottom: 80px;
        font-family: "Segoe UI", sans-serif; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="left" class="clip panel left" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="kicker">Editorial · Vol. 04</div>
        <div class="big">Split<br />Story</div>
      </div>
      <div id="right" class="clip panel right" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="kicker" style="color:#be123c">Contrast</div>
        <div class="big">Wipe<br />Reveal</div>
        <div class="issue">UI2V Hero No.14</div>
      </div>
      <div id="wipe" class="clip wipe" data-start="0" data-duration="4.5" data-track-index="2"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#left", { x: -960 });
      gsap.set("#right", { x: 960 });
      gsap.set("#wipe", { scaleY: 0, transformOrigin: "50% 0%" });
      tl.to("#wipe", { scaleY: 1, duration: 0.55, ease: "power3.in" }, 0.1)
        .to("#left", { x: 0, duration: 0.9, ease: "power3.out" }, 0.45)
        .to("#right", { x: 0, duration: 0.9, ease: "power3.out" }, 0.45)
        .to("#wipe", { scaleY: 0.08, y: 500, duration: 0.7, ease: "power2.inOut" }, 1.3)
        .to("#left .big", { y: -12, duration: 2.2, ease: "sine.inOut" }, 1.6)
        .to("#right .big", { y: 12, duration: 2.2, ease: "sine.inOut" }, 1.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
