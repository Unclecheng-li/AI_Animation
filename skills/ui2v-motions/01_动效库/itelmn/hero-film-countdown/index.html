<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050505; }
      .frame {
        position: absolute; inset: 80px; border: 18px solid #111;
        box-shadow: inset 0 0 0 4px #222, 0 0 0 1px #333;
        background: #000;
      }
      .num {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        font-family: "Segoe UI", sans-serif; font-weight: 800; font-size: 420px;
        color: #f5f5f5; letter-spacing: -0.06em;
      }
      .ring {
        position: absolute; left: 50%; top: 46%; width: 520px; height: 520px;
        margin: -260px 0 0 -260px; border-radius: 50%;
        border: 8px solid rgba(239, 68, 68, 0.85);
      }
      .caption {
        position: absolute; left: 0; right: 0; bottom: 140px; text-align: center;
        font-family: "Segoe UI", sans-serif; font-size: 28px; letter-spacing: 0.4em;
        text-transform: uppercase; color: #a3a3a3;
      }
      .perf {
        position: absolute; left: 140px; top: 0; bottom: 0; width: 28px;
        background: repeating-linear-gradient(#111 0 18px, #333 18px 36px);
      }
      .perf.r { left: auto; right: 140px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="perfL" class="clip perf" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="perfR" class="clip perf r" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="frame" class="clip frame" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="ring" id="ring"></div>
        <div class="num" id="num">3</div>
      </div>
      <div id="caption" class="clip caption" data-start="0" data-duration="4.5" data-track-index="3">Film Countdown · Stand by</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#perfL", "#perfR", "#frame", "#caption"], { opacity: 0 });
      gsap.set("#num", { scale: 0.6, opacity: 0 });
      gsap.set("#ring", { scale: 0.7, opacity: 0, transformOrigin: "50% 50%" });
      tl.to(["#perfL", "#perfR"], { opacity: 1, duration: 0.35 }, 0.1)
        .to("#frame", { opacity: 1, duration: 0.35 }, 0.2)
        .to("#caption", { opacity: 1, duration: 0.35 }, 0.3)
        .to("#ring", { opacity: 1, scale: 1, duration: 0.35 }, 0.45)
        .to("#num", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.45)
        .to("#ring", { rotation: 120, duration: 1.0, ease: "none" }, 0.55)
        .add(() => { document.getElementById("num").textContent = "2"; }, 1.55)
        .to("#num", { scale: 0.7, duration: 0.12, yoyo: true, repeat: 1 }, 1.55)
        .to("#ring", { rotation: 240, duration: 1.0, ease: "none" }, 1.55)
        .add(() => { document.getElementById("num").textContent = "1"; }, 2.55)
        .to("#num", { scale: 0.7, duration: 0.12, yoyo: true, repeat: 1 }, 2.55)
        .to("#ring", { rotation: 360, duration: 1.0, ease: "none" }, 2.55)
        .add(() => { document.getElementById("num").textContent = "0"; }, 3.55)
        .to("#num", { scale: 1.2, opacity: 0.2, duration: 0.55, ease: "power2.out" }, 3.55)
        .to("#caption", { opacity: 0.4, duration: 0.4 }, 3.7);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
