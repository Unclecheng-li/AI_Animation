<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0d14; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(145deg, #111827 0%, #0a0d14 60%, #172554 100%);
      }
      .stat {
        position: absolute; left: 140px; top: 300px; color: #f8fafc;
        font-family: "Segoe UI", sans-serif; letter-spacing: -0.05em;
      }
      .num {
        font-size: 220px; font-weight: 800; line-height: 0.9;
        background: linear-gradient(90deg, #67e8f9, #a78bfa);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .label { margin-top: 24px; font-size: 42px; font-weight: 600; color: rgba(226, 232, 240, 0.88); }
      .chip {
        position: absolute; right: 180px; top: 360px; padding: 28px 36px; border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.35); background: rgba(15, 23, 42, 0.55);
        color: #e2e8f0; font-family: "Segoe UI", sans-serif; font-size: 28px; line-height: 1.5;
        min-width: 420px;
      }
      .eyebrow { position: absolute; left: 140px; top: 220px; font-family: "Segoe UI", sans-serif;
        font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(103, 232, 249, 0.85); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="eyebrow" class="clip eyebrow" data-start="0" data-duration="4.5" data-track-index="0">UI2V · Metrics</div>
      <div id="stat" class="clip stat" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="num" id="num">0</div>
        <div class="label">motions published this week</div>
      </div>
      <div id="chip" class="clip chip" data-start="0" data-duration="4.5" data-track-index="2">
        Live registry growth<br />HyperFrames compositions · MIT-0
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { value: 0 };
      const numEl = document.getElementById("num");
      gsap.set("#eyebrow", { opacity: 0, y: 12 });
      gsap.set("#stat", { opacity: 0, y: 28 });
      gsap.set("#chip", { opacity: 0, x: 40 });
      tl.to("#eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.15)
        .to("#stat", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to(counter, {
          value: 128,
          duration: 2.2,
          ease: "power2.out",
          onUpdate: () => { numEl.textContent = String(Math.round(counter.value)); },
        }, 0.55)
        .to("#chip", { opacity: 1, x: 0, duration: 0.65, ease: "power2.out" }, 1.2)
        .to("#num", { scale: 1.04, duration: 1.2, ease: "sine.inOut", transformOrigin: "0% 50%" }, 2.8);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
