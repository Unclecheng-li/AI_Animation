============================================================= -->
<script>
/* ===== [不动] 播放器引导：劫持 performance.now/rAF 成虚拟时钟 ===== */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();};
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>

<script>
/* ===== [不动] SFX 引擎 ===== */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';var f=330+Math.random()*90;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);
    env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);
  }
  function whoosh(durS,vol){
    if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
    bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);
  }
  function swipe(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;
    bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);
    var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);
  }
  function type(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=1400+Math.random()*900;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;
    env(g,t,0.004,0.1*vol,0.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);
  }
  function ding(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime;
    [[660,0.2],[990,0.09]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];
      env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);
    });
  }
  function thud(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);
  }
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#111;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
body.paused *{animation-play-state:paused!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);overflow:hidden;background:#070b14}
#cam{position:absolute;inset:0;transform-origin:0 0;transform:translate(-38px,-29px) scale(1.05);transition:transform var(--cd,1.4s) cubic-bezier(.16,1,.3,1);z-index:10}

   虚拟机外壳（三页统一·勿改）
   ──────────────────────────────────────────────── */
#vmwrap{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
#vmwrap.on{opacity:1}
#odesk{position:absolute;inset:0;background:#16366e url("material/w11.jfif") center/cover no-repeat}
#odim{position:absolute;inset:0;background:rgba(3,7,16,.58)}
.oicon{position:absolute;left:34px;width:92px;text-align:center;opacity:.5}

.oicon span{display:inline-block;font-size:12.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);padding:1px 4px}
#otaskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(238,244,252,.55);backdrop-filter:blur(14px);display:flex;align-items:center;opacity:.55}

#vmwin{position:absolute;left:210px;top:82px;width:1500px;height:916px;background:#1b1f26;border:1px solid rgba(255,255,255,.1);border-radius:12px;box-shadow:0 40px 120px rgba(0,0,0,.65),0 4px 18px rgba(0,0,0,.5);overflow:hidden}
.vmtitle{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#232830;color:#dfe5ee;font-size:13px}
.vmbtns{margin-left:auto;display:flex}
.vmbtns i{width:42px;height:28px;display:flex;align-items:center;justify-content:center;color:#9aa4b2}
.vmbtns i svg{width:11px;height:11px}
.vmstatus{height:32px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#171b21;color:#9fe6a0;font-size:12px;border-top:1px solid rgba(255,255,255,.05)}
.vmstatus .dot{width:8px;height:8px;border-radius:50%;background:#3fd35f;box-shadow:0 0 8px #3fd35f}
.vmstatus .dot.warn{background:#ffb900;box-shadow:0 0 8px #ffb900}
.vmstatus .vact{margin-left:auto;display:flex;gap:8px}
.vmstatus .vbtn{font-size:12px;color:#c8d2e0;background:#262d38;border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:3px 12px}
.vmscreen{position:relative;width:1500px;height:844px;background:#000;overflow:hidden}
.vguest{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(.78125);transform-origin:0 0;overflow:hidden}
/* 客机桌面（青调，区别于外层） */
.gwall{position:absolute;inset:0;background:#0e3a5f url("material/w11.jfif") center/cover no-repeat;filter:hue-rotate(-28deg) brightness(.88)}
.gicon{position:absolute;left:34px;width:92px;text-align:center}
.gicon .dic{width:46px;height:46px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}

#gtaskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(238,244,252,.85);backdrop-filter:blur(18px);z-index:36;display:flex;align-items:center;box-shadow:0 -1px 0 rgba(0,0,0,.08)}

#gcur.show{opacity:1}

@keyframes curClick{45%{transform:scale(.82)}}

/* ────────────────────────────────────────────────
   本页 · 黑屏重启 / 蓝色自动修复 / 安全提示
   ──────────────────────────────────────────────── */
#gBlack{position:absolute;inset:0;background:#000;z-index:40;opacity:0;transition:opacity .35s ease;pointer-events:none}
#gBlack.on{opacity:1}
#gBlack .bkspin{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%)}
#gBlack .bklabel{position:absolute;left:0;right:0;top:calc(60% + 52px);text-align:center;font-size:17px;color:#cfd6de}
/* 转圈点 */
.wdots{position:relative;width:64px;height:64px;animation:gspin 1.3s linear infinite}
.wdots i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff}
.wdots i:nth-child(1){transform:rotate(0deg) translateY(-26px)}
.wdots i:nth-child(2){transform:rotate(60deg) translateY(-26px);opacity:.85}
.wdots i:nth-child(3){transform:rotate(120deg) translateY(-26px);opacity:.7}
.wdots i:nth-child(4){transform:rotate(180deg) translateY(-26px);opacity:.55}
.wdots i:nth-child(5){transform:rotate(240deg) translateY(-26px);opacity:.4}
.wdots i:nth-child(6){transform:rotate(300deg) translateY(-26px);opacity:.25}
@keyframes gspin{to{transform:rotate(360deg)}}
/* 蓝色自动修复页（Windows RE 蓝 #0078D7） */
#gRE{position:absolute;inset:0;background:#0078D7;z-index:40;opacity:0;transition:opacity .3s ease;pointer-events:none}

.rebtn{min-width:150px;text-align:center;font-size:15px;color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.55);padding:11px 26px}
.rebtn.hot{background:rgba(0,0,0,.48)}
/* 全屏黑场安全提示 */
#safe{position:absolute;inset:0;background:#000;z-index:24;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
#safe.on{opacity:1}
#safe .wtri{opacity:0;transform:scale(.7);transition:all .7s cubic-bezier(.2,1.3,.4,1) .15s}
#safe .l1{margin-top:36px;font-size:52px;font-weight:900;color:#fff;letter-spacing:6px;opacity:0;transform:translateY(14px);transition:all .8s ease .3s}
#safe .rule{width:130px;height:2px;background:rgba(255,255,255,.25);margin-top:34px;opacity:0;transition:opacity .8s ease .5s}
#safe .l2{margin-top:30px;font-size:31px;font-weight:800;color:#ffb900;letter-spacing:5px;opacity:0;transform:translateY(14px);transition:all .8s ease .1s}
#safe.on .wtri,#safe.on .l1{opacity:1;transform:none}
#safe.on .rule{opacity:1}
#safe.on2 .l2{opacity:1;transform:none}

/* ───── 安安（#stage 直属，#cam 外）───── */
#anan{position:absolute;left:-6px;bottom:0;width:390px;z-index:28;opacity:0;transition:opacity .9s ease;filter:drop-shadow(0 14px 30px rgba(2,10,30,.45))}

#anan img{width:100%;display:block;animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-12px)}}

#anan .say::after{content:'';position:absolute;left:24px;bottom:-18px;border:9px solid transparent;border-top:11px solid #fff}
#anan .say b{color:#c42b1c}
#anan.show .say{opacity:1;transform:scale(1);transition-delay:.45s}

/* ───── 底盘区（不动）───── */
.corner{position:absolute;font-family:"Cascadia Mono","Consolas",monospace;font-size:15px;color:rgba(255,255,255,.92);letter-spacing:2px;z-index:37;text-shadow:0 1px 4px rgba(8,24,60,.8),0 0 3px rgba(8,24,60,.6);padding:3px 9px;border-radius:6px;background:rgba(8,20,46,.45)}

#hud button{pointer-events:auto;background:transparent;border:1px solid #999;color:#ccc;font-family:inherit;font-size:12px;padding:3px 14px;margin-left:8px;border-radius:3px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.12)}
#replay.done{animation:pulse 1.2s infinite;border-color:#ffd23f;color:#ffd23f}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,210,63,.8)}}
</style>

<script>
/* ===== [不动] 时间轴引擎 ===== */
const DUR=27000;
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const after=(ms,f)=>on(performance.now()-t0+ms,f);
function fly(el,x1,y1,x2,y2,dur,arc,ease,done){tws.push({t:performance.now()-t0,d:dur,e:ease||eio,done,f:p=>{el.style.left=(x1+(x2-x1)*p)+'px';el.style.top=(y1+(y2-y1)*p-Math.sin(p*Math.PI)*(arc||0))+'px'}})}
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}

/* ────────────────────────────────────────────────
   镜头 05 cue · 1:58–2:25「自动修复 → 安全提示」
   ──────────────────────────────────────────────── */
const cur=$('#gcur');
function curTo(x,y,dur,arc){const l=parseFloat(cur.style.left)||1700,t=parseFloat(cur.style.top)||900;fly(cur,l,t,x,y,dur,arc||26)}
function clickFx(){cur.classList.remove('click');void cur.offsetWidth;cur.classList.add('click')}
function setPhase(t){$('#rePhase').textContent=t}
function reShow(phase){ // 蓝色页：先转圈，再出正文
  $('#gRE').classList.add('on');$('#reBody').classList.remove('show');
  $('#reLoad').style.display='block';setPhase(phase);
}
function reBodyIn(){$('#reLoad').style.display='none';$('#reBody').classList.add('show')}

on(100,()=>$('#vmwrap').classList.add('on'));
on(300,()=>camTo(0,0,1,1.4));                                        // 开场拉镜
on(1800,()=>{                                                         // (1:58) 重启试一下
  $('#gBlack').classList.add('on');$('#bkLabel').textContent='正在重新启动';
  $('#vstat1').textContent='重新启动中';$('#vstat2').textContent='';__sfx.thud(.55);
});
on(4400,()=>{                                                         // (2:00) 进入蓝色自动修复
  $('#gBlack').classList.remove('on');reShow('正在准备自动修复');
  $('#vstat1').textContent='运行中';$('#vstat2').textContent='自动修复';__sfx.pop(.4);
});
on(6000,()=>{reBodyIn();__sfx.pop(.5)});                              // (2:02) 无法修复你的电脑 —— 定格开始
on(6200,()=>camFocus(960,576,1.05,3.0));                              // 缓慢推近（定格 5s）
on(7200,()=>{cur.classList.add('show');curTo(849,579,600)});          // (2:04) 再关机重启
on(7600,()=>$('#btnOff').classList.add('hot'));
on(8000,()=>{                                                         // (2:04) 又重启好几次
  clickFx();__sfx.type(.5);$('#btnOff').classList.remove('hot');after(700,()=>cur.classList.remove('show'));
  $('#gRE').classList.remove('on');$('#gBlack').classList.add('on');
  $('#bkLabel').textContent='正在重新启动';$('#vstat1').textContent='重新启动中';$('#vstat2').textContent='';__sfx.thud(.5);
});
on(8800,()=>{                                                         // 再次回到蓝色页
  $('#gBlack').classList.remove('on');reShow('正在诊断你的电脑');
  $('#vstat1').textContent='运行中';$('#vstat2').textContent='自动修复';
});
on(10200,()=>{reBodyIn();__sfx.pop(.4)});                             // (2:06) 仍是同屏 = 起不来
on(15200,()=>{                                                        // (2:14) 收尾拉出
  camTo(77,43,0.92,2.0);
});
on(18500,()=>{                                                        // (2:17) 安安严肃定场「系统文件夹真不能乱删」
  const a=$('#anan');a.querySelector('.say').innerHTML='系统文件夹，<b>真不能乱删</b>。';
  a.querySelector('img').src='anan - emotion rename/15_平举素纸_认真以待.png';
  a.classList.add('show');__sfx.pop(.45);
});
on(22200,()=>{$('#safe').classList.add('on');__sfx.ding(.4)});        // (2:21) 虚拟机声明上
on(25000,()=>{$('#safe').classList.add('on2')});                      // (2:23) 请勿在真实电脑尝试
/* —— 结尾定格在安全提示黑场 —— */
</script>
