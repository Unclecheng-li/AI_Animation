<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      .stage { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      .node {
        position: absolute; width: 28px; height: 28px; margin: -14px; border-radius: 50%;
        background: #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.55);
      }
      .hub {
        position: absolute; width: 64px; height: 64px; margin: -32px; border-radius: 50%;
        background: #f8fafc; box-shadow: 0 0 40px rgba(248,250,252,0.35);
      }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .spoke { stroke: rgba(148,163,184,0.35); stroke-width: 2; fill: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <svg class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <line class="spoke" id="s0" x1="960" y1="540" x2="960" y2="540" />
        <line class="spoke" id="s1" x1="960" y1="540" x2="960" y2="540" />
        <line class="spoke" id="s2" x1="960" y1="540" x2="960" y2="540" />
        <line class="spoke" id="s3" x1="960" y1="540" x2="960" y2="540" />
        <line class="spoke" id="s4" x1="960" y1="540" x2="960" y2="540" />
        <line class="spoke" id="s5" x1="960" y1="540" x2="960" y2="540" />
      </svg>
      <div id="stage" class="clip stage" data-start="0" data-duration="4.5" data-track-index="1" style="left:960px;top:540px">
        <div class="hub" id="hub"></div>
        <div class="node" id="n0"></div><div class="node" id="n1"></div><div class="node" id="n2"></div>
        <div class="node" id="n3"></div><div class="node" id="n4"></div><div class="node" id="n5"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const R = 280;
      const place = (rot) => {
        for (let i = 0; i < 6; i++) {
          const a = (rot + i * 60) * Math.PI / 180;
          const x = Math.cos(a) * R;
          const y = Math.sin(a) * R;
          gsap.set("#n" + i, { x, y });
          const line = document.getElementById("s" + i);
          line.setAttribute("x2", 960 + x);
          line.setAttribute("y2", 540 + y);
        }
      };
      const state = { rot: -40 };
      place(state.rot);
      gsap.set("#hub", { scale: 0, opacity: 0 });
      gsap.set(["#n0","#n1","#n2","#n3","#n4","#n5"], { scale: 0, opacity: 0 });
      gsap.set(".spoke", { opacity: 0 });
      tl.to("#hub", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.2)
        .to(["#n0","#n1","#n2","#n3","#n4","#n5"], { opacity: 1, scale: 1, duration: 0.4, stagger: 0.05 }, 0.5)
        .to(".spoke", { opacity: 1, duration: 0.35 }, 0.8)
        .to(state, {
          rot: 200, duration: 3.0, ease: "power1.inOut",
          onUpdate: () => place(state.rot)
        }, 1.1);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
