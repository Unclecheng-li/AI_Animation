<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0810; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(70% 80% at 65% 40%, #1a1030 0%, #0a0810 70%);
      }
      .blob {
        position: absolute; border-radius: 50%; filter: blur(28px); mix-blend-mode: screen;
      }
      .b1 { left: 980px; top: 220px; width: 520px; height: 520px; background: rgba(244, 114, 182, 0.55); }
      .b2 { left: 1180px; top: 360px; width: 380px; height: 380px; background: rgba(129, 140, 248, 0.5); }
      .b3 { left: 1080px; top: 180px; width: 280px; height: 280px; background: rgba(56, 189, 248, 0.45); }
      .copy { position: absolute; left: 140px; top: 340px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(244, 114, 182, 0.9); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="b1" class="clip blob b1" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="b2" class="clip blob b2" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="b3" class="clip blob b3" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="3">
        <div class="eyebrow">UI2V · Organic</div>
        <div class="title">Ink Bloom</div>
        <div class="sub">Soft blooms that expand into brand color</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#b1","#b2","#b3"], { scale: 0.15, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#copy", { opacity: 0, y: 28 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 24 });
      gsap.set(".sub", { opacity: 0, y: 16 });
      tl.to("#b1", { opacity: 0.95, scale: 1, duration: 1.2, ease: "power2.out" }, 0.1)
        .to("#b2", { opacity: 0.85, scale: 1.1, duration: 1.3, ease: "power2.out" }, 0.3)
        .to("#b3", { opacity: 0.75, scale: 1.25, duration: 1.35, ease: "power2.out" }, 0.45)
        .to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.5)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.5)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.65)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.9)
        .to("#b1", { x: -40, y: 30, duration: 2.4, ease: "sine.inOut" }, 1.5)
        .to("#b2", { x: 50, y: -20, duration: 2.4, ease: "sine.inOut" }, 1.5)
        .to("#b3", { x: -20, y: -35, duration: 2.4, ease: "sine.inOut" }, 1.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
