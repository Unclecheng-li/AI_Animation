window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;

  function whoosh(durS,vol){

const DUR=37000; /* ←⑤ DUR = 分镜时长 37s */
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}
function camCut(tx,ty,s){cam.style.setProperty('--cd','0.001s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}

/* ───────── 本页小工具 ───────── */
/* 打字机：逐字显示命令（节拍动画走 tws，可冻结） */
function typewrite(el,str,start,dur){
  tws.push({t:start,d:dur,e:p=>p,f:p=>{el.textContent=str.slice(0,Math.round(str.length*p))},
    done:()=>{el.textContent=str;}});
  for(let k=0;k<str.length;k++){
    if(str[k]===' ')continue;
    tws.push({t:start+dur*k/str.length,d:1,f:()=>{if(window.__sfx)__sfx.type(.5)}});
  }
}
/* 生成依赖包块（3 列瀑布）· 位置预排，入场由 cue 驱动的 tws 补间（冻结态正确） */
var PKGS=[];
(function(){
  var fs=$('#fstage'),W=fs.clientWidth||556,cols=3,cw=W/cols;
  var names=['typer','rich','httpx','pydantic','openai','click','toml','tenacity','anyio','colorama','pygments','requests','urllib3','certifi','idna','sniffio','jiter','tqdm','packaging','annotated-types','pydantic-core','typing-ext','markdown-it','pyyaml','shellingham','typing-insp'];
  var perCol=Math.ceil(names.length/cols),y0=10,gap=42;
  for(var i=0;i<names.length;i++){
    var c=i%cols,row=Math.floor(i/cols);
    var d=document.createElement('div');d.className='pk'+(i%3===1?' b':(i%3===2?' c':''));
    var ty=y0+row*gap; if(ty<16)ty=16;
    if(ty>560)continue;
    d.style.left=Math.round((c*cw)+(cw-150)/2)+'px';
    d.innerHTML='<i></i>'+names[i];
    fs.appendChild(d);
    PKGS.push({el:d,ty:ty,delay:i*80});
  }
})();
/* 计数 */
function cnt(el,from,to,dur,start){
  tws.push({t:start,d:dur,e:eo,f:p=>{el.textContent=Math.round(from+(to-from)*p)}});
}

/* ───────── 镜头 0-46 叙事 cue（19:50–20:27 · 37s） ───────── */
on(150,()=>{$('#head').classList.add('in');__sfx.whoosh(.7,.4);});                 // 19:50「接下来我们正式安装VulnClaw」
on(1000,()=>{$('#plan').classList.add('in');__sfx.pop(.5);});                       // 19:51「它的安装方法就一条命令」
on(4000,()=>{$('#board').classList.add('in');$('#term').classList.add('in');$('#cur').classList.add('on');__sfx.pop(.55);}); // 19:54「我们依旧打开命令提示符」
on(6000,()=>{typewrite($('#cmdtext'),'pip install vulnclaw',6000,1500);});          // 19:56「然后输入pip install vulnclaw」
on(8000,()=>{$('#pipchip').classList.add('in');__sfx.pop(.45);});                   // 19:58「这个pip是Python自带的包安装器」
on(11000,()=>{$('#fall').classList.add('in');__sfx.swipe(.6);});                    // 20:01「这条命令它会从官方仓库里」
on(13000,()=>{__sfx.whoosh(.9,.6);
  PKGS.forEach(function(pk){
    tws.push({t:13000+pk.delay,d:520,e:eo,f:p=>{
      pk.el.style.transform='translateY('+(-70+(pk.ty+70)*p).toFixed(1)+'px)';
      pk.el.style.opacity=Math.min(1,p*3);}});
  });
  tws.push({t:13000,d:3200,e:eo,f:p=>{$('#pkgcnt').textContent=Math.round(50*p)},
    done:()=>{$('#pkgcnt').textContent='50+';}});});                                // 20:03「把VulnClaw和它需要依赖一起下载安装好」
on(15000,()=>{$('#prog').style.opacity=1;$('#progtx').classList.add('in');
  [['e1',0],['e2',260],['e3',520],['e4',780],['e5',1040],['e6',1320],['e7',1620],['e8',1940]].forEach(function(r){
    tws.push({t:15000+r[1],d:1,f:function(){document.getElementById(r[0]).classList.add('in')}});
  });
  tws.push({t:15000,d:3400,f:p=>{$('#progbar').style.width=(p*100)+'%'}});__sfx.swipe(.5);}); // 20:05「接下来它滚动一堆进度之后」
on(17000,()=>{$('#banner').classList.add('in');__sfx.thud(1);camFocus(560,470,1.06,.55);}); // 20:07「就可以看到Successfully installed」
on(20000,()=>{__sfx.ding(.55);});                                                   // 20:10「就完成了」
on(21000,()=>{$('#strip').classList.add('in');__sfx.pop(.45);camTo(0,0,1,.5);});    // 20:11「这里多说一句依赖」
on(24000,()=>{$('#cDep').classList.add('hot');__sfx.pop(.4);});                     // 20:14「一个工具装下还可以带出几十个包」
on(26000,()=>{$('#cDep').innerHTML='一个工具 · 一次实测 <b>50+ 个包</b>';__sfx.ding(.5);}); // 20:16「实测一次要装50多个」
on(29000,()=>{$('#cWarn').classList.add('hot');__sfx.thud(.9);camFocus(1500,980,1.05,.45);}); // 20:19「千万不要装在你自己的真机上面」
on(31000,()=>{$('#cVM').classList.add('hot');__sfx.ding(.55);});                    // 20:21「一定要装在虚拟机里」
on(33500,()=>{camTo(0,0,1,.6);});                                                   // 20:22「保证宿主机环境不乱」
on(21000,()=>{$('#fish').classList.add('in');__sfx.pop(.5);
  tws.push({t:35000,d:1,f:()=>{$('#fish').classList.add('bub');__sfx.pop(.4);}});}); // 20:25「这就是前面铺垫隔离的作用」（鱼提前在场）

/* ===== [不动] QA 专用 ===== */
(function(){
  var m=/t=(\d+)/.exec(location.hash||'');
  if(!m)return;
  var MS=+m[1];
  var st=document.createElement('style');st.textContent='*{transition:none!important}';
  var orig=window.__startPlayback;
  window.__startPlayback=function(){
    orig();
    t0=performance.now()-MS;
    tick(performance.now());
    paused=true;document.body.classList.add('paused');document.head.appendChild(st);
  };
})();
</script>
</body>
