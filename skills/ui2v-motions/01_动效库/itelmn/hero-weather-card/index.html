<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #93c5fd; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(180deg, #7dd3fc 0%, #bfdbfe 45%, #eff6ff 100%);
      }
      .brand {
        position: absolute; left: 160px; top: 100px;
        font-family: Georgia, serif; font-size: 56px; color: #1e3a8a;
      }
      .card {
        position: absolute; left: 560px; top: 200px; width: 800px; height: 680px;
        border-radius: 44px; padding: 56px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 30px 80px rgba(30, 64, 175, 0.18);
        font-family: "Segoe UI", sans-serif; color: #0f172a;
        overflow: hidden;
      }
      .city {
        font-size: 28px; letter-spacing: 0.2em; text-transform: uppercase; color: #2563eb;
      }
      .sun {
        position: absolute; left: 90px; top: 170px; width: 170px; height: 170px; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #fef9c3, #fbbf24 55%, #f59e0b);
        box-shadow: 0 0 60px rgba(251, 191, 36, 0.55);
      }
      .cloud {
        position: absolute; left: 220px; top: 230px; width: 210px; height: 86px; border-radius: 999px;
        background: #fff;
        box-shadow: 48px 8px 0 #fff, -42px 18px 0 #fff, 0 18px 30px rgba(148, 163, 184, 0.25);
      }
      .temp {
        position: absolute; left: 56px; bottom: 150px;
        font-size: 148px; font-weight: 700; letter-spacing: -0.05em; line-height: 1;
      }
      .unit { font-size: 56px; font-weight: 600; color: #64748b; margin-left: 4px; }
      .cond {
        position: absolute; left: 56px; bottom: 70px; font-size: 30px; color: #475569;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="brand" class="clip brand" data-start="0" data-duration="4.5" data-track-index="0">Weather Card</div>
      <div id="card" class="clip card" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="city">Shanghai</div>
        <div class="sun" id="sun"></div>
        <div class="cloud" id="cloud"></div>
        <div class="temp"><span id="num">18</span><span class="unit">°</span></div>
        <div class="cond">Clear · perfect render day</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { v: 18 };
      const num = document.getElementById("num");
      gsap.set("#brand", { opacity: 0, y: 16 });
      gsap.set("#card", { opacity: 0, y: 48, scale: 0.94 });
      gsap.set("#sun", { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#cloud", { opacity: 0, x: -36 });
      tl.to("#brand", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to("#card", { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" }, 0.25)
        .to("#sun", { opacity: 1, scale: 1, duration: 0.75, ease: "back.out(1.7)" }, 0.7)
        .to("#cloud", { opacity: 1, x: 0, duration: 0.65, ease: "power2.out" }, 1.05)
        .to(counter, {
          v: 26,
          duration: 1.9,
          ease: "power2.out",
          onUpdate: () => { num.textContent = String(Math.round(counter.v)); },
        }, 1.25)
        .to("#cloud", { x: 36, duration: 2.0, ease: "sine.inOut" }, 2.2)
        .to("#sun", { scale: 1.06, duration: 1.8, ease: "sine.inOut" }, 2.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
