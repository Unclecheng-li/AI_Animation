<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Make the Most of Your Trial"},
  {"id":"steps","type":"string","label":"Steps (JSON)","default":"[{\"num\":\"1\",\"heading\":\"Schedule Dedicated Time\",\"body\":\"Block 2-3 hours on your calendar this week to explore the platform. Treat it like a real project deadline. Without dedicated time, the trial period slips away before you have properly evaluated the tools.\"},{\"num\":\"2\",\"heading\":\"Build Something Real\",\"body\":\"Do not just click through templates. Import a real project — a course you need to build, a presentation you have been putting off. Using your own content reveals whether the tool fits your actual workflow.\"},{\"num\":\"3\",\"heading\":\"Join the Community\",\"body\":\"The user community is one of the most valuable resources. Browse the forums, watch community-created tutorials, and see how others solve problems similar to yours.\"},{\"num\":\"4\",\"heading\":\"Test Collaboration Features\",\"body\":\"If you work in a team, invite a colleague to review a project. Test the feedback workflow, version history, and sharing options. The tool is only as good as how well your team can use it together.\"}]"},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStep","type":"number","label":"Seconds per Step","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #285f9f; --bg: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body { width: 1920px; height: 1080px; background-color: var(--bg); background-image: var(--base-plate); background-size: 1920px 1080px; background-position: 0 0; background-repeat: no-repeat; font-family: 'Inter', Arial, Helvetica, sans-serif; overflow: hidden; position: relative; }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; display: flex; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .steps-col { width: 720px; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 80px 60px; gap: 20px; flex-shrink: 0; }
    .step { display: flex; align-items: center; gap: 18px; opacity: 0; }
    .step-num { width: 48px; height: 48px; border-radius: 12px; background: rgba(40,95,159,0.15); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
    .step-label { font-size: 20px; font-weight: 600; color: #5a6e78; }
    .info-col { flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px; }
    .info-card { background: #fffdfa; border-radius: 18px; padding: 54px 72px; max-width: 900px; min-height: 318px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.06); opacity: 0; overflow: visible; }
    .info-inner { position: relative; min-height: 220px; overflow: visible; }
    .info-block { position: absolute; inset: 0; opacity: 0; overflow: visible; padding-top: 92px; }
    .info-block:first-child { position: relative; opacity: 1; }
    .i-num { position: absolute; top: 0; left: 0; font-size: 78px; font-weight: 800; color: #d9534e; opacity: 1; line-height: 1; z-index: 1; }
    .i-head { position: relative; z-index: 2; font-size: 36px; font-weight: 700; color: var(--primary); margin: 0 0 20px; }
    .i-body { position: relative; z-index: 2; font-size: 21px; line-height: 1.62; color: #5a6e78; max-width: 760px; }
  </style>
</head>
<body>
  <div data-composition-id="trial-flow" data-width="1920" data-height="1080" data-duration="16" data-start="0">
    <div id="el-fade"></div>
    <div class="steps-col" id="stepsCol"></div>
    <div class="info-col">
      <div class="info-card" id="infoCard">
        <div class="info-inner" id="infoInner"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var steps = JSON.parse(vars.steps || '[]');
      var pc = vars.primaryColor || '#285f9f';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var dur = Number(vars.durationPerStep) || 4;
      document.documentElement.style.setProperty('--primary', pc);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');

      var stepsCol = document.getElementById('stepsCol');
      var infoInner = document.getElementById('infoInner');
      var numEls = [], labelEls = [], infoPanels = [];

      steps.forEach(function(s, i) {
        var el = document.createElement('div'); el.className = 'step';
        el.innerHTML = '<div class="step-num">' + s.num + '</div><div class="step-label">' + s.heading + '</div>';
        stepsCol.appendChild(el);
        numEls.push(el.querySelector('.step-num'));
        labelEls.push(el.querySelector('.step-label'));

        var panel = document.createElement('div');
        panel.className = 'info-block';
        panel.innerHTML = '<div class="i-num">' + s.num + '</div><div class="i-head">' + s.heading + '</div><div class="i-body">' + s.body + '</div>';
        if (i === 0) { panel.style.position = 'relative'; panel.style.opacity = '1'; }
        infoInner.appendChild(panel); infoPanels.push(panel);
        if (i !== 0) gsap.set(panel, { opacity: 0 });
      });

      gsap.set(numEls[0], { backgroundColor: pc, color: '#fff', scale: 1.12 });
      gsap.set(labelEls[0], { color: pc });

      var TOTAL = steps.length * dur + 1;
      var tl = gsap.timeline({ paused: true });
      tl.to('.step', { opacity: 1, x: -20, duration: 0.3, stagger: 0.12, ease: 'power2.out' }, 0);
      tl.to('#infoCard', { opacity: 1, x: -20, duration: 0.5 }, 0.6);

      for (var i = 1; i < steps.length; i++) {
        (function(idx) {
          var t = idx * dur;
          var prev = idx - 1;
          tl.to(infoPanels[prev], { opacity: 0, duration: 0.2 }, t);
          tl.to(infoPanels[idx], { opacity: 1, duration: 0.4, ease: 'power2.out' }, t + 0.25);
          tl.to(numEls[prev], { backgroundColor: 'rgba(40,95,159,0.15)', color: pc, scale: 1, duration: 0.25 }, t);
          tl.to(numEls[idx], { backgroundColor: pc, color: '#fff', scale: 1.12, duration: 0.3 }, t + 0.1);
          tl.to(labelEls[prev], { color: '#5a6e78', duration: 0.2 }, t);
          tl.to(labelEls[idx], { color: pc, duration: 0.2 }, t + 0.1);
          tl.to('#infoCard', { scale: 0.97, duration: 0.12 }, t + 0.1);
          tl.to('#infoCard', { scale: 1, duration: 0.45, ease: 'back.out(1.3)' }, t + 0.22);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="trial-flow"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['trial-flow'] = tl;
    </script>
  </div>
</body>
</html>
