<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fafaf9; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #fafaf9;
      }
      .brand {
        position: absolute; left: 140px; top: 100px;
        font-family: "Segoe UI", sans-serif; font-size: 22px; letter-spacing: 0.3em;
        text-transform: uppercase; color: #a8a29e; font-weight: 600;
      }
      .title {
        position: absolute; left: 140px; top: 160px;
        font-family: Georgia, "Times New Roman", serif; font-size: 84px; color: #1c1917;
        letter-spacing: -0.03em;
      }
      .sub {
        position: absolute; left: 140px; top: 280px;
        font-family: "Segoe UI", sans-serif; font-size: 28px; color: #78716c; max-width: 520px;
      }
      .search {
        position: absolute; left: 140px; top: 400px; width: 1640px;
      }
      .field {
        height: 96px; background: #fff; border: 2px solid #d6d3d1; border-radius: 20px;
        display: flex; align-items: center; padding: 0 36px; gap: 20px;
        box-shadow: 0 16px 40px rgba(28, 25, 23, 0.06);
      }
      .field.focus { border-color: #0f766e; box-shadow: 0 0 0 6px rgba(15, 118, 110, 0.12), 0 16px 40px rgba(28,25,23,0.06); }
      .ico { width: 28px; height: 28px; border: 3px solid #78716c; border-radius: 50%; position: relative; }
      .ico::after {
        content: ""; position: absolute; width: 12px; height: 3px; background: #78716c;
        right: -10px; bottom: -4px; transform: rotate(45deg); border-radius: 2px;
      }
      .query {
        font-family: "Segoe UI", sans-serif; font-size: 34px; color: #1c1917; flex: 1;
      }
      .caret {
        width: 3px; height: 36px; background: #0f766e; margin-left: 4px;
      }
      .results {
        margin-top: 18px; background: #fff; border-radius: 20px; border: 1px solid #e7e5e4;
        overflow: hidden; box-shadow: 0 20px 50px rgba(28, 25, 23, 0.08);
      }
      .hit {
        padding: 28px 36px; border-bottom: 1px solid #f5f5f4;
        font-family: "Segoe UI", sans-serif; display: flex; justify-content: space-between; align-items: center;
      }
      .hit:last-child { border-bottom: 0; }
      .hit strong { font-size: 28px; color: #1c1917; }
      .hit span { font-size: 22px; color: #a8a29e; }
      .hit em { font-style: normal; color: #0f766e; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="brand" class="clip brand" data-start="0" data-duration="4.5" data-track-index="0">Discover · Query</div>
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="1">Search Focus</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="4.5" data-track-index="2">Type, focus the field, and surface matching motions.</div>
      <div id="search" class="clip search" data-start="0" data-duration="4.5" data-track-index="3">
        <div class="field" id="field">
          <div class="ico"></div>
          <div class="query" id="query"></div>
          <div class="caret" id="caret"></div>
        </div>
        <div class="results" id="results">
          <div class="hit" id="h1"><strong>hero-<em>progress</em>-ring</strong><span>onboarding</span></div>
          <div class="hit" id="h2"><strong>hero-<em>toast</em>-stack</strong><span>feedback</span></div>
          <div class="hit" id="h3"><strong>hero-<em>deploy</em>-pipeline</strong><span>ci / cd</span></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const query = document.getElementById("query");
      const field = document.getElementById("field");
      const full = "progress";
      gsap.set(["#brand", "#title", "#sub"], { opacity: 0, y: 12 });
      gsap.set("#search", { opacity: 0, y: 20 });
      gsap.set(["#h1", "#h2", "#h3"], { opacity: 0, y: 10 });
      gsap.set("#results", { opacity: 0, height: 0 });
      gsap.set("#caret", { opacity: 1 });
      tl.to("#brand", { opacity: 1, y: 0, duration: 0.35 }, 0.08)
        .to("#title", { opacity: 1, y: 0, duration: 0.4 }, 0.18)
        .to("#sub", { opacity: 1, y: 0, duration: 0.4 }, 0.3)
        .to("#search", { opacity: 1, y: 0, duration: 0.5 }, 0.45)
        .to({}, {
          duration: 0.01,
          onStart: () => { field.classList.add("focus"); }
        }, 0.9)
        .to({}, {
          duration: 1.1,
          ease: "none",
          onUpdate: function () {
            const n = Math.floor(this.progress() * full.length);
            query.textContent = full.slice(0, n);
          }
        }, 1.0)
        .to("#results", { opacity: 1, height: 228, duration: 0.45, ease: "power2.out" }, 2.2)
        .to("#h1", { opacity: 1, y: 0, duration: 0.35 }, 2.35)
        .to("#h2", { opacity: 1, y: 0, duration: 0.35 }, 2.5)
        .to("#h3", { opacity: 1, y: 0, duration: 0.35 }, 2.65)
        .to("#caret", { opacity: 0, duration: 0.2, yoyo: true, repeat: 3 }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
