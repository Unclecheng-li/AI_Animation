<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050505;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-one-brief"
        class="scene"
        data-composition-id="01-one-brief"
        data-composition-src="compositions/frames/01-one-brief.html"
        data-start="0"
        data-duration="2.2"
        data-track-index="0"
      ></div>

      <div
        id="el-02-accountable-workflow"
        class="scene"
        data-composition-id="02-accountable-workflow"
        data-composition-src="compositions/frames/02-accountable-workflow.html"
        data-start="2.2"
        data-duration="2.8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-visible-work"
        class="scene"
        data-composition-id="03-visible-work"
        data-composition-src="compositions/frames/03-visible-work.html"
        data-start="5"
        data-duration="3.38"
        data-track-index="0"
      ></div>

      <div
        id="el-04-trusted-output"
        class="scene"
        data-composition-id="04-trusted-output"
        data-composition-src="compositions/frames/04-trusted-output.html"
        data-start="8.2"
        data-duration="3.8"
        data-track-index="1"
      ></div>

      <video id="f01-one-brief-context-video" src="assets/stock/source/pexels-30185573-hands-laptop-landscape.mp4" preload="auto" data-media-start="4.4" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover;z-index:1"
        data-start="0"
        data-duration="0.72"
        data-track-index="1001"
      ></video>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/audio/framepilot-original-bed-12s.wav"
        data-start="0"
        data-duration="12"
        data-track-index="11"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-03-visible-work", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.18, ease: "power2.inOut" }, 8.2);
        tl.fromTo("#el-04-trusted-output", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.18, ease: "power2.inOut" }, 8.2);
        tl.to({}, { duration: 12 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
