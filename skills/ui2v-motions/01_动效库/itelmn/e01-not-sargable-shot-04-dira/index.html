<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* @brand:start */
:root {
  --ground: #0C0D0F; --ground-lift: #14161A;
  --ink: #EDEAE4; --ink-mid: #9AA0A6; --ink-dim: #8B9198; --ink-ghost: #3A3E42;
  --rule: #23272A; --rule-bright: #3D4348; --hair: 1.5px;
  --authoritative: #C9A227; --stale: #E0533D; --lost: #6A6F74;
  --boundary: #4E8C7D; --pressure: #B4623A; --counterfactual: #7A8086;
  --font-value: "IBM Plex Mono", ui-monospace, monospace;
  --font-label: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --t-hero: 200px; --t-value: 64px; --t-body: 36px; --t-label: 26px; --track-label: 0.18em;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-label); }
.label { font-family: var(--font-label); font-size: var(--t-label); letter-spacing: var(--track-label);
         text-transform: uppercase; color: var(--ink-dim); font-weight: 500; }
/* @brand:end */

html, body { width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; }
#world { position: absolute; inset: 0; will-change: transform; }

/* ---------------------------------------------------------------------------
   A — WHERE A DESCENT ON `email` ACTUALLY LANDS

   Rewritten after two corrections. The first version drew "matching rows are
   scattered, so the range is the whole table", which inverted the causality: even
   if they were contiguous, a plain index on `email` still would not serve
   lower(email) = $1. The second was worse — the data contained carol@corp.com while
   the narration said the value was not in the list. The eye wins over the ear.

   So the data no longer contradicts the script, and the image is now the true one:
   a B-tree descent can only navigate by its OWN indexed expression. Searching for
   the literal 'carol@corp.com' by `email` order lands past every stored value — at
   the bottom — while the rows that satisfy the predicate sit at the top. The index
   does not fail to find a range. It walks confidently to the wrong place.

   Typography is the material: a mark cannot be looked up, and cannot show that
   CAROL sorts before alice.
--------------------------------------------------------------------------- */
#idxName  { position: absolute; left: 140px; top: 196px; }
#ev-probe { position: absolute; left: 140px; top: 300px; font-family: var(--font-value);
            font-size: 36px; color: var(--ink); white-space: nowrap; }
#ev-probe .fn { color: var(--stale); }
#sortedBy { position: absolute; left: 140px; top: 404px; color: var(--ink-mid); }

#rows { position: absolute; left: 140px; top: 480px; width: 900px; height: 576px; }
.row     { position: absolute; left: 0; width: 880px; height: 76px; }
.row .n  { position: absolute; left: 0;   top: 22px; font-family: var(--font-value); font-size: 26px; color: var(--lost); }
.row .v  { position: absolute; left: 62px; top: 8px; font-family: var(--font-value); font-size: 40px;
           color: var(--ink-mid); white-space: nowrap; }
.row .cmp{ position: absolute; left: 470px; top: 20px; font-family: var(--font-value); font-size: 26px;
           color: var(--ink-dim); white-space: nowrap; }
.row .hit{ position: absolute; left: 680px; top: 18px; font-family: var(--font-label); font-size: 26px;
           letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink); }

/* the slot the descent arrives at, which holds nothing */
#slot     { position: absolute; left: 140px; top: 1064px; width: 880px; height: 76px; }
#slot .n  { position: absolute; left: 0; top: 22px; font-family: var(--font-value); font-size: 26px; color: var(--lost); }
#slot .v  { position: absolute; left: 62px; top: 8px; font-family: var(--font-value); font-size: 40px;
            color: var(--counterfactual); white-space: nowrap; }
#slot .k  { position: absolute; left: 620px; top: 20px; color: var(--counterfactual); white-space: nowrap; }
#slotRule { position: absolute; left: 140px; top: 1056px; width: 560px; height: var(--hair);
            background: var(--rule-bright); transform-origin: left center; }

/* the reading head — where the index takes you */
#head { position: absolute; left: 128px; top: 480px; width: 700px; height: 76px; border-left: 4px solid var(--ink); }

#gap     { position: absolute; left: 1024px; top: 498px; width: 22px;
           border-top: 3px solid var(--counterfactual); border-bottom: 3px solid var(--counterfactual);
           border-right: 3px solid var(--counterfactual); }

#ev-reject { position: absolute; left: 140px; top: 1226px; width: 900px; }
#ev-reject .k { display: block; font-family: var(--font-value); font-size: 32px; color: var(--ink); }
#ev-reject .k em { font-style: normal; color: var(--stale); }
#ev-reject .q { display: block; margin-top: 16px; font-family: var(--font-label); font-size: 25px;
                letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-dim); }
#ev-seqscan { position: absolute; left: 140px; top: 1396px; display: flex; align-items: flex-end; gap: 24px; }
#ev-seqscan .n { font-family: var(--font-value); font-weight: 600; font-size: 92px; line-height: 1;
                 letter-spacing: -.02em; color: var(--pressure); }
#ev-seqscan .k { padding-bottom: 14px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="14"
     data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
   <div id="world">

    <div id="idxName" class="label">index on email</div>
    <div id="ev-probe"><span class="fn">lower(</span>email<span class="fn">)</span> = 'carol@corp.com'</div>
    <div id="sortedBy" class="label">sắp xếp theo &nbsp;email</div>

    <div id="rows"></div>

    <div id="slotRule"></div>
    <div id="slot">
      <span class="n">6</span>
      <span class="v">carol@corp.com</span>
      <span class="k label">không có dòng nào</span>
    </div>

    <div id="head"></div>
    <div id="gap"></div>

    <div id="ev-reject">
      <span class="k">index xây trên <em>email</em> &nbsp;·&nbsp; predicate cần <em>lower(email)</em></span>
      <span class="q">descent chỉ biết đi theo email &mdash; nên không có đường indexed lookup cho predicate này</span>
    </div>
    <div id="ev-seqscan"><span class="n">2.000.000</span><span class="k label">dòng phải đọc</span></div>

   </div>
  </div>
</div>

<script>
/* Everything positional comes from verified facts in semantics.yaml:
     rows                    six stored values, none of them already lowercase
     looking_for             'carol@corp.com' — verified NOT a stored value
     descent_lands_at   6    c(99) sorts above C(67) and b(98), so past everything
     matches_in_index_order  [0, 1] — at the top, where the descent never goes
   tools/verify-index-facts.mjs recomputes all of it and fails the build if any of
   the three claims the narration makes stops being true. */
const ROWS = ['CAROL@corp.com', 'Carol@corp.com', 'Dan@corp.com', 'Eve@corp.com',
              'alice@corp.com', 'bob@corp.com'];
const WANT = 'carol@corp.com';
const HITS = [0, 1];
const DESCENT = 6;
const PITCH = 96, TOP = 480;

const host = document.getElementById('rows');
const rowEls = ROWS.map((v, i) => {
  const d = document.createElement('div');
  d.className = 'row';
  d.style.top = (i * PITCH) + 'px';
  d.innerHTML = `<span class="n">${i}</span><span class="v">${v}</span>` +
                `<span class="cmp">lớn hơn &nbsp;↓</span>` +
                `<span class="hit">${HITS.includes(i) ? 'khớp' : ''}</span>`;
  host.appendChild(d);
  return d;
});
const q = (i, s) => rowEls[i].querySelector(s);

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const R = 'power3.out', T = 'power2.inOut';

gsap.set('#world', { transformOrigin: '0 0' });
const cam = (px, py, s) => ({ x: 540 - px * s, y: 960 - py * s, scale: s });
/* CLOSED: the index as the one line you typed. OPEN: the values it actually holds. */
gsap.set('#world', cam(370, 296, 2.0));

gsap.set(['#ev-probe', '#sortedBy', '#rows', '#head', '#slot', '#slotRule',
          '#gap', '#ev-reject', '#ev-seqscan'], { opacity: 0 });
gsap.set(rowEls.map((_, i) => q(i, '.cmp')), { opacity: 0 });
gsap.set(rowEls.map((_, i) => q(i, '.hit')), { opacity: 0 });
gsap.set('#gap', { height: '76px' });

/* ---- 0.2–1.1  the index as a thing you created ------------------------- */
tl.fromTo('#idxName', { opacity: 0 }, { opacity: 1, duration: .5, ease: R }, 0.20);

/* ---- 1.10–2.20  open it ------------------------------------------------ */
tl.to('#world', { ...cam(540, 960, 1.0), duration: 1.1, ease: T }, 1.10)
  .to('#sortedBy', { opacity: 1, duration: .4, ease: R }, 1.72)
  .to('#rows', { opacity: 1, duration: .5, ease: R }, 1.94);

/* ---- 2.55  the value being looked for ---------------------------------- */
tl.to('#ev-probe', { opacity: 1, duration: .4, ease: R }, 2.55);

/* ---- 3.2–6.3  THE DESCENT. Deliberately slow.
   A B-tree navigates by comparing the search key against stored keys in ITS order.
   'carol@corp.com' is greater than every one of them, so every comparison says
   "keep going down". Six times. The monotony is the point: nothing here is a
   failure to search, it is a search that is being answered correctly by the wrong
   index. */
const STEP = 0.50;
tl.to('#head', { opacity: 1, duration: .25, ease: R }, 3.20);
ROWS.forEach((_, i) => {
  const t = 3.20 + i * STEP;
  tl.to('#head', { y: i * PITCH, duration: .26, ease: T }, t)
    .to(q(i, '.cmp'), { opacity: 1, duration: .2, ease: R }, t + .12);
});

/* ---- 6.4–7.5  it arrives, and there is nothing there -------------------- */
tl.to('#slotRule', { opacity: 1, scaleX: 1, duration: .4, ease: R }, 6.40)
  .to('#head', { y: DESCENT * PITCH, duration: .45, ease: T }, 6.50)
  .to('#slot', { opacity: 1, duration: .45, ease: R }, 6.86);

/* ---- 7.7–8.7  and the rows that DO satisfy it are at the far end -------
   Revealed after the descent, not before: the viewer should first watch the index
   take them somewhere, and only then learn it was the wrong somewhere. */
tl.to(rowEls.slice(0, 2).map((_, i) => q(i, '.hit')), { opacity: 1, duration: .3, stagger: .14, ease: R }, 7.70)
  .to([q(0, '.v'), q(1, '.v')], { color: '#EDEAE4', duration: .35 }, 7.70)
  .to('#gap', { opacity: 1, duration: .3, ease: R }, 8.20)
  .to('#gap', { height: (DESCENT * PITCH + 44) + 'px', duration: .55, ease: T }, 8.28);

/* ---- 8.91  THE CAUSE, stated as the cause ------------------------------ */
tl.fromTo('#ev-reject', { opacity: 0 }, { opacity: 1, duration: .45, ease: R }, 8.91)
  .to('#head', { opacity: 0, duration: .4 }, 9.40);

/* ---- 11.88  the price -------------------------------------------------- */
tl.fromTo('#ev-seqscan', { opacity: 0 }, { opacity: 1, duration: .5, ease: R }, 11.88);

window.__timelines['main'] = tl;
</script>
</body>
</html>
