<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1020; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #1a1230 0%, #070a14 70%); }
      .label {
        position: absolute; left: 160px; top: 200px;
        font-family: "Segoe UI", sans-serif; color: #c4b5fd; letter-spacing: 0.3em;
        text-transform: uppercase; font-size: 22px;
      }
      .sub {
        position: absolute; left: 160px; top: 280px;
        font-family: "Segoe UI", sans-serif; color: #a78bfa; font-size: 32px;
      }
      .sign {
        position: absolute; left: 620px; top: 360px; width: 900px; height: 280px;
        border: 6px solid #4c1d95; border-radius: 28px;
        display: grid; place-items: center;
        background: rgba(15, 10, 30, 0.7);
        box-shadow: inset 0 0 40px rgba(124, 58, 237, 0.15);
      }
      .neon {
        font-family: "Segoe UI", sans-serif; font-weight: 800; font-size: 120px;
        letter-spacing: 0.08em; color: #f5d0fe;
        text-shadow:
          0 0 8px #e879f9,
          0 0 24px #c026d3,
          0 0 48px #a21caf,
          0 0 80px #86198f;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="label" class="clip label" data-start="0" data-duration="4.5" data-track-index="0">Storefront · Night</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="4.5" data-track-index="1">Neon sign ignites</div>
      <div id="sign" class="clip sign" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="neon" id="neon">OPEN</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#label", "#sub"], { opacity: 0, y: 12 });
      gsap.set("#sign", { opacity: 0, scale: 0.96 });
      gsap.set("#neon", { opacity: 0.12 });
      tl.to("#label", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#sub", { opacity: 1, y: 0, duration: 0.4 }, 0.25)
        .to("#sign", { opacity: 1, scale: 1, duration: 0.55 }, 0.45)
        .to("#neon", { opacity: 1, duration: 0.08 }, 1.2)
        .to("#neon", { opacity: 0.12, duration: 0.06 }, 1.35)
        .to("#neon", { opacity: 1, duration: 0.08 }, 1.45)
        .to("#neon", { opacity: 0.18, duration: 0.05 }, 1.6)
        .to("#neon", { opacity: 1, duration: 0.15 }, 1.75)
        .to("#sign", { scale: 1.02, duration: 1.8, ease: "sine.inOut" }, 2.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
