<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1220; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 60% 40%, #132238 0%, #0b1220 70%);
      }
      .copy {
        position: absolute; left: 140px; top: 300px; color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #4ade80; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #94a3b8; max-width: 540px; line-height: 1.45; }
      .card {
        position: absolute; right: 140px; top: 200px; width: 900px; height: 680px;
        background: #0f1a2c; border: 1px solid #1e334d; border-radius: 28px;
        padding: 48px 52px; box-shadow: 0 28px 70px rgba(0,0,0,0.4);
      }
      .head {
        display: flex; justify-content: space-between; align-items: end; margin-bottom: 36px;
        font-family: "Segoe UI", sans-serif;
      }
      .head h3 { font-size: 32px; color: #cbd5e1; font-weight: 600; }
      .stat { text-align: right; }
      .stat strong {
        display: block; font-size: 64px; color: #4ade80; letter-spacing: -0.04em; font-weight: 700;
      }
      .stat span { font-size: 22px; color: #64748b; }
      .chart { height: 420px; position: relative; }
      .chart svg { width: 100%; height: 100%; overflow: visible; }
      .grid line { stroke: #1e334d; stroke-width: 1; }
      .area {
        fill: url(#grad); opacity: 0.35;
      }
      .line {
        fill: none; stroke: #4ade80; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1600; stroke-dashoffset: 1600;
        filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.45));
      }
      .dot {
        fill: #4ade80; stroke: #0f1a2c; stroke-width: 4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Metrics · Growth</div>
        <div class="title">Sparkline Rise</div>
        <div class="sub">A compact KPI chart draws upward with a live delta.</div>
      </div>
      <div id="card" class="clip card" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="head">
          <h3>Weekly installs</h3>
          <div class="stat">
            <strong id="delta">+0%</strong>
            <span>vs last week</span>
          </div>
        </div>
        <div class="chart">
          <svg viewBox="0 0 800 400" preserveAspectRatio="none">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4ade80" />
                <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
              </linearGradient>
            </defs>
            <g class="grid">
              <line x1="0" y1="100" x2="800" y2="100" />
              <line x1="0" y1="200" x2="800" y2="200" />
              <line x1="0" y1="300" x2="800" y2="300" />
            </g>
            <path id="area" class="area" d="M0,320 L80,300 L160,280 L240,250 L320,240 L400,190 L480,170 L560,120 L640,90 L720,70 L800,40 L800,400 L0,400 Z" opacity="0" />
            <path id="line" class="line" d="M0,320 L80,300 L160,280 L240,250 L320,240 L400,190 L480,170 L560,120 L640,90 L720,70 L800,40" />
            <circle id="dot" class="dot" cx="800" cy="40" r="10" opacity="0" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const delta = document.getElementById("delta");
      const counter = { v: 0 };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#card", { opacity: 0, y: 24 });
      gsap.set("#line", { strokeDashoffset: 1600 });
      gsap.set("#area", { opacity: 0 });
      gsap.set("#dot", { opacity: 0, scale: 0.6, transformOrigin: "800px 40px" });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#card", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#line", { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 0.85)
        .to(counter, {
          v: 38, duration: 2.2, ease: "power2.inOut",
          onUpdate: () => { delta.textContent = "+" + Math.round(counter.v) + "%"; }
        }, 0.85)
        .to("#area", { opacity: 0.35, duration: 0.5 }, 2.6)
        .to("#dot", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 2.9)
        .to("#card", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
