<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      .eq {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: flex; align-items: flex-end; gap: 18px; height: 420px;
      }
      .bar {
        width: 42px; border-radius: 999px 999px 8px 8px;
        background: linear-gradient(180deg, #34d399, #059669);
        box-shadow: 0 0 24px rgba(52, 211, 153, 0.35);
        transform-origin: 50% 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="eq" class="clip eq" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="bar" id="b0"></div><div class="bar" id="b1"></div><div class="bar" id="b2"></div>
        <div class="bar" id="b3"></div><div class="bar" id="b4"></div><div class="bar" id="b5"></div>
        <div class="bar" id="b6"></div><div class="bar" id="b7"></div><div class="bar" id="b8"></div>
        <div class="bar" id="b9"></div><div class="bar" id="b10"></div><div class="bar" id="b11"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const heights = [80, 140, 220, 300, 360, 400, 340, 280, 200, 150, 110, 70];
      const pattern = [0.35, 0.7, 1, 0.55, 0.9, 0.45, 0.8, 1, 0.6, 0.85, 0.5, 0.4];
      gsap.set("#eq", { opacity: 0, scale: 0.92 });
      for (let i = 0; i < 12; i++) gsap.set("#b" + i, { height: 24, scaleY: 1 });
      tl.to("#eq", { opacity: 1, scale: 1, duration: 0.5 }, 0.15);
      for (let beat = 0; beat < 6; beat++) {
        for (let i = 0; i < 12; i++) {
          const h = heights[i] * pattern[(i + beat * 3) % 12];
          tl.to("#b" + i, { height: h, duration: 0.28, ease: "sine.inOut" }, 0.6 + beat * 0.45);
        }
      }
      tl.to("#eq", { y: -10, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
