<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
      /* recetas CSS de motion-anything (Animate.css): seek-safe. Sobre SVG: transform-box fill-box. */
      @keyframes tada {
  from {
    transform: scale3d(1, 1, 1);
  }

  10%,
  20% {
    transform: scale3d(0.9, 0.9, 0.9) rotate3d(0, 0, 1, -3deg);
  }

  30%,
  50%,
  70%,
  90% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, 3deg);
  }

  40%,
  60%,
  80% {
    transform: scale3d(1.1, 1.1, 1.1) rotate3d(0, 0, 1, -3deg);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes jello {
  from,
  11.1%,
  to {
    transform: translate3d(0, 0, 0);
  }

  22.2% {
    transform: skewX(-12.5deg) skewY(-12.5deg);
  }

  33.3% {
    transform: skewX(6.25deg) skewY(6.25deg);
  }

  44.4% {
    transform: skewX(-3.125deg) skewY(-3.125deg);
  }

  55.5% {
    transform: skewX(1.5625deg) skewY(1.5625deg);
  }

  66.6% {
    transform: skewX(-0.78125deg) skewY(-0.78125deg);
  }

  77.7% {
    transform: skewX(0.390625deg) skewY(0.390625deg);
  }

  88.8% {
    transform: skewX(-0.1953125deg) skewY(-0.1953125deg);
  }
}
@keyframes bounce {
  from,
  20%,
  53%,
  to {
    animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0);
  }

  40%,
  43% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -30px, 0) scaleY(1.1);
  }

  70% {
    animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
    transform: translate3d(0, -15px, 0) scaleY(1.05);
  }

  80% {
    transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
    transform: translate3d(0, 0, 0) scaleY(0.95);
  }

  90% {
    transform: translate3d(0, -4px, 0) scaleY(1.02);
  }
}
@keyframes headShake {
  0% {
    transform: translateX(0);
  }

  6.5% {
    transform: translateX(-6px) rotateY(-9deg);
  }

  18.5% {
    transform: translateX(5px) rotateY(7deg);
  }

  31.5% {
    transform: translateX(-3px) rotateY(-5deg);
  }

  43.5% {
    transform: translateX(2px) rotateY(3deg);
  }

  50% {
    transform: translateX(0);
  }
}
@keyframes rubberBand {
  from {
    transform: scale3d(1, 1, 1);
  }

  30% {
    transform: scale3d(1.25, 0.75, 1);
  }

  40% {
    transform: scale3d(0.75, 1.25, 1);
  }

  50% {
    transform: scale3d(1.15, 0.85, 1);
  }

  65% {
    transform: scale3d(0.95, 1.05, 1);
  }

  75% {
    transform: scale3d(1.05, 0.95, 1);
  }

  to {
    transform: scale3d(1, 1, 1);
  }
}
@keyframes swing {
  20% {
    transform: rotate3d(0, 0, 1, 15deg);
  }

  40% {
    transform: rotate3d(0, 0, 1, -10deg);
  }

  60% {
    transform: rotate3d(0, 0, 1, 5deg);
  }

  80% {
    transform: rotate3d(0, 0, 1, -5deg);
  }

  to {
    transform: rotate3d(0, 0, 1, 0deg);
  }
}
@keyframes wobble {
  from {
    transform: translate3d(0, 0, 0);
  }

  15% {
    transform: translate3d(-25%, 0, 0) rotate3d(0, 0, 1, -5deg);
  }

  30% {
    transform: translate3d(20%, 0, 0) rotate3d(0, 0, 1, 3deg);
  }

  45% {
    transform: translate3d(-15%, 0, 0) rotate3d(0, 0, 1, -3deg);
  }

  60% {
    transform: translate3d(10%, 0, 0) rotate3d(0, 0, 1, 2deg);
  }

  75% {
    transform: translate3d(-5%, 0, 0) rotate3d(0, 0, 1, -1deg);
  }

  to {
    transform: translate3d(0, 0, 0);
  }
}

      .anim { transform-box: fill-box; transform-origin: 50% 50%; animation-fill-mode: both; animation-timing-function: ease; }
      
    #journal-ghost { animation: jello 1.2s 1s both; } #engine-ghost { animation: jello 1.2s 5s both; } #frozen-box image { animation: headshake 1s 9s both; }
    #journal-ghost, #engine-ghost, #frozen-box image { transform-box: fill-box; transform-origin: 50% 100%; }
    #notebook { animation: swing 1.2s 1.2s both; transform-box: fill-box; transform-origin: 50% 0%; }
    #engine-db { animation: rubberband 1s 5.2s both; transform-box: fill-box; transform-origin: 50% 100%; }
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="16">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs><pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern></defs>
  <rect width="1920" height="1080" fill="#0E1317"/><rect width="1920" height="1080" fill="url(#dots)"/>

  <g id="title">
    <text x="960" y="100" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">Tres formas de no perder el trabajo</text>
    <text x="960" y="150" text-anchor="middle" font-size="28" fill="#85DDCB">se va la luz con la ficha 4 en la mano: qué queda guardado en cada caso</text>
  </g>

  <!-- ===== Columna 1: journal a mano ===== -->
  <g id="col-journal">
    <rect x="110" y="220" width="540" height="600" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="110" y="220" width="540" height="600" rx="16" fill="#141C21" stroke="#85DDCB" stroke-width="4"/>
    <rect x="110" y="220" width="540" height="60" rx="16" fill="#85DDCB"/><rect x="110" y="260" width="540" height="20" fill="#85DDCB"/>
    <text x="380" y="262" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">1 · journal a mano</text>
    <!-- libreta -->
    <g id="notebook">
      <rect x="160" y="330" width="220" height="260" rx="8" fill="#F2F5F4" stroke="#0E1317" stroke-width="4"/>
      <line x1="200" y1="330" x2="200" y2="590" stroke="#D9D3C4" stroke-width="3"/>
      <g font-size="24" font-weight="900" fill="#0E1317">
        <text x="215" y="380">paso 1 ✓</text><text x="215" y="424">paso 2 ✓</text><text x="215" y="468">paso 3 ✓</text>
        <text x="215" y="512" fill="#7C8A8E">paso 4 …</text>
      </g>
    </g>
    <g id="journal-ghost"><image xlink:href="assets/ghosty.png" x="420" y="360" width="180" height="210" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="journal-notes" font-size="21" fill="#F2F5F4">
      <text x="380" y="650" text-anchor="middle">guarda: el resultado de cada paso</text>
      <text x="380" y="690" text-anchor="middle">quién lo escribe: tú, en SQLite</text>
      <text x="380" y="730" text-anchor="middle" fill="#85DDCB">al volver: lee la libreta, sigue en el 4</text>
      <text x="380" y="790" text-anchor="middle" fill="#7C8A8E">costo: tu código debe ser determinista</text>
    </g>
  </g>

  <!-- ===== Columna 2: motor ===== -->
  <g id="col-engine">
    <rect x="690" y="220" width="540" height="600" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="690" y="220" width="540" height="600" rx="16" fill="#141C21" stroke="#8DCF6E" stroke-width="4"/>
    <rect x="690" y="220" width="540" height="60" rx="16" fill="#8DCF6E"/><rect x="690" y="260" width="540" height="20" fill="#8DCF6E"/>
    <text x="960" y="262" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">2 · motor</text>
    <!-- cilindro postgres pequeño -->
    <g id="engine-db">
      <rect x="740" y="380" width="200" height="170" fill="#37AB93" stroke="#F2F5F4" stroke-width="4"/>
      <ellipse cx="840" cy="550" rx="100" ry="24" fill="#37AB93" stroke="#F2F5F4" stroke-width="4"/>
      <ellipse cx="840" cy="380" rx="100" ry="24" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
      <text x="840" y="470" text-anchor="middle" font-size="22" font-weight="900" fill="#0E1317">steps</text>
    </g>
    <g id="engine-ghost"><image xlink:href="assets/ghosty.png" x="990" y="360" width="180" height="210" preserveAspectRatio="xMidYMid meet"/></g>
    <g id="engine-notes" font-size="21" fill="#F2F5F4">
      <text x="960" y="650" text-anchor="middle">guarda: lo mismo, en Postgres</text>
      <text x="960" y="690" text-anchor="middle">quién lo escribe: el motor (eve, Restate)</text>
      <text x="960" y="730" text-anchor="middle" fill="#8DCF6E">al volver: re-ejecuta y salta lo hecho</text>
      <text x="960" y="790" text-anchor="middle" fill="#7C8A8E">costo: marcar cada paso con "use step"</text>
    </g>
  </g>

  <!-- ===== Columna 3: imagen (hibernar) ===== -->
  <g id="col-snapshot">
    <rect x="1270" y="220" width="540" height="600" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="1270" y="220" width="540" height="600" rx="16" fill="#141C21" stroke="#F2F5F4" stroke-width="4"/>
    <rect x="1270" y="220" width="540" height="60" rx="16" fill="#F2F5F4"/><rect x="1270" y="260" width="540" height="20" fill="#F2F5F4"/>
    <text x="1540" y="262" text-anchor="middle" font-size="28" font-weight="900" fill="#0E1317">3 · imagen de la caja</text>
    <!-- caja escarchada con ghosty adentro -->
    <g id="frozen-box">
      <rect x="1330" y="330" width="420" height="260" rx="12" fill="#4A6C74" stroke="#F2F5F4" stroke-width="4"/>
      <rect x="1350" y="350" width="380" height="200" rx="8" fill="#0E1317"/>
      <image xlink:href="assets/ghosty.png" x="1470" y="365" width="150" height="175" preserveAspectRatio="xMidYMid meet"/>
      <g id="frost">
        <rect x="1350" y="350" width="380" height="200" rx="8" fill="#DDF4F0" fill-opacity="0.12"/>
        <!-- franja dentada arriba -->
        <polygon points="1350,350 1730,350 1730,356 1700,366 1670,356 1640,368 1610,357 1580,370 1550,358 1520,369 1490,357 1460,368 1430,356 1400,367 1370,357 1350,364" fill="#EAF8F6"/>
        <!-- franja dentada abajo -->
        <polygon points="1350,550 1730,550 1730,544 1700,534 1670,544 1640,532 1610,543 1580,530 1550,542 1520,531 1490,543 1460,532 1430,544 1400,533 1370,543 1350,536" fill="#EAF8F6"/>
        <!-- laterales -->
        <polygon points="1350,350 1356,350 1366,380 1356,410 1368,440 1357,470 1367,500 1358,530 1350,550" fill="#EAF8F6"/>
        <polygon points="1730,350 1724,350 1714,380 1724,410 1712,440 1723,470 1713,500 1722,530 1730,550" fill="#EAF8F6"/>
        <!-- carámbanos colgando -->
        <g fill="#EAF8F6" stroke="#B7E9E1" stroke-width="2" stroke-linejoin="round">
          <polygon points="1392,364 1420,364 1406,430"/><polygon points="1450,364 1470,364 1460,410"/><polygon points="1620,364 1650,364 1635,436"/><polygon points="1680,364 1698,364 1689,404"/>
        </g>
        <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><line x1="1398" y1="378" x2="1404" y2="414"/><line x1="1626" y1="378" x2="1632" y2="420"/></g>
        <!-- cristal de hielo -->
        <g stroke="#EAF8F6" stroke-width="3" stroke-linecap="round">
          <line x1="1400" y1="500" x2="1430" y2="500"/><line x1="1415" y1="485" x2="1415" y2="515"/><line x1="1405" y1="490" x2="1425" y2="510"/><line x1="1425" y1="490" x2="1405" y2="510"/>
        </g>
      </g>
    </g>
    <text x="1540" y="580" text-anchor="middle" font-size="20" font-weight="900" fill="#DDF4F0">.mem + .ext4</text>
    </g>
    <g id="snapshot-notes" font-size="21" fill="#F2F5F4">
      <text x="1540" y="650" text-anchor="middle">guarda: la memoria y el disco enteros</text>
      <text x="1540" y="690" text-anchor="middle">quién lo escribe: EasyBits (suspend)</text>
      <text x="1540" y="730" text-anchor="middle" fill="#85DDCB">al volver: el proceso ni se enteró</text>
      <text x="1540" y="790" text-anchor="middle" fill="#7C8A8E">costo: la llamada HTTP en vuelo muere</text>
    </g>
  </g>

  <g id="footer">
    <text x="960" y="900" text-anchor="middle" font-size="26" fill="#7C8A8E">en los tres, lo que ya se hizo se queda hecho: la página 200 no se vuelve a escribir</text>
    <text x="960" y="944" text-anchor="middle" font-size="26" fill="#F2F5F4">y lo que sale al mundo (un cobro, un correo) lleva su id y se manda una sola vez</text>
  </g>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

    const focus = (sel, t) => { tl.to(sel, { y: -16, duration: .35, ease: "back.out(2)" }, t); tl.to(sel, { y: 0, duration: .35 }, t + 3.2); };
    focus("#col-journal", 0.8); focus("#col-engine", 4.8); focus("#col-snapshot", 8.8);
    tl.set("#frost polygon", { scaleY: 0, transformOrigin: "50% 0%" }, 0.01);
    tl.to("#frost polygon", { scaleY: 1, duration: .5, stagger: .06, ease: "power2.out" }, 9.2);
  
      tl.set({}, {}, 16);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
