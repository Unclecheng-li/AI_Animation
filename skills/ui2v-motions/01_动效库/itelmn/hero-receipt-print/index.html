<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      .copy {
        position: absolute; left: 140px; top: 260px; color: #f3f4f6;
        font-family: "Segoe UI", sans-serif;
      }
      .eyebrow { color: #fbbf24; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 18px; font-size: 22px; }
      .title { font-size: 96px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 22px; font-size: 30px; color: #9ca3af; }
      .slot {
        position: absolute; left: 980px; top: 160px; width: 520px; height: 760px;
        background: #1f2937; border-radius: 18px; overflow: hidden;
        box-shadow: inset 0 0 0 2px #374151, 0 24px 50px rgba(0,0,0,0.35);
      }
      .receipt {
        position: absolute; left: 40px; top: -520px; width: 440px;
        background: #f9fafb; color: #111827; padding: 36px 32px 48px;
        font-family: "Courier New", monospace; font-size: 22px; line-height: 1.55;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      }
      .receipt h3 { font-size: 28px; margin-bottom: 16px; letter-spacing: 0.08em; }
      .receipt .line { display: flex; justify-content: space-between; margin: 8px 0; }
      .receipt .total { margin-top: 20px; padding-top: 16px; border-top: 2px dashed #9ca3af; font-weight: 700; }
      .mouth {
        position: absolute; left: 0; right: 0; top: 0; height: 28px;
        background: linear-gradient(#4b5563, #1f2937);
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Checkout</div>
        <div class="title">Receipt Print</div>
        <div class="sub">Thermal slip feeds from the slot</div>
      </div>
      <div id="slot" class="clip slot" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="mouth"></div>
        <div class="receipt" id="receipt">
          <h3>UI2V MART</h3>
          <div class="line"><span>hero-pack</span><span>20×</span></div>
          <div class="line"><span>publish</span><span>OK</span></div>
          <div class="line"><span>lint</span><span>0 err</span></div>
          <div class="line total"><span>TOTAL</span><span>SHIPPED</span></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#slot", { opacity: 0, y: 20 });
      gsap.set("#receipt", { y: 0 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#slot", { opacity: 1, y: 0, duration: 0.5 }, 0.3)
        .to("#receipt", { y: 620, duration: 2.4, ease: "power1.out" }, 0.9)
        .to("#receipt", { y: 640, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
