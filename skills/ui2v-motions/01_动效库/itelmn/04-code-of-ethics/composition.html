<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Presentation Title","default":"Code of Ethics"},
  {"id":"kicker","type":"string","label":"Kicker","default":"ETHICS AND PROFESSIONAL PRACTICE"},
  {"id":"unitCode","type":"string","label":"Unit Code","default":"ACS"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image URL","default":"v2-base-blue.png"},
  {"id":"tabs","type":"string","label":"Tabs (JSON array)","default":"[{\"label\":\"Conflict of Interest\",\"heading\":\"Conflict of Interest\",\"body\":\"Employees must avoid situations where personal interests conflict, or appear to conflict, with the interests of the organisation. This includes financial interests, outside employment, and personal relationships that may influence business decisions.\"},{\"label\":\"Accepting Gifts\",\"heading\":\"Accepting and Giving Gifts\",\"body\":\"Strict guidelines govern the acceptance and giving of gifts, entertainment, and other benefits. Any gift or hospitality must be modest, infrequent, and transparent. Cash or cash-equivalent gifts are never acceptable.\"},{\"label\":\"Privacy\",\"heading\":\"Protecting Privacy\",\"body\":\"We are committed to protecting the personal information of our employees, customers, and partners. Data must be collected, stored, and processed in compliance with applicable privacy laws and our internal data protection policies.\"},{\"label\":\"Use of Assets\",\"heading\":\"Proper Use of Assets\",\"body\":\"Company assets - including equipment, facilities, intellectual property, and funds - must be used responsibly and for legitimate business purposes only. Personal use should be minimal and must never interfere with job performance.\"},{\"label\":\"Antitrust\",\"heading\":\"Antitrust and Competition\",\"body\":\"We compete fairly and ethically in the marketplace. Employees must not engage in price fixing, market allocation, bid rigging, or any other practice that violates competition laws. Contact Legal before any competitor discussions.\"}]"},
  {"id":"activeTab","type":"number","label":"Active Tab Index (0-based)","default":0,"min":0,"max":4},
  {"id":"tabColor","type":"color","label":"Active Tab Color","default":"#285f9f"},
  {"id":"tabBgColor","type":"color","label":"Tab Bar Background","default":"#e8ebe4"},
  {"id":"cardColor","type":"color","label":"Content Card Color","default":"#fffdfa"},
  {"id":"textColor","type":"color","label":"Text Color","default":"#182026"},
  {"id":"bgColor","type":"color","label":"Page Background","default":"#f5f2ea"},
  {"id":"durationPerTab","type":"number","label":"Seconds per Tab","default":6.5,"min":4,"max":14,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --tab-color: #285f9f;
      --tab-bg: #e8ebe4;
      --card-color: #fffdfa;
      --text-color: #182026;
      --muted-text: #5b665f;
      --bg-color: #f5f2ea;
      --plate-image: url("v2-base-blue.png");
    }

    body {
      width: 1920px;
      height: 1080px;
      background: var(--bg-color);
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: var(--text-color);
      overflow: hidden;
      position: relative;
    }

    #code-of-ethics {
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 106px;
      background-image: var(--plate-image);
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .unit-chip {
      position: absolute;
      top: 36px;
      right: 70px;
      min-width: 92px;
      height: 44px;
      padding: 0 20px;
      background: rgba(255, 253, 250, 0.9);
      border-left: 6px solid var(--tab-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tab-color);
      font-size: 17px;
      font-weight: 800;
      opacity: 0;
    }

    .kicker {
      font-size: 17px;
      font-weight: 700;
      color: var(--muted-text);
      letter-spacing: 1.6px;
      margin-bottom: 12px;
      opacity: 0;
      text-transform: uppercase;
    }

    .title {
      font-size: 62px;
      font-weight: 800;
      color: var(--tab-color);
      margin-bottom: 64px;
      opacity: 0;
      letter-spacing: 0;
      line-height: 1.05;
    }

    .tab-bar {
      width: 1620px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      position: relative;
      margin-bottom: 0;
      background: var(--tab-bg);
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(24, 32, 38, 0.08);
    }

    .tab {
      min-width: 0;
      padding: 28px 18px;
      font-size: 22px;
      font-weight: 700;
      cursor: default;
      color: var(--muted-text);
      background: transparent;
      transition: color 0.3s;
      white-space: nowrap;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .tab.active {
      color: #fff;
    }

    .tab-highlight {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--tab-color);
      z-index: 1;
      transition: left 0.4s ease, width 0.4s ease;
    }

    .content-card {
      width: 1620px;
      height: 530px;
      background: var(--card-color);
      padding: 78px 88px;
      box-shadow: 0 24px 52px rgba(24, 32, 38, 0.11);
      position: relative;
      overflow: hidden;
      border-bottom: 8px solid rgba(40, 95, 159, 0.24);
    }

    .content-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 100%;
      background: var(--tab-color);
    }

    .content-panel {
      position: absolute;
      inset: 88px 88px 78px 118px;
      opacity: 0;
    }

    .content-heading {
      font-size: 48px;
      font-weight: 800;
      color: var(--tab-color);
      margin-bottom: 32px;
      line-height: 1.15;
    }

    .content-body {
      font-size: 28px;
      line-height: 1.5;
      color: var(--text-color);
      max-width: 1340px;
    }

    .footer-progress {
      position: absolute;
      left: 70px;
      bottom: 42px;
      width: 360px;
      height: 6px;
      background: rgba(24, 32, 38, 0.12);
      overflow: hidden;
      opacity: 0;
    }

    .footer-progress-fill {
      width: 20%;
      height: 100%;
      background: var(--tab-color);
    }

    .footer-label {
      position: absolute;
      right: 70px;
      bottom: 33px;
      color: var(--muted-text);
      font-size: 16px;
      font-weight: 700;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="code-of-ethics" data-composition-id="code-of-ethics" data-start="0" data-width="1920" data-height="1080" data-duration="32.5">
    <div class="unit-chip" id="unitChip">ACS</div>
    <div class="kicker" id="kicker">ETHICS AND PROFESSIONAL PRACTICE</div>
    <div class="title" id="mainTitle">Code of Ethics</div>

    <div class="tab-bar" id="tabBar">
      <div class="tab-highlight" id="tabHighlight"></div>
    </div>

    <div class="content-card" id="contentCard"></div>
    <div class="footer-progress" id="footerProgress"><div class="footer-progress-fill" id="footerProgressFill"></div></div>
    <div class="footer-label" id="footerLabel">Rotating topic cards</div>

    <div id="el-fade" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const vars = __hyperframes.getVariables();
      const tabs = Array.isArray(vars.tabs) ? vars.tabs : JSON.parse(vars.tabs || "[]");
      const activeTab = Number(vars.activeTab) || 0;
      const tabColor = vars.tabColor || "#285f9f";
      const tabBgColor = vars.tabBgColor || "#e8ebe4";
      const cardColor = vars.cardColor || "#fffdfa";
      const textColor = vars.textColor || "#182026";
      const bgColor = vars.bgColor || "#f5f2ea";
      const durPerTab = Number(vars.durationPerTab) || 6.5;
      const TOTAL_DURATION = tabs.length * durPerTab;

      const root = document.documentElement;
      root.style.setProperty("--tab-color", tabColor);
      root.style.setProperty("--tab-bg", tabBgColor);
      root.style.setProperty("--card-color", cardColor);
      root.style.setProperty("--text-color", textColor);
      root.style.setProperty("--bg-color", bgColor);
      root.style.setProperty("--plate-image", `url("${vars.basePlateImage || "v2-base-blue.png"}")`);

      const tabBar = document.getElementById("tabBar");
      const highlight = document.getElementById("tabHighlight");
      const contentCard = document.getElementById("contentCard");
      const mainTitle = document.getElementById("mainTitle");
      const kicker = document.getElementById("kicker");
      const unitChip = document.getElementById("unitChip");
      const footerProgress = document.getElementById("footerProgress");
      const footerProgressFill = document.getElementById("footerProgressFill");
      const footerLabel = document.getElementById("footerLabel");

      mainTitle.textContent = vars.title || "Code of Ethics";
      kicker.textContent = vars.kicker || "ETHICS AND PROFESSIONAL PRACTICE";
      unitChip.textContent = vars.unitCode || "ACS";

      tabs.forEach((tab, i) => {
        const el = document.createElement("div");
        el.className = "tab" + (i === activeTab ? " active" : "");
        el.textContent = tab.label;
        el.setAttribute("data-index", i);
        tabBar.appendChild(el);

        const panel = document.createElement("div");
        panel.className = "content-panel";
        panel.setAttribute("data-panel-index", i);

        const panelHeading = document.createElement("div");
        panelHeading.className = "content-heading";
        panelHeading.textContent = tab.heading;

        const panelBody = document.createElement("div");
        panelBody.className = "content-body";
        panelBody.textContent = tab.body;

        panel.appendChild(panelHeading);
        panel.appendChild(panelBody);
        contentCard.appendChild(panel);
      });

      const tabEls = tabBar.querySelectorAll(".tab");
      const panelEls = contentCard.querySelectorAll(".content-panel");
      const safeTabCount = Math.max(tabs.length, 1);

      function positionHighlight(index) {
        const el = tabEls[index];
        if (el) {
          highlight.style.left = el.offsetLeft + "px";
          highlight.style.width = el.offsetWidth + "px";
        }
      }

      positionHighlight(activeTab);
      footerProgressFill.style.width = `${((activeTab + 1) / safeTabCount) * 100}%`;

      const tl = gsap.timeline({ paused: true });

      tl.to(kicker, { opacity: 1, y: -12, duration: 0.7, ease: "power2.out" }, 0);
      tl.to(mainTitle, { opacity: 1, y: -20, duration: 0.85, ease: "power2.out" }, 0.1);
      tl.to(unitChip, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.2);
      tl.from(tabBar, { y: -40, opacity: 0, duration: 0.75, ease: "power2.out" }, 0.45);
      tl.to([footerProgress, footerLabel], { opacity: 1, duration: 0.65, ease: "power2.out" }, 0.8);
      tl.to(panelEls[activeTab], { opacity: 1, y: -10, duration: 0.8, ease: "power2.out", overwrite: "auto" }, 0.95);

      tabs.forEach((tab, i) => {
        if (i === activeTab) return;
        const t = i * durPerTab;
        const previousPanel = panelEls[i - 1] || panelEls[activeTab];
        const currentPanel = panelEls[i];
        const previousTab = tabEls[i - 1] || tabEls[activeTab];
        const tabEl = tabEls[i];

        tl.to(previousPanel, { opacity: 0, duration: 0.55, ease: "power2.inOut", overwrite: "auto" }, t);
        tl.to(highlight, { left: tabEl.offsetLeft, width: tabEl.offsetWidth, duration: 0.7, ease: "power2.inOut" }, t + 0.25);
        tl.to(previousTab, { color: "#5b665f", duration: 0.35, ease: "power2.out", overwrite: "auto" }, t + 0.25);
        tl.to(tabEl, { color: "#fff", duration: 0.35, ease: "power2.out", overwrite: "auto" }, t + 0.25);
        tl.to(footerProgressFill, { width: `${((i + 1) / safeTabCount) * 100}%`, duration: 0.65, ease: "power2.inOut" }, t + 0.25);
        tl.to(currentPanel, { opacity: 1, y: -10, duration: 0.8, ease: "power2.out", overwrite: "auto" }, t + 0.9);
      });

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL_DURATION - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL_DURATION);
      document.querySelector('[data-composition-id="code-of-ethics"]').setAttribute("data-duration", TOTAL_DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["code-of-ethics"] = tl;
    </script>
  </div>
</body>
</html>
