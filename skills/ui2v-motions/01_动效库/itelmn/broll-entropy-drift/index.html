<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"accent","type":"color","label":"Entropy accent","default":"#d8ff3e"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--bg:#0b0c0b;--ink:#f0f2e8;--muted:#767b72}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#clip{position:absolute;inset:0;overflow:hidden}
.grain{position:absolute;inset:0;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.16) .8px,transparent .8px);background-size:9px 9px}
header{position:absolute;left:86px;right:86px;top:64px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #343834;padding-bottom:22px}
header h1{margin:0;font:900 82px/.9 Arial,sans-serif;letter-spacing:-.06em}
header .law{width:640px;text-align:right;font:700 18px/1.45 "Courier New",monospace;letter-spacing:.08em;color:#a9aea3}
#chamber{position:absolute;left:86px;top:205px;width:1748px;height:650px;border:3px solid var(--ink);overflow:hidden;background-image:linear-gradient(rgba(216,255,62,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(216,255,62,.055) 1px,transparent 1px);background-size:50px 50px}
#partition{position:absolute;left:560px;top:0;width:6px;height:100%;background:var(--accent);transform-origin:center}
#partition:after{content:"BOUNDARY";position:absolute;top:20px;left:18px;font:700 15px "Courier New",monospace;letter-spacing:.12em;color:var(--accent);writing-mode:vertical-rl}
#particles{position:absolute;inset:0}
.particle{position:absolute;width:18px;height:18px;background:var(--ink);will-change:transform;box-shadow:0 0 0 1px rgba(11,12,11,.35)}
.particle:nth-child(5n){background:var(--accent);width:24px;height:24px}.particle:nth-child(7n){border-radius:50%}
.state-label{position:absolute;top:28px;font:900 30px "Courier New",monospace;letter-spacing:.08em;z-index:3}
#low-label{left:30px;color:var(--accent)}#high-label{right:30px;opacity:0}
.measure{position:absolute;left:86px;right:86px;bottom:67px;display:grid;grid-template-columns:160px 1fr 180px;gap:26px;align-items:center}
.measure span{font:800 18px "Courier New",monospace;letter-spacing:.1em}
.meter{height:26px;border:3px solid var(--ink);padding:4px}.meter-fill{height:100%;width:100%;background:var(--accent);transform-origin:left}
#reading{text-align:right;color:var(--accent);font-size:24px}.no-labels header,.no-labels .state-label,.no-labels .measure,.no-labels #partition:after{opacity:0}
</style></head>
<body><div id="stage" data-composition-id="broll-entropy-drift" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080">
<div id="clip" class="clip" data-start="0" data-duration="8" data-track-index="1"><div class="grain"></div>
<header><h1>ENTROPY</h1><div class="law">ORDERED MICROSTATES → MORE POSSIBLE ARRANGEMENTS<br/>AN ILLUSTRATIVE CLOSED SYSTEM</div></header>
<main id="chamber"><div id="particles"></div><div id="partition"></div><div class="state-label" id="low-label">LOW ENTROPY</div><div class="state-label" id="high-label">HIGH ENTROPY</div></main>
<footer class="measure"><span>DISORDER</span><div class="meter"><div class="meter-fill"></div></div><span id="reading">08%</span></footer>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const holder=document.getElementById('particles'),items=[];
for(let i=0;i<96;i++){const el=document.createElement('i');el.className='particle';const col=i%12,row=Math.floor(i/12);const sx=72+col*38,sy=140+row*54;el.style.left=sx+'px';el.style.top=sy+'px';holder.appendChild(el);const fx=80+((i*137)%1570),fy=75+((i*83+i*i*7)%520);items.push({el,dx:fx-sx,dy:fy-sy,rot:((i*47)%260)-130});}
const entropy={v:8};const tl=gsap.timeline({paused:true});
tl.fromTo('header',{y:-42,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);
tl.fromTo('.particle',{scale:0,autoAlpha:0},{scale:1,autoAlpha:1,duration:.48,stagger:{each:.004,from:'center'},ease:'back.out(1.7)'},.25);
tl.fromTo('#partition',{scaleY:0},{scaleY:1,duration:.55,ease:'power3.out'},.45);
tl.to('#partition',{scaleY:0,duration:.52,ease:'power3.in'},2.05);
items.forEach((o,i)=>{tl.to(o.el,{x:o.dx,y:o.dy,rotation:o.rot,duration:2.5+((i%7)*.08),ease:'power3.inOut'},2.15+((i%9)*.012));});
tl.to('#low-label',{x:-45,autoAlpha:0,duration:.38,ease:'power2.in'},2.15);
tl.fromTo('#high-label',{x:45,autoAlpha:0},{x:0,autoAlpha:1,duration:.55,ease:'power3.out'},4.55);
tl.fromTo('.meter-fill',{scaleX:.08},{scaleX:.93,duration:3.25,ease:'power3.inOut'},2.1);
tl.to(entropy,{v:93,duration:3.25,ease:'power3.inOut',onUpdate:()=>{document.getElementById('reading').textContent=Math.round(entropy.v).toString().padStart(2,'0')+'%';}},2.1);
tl.to('.particle:nth-child(3n)',{scale:1.35,duration:.4,yoyo:true,repeat:1,ease:'sine.inOut'},5.55);
tl.to('.particle:nth-child(4n)',{scale:.82,duration:.55,yoyo:true,repeat:1,ease:'sine.inOut'},5.7);
tl.to('#clip',{autoAlpha:0,duration:.34,ease:'power2.in'},7.62);
tl.seek(0);window.__timelines['broll-entropy-drift']=tl;
</script></body></html>
