<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08111f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #08111f; }
      svg { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; }
      .blob {
        fill: url(#g);
        filter: drop-shadow(0 20px 60px rgba(56, 189, 248, 0.35));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <svg class="clip" data-start="0" data-duration="4.5" data-track-index="0" viewBox="0 0 400 400">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7dd3fc" />
            <stop offset="55%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0369a1" />
          </linearGradient>
        </defs>
        <path id="blob" class="blob" d="M200,70 C270,70 330,130 330,200 C330,270 270,330 200,330 C130,330 70,270 70,200 C70,130 130,70 200,70 Z" />
      </svg>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const a = "M200,70 C270,70 330,130 330,200 C330,270 270,330 200,330 C130,330 70,270 70,200 C70,130 130,70 200,70 Z";
      const b = "M200,55 C295,80 350,150 320,230 C290,320 220,350 150,330 C70,305 55,220 85,150 C115,80 150,45 200,55 Z";
      const c = "M210,80 C280,50 345,120 340,200 C335,290 250,345 170,325 C85,300 60,210 95,140 C125,80 155,95 210,80 Z";
      gsap.set("#blob", { scale: 0.7, opacity: 0, transformOrigin: "200px 200px" });
      tl.to("#blob", { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.15)
        .to("#blob", { attr: { d: b }, duration: 1.3, ease: "sine.inOut" }, 0.9)
        .to("#blob", { attr: { d: c }, duration: 1.2, ease: "sine.inOut" }, 2.2)
        .to("#blob", { attr: { d: a }, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
