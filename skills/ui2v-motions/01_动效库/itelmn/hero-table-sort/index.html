<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8fafc; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f8fafc; }
      .copy {
        position: absolute; left: 120px; top: 120px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #0f172a;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #0284c7; margin-bottom: 16px; font-weight: 600;
      }
      .title { font-size: 72px; font-weight: 700; letter-spacing: -0.04em; }
      .table {
        position: absolute; left: 120px; top: 280px; width: 1680px;
        background: #fff; border-radius: 22px; border: 1px solid #e2e8f0;
        overflow: hidden; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
        font-family: "Segoe UI", sans-serif;
      }
      .tr {
        display: grid; grid-template-columns: 1.4fr 1fr 0.8fr 0.8fr;
        padding: 0 40px; height: 92px; align-items: center;
        border-bottom: 1px solid #f1f5f9; font-size: 28px; color: #334155;
      }
      .tr.head {
        height: 80px; background: #f8fafc; color: #64748b; font-size: 22px;
        letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;
      }
      .tr.head .sort {
        display: inline-flex; align-items: center; gap: 10px; color: #0284c7;
      }
      .arrow { display: inline-block; transform: rotate(180deg); }
      .downloads { font-variant-numeric: tabular-nums; font-weight: 600; color: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Data · Order</div>
        <div class="title">Table Sort</div>
      </div>
      <div id="table" class="clip table" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="tr head">
          <div>Motion</div>
          <div>Owner</div>
          <div class="sort">Downloads <span class="arrow" id="arrow">▲</span></div>
          <div>Updated</div>
        </div>
        <div class="tr" id="r1"><div>hero-progress-ring</div><div>itelmn</div><div class="downloads">1,240</div><div>today</div></div>
        <div class="tr" id="r2"><div>hero-sparkline-rise</div><div>itelmn</div><div class="downloads">980</div><div>today</div></div>
        <div class="tr" id="r3"><div>hero-toast-stack</div><div>itelmn</div><div class="downloads">2,410</div><div>yesterday</div></div>
        <div class="tr" id="r4"><div>hero-deploy-pipeline</div><div>itelmn</div><div class="downloads">640</div><div>today</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, y: 12 });
      gsap.set("#table", { opacity: 0, y: 24 });
      gsap.set(["#r1", "#r2", "#r3", "#r4"], { y: 0 });
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#table", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.25)
        .to("#arrow", { rotation: 0, duration: 0.35, ease: "power2.out" }, 1.2)
        .to("#r3", { y: -184, duration: 0.85, ease: "power3.inOut" }, 1.55)
        .to("#r1", { y: 92, duration: 0.85, ease: "power3.inOut" }, 1.55)
        .to("#r2", { y: 92, duration: 0.85, ease: "power3.inOut" }, 1.55)
        .to("#r3", { backgroundColor: "rgba(14,165,233,0.08)", duration: 0.3 }, 2.5)
        .to("#r3", { backgroundColor: "rgba(14,165,233,0)", duration: 0.5 }, 2.9)
        .to("#table", { y: -6, duration: 1.1, ease: "sine.inOut" }, 3.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
