<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #052e16; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #14532d 0%, #052e16 70%);
      }
      .copy {
        position: absolute; left: 140px; top: 260px; color: #ecfdf5;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #86efac; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 88px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 24px; font-size: 28px; color: #bbf7d0; max-width: 500px; line-height: 1.45; }
      .stage {
        position: absolute; right: 120px; top: 280px; width: 980px; height: 520px;
      }
      .card {
        position: absolute; width: 360px; height: 220px; border-radius: 24px;
        background: #fff; padding: 36px 32px; font-family: "Segoe UI", sans-serif;
        box-shadow: 0 24px 50px rgba(0,0,0,0.25);
      }
      .from { left: 40px; top: 120px; }
      .to { right: 40px; top: 120px; }
      .card label { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b7280; }
      .card strong { display: block; margin-top: 16px; font-size: 40px; color: #052e16; }
      .card span { display: block; margin-top: 10px; font-size: 24px; color: #16a34a; font-weight: 700; }
      .packet {
        position: absolute; left: 320px; top: 190px; width: 160px; height: 72px;
        border-radius: 999px; background: #22c55e; color: #052e16;
        display: grid; place-items: center; font-family: "Segoe UI", sans-serif;
        font-size: 26px; font-weight: 800; box-shadow: 0 12px 30px rgba(34, 197, 94, 0.45);
      }
      .rail {
        position: absolute; left: 380px; right: 380px; top: 224px; height: 4px;
        background: rgba(187, 247, 208, 0.35); border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Payments · Move</div>
        <div class="title">Transfer Flow</div>
        <div class="sub">A value packet travels from wallet to destination.</div>
      </div>
      <div id="stage" class="clip stage" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="rail"></div>
        <div class="card from" id="from">
          <label>From</label>
          <strong>Studio Wallet</strong>
          <span id="fromBal">$2,400.00</span>
        </div>
        <div class="packet" id="packet">$120</div>
        <div class="card to" id="to">
          <label>To</label>
          <strong>Creator Payout</strong>
          <span id="toBal">$860.00</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const fromBal = document.getElementById("fromBal");
      const toBal = document.getElementById("toBal");
      const from = { v: 2400 };
      const to = { v: 860 };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#stage", { opacity: 0, y: 24 });
      gsap.set("#packet", { x: 0, opacity: 0, scale: 0.9 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#stage", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#packet", { opacity: 1, scale: 1, duration: 0.35 }, 1.0)
        .to("#packet", { x: 420, duration: 1.6, ease: "power2.inOut" }, 1.4)
        .to(from, {
          v: 2280, duration: 1.6, ease: "power2.inOut",
          onUpdate: () => { fromBal.textContent = "$" + from.v.toFixed(2); }
        }, 1.4)
        .to(to, {
          v: 980, duration: 1.6, ease: "power2.inOut",
          onUpdate: () => { toBal.textContent = "$" + to.v.toFixed(2); }
        }, 1.4)
        .to("#packet", { opacity: 0, scale: 0.85, duration: 0.3 }, 3.05)
        .to("#to", { scale: 1.03, duration: 0.25, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 3.1)
        .to("#stage", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
