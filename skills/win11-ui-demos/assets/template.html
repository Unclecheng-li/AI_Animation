<!-- ============================================================
  ◆ 仿 Win11 演示页模板（复制本文件后只改"画面层"与 cue）◆
  内置：虚拟时钟黑场播放器 / WebAudio 音效 / 1920×1080 舞台 / 镜头层
        时间轴引擎 / WIN11 仿真套件（桌面/任务栏/资源管理器/对话框/
        通知/光标演出）/ 角色位 / HUD
  壁纸：默认纯 CSS Bloom 渐变；要真实壁纸执行
        cp examples/wukong-c-clean/material/ <输出目录>/ 后取消 #wpl 注释
  组件规格与叙事手法见 references/，此处只标"改这里"。
============================================================= -->
<script>
/* ===== [不动] 播放器引导：虚拟时钟 + 黑场起手 ===== */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();}
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
/* ===== [不动] SFX 引擎：pop whoosh swipe type ding thud ===== */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){if(!ok())return;vol=vol||1;var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';var f=330+Math.random()*90;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);}
  function whoosh(durS,vol){if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);}
  function swipe(vol){if(!ok())return;vol=vol||1;var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);}
  function type(vol){if(!ok())return;vol=vol||1;var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=1400+Math.random()*900;var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;env(g,t,0.004,0.1*vol,0.05);o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);}
  function ding(vol){if(!ok())return;vol=vol||1;var t=ctx.currentTime;[[660,0.2],[990,0.09]].forEach(function(p){var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);});}
  function thud(vol){if(!ok())return;vol=vol||1;var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);}
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

<style>
/* ===== [不动] 舞台：Windows 11 桌面（字体=系统栈，零 webfont） ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#111;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif}
body.paused *{animation-play-state:paused!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);overflow:hidden;background:#16366e}

  background:
    radial-gradient(1200px 800px at 50% 42%,rgba(120,180,255,.5),transparent 62%),
    radial-gradient(700px 500px at 38% 34%,rgba(230,120,170,.38),transparent 60%),
    radial-gradient(900px 620px at 64% 60%,rgba(70,140,240,.42),transparent 64%),
    radial-gradient(560px 420px at 52% 50%,rgba(255,255,255,.28),transparent 58%),
    conic-gradient(from 200deg at 50% 44%,#1e3f8f,#2a5fc0 25%,#7a4fd0 50%,#20499e 75%,#1e3f8f);

/* 任务栏 */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(238,244,252,.82);backdrop-filter:blur(18px);z-index:36;display:flex;align-items:center;box-shadow:0 -1px 0 rgba(0,0,0,.08)}
#taskbar .tb-apps{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center}

#taskbar .tb.active::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:#0067c0}

/* 资源管理器窗口 */
.win{position:absolute;background:#f3f6fb;border:1px solid rgba(0,0,0,.14);border-radius:10px;box-shadow:0 24px 70px rgba(2,16,46,.45),0 2px 8px rgba(2,16,46,.2);overflow:hidden;opacity:0;transform:translateY(26px) scale(.97);transition:all .7s cubic-bezier(.16,1,.3,1)}

.wtitle{height:44px;display:flex;align-items:center;background:#f3f6fb;padding:0 10px;gap:8px}

.waddr .navs{display:flex;gap:2px;color:#555}
.waddr .navs i{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:5px}

.addrbar{flex:1;height:32px;border:1px solid rgba(0,0,0,.12);border-radius:5px;background:#fff;display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:#222;gap:6px}
.addrbar .crumb{color:#666}

.wbody{display:flex;height:calc(100% - 44px - 46px - 26px)}
.wnav{width:216px;padding:10px 8px;font-size:12.5px;color:#222;border-right:1px solid rgba(0,0,0,.05)}
.wnav .ni{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;color:#333}
.wnav .ni:hover{background:rgba(0,0,0,.045)}
.wnav .ni.on{background:rgba(0,103,192,.1)}
.wmain{flex:1;position:relative;background:#fff;overflow:hidden}
.wstatus{height:26px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:#555;background:#f3f6fb;border-top:1px solid rgba(0,0,0,.06);gap:18px}
/* 此电脑 · 驱动器磁贴 */
.view{position:absolute;inset:0;padding:18px 22px;transition:opacity .45s ease,transform .45s ease}
.view.hide{opacity:0;transform:scale(.985);pointer-events:none}
.drives{display:flex;gap:26px;margin-top:8px}
.drive{width:340px;border-radius:6px;padding:14px 16px 12px;display:flex;gap:14px;align-items:center;border:1px solid transparent}
.drive.sel{background:#f0f6fd;border-color:#d5e6f8}
.drive .dico{width:52px;height:52px;flex:none}
.drive .dname{font-size:13px;color:#1b1b1b}
.dbar{height:5px;border-radius:3px;background:#e3e3e3;margin:8px 0 6px;overflow:hidden}
.dbar i{display:block;height:100%;border-radius:3px;background:#2f80d8;width:0;transition:width 1.1s cubic-bezier(.2,.8,.3,1),background .4s}
.dbar i.red{background:#d13438;animation:barPulse 1s ease-in-out infinite alternate}
@keyframes barPulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
.dcap{font-size:12px;color:#777}
.dcap.warn{color:#c42b1c;font-weight:600}
/* 文件网格（大图标视图）+ 教学问号徽章 + poof 删除 */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
.fitem{position:relative;text-align:center;padding:12px 4px 9px;border-radius:6px;border:1px solid transparent;opacity:0;transform:translateY(14px);transition:all .45s cubic-bezier(.16,1,.3,1)}
.fitem.in{opacity:1;transform:translateY(0)}
.fitem:hover{background:#f5f9fe}
.fitem.sel{background:#e8f2fc;border-color:#cfe5fa}
.fitem.half .fic{opacity:.55}
.fic{width:66px;height:52px;margin:0 auto 7px;position:relative}
.fname{font-size:12.5px;color:#1b1b1b;line-height:1.3;word-break:break-all}
.fitem .q{position:absolute;top:-14px;left:50%;transform:translateX(-50%) scale(0);width:30px;height:30px;border-radius:50%;background:#ffb900;color:#5b4100;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(120,80,0,.3);transition:transform .4s cubic-bezier(.34,1.6,.64,1);z-index:3}
.fitem .q.pop{transform:translateX(-50%) scale(1)}
.fitem.poof{animation:poof .5s cubic-bezier(.3,1.3,.5,1) forwards}

/* 右键菜单 */
.ctx{position:absolute;min-width:220px;background:rgba(249,249,249,.98);border:1px solid rgba(0,0,0,.12);border-radius:8px;box-shadow:0 14px 40px rgba(2,16,46,.28);padding:4px;z-index:33;opacity:0;transform:scale(.94);transform-origin:top left;transition:all .16s ease;pointer-events:none}

/* WinRE 全屏蓝（自动修复/蓝屏场景） */

<script>
/* ===== [不动] 时间轴引擎 ===== */
const DUR=12000;                       /* [改这里] = 本镜头规定时长(ms) */
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const after=(ms,f)=>on(performance.now()-t0+ms,f);
function fly(el,x1,y1,x2,y2,dur,arc,ease,done){tws.push({t:performance.now()-t0,d:dur,e:ease||eio,done,f:p=>{el.style.left=(x1+(x2-x1)*p)+'px';el.style.top=(y1+(y2-y1)*p-Math.sin(p*Math.PI)*(arc||0))+'px'}})}
function cnt(el,from,to,dur){tws.push({t:performance.now()-t0,d:dur,e:eo,f:p=>{el.textContent=Math.round(from+(to-from)*p).toLocaleString('en-US')}})}
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}

/* ===== [不动] 光标演出 API：curTo 移动 / clickFx 点击（双击=两次） ===== */
const cur=$('#cur');
function curTo(x,y,dur,arc){const l=parseFloat(cur.style.left)||1760,t=parseFloat(cur.style.top)||960;fly(cur,l,t,x,y,dur,arc||26)}
function clickFx(){cur.classList.remove('click');void cur.offsetWidth;cur.classList.add('click')}

/* ────────────────────────────────────────────────
   [改这里] 本镜头 cue（示例 12s；注释引用口播节拍，不做字幕条）
   ──────────────────────────────────────────────── */
on(300,()=>camTo(0,0,1,2.2));                                   // 开场拉镜：特写 → 桌面全景
on(450,()=>$('#expWin').classList.add('show'));
document.querySelectorAll('.dicon').forEach((d,i)=>on(480+i*110,()=>d.classList.add('show')));
on(900,()=>{$('#barC').style.width='93%';__sfx.pop(.35)});      // (0:00) 容量条填充
on(1500,()=>{$('#barC').classList.add('red');__sfx.ding(.5)});  // 爆红
on(3000,()=>{$('#toast').classList.add('in');__sfx.pop(.6)});   // (0:03) 系统通知滑入
on(4800,()=>$('#toast').classList.remove('in'));
on(6600,()=>{cur.classList.add('show');curTo(669,283,900)});    // (0:07) 光标登场 → 目标
on(7600,()=>clickFx());                                          // 点击
on(7900,()=>{                                                     // 双击进入 C:\ —— 视图切换三同步
  $('#viewPC').classList.add('hide');$('#viewC').classList.remove('hide');
  $('#wtabTxt').textContent='本地磁盘 (C:)';
  $('#addrTxt').innerHTML='此电脑 <span class="crumb">›</span> 本地磁盘 (C:)';
  $('#statL').textContent='3 个项目';
});
document.querySelectorAll('.fitem').forEach((f,i)=>on(7950+i*95,()=>{f.classList.add('in');__sfx.type(.3)}));
on(9600,()=>{camFocus(960,300,1.13,1.0)});                       // 推近强调
on(11000,()=>{camTo(0,0,1,1.1)});                                // 收尾拉回
