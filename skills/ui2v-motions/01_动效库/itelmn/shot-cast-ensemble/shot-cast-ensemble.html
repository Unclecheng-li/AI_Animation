<!doctype html>
<html lang="en">
  <head></head>
  <body>
    <template
      ><style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .cce-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #ecebe6;
          font-family: Inter, sans-serif;
          color: #292824;
          background-image: radial-gradient(#cbc9c2 2px, transparent 2px);
          background-size: 46px 46px;
        }
        .cce-note {
          position: absolute;
          width: 230px;
          height: 210px;
          padding: 18px;
          border: 2px solid #c9c7c0;
          border-radius: 6px;
          background: #e6e6e2;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }
        .cce-note i {
          display: block;
          width: 70%;
          height: 12px;
          margin-bottom: 12px;
          border-radius: 6px;
          background: #77756f;
        }
        .cce-note i:nth-child(n + 2) {
          height: 10px;
          background: #cac8c1;
        }
        .cce-main {
          position: absolute;
          left: 660px;
          top: 420px;
          width: 600px;
          height: 240px;
          padding: 30px;
          border: 2px solid #c9c7c0;
          border-radius: 12px;
          background: #fff;
          box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
        }
        .cce-main i {
          display: block;
          width: 180px;
          height: 14px;
          margin-bottom: 24px;
          border-radius: 7px;
          background: #77756f;
        }
        .cce-copy {
          font-size: 44px;
          font-weight: 800;
        }
        .cce-cursor {
          position: absolute;
          z-index: 10;
          transform-origin: 0 0;
        }
        .cce-cursor svg {
          display: block;
          overflow: visible;
        }
        .cce-tag {
          position: absolute;
          left: 24px;
          top: 40px;
          padding: 4px 11px;
          border-radius: 7px;
          color: #111;
          font-size: 14px;
          font-weight: 800;
          white-space: nowrap;
          opacity: 0;
        }
        .cce-caption {
          position: absolute;
          left: 62px;
          bottom: 48px;
          color: #65635e;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 4px;
        }
      </style>
      <div
        data-hf-id="hf-cce-root"
        id="cce-root"
        data-composition-id="shot-cast-ensemble"
        data-start="0"
        data-duration="4.667"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="cce-fill">
          <div
            class="cce-note"
            style="left: 250px; top: 170px; transform: rotate(-3deg)"
          >
            <i></i><i></i><i></i>
          </div>
          <div
            class="cce-note"
            style="left: 1490px; top: 140px; transform: rotate(2deg)"
          >
            <i></i><i></i><i></i>
          </div>
          <div
            class="cce-note"
            style="left: 210px; top: 700px; transform: rotate(3deg)"
          >
            <i></i><i></i><i></i>
          </div>
          <div
            class="cce-note"
            style="left: 1530px; top: 690px; transform: rotate(-2deg)"
          >
            <i></i><i></i><i></i>
          </div>
          <div class="cce-main">
            <i></i>
            <div id="cce-copy" class="cce-copy" data-layout-allow-overlap></div>
          </div>
          <div id="cce-cursors"></div>
          <div class="cce-caption">COLLABORATION AS AN AMBIENT LAYER</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var host = document.getElementById("cce-cursors"),
            copy = document.getElementById("cce-copy"),
            tl = gsap.timeline({ paused: true }),
            actors = [
              ["Lisa", "#4c8df6", -160, 200, 430, 330, 770, 430],
              ["Lucas", "#2fbf71", 2080, 160, 1370, 290, 1160, 420],
              ["Marta", "#f2994a", -160, 900, 560, 760, 800, 640],
              ["Niko", "#4c8df6", 2080, 950, 1420, 780, 1130, 650],
              ["Rita", "#2fbf71", 900, -180, 960, 545, 960, 545],
            ],
            txt = "Our customers love it";
          actors.forEach(function (a, i) {
            var d = document.createElement("div");
            d.className = "cce-cursor";
            d.setAttribute("data-layout-allow-overflow", "");
            d.setAttribute("data-layout-allow-overlap", "");
            d.innerHTML =
              '<svg width="30" height="44" viewBox="0 0 13.5 20"><path d="M.5.5v16.7l4.2-3.8 2.6 6.1 2.7-1.2-2.6-6H13Z" fill="' +
              a[1] +
              '" stroke="#fff" stroke-width="1.1"/></svg><div class="cce-tag" style="background:' +
              a[1] +
              '">' +
              a[0] +
              "</div>";
            host.appendChild(d);
            d.querySelector(".cce-tag").setAttribute(
              "data-layout-allow-overflow",
              "",
            );
            d.querySelector(".cce-tag").setAttribute(
              "data-layout-allow-overlap",
              "",
            );
            gsap.set(d, { x: a[2], y: a[3], scale: 2.1 });
            tl.to(
              d,
              { x: a[4], y: a[5], duration: 0.9, ease: "back.out(1.3)" },
              i * 0.16,
            )
              .to(
                d.querySelector(".cce-tag"),
                { opacity: 1, y: 0, duration: 0.4 },
                i * 0.16 + 0.4,
              )
              .to(
                d,
                {
                  keyframes: [
                    { x: a[4] + 35, y: a[5] - 24, duration: 0.7 },
                    { x: a[4] - 28, y: a[5] + 20, duration: 0.7 },
                    { x: a[4] + 18, y: a[5] + 8, duration: 0.7 },
                  ],
                  ease: "sine.inOut",
                },
                1.2 + i * 0.04,
              )
              .to(
                d,
                { x: a[6], y: a[7], duration: 0.867, ease: "power2.inOut" },
                3.067,
              );
          });
          txt.split("").forEach(function (ch, i) {
            tl.call(
              function () {
                copy.textContent = txt.slice(0, i + 1);
              },
              null,
              1.933 + i / 30,
            );
          });
          window.__timelines["shot-cast-ensemble"] = tl;
        })();
      </script></template
    >
  </body>
</html>
