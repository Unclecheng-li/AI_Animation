<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      .term {
        position: absolute; left: 160px; top: 160px; width: 1600px; height: 760px;
        border-radius: 18px; background: #0b1220; border: 1px solid #1e293b;
        padding: 48px 56px; font-family: Consolas, "Courier New", monospace; color: #e2e8f0;
      }
      .chrome { margin-bottom: 36px; color: #64748b; font-size: 22px; }
      .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
      .line { font-size: 34px; line-height: 1.7; min-height: 1.7em; white-space: pre; }
      .prompt { color: #22d3ee; }
      .ok { color: #4ade80; }
      .dim { color: #94a3b8; }
      .cursor {
        display: inline-block; width: 16px; height: 34px; background: #22d3ee; vertical-align: -6px; margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="term" class="clip term" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="chrome"><span class="dot" style="background:#f87171"></span><span class="dot" style="background:#fbbf24"></span><span class="dot" style="background:#4ade80"></span> ui2v — publish</div>
        <div class="line" id="l1"><span class="prompt">$</span> <span id="t1"></span><span class="cursor" id="cur"></span></div>
        <div class="line dim" id="l2"></div>
        <div class="line ok" id="l3"></div>
        <div class="line" id="l4"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const cmd = "ui2v motion publish ./hero-typewriter-log --version 1.0.0";
      const state = { i: 0 };
      const t1 = document.getElementById("t1");
      gsap.set("#term", { opacity: 0, y: 20 });
      gsap.set(["#l2","#l3","#l4"], { opacity: 0 });
      gsap.set("#cur", { opacity: 1 });
      tl.to("#term", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to(state, {
          i: cmd.length,
          duration: 2.0,
          ease: "none",
          onUpdate: () => { t1.textContent = cmd.slice(0, Math.round(state.i)); },
        }, 0.4)
        .to("#cur", { opacity: 0, duration: 0.1 }, 2.4)
        .to("#l2", { opacity: 1, duration: 0.2, onStart: () => { document.getElementById("l2").textContent = "packing composition + registry-item.json"; } }, 2.5)
        .to("#l3", { opacity: 1, duration: 0.2, onStart: () => { document.getElementById("l3").textContent = "OK published hero-typewriter-log@1.0.0"; } }, 3.0)
        .to("#l4", { opacity: 1, duration: 0.2, onStart: () => { document.getElementById("l4").innerHTML = '<span class="prompt">$</span> <span class="cursor"></span>'; } }, 3.5)
        .to(".cursor", { opacity: 0, duration: 0.25, yoyo: true, repeat: 2 }, 3.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
