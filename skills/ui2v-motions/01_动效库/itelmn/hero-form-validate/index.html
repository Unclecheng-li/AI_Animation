<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #eff6ff; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(165deg, #eff6ff 0%, #dbeafe 45%, #f8fafc 100%);
      }
      .copy {
        position: absolute; left: 140px; top: 260px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #0f172a;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #2563eb; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 88px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 24px; font-size: 28px; color: #475569; max-width: 500px; line-height: 1.45; }
      .form {
        position: absolute; right: 140px; top: 180px; width: 780px;
        background: #fff; border-radius: 28px; padding: 48px 52px;
        box-shadow: 0 24px 60px rgba(37, 99, 235, 0.12);
        border: 1px solid #bfdbfe; font-family: "Segoe UI", sans-serif;
      }
      .field { margin-bottom: 28px; }
      .field label {
        display: block; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase;
        color: #64748b; margin-bottom: 12px; font-weight: 700;
      }
      .input {
        height: 76px; border-radius: 16px; border: 2px solid #cbd5e1;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 24px; font-size: 28px; color: #0f172a; background: #f8fafc;
      }
      .input.ok { border-color: #16a34a; background: #f0fdf4; }
      .check {
        width: 36px; height: 36px; border-radius: 50%; background: #16a34a; color: #fff;
        display: grid; place-items: center; font-weight: 800; opacity: 0; transform: scale(0.6);
      }
      .btn {
        margin-top: 12px; height: 80px; border-radius: 16px; background: #2563eb; color: #fff;
        display: grid; place-items: center; font-size: 28px; font-weight: 700;
        opacity: 0.4;
      }
      .btn.ready { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Forms · Trust</div>
        <div class="title">Form Validate</div>
        <div class="sub">Fields clear checks, then the submit button unlocks.</div>
      </div>
      <div id="form" class="clip form" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="field">
          <label>Workspace name</label>
          <div class="input" id="i1">
            <span>ui2v-studio</span>
            <div class="check" id="c1">✓</div>
          </div>
        </div>
        <div class="field">
          <label>Handle</label>
          <div class="input" id="i2">
            <span>@itelmn</span>
            <div class="check" id="c2">✓</div>
          </div>
        </div>
        <div class="field">
          <label>Contact email</label>
          <div class="input" id="i3">
            <span>studio@ui2v.com</span>
            <div class="check" id="c3">✓</div>
          </div>
        </div>
        <div class="btn" id="btn">Create workspace</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const mark = (inputId, checkId) => {
        document.getElementById(inputId).classList.add("ok");
        gsap.to("#" + checkId, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" });
      };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#form", { opacity: 0, y: 24 });
      gsap.set(["#c1", "#c2", "#c3"], { opacity: 0, scale: 0.6 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#form", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to({}, { duration: 0.01, onStart: () => mark("i1", "c1") }, 1.1)
        .to({}, { duration: 0.01, onStart: () => mark("i2", "c2") }, 1.7)
        .to({}, { duration: 0.01, onStart: () => mark("i3", "c3") }, 2.3)
        .to({}, { duration: 0.01, onStart: () => document.getElementById("btn").classList.add("ready") }, 2.85)
        .to("#btn", { scale: 1.03, duration: 0.2, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 3.0)
        .to("#form", { y: -8, duration: 1.0, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
