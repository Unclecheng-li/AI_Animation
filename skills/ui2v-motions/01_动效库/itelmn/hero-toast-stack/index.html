<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f5; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(160deg, #fafafa 0%, #e4e4e7 100%);
      }
      .copy {
        position: absolute; left: 140px; top: 280px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #18181b;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #71717a; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #52525b; max-width: 520px; line-height: 1.45; }
      .stack {
        position: absolute; right: 160px; top: 220px; width: 560px;
        display: flex; flex-direction: column; gap: 18px;
      }
      .toast {
        background: #fff; border-radius: 18px; padding: 28px 32px;
        box-shadow: 0 18px 40px rgba(24, 24, 27, 0.1);
        border: 1px solid #e4e4e7; display: grid; grid-template-columns: 48px 1fr; gap: 18px;
        align-items: start;
      }
      .dot {
        width: 48px; height: 48px; border-radius: 14px;
        display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px;
      }
      .dot.ok { background: #16a34a; }
      .dot.info { background: #2563eb; }
      .dot.warn { background: #d97706; }
      .toast h4 {
        font-family: "Segoe UI", sans-serif; font-size: 28px; font-weight: 700; color: #18181b;
      }
      .toast p {
        margin-top: 8px; font-family: "Segoe UI", sans-serif; font-size: 22px; color: #71717a; line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">System · Feedback</div>
        <div class="title">Toast Stack</div>
        <div class="sub">Success, info, and warning notices land in a tidy column.</div>
      </div>
      <div id="stack" class="clip stack" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="toast" id="t1">
          <div class="dot ok">✓</div>
          <div>
            <h4>Motion published</h4>
            <p>hero-progress-ring@1.0.0 is live</p>
          </div>
        </div>
        <div class="toast" id="t2">
          <div class="dot info">i</div>
          <div>
            <h4>Sync finished</h4>
            <p>3 packages updated on this device</p>
          </div>
        </div>
        <div class="toast" id="t3">
          <div class="dot warn">!</div>
          <div>
            <h4>Rate limit cooling</h4>
            <p>Publish window resets in 40s</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set(["#t1", "#t2", "#t3"], { opacity: 0, x: 48, y: -8 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#t1", { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 0.55)
        .to("#t2", { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 1.15)
        .to("#t3", { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 1.75)
        .to("#t1", { y: -4, duration: 1.4, ease: "sine.inOut" }, 2.5)
        .to("#t2", { y: -4, duration: 1.4, ease: "sine.inOut" }, 2.6)
        .to("#t3", { y: -4, duration: 1.4, ease: "sine.inOut" }, 2.7);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
