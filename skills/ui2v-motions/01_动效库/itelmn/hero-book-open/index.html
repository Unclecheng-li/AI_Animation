<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #44403c; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(80% 70% at 50% 40%, #57534e, #292524);
      }
      .label {
        position: absolute; left: 160px; top: 120px;
        font-family: "Segoe UI", sans-serif; font-size: 24px; letter-spacing: 0.28em;
        text-transform: uppercase; color: #d6d3d1;
      }
      .title {
        position: absolute; left: 160px; top: 180px;
        font-family: Georgia, serif; font-size: 84px; color: #fafaf9;
      }
      .book {
        position: absolute; left: 560px; top: 320px; width: 800px; height: 520px;
        perspective: 1600px;
      }
      .page {
        position: absolute; top: 0; width: 400px; height: 520px;
        background: #f5f5f4; border: 1px solid #d6d3d1;
        box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        padding: 48px 40px; font-family: Georgia, serif; color: #1c1917;
      }
      .left { left: 0; border-radius: 8px 0 0 8px; transform-origin: 100% 50%; }
      .right { left: 400px; border-radius: 0 8px 8px 0; transform-origin: 0% 50%; }
      .page h3 { font-size: 36px; margin-bottom: 24px; }
      .page p { font-size: 24px; line-height: 1.55; color: #44403c; }
      .spine {
        position: absolute; left: 392px; top: 0; width: 16px; height: 520px;
        background: linear-gradient(90deg, #a8a29e, #78716c, #a8a29e); z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="label" class="clip label" data-start="0" data-duration="4.5" data-track-index="0">Story · Object</div>
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="1">Book Open</div>
      <div id="book" class="clip book" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="page left" id="left">
          <h3>Chapter 01</h3>
          <p>Every motion starts as a brief. Open the book, set the beat, then compose with intention.</p>
        </div>
        <div class="spine"></div>
        <div class="page right" id="right">
          <h3>Chapter 02</h3>
          <p>HyperFrames turns the page into a timeline — seek-safe, publishable, ready for the registry.</p>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#label", "#title"], { opacity: 0, y: 16 });
      gsap.set("#book", { opacity: 0, y: 30 });
      gsap.set("#left", { rotateY: 78 });
      gsap.set("#right", { rotateY: -78 });
      tl.to("#label", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#title", { opacity: 1, y: 0, duration: 0.5 }, 0.25)
        .to("#book", { opacity: 1, y: 0, duration: 0.45 }, 0.4)
        .to("#left", { rotateY: 0, duration: 1.15, ease: "power3.out" }, 0.65)
        .to("#right", { rotateY: 0, duration: 1.15, ease: "power3.out" }, 0.65)
        .to("#book", { y: -12, duration: 2.0, ease: "sine.inOut" }, 2.1);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
