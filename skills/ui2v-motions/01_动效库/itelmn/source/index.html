<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>微观宇宙</title><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:Mont;src:url('assets/montserrat.woff2');font-weight:100 900}@font-face{font-family:Mono;src:url('assets/mono.woff2')}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{font-family:Noto,sans-serif;background:#08191d;color:#e9fff8}#stage{width:1920px;height:1080px;position:relative;overflow:hidden} .clip{position:absolute;inset:0}h1,h2,p{margin:0} .mono{font-family:Mono,monospace}.eng{font-family:Mont,sans-serif}.eyebrow{font:22px Mono;letter-spacing:4px}.header{display:flex;justify-content:space-between;align-items:center;padding:64px 96px;position:relative;z-index:5}.footer{position:absolute;left:96px;right:96px;bottom:54px;display:flex;justify-content:space-between;align-items:center;font-size:24px;z-index:5}.rule{height:1px;background:currentColor;opacity:.22;position:absolute;left:96px;right:96px;top:128px}.tag{border:1px solid currentColor;padding:10px 18px;font:18px Mono;letter-spacing:3px}.progress{position:absolute;bottom:0;left:0;width:1920px;height:4px;transform-origin:left center}.reveal{display:block;overflow:hidden}.reveal span{display:block}.caption{font-size:28px;line-height:1.7}svg{display:block}.dec{pointer-events:none}.title{font-size:94px;font-weight:600;line-height:1.25;letter-spacing:-4px}.corner{position:absolute;width:30px;height:30px;border-color:currentColor;opacity:.6}.small{font-size:24px}

#stage{background:radial-gradient(ellipse at 68% 51%,#154b46 0%,#0a262b 34%,#06151b 71%);--accent:#71f3d3}.progress{background:var(--accent)}.header,.footer{color:#b1d6cf}.micro-copy{position:absolute;left:96px;top:256px;width:730px;z-index:4}.micro-copy .title{font-size:102px;line-height:1.28}.micro-copy .secondary{font-size:55px;line-height:1.45;margin-top:16px;color:#78d8c3}.micro-copy .caption{margin-top:46px;color:#b4d6ce;max-width:550px}.micro-copy .idx{font:20px Mono;letter-spacing:3px;color:#80b9b2;margin-bottom:32px}.instrument{position:absolute;left:875px;top:155px;width:940px;height:770px;perspective:1300px}.orbital{position:absolute;width:660px;height:660px;left:140px;top:50px;transform-style:preserve-3d}.shell{position:absolute;inset:0;border:1px solid #66d6c44a;border-radius:50%;background:radial-gradient(circle at 34% 24%,#baffeb17,transparent 48%);box-shadow:inset 0 0 48px #b4ffef08;transform-style:preserve-3d}.shell:before{content:'';position:absolute;inset:16px;border-radius:50%;border:1px dashed #85e8d324}.ring-plane{position:absolute;inset:30px;border-radius:50%;border:2px solid #84e7cc73;transform-style:preserve-3d}.ring-plane:nth-of-type(3){border-color:#b3fff63a}.sat-arm{position:absolute;inset:0;transform-style:preserve-3d}.sat{position:absolute;width:26px;height:26px;border-radius:50%;top:calc(50% - 13px);left:-13px;background:radial-gradient(circle at 32% 24%,#fff,#c8fff0 20%,#4ac7ad 54%,#0b605e 80%);box-shadow:0 0 24px #8affdc6a;transform-style:preserve-3d}.nucleus{position:absolute;width:164px;height:164px;left:248px;top:248px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#eefff9 0%,#a1ffe7 10%,#38b699 40%,#0b403e 76%);box-shadow:0 0 100px #45efbd27,inset -18px -18px 30px #032f38;z-index:2}.nucleus:after{content:'';position:absolute;inset:19px;border-radius:50%;border:1px solid #d6fff142;box-shadow:inset 0 0 28px #98ffbd31}.orbit-grid{position:absolute;inset:0;border-radius:50%;border:1px solid #8deddb27}.micro-label{position:absolute;font:20px Mono;letter-spacing:2px;color:#a1d9cc;z-index:5;background:#0a272d;padding:8px 12px}.l1{left:86px;top:69px}.l2{right:5px;top:425px}.l3{left:145px;bottom:42px}.micro-leaders{position:absolute;inset:0;width:940px;height:770px;fill:none;stroke:#9debd18c;stroke-width:1}.micro-note{position:absolute;left:96px;top:778px;display:flex;gap:30px;align-items:center;color:#b4d6ce}.micro-note .badge{font:36px Mont;border:1px solid #749e9559;padding:12px 25px;border-radius:40px}.dotfield{position:absolute;inset:0;background-image:radial-gradient(#b1e4d91c 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to right,transparent 28%,black 65%)}.scan{position:absolute;left:880px;top:180px;width:870px;height:1px;background:linear-gradient(90deg,transparent,#83f7d744,transparent)}.scale-ticks{position:absolute;right:55px;top:195px;height:666px;width:15px;background:repeating-linear-gradient(to bottom,#75b0a76b 0 1px,transparent 1px 30px)}
</style></head><body><div id="stage" data-composition-id="micro-world" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080"><section id="micro-world-scene" class="clip" data-start="0" data-duration="8" data-track-index="0"><div class="dotfield dec" data-layout-ignore></div><div class="header"><span class="eyebrow">MICRO / OBSERVATORY</span><span class="tag">FIELD NOTE — 01</span></div><div class="rule"></div><div class="micro-copy"><div class="idx">BEYOND THE VISIBLE</div><h1 class="title"><span class="reveal"><span id="m-head">看不见的世界</span></span></h1><div class="reveal"><div class="secondary" id="m-sub">也在持续运转</div></div><p class="caption" id="m-cap">把视线拉近一点，<span style="display:block">复杂结构开始显现。</span></p></div><div class="instrument"><div class="orbital"><div class="orbit-grid"></div><div class="shell"></div><div class="ring-plane p1"><div class="sat-arm a1"><i class="sat"></i></div></div><div class="ring-plane p2"><div class="sat-arm a2"><i class="sat"></i></div></div><div class="ring-plane p3"><div class="sat-arm a3"><i class="sat"></i></div></div><div class="nucleus"></div></div><svg class="micro-leaders dec" data-layout-ignore viewBox="0 0 940 770"><path class="leader" d="M220 93 L335 93 L386 167"/><path class="leader" d="M788 436 L747 436 L669 385"/><path class="leader" d="M280 701 L375 701 L418 637"/></svg><span class="micro-label l1">01 / ORBIT</span><span class="micro-label l2">02 / CORE</span><span class="micro-label l3">03 / FIELD</span></div><div class="scan dec" data-layout-ignore></div><div class="scale-ticks dec" data-layout-ignore></div><div class="micro-note"><span class="badge">μ</span><span class="small">从整体，到细节</span></div><div class="footer"><span>结构示意 · 非真实尺度</span><span class="mono">SYSTEM IN MOTION</span></div><div class="progress"></div></section></div><script>
const tl=gsap.timeline({paused:true});
const CONFIG={headline:'看不见的世界',secondary:'也在持续运转',accent:'#71f3d3'};
document.querySelector('#m-head').textContent=CONFIG.headline;document.querySelector('#m-sub').textContent=CONFIG.secondary;document.querySelector('#stage').style.setProperty('--accent',CONFIG.accent);
tl.fromTo('#m-head',{yPercent:110},{yPercent:0,duration:1.05,ease:'power4.out'},.15);
tl.fromTo('#m-sub',{yPercent:125},{yPercent:0,duration:1,ease:'power4.out'},.55);
tl.fromTo('#m-cap,.micro-note',{opacity:0,y:24},{opacity:1,y:0,duration:.7,stagger:.15,ease:'power2.out'},1.35);
tl.fromTo('.orbital',{rotationY:-24,rotationX:15,scale:.76},{rotationY:0,rotationX:0,scale:1,duration:2.5,ease:'power3.out'},0);
tl.fromTo('.shell',{opacity:.1,rotationY:0},{opacity:1,rotationY:28,duration:6.6,ease:'sine.inOut'},0);
tl.set('.p1',{rotationX:62,rotationZ:-30},0);tl.set('.p2',{rotationY:63,rotationZ:40},0);tl.set('.p3',{rotationX:28,rotationY:-43,rotationZ:15},0);
['.a1','.a2','.a3'].forEach((s,i)=>{tl.fromTo(s,{rotation:-130-i*70},{rotation:220+i*42,duration:7.4,ease:'power1.inOut'},0);tl.fromTo(s+' .sat',{scale:.4,opacity:.2},{scale:1,opacity:1,duration:1,ease:'power2.out'},.15+i*.12)});
tl.fromTo('.nucleus',{scale:.65,opacity:.4},{scale:1,opacity:1,duration:1.7,ease:'power3.out'},.1);
document.querySelectorAll('.leader').forEach((p,i)=>{let l=p.getTotalLength();p.style.strokeDasharray=l;tl.fromTo(p,{strokeDashoffset:l},{strokeDashoffset:0,duration:.9,ease:'power2.out'},2.3+i*.35)});
tl.fromTo('.micro-label',{opacity:0},{opacity:1,duration:.55,stagger:.35},2.9);
tl.fromTo('.scan',{y:0,opacity:0},{y:580,opacity:1,duration:4.4,ease:'none'},1.4);tl.to('.scan',{opacity:0,duration:.8},5.8);
tl.to('.orbital',{rotationY:8,rotationX:-5,duration:3.4,ease:'sine.inOut'},3.4);

tl.fromTo('.progress',{scaleX:0},{scaleX:1,duration:8,ease:'none'},0);
window.__timelines=window.__timelines||{};window.__timelines['micro-world']=tl;tl.seek(0);
</script></body></html>
