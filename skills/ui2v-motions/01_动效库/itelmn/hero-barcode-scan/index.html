<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #cbd5e1; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(160deg, #e2e8f0 0%, #cbd5e1 100%);
      }
      .slip {
        position: absolute; left: 340px; top: 140px; width: 1240px; height: 800px;
        background: #fff; border-radius: 8px;
        box-shadow: 0 28px 70px rgba(15, 23, 42, 0.18);
        padding: 72px 80px;
        font-family: "Segoe UI", sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase; color: #64748b;
      }
      h1 {
        margin-top: 18px; font-size: 78px; font-weight: 700; color: #0f172a; letter-spacing: -0.03em;
      }
      .sku { margin-top: 14px; font-size: 28px; color: #475569; }
      .bars {
        position: relative; margin-top: 90px; height: 240px;
        display: flex; align-items: stretch; gap: 7px; padding: 12px 0;
        border-top: 1px dashed #cbd5e1; border-bottom: 1px dashed #cbd5e1;
      }
      .bar { background: #0f172a; border-radius: 1px; }
      .laser {
        position: absolute; top: 0; bottom: 0; left: 0; width: 5px;
        background: #06b6d4;
        box-shadow: 0 0 22px rgba(34, 211, 238, 0.85), 0 0 6px #22d3ee;
      }
      .status {
        margin-top: 48px; font-size: 34px; font-weight: 600; color: #059669;
      }
      .corner {
        position: absolute; right: 80px; top: 72px; width: 120px; height: 120px;
        border: 3px solid #94a3b8; border-left: none; border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="slip" class="clip slip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="corner"></div>
        <div class="eyebrow">Packing slip</div>
        <h1>Barcode Scan</h1>
        <div class="sku">SKU · UI2V-MOTION-2048 · Qty 1</div>
        <div class="bars" id="bars">
          <div class="bar" style="width: 12px"></div>
          <div class="bar" style="width: 4px"></div>
          <div class="bar" style="width: 18px"></div>
          <div class="bar" style="width: 6px"></div>
          <div class="bar" style="width: 10px"></div>
          <div class="bar" style="width: 4px"></div>
          <div class="bar" style="width: 22px"></div>
          <div class="bar" style="width: 7px"></div>
          <div class="bar" style="width: 5px"></div>
          <div class="bar" style="width: 15px"></div>
          <div class="bar" style="width: 4px"></div>
          <div class="bar" style="width: 20px"></div>
          <div class="bar" style="width: 8px"></div>
          <div class="bar" style="width: 6px"></div>
          <div class="bar" style="width: 14px"></div>
          <div class="bar" style="width: 4px"></div>
          <div class="bar" style="width: 24px"></div>
          <div class="bar" style="width: 9px"></div>
          <div class="bar" style="width: 5px"></div>
          <div class="bar" style="width: 16px"></div>
          <div class="bar" style="width: 7px"></div>
          <div class="bar" style="width: 11px"></div>
          <div class="bar" style="width: 4px"></div>
          <div class="bar" style="width: 19px"></div>
          <div class="bar" style="width: 8px"></div>
          <div class="bar" style="width: 6px"></div>
          <div class="bar" style="width: 13px"></div>
          <div class="bar" style="width: 5px"></div>
          <div class="bar" style="width: 17px"></div>
          <div class="laser" id="laser"></div>
        </div>
        <div class="status" id="status">Verified · ready to ship</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#slip", { opacity: 0, y: 36, rotate: -0.6 });
      gsap.set("#laser", { opacity: 0, x: 0 });
      gsap.set("#status", { opacity: 0, y: 12 });
      tl.to("#slip", { opacity: 1, y: 0, rotate: 0, duration: 0.7, ease: "power3.out" }, 0.15)
        .to("#laser", { opacity: 1, duration: 0.2 }, 0.75)
        .to("#laser", { x: 1040, duration: 2.15, ease: "power1.inOut" }, 0.85)
        .to("#status", { opacity: 1, y: 0, duration: 0.45 }, 3.05)
        .to("#laser", { opacity: 0, duration: 0.35 }, 3.15);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
