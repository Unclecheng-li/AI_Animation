<!DOCTYPE html>
<html data-composition-id="promo-feature-flash" data-width="720" data-height="1280">
<head>
  <meta charset="utf-8">
  <title>HyperFrames — Promo Feature Flash</title>
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Media Master feature callout — the app's "Why desktop" pillar card.
       White surface, Deep-Indigo glyph in a light-indigo (Blush) square,
       Oswald heading + Umber body. Palette from landing/app/globals.css. */
    :root {
      --mm-white: #ffffff;   --mm-shell: #f9f9fa;
      --mm-bean: #1a1a24;    --mm-umber: #4b6284;
      --mm-indigo: #1d3557;  --mm-blush: #d4e3f0;
      --mm-bamboo: #2a9d8f;
      --mm-border: rgba(29,53,87,0.1);
      --mm-font: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --mm-heading: 'Oswald', 'Arial Narrow', sans-serif;
    }
    .mm-feature {
      display: flex; align-items: center; gap: 26px;
      width: 640px; padding: 34px 36px; border-radius: 26px;
      background: var(--mm-white); border: 1px solid var(--mm-border);
      box-shadow: 0 30px 60px -20px rgba(15,29,52,0.4), 0 12px 24px -12px rgba(15,29,52,0.2);
      will-change: transform, opacity;
    }
    .mm-icon {
      flex: none; width: 92px; height: 92px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      background: var(--mm-blush); color: var(--mm-indigo);
      will-change: transform, opacity;
    }
    .mm-icon svg { width: 46px; height: 46px; }
    .mm-icon .mm-emoji { font-size: 46px; line-height: 1; }
    .mm-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .mm-eyebrow {
      font-family: var(--mm-font); font-weight: 600; font-size: 15px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--mm-umber);
    }
    .mm-title {
      font-family: var(--mm-heading); font-weight: 700; letter-spacing: -0.01em;
      font-size: 38px; line-height: 1.08; color: var(--mm-bean);
      will-change: transform, opacity;
    }
    .mm-desc {
      font-family: var(--mm-font); font-weight: 400;
      font-size: 23px; line-height: 1.4; color: var(--mm-umber);
      will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div class="hf-center mm-feature" id="feature" data-composition-id="promo-feature-flash" data-start="0" data-duration="2.5" data-track-index="0">
    <div class="mm-icon" id="icon"></div>
    <div class="mm-body">
      <div class="mm-eyebrow" id="eyebrow">New in Media Master</div>
      <div class="mm-title" id="title"></div>
      <div class="mm-desc" id="desc"></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes?.getVariables?.() ?? {};
    const accent = v.accentColor ?? v.color ?? '#1d3557';
    const yPos = v.yPos ?? 50;
    const iconKey = String(v.icon ?? 'sparkles');
    const title = v.title ?? v.text ?? 'Swipe Ads';
    const description = v.description ?? 'Turn winning competitor ads into on-brand posts';
    const eyebrow = v.eyebrow ?? 'New in Media Master';

    // Lucide glyphs for the known Media Master features (drawn in brand indigo).
    const svg = (inner) =>
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    const ICONS = {
      'image-library': svg('<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>'),
      'swipe-ads': svg('<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>'),
      'ads-dashboard': svg('<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>'),
      'brand-kit': svg('<path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>'),
      'offers': svg('<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>'),
      'automation': svg('<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>'),
      'publishing': svg('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
      'sparkles': svg('<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>'),
    };
    // Aliases so callers can pass natural names.
    const ALIAS = {
      images: 'image-library', image: 'image-library', library: 'image-library',
      swipe: 'swipe-ads', ads: 'ads-dashboard', dashboard: 'ads-dashboard',
      brand: 'brand-kit', palette: 'brand-kit', offer: 'offers', tag: 'offers',
      automations: 'automation', bot: 'automation', publish: 'publishing',
    };

    const featureEl = document.getElementById('feature');
    featureEl.style.top = yPos + '%';
    document.getElementById('eyebrow').textContent = eyebrow;
    document.getElementById('title').textContent = title;
    document.getElementById('desc').textContent = description;

    const iconEl = document.getElementById('icon');
    const key = ALIAS[iconKey] ?? iconKey;
    if (ICONS[key]) {
      iconEl.innerHTML = ICONS[key];
    } else if ([...iconKey].length <= 3) {
      // Treat a short string as an emoji fallback.
      iconEl.innerHTML = '<span class="mm-emoji">' + iconKey + '</span>';
    } else {
      iconEl.innerHTML = ICONS.sparkles;
    }
    iconEl.style.color = accent;

    const dur = parseFloat(v.timingDuration ?? 2.5);
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    // Card slides in.
    tl.fromTo(featureEl, { opacity: 0, x: 40, scale: 0.95 },
      { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: 'back.out(1.3)' }, 0);
    // Icon pops.
    tl.fromTo('#icon', { scale: 0.5, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, 0.15);
    // Eyebrow + title + description stagger in.
    tl.fromTo('#eyebrow', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.28 }, 0.25);
    tl.fromTo('#title', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3 }, 0.32);
    tl.fromTo('#desc', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.42);
    // Exit.
    tl.to(featureEl, { opacity: 0, x: -20, scale: 0.97, duration: 0.3, ease: 'power2.in' },
      Math.max(dur - 0.4, 0.7));
  </script>
</body>
</html>
