<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0a09; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0a09; }
      .photo {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      }
      .tape {
        position: absolute; inset: 0;
        background: repeating-linear-gradient(
          -18deg,
          #1c1917 0 48px,
          #292524 48px 96px
        );
        transform-origin: 0% 50%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <img id="photo" class="clip photo" data-start="0" data-duration="4.5" data-track-index="0" src="assets/bokeh-warm.jpg" alt="" />
      <div id="tape" class="clip tape" data-start="0" data-duration="4.5" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#photo", { scale: 1.08 });
      gsap.set("#tape", { xPercent: 0, skewX: -8 });
      tl.to("#tape", { xPercent: 110, duration: 2.2, ease: "power3.inOut" }, 0.45)
        .to("#photo", { scale: 1, duration: 3.2, ease: "sine.out" }, 0.6)
        .to("#photo", { y: -10, duration: 1.2, ease: "sine.inOut" }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
