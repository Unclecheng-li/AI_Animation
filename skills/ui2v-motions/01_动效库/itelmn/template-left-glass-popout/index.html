<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Left Glass Popout</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }

      #video-stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0% 50%;
        will-change: transform;
        z-index: 0;
      }

      #source-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: contrast(1.03) saturate(1.04);
      }

      .glass-card {
        --accent: #7dd3fc;
        position: absolute;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        width: 78vw;
        max-width: 1500px;
        padding: 52px 80px;
        border-radius: 28px;
        background:
          linear-gradient(
            150deg,
            rgba(255, 255, 255, 0.075),
            rgba(255, 255, 255, 0.025) 45%,
            rgba(255, 255, 255, 0.010) 70%,
            rgba(255, 255, 255, 0.055)
          ),
          rgba(8, 14, 26, 0.62);
        backdrop-filter: blur(18px) saturate(1.20);
        -webkit-backdrop-filter: blur(18px) saturate(1.20);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06) inset,
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        z-index: 2;
        color: #ffffff;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
        text-align: center;
        will-change: transform, opacity;
      }

      .glass-card.dim {
        background:
          linear-gradient(
            150deg,
            rgba(10, 18, 32, 0.62),
            rgba(10, 18, 32, 0.52) 45%,
            rgba(10, 18, 32, 0.50) 70%,
            rgba(10, 18, 32, 0.60)
          );
        border: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(125, 211, 252, 0.08) inset,
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }

      .glass-card.lower-third {
        width: 68vw;
        max-width: 1240px;
        bottom: 54px;
        padding: 30px 48px;
        border-radius: 22px;
      }

      .glass-card.left-popout {
        left: 72px;
        right: auto;
        top: 50%;
        bottom: auto;
        width: 690px;
        max-width: none;
        padding: 42px 48px 44px;
        border-radius: 26px;
        transform: translateY(-50%);
        text-align: left;
      }

      .glass-tag {
        color: rgba(255, 255, 255, 0.72);
        font-family: monospace;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.20em;
        line-height: 1.2;
        margin-bottom: 16px;
        text-transform: uppercase;
      }

      .glass-headline {
        color: #ffffff;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.08;
        margin: 0;
      }

      .glass-sub {
        color: rgba(255, 255, 255, 0.78);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.28;
        margin-top: 18px;
      }

      .glass-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        list-style: none;
        margin-top: 24px;
        padding: 0;
      }

      .glass-list li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 23px;
        font-weight: 550;
        letter-spacing: 0;
        line-height: 1.24;
      }

      .accent-dash {
        color: var(--accent);
        font-family: monospace;
        font-weight: 700;
        line-height: 1.18;
      }

      .glass-sheen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: inherit;
        pointer-events: none;
      }

      .glass-sheen::before {
        content: "";
        display: none;
      }

      .glass-shine-bar {
        position: absolute;
        top: -35%;
        left: -42%;
        width: 34%;
        height: 170%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );
        transform: rotate(14deg);
      }

      .glass-content {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="left-glass-popout"
      data-start="0"
      data-duration="52.67"
      data-width="1920"
      data-height="1080"
    >
      <div id="video-stage">
        <video
          id="source-video"
          class="clip"
          data-start="0"
          data-duration="52.67"
          data-track-index="0"
          data-media-start="0"
          src="assets/source.mp4"
          preload="metadata"
          muted
          playsinline
        ></video>
      </div>

      <audio
        id="source-audio"
        data-start="0"
        data-duration="52.67"
        data-track-index="2"
        data-media-start="0"
        data-volume="1"
        data-has-audio="true"
        src="assets/source.mp4"
        preload="metadata"
      ></audio>

      <div
        id="left-popout-card"
        class="clip glass-card dim lower-third left-popout"
        data-start="5"
        data-duration="5"
        data-track-index="4"
      >
        <div class="glass-sheen">
          <div class="glass-shine-bar"></div>
        </div>
        <div class="glass-content">
          <div class="glass-tag">Example beat</div>
          <h2 class="glass-headline">Devin can handle the heavy lift.</h2>
          <div class="glass-sub">A left-side card enters while the shot reframes around the speaker.</div>
          <ul class="glass-list">
            <li><span class="accent-dash">-</span><span>Left-anchored zoom keeps the face clear</span></li>
            <li><span class="accent-dash">-</span><span>Glass card covers roughly the left third</span></li>
          </ul>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 52.67;
      const tl = gsap.timeline({ paused: true });

      gsap.set("#video-stage", { scale: 1, x: 0, y: 0, transformOrigin: "0% 50%" });
      gsap.set("#left-popout-card", { opacity: 0, x: -92 });
      gsap.set("#left-popout-card .glass-content > *", { opacity: 0, y: 14 });

      tl.to(
        "#video-stage",
        {
          scale: 1.30,
          duration: 0.82,
          ease: "power3.inOut"
        },
        5.0
      );

      tl.to(
        "#left-popout-card",
        {
          opacity: 1,
          x: 0,
          duration: 0.52,
          ease: "power3.out"
        },
        5.14
      );

      tl.to(
        "#left-popout-card .glass-content > *",
        {
          opacity: 1,
          y: 0,
          duration: 0.42,
          ease: "power3.out",
          stagger: 0.06
        },
        5.28
      );

      tl.to("#left-popout-card .glass-shine-bar", { x: 920, duration: 0.78, ease: "power2.out" }, 5.18);
      tl.to(
        "#left-popout-card .glass-content > *",
        {
          opacity: 0,
          y: -8,
          duration: 0.26,
          ease: "power2.in",
          stagger: 0.025
        },
        9.36
      );
      tl.to(
        "#left-popout-card",
        {
          opacity: 0,
          x: -60,
          duration: 0.34,
          ease: "power2.in"
        },
        9.62
      );

      tl.to(
        "#video-stage",
        {
          scale: 1,
          duration: 0.78,
          ease: "power3.inOut"
        },
        10.0
      );
      tl.set("#video-stage", { scale: 1 }, DURATION);

      window.__timelines["left-glass-popout"] = tl;
    </script>
  </body>
</html>
