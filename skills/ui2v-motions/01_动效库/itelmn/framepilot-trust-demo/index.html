<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050505;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-move-fast-stay-aware"
        class="scene"
        data-composition-id="01-move-fast-stay-aware"
        data-composition-src="compositions/frames/01-move-fast-stay-aware.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-visible-production"
        class="scene"
        data-composition-id="02-visible-production"
        data-composition-src="compositions/frames/02-visible-production.html"
        data-start="2.5"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-exact-approval-durable-proof"
        class="scene"
        data-composition-id="03-exact-approval-durable-proof"
        data-composition-src="compositions/frames/03-exact-approval-durable-proof.html"
        data-start="6.5"
        data-duration="4.18"
        data-track-index="0"
      ></div>

      <div
        id="el-04-build-with-framepilot"
        class="scene"
        data-composition-id="04-build-with-framepilot"
        data-composition-src="compositions/frames/04-build-with-framepilot.html"
        data-start="10.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <video id="f01-move-fast-stay-aware-human-context" src="assets/stock/source/pexels-12893579-hands-laptop-vertical.mp4" preload="auto" aria-label="Hands working at a laptop" data-media-start="2.15" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover"
        data-start="0"
        data-duration="0.9"
        data-track-index="1001"
      ></video>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/audio/framepilot-trust-bed-15s.wav"
        data-start="0"
        data-duration="15"
        data-track-index="11"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-03-exact-approval-durable-proof", { opacity: 0, duration: 0.18, ease: "power2.inOut" }, 10.5);
        tl.fromTo("#el-04-build-with-framepilot", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.inOut" }, 10.5);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
