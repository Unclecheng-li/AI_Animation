<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1c1917; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(70% 60% at 65% 50%, #292524, #0c0a09);
      }
      .copy {
        position: absolute; left: 140px; top: 320px; color: #fafaf9;
        font-family: Georgia, serif;
      }
      .eyebrow {
        font-family: "Segoe UI", sans-serif; font-size: 24px; letter-spacing: 0.28em;
        text-transform: uppercase; color: #a8a29e; margin-bottom: 22px;
      }
      .title { font-size: 108px; line-height: 0.95; }
      .sub {
        margin-top: 28px; font-family: "Segoe UI", sans-serif; font-size: 32px; color: #d6d3d1;
      }
      .disc {
        position: absolute; left: 980px; top: 140px; width: 760px; height: 760px; border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, #1c1917 0 70px, transparent 71px),
          repeating-radial-gradient(circle at 50% 50%, #44403c 0 2px, #292524 3px 6px);
        box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 18px #0c0a09;
      }
      .label-disc {
        position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fb7185, #9f1239 70%);
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", sans-serif; font-weight: 800; font-size: 34px; color: #fff;
        letter-spacing: 0.08em;
      }
      .arm {
        position: absolute; left: 1480px; top: 220px; width: 18px; height: 420px;
        background: linear-gradient(#d6d3d1, #78716c); border-radius: 8px;
        transform-origin: 50% 20px;
      }
      .head {
        position: absolute; left: -18px; bottom: -10px; width: 54px; height: 54px; border-radius: 50%;
        background: #a8a29e; box-shadow: 0 0 0 6px rgba(168,162,158,0.25);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Audio · Object</div>
        <div class="title">Vinyl Spin</div>
        <div class="sub">Tonearm drops, groove keeps turning</div>
      </div>
      <div id="disc" class="clip disc" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="label-disc">UI2V</div>
      </div>
      <div id="arm" class="clip arm" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="head"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -18 });
      gsap.set("#disc", { opacity: 0, scale: 0.9, rotation: 0, transformOrigin: "50% 50%" });
      gsap.set("#arm", { opacity: 0, rotate: -28, transformOrigin: "50% 20px" });
      tl.to("#disc", { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.15)
        .to("#copy", { opacity: 1, x: 0, duration: 0.5 }, 0.35)
        .to("#arm", { opacity: 1, duration: 0.35 }, 0.7)
        .to("#arm", { rotate: 8, duration: 0.9, ease: "power2.out" }, 0.9)
        .to("#disc", { rotation: 140, duration: 3.2, ease: "none" }, 1.1)
        .to("#arm", { rotate: 12, duration: 2.4, ease: "sine.inOut" }, 1.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
