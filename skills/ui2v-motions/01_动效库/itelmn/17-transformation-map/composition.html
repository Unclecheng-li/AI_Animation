<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Transformation Map"},
  {"id":"stages","type":"string","label":"Stages (JSON)","default":"[{\"year\":\"2018\",\"label\":\"Current State\",\"desc\":\"Legacy systems, manual processes, and siloed departments. Customer satisfaction at 62%. Operating costs 18% above industry benchmark.\"},{\"year\":\"2019\",\"label\":\"Foundation\",\"desc\":\"ERP implementation completed. Digital skills program launched. First agile teams formed. Cost gap narrowed to 12%.\"},{\"year\":\"2020\",\"label\":\"Acceleration\",\"desc\":\"Cloud migration 80% complete. AI-powered analytics deployed. Customer self-service portal launched. Satisfaction rose to 78%.\"},{\"year\":\"2021\",\"label\":\"Future State\",\"desc\":\"Fully digital operating model. Predictive intelligence drives decisions. Industry-leading customer experience. Operating costs at benchmark.\"}]"},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"accentColor","type":"color","label":"Active Color","default":"#cd5746"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStage","type":"number","label":"Seconds per Stage","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #285f9f; --accent: #cd5746; --bg: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body { width: 1920px; height: 1080px; background-color: var(--bg); background-image: var(--base-plate); background-size: 1920px 1080px; background-position: 0 0; background-repeat: no-repeat; font-family: 'Inter', Arial, Helvetica, sans-serif; overflow: hidden; position: relative; }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .main-title { position: absolute; top: 50px; left: 80px; font-size: 42px; font-weight: 700; color: var(--primary); opacity: 0; }
    .road { position: absolute; left: 120px; top: 200px; width: 1080px; height: 500px; opacity: 0; }
    .road svg { width: 100%; height: 100%; }
    .milestone { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translate(-50%, -50%); }
    .m-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--primary); }
    .m-year { font-size: 22px; font-weight: 800; color: var(--primary); }
    .m-label { font-size: 15px; font-weight: 600; color: #5a6e78; text-align: center; max-width: 140px; }
    .info-panel { position: absolute; right: 80px; top: 238px; width: 660px; opacity: 0; }
    .info-inner { position: relative; }
    .info-block { position: absolute; inset: 0; opacity: 0; }
    .info-block:first-child { position: relative; opacity: 1; }
    .info-year { font-size: 68px; font-weight: 800; color: var(--accent); opacity: 0.32; line-height: 1; }
    .info-label { font-size: 32px; font-weight: 700; color: var(--primary); margin: -8px 0 16px; }
    .info-desc { font-size: 20px; line-height: 1.7; color: #5a6e78; }
  </style>
</head>
<body>
  <div data-composition-id="transformation-map" data-width="1920" data-height="1080" data-duration="16" data-start="0">
    <div id="el-fade"></div>
    <div class="main-title" id="mainTitle"></div>
    <div class="road" id="road">
      <svg viewBox="0 0 1080 500" preserveAspectRatio="none">
        <path d="M60,440 L260,420 L440,200 L620,180 C730,146 850,132 980,138" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      </svg>
    </div>
    <div class="info-panel" id="infoPanel">
      <div class="info-inner" id="infoInner"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var stages = JSON.parse(vars.stages || '[]');
      var activeS = Number(vars.activeStage) || 0;
      var pc = vars.primaryColor || '#285f9f';
      var ac = vars.accentColor || '#cd5746';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var dur = Number(vars.durationPerStage) || 4;
      document.documentElement.style.setProperty('--primary', pc);
      document.documentElement.style.setProperty('--accent', ac);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');
      document.getElementById('mainTitle').textContent = vars.title || 'Transformation Map';

      var road = document.getElementById('road');
      var infoInner = document.getElementById('infoInner');
      var dotEls = [], yearEls = [], labelEls = [], infoPanels = [];
      var positions = [{x:60,y:440},{x:260,y:420},{x:440,y:200},{x:620,y:180},{x:840,y:100}];

      stages.forEach(function(s, i) {
        var p = positions[i] || positions[0];
        var m = document.createElement('div'); m.className = 'milestone';
        m.style.left = p.x + 'px'; m.style.top = p.y + 'px';
        m.innerHTML = '<div class="m-dot"></div><div class="m-year">' + s.year + '</div><div class="m-label">' + s.label + '</div>';
        road.appendChild(m);
        dotEls.push(m.querySelector('.m-dot'));
        yearEls.push(m.querySelector('.m-year'));
        labelEls.push(m.querySelector('.m-label'));

        var panel = document.createElement('div');
        panel.innerHTML = '<div class="info-year">' + s.year + '</div><div class="info-label">' + s.label + '</div><div class="info-desc">' + s.desc + '</div>';
        if (i === activeS) { panel.style.position = 'relative'; panel.style.opacity = '1'; }
        else { panel.className = 'info-block'; }
        infoInner.appendChild(panel); infoPanels.push(panel);
        if (i !== activeS) gsap.set(panel, { opacity: 0 });
      });

      gsap.set(dotEls[activeS], { backgroundColor: ac, width: 28, height: 28, boxShadow: '0 0 0 8px ' + ac + '33' });
      gsap.set(yearEls[activeS], { color: ac, fontSize: '28px' });

      var TOTAL = stages.length * dur + 1;
      var tl = gsap.timeline({ paused: true });
      tl.to('#mainTitle', { opacity: 1, duration: 0.5 }, 0);
      tl.to('#road', { opacity: 1, duration: 0.5 }, 0.3);
      tl.from('.milestone', { opacity: 0, y: 20, duration: 0.4, stagger: 0.15, ease: 'power2.out' }, 0.5);
      tl.to('#infoPanel', { opacity: 1, x: -20, duration: 0.5 }, 1.0);

      for (var i = 1; i < stages.length; i++) {
        (function(idx) {
          var t = idx * dur;
          var prev = idx - 1;
          tl.to(infoPanels[prev], { opacity: 0, duration: 0.2 }, t);
          tl.to(infoPanels[idx], { opacity: 1, duration: 0.4, ease: 'power2.out' }, t + 0.25);
          tl.to(dotEls[prev], { backgroundColor: pc, width: 20, height: 20, boxShadow: 'none', duration: 0.3 }, t);
          tl.to(dotEls[idx], { backgroundColor: ac, width: 28, height: 28, boxShadow: '0 0 0 8px ' + ac + '33', duration: 0.3 }, t + 0.1);
          tl.to(yearEls[prev], { color: pc, fontSize: '22px', duration: 0.3 }, t);
          tl.to(yearEls[idx], { color: ac, fontSize: '28px', duration: 0.3 }, t + 0.1);
          tl.to('#infoPanel', { scale: 0.97, duration: 0.12 }, t + 0.1);
          tl.to('#infoPanel', { scale: 1, duration: 0.45, ease: 'back.out(1.3)' }, t + 0.22);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="transformation-map"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['transformation-map'] = tl;
    </script>
  </div>
</body>
</html>
