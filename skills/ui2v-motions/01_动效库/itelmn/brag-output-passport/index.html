<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #080e17; font-family: "Plus Jakarta Sans", sans-serif; color: #e8edf2;
      }
      .clip {
        position: absolute; width: 1920px; height: 1080px; top: 0; left: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden;
      }
      .inner {
        width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
      }
      h1 { font-family: "Outfit", sans-serif; font-size: 80px; font-weight: 700; text-align: center; letter-spacing: -2px; }
      h2 { font-family: "Outfit", sans-serif; font-size: 64px; font-weight: 700; text-align: center; letter-spacing: -1px; }
      .primary-glow { color: #00f0ff; text-shadow: 0 0 40px rgba(0, 240, 255, 0.4); }
      .secondary-glow { color: #a855f7; text-shadow: 0 0 40px rgba(168, 85, 247, 0.4); }
      .card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 60px;
        backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: flex; flex-direction: column; align-items: center; gap: 20px;
      }
      .score { font-size: 140px; font-weight: 900; font-family: 'Outfit'; color: #14f195; text-shadow: 0 0 60px rgba(20, 241, 149, 0.6); line-height: 1;}
      .bg-radial {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at center, rgba(168, 85, 247, 0.15) 0%, transparent 70%); z-index: -1;
      }
      .pill {
        padding: 20px 40px; background: rgba(168, 85, 247, 0.1); border: 1px solid #a855f7;
        border-radius: 100px; font-size: 40px; font-weight: 700; color: #a855f7;
      }
      .feature {
        font-size: 64px; font-weight: 700; margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="bg-radial"></div>

      <!-- Scene 1 -->
      <div id="scene1" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="inner" id="scene1-inner">
          <h1 style="max-width: 1400px; line-height: 1.2">In the gig economy, your reputation is your <span class="secondary-glow">currency.</span></h1>
        </div>
      </div>

      <!-- Scene 2 -->
      <div id="scene2" class="clip" data-start="4" data-duration="5" data-track-index="1">
        <div class="inner" id="scene2-inner">
          <h1 style="margin-bottom: 60px">Meet the Pabandi <span class="secondary-glow">Passport.</span></h1>
          <div class="card" id="passport-card">
            <div style="font-size: 32px; color: #94a3b8; text-transform: uppercase; letter-spacing: 4px;">Trust Score</div>
            <div class="score">99%</div>
            <div class="pill">Verified Professional</div>
          </div>
        </div>
      </div>

      <!-- Scene 3 -->
      <div id="scene3" class="clip" data-start="9" data-duration="3.5" data-track-index="1">
        <div class="inner" id="scene3-inner">
          <div class="feature" id="f1">Portable.</div>
          <div class="feature" id="f2">Verified.</div>
          <div class="feature primary-glow" id="f3">Yours.</div>
        </div>
      </div>

      <!-- Scene 4 -->
      <div id="scene4" class="clip" data-start="12.5" data-duration="2.5" data-track-index="1">
        <div class="inner" id="scene4-inner">
          <h2 style="font-size: 48px; color: #94a3b8; font-weight: 500; margin-bottom: 40px">Take your trust everywhere.</h2>
          <h1 style="font-size: 140px;" class="primary-glow">Pabandi</h1>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.set("#scene1", { autoAlpha: 1 }, 0)
        .from("#scene1-inner h1", { opacity: 0, scale: 0.95, filter: "blur(10px)", duration: 1.2, ease: "power2.out" }, 0.5)
        .to("#scene1-inner", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 3.5)
        .set("#scene1-inner", { opacity: 0 }, 4.00);

      // Scene 2
      tl.set("#scene2", { autoAlpha: 1 }, 4)
        .from("#scene2-inner h1", { opacity: 0, y: 50, duration: 0.8, ease: "power3.out" }, 4.3)
        .from("#passport-card", { opacity: 0, scale: 0.8, y: 50, duration: 0.8, ease: "power4.out" }, 4.8)
        .from(".score", { opacity: 0, filter: "blur(20px)", scale: 0.5, duration: 1, ease: "back.out(2)" }, 5.2)
        .from(".pill", { opacity: 0, y: 20, duration: 0.5 }, 5.8)
        .to("#scene2-inner", { opacity: 0, duration: 0.5 }, 8.5)
        .set("#scene2-inner", { opacity: 0 }, 9.00);

      // Scene 3
      tl.set("#scene3", { autoAlpha: 1 }, 9)
        .from(".feature", { opacity: 0, y: 30, stagger: 0.4, duration: 0.8, ease: "power3.out" }, 9.3)
        .to("#scene3-inner", { opacity: 0, filter: "blur(10px)", duration: 0.5 }, 12.0)
        .set("#scene3-inner", { opacity: 0 }, 12.50);

      // Scene 4
      tl.set("#scene4", { autoAlpha: 1 }, 12.5)
        .from("#scene4-inner h2", { opacity: 0, y: -20, duration: 0.8, ease: "power3.out" }, 12.5)
        .from("#scene4-inner h1", { opacity: 0, scale: 0.8, duration: 1.5, ease: "expo.out" }, 12.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
