<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>Dynamic Grid</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b1020}#hf-root{position:relative;width:1920px;height:1080px;display:grid;place-items:center;overflow:hidden}#hf-preview{width:100%;height:100%;border:0;background:transparent}</style></head>
<body><div id="hf-root" class="clip" data-composition-id="dynamic-grid" data-duration="5" data-width="1920" data-height="1080"><iframe id="hf-preview" title="Dynamic Grid" src="dynamic-grid.html" sandbox="allow-scripts allow-same-origin"></iframe></div>
<script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.fromTo("#hf-preview",{autoAlpha:0,scale:.96,y:24},{autoAlpha:1,scale:1,y:0,duration:Math.min(.8,5),ease:"power3.out"});window.__timelines["dynamic-grid"]=tl;</script></body></html>
