<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8fafc; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f8fafc; }
      .title {
        position: absolute; left: 160px; top: 180px;
        font-family: "Segoe UI", sans-serif; font-size: 92px; font-weight: 750; color: #0f172a; letter-spacing: -0.04em;
      }
      .list {
        position: absolute; left: 160px; top: 340px; width: 900px;
        font-family: "Segoe UI", sans-serif;
      }
      .item {
        display: flex; align-items: center; gap: 28px; padding: 28px 0;
        border-bottom: 2px solid #e2e8f0; font-size: 40px; color: #334155;
      }
      .box {
        width: 48px; height: 48px; border-radius: 12px; border: 3px solid #94a3b8;
        display: flex; align-items: center; justify-content: center; font-size: 30px; color: transparent;
        flex: 0 0 auto;
      }
      .item.done .box { background: #16a34a; border-color: #16a34a; color: #fff; }
      .item.done { color: #0f172a; }
      .side {
        position: absolute; right: 160px; top: 340px; width: 520px; padding: 40px;
        border-radius: 24px; background: #0f172a; color: #f8fafc;
        font-family: "Segoe UI", sans-serif;
      }
      .side h3 { font-size: 36px; margin-bottom: 16px; }
      .side p { font-size: 28px; line-height: 1.45; color: rgba(248,250,252,0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="0">Launch checklist</div>
      <div id="list" class="clip list" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="item" id="i1"><div class="box" id="b1">✓</div><div>Compose HyperFrames entry</div></div>
        <div class="item" id="i2"><div class="box" id="b2">✓</div><div>Add registry-item.json</div></div>
        <div class="item" id="i3"><div class="box" id="b3">✓</div><div>Publish with ui2v CLI</div></div>
        <div class="item" id="i4"><div class="box" id="b4">✓</div><div>Pin on homepage hero</div></div>
      </div>
      <div id="side" class="clip side" data-start="0" data-duration="4.5" data-track-index="2">
        <h3>Function</h3>
        <p>Task completion UI — progress pops in as each shipping step clears.</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#title", { opacity: 0, y: 18 });
      gsap.set(["#i1","#i2","#i3","#i4"], { opacity: 0, x: -24 });
      gsap.set("#side", { opacity: 0, x: 30 });
      tl.to("#title", { opacity: 1, y: 0, duration: 0.5 }, 0.1)
        .to("#side", { opacity: 1, x: 0, duration: 0.55 }, 0.25)
        .to("#i1", { opacity: 1, x: 0, duration: 0.35 }, 0.45)
        .add(() => { document.getElementById("i1").classList.add("done"); }, 0.85)
        .to("#b1", { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 0.85)
        .to("#i2", { opacity: 1, x: 0, duration: 0.35 }, 1.15)
        .add(() => { document.getElementById("i2").classList.add("done"); }, 1.55)
        .to("#b2", { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 1.55)
        .to("#i3", { opacity: 1, x: 0, duration: 0.35 }, 1.85)
        .add(() => { document.getElementById("i3").classList.add("done"); }, 2.25)
        .to("#b3", { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 2.25)
        .to("#i4", { opacity: 1, x: 0, duration: 0.35 }, 2.55)
        .add(() => { document.getElementById("i4").classList.add("done"); }, 3.0)
        .to("#b4", { scale: 1.15, duration: 0.2, yoyo: true, repeat: 1 }, 3.0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
