<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dark Graph Paper Template</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030507;
        color: #dff8ff;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030507;
        isolation: isolate;
      }

      #root .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        pointer-events: none;
      }

      #dark-base {
        background:
          radial-gradient(ellipse 940px 620px at 72% 25%, rgba(125, 211, 252, 0.14), transparent 68%),
          radial-gradient(ellipse 780px 520px at 22% 72%, rgba(110, 231, 183, 0.10), transparent 62%),
          radial-gradient(ellipse 500px 360px at 48% 50%, rgba(246, 193, 119, 0.035), transparent 66%),
          linear-gradient(180deg, #081118 0%, #030507 58%, #020304 100%);
      }

      #paper-fiber-a,
      #paper-fiber-b {
        inset: -6%;
        width: 112%;
        height: 112%;
        mix-blend-mode: screen;
        opacity: 0.20;
        will-change: transform, opacity;
      }

      #paper-fiber-a {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' seed='31'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.55  0 0 0 0 0.70  0 0 0 0.34 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 480px 480px;
      }

      #paper-fiber-b {
        opacity: 0.10;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='turbulence' baseFrequency='0.026 0.12' numOctaves='3' seed='17'/><feColorMatrix values='0 0 0 0 0.44  0 0 0 0 0.90  0 0 0 0 0.72  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 360px 360px;
      }

      #graph-grid {
        opacity: 0.74;
        background-image:
          linear-gradient(rgba(103, 232, 249, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(103, 232, 249, 0.18) 1px, transparent 1px),
          linear-gradient(rgba(110, 231, 183, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(110, 231, 183, 0.16) 1px, transparent 1px);
        background-size: 48px 48px, 48px 48px, 240px 240px, 240px 240px;
        background-position: 0 0, 0 0, 0 0, 0 0;
        box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.72);
        will-change: background-position, opacity;
      }

      #perspective-grid {
        top: 210px;
        height: 1100px;
        opacity: 0.26;
        transform-origin: 50% 72%;
        transform: perspective(920px) rotateX(58deg) translateY(86px) scale(1.18);
        background:
          repeating-linear-gradient(0deg, rgba(125, 211, 252, 0.15) 0 1px, transparent 1px 86px),
          repeating-linear-gradient(90deg, rgba(125, 211, 252, 0.12) 0 1px, transparent 1px 86px);
        mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 86%, transparent 100%);
        will-change: transform, background-position, opacity;
      }

      #scan-band {
        inset: -22% 0 auto 0;
        height: 420px;
        opacity: 0.24;
        background: linear-gradient(
          180deg,
          transparent 0%,
          rgba(125, 211, 252, 0.00) 20%,
          rgba(125, 211, 252, 0.055) 48%,
          rgba(110, 231, 183, 0.028) 54%,
          transparent 100%
        );
        filter: blur(24px);
        mix-blend-mode: screen;
        will-change: transform, opacity;
      }

      #edge-glow {
        background:
          linear-gradient(90deg, rgba(125, 211, 252, 0.10), transparent 20%, transparent 80%, rgba(110, 231, 183, 0.08)),
          linear-gradient(180deg, rgba(125, 211, 252, 0.06), transparent 26%, transparent 76%, rgba(0, 0, 0, 0.50));
        opacity: 0.54;
        mix-blend-mode: screen;
      }

      #grain {
        inset: -18%;
        width: 136%;
        height: 136%;
        opacity: 0.16;
        mix-blend-mode: screen;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.35' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.70  0 0 0 0 0.92  0 0 0 0 1.00  0 0 0 0.42 0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
        background-size: 300px 300px;
        will-change: transform, opacity;
      }

      #vignette {
        background:
          radial-gradient(ellipse at center, transparent 36%, rgba(0, 0, 0, 0.74) 82%, rgba(0, 0, 0, 0.94) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.28), transparent 38%, rgba(0, 0, 0, 0.36));
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="dark-base" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="paper-fiber-a" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
      <div id="paper-fiber-b" class="clip" data-start="0" data-duration="8" data-track-index="2"></div>
      <div id="graph-grid" class="clip" data-start="0" data-duration="8" data-track-index="3"></div>
      <div id="perspective-grid" class="clip" data-start="0" data-duration="8" data-track-index="4"></div>
      <div id="scan-band" class="clip" data-start="0" data-duration="8" data-track-index="5"></div>
      <div id="edge-glow" class="clip" data-start="0" data-duration="8" data-track-index="6"></div>
      <div id="grain" class="clip" data-start="0" data-duration="8" data-track-index="7"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="8" data-track-index="8"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const DURATION = 8;
      const tl = gsap.timeline({ paused: true });

      const phaseA = {
        "#paper-fiber-a": { opacity: 0.20, x: -18, y: 10, scale: 1.00, rotation: 0 },
        "#paper-fiber-b": { opacity: 0.10, x: 22, y: -12, scale: 1.02, rotation: 0.15 },
        "#grain": { x: -24, y: 16, opacity: 0.16 },
      };
      const phaseB = {
        "#paper-fiber-a": { opacity: 0.13, x: 28, y: -18, scale: 1.02, rotation: 0.18 },
        "#paper-fiber-b": { opacity: 0.18, x: -20, y: 18, scale: 1.00, rotation: -0.12 },
        "#grain": { x: 28, y: -20, opacity: 0.18 },
      };

      tl.fromTo("#dark-base",
        { scale: 1.00 },
        { scale: 1.014, duration: 4, yoyo: true, repeat: 1, ease: "sine.inOut" },
        0);
      tl.to("#graph-grid", {
        backgroundPosition: "48px 48px, 48px 48px, 240px 240px, 240px 240px",
        duration: DURATION,
        ease: "none",
      }, 0);
      tl.to("#perspective-grid", { backgroundPositionY: "-172px", opacity: 0.32, duration: DURATION, ease: "none" }, 0);
      tl.fromTo("#scan-band",
        { y: -150, skewY: -5, opacity: 0.18 },
        { y: 170, skewY: -5, opacity: 0.08, duration: 4, yoyo: true, repeat: 1, ease: "sine.inOut" },
        0);
      tl.to("#edge-glow", { opacity: 0.70, duration: 2.0, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.to("#vignette", { opacity: 0.94, duration: 2.0, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);

      for (const selector in phaseA) {
        tl.fromTo(selector, phaseA[selector], {
          ...phaseB[selector],
          duration: 4,
          yoyo: true,
          repeat: 1,
          ease: "sine.inOut",
        }, 0);
      }

      tl.set({}, {}, DURATION);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
