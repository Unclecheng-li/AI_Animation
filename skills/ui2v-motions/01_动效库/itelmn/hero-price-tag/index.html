<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff7ed; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff7ed; }
      .title {
        position: absolute; left: 160px; top: 140px;
        font-family: Georgia, serif; font-size: 84px; color: #9a3412;
      }
      .sub {
        position: absolute; left: 160px; top: 260px;
        font-family: "Segoe UI", sans-serif; font-size: 32px; color: #c2410c;
      }
      .tag {
        position: absolute; left: 980px; top: 280px; width: 520px; height: 360px;
        background: #fdba74; border-radius: 18px 18px 18px 18px;
        box-shadow: 0 24px 50px rgba(154, 52, 18, 0.25);
        transform-origin: 0% 50%;
        font-family: "Segoe UI", sans-serif; color: #7c2d12;
        padding: 48px 56px;
      }
      .tag:before {
        content: ""; position: absolute; left: -48px; top: 50%; width: 96px; height: 96px;
        margin-top: -48px; border-radius: 50%; background: #fff7ed;
        box-shadow: inset 0 0 0 14px #fdba74;
      }
      .was { font-size: 28px; text-decoration: line-through; opacity: 0.7; }
      .now { margin-top: 18px; font-size: 110px; font-weight: 800; letter-spacing: -0.04em; }
      .save { margin-top: 12px; font-size: 30px; font-weight: 600; }
      .string {
        position: absolute; left: 930px; top: 120px; width: 4px; height: 200px; background: #a8a29e;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="0">Price Tag</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="4.5" data-track-index="1">Commerce swing · discount reveal</div>
      <div id="string" class="clip string" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="tag" class="clip tag" data-start="0" data-duration="4.5" data-track-index="3">
        <div class="was">$48</div>
        <div class="now">$19</div>
        <div class="save">Launch offer</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#title", "#sub"], { opacity: 0, y: 14 });
      gsap.set("#string", { opacity: 0, scaleY: 0, transformOrigin: "50% 0%" });
      gsap.set("#tag", { opacity: 0, rotate: -28, y: -40 });
      tl.to("#title", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#sub", { opacity: 1, y: 0, duration: 0.4 }, 0.25)
        .to("#string", { opacity: 1, scaleY: 1, duration: 0.45 }, 0.45)
        .to("#tag", { opacity: 1, rotate: 8, y: 0, duration: 0.85, ease: "power3.out" }, 0.7)
        .to("#tag", { rotate: -6, duration: 0.7, ease: "sine.inOut" }, 1.6)
        .to("#tag", { rotate: 4, duration: 0.7, ease: "sine.inOut" }, 2.3)
        .to("#tag", { rotate: -2, duration: 0.8, ease: "sine.inOut" }, 3.0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
