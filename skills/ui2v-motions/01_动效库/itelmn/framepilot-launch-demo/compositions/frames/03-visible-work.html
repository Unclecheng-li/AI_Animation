  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-visible-work"]');
      if (!root) return;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["03-visible-work"] = tl;

      const cockpit = root.querySelector('[id="f03-visible-work-cockpit"]');
      const title = root.querySelector('[id="f03-visible-work-title"]');
      const accentLine = root.querySelector('[id="f03-visible-work-accent-line"]');

      // Scene 1 — the incoming half of a leftward cut-the-curve handoff.
      tl.fromTo(
        cockpit,
        { x: 105, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        0,
      );
      tl.fromTo(
        title,
        { x: 34, opacity: 0.45 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        accentLine,
        { scaleX: 0.05, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.42, ease: "power3.out" },
        0.16,
      );

      // Scene 2 — receipt timings are computed once from content length.
      const receiptContent = [
        { body: "PLAN LOCKED", hold: 0.04 },
        { body: "SOURCE ROUTED", hold: 0.04 },
        { body: "OUTPUT VERIFIED", hold: 0.08 },
      ];
      const baseDuration = 0.32;
      const secondsPerCharacter = 0.004;
      let cumulative = 0;
      const receiptTimeline = receiptContent.map((entry) => {
        const duration = baseDuration + entry.body.length * secondsPerCharacter + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const receiptRows = Array.from(
        root.querySelectorAll('[class~="f03-visible-work-receipt"]'),
      );

      receiptTimeline.forEach((entry, index) => {
        const row = receiptRows[index];
        const number = row.querySelector('[class~="f03-visible-work-badge-number"]');
        const check = row.querySelector('[class~="f03-visible-work-badge-check"]');
        const cue = 0.7 + entry.start;

        tl.fromTo(
          row,
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
          cue,
        );
        tl.fromTo(
          number,
          { opacity: 1 },
          { opacity: 0, duration: 0.11, ease: "none" },
          cue + 0.2,
        );
        tl.fromTo(
          check,
          { opacity: 0 },
          { opacity: 1, duration: 0.16, ease: "power1.out" },
          cue + 0.23,
        );
      });

      // Scene 3 — exact approval crop takes the right proof corridor.
      const proofScrim = root.querySelector('[id="f03-visible-work-proof-scrim"]');
      const approval = root.querySelector('[id="f03-visible-work-approval"]');
      const approvalCheck = root.querySelector('[id="f03-visible-work-approval-check"]');
      const checkLength = approvalCheck.getTotalLength();
      approvalCheck.style.strokeDasharray = `${checkLength}`;
      approvalCheck.style.strokeDashoffset = `${checkLength}`;

      tl.fromTo(
        proofScrim,
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "power1.out" },
        2.05,
      );
      tl.fromTo(
        approval,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        2.05,
      );
      tl.fromTo(
        approvalCheck,
        { strokeDashoffset: checkLength },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        2.17,
      );

      // Scene 4 — land by 2.65s, then hold every visible element completely still.
      const finalLock = root.querySelector('[id="f03-visible-work-final-lock"]');
      tl.fromTo(
        finalLock,
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.17, ease: "power1.out" },
        2.48,
      );
      const holdState = { value: 0 };
      tl.to(holdState, { value: 1, duration: 0.55, ease: "none" }, 2.65);
    })();
  </script>
