<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #0d1117;
        }
        /* Background light: one soft neutral source lifting the frame off flat black.
           Deliberately NOT accent-tinted — accent means "verified source" and stays
           rationed. Static, so it costs nothing in determinism. */
        .glow {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            82% 64% at 50% 36%,
            rgba(150, 168, 194, 0.1) 0%,
            rgba(150, 168, 194, 0.035) 46%,
            rgba(150, 168, 194, 0) 74%
          );
        }
        .wall {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          will-change: transform;
        }
        .row {
          display: flex;
          gap: 28px;
          height: 44px;
          align-items: center;
          padding: 0 96px;
          font-size: 30px;
          line-height: 44px;
          white-space: nowrap;
          font-variant-ligatures: none;
        }
        .gutter {
          width: 78px;
          text-align: right;
          color: #697583;
          font-variant-numeric: tabular-nums;
          flex: 0 0 78px;
        }
        .src {
          color: #dce3ea;
          opacity: 0.46;
        }
        .scrim {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            120% 78% at 50% 50%,
            rgba(13, 17, 23, 0.72) 0%,
            rgba(13, 17, 23, 0.94) 62%,
            rgba(13, 17, 23, 0.99) 100%
          );
        }
        .kicker {
          position: absolute;
          top: 128px;
          left: 0;
          width: 1920px;
          text-align: center;
          display: block;
          font-size: 38px;
          letter-spacing: 0.02em;
          color: #818b98;
        }
        .card {
          position: absolute;
          left: 240px;
          top: 396px;
          width: 1440px;
          padding: 56px;
          border-radius: 22px;
          background: #1a212b;
          border: 1px solid #2b3440;
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        }
        .card-label {
          display: block;
          font-size: 36px;
          color: #aab3bd;
          margin-bottom: 30px;
        }
        .field {
          position: relative;
          display: block;
          background: #090d12;
          border: 1px solid #2b3440;
          border-radius: 14px;
          padding: 30px 36px;
          overflow: hidden;
        }
        .field-text {
          display: block;
          font-size: 34px;
          line-height: 1.3;
          color: #edf1f5;
          white-space: nowrap;
          font-variant-ligatures: none;
        }
        .caret {
          display: inline-block;
          width: 4px;
          height: 36px;
          margin-left: 6px;
          vertical-align: -6px;
          background: #49b9ad;
        }
        .underline {
          position: absolute;
          left: 0;
          bottom: 0;
          display: block;
          width: 100%;
          height: 5px;
          background: #49b9ad;
          transform-origin: left center;
        }
        .statement {
          position: absolute;
          left: 120px;
          bottom: 128px;
          display: block;
          max-width: 1400px;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 100px;
          line-height: 1.04;
          letter-spacing: -0.03em;
          color: #edf1f5;
        }
      </style>

      <div data-hf-id="hf-mysf" id="root" data-composition-id="s2-who" data-width="1920" data-height="1080">
        <div data-hf-id="hf-4qej" class="fill"></div>
        <div data-hf-id="hf-2s7n" class="glow"></div>
        <!-- Same background texture as scene 1, blurred to 11px under a radial scrim.
             Decoration, not content — excluded from the layout audit. -->
        <div data-hf-id="hf-pjxt" id="s2-wall" class="wall" data-layout-ignore=""></div>
        <div data-hf-id="hf-ifgm" id="s2-scrim" class="scrim"></div>

        <div data-hf-id="hf-ebov" id="s2-kicker" class="kicker">Every other tool starts with the repo.</div>

        <div data-hf-id="hf-1ufi" id="s2-card" class="card">
          <span data-hf-id="hf-orae" class="card-label">Who is asking?</span>
          <span data-hf-id="hf-cdkb" class="field">
            <span data-hf-id="hf-cn9l" class="field-text"><span data-hf-id="hf-56dq" id="s2-typed"></span><span data-hf-id="hf-yp8p" id="s2-caret" class="caret"></span></span>
            <span data-hf-id="hf-hen1" id="s2-underline" class="underline"></span>
          </span>
        </div>

        <div data-hf-id="hf-4uwm" id="s2-statement" class="statement" data-layout-allow-caption-zone="">
          RepoPilot starts with you.
        </div>
      </div>

      <script>
        (function () {
          const LINES = [
            "packages/agents/src/repopilot_agents/graph.py",
            "    return {\"insights\": [insight]}",
            "packages/agents/src/repopilot_agents/state.py",
            "class ArchaeologistState(BaseModel):",
            "    intent_profile: IntentProfile | None = None",
            "packages/ingestion/src/repopilot_ingestion/pipeline.py",
            "    chunks = chunk_module(tree, source, file_path)",
            "packages/ingestion/src/repopilot_ingestion/parse.py",
            "    parser = get_parser(\"python\")",
            "packages/agents/src/repopilot_agents/tools/graph_query.py",
            "    def hubs(self, limit: int = 10) -> list[NodeRef]:",
            "apps/api/src/repopilot_api/app.py",
            "@app.post(\"/repos/{repo_id}/ask\")",
            "    async def ask(payload: AskRequest) -> AskResponse:",
            "packages/agents/src/repopilot_agents/verifier/grounding.py",
            "    if not claim.refs:",
            "        return Verdict.FLAGGED",
            "packages/core/src/repopilot_core/llm/provider.py",
            "    except RateLimitError as exc:",
            "        await asyncio.sleep(backoff)",
            "apps/web/src/components/repopilot-app.tsx",
            "  const [personaId, setPersonaId] = useState(...)",
            "packages/agents/src/repopilot_agents/qa/prompts.py",
            "    PERSONA_SHAPES: dict[str, AnswerShape] = {",
            "packages/agents/src/repopilot_agents/tools/read_chunks.py",
            "    spans = await store.fetch_spans(chunk_ids)",
            "packages/evals/src/repopilot_evals/registry.py",
            "    register(\"retrieval_recall_at_10\", ...)",
            "apps/api/src/repopilot_api/access.py",
            "    session = require_session(request)",
            "packages/ingestion/src/repopilot_ingestion/embed.py",
            "    vectors = model.encode(texts, batch_size=32)",
            "packages/agents/src/repopilot_agents/contribute/lane_c.py",
            "    # guarded language only - never assert a bug",
            "packages/core/src/repopilot_core/settings.py",
            "    database_url: PostgresDsn",
            "packages/agents/src/repopilot_agents/tools/graph_metrics.py",
            "    fan_in = graph.in_degree(node)",
            "infra/postgres/init.sql",
            "CREATE EXTENSION IF NOT EXISTS vector;",
          ];

          // Same wall, same rows, parked at scene 1's final offset — the cut is a match cut.
          const wall = document.getElementById("s2-wall");
          const ROWS = 84;
          for (let i = 0; i < ROWS; i += 1) {
            const row = document.createElement("div");
            row.className = "row";
            const gutter = document.createElement("span");
            gutter.className = "gutter";
            gutter.textContent = String(112 + i * 7);
            const src = document.createElement("span");
            src.className = "src";
            src.textContent = LINES[i % LINES.length];
            row.appendChild(gutter);
            row.appendChild(src);
            wall.appendChild(row);
          }

          const INTENT = "I'm writing a migration guide and need the breaking changes";
          const typedEl = document.getElementById("s2-typed");
          const typist = { n: 0 };

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // The repo does not leave; it stops being the subject.
          tl.fromTo(
            "#s2-wall",
            { y: -2400, scale: 1, filter: "blur(0px)", opacity: 1 },
            {
              scale: 0.94,
              filter: "blur(11px)",
              opacity: 0.24,
              duration: 0.7,
              ease: "power2.inOut",
            },
            0,
          );
          tl.fromTo("#s2-scrim", { opacity: 0.35 }, { opacity: 1, duration: 0.7, ease: "power2.inOut" }, 0);

          tl.fromTo(
            "#s2-kicker",
            { opacity: 0, y: -16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
            0.25,
          );
          tl.fromTo(
            "#s2-card",
            { opacity: 0, y: 30, scale: 0.98 },
            { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
            0.6,
          );

          tl.fromTo(
            typist,
            { n: 0 },
            {
              n: INTENT.length,
              duration: 3.0,
              ease: "none",
              onUpdate: () => {
                typedEl.textContent = INTENT.slice(0, Math.round(typist.n));
              },
            },
            1.0,
          );

          // Finite blink — never repeat: -1.
          tl.fromTo(
            "#s2-caret",
            { opacity: 1 },
            {
              opacity: 0,
              duration: 0.35,
              ease: "steps(1)",
              yoyo: true,
              repeat: Math.max(0, Math.floor(4.0 / 0.7) - 1),
            },
            1.0,
          );
          tl.to("#s2-caret", { opacity: 0, duration: 0.2, ease: "power2.out" }, 4.4);

          tl.fromTo(
            "#s2-underline",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.out" },
            4.0,
          );

          tl.to("#s2-kicker", { opacity: 0, y: -14, duration: 0.35, ease: "power2.in" }, 4.6);
          tl.to("#s2-card", { y: -104, scale: 0.9, opacity: 0.62, duration: 0.6, ease: "power2.inOut" }, 4.8);

          tl.fromTo(
            "#s2-statement",
            { opacity: 0, y: 34 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            5.05,
          );

          window.__timelines["s2-who"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
