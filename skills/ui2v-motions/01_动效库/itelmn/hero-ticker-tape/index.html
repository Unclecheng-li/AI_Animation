<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111827; }
      .headline {
        position: absolute; left: 120px; top: 280px; width: 1680px;
        font-family: Georgia, serif; font-size: 110px; line-height: 1.05; color: #f9fafb; letter-spacing: -0.03em;
      }
      .tape {
        position: absolute; left: 0; top: 720px; width: 3840px; height: 120px;
        display: flex; align-items: center; gap: 64px;
        background: #fbbf24; color: #111827;
        font-family: "Segoe UI", sans-serif; font-size: 42px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
        white-space: nowrap; padding-left: 40px;
      }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #111827; display: inline-block; margin: 0 8px; }
      .live {
        position: absolute; left: 120px; top: 200px;
        font-family: "Segoe UI", sans-serif; font-size: 24px; letter-spacing: 0.3em; color: #fbbf24; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="live" class="clip live" data-start="0" data-duration="4.5" data-track-index="0">Breaking · Registry</div>
      <div id="headline" class="clip headline" data-start="0" data-duration="4.5" data-track-index="1">Ticker Tape<br />keeps the feed moving</div>
      <div id="tape" class="clip tape" data-start="0" data-duration="4.5" data-track-index="2">
        New motion published <span class="dot"></span> HyperFrames block live <span class="dot"></span> Install with ui2v <span class="dot"></span>
        New motion published <span class="dot"></span> HyperFrames block live <span class="dot"></span> Install with ui2v <span class="dot"></span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#live", { opacity: 0, x: -20 });
      gsap.set("#headline", { opacity: 0, y: 30 });
      gsap.set("#tape", { x: 0, y: 40, opacity: 0 });
      tl.to("#live", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#headline", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25)
        .to("#tape", { opacity: 1, y: 0, duration: 0.5 }, 0.55)
        .to("#tape", { x: -1600, duration: 3.4, ease: "none" }, 0.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
