<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d12; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(160deg, #12151d 0%, #0b0d12 55%, #171a24 100%);
      }
      .line {
        position: absolute; left: 160px; color: #f8fafc;
        font-family: "Segoe UI", sans-serif; font-weight: 700; letter-spacing: -0.05em;
        white-space: nowrap;
      }
      .l1 { top: 280px; font-size: 110px; opacity: 0.28; }
      .l2 { top: 420px; font-size: 132px; }
      .l3 { top: 580px; font-size: 92px; color: #67e8f9; }
      .accent {
        position: absolute; left: 160px; top: 740px; width: 220px; height: 8px;
        background: linear-gradient(90deg, #22d3ee, #a78bfa); border-radius: 999px;
      }
      .meta {
        position: absolute; right: 160px; top: 160px; text-align: right;
        font-family: "Segoe UI", sans-serif; color: rgba(226, 232, 240, 0.7); font-size: 28px; letter-spacing: 0.18em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="meta" class="clip meta" data-start="0" data-duration="4.5" data-track-index="0">Kinetic Type · 04</div>
      <div id="l1" class="clip line l1" data-start="0" data-duration="4.5" data-track-index="1">Compose once</div>
      <div id="l2" class="clip line l2" data-start="0" data-duration="4.5" data-track-index="2">Publish everywhere</div>
      <div id="l3" class="clip line l3" data-start="0" data-duration="4.5" data-track-index="3">HyperFrames ready</div>
      <div id="accent" class="clip accent" data-start="0" data-duration="4.5" data-track-index="4"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#l1", "#l2", "#l3"], { y: 80, opacity: 0 });
      gsap.set("#accent", { scaleX: 0, transformOrigin: "0% 50%", opacity: 0 });
      gsap.set("#meta", { opacity: 0, y: -16 });
      tl.to("#meta", { opacity: 1, y: 0, duration: 0.5 }, 0.1)
        .to("#l1", { y: 0, opacity: 0.35, duration: 0.7, ease: "power3.out" }, 0.2)
        .to("#l2", { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.45)
        .to("#l3", { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.75)
        .to("#accent", { opacity: 1, scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.1)
        .to("#l1", { x: -24, duration: 2.4, ease: "sine.inOut" }, 1.6)
        .to("#l2", { x: 18, duration: 2.4, ease: "sine.inOut" }, 1.6)
        .to("#l3", { x: -12, duration: 2.4, ease: "sine.inOut" }, 1.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
