<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #172554; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #172554;
      }
      .sheet {
        position: absolute; left: 160px; top: 120px; width: 1600px; height: 840px;
        background:
          linear-gradient(rgba(96,165,250,0.12) 1px, transparent 1px) 0 0 / 40px 40px,
          linear-gradient(90deg, rgba(96,165,250,0.12) 1px, transparent 1px) 0 0 / 40px 40px,
          #1e3a8a;
        border: 2px solid #60a5fa;
        box-shadow: inset 0 0 80px rgba(37, 99, 235, 0.35);
      }
      .title {
        position: absolute; left: 80px; top: 60px;
        font-family: "Segoe UI", sans-serif; font-size: 64px; font-weight: 700; color: #dbeafe;
        letter-spacing: -0.02em;
      }
      .meta {
        position: absolute; left: 80px; top: 150px;
        font-family: Consolas, monospace; font-size: 24px; color: #93c5fd;
      }
      .line {
        position: absolute; height: 3px; background: #93c5fd;
        transform-origin: 0% 50%; box-shadow: 0 0 10px rgba(147, 197, 253, 0.55);
      }
      .l1 { left: 180px; top: 360px; width: 720px; }
      .l2 { left: 180px; top: 360px; width: 420px; transform: rotate(90deg); }
      .l3 { left: 600px; top: 360px; width: 520px; transform: rotate(28deg); }
      .l4 { left: 900px; top: 520px; width: 480px; }
      .box {
        position: absolute; left: 900px; top: 300px; width: 420px; height: 260px;
        border: 3px solid #bfdbfe; background: rgba(59, 130, 246, 0.12);
      }
      .stamp {
        position: absolute; right: 80px; bottom: 70px;
        font-family: Consolas, monospace; font-size: 22px; color: #93c5fd; letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="sheet" class="clip sheet" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="title">Blueprint Draw</div>
        <div class="meta">PLAN · HF-HERO-12 · SCALE 1:1</div>
        <div class="line l1" id="l1"></div>
        <div class="line l2" id="l2"></div>
        <div class="line l3" id="l3"></div>
        <div class="line l4" id="l4"></div>
        <div class="box" id="box"></div>
        <div class="stamp">APPROVED FOR BUILD</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#sheet", { opacity: 0 });
      gsap.set(["#l1", "#l2", "#l3", "#l4"], { scaleX: 0 });
      gsap.set("#box", { opacity: 0, scale: 0.92, transformOrigin: "0% 0%" });
      tl.to("#sheet", { opacity: 1, duration: 0.45 }, 0.1)
        .to("#l1", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.4)
        .to("#l2", { scaleX: 1, duration: 0.65, ease: "power2.inOut" }, 0.85)
        .to("#l3", { scaleX: 1, duration: 0.75, ease: "power2.inOut" }, 1.3)
        .to("#l4", { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.85)
        .to("#box", { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 2.4)
        .to("#box", { x: 12, y: -8, duration: 1.4, ease: "sine.inOut" }, 3.1);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
