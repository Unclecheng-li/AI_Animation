<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080e17;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: #e8edf2;
      }
      
      .clip {
        position: absolute;
        width: 1920px;
        height: 1080px;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
      }

      .inner {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      h1 {
        font-family: "Outfit", sans-serif;
        font-size: 96px;
        font-weight: 700;
        text-align: center;
        letter-spacing: -2px;
      }

      h2 {
        font-family: "Outfit", sans-serif;
        font-size: 72px;
        font-weight: 700;
        text-align: center;
        letter-spacing: -1px;
      }

      .primary-glow {
        color: #00f0ff;
        text-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
      }
      
      .secondary-glow {
        color: #a855f7;
        text-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      }

      .card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 60px;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }

      .swap-row {
        display: flex;
        align-items: center;
        gap: 40px;
        font-size: 64px;
        font-weight: 700;
      }
      
      .token {
        padding: 20px 40px;
        border-radius: 100px;
        background: #111827;
        border: 2px solid #334155;
      }
      
      .arrow {
        color: #a855f7;
      }

      .zk-container {
        position: relative;
        width: 800px;
        height: 400px;
        margin-bottom: 60px;
      }
      
      .zk-node {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #00f0ff;
        border-radius: 50%;
        box-shadow: 0 0 30px #00f0ff;
      }

      .zk-line {
        position: absolute;
        height: 4px;
        background: linear-gradient(90deg, #00f0ff, transparent);
        transform-origin: left center;
      }

      .split-screen {
        display: flex;
        width: 100%;
        height: 100%;
      }
      
      .split-half {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 80px;
      }

      .split-left {
        background: linear-gradient(90deg, rgba(0, 240, 255, 0.1), transparent);
        border-right: 2px solid rgba(255,255,255,0.1);
      }
      
      .split-right {
        background: linear-gradient(-90deg, rgba(168, 85, 247, 0.1), transparent);
      }
      
      .percentage {
        font-size: 160px;
        font-family: "Outfit", sans-serif;
        font-weight: 900;
        line-height: 1;
      }

      .bg-radial {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at center, rgba(0, 240, 255, 0.15) 0%, transparent 70%);
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div class="bg-radial"></div>

      <!-- Scene 1 -->
      <div id="scene1" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <h1>Rent used to be a <span style="color: #64748b">black hole.</span></h1>
      </div>

      <!-- Scene 2 -->
      <div id="scene2" class="clip" data-start="3" data-duration="4" data-track-index="1">
        <div class="inner" id="scene2-inner">
          <h1 style="margin-bottom: 80px">Now, it's an <span class="primary-glow">asset.</span></h1>
          <div class="card" id="swap-card">
            <div style="font-size: 32px; color: #94a3b8; text-transform: uppercase; letter-spacing: 4px;">Collateralizing on Solana</div>
            <div class="swap-row">
              <div class="token" style="border-color: #3b82f6">USDC</div>
              <div class="arrow">→</div>
              <div class="token" style="border-color: #00f0ff; color: #00f0ff; text-shadow: 0 0 20px rgba(0,240,255,0.5)">ONDO USDY</div>
            </div>
            <div style="font-size: 24px; color: #64748b; font-family: 'JetBrains Mono', monospace;">TX: 4vJ9...8kLp</div>
          </div>
        </div>
      </div>

      <!-- Scene 3 -->
      <div id="scene3" class="clip" data-start="7" data-duration="6" data-track-index="1">
        <div class="inner" id="scene3-inner">
          <div class="zk-container">
            <div class="zk-node" id="n1" style="top: 50%; left: 10%"></div>
            <div class="zk-node" id="n2" style="top: 20%; left: 50%"></div>
            <div class="zk-node" id="n3" style="top: 80%; left: 50%"></div>
            <div class="zk-node" id="n4" style="top: 50%; left: 90%; background: #a855f7; box-shadow: 0 0 30px #a855f7"></div>
            
            <div class="zk-line" id="l1" style="top: 52%; left: 12%; width: 38%; transform: rotate(-35deg)"></div>
            <div class="zk-line" id="l2" style="top: 52%; left: 12%; width: 38%; transform: rotate(35deg)"></div>
            <div class="zk-line" id="l3" style="top: 22%; left: 52%; width: 38%; transform: rotate(35deg)"></div>
            <div class="zk-line" id="l4" style="top: 82%; left: 52%; width: 38%; transform: rotate(-35deg)"></div>
          </div>
          <h2 style="margin-bottom: 20px">Zero-Knowledge Proof of Rent.</h2>
          <p style="font-size: 32px; color: #94a3b8">Private. Portable. Powerful.</p>
        </div>
      </div>

      <!-- Scene 4 -->
      <div id="scene4" class="clip" data-start="13" data-duration="4" data-track-index="1">
        <div class="inner" id="scene4-inner">
          <div style="position: absolute; top: 100px; width: 100%; text-align: center; z-index: 10">
            <h2 style="font-size: 64px">Yield split automatically</h2>
          </div>
          <div class="split-screen">
            <div class="split-half split-left" id="split-left">
              <div class="percentage primary-glow">50%</div>
              <div style="font-size: 48px; margin-top: 20px">Tenant Equity</div>
            </div>
            <div class="split-half split-right" id="split-right">
              <div class="percentage secondary-glow">50%</div>
              <div style="font-size: 48px; margin-top: 20px">Landlord Return</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Scene 5 -->
      <div id="scene5" class="clip" data-start="17" data-duration="3" data-track-index="1">
        <div class="inner" id="scene5-inner">
          <h1 style="font-size: 140px; margin-bottom: 40px" class="primary-glow">Pabandi</h1>
          <h2 style="font-size: 48px; color: #94a3b8; font-weight: 500">Commitment, Secured on Web3.</h2>
        </div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.set("#scene1", { autoAlpha: 1 }, 0)
        .from("#scene1 h1", { opacity: 0, y: 50, duration: 1, ease: "power3.out" }, 0.5)
        .to("#scene1 h1", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 2.5)
        .set("#scene1 h1", { opacity: 0 }, 3.00);

      // Scene 2
      tl.set("#scene2", { autoAlpha: 1 }, 3)
        .from("#scene2-inner h1", { opacity: 0, scale: 0.9, duration: 0.8, ease: "back.out(1.5)" }, 3)
        .from("#swap-card", { opacity: 0, y: 100, duration: 1, ease: "power4.out" }, 3.5)
        .from(".token", { opacity: 0, x: -50, stagger: 0.2, duration: 0.8, ease: "power2.out" }, 4)
        .from(".arrow", { opacity: 0, scale: 0, duration: 0.5, ease: "back.out(2)" }, 4.3)
        .to("#scene2-inner", { opacity: 0, duration: 0.5 }, 6.5)
        .set("#scene2-inner", { opacity: 0 }, 7.00);

      // Scene 3
      tl.set("#scene3", { autoAlpha: 1 }, 7)
        .from("#scene3-inner h2, #scene3-inner p", { opacity: 0, y: 30, stagger: 0.2, duration: 1, ease: "power3.out" }, 7.5)
        .from(".zk-node", { opacity: 0, scale: 0, stagger: 0.1, duration: 0.5, ease: "back.out(2)" }, 8)
        .from(".zk-line", { scaleX: 0, opacity: 0, stagger: 0.15, duration: 0.6, ease: "power2.out" }, 8.5)
        .to(".zk-node", { scale: 1.2, yoyo: true, repeat: -1, duration: 0.8, ease: "sine.inOut" }, 9)
        .to("#scene3-inner", { opacity: 0, filter: "blur(20px)", duration: 0.8 }, 12.2)
        .set("#scene3-inner", { opacity: 0 }, 13.00);

      // Scene 4
      tl.set("#scene4", { autoAlpha: 1 }, 13)
        .from("#scene4-inner h2", { opacity: 0, y: -50, duration: 0.8, ease: "power3.out" }, 13)
        .from("#split-left", { x: "-100%", duration: 1, ease: "power4.out" }, 13.5)
        .from("#split-right", { x: "100%", duration: 1, ease: "power4.out" }, 13.5)
        .from(".percentage", { opacity: 0, scale: 0.5, stagger: 0.2, duration: 0.8, ease: "back.out(1.5)" }, 14.5)
        .to("#scene4-inner", { opacity: 0, y: -100, duration: 0.5, ease: "power2.in" }, 16.5)
        .set("#scene4-inner", { opacity: 0 }, 17.00);

      // Scene 5
      tl.set("#scene5", { autoAlpha: 1 }, 17)
        .from("#scene5-inner h1", { opacity: 0, scale: 0.8, duration: 1.5, ease: "expo.out" }, 17)
        .from("#scene5-inner h2", { opacity: 0, y: 30, duration: 1, ease: "power3.out" }, 17.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
