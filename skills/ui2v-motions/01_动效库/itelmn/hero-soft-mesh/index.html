<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff7ed; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff7ed; }
      .mesh {
        position: absolute; inset: -10%;
        background:
          radial-gradient(circle at 20% 30%, #fb7185 0%, transparent 42%),
          radial-gradient(circle at 75% 25%, #38bdf8 0%, transparent 40%),
          radial-gradient(circle at 55% 75%, #c084fc 0%, transparent 45%),
          radial-gradient(circle at 30% 80%, #fbbf24 0%, transparent 35%),
          #fff7ed;
        filter: blur(8px);
      }
      .copy {
        position: absolute; left: 160px; top: 360px; color: #0f172a;
        font-family: Georgia, serif; letter-spacing: -0.03em;
        mix-blend-mode: multiply;
      }
      .eyebrow {
        font-family: "Segoe UI", sans-serif; font-size: 24px; letter-spacing: 0.28em;
        text-transform: uppercase; color: #9f1239; margin-bottom: 24px;
      }
      .title { font-size: 128px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 28px; font-family: "Segoe UI", sans-serif; font-size: 34px; color: #334155; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="mesh" class="clip mesh" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="eyebrow">Soft field</div>
        <div class="title">Mesh Glow</div>
        <div class="sub">Warm ambient color without hard geometry</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#mesh", { opacity: 0, scale: 1.15 });
      gsap.set("#copy", { opacity: 0, y: 24 });
      gsap.set(".eyebrow", { opacity: 0, y: 10 });
      gsap.set(".title", { opacity: 0, y: 20 });
      gsap.set(".sub", { opacity: 0, y: 14 });
      tl.to("#mesh", { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0)
        .to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.5)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.5)
        .to(".title", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.65)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.95)
        .to("#mesh", { x: 40, y: -30, scale: 1.05, duration: 2.6, ease: "sine.inOut" }, 1.5);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
