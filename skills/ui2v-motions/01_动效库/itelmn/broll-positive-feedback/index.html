<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"runaway","type":"color","label":"Runaway color","default":"#c9342d"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--paper:#f1f0e9;--ink:#111419;--blue:#1748b5;--gray:#8b9098}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#clip{position:absolute;inset:0;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,72,181,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(23,72,181,.07) 2px,transparent 2px);background-size:72px 72px}
.rail{position:absolute;left:86px;top:76px;bottom:72px;width:420px;border-left:8px solid var(--blue);padding-left:34px}
.rail small{font:700 18px "Courier New",monospace;color:var(--blue);letter-spacing:.14em}
.rail h1{margin:24px 0 18px;font:900 75px/.92 Arial,sans-serif;letter-spacing:-.055em}
.rail p{margin:0;width:320px;font:400 28px/1.3 Georgia,serif;color:#3d424a}
.gain-panel{position:absolute;left:0;bottom:0;width:380px}
.gain-head{display:flex;justify-content:space-between;font:700 17px "Courier New",monospace;letter-spacing:.08em}
.gain-track{height:22px;margin-top:13px;border:3px solid var(--ink);padding:3px}.gain-fill{height:100%;width:100%;background:var(--blue);transform-origin:left}
.state{margin-top:17px;font:900 24px Arial,sans-serif;color:var(--blue)}
#diagram{position:absolute;left:505px;top:38px;width:1370px;height:990px}
#loop{fill:none;stroke:var(--blue);stroke-width:12;stroke-linecap:round}
.guide{fill:none;stroke:#a9b5d2;stroke-width:2;stroke-dasharray:10 14}
.arrow{fill:var(--blue)}
.station .plate{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.station .num{fill:var(--blue);font:900 30px Arial,sans-serif}
.station .label{fill:var(--ink);font:800 21px "Courier New",monospace;letter-spacing:.06em}
#signal{fill:var(--paper);stroke:var(--runaway);stroke-width:8;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--runaway) 45%,transparent))}
#core-disc{fill:var(--blue);opacity:.1}
#multiplier{fill:var(--ink);font:900 164px Arial,sans-serif;letter-spacing:-.08em;text-anchor:middle}
#sub{fill:#4f5359;font:700 18px "Courier New",monospace;letter-spacing:.12em;text-anchor:middle}
.burst{fill:none;stroke:var(--runaway);stroke-width:5;opacity:0}
.no-labels .rail,.no-labels .station text,.no-labels #sub{opacity:0}
</style></head>
<body>
<div id="stage" data-composition-id="broll-positive-feedback" data-start="0" data-duration="8.5" data-fps="30" data-width="1920" data-height="1080">
<div id="clip" class="clip" data-start="0" data-duration="8.5" data-track-index="1">
<div class="grid"></div>
<aside class="rail"><small>SYSTEM BEHAVIOUR / 03</small><h1>POSITIVE<br/>FEEDBACK</h1><p>Output returns as input. Each cycle reinforces the next.</p><div class="gain-panel"><div class="gain-head"><span>LOOP GAIN</span><span id="gain-read">1.00×</span></div><div class="gain-track"><div class="gain-fill"></div></div><div class="state" id="state-read">STABLE RESPONSE</div></div></aside>
<svg id="diagram" viewBox="0 0 1370 990" aria-label="Escalating positive feedback loop">
<path class="guide" d="M690 116 A365 365 0 1 1 689 116"/>
<path id="loop" d="M690 116 A365 365 0 1 1 689 116"/>
<path class="arrow" d="M1040 390 l45 22 -48 14 z"/><path class="arrow" d="M475 782 l-45 -22 48 -14 z"/><path class="arrow" d="M455 235 l-8 -50 41 30 z"/>
<circle id="core-disc" cx="690" cy="490" r="210"/>
<text id="multiplier" x="690" y="515">1.0×</text><text id="sub" x="690" y="645">REINFORCEMENT FACTOR</text>
<g class="station" id="stimulus" transform="translate(690 116)"><rect class="plate" x="-138" y="-48" rx="8" width="276" height="96"/><text class="num" x="-112" y="11">01</text><text class="label" x="-55" y="9">STIMULUS</text></g>
<g class="station" id="response" transform="translate(1008 674)"><rect class="plate" x="-138" y="-48" rx="8" width="276" height="96"/><text class="num" x="-112" y="11">02</text><text class="label" x="-55" y="9">RESPONSE</text></g>
<g class="station" id="return" transform="translate(372 674)"><rect class="plate" x="-138" y="-48" rx="8" width="276" height="96"/><text class="num" x="-112" y="11">03</text><text class="label" x="-55" y="9">RETURN</text></g>
<circle id="signal" cx="690" cy="116" r="18"/>
<circle class="burst" cx="690" cy="490" r="225"/><circle class="burst" cx="690" cy="490" r="225"/><circle class="burst" cx="690" cy="490" r="225"/>
</svg>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const path=document.getElementById('loop'),signal=document.getElementById('signal'),length=path.getTotalLength();
const driver={turns:0,gain:1};const tl=gsap.timeline({paused:true});
function draw(){const p=path.getPointAtLength((driver.turns%1)*length);signal.setAttribute('cx',p.x);signal.setAttribute('cy',p.y);const g=driver.gain;document.getElementById('multiplier').textContent=g.toFixed(1)+'×';document.getElementById('gain-read').textContent=g.toFixed(2)+'×';}
tl.fromTo('.rail',{x:-70,autoAlpha:0},{x:0,autoAlpha:1,duration:.65,ease:'power3.out'},0);
tl.fromTo('.station',{scale:.55,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.5,stagger:.12,ease:'back.out(1.6)'},.3);
tl.fromTo('#loop',{strokeDasharray:length,strokeDashoffset:length},{strokeDashoffset:0,duration:1.1,ease:'power2.inOut'},.25);
tl.fromTo('#signal',{scale:.2,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.4,ease:'back.out(2)'},1.05);
tl.to(driver,{turns:1,gain:1.25,duration:1.35,ease:'power1.inOut',onUpdate:draw},1.2);
tl.to('.gain-fill',{scaleX:.38,duration:1.35,ease:'power2.out'},1.2);
tl.to(driver,{turns:2,gain:1.82,duration:1.25,ease:'power2.in',onUpdate:draw},2.7);
tl.to('#core-disc',{scale:1.18,opacity:.18,transformOrigin:'center',duration:1.25,ease:'power2.in'},2.7);
tl.set('#state-read',{textContent:'SELF-REINFORCING'},3.2);
tl.to(driver,{turns:3,gain:2.56,duration:1.1,ease:'power3.in',onUpdate:draw},4.05);
tl.to('#loop',{strokeWidth:22,stroke:'var(--runaway)',duration:1.1,ease:'power3.in'},4.05);
tl.to('#core-disc',{scale:1.42,fill:'var(--runaway)',opacity:.22,transformOrigin:'center',duration:1.1,ease:'power3.in'},4.05);
tl.set('#state-read',{textContent:'UNSTABLE GROWTH',color:'var(--runaway)'},4.55);
tl.to(driver,{turns:4.15,gain:3.4,duration:1.05,ease:'expo.in',onUpdate:draw},5.35);
tl.to('.gain-fill',{scaleX:1,backgroundColor:'var(--runaway)',duration:1.05,ease:'expo.in'},5.35);
tl.set('#state-read',{textContent:'RUNAWAY LOOP'},6.05);
tl.fromTo('.burst',{scale:.45,autoAlpha:.75,transformOrigin:'center'},{scale:2.25,autoAlpha:0,duration:1.25,stagger:.16,ease:'power2.out'},6.25);
tl.to('#multiplier',{scale:1.18,fill:'var(--runaway)',transformOrigin:'center',duration:.45,ease:'back.out(1.8)'},6.25);
tl.to('#clip',{autoAlpha:0,duration:.35,ease:'power2.in'},8.08);
tl.seek(0);window.__timelines['broll-positive-feedback']=tl;
</script></body></html>
