<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:Mont;src:url('assets/montserrat.woff2')}*{box-sizing:border-box}body{margin:0}#stage{width:1920px;height:1080px;background:var(--bg);color:var(--fg);font-family:Noto;overflow:hidden}.clip{position:absolute;inset:0;overflow:hidden}.layout{padding:105px 130px;height:100%;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;font-size:28px;letter-spacing:5px;color:var(--accent)}.identity{display:flex;flex-direction:column;align-items:flex-start;gap:26px;max-width:970px;margin-bottom:55px}.name-mask{height:165px;overflow:hidden}.name{font-size:128px;font-weight:800;line-height:160px;letter-spacing:14px}.role{font-size:34px;letter-spacing:3px}.baseline{width:910px;height:3px;background:var(--accent);transform-origin:left}.kicker{font-size:28px;letter-spacing:6px;color:var(--accent)}.badge-shell{position:absolute;right:125px;top:240px;width:610px;height:610px;perspective:1300px}.badge{width:610px;height:610px;border:1px solid #73c3ff66;border-radius:50%;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;box-shadow:inset 0 0 100px #73c3ff0c}.badge svg{width:470px;height:470px;overflow:visible}.orbit{position:absolute;inset:28px;border:1px solid #73c3ff44;border-radius:50%}.ring{position:absolute;inset:74px;border:3px solid var(--accent);border-radius:50%;clip-path:polygon(0 0,100% 0,100% 38%,0 100%)}.scan{position:absolute;left:0;top:0;width:610px;height:2px;background:var(--accent);box-shadow:0 0 24px var(--accent)}.logo-path{fill:none;stroke:var(--fg);stroke-width:25;stroke-linecap:square;stroke-linejoin:miter}.point{position:absolute;right:142px;top:278px;width:14px;height:14px;border-radius:50%;background:var(--accent)}.frame{position:absolute;inset:68px;border:1px solid #73c3ff18;pointer-events:none}.brand{font-family:Mont;letter-spacing:5px}.bgline{position:absolute;left:0;top:485px;width:1160px;height:1px;background:linear-gradient(90deg,#73c3ff00,#73c3f </style></head><body><div id="stage" data-composition-id="creator-id" data-width="1920" data-height="1080" data-fps="30" data-start="0" data-duration="8"><div id="creator-clip" class="clip" data-start="0" data-duration="8"><div class="frame"></div><div class="bgline"></div><div class="badge-shell"><div class="badge"><div class="orbit"></div><div class="ring"></div><svg viewBox="0 0 500 500"><path class="logo-path" d="M130 165L250 85L370 165L250 245Z M130 245L250 325L370 245 M130 325L250 405L370 325"/></svg></div><div class="scan"></div><div class="point"></div></div><div class="layout"><div class="top"><span id="channel"></span><span class="brand">AN INDEPENDENT PERSPECTIVE</span></div><div class="identity" data-layout-allow-overflow><div class="kicker">影像 · 叙事 · 观察</div><div class="name-mask"><div class="name" data-layout-allow-overflow id="name"></div></div><div class="baseline"></div><div class="role" id="role"></div></div></div></div></div><script>
// CONFIG: replace author, channel, role and palette; all geometry is editable SVG/CSS.
const CONFIG={name:'林野',channel:'一隅观察',role:'影像观察者 · 把复杂讲清楚',bg:'#102655',fg:'#F7F6ED',accent:'#73C3FF'};Object.entries(CONFIG).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.textContent=v});['bg','fg','accent'].forEach(k=>document.documentElement.style.setProperty('--'+k,CONFIG[k]));
// Adapted lt-kicker-name baseline draw and masked name/kicker; added spatial monogram and single scanner pass.
const tl=gsap.timeline({paused:true});tl.fromTo('.baseline',{scaleX:0},{scaleX:1,duration:.8,ease:'power3.out'},.1).fromTo('.name',{y:170},{y:0,duration:.8,ease:'power4.out'},.4).fromTo('.kicker,.role',{y:25,opacity:0},{y:0,opacity:1,duration:.6,stagger:.15,ease:'power3.out'},.6).fromTo('.top,.frame,.bgline',{opacity:0},{opacity:1,duration:1},.4).fromTo('.badge',{rotationY:-65,rotationZ:-25,z:-280,opacity:0},{rotationY:0,rotationZ:0,z:0,opacity:1,duration:1.6,ease:'power3.out'},.2).fromTo('.point',{scale:0},{scale:1,duration:.5,ease:'back.out(1.5)'},1.5).fromTo('.ring',{rotation:0},{rotation:115,duration:4.5,ease:'sine.inOut'},1.3).fromTo('.scan',{y:0,opacity:0},{opacity:1,duration:.12},3.3).to('.scan',{y:610,duration:1.05,ease:'power2.inOut'},3.35).to('.scan',{opacity:0,duration:.2},4.35).to('.identity',{x:-1050,duration:.8,ease:'power3.in'},6.4).to('.badge',{scale:.025,rotationY:70,rotationZ:50,opacity:0,duration:.8,ease:'power3.in'},6.5).to('.point,.top,.frame,.bgline',{opacity:0,duration:.5},6.8);window.__timelines=window.__timelines||{};window.__timelines['creator-id']=tl;tl.seek(0);
</script></body></html>
