<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0a09; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0c0a09; }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ribbon {
        fill: none; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 2200; stroke-dashoffset: 2200;
      }
      #r1 { stroke: #fbbf24; stroke-width: 28; }
      #r2 { stroke: #f59e0b; stroke-width: 16; opacity: 0.7; }
      #r3 { stroke: #fde68a; stroke-width: 8; opacity: 0.45; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <svg class="clip" data-start="0" data-duration="4.5" data-track-index="0" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <path id="r3" class="ribbon" d="M-80,820 C240,200 520,980 820,360 S1320,900 1680,280 S2100,700 2100,700" />
        <path id="r2" class="ribbon" d="M-60,760 C280,240 560,920 860,400 S1360,860 1720,320 S2120,660 2120,660" />
        <path id="r1" class="ribbon" d="M-40,700 C320,280 600,860 900,440 S1400,820 1760,360 S2140,620 2140,620" />
      </svg>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#r1", "#r2", "#r3"], { strokeDashoffset: 2200 });
      tl.to("#r3", { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 0.2)
        .to("#r2", { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 0.35)
        .to("#r1", { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 0.5)
        .to(["#r1", "#r2", "#r3"], { y: -18, duration: 1.4, ease: "sine.inOut" }, 2.8);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
