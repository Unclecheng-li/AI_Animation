<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悟空安全 · C盘清理 — 仿 Win11 演示动画总览（仿真子集）</title>
<style>
:root{
  --bg:#0c0e13; --bg2:#12151d; --card:#171b26; --card2:#1d2230;
  --line:rgba(255,255,255,.08); --txt:#e8eaf2; --dim:#8b90a3; --dim2:#5c6172;
  --red:#e8433f; --red2:#ff6a5e; --blue:#4da3ff; --amber:#ffb84d; --green:#41d99c;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -5%,rgba(232,67,63,.10),transparent 60%),
             radial-gradient(700px 420px at 8% 30%,rgba(77,163,255,.06),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:44px 36px 90px}

header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:22px;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:52px;filter:drop-shadow(0 4px 18px rgba(232,67,63,.35))}
.h-title{font-size:30px;font-weight:800;letter-spacing:1px;line-height:1.25}
.h-title em{font-style:normal;color:var(--red2)}
.h-sub{margin-top:6px;font-size:13px;color:var(--dim);letter-spacing:.5px}
.stats{display:flex;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-align:center;min-width:96px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:700;color:#fff}
.stat span{font-size:11px;color:var(--dim);letter-spacing:1px}
.stat.r b{color:var(--red2)} .stat.b b{color:var(--blue)} .stat.g b{color:var(--green)}

.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:14px 4px 30px;font-size:12px;color:var(--dim)}
.lg{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px}
kbd{font-family:var(--mono);font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--dim)}

.chapter{margin-bottom:44px}
.ch-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ch-idx{font-family:var(--mono);font-size:13px;color:var(--red2);border:1px solid rgba(232,67,63,.4);border-radius:8px;padding:3px 10px;background:rgba(232,67,63,.08);flex-shrink:0}
.ch-name{font-size:21px;font-weight:800;letter-spacing:.5px;color:var(--txt)}
.ch-time{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}

.card{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;text-decoration:none;color:inherit;transition:transform .22s cubic-bezier(.2,.9,.3,1.4),border-color .2s,box-shadow .2s;overflow:hidden}
a.card:hover{transform:translateY(-4px);border-color:rgba(77,163,255,.55);box-shadow:0 14px 34px -14px rgba(77,163,255,.35)}
.c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.c-no{font-family:var(--mono);font-size:12px;color:var(--dim)}
.badge{font-size:10.5px;letter-spacing:1px;padding:3px 9px;border-radius:999px;border:1px solid;color:var(--blue);border-color:rgba(77,163,255,.4);background:rgba(77,163,255,.09)}
.c-name{font-size:15.5px;font-weight:700;line-height:1.45;margin-bottom:9px;min-height:44px}
.c-file{font-family:var(--mono);font-size:10.5px;color:var(--dim2);word-break:break-all;margin-bottom:11px;line-height:1.5}
.c-meta{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.c-meta .dur{color:var(--txt)}
.card .go{position:absolute;right:14px;bottom:12px;width:26px;height:26px;border-radius:50%;background:rgba(77,163,255,.14);border:1px solid rgba(77,163,255,.45);display:grid;place-items:center;font-size:12px;color:var(--blue);opacity:0;transform:translateX(-6px);transition:all .22s}
a.card:hover .go{opacity:1;transform:none}
.done-chip{position:absolute;top:-1px;right:14px;font-size:9.5px;letter-spacing:1px;background:linear-gradient(180deg,#2f80d8,#0067c0);color:#fff;padding:3px 9px 4px;border-radius:0 0 8px 8px}

footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim2)}
footer img{height:20px;opacity:.55;vertical-align:middle;margin-right:8px}
::selection{background:rgba(77,163,255,.4)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <img src="wukong/logo-h-white.png" alt="悟空安全">
    <div>
      <div class="h-title">C盘清理 · <em>仿 Win11 演示动画</em>（仿真子集）</div>
      <div class="h-sub">原项目 46 镜头中的 21 个「写实仿真」页 — 1:1 还原 Windows 11 界面，每镜一个 HTML</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat b"><b>21</b><span>仿 Win11 页面</span></div>
    <div class="stat r"><b>9</b><span>章节</span></div>
    <div class="stat g"><b>~10m</b><span>累计时长</span></div>
  </div>
</header>

<div class="legend">
  <span class="lg"><i class="dot" style="background:var(--blue)"></i>写实仿真 · 1:1 还原 Win11 界面（桌面 / 资源管理器 / 对话框 / 蓝屏 / 光标演出）</span>
  <span style="margin-left:auto">进入页面后点击 <kbd>启 动 播 放</kbd>，黑场淡入后开始计时</span>
</div>

<div id="app"></div>

<footer>
  <div><img src="wukong/icon.png" alt="">悟空安全 · 0 添加 · 弹必赔 — 商单视频制作工程（Win11 仿真子集）</div>
  <div>原完整工程另含 9 个信息动效页与 19 个实拍录屏镜头，不在本子集内</div>
</footer>

</div>

<script>
const CH=[
 {n:0,t:"删掉这个文件夹，电脑再也开不了机"},
 {n:1,t:"305 个 G，到底被谁占了"},
 {n:2,t:"根目录这一排，一个都不能直接删"},
 {n:3,t:"为什么显示 32G，实际只占 23.6G"},
 {n:7,t:"两个你肯定会搜到的大文件"},
];
const S=[
 // [章节, 镜头号, 标题, 区间, 时长, 系统场景, 文件名]
 [0,1,"C盘爆红 · 哪个能删","0:00–0:20","20s","此电脑 / 资源管理器 / 报错弹窗","shot-01_C盘爆红哪个能删.html"],
 [0,2,"快捷方式与程序本体","0:20–1:03","43s","桌面 / 快捷方式箭头 / XP 壁纸彩蛋","shot-02_快捷方式与程序本体.html"],
 [0,3,"对撞卡与虚拟机","1:03–1:26","23s","桌面弹窗 / 虚拟机隔离","shot-03_对撞卡与虚拟机.html"],
 [0,4,"删 Windows · 失灵链","1:26–1:58","32s","开始菜单 / 警告链","shot-04_删Windows失灵链.html"],
 [0,5,"蓝色自动修复","1:58–2:25","27s","WinRE 蓝屏 / 自动修复 / 百分比","shot-05_蓝色自动修复.html"],
 [1,7,"本机底子 305G","2:45–3:01","16s","此电脑 / 驱动器磁贴","shot-07_本机底子305G.html"],
 [1,8,"色块画布","3:01–3:25","24s","容量色块化","shot-08_色块画布.html"],
 [1,9,"钻进 AppData","3:25–3:43","18s","资源管理器 / 隐藏文件夹","shot-09_钻进AppData.html"],
 [1,10,"剪映 72G 拆解","3:43–4:17","34s","文件夹尺寸 / 大图标","shot-10_剪映72G拆解.html"],
 [1,11,"Edge / Temp / updater","4:17–4:43","26s","用户目录 / 三大缓存","shot-11_Edge_Temp_updater.html"],
 [1,12,"串烧快切","4:43–5:12","29s","任务栏切换 / 多窗快切","shot-12_串烧快切.html"],
 [1,13,"占比浮层","5:12–5:32","20s","占比环浮层","shot-13_占比浮层.html"],
 [2,15,"根目录导览","5:56–6:21","25s","C:\\ 根目录 / 大图标","shot-15_根目录导览.html"],
 [2,16,"WinSxS 组件仓库","6:21–6:46","25s","组件仓库类比","shot-16_WinSxS组件仓库.html"],
 [2,17,"双窗对比","6:46–7:29","43s","双资源管理器并排","shot-17_双窗对比.html"],
 [2,18,"程序和功能","7:29–8:01","32s","设置 / 应用列表","shot-18_程序和功能.html"],
 [2,19,"回收站三步","8:01–8:26","25s","桌面右键 / 回收站","shot-19_回收站三步.html"],
 [3,21,"根目录结论","9:06–9:45","39s","结论定格 / 红圈标记","shot-21_根目录结论.html"],
 [7,41,"文件夹选项","16:24–16:39","15s","经典选项对话框","shot-41_文件夹选项.html"],
 [7,42,"hiberfil 休眠文件","16:39–17:11","32s","系统文件 / 显隐切换","shot-42_hiberfil休眠文件.html"],
 [7,43,"pagefile 虚拟内存","17:11–17:39","28s","系统属性对话框","shot-43_pagefile虚拟内存.html"],
];
const pad=n=>String(n).padStart(2,"0");
let html="";
CH.forEach(ch=>{
  const shots=S.filter(s=>s[0]===ch.n);
  html+=`<section class="chapter">
    <div class="ch-head">
      <span class="ch-idx">CH.${pad(ch.n)}</span>
      <span class="ch-name">${ch.t}</span>
      <span class="ch-time">${shots.length} 镜</span>
    </div>
    <div class="grid">`;
  shots.forEach(s=>{
    html+=`<a class="card" href="${encodeURI(s[6])}" target="_blank">
      <div class="done-chip">WIN11</div>
      <div class="c-top"><span class="c-no">SHOT ${pad(s[1])}</span><span class="badge">写实仿真</span></div>
      <div class="c-name">${s[2]}</div>
      <div class="c-file">${s[5]}</div>
      <div class="c-meta"><span>${s[3]}</span><span class="dur">${s[4]}</span></div>
      <div class="go">▶</div></a>`;
  });
  html+=`</div></section>`;
});
document.getElementById("app").innerHTML=html;
</script>
</body>
</html>
