<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a1628; }
      body { font-family: "Noto Sans TC", sans-serif; }
      .bg-gradient { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: linear-gradient(135deg, #2a0d22 0%, #3d1030 30%, #4a143a 60%, #521745 100%); }
      .accent-bar { position: absolute; top: 0; left: 0; width: 1920px; height: 6px; background: linear-gradient(90deg, #db2777, #ec4899, #f472b6, #ec4899, #db2777); }
      .content-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(244,114,182,0.18); border-radius: 20px; padding: 50px 70px; max-width: 1450px; text-align: center; }
      .icon-circle { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 24px; background: linear-gradient(135deg, #db2777, #f472b6); display: flex; align-items: center; justify-content: center; font-size: 44px; }
      h1 { font-size: 64px; font-weight: 900; color: #fff; margin-bottom: 16px; letter-spacing: 0.05em; }
      h2 { font-size: 36px; font-weight: 700; color: #f472b6; margin-bottom: 20px; }
      p { font-size: 30px; font-weight: 400; color: #cbd5e1; line-height: 1.7; }
      .highlight { color: #f472b6; font-weight: 700; }
      .law-ref { font-size: 26px; color: #94a3b8; margin-top: 26px; padding: 14px 28px; background: rgba(219,39,119,0.18); border-radius: 12px; display: inline-block; }
      .cycle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-top: 22px; }
      .cycle-step { background: rgba(244,114,182,0.08); border: 1px solid rgba(244,114,182,0.25); border-radius: 16px; padding: 26px 18px; text-align: center; }
      .cycle-step .rho { font-size: 32px; color: #f472b6; font-weight: 900; }
      .cycle-step .nm { font-size: 26px; color: #fff; font-weight: 700; margin: 6px 0; }
      .cycle-step .dd { font-size: 20px; color: #94a3b8; line-height: 1.5; }
      .ground-list { text-align: left; margin-top: 16px; }
      .ground-row { background: rgba(244,114,182,0.06); border: 1px solid rgba(244,114,182,0.2); border-radius: 12px; padding: 14px 22px; margin-top: 10px; font-size: 24px; color: #e2e8f0; }
      .ground-row .k { color: #f472b6; font-weight: 700; }
      .callout { margin-top: 26px; font-size: 30px; font-weight: 700; color: #fbbf24; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="video15" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div class="clip" data-start="0" data-duration="30" data-track-index="0">
        <div class="bg-gradient"></div>
        <div class="accent-bar"></div>
      </div>
      <div id="scene1" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="content-area">
          <div class="card">
            <div class="icon-circle">&#x1F501;</div>
            <h1>申復與重新調查</h1>
            <h2>案件尚未真正結束前，你可以怎麼救濟</h2>
          </div>
        </div>
      </div>
      <div id="scene2" class="clip" data-start="5" data-duration="8" data-track-index="1">
        <div class="content-area">
          <div class="card">
            <h1 style="font-size:46px">3 個關鍵時點</h1>
            <div class="cycle">
              <div class="cycle-step"><div class="rho">30 日</div><div class="nm">申復期限</div><div class="dd">收到決定翌日起<br>以 1 次為限</div></div>
              <div class="cycle-step"><div class="rho">10 工作日</div><div class="nm">審議會議</div><div class="dd">接獲申復後<br>召開審議會議</div></div>
              <div class="cycle-step"><div class="rho">30 日</div><div class="nm">申復決定</div><div class="dd">審議召開日起<br>（可延 30 日）</div></div>
            </div>
            <div class="law-ref" style="margin-top:22px">職場霸凌防治措施準則 §15–§17</div>
          </div>
        </div>
      </div>
      <div id="scene3" class="clip" data-start="13" data-duration="9" data-track-index="1">
        <div class="content-area">
          <div class="card">
            <h1 style="font-size:46px">申復事由與重新調查</h1>
            <div class="ground-list">
              <div class="ground-row"><span class="k">受理/不受理</span>：申訴程序違背法令</div>
              <div class="ground-row"><span class="k">調查瑕疵</span>：調查方法、迴避、保密違反規定</div>
              <div class="ground-row"><span class="k">認定不當</span>：事實認定錯誤或證據不足</div>
              <div class="ground-row"><span class="k">重新調查</span>：主管機關認有重大瑕疵，得命重調 2 個月</div>
            </div>
          </div>
        </div>
      </div>
      <div id="scene4" class="clip" data-start="22" data-duration="8" data-track-index="1">
        <div class="content-area">
          <div class="card">
            <h1>救濟有路，監督有據</h1>
            <p style="margin-top:16px">申復一次、重調一次，透明可檢驗</p>
            <div class="callout">程序完善，公信才能延續</div>
            <div class="law-ref">職場霸凌防治措施準則 §15–§17</div>
          </div>
        </div>
      </div>
    </div>
    <script>

      tl.from("#scene1 .card", { opacity: 0, scale: 0.9, duration: 0.8 }, 0);
      tl.from("#scene1 .icon-circle", { opacity: 0, y: -40, duration: 0.6 }, 0.2);

      tl.from("#scene2 .cycle-step", { opacity: 0, y: 50, duration: 0.5, stagger: 0.2 }, 5.8);
      tl.from("#scene2 .law-ref", { opacity: 0, y: 20, duration: 0.5 }, 6.8);
      tl.from("#scene3 .card", { opacity: 0, x: -60, duration: 0.8 }, 13);
      tl.from("#scene3 h1", { opacity: 0, y: -20, duration: 0.5 }, 13.3);
      tl.from("#scene3 .ground-row", { opacity: 0, x: -40, duration: 0.5, stagger: 0.18 }, 13.8);
      tl.from("#scene4 .card", { opacity: 0, x: 60, duration: 0.8 }, 22);
      tl.from("#scene4 h1", { opacity: 0, y: -20, duration: 0.6 }, 22.3);
      tl.from("#scene4 p", { opacity: 0, y: 20, duration: 0.5 }, 22.8);
      tl.from("#scene4 .callout", { opacity: 0, scale: 0.8, duration: 0.5 }, 23.5);
      tl.from("#scene4 .law-ref", { opacity: 0, y: 20, duration: 0.5 }, 24);
      window.__timelines["video15"] = tl;
    </script>
  </body>
</html>
