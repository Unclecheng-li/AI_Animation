<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05060a; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(80% 70% at 70% 45%, #14182a 0%, #05060a 68%);
      }
      .pulse {
        position: absolute; left: 1180px; top: 280px; width: 420px; height: 420px;
        margin: -210px 0 0 -210px; border-radius: 50%;
        border: 3px solid rgba(34, 211, 238, 0.55);
        box-shadow: 0 0 40px rgba(34, 211, 238, 0.35), inset 0 0 40px rgba(34, 211, 238, 0.12);
      }
      .pulse-b { border-color: rgba(244, 114, 182, 0.5); box-shadow: 0 0 36px rgba(244, 114, 182, 0.3); }
      .pulse-c { border-color: rgba(167, 139, 250, 0.45); }
      .core {
        position: absolute; left: 1180px; top: 280px; width: 96px; height: 96px;
        margin: -48px 0 0 -48px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #22d3ee 40%, #6366f1 100%);
      }
      .copy { position: absolute; left: 140px; top: 340px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(34, 211, 238, 0.85); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="pulse-a" class="clip pulse" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="pulse-b" class="clip pulse pulse-b" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="pulse-c" class="clip pulse pulse-c" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="core" class="clip core" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="4">
        <div class="eyebrow">UI2V · Signal</div>
        <div class="title">Neon Pulse</div>
        <div class="sub">Radiating rings for live status heroes</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#pulse-a", "#pulse-b", "#pulse-c"], { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#core", { scale: 0.4, opacity: 0 });
      gsap.set("#copy", { opacity: 0, y: 28 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 24 });
      gsap.set(".sub", { opacity: 0, y: 16 });
      tl.to("#core", { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0)
        .to("#pulse-a", { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0.15)
        .to("#pulse-b", { opacity: 0.85, scale: 1.35, duration: 1.6, ease: "power2.out" }, 0.35)
        .to("#pulse-c", { opacity: 0.55, scale: 1.75, duration: 1.8, ease: "power2.out" }, 0.55)
        .to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.45)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.45)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.55)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.8)
        .to("#pulse-a", { scale: 1.15, duration: 2.2, ease: "sine.inOut" }, 1.6)
        .to("#pulse-b", { scale: 1.55, duration: 2.2, ease: "sine.inOut" }, 1.6)
        .to("#pulse-c", { scale: 2.0, opacity: 0.25, duration: 2.2, ease: "sine.inOut" }, 1.6)
        .to("#core", { scale: 1.08, duration: 1.1, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.8);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
