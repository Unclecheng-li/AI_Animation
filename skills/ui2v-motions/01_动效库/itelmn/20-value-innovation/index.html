<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Value Innovation Model"},
  {"id":"leftTitle","type":"string","label":"Left Column Title","default":"Cost Savings"},
  {"id":"rightTitle","type":"string","label":"Right Column Title","default":"Buyer Value"},
  {"id":"leftDesc","type":"string","label":"Left Description","default":"Cost savings are achieved by eliminating or reducing factors that an industry competes on."},
  {"id":"rightDesc","type":"string","label":"Right Description","default":"Buyer value is lifted by raising or creating elements that an industry has never offered."},
  {"id":"leftItems","type":"string","label":"Left Bullets (JSON)","default":"[\"Eliminate redundant processes\",\"Reduce feature bloat\",\"Question industry norms\",\"Simplify supply chain\"]"},
  {"id":"rightItems","type":"string","label":"Right Bullets (JSON)","default":"[\"Create new benefits\",\"Enhance product quality\",\"Redefine expectations\",\"Introduce unique features\"]"},
  {"id":"leftColor","type":"color","label":"Left Column Color","default":"#cd5746"},
  {"id":"rightColor","type":"color","label":"Right Column Color","default":"#2f765f"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"duration","type":"number","label":"Duration (seconds)","default":7,"min":4,"max":15,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --left: #cd5746; --right: #2f765f; --bg: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body {
      width: 1920px; height: 1080px;
      background-color: var(--bg);
      background-image: var(--base-plate);
      background-size: 1920px 1080px;
      background-position: 0 0;
      background-repeat: no-repeat;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      overflow: hidden;
      position: relative;
    }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .title { position: absolute; top: 50px; left: 80px; font-size: 42px; font-weight: 700; color: #182026; opacity: 0; }
    .container { display: flex; height: 100%; padding: 140px 60px 60px; gap: 40px; }
    .col { flex: 1; background: #fffdfa; border-radius: 24px; padding: 50px 60px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); opacity: 0; display: flex; flex-direction: column; }
    .col .col-title { font-size: 28px; font-weight: 700; margin-bottom: 20px; }
    .col.left .col-title { color: var(--left); }
    .col.right .col-title { color: var(--right); }
    .col .col-desc { font-size: 18px; line-height: 1.6; color: #5a6e78; margin-bottom: 30px; opacity: 0; }
    .col .bullets { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .col .bullets li { font-size: 17px; display: flex; align-items: center; gap: 12px; color: #182026; opacity: 0; }
    .col .bullets li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .col.left .bullets li::before { background: var(--left); }
    .col.right .bullets li::before { background: var(--right); }
    .vs { display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 800; color: #d8d2c8; opacity: 0; }
  </style>
</head>
<body>
  <div data-composition-id="value-innovation" data-width="1920" data-height="1080" data-duration="7" data-start="0">
    <div id="el-fade"></div>
    <div class="title" id="mainTitle"></div>
    <div class="container">
      <div class="col left" id="leftCol">
        <div class="col-title" id="leftTitle"></div>
        <div class="col-desc" id="leftDesc"></div>
        <ul class="bullets" id="leftBullets"></ul>
      </div>
      <div class="vs">VS</div>
      <div class="col right" id="rightCol">
        <div class="col-title" id="rightTitle"></div>
        <div class="col-desc" id="rightDesc"></div>
        <ul class="bullets" id="rightBullets"></ul>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var leftC = vars.leftColor || '#cd5746';
      var rightC = vars.rightColor || '#2f765f';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var DUR = Number(vars.duration) || 7;
      document.documentElement.style.setProperty('--left', leftC);
      document.documentElement.style.setProperty('--right', rightC);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');
      document.getElementById('mainTitle').textContent = vars.title || 'Value Innovation Model';
      document.getElementById('leftTitle').textContent = vars.leftTitle || 'Cost Savings';
      document.getElementById('rightTitle').textContent = vars.rightTitle || 'Buyer Value';
      document.getElementById('leftDesc').textContent = vars.leftDesc || '';
      document.getElementById('rightDesc').textContent = vars.rightDesc || '';
      var lb = document.getElementById('leftBullets');
      var rb = document.getElementById('rightBullets');
      JSON.parse(vars.leftItems || '[]').forEach(function(t) { var li = document.createElement('li'); li.textContent = t; lb.appendChild(li); });
      JSON.parse(vars.rightItems || '[]').forEach(function(t) { var li = document.createElement('li'); li.textContent = t; rb.appendChild(li); });
      var TOTAL = DUR + 0.5;
      var tl = gsap.timeline({ paused: true });
      tl.to('.title', { opacity: 1, y: -10, duration: 0.5 }, 0);
      tl.to('.col', { opacity: 1, x: -20, duration: 0.6, stagger: 0.2, ease: 'power2.out' }, 0.3);
      tl.to('.vs', { opacity: 1, scale: 1.3, duration: 0.4, ease: 'back.out(1.5)' }, 0.7);
      tl.to('.col-desc', { opacity: 1, duration: 0.5, stagger: 0.15 }, 1.0);
      tl.to('.bullets li', { opacity: 1, x: -10, duration: 0.3, stagger: 0.12, ease: 'power2.out' }, 1.5);
      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="value-innovation"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['value-innovation'] = tl;
    </script>
  </div>
</body>
</html>
