<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #080e17; font-family: "Plus Jakarta Sans", sans-serif; color: #e8edf2;
      }
      .clip {
        position: absolute; width: 1920px; height: 1080px; top: 0; left: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden;
      }
      .inner {
        width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
      }
      h1 { font-family: "Outfit", sans-serif; font-size: 80px; font-weight: 700; text-align: center; letter-spacing: -2px; }
      h2 { font-family: "Outfit", sans-serif; font-size: 64px; font-weight: 700; text-align: center; letter-spacing: -1px; }
      .primary-glow { color: #00f0ff; text-shadow: 0 0 40px rgba(0, 240, 255, 0.4); }
      .secondary-glow { color: #a855f7; text-shadow: 0 0 40px rgba(168, 85, 247, 0.4); }
      .card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 60px;
        backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        display: flex; flex-direction: column; align-items: center; gap: 30px;
      }
      .icon-lock { font-size: 120px; color: #14f195; text-shadow: 0 0 40px rgba(20, 241, 149, 0.5); }
      .bg-radial {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at center, rgba(0, 240, 255, 0.15) 0%, transparent 70%); z-index: -1;
      }
      .pill {
        padding: 20px 40px; background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff;
        border-radius: 100px; font-size: 40px; font-weight: 700; color: #00f0ff;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="bg-radial"></div>

      <!-- Scene 1 -->
      <div id="scene1" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div class="inner" id="scene1-inner">
          <h1 style="max-width: 1200px">Booking local talent shouldn't feel like a <span style="color: #ef4444">gamble.</span></h1>
        </div>
      </div>

      <!-- Scene 2 -->
      <div id="scene2" class="clip" data-start="3.5" data-duration="4.5" data-track-index="1">
        <div class="inner" id="scene2-inner">
          <h1 style="margin-bottom: 60px">Enter <span class="primary-glow">Pabandi.</span></h1>
          <div class="card" id="escrow-card">
            <div class="icon-lock">🔒</div>
            <h2>Escrow-backed bookings</h2>
            <div class="pill">100% Secure</div>
          </div>
        </div>
      </div>

      <!-- Scene 3 -->
      <div id="scene3" class="clip" data-start="8" data-duration="4" data-track-index="1">
        <div class="inner" id="scene3-inner">
          <h1 style="margin-bottom: 40px" class="step">1. You show up.</h1>
          <h1 style="margin-bottom: 40px" class="step">2. You get paid.</h1>
          <h1 class="step primary-glow">No-shows? Protected.</h1>
        </div>
      </div>

      <!-- Scene 4 -->
      <div id="scene4" class="clip" data-start="12" data-duration="3" data-track-index="1">
        <div class="inner" id="scene4-inner">
          <h1 style="font-size: 140px; margin-bottom: 40px" class="primary-glow">Pabandi</h1>
          <h2 style="font-size: 48px; color: #94a3b8; font-weight: 500">Commitment, Secured.</h2>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.set("#scene1", { autoAlpha: 1 }, 0)
        .from("#scene1-inner h1", { opacity: 0, y: 50, duration: 1, ease: "power3.out" }, 0.5)
        .to("#scene1-inner", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 3.0)
        .set("#scene1-inner", { opacity: 0 }, 3.50);

      // Scene 2
      tl.set("#scene2", { autoAlpha: 1 }, 3.5)
        .from("#scene2-inner h1", { opacity: 0, scale: 0.9, duration: 0.8, ease: "back.out(1.5)" }, 3.8)
        .from("#escrow-card", { opacity: 0, y: 100, duration: 0.8, ease: "power4.out" }, 4.2)
        .from(".icon-lock", { scale: 0, rotation: -45, duration: 0.6, ease: "back.out(2)" }, 4.6)
        .from(".pill", { opacity: 0, y: 20, duration: 0.5 }, 5)
        .to("#scene2-inner", { opacity: 0, duration: 0.5 }, 7.5)
        .set("#scene2-inner", { opacity: 0 }, 8.00);

      // Scene 3
      tl.set("#scene3", { autoAlpha: 1 }, 8)
        .from(".step", { opacity: 0, x: -50, stagger: 0.6, duration: 0.8, ease: "power3.out" }, 8.5)
        .to("#scene3-inner", { opacity: 0, duration: 0.5 }, 11.5)
        .set("#scene3-inner", { opacity: 0 }, 12.00);

      // Scene 4
      tl.set("#scene4", { autoAlpha: 1 }, 12)
        .from("#scene4-inner h1", { opacity: 0, scale: 0.8, duration: 1.5, ease: "expo.out" }, 12)
        .from("#scene4-inner h2", { opacity: 0, y: 30, duration: 1, ease: "power3.out" }, 12.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
