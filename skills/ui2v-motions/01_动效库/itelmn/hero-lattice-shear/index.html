<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hero — Void Orbit</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #02040a;
      }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
      }
      .full-bleed { position: absolute; inset: 0; }
      #bg {
        background:
          radial-gradient(ellipse 42% 36% at 50% 48%, transparent 0%, rgba(2,4,10,0.55) 62%, #02040a 100%),
          radial-gradient(ellipse 55% 40% at 8% 20%, rgba(40, 90, 255, 0.22), transparent 60%),
          radial-gradient(ellipse 50% 38% at 94% 82%, rgba(130, 40, 255, 0.18), transparent 58%),
          #02040a;
      }
      #orbits {
        position: absolute; inset: 0;
        transform-origin: 960px 540px;
        transform: rotateX(66deg);
      }
      .ring {
        position: absolute; left: 50%; top: 50%;
        border-radius: 50%;
        border: 1px solid rgba(130, 180, 255, 0.16);
        transform: translate(-50%, -50%);
      }
      .ring::before {
        content: "";
        position: absolute; inset: -1px; border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: rgba(160, 210, 255, 0.55);
        border-right-color: rgba(160, 210, 255, 0.08);
      }
      #ring-a { width: 980px; height: 980px; }
      #ring-b { width: 1280px; height: 1280px; border-color: rgba(160, 110, 255, 0.14); }
      #ring-b::before { border-top-color: rgba(190, 140, 255, 0.5); border-right-color: rgba(190, 140, 255, 0.06); }
      #ring-c { width: 1580px; height: 1580px; border-color: rgba(60, 210, 255, 0.1); }
      #ring-c::before { border-top-color: rgba(90, 230, 255, 0.4); }
      .bead {
        position: absolute; width: 7px; height: 7px; margin: -3.5px;
        border-radius: 50%;
        background: #dff2ff;
        box-shadow: 0 0 14px rgba(120, 200, 255, 0.95), 0 0 28px rgba(80, 160, 255, 0.45);
      }
      .bead.v {
        background: #f0e4ff;
        box-shadow: 0 0 14px rgba(190, 140, 255, 0.95), 0 0 28px rgba(150, 90, 255, 0.4);
      }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hero-void-orbit"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="4.5"
    >
      <div id="bg" class="full-bleed"></div>
      <section class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="orbits">
          <div class="ring" id="ring-a"></div>
          <div class="ring" id="ring-b"></div>
          <div class="ring" id="ring-c"></div>
          <div class="bead" id="b1"></div>
          <div class="bead v" id="b2"></div>
          <div class="bead" id="b3"></div>
          <div class="bead v" id="b4"></div>
        </div>
      </section>
    </div>
    <script>
      (function () {
        function put(sel, rx, ry, deg) {
          const a = (deg * Math.PI) / 180;
          gsap.set(sel, {
            x: 960 + Math.cos(a) * rx,
            y: 540 + Math.sin(a) * ry,
            xPercent: -50,
            yPercent: -50,
            force3D: true,
          });
        }
        const beads = [
          { id: "#b1", rx: 490, ry: 490, a: 35 },
          { id: "#b2", rx: 640, ry: 640, a: 160 },
          { id: "#b3", rx: 790, ry: 790, a: 250 },
          { id: "#b4", rx: 640, ry: 640, a: 310 },
        ];
        beads.forEach((b) => put(b.id, b.rx, b.ry, b.a));

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Start already in motion — no intro fade / cover frame
        tl.to("#ring-a", { rotation: 120, duration: 4.5, ease: "none" }, 0);
        tl.to("#ring-b", { rotation: -95, duration: 4.5, ease: "none" }, 0);
        tl.to("#ring-c", { rotation: 70, duration: 4.5, ease: "none" }, 0);

        beads.forEach((b, i) => {
          const proxy = { a: b.a };
          const dir = i % 2 === 0 ? 1 : -1;
          tl.to(proxy, {
            a: b.a + dir * 180,
            duration: 4.5,
            ease: "none",
            onUpdate() { put(b.id, b.rx, b.ry, proxy.a); },
          }, 0);
        });

        window.__timelines["hero-void-orbit"] = tl;
      })();
    </script>
  </body>
</html>
