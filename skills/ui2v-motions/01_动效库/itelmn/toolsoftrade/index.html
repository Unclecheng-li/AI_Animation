<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Thinking Stacks - High Legibility Grid</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #050508;
      --accent-glow: rgba(208, 191, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg-color);
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at 50% 50%, #0d0d1a 0%, #050508 100%);
      padding-top: 100px;
    }

    .mesh-glow {
      position: absolute;
      width: 2000px;
      height: 2000px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .clip {
      position: relative;
      z-index: 1;
    }

    #header-container {
      width: 100%;
      text-align: center;
      margin-top: 2px;
      /* Increased margin to bring boxes lower */
    }

    .header-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 110px;
      background: linear-gradient(to bottom, #fff, #a5a5a5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
      display: inline-block;
    }

    #grid-container {
      display: grid;
      grid-template-columns: repeat(2, 720px);
      grid-template-rows: repeat(2, 320px);
      /* Slightly reduced height to fit lower positioning */
      gap: 50px;
      justify-content: center;
      align-content: center;
      margin-top: 220px;
    }

    .grid-box {
      position: relative;
      width: 720px;
      height: 320px;
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .box-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 52px;
      margin-bottom: 15px;
      color: #1e1e1e;
    }

    .box-subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 38px;
      color: rgba(30, 30, 30, 0.8);
    }

    /* Colors from SVG */
    .bg-manual {
      background: #b2f2bb;
    }

    .bg-llm {
      background: #ffec99;
    }

    .bg-check {
      background: #fd7e14;
    }

    .bg-complex {
      background: #ffd8a8;
    }

    .complex-highlight {
      border: 4px solid #ffd8a8;
      box-shadow: 0 0 60px rgba(255, 216, 168, 0.4);
    }
  </style>
</head>

<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <div class="mesh-glow"></div>

    <div id="header-container" class="clip" data-start="0" data-duration="10" data-track-index="1">
      <h1 class="header-text">Which is more valuable?</h1>
    </div>

    <div id="grid-container">
      <!-- Manual -->
      <div id="box-manual" class="clip grid-box bg-manual" data-start="0" data-duration="10" data-track-index="2">
        <div class="box-title">Solving Problems</div>
        <div class="box-subtitle">Manually</div>
      </div>

      <!-- LLM -->
      <div id="box-llm" class="clip grid-box bg-llm" data-start="0" data-duration="10" data-track-index="3">
        <div class="box-title">Solve it with</div>
        <div class="box-subtitle">LLMs</div>
      </div>

      <!-- Check -->
      <div id="box-check" class="clip grid-box bg-check" data-start="0" data-duration="10" data-track-index="4">
        <div class="box-title">Solve & Check</div>
        <div class="box-subtitle">solutions</div>
      </div>

      <!-- Complex -->
      <div id="box-complex" class="clip grid-box bg-complex" data-start="0" data-duration="10" data-track-index="5">
        <div class="box-title">Solve Problems</div>
        <div class="box-subtitle">that LLMs can't solve</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Initial state
    gsap.set(".header-text", { y: -150, opacity: 0 });
    gsap.set(".grid-box", { y: 1000, opacity: 0 });

    // 1. Header drops in from top
    tl.to(".header-text", { y: 0, opacity: 1, duration: 1, ease: "power4.out" }, 0.5);

    // 2. Boxes fall from above with graceful bounce
    const dropDuration = 1.0;
    const staggerTime = 0.3;
    const boxes = ["#box-manual", "#box-llm", "#box-check", "#box-complex"];

    boxes.forEach((box, i) => {
      tl.to(box, {
        y: 0,
        opacity: 1,
        duration: dropDuration,
        ease: "back.out(1.2)"
      }, 1.2 + (i * staggerTime));
    });

    // 3. Highlight the final block
    tl.to("#box-complex", {
      scale: 1.08,
      duration: 0.5,
      ease: "power2.out",
      borderColor: "rgba(255,255,255,0.8)"
    }, 3.5);

    tl.to("#box-complex", {
      boxShadow: "0 0 80px rgba(255, 216, 168, 0.6)",
      repeat: -1,
      yoyo: true,
      duration: 1.2
    }, 4.0);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>
