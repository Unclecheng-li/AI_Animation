<script>
/* ===== [不动] 播放器引导：虚拟时钟黑场启动 ===== */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();};
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
/* ===== [不动] SFX 引擎：WebAudio 合成 ===== */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';var f=330+Math.random()*90;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);
    env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);
  }
  function whoosh(durS,vol){
    if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
    bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);
  }
  function swipe(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;
    bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);
    var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);
  }
  function type(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=1400+Math.random()*900;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;
    env(g,t,0.004,0.1*vol,0.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);
  }
  function ding(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime;
    [[660,0.2],[990,0.09]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];
      env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);
    });
  }
  function thud(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);
  }
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

#dim{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%);opacity:0;transition:opacity 1s;z-index:30;pointer-events:none}
#dim.on{opacity:1}
.corner{position:absolute;font-family:'Bebas Neue';font-weight:400;font-size:16px;color:rgba(244,197,66,.6);letter-spacing:2px;z-index:9}
#chap{left:52px;bottom:30px}
#src{right:52px;bottom:30px}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:60;font-family:'Bebas Neue',monospace;pointer-events:none}
#track{height:5px;background:rgba(244,197,66,.15)}
#bar{height:100%;width:0;background:#f4c542;box-shadow:0 0 10px rgba(244,197,66,.55)}
#hudrow{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;color:#a89a72;background:rgba(40,29,19,.92);backdrop-filter:blur(4px)}
#hud button{pointer-events:auto;background:transparent;border:1px solid #8a6a3a;color:#a89a72;font-family:inherit;font-size:12px;padding:3px 14px;margin-left:8px;border-radius:3px;cursor:pointer}
#hud button:hover{background:rgba(244,197,66,.14)}
#replay.done{animation:pulse 1.2s infinite;border-color:#f4c542;color:#f4c542}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(244,197,66,.7)}}
</style>
</head>
<body>
<div id="stage">
  <!-- ================= 镜头世界 ================= -->
  <div id="cam">

    <!-- 标题 -->
    <div id="title">
      <div class="t1">这一步<em>强在</em>：折腾全变成工具</div>
      <div class="rule"></div>
    </div>

    <!-- 三联印章 -->
    <div class="stamp s1" id="st1"><div class="bx"><span class="zh">拆解</span><span class="en">TEARDOWN</span></div></div>
    <div class="plus p1" id="pl1">+</div>
    <div class="stamp s2" id="st2"><div class="bx"><span class="zh">对比</span><span class="en">COMPARE</span></div></div>
    <div class="plus p2" id="pl2">+</div>
    <div class="stamp s3" id="st3"><div class="bx"><span class="zh">验证</span><span class="en">VERIFY</span></div></div>

    <!-- 齿轮组 -->
    <div id="gears">
      <svg id="g1" viewBox="0 0 100 100"><g><circle class="body" cx="50" cy="50" r="34"/>
        <g class="tooth"><rect x="44" y="2" width="12" height="16" rx="3"/><rect x="44" y="82" width="12" height="16" rx="3"/><rect x="2" y="44" width="16" height="12" rx="3"/><rect x="82" y="44" width="16" height="12" rx="3"/>
        <rect x="14" y="14" width="12" height="14" rx="3" transform="rotate(-45 20 21)"/><rect x="74" y="14" width="12" height="14" rx="3" transform="rotate(45 80 21)"/><rect x="14" y="72" width="12" height="14" rx="3" transform="rotate(45 20 79)"/><rect x="74" y="72" width="12" height="14" rx="3" transform="rotate(-45 80 79)"/></g>
        <circle class="hub" cx="50" cy="50" r="12"/></g></svg>
      <svg id="g2" viewBox="0 0 100 100"><g><circle class="body2" cx="50" cy="50" r="34"/>
        <g class="tooth"><rect x="44" y="2" width="12" height="16" rx="3"/><rect x="44" y="82" width="12" height="16" rx="3"/><rect x="2" y="44" width="16" height="12" rx="3"/><rect x="82" y="44" width="16" height="12" rx="3"/>
        <rect x="14" y="14" width="12" height="14" rx="3" transform="rotate(-45 20 21)"/><rect x="74" y="14" width="12" height="14" rx="3" transform="rotate(45 80 21)"/><rect x="14" y="72" width="12" height="14" rx="3" transform="rotate(45 20 79)"/><rect x="74" y="72" width="12" height="14" rx="3" transform="rotate(-45 80 79)"/></g>
        <circle class="hub" cx="50" cy="50" r="11"/></g></svg>
      <svg id="g3" viewBox="0 0 100 100"><g><circle class="body" cx="50" cy="50" r="32"/>
        <g class="tooth"><rect x="44" y="4" width="12" height="14" rx="3"/><rect x="44" y="82" width="12" height="14" rx="3"/><rect x="4" y="44" width="14" height="12" rx="3"/><rect x="82" y="44" width="14" height="12" rx="3"/>
        <rect x="16" y="16" width="11" height="13" rx="3" transform="rotate(-45 21 22)"/><rect x="73" y="16" width="11" height="13" rx="3" transform="rotate(45 78 22)"/><rect x="16" y="71" width="11" height="13" rx="3" transform="rotate(45 21 77)"/><rect x="73" y="71" width="11" height="13" rx="3" transform="rotate(-45 78 77)"/></g>
        <circle class="hub" cx="50" cy="50" r="10"/></g></svg>
    </div>

    <!-- 工具徽章 -->
    <div id="badge"><div class="outer"></div><div class="inner">
      <svg class="gearMini" viewBox="0 0 100 100"><g><circle fill="#8a6a3a" cx="50" cy="50" r="34"/>
        <g fill="#c9a24a"><rect x="44" y="2" width="12" height="16" rx="3"/><rect x="44" y="82" width="12" height="16" rx="3"/><rect x="2" y="44" width="16" height="12" rx="3"/><rect x="82" y="44" width="16" height="12" rx="3"/>
        <rect x="14" y="14" width="12" height="14" rx="3" transform="rotate(-45 20 21)"/><rect x="74" y="14" width="12" height="14" rx="3" transform="rotate(45 80 21)"/><rect x="14" y="72" width="12" height="14" rx="3" transform="rotate(45 20 79)"/><rect x="74" y="72" width="12" height="14" rx="3" transform="rotate(-45 80 79)"/></g>
        <circle fill="#f4c542" cx="50" cy="50" r="12"/></g></svg>
      <span class="zh">反复用</span><span class="en">REUSABLE TOOL</span>
    </div></div>

    <!-- 应用商店标签 -->
    <div id="apptag"><span><img src="doubaoicon.png" alt="豆包">已加入我的应用</span></div>

    <!-- 卡墙塞卡 -->
    <div id="miniwall">
      <div class="frame"></div><span class="wlab">文献卡片墙</span>
    </div>
    <div id="wcount"><span class="lab">已攒</span><span class="num" id="wnum">000</span><span class="lab">篇</span></div>
    <div id="flydoc"><div class="fc"><span class="new">NEW</span><div class="strip"></div><div class="ln"></div><div class="ln"></div><div class="ln s"></div></div></div>
    <div id="secline"><span>后面几个月，<b>往里一塞</b>的事</span></div>

    <!-- 金笔打磨 -->
    <div id="polish"><div class="pcard">
      <div class="ph"><span class="pt">综述写作参考框架</span><span class="pbadge">豆包一键导出</span></div>
      <div class="pline" id="pl_1"><span class="dot"></span>梳理论文逻辑 ✓</div>
      <div class="pline" id="pl_2"><span class="dot"></span>理清章节结构 ✓</div>
      <div class="pline cross" id="pl_3"><span class="dot"></span>核心观点与论证 ✗</div>
      <div id="pzone"><span class="plab">这一部分</span>
        <div id="goldw2"><span>还得自己打磨！</span></div>
        <div id="pen2"><svg viewBox="0 0 130 60"><g transform="rotate(-8 65 30)">
          <rect x="8" y="22" width="76" height="16" rx="8" fill="#2b2b2b"/><rect x="8" y="22" width="76" height="7" rx="3.5" fill="#4a4a4a"/>
          <path d="M84 22l30 8-30 8z" fill="#f4c542" stroke="#b8891a" stroke-width="1.5"/><circle cx="106" cy="30" r="2.4" fill="#2b2b2b"/>
          <rect x="8" y="18" width="10" height="24" rx="4" fill="#e8b93a"/></g></svg></div>
      </div>
      <div id="notesticky"><div class="n1">框架≠观点<br>逻辑≠论证</div><div class="n2">FRAME ≠ ARGUMENT</div></div>
    </div></div>

    <!-- 安安 -->
    <div id="anan">
      <div class="say">工具帮你省事，<br>但<b>思想</b>得自己给</div>
      <img src="anan - emotion rename/15_平举素纸_认真以待.png" alt="安安·认真">
    </div>

  </div><!-- /cam -->

  <div id="dim"></div>
  <div id="lbT"></div><div id="lbB"></div>
  <div class="corner" id="chap">环节4 / 沉淀 · 工具化</div>
  <div class="corner" id="src">口播念稿 v7.0 · 环节4</div>
</div>

<div id="hud">
  <div id="track"><div id="bar"></div></div>
  <div id="hudrow"><span>镜头 4-6 · 沉淀成工具，越攒越省力 · 14s</span><span><span id="tc" style="margin-right:10px">00:00</span><button id="pauseBtn">暂停</button><button id="replay" onclick="location.reload()">重播</button></span></div>
</div>

<script>
/* ===== [不动] 时间轴引擎 ===== */
const DUR=17000;
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}

/* ── 卡墙 12 格 ── */
const wall=$('#miniwall');
const slots=[];
for(let r=0;r<2;r++)for(let c=0;c<6;c++){
  const i=r*6+c,s=document.createElement('div');s.className='wslot';
  s.style.left=(24+c*140)+'px';s.style.top=(28+r*174)+'px';
  s.innerHTML=`<div class="wc"><div class="strip" style="background:${['#ffd9d4','#dceaff','#ddf3e5','#f3e2ff','#fff2c2','#ffe9b8'][i%6]}"></div><div class="ln"></div><div class="ln"></div><div class="ln s"></div></div>`;
  wall.appendChild(s);slots.push(s);
}

/* 锻造火花 */
function burst(x,y,n){
  const cam=$('#cam');
  for(let i=0;i<n;i++){
    const s=document.createElement('i');s.className='spark';
    const ang=Math.random()*Math.PI*2,d=60+Math.random()*90;
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(ang)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*d+40)+'px');
    cam.appendChild(s);setTimeout(()=>s.remove(),900);
  }
}
/* 攒卡计数 */
function runCount(start,dur,to){
  const el=$('#wnum');
  tws.push({tag:'cnt',t:start,d:dur,e:eio,f:p=>{el.textContent=String(Math.round(to*p)).padStart(3,'0')}});
}

/* ───────── 本镜头叙事 cue（17s · 沉淀成工具 6:39-6:56） ───────── */
/* 口播① 0-4s「那么这一步就强在拆解对比验证，折腾来的东西」6:39 */
on(200,()=>{$('#title').classList.add('in');__sfx.pop(0.6)});                              // 标题
on(600,()=>{$('#st1').classList.add('in');burst(564,368,10);__sfx.thud(0.5)});             // 印章·拆解←"拆解"~1s
on(1500,()=>{$('#pl1').classList.add('in');__sfx.pop(0.4)});                               // +
on(1750,()=>{$('#st2').classList.add('in');burst(960,368,10);__sfx.thud(0.5)});            // 印章·对比←"对比"~2s
on(2650,()=>{$('#pl2').classList.add('in');__sfx.pop(0.4)});                               // +
on(2900,()=>{$('#st3').classList.add('in');burst(1356,368,12);__sfx.thud(0.55)});          // 印章·验证←"验证"~3s

/* 口播② 4-6s「全部都沉淀成能反复用的工具了」6:43 */
on(3800,()=>{['#st1','#st2','#st3','#pl1','#pl2'].forEach(id=>{                            // 印章收拢←"折腾来的东西"~3.5s
  const el=$(id);el.style.transition='all .5s cubic-bezier(.6,0,1,.4)';el.style.opacity='0';el.style.transform='scale(.4) rotate(20deg)'});
  __sfx.whoosh(0.5,0.6)});
on(4200,()=>{$('#gears').classList.add('in');__sfx.ding(0.5)});                            // 齿轮组←"沉淀成"4s
on(5000,()=>{$('#gears').style.transition='all .45s cubic-bezier(.6,0,1,.4)';
  $('#gears').style.transform='translateX(-50%) scale(.3)';$('#gears').style.opacity='0';
  burst(960,420,26);__sfx.whoosh(0.4,0.55)});                                              // 齿轮压缩·火花四溅
on(5500,()=>{$('#badge').classList.add('in');burst(960,420,18);__sfx.ding(0.8);__sfx.thud(0.35)}); // 「反复用」徽章←"反复用的工具了"~5.5s
on(6000,()=>{$('#apptag').classList.add('in');__sfx.pop(0.55)});                           // 已加入我的应用

/* 口播③ 6-10s「后面几个月继续读文献也是就往卡片墙里一筛的事情」6:45 */
on(6500,()=>{$('#badge').style.transition='all .45s ease';$('#badge').style.opacity='0';
  $('#badge').style.transform='translateX(-50%) scale(.5) rotate(24deg)';
  $('#apptag').style.opacity='0';$('#apptag').style.transform='translateX(-50%) scale(.6)';
  __sfx.whoosh(0.5,0.5)});                                                                 // 徽章+标签退场
on(7000,()=>{$('#miniwall').classList.add('in');$('#wcount').classList.add('in');__sfx.pop(0.5)}); // 卡墙+计数器入场←"卡片墙"~8s
on(7500,()=>{$('#flydoc').classList.add('fly');__sfx.whoosh(0.7,0.5)});                    // 文献飞入
on(8000,()=>{$('#flydoc').classList.add('dock');__sfx.pop(0.5)});                          // 入格←"一筛"
slots.forEach((s,i)=>{if(i===0)return;on(8100+(i-1)*110,()=>{s.classList.add('on');__sfx.pop(0.18)})}); // 已攒卡浮现
on(8200,()=>{runCount(8200,1600,128);for(let k=0;k<10;k++)on(8200+k*150,()=>__sfx.type(0.24))}); // 计数 000→128←"继续读文献"
on(9000,()=>{$('#secline').classList.add('in');__sfx.pop(0.4)});                          // 往里一塞←"一筛的事情"~9.5s

/* 口播④ 10-17s「框架只是梳理逻辑，核心观点和论证还得自己打磨」6:49-6:56 */
on(10000,()=>{camFocus(960,470,1.14,0.8);
  $('#miniwall').style.opacity='0';$('#flydoc').style.opacity='0';$('#secline').style.opacity='0';
  $('#wcount').style.opacity='0';$('#miniwall').style.transform='translateY(40px)';
  __sfx.whoosh(0.6,0.5)});                                                                 // 卡墙退场←"一键导出的框架"6:49
on(10500,()=>{$('#polish').classList.add('in');__sfx.ding(0.6)});                          // 框架卡入场←"导出的框架"~10.5s
on(11000,()=>{$('#pl_1').classList.add('wrt');__sfx.type(0.45)});                          // 梳理逻辑 ✓←"梳理一下论文的逻辑"~11.5s
on(11500,()=>{$('#pl_2').classList.add('wrt');__sfx.type(0.45)});                          // 理清结构 ✓
on(14000,()=>{$('#pl_3').classList.add('wrt');$('#notesticky').classList.add('in');__sfx.swipe(0.5)}); // 核心观点 ✗←"核心观点和论证"6:53=14s
on(14200,()=>{$('#pen2').classList.add('write');$('#goldw2').classList.add('w');           // 金笔打磨←"自己来打磨"
  for(let k=0;k<9;k++)on(14250+k*190,()=>__sfx.type(0.26))});
on(15500,()=>{$('#anan').classList.add('show');__sfx.pop(0.55)});                          // 安安登场
on(16000,()=>camTo(0,0,1.0,0.8));                                                          // 收镜定格
on(16500,()=>__sfx.ding(0.4));
</script>
</body>
</html>
