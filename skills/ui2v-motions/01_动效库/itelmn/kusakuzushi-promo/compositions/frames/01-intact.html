<template>
  <style>
    @font-face {
      font-family: "DotGothic16";
      src: url("assets/fonts/dotgothic16-subset.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Sans JP";
      src: url("assets/fonts/ibm-plex-sans-jp-400-subset.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "IBM Plex Sans JP", sans-serif;
    }

    /* Full-bleed ground rides its own clip layer, never #root — a background on
       the root is clip-gated to the scene window and would drop to the black host. */
    .f1-ground {
      position: absolute;
      inset: 0;
      background: #0c110d;
    }

    /* The grass strip sits at the same y across frames 1-4 so the board never
       moves between cuts: 3,089 contributions, then nothing, in the same place. */
    .f1-board {
      position: absolute;
      left: 0;
      top: 660px;
      width: 1080px;
      height: 152px;
      display: block;
    }

    .f1-counter-wrap {
      position: absolute;
      left: 0;
      top: 300px;
      width: 1080px;
      height: 232px;
      text-align: center;
    }

    .f1-counter {
      display: inline-block;
      font-family: "DotGothic16", sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 232px;
      line-height: 0.9;
      color: #ffb224;
      transform-origin: center center;
    }

    .f1-sub {
      position: absolute;
      left: 0;
      top: 580px;
      width: 1080px;
      text-align: center;
      font-size: 32px;
      letter-spacing: 0.04em;
      color: #8da08c;
    }
  </style>

  <div id="root" data-composition-id="01-intact" data-start="0" data-duration="4"
       data-width="1080" data-height="1080">

    <div id="f1-ground" class="f1-ground clip" data-start="0" data-duration="4" data-track-index="0"></div>

    <img class="f1-board clip" id="f1-board" src="assets/board-intact.png" alt=""
         data-start="0" data-duration="4" data-track-index="1" />

    <div class="f1-counter-wrap clip" id="f1-counter-wrap" data-start="0" data-duration="4"
         data-track-index="2">
      <span class="f1-counter" id="f1-counter">0</span>
    </div>

    <div class="f1-sub clip" id="f1-sub" data-start="0" data-duration="4"
         data-track-index="3">2025年に生やした草</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });
      const counter = document.getElementById("f1-counter");
      const state = { value: 0 };

      // Scene 1 (0.0-0.7s) — the grass strip alone, dead still. Nothing else
      // enters: the silence is what makes frame 2's first hit land.

      // Scene 2 (0.7-2.3s) — the year climbs. Count and scale run as one move
      // (counting-dynamic-scale): font-size stays static, only transform scales,
      // so the digits never reflow.
      tl.fromTo("#f1-counter-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.7);
      tl.fromTo("#f1-counter", { scale: 0.72 }, { scale: 1, duration: 1.5, ease: "power3.out" }, 0.7);
      tl.to(
        state,
        {
          value: 3089,
          duration: 1.5,
          ease: "power3.out",
          onUpdate: () => {
            counter.textContent = Math.round(state.value).toLocaleString("en-US");
          },
        },
        0.7,
      );

      // Scene 3 (2.3-4.0s) — the label settles under the landed number, then the
      // whole frame holds. No jitter: this is a deliberate held read.
      tl.fromTo("#f1-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.3);

      window.__timelines["01-intact"] = tl;
    })();
  </script>
</template>
