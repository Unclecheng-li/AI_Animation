        #a7-M .big { position: absolute; left: 90px; top: 110px; font-family: "League Gothic", sans-serif; font-size: 400px; line-height: 0.8; white-space: nowrap; }
        #a7-M .lbl { position: absolute; left: 100px; top: 520px; font-family: "JetBrains Mono", monospace; font-size: 30px; white-space: nowrap; }
        #a7-M .f { position: absolute; left: 100px; top: 600px; font-family: "JetBrains Mono", monospace; font-size: 30px; white-space: nowrap; color: #3a3a38; }
        #a7-M .wl { position: absolute; right: 100px; top: 110px; text-align: right; }
        #a7-M .wl .n { font-family: "League Gothic", sans-serif; font-size: 300px; line-height: 0.8; color: #5a3fd6; }
        #a7-M .wl .t { font-family: "JetBrains Mono", monospace; font-size: 28px; margin-top: 70px; }
        #a7-M .sev { position: absolute; right: 100px; top: 600px; font-family: "JetBrains Mono", monospace; font-size: 30px; }

      </style>
      <div data-hf-id="hf-h5v6" id="root" data-composition-id="a7-veto" data-width="1920" data-height="1080">
        <div data-hf-id="hf-9eie" id="a7-title" class="disp">Code veto</div>
        <div data-hf-id="hf-9die" id="a7-rail"></div>
        <div data-hf-id="hf-mlbm" class="a7-g" style="left:520px"></div><div data-hf-id="hf-x09c" class="a7-g" style="left:900px"></div><div data-hf-id="hf-js76" class="a7-g" style="left:1280px"></div>
        <div data-hf-id="hf-2nn4" class="a7-gl" style="left:526px"><div data-hf-id="hf-zod0" class="n">① Verbatim</div><div data-hf-id="hf-g2gp" class="d">quote must exist in<br data-hf-id="hf-x5px">the stored review</div></div>
        <div data-hf-id="hf-9pi2" class="a7-gl" style="left:906px"><div data-hf-id="hf-oz0e" class="n">② Relevant</div><div data-hf-id="hf-pjig" class="d">this attribute, not praise,<br data-hf-id="hf-rsrt">not another complaint</div></div>
        <div data-hf-id="hf-skps" class="a7-gl" style="left:1286px"><div data-hf-id="hf-yz36" class="n">③ Routing</div><div data-hf-id="hf-fytx" class="d">wrong item sent →<br data-hf-id="hf-szow">operations issue</div></div>
        <div data-hf-id="hf-ox5j" id="a7-cnt"><div data-hf-id="hf-k5o4" class="n">Counted</div></div>
        <div data-hf-id="hf-6eyd" id="a7-bin" data-layout-allow-overlap=""></div>
        <div data-hf-id="hf-fwmm" id="a7-ops">→ operations</div>
        <div data-hf-id="hf-qksj" id="a7-cards" data-layout-allow-overlap=""></div>
        <div data-hf-id="hf-owhn" id="a7-M">
          <div data-hf-id="hf-b0b2" class="big"><span data-hf-id="hf-6ih6" id="a7-k">0</span> of 3</div>
          <div data-hf-id="hf-wgbd" class="lbl">stored reviews support it · counted by code</div>
          <div data-hf-id="hf-4w4h" class="f" id="a7-f"></div>
          <div data-hf-id="hf-3x3l" class="wl"><div data-hf-id="hf-loos" class="n">≥<span data-hf-id="hf-owpi" id="a7-w">0</span>%</div><div data-hf-id="hf-egcl" class="t">wilson lower bound · 95%</div></div>
          <div data-hf-id="hf-7oj8" class="sev">severity: <b data-hf-id="hf-yucd">high</b> · set by code</div>
          <div data-hf-id="hf-6rk7" class="line" id="a7-line"></div>
        </div>
      </div>
      <script>
        (function () {
          // [label, quote, fate]  fate: ok | g1 | g2 | g3
          const C = [
            ["r1042 · supports", "Laptop 14 inci saya tidak muat.", "ok"],
            ["r1057 · supports", "laptop tidak muat sama sekali", "g1"],
            ["r1049 · supports", "Tas kekecilan untuk laptop saya", "ok"],
            ["r1061 · supports", "ukurannya pas untuk laptop saya", "g2"],
            ["r1066 · supports", "yang datang warna lain", "g3"],
            ["r1033 · supports", "Bahannya bagus tetapi laptop tidak muat.", "ok"],
          ];
          const V = { g1: ["✕ quote not found", "#ff5145"], g2: ["✕ praise, not a complaint", "#ff5145"], g3: ["↳ routed", "#ffb43d"] };
          document.getElementById("a7-cards").innerHTML = C.map((c, i) => `<div class="a7-c" id="a7-c${i}"><div class="l">${c[0]}</div>“${c[1]}”</div>` +
            (V[c[2]] ? `<div class="a7-v" id="a7-v${i}" style="color:${V[c[2]][1]}">${V[c[2]][0]}</div>` : "")).join("");
          const tl = gsap.timeline({ paused: true });
          const GX = { g1: 520, g2: 900, g3: 1280 };
          gsap.set(".a7-c", { x: -340, transformOrigin: "0 0" });
          gsap.set(".a7-v", { opacity: 0 });
          gsap.set("#a7-M", { yPercent: 100 });
          tl.fromTo("#a7-title", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
          tl.fromTo(".a7-g", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out", stagger: 0.1 }, 0.1);
          let okN = 0;
          C.forEach(([l, q, fate], i) => {
            const t0 = 0.5 + i * 0.62;
            if (fate === "ok") {
              tl.to(`#a7-c${i}`, { x: 1660, duration: 1.0, ease: "power2.inOut" }, t0);
              tl.to(`#a7-c${i}`, { y: -125 + okN * 44, scale: 0.5, borderColor: "#46f0a4", duration: 0.25, ease: "power2.out" }, t0 + 1.0);
              okN++;
            } else {
              const gx = GX[fate] - 310;
              tl.to(`#a7-c${i}`, { x: gx, duration: 0.55, ease: "power3.in" }, t0);
              tl.set(`#a7-v${i}`, { x: gx, y: 420 }, 0);
              tl.to(`#a7-v${i}`, { opacity: 1, duration: 0.1 }, t0 + 0.55);
              if (fate === "g3") {
                tl.to(`#a7-c${i}`, { x: 1660, y: 190, scale: 0.5, borderColor: "#ffb43d", duration: 0.7, ease: "power2.inOut" }, t0 + 0.7);
                tl.to(`#a7-v${i}`, { opacity: 0, duration: 0.2 }, t0 + 1.1);
              } else {
                tl.to(`#a7-c${i}`, { borderColor: "#ff5145", duration: 0.1 }, t0 + 0.55);
                tl.to(`#a7-c${i}`, { y: 460, rotation: (i % 2 ? 14 : -12), opacity: 0, duration: 0.7, ease: "power2.in" }, t0 + 0.75);
                tl.to(`#a7-v${i}`, { opacity: 0, duration: 0.2 }, t0 + 1.3);
              }
            }
          });
          // metrics card slams up
          tl.to(["#a7-title", ".a7-g", ".a7-gl", "#a7-cnt", "#a7-bin", "#a7-ops", "#a7-cards", "#a7-rail"], { opacity: 0, duration: 0.2 }, 4.75);
          tl.to("#a7-M", { yPercent: 0, duration: 0.5, ease: "expo.inOut" }, 4.95);
          V2.count(tl, "#a7-k", 0, 3, 5.4, 0.6);
          V2.type(tl, "#a7-f", "wilson(k=3, n=3, z=1.96) = 0.438", 6.0, 0.8);
          V2.count(tl, "#a7-w", 0, 44, 6.4, 0.9);
          V2.scramble(tl, "#a7-line", "No number the seller sees is written by a model.", 7.6, 1.1);
          window.__timelines["a7-veto"] = tl;
        })();
      </script>
    </template>
