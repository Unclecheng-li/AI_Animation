<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Make the Most of Your Trial"},
  {"id":"steps","type":"string","label":"Steps (JSON)","default":"[{\"num\":\"1\",\"heading\":\"Schedule Dedicated Time\",\"body\":\"Block 2-3 hours on your calendar this week to explore the platform. Treat it like a real project deadline. Without dedicated time, the trial period slips away before you have properly evaluated the tools.\"},{\"num\":\"2\",\"heading\":\"Build Something Real\",\"body\":\"Do not just click through templates. Import a real project - a course you need to build, a presentation you have been putting off. Using your own content reveals whether the tool fits your actual workflow.\"},{\"num\":\"3\",\"heading\":\"Join the Community\",\"body\":\"The user community is one of the most valuable resources. Browse the forums, watch community-created tutorials, and see how others solve problems similar to yours.\"},{\"num\":\"4\",\"heading\":\"Test Collaboration Features\",\"body\":\"If you work in a team, invite a colleague to review a project. Test the feedback workflow, version history, and sharing options. The tool is only as good as how well your team can use it together.\"}]"},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStep","type":"number","label":"Seconds per Step","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #285f9f;
      --bg: #f5f2ea;
      --ink: #f8fbff;
      --muted: #9ba9b7;
      --cyan: #15c8f0;
      --coral: #ff5d56;
      --green: #50d77b;
      --amber: #f6bb38;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Inter", Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 22%, rgba(21, 200, 240, 0.22), transparent 32%),
        radial-gradient(circle at 82% 18%, rgba(255, 93, 86, 0.20), transparent 29%),
        linear-gradient(135deg, #071017 0%, #101523 48%, #11100d 100%);
    }

    [data-composition-id] {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(0,0,0,0.18));
      opacity: 0.72;
    }

    .scan {
      position: absolute;
      inset: -20% 0;
      background: linear-gradient(to bottom, transparent 0%, rgba(21,200,240,0.08) 48%, transparent 56%);
      transform: translateY(-58%);
      opacity: 0.62;
    }

    .frame {
      position: absolute;
      inset: 72px 86px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 28px;
      background: rgba(8, 15, 23, 0.30);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .header {
      position: absolute;
      left: 132px;
      top: 112px;
      width: 1080px;
      z-index: 3;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      letter-spacing: 0;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .title {
      font-size: 78px;
      line-height: 0.96;
      font-weight: 900;
      color: #ffffff;
      max-width: 980px;
    }

    .subline {
      margin-top: 24px;
      max-width: 780px;
      color: #b5c0ca;
      font-size: 25px;
      line-height: 1.44;
    }

    .scene {
      position: absolute;
      left: 120px;
      right: 108px;
      bottom: 94px;
      height: 650px;
      perspective: 1600px;
      z-index: 2;
    }

    .journey {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1110px;
      height: 518px;
      border-radius: 30px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04)),
        linear-gradient(160deg, rgba(14, 24, 35, 0.95), rgba(13, 18, 26, 0.86));
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 44px 110px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.18);
      transform-style: preserve-3d;
      transform-origin: 50% 55%;
      overflow: hidden;
      opacity: 0;
    }

    .journey::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 46%, transparent 60%),
        radial-gradient(circle at 52% 44%, rgba(21,200,240,0.18), transparent 42%);
      opacity: 0.55;
    }

    .chrome {
      position: absolute;
      left: 34px;
      top: 28px;
      right: 34px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 13px;
      color: rgba(255,255,255,0.72);
      font-family: "JetBrains Mono", monospace;
      font-size: 15px;
    }

    .dot { width: 11px; height: 11px; border-radius: 99px; background: rgba(255,255,255,0.28); }
    .dot:nth-child(1) { background: var(--coral); }
    .dot:nth-child(2) { background: var(--amber); }
    .dot:nth-child(3) { background: var(--green); }
    .chrome-label { margin-left: 14px; }

    .rail {
      position: absolute;
      left: 80px;
      right: 110px;
      top: 258px;
      height: 12px;
      border-radius: 99px;
      background: rgba(255,255,255,0.10);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.35);
      z-index: 1;
    }

    .rail-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--primary), var(--coral));
      box-shadow: 0 0 26px rgba(21,200,240,0.48);
    }

    .node {
      position: absolute;
      top: 206px;
      width: 178px;
      height: 146px;
      border-radius: 24px;
      padding: 18px 18px 20px;
      background: #101924;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 24px 46px rgba(0,0,0,0.24);
      transform: translateZ(40px);
      opacity: 0;
      z-index: 3;
    }

    .node-num {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 20px;
      font-weight: 700;
      color: #071017;
      background: rgba(255,255,255,0.82);
      margin-bottom: 15px;
    }

    .node-label {
      color: rgba(255,255,255,0.84);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.08;
    }

    .pulse {
      position: absolute;
      width: 230px;
      height: 230px;
      border: 2px solid rgba(21,200,240,0.36);
      border-radius: 999px;
      left: 58px;
      top: 158px;
      opacity: 0;
      pointer-events: none;
      transform: translateZ(16px);
    }

    .panel {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 610px;
      height: 518px;
      border-radius: 30px;
      background: rgba(249, 252, 255, 0.96);
      color: #102033;
      box-shadow: 0 44px 110px rgba(0,0,0,0.34);
      border: 1px solid rgba(255,255,255,0.60);
      overflow: hidden;
      opacity: 0;
    }

    .panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(90deg, var(--cyan), var(--primary), var(--coral));
    }

    .panel-inner {
      position: absolute;
      inset: 0;
      padding: 72px 68px 60px;
    }

    .panel-step {
      position: absolute;
      left: 68px;
      top: 56px;
      font-family: "JetBrains Mono", monospace;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }

    .panel-block {
      position: absolute;
      left: 68px;
      right: 62px;
      top: 118px;
      opacity: 0;
    }

    .panel-heading {
      font-size: 48px;
      line-height: 1.04;
      font-weight: 900;
      color: #195481;
      margin-bottom: 22px;
    }

    .panel-body {
      font-size: 22px;
      line-height: 1.36;
      color: #26384a;
      max-width: 460px;
    }

    .status {
      position: absolute;
      right: 56px;
      top: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #4d6174;
      font-size: 16px;
      font-weight: 700;
    }

    .status-light {
      width: 13px;
      height: 13px;
      border-radius: 99px;
      background: var(--green);
      box-shadow: 0 0 18px rgba(80,215,123,0.75);
    }

    .outline {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1110px;
      height: 518px;
      pointer-events: none;
      overflow: visible;
      opacity: 0.75;
    }

    .outline path {
      fill: none;
      stroke: rgba(21,200,240,0.72);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 3200;
      stroke-dashoffset: 3200;
    }

    #el-fade {
      position: absolute;
      inset: 0;
      background: #020407;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div data-composition-id="trial-flow" data-width="1920" data-height="1080" data-duration="18" data-start="0">
    <div class="grid"></div>
    <div class="scan" id="scan"></div>
    <div class="frame"></div>
    <header class="header">
      <div class="eyebrow">Trial Activation Path</div>
      <h1 class="title" id="titleText">Make the Most of Your Trial</h1>
      <p class="subline">Use the trial like a live project: time-box it, build with real content, test the fit, then decide with evidence.</p>
    </header>
    <main class="scene">
      <svg class="outline" viewBox="0 0 1110 518" aria-hidden="true">
        <path id="outlinePath" d="M31 28 H1079 V490 H31 Z" />
      </svg>
      <section class="journey" id="journey">
        <div class="chrome">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="chrome-label">trial-flow.navigator</span>
        </div>
        <div class="rail"><div class="rail-fill" id="railFill"></div></div>
        <div class="pulse" id="pulse"></div>
        <div id="nodes"></div>
      </section>
      <aside class="panel" id="panel">
        <div class="panel-inner">
          <div class="panel-step" id="panelStep">Stage 1</div>
          <div id="panelBlocks"></div>
          <div class="status"><span class="status-light"></span><span>Evidence before commitment</span></div>
        </div>
      </aside>
    </main>
    <div id="el-fade"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var steps = JSON.parse(vars.steps || "[]");
      var pc = vars.primaryColor || "#285f9f";
      var dur = Number(vars.durationPerStep) || 4;
      var title = vars.title || "Make the Most of Your Trial";
      document.documentElement.style.setProperty("--primary", pc);
      document.getElementById("titleText").textContent = title;

      var nodesWrap = document.getElementById("nodes");
      var blocksWrap = document.getElementById("panelBlocks");
      var nodeEls = [];
      var nodeNumEls = [];
      var blockEls = [];
      var positions = [80, 326, 572, 805];

      steps.forEach(function(step, index) {
        var node = document.createElement("div");
        node.className = "node";
        node.style.left = (positions[index] || (80 + index * 253)) + "px";

        var num = document.createElement("div");
        num.className = "node-num";
        num.textContent = step.num;

        var label = document.createElement("div");
        label.className = "node-label";
        label.textContent = step.heading;

        node.appendChild(num);
        node.appendChild(label);
        nodesWrap.appendChild(node);
        nodeEls.push(node);
        nodeNumEls.push(num);

        var block = document.createElement("div");
        block.className = "panel-block";

        var heading = document.createElement("div");
        heading.className = "panel-heading";
        heading.textContent = step.heading;

        var body = document.createElement("div");
        body.className = "panel-body";
        body.textContent = step.body;

        block.appendChild(heading);
        block.appendChild(body);
        blocksWrap.appendChild(block);
        blockEls.push(block);
      });

      var TOTAL = steps.length * dur + 2;
      var tl = gsap.timeline({ paused: true });
      gsap.set("#journey", { rotationX: 9, rotationY: -13, z: 0, scale: 0.92, transformPerspective: 1600, transformOrigin: "50% 58%" });
      gsap.set("#panel", { x: 76, y: 22, scale: 0.96 });
      gsap.set(blockEls[0], { opacity: 1 });
      gsap.set("#panelStep", { textContent: "Stage " + (steps[0] ? steps[0].num : "1") });

      tl.from(".frame", { opacity: 0, scale: 0.985, duration: 0.7, ease: "power2.out" }, 0);
      tl.from(".eyebrow", { opacity: 0, y: -16, duration: 0.5, ease: "power2.out" }, 0.12);
      tl.from(".title", { opacity: 0, y: 34, duration: 0.72, ease: "power3.out" }, 0.22);
      tl.from(".subline", { opacity: 0, y: 20, duration: 0.55, ease: "power2.out" }, 0.55);
      tl.to("#outlinePath", { strokeDashoffset: 0, duration: 0.88, ease: "power2.inOut" }, 0.64);
      tl.to("#journey", { opacity: 1, rotationX: 5, rotationY: -8, scale: 1, duration: 1.05, ease: "power3.out" }, 0.95);
      tl.to("#panel", { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.75, ease: "power3.out" }, 1.18);
      tl.to(".node", { opacity: 1, y: -12, duration: 0.45, stagger: 0.11, ease: "back.out(1.4)" }, 1.28);
      tl.to("#railFill", { width: "0%", duration: 0.1 }, 1.32);
      tl.to("#scan", { y: "122%", duration: TOTAL - 1.8, ease: "none" }, 0.4);

      steps.forEach(function(step, index) {
        var t = 1.8 + index * dur;
        var progress = steps.length <= 1 ? 100 : index / (steps.length - 1) * 100;
        var nodeX = (positions[index] || (80 + index * 253)) + 89 - 115;
        var colors = ["#15c8f0", pc, "#f6bb38", "#ff5d56"];
        var active = colors[index % colors.length];

        if (index > 0) {
          tl.to(blockEls[index - 1], { opacity: 0, y: -16, duration: 0.24, ease: "power2.in" }, t - 0.04);
          tl.to(blockEls[index], { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t + 0.12);
        }

        tl.to("#panelStep", { textContent: "Stage " + step.num, duration: 0.01 }, t);
        tl.to("#railFill", { width: progress + "%", duration: 0.7, ease: "power2.inOut" }, t);
        tl.to("#pulse", { opacity: 0.65, left: nodeX + "px", scale: 0.7, duration: 0.01 }, t);
        tl.to("#pulse", { scale: 1.25, opacity: 0, duration: 0.9, ease: "power2.out" }, t + 0.02);
        tl.to(nodeEls[index], {
          backgroundColor: "#121e2a",
          borderColor: active,
          y: -30,
          scale: 1.08,
          boxShadow: "0 30px 68px rgba(0,0,0,0.34), 0 0 32px " + active,
          duration: 0.42,
          ease: "back.out(1.3)"
        }, t + 0.08);
        tl.to(nodeNumEls[index], { backgroundColor: active, color: "#061018", duration: 0.32 }, t + 0.08);

        if (index > 0) {
          tl.to(nodeEls[index - 1], {
            backgroundColor: "#101924",
            borderColor: "rgba(255,255,255,0.18)",
            y: -12,
            scale: 1,
            boxShadow: "0 24px 46px rgba(0,0,0,0.24)",
            duration: 0.28
          }, t);
          tl.to(nodeNumEls[index - 1], { backgroundColor: "rgba(255,255,255,0.82)", color: "#071017", duration: 0.24 }, t);
        }

        tl.to("#journey", {
          rotationY: -8 + index * 3.5,
          rotationX: 5 - index * 0.8,
          y: -8 + index * -4,
          duration: 0.85,
          ease: "power2.inOut"
        }, t);
      });

      tl.to("#journey", { rotationY: 15, rotationX: -4, x: -48, y: -34, scale: 0.96, duration: 0.72, ease: "power2.inOut" }, TOTAL - 0.92);
      tl.to("#panel", { x: 34, y: -24, scale: 0.97, duration: 0.72, ease: "power2.inOut" }, TOTAL - 0.92);
      tl.to("#el-fade", { opacity: 1, duration: 0.62, ease: "power2.in" }, TOTAL - 0.62);
      tl.set("#el-fade", { opacity: 1 }, TOTAL);

      document.querySelector('[data-composition-id="trial-flow"]').setAttribute("data-duration", TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["trial-flow"] = tl;
    </script>
  </div>
</body>
</html>
