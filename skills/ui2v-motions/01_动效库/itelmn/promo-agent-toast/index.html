<!DOCTYPE html>
<html data-composition-id="promo-agent-toast" data-width="720" data-height="1280">
<head>
  <meta charset="utf-8">
  <title>HyperFrames — Promo Agent Toast</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    /* Media Master agent success toast — matches the app's dark glass UI. */
    .mm-toast {
      display: flex; align-items: center; gap: 20px;
      width: 620px; padding: 26px 30px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(28,24,38,0.96), rgba(18,16,26,0.96));
      border: 1px solid rgba(159,117,255,0.28);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset;
      will-change: transform, opacity;
    }
    .mm-check {
      flex: none; width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(74,222,128,0.14);
      border: 1.5px solid rgba(74,222,128,0.5);
      will-change: transform, opacity;
    }
    .mm-check svg { width: 34px; height: 34px; }
    .mm-check-path {
      stroke: #4ade80; stroke-width: 4; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 48; stroke-dashoffset: 48;
    }
    .mm-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .mm-app {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600;
      letter-spacing: 0.02em; color: var(--hf-muted, #9aa0ab);
    }
    .mm-app-dot {
      width: 14px; height: 14px; border-radius: 4px;
      background: linear-gradient(135deg, #9f75ff, #6d4bd8);
    }
    .mm-message {
      font-family: 'Inter', sans-serif; font-weight: 700;
      font-size: 30px; line-height: 1.2; color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="hf-center mm-toast" id="toast" data-composition-id="promo-agent-toast" data-start="0" data-duration="2.5" data-track-index="0">
    <div class="mm-check" id="check">
      <svg viewBox="0 0 44 44"><path class="mm-check-path" id="checkPath" d="M12 23 L19 30 L32 15"/></svg>
    </div>
    <div class="mm-body">
      <div class="mm-app"><span class="mm-app-dot" id="dot"></span><span id="appName"></span></div>
      <div class="mm-message" id="message"></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const v = window.__hyperframes?.getVariables?.() ?? {};
    const accentColor = v.accentColor ?? v.color ?? '#9f75ff';
    const yPos = v.yPos ?? 50;
    const message = v.message ?? v.text ?? 'Generated 15 on-brand images';
    const appName = v.appName ?? 'Media Master';

    const toastEl = document.getElementById('toast');
    toastEl.style.top = yPos + '%';
    toastEl.style.borderColor = 'rgba(159,117,255,0.28)';
    document.getElementById('dot').style.background =
      'linear-gradient(135deg, ' + accentColor + ', #6d4bd8)';
    document.getElementById('appName').textContent = appName;
    document.getElementById('message').textContent = message;

    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    // Slide + fade in like a real notification.
    tl.fromTo(toastEl, { opacity: 0, y: 40, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.3)' }, 0);
    // Draw the checkmark.
    tl.to('#checkPath', { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, 0.2);
    tl.fromTo('#check', { scale: 0.6 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' }, 0.15);
    // Exit.
    const dur = parseFloat(v.timingDuration ?? 2.5);
    tl.to(toastEl, { opacity: 0, y: -20, scale: 0.96, duration: 0.3, ease: 'power2.in' },
      Math.max(dur - 0.4, 0.6));
  </script>
</body>
</html>
