<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
        }
        .fill {
          position: absolute;
          inset: 0;
          background: #0d1117;
        }
        /* Background light: one soft neutral source lifting the frame off flat black.
           Deliberately NOT accent-tinted — accent means "verified source" and stays
           rationed. Static, so it costs nothing in determinism. */
        .glow {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            82% 64% at 50% 36%,
            rgba(150, 168, 194, 0.1) 0%,
            rgba(150, 168, 194, 0.035) 46%,
            rgba(150, 168, 194, 0) 74%
          );
        }
        .wall {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          will-change: transform;
        }
        .row {
          display: flex;
          gap: 28px;
          height: 44px;
          align-items: center;
          padding: 0 96px;
          font-size: 30px;
          line-height: 44px;
          white-space: nowrap;
          font-variant-ligatures: none;
        }
        .gutter {
          width: 78px;
          text-align: right;
          color: #697583;
          font-variant-numeric: tabular-nums;
          flex: 0 0 78px;
        }
        .src {
          color: #dce3ea;
          opacity: 0.46;
          overflow: hidden;
          text-overflow: clip;
        }
        .scrim {
          position: absolute;
          inset: 0;
          /* The lower third must be opaque, not merely dark — the statement lands there. */
          background: linear-gradient(
            180deg,
            rgba(13, 17, 23, 0.94) 0%,
            rgba(13, 17, 23, 0) 24%,
            rgba(13, 17, 23, 0) 46%,
            rgba(13, 17, 23, 0.97) 70%,
            rgba(13, 17, 23, 1) 100%
          );
        }
        .ticker {
          position: absolute;
          right: 120px;
          bottom: 128px;
          text-align: right;
          display: block;
        }
        .ticker-num {
          display: block;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 132px;
          line-height: 1;
          letter-spacing: -0.03em;
          color: #edf1f5;
          font-variant-numeric: tabular-nums;
        }
        .ticker-label {
          display: block;
          margin-top: 14px;
          font-size: 34px;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #818b98;
        }
        .statement {
          position: absolute;
          left: 120px;
          bottom: 132px;
          display: block;
          max-width: 1300px;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 96px;
          line-height: 1.06;
          letter-spacing: -0.03em;
          color: #edf1f5;
        }
      </style>

      <div data-hf-id="hf-oc04" id="root" data-composition-id="s1-lost" data-width="1920" data-height="1080">
        <div data-hf-id="hf-4qej" class="fill"></div>
        <div data-hf-id="hf-2s7n" class="glow"></div>
        <!-- Background texture, not content: it scrolls off-canvas by design and sits under
             a 96%-opaque scrim wherever type lands. Excluded from the layout audit. -->
        <div data-hf-id="hf-owgg" id="s1-wall" class="wall" data-layout-ignore=""></div>
        <div data-hf-id="hf-261e" class="scrim"></div>

        <div data-hf-id="hf-k0qr" id="s1-ticker" class="ticker" data-layout-allow-caption-zone="">
          <span data-hf-id="hf-3gc4" id="s1-count" class="ticker-num">0</span>
          <span data-hf-id="hf-bhox" class="ticker-label">files</span>
        </div>

        <div data-hf-id="hf-hcyv" id="s1-statement" class="statement" data-layout-allow-caption-zone="">
          Where do you start?
        </div>
      </div>

      <script>
        (function () {
          const LINES = [
            "packages/agents/src/repopilot_agents/graph.py",
            "    return {\"insights\": [insight]}",
            "packages/agents/src/repopilot_agents/state.py",
            "class ArchaeologistState(BaseModel):",
            "    intent_profile: IntentProfile | None = None",
            "packages/ingestion/src/repopilot_ingestion/pipeline.py",
            "    chunks = chunk_module(tree, source, file_path)",
            "packages/ingestion/src/repopilot_ingestion/parse.py",
            "    parser = get_parser(\"python\")",
            "packages/agents/src/repopilot_agents/tools/graph_query.py",
            "    def hubs(self, limit: int = 10) -> list[NodeRef]:",
            "apps/api/src/repopilot_api/app.py",
            "@app.post(\"/repos/{repo_id}/ask\")",
            "    async def ask(payload: AskRequest) -> AskResponse:",
            "packages/agents/src/repopilot_agents/verifier/grounding.py",
            "    if not claim.refs:",
            "        return Verdict.FLAGGED",
            "packages/core/src/repopilot_core/llm/provider.py",
            "    except RateLimitError as exc:",
            "        await asyncio.sleep(backoff)",
            "apps/web/src/components/repopilot-app.tsx",
            "  const [personaId, setPersonaId] = useState(...)",
            "packages/agents/src/repopilot_agents/qa/prompts.py",
            "    PERSONA_SHAPES: dict[str, AnswerShape] = {",
            "packages/agents/src/repopilot_agents/tools/read_chunks.py",
            "    spans = await store.fetch_spans(chunk_ids)",
            "packages/evals/src/repopilot_evals/registry.py",
            "    register(\"retrieval_recall_at_10\", ...)",
            "apps/api/src/repopilot_api/access.py",
            "    session = require_session(request)",
            "packages/ingestion/src/repopilot_ingestion/embed.py",
            "    vectors = model.encode(texts, batch_size=32)",
            "packages/agents/src/repopilot_agents/contribute/lane_c.py",
            "    # guarded language only - never assert a bug",
            "packages/core/src/repopilot_core/settings.py",
            "    database_url: PostgresDsn",
            "packages/agents/src/repopilot_agents/tools/graph_metrics.py",
            "    fan_in = graph.in_degree(node)",
            "infra/postgres/init.sql",
            "CREATE EXTENSION IF NOT EXISTS vector;",
          ];

          const wall = document.getElementById("s1-wall");
          const ROWS = 84;
          for (let i = 0; i < ROWS; i += 1) {
            const row = document.createElement("div");
            row.className = "row";
            const gutter = document.createElement("span");
            gutter.className = "gutter";
            gutter.textContent = String(112 + i * 7);
            const src = document.createElement("span");
            src.className = "src";
            src.textContent = LINES[i % LINES.length];
            row.appendChild(gutter);
            row.appendChild(src);
            wall.appendChild(row);
          }

          const counter = { v: 0 };
          const countEl = document.getElementById("s1-count");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // Unreadable velocity, then a hard stop. No ease-out: the stop is the beat.
          tl.fromTo(
            "#s1-wall",
            { y: 0, filter: "blur(2.6px)" },
            { y: -2400, duration: 4.6, ease: "none" },
            0,
          );
          tl.to("#s1-wall", { filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 4.6);

          tl.to(
            counter,
            {
              v: 4182,
              duration: 4.5,
              ease: "power2.out",
              onUpdate: () => {
                countEl.textContent = Math.round(counter.v).toLocaleString("en-US");
              },
            },
            0,
          );
          tl.fromTo(
            "#s1-ticker",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
            0.3,
          );
          // Count-up emphasis: the number swells as it lands, then settles.
          tl.to("#s1-ticker", { scale: 1.06, duration: 0.2, ease: "power2.out" }, 4.4);
          tl.to("#s1-ticker", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 4.65);
          tl.to("#s1-ticker", { opacity: 0.34, duration: 0.4, ease: "power2.out" }, 5.0);

          tl.fromTo(
            "#s1-statement",
            { opacity: 0, y: 34 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            5.0,
          );

          window.__timelines["s1-lost"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
