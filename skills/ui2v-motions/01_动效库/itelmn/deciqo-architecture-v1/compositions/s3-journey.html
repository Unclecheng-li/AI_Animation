        .plate .sub { font-size: 25px; line-height: 1.3; color: var(--muted); margin-top: 8px; white-space: nowrap; }

        .rcard { position: absolute; border-radius: 18px; background: #131c36; border: 3px solid #33426a; box-sizing: border-box; padding: 16px 20px; font-size: 22px; line-height: 1.3; color: var(--soft); }
        .rcard .st { color: var(--amber); letter-spacing: 3px; font-size: 20px; }

        .wire--base { stroke: rgba(148,170,220,0.14); }
        #s3-packet { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 17px; background: var(--blue);
          box-shadow: 0 0 0 8px rgba(74,125,255,0.25), 0 0 40px 10px rgba(74,125,255,0.55); }

        #s3-hud-brand { position: absolute; right: 80px; top: 60px; font-family: var(--f-body); font-weight: 400; font-size: 22px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
        #s3-hud-prog { position: absolute; left: 80px; right: 80px; bottom: 56px; height: 6px; border-radius: 3px; background: rgba(148,170,220,0.14); }

        #s3-final em { font-style: normal; color: var(--blue-light); }

          <div data-hf-id="hf-df5i" class="dq-realtag" style="right:40px;top:-56px">Real Deciqo build · <b data-hf-id="hf-6du2">synthetic demo store</b></div>

      <script>
        (function () {
          const W = document.getElementById("s3-world");
          const R1 = 700, R2 = 1650, R3 = 2600;
          const C1 = 900, C2 = 2150, C3 = 3400, C4 = 4650;
          const S = {
            A: [C1, R1], B: [C2, R1], C: [C3, R1], D: [C4, R1],
            E: [C4, R2], F: [C3, R2], G: [C2, R2],
            H: [C1, R3], I: [C2, R3], J: [C3, R3], K: [C4, R3],
          };
          const ROLE = {
            code: '<span class="dq-chip dq-chip--code">CODE</span>',
            ai: '<span class="dq-chip dq-chip--ai"><span class="dq-dot"></span>AI AGENT</span>',
            seller: '<span class="dq-chip dq-chip--seller"><span class="dq-dot"></span>THE SELLER</span>',
            watch: '<span class="dq-chip dq-chip--watch">FOLLOW-UP</span>',
            muted: '<span class="dq-chip dq-chip--muted">FALLBACK</span>',
          };
          const stars = (n) => '★'.repeat(n) + '<s>' + '★'.repeat(5 - n) + '</s>';
          let html = "";
          // lane bands + ghost numbers + labels
          [[R1, "code", "01", "Ingest &amp; triage", '<span class="dq-chip dq-chip--code">plain code</span>'],
           [R2, "ai", "02", "Agents", '<span class="dq-chip dq-chip--ai">AI proposes · strict JSON</span>'],
           [R3, "decide", "03", "Gate, decide, watch", '<span class="dq-chip dq-chip--code">code</span><span class="dq-chip dq-chip--seller">+ the seller</span>']]
            .forEach(([y, k, n, name, chip], i) => {
              html += `<div class="band band--${k}" id="s3-band${i}" style="top:${y - 380}px"></div>`;
              html += `<div class="ghostnum" data-layout-ignore style="left:${i === 1 ? 5230 - 700 : 380}px;top:${y - 300}px">${n}</div>`;
            });
          html += `<div class="lanelabel" data-layout-allow-overlap id="s3-ll0" style="left:${C1 - 410}px;top:${R1 - 470}px"><span class="n">01</span>Ingest &amp; triage <span class="dq-chip dq-chip--code">plain code</span></div>`;
          html += `<div class="lanelabel" data-layout-allow-overlap id="s3-ll1" style="left:${C3 - 410}px;top:${R2 - 470}px"><span class="n">02</span>Agents <span class="dq-chip dq-chip--ai">AI proposes · strict JSON · each output checked</span></div>`;
          html += `<div class="lanelabel" data-layout-allow-overlap id="s3-ll2" style="left:${C1 - 410}px;top:${R3 - 470}px"><span class="n">03</span>Gate, decide, watch <span class="dq-chip dq-chip--code">code</span><span class="dq-chip dq-chip--seller">+ the seller</span></div>`;

          // wires (base + live)
          const seg = {
            w1: `M1310 ${R1} H1740`, w2: `M2560 ${R1} H2990`, w3: `M3810 ${R1} H4240`,
            w4: `M${C4} 1020 V1330`, w5: `M4240 ${R2} H3810`,
            w6: `M${C3} 1970 V2130 H${C1} V2280`, wg: `M2990 ${R2} H2460`,
            w7: `M1310 ${R3} H1740`, w8: `M2560 ${R3} H2990`, w9: `M3810 ${R3} H4240`,
            loop: `M5060 ${R3} H5380 V150 H${C1} V380`,
          };
          let svg = `<svg class="abs" style="left:0;top:0;overflow:visible" width="5600" height="3000" viewBox="0 0 5600 3000">
            <defs><mask id="s3-loopmask" maskUnits="userSpaceOnUse" x="0" y="0" width="5600" height="3000">
              <path id="s3-loopdraw" d="${seg.loop}" pathLength="1" fill="none" stroke="#fff" stroke-width="20" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>
              <marker id="s3-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#274aa8"/></marker></defs>`;
          Object.entries(seg).forEach(([k, d]) => {
            if (k === "loop") return;
            svg += `<path class="wire wire--base" d="${d}"/>`;
            svg += `<path id="s3-${k}" class="wire" d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" ${k === "wg" ? 'style="stroke:#93a0bd"' : ""}/>`;
          });
          svg += `<path d="${seg.loop}" fill="none" stroke="#274aa8" stroke-width="8" stroke-dasharray="26 22" stroke-linecap="round" mask="url(#s3-loopmask)"/>`;
          svg += `</svg>`;
          html += svg;
          html += `<div id="s3-looplbl" class="abs" style="left:1000px;top:-10px;width:4300px;text-align:center;font-family:var(--f-title);font-weight:900;font-size:100px;color:var(--blue-light);opacity:0">↺ a new matching review reopens the issue</div>`;

          const plate = (id, role, step, title, sub, ill, cls = "") => {
            const [x, y] = S[id];
            return `<div class="plate plate--${role} ${cls}" id="s3-p${id}" style="left:${x}px;top:${y}px">
              <div class="hd">${ROLE[role]}<span class="step">${step}</span></div>
              <div class="ill" id="s3-i${id}">${ill}</div>
              <div class="ttl">${title}</div><div class="sub">${sub}</div></div>`;
          };

          /* A — channels */
          const tiles = ["Woo", "Shopee", "Tokopedia", "Lazada", "Paste"];
          let a = "";
          tiles.forEach((t, i) => {
            const x = 18 + i * 146;
            const scal = Array.from({ length: 6 }, () => "q10 14 20 0").join(" ");
            a += `<div class="abs s3-tile" style="left:${x}px;top:20px;width:124px;height:170px">
              <svg viewBox="0 0 124 170" style="overflow:visible">
                <rect x="6" y="40" width="112" height="84" rx="10" fill="#131c36" stroke="#e9eef9" stroke-width="3"/>
                <path d="M2 42 L12 14 H112 L122 42 Z" fill="${i === 4 ? "#121f45" : "#1a2442"}" stroke="#e9eef9" stroke-width="3" stroke-linejoin="round"/>
                <path d="M2 42 ${scal} Z" transform="translate(2 0)" fill="${i === 4 ? "#4a7dff" : "#274aa8"}" stroke="#e9eef9" stroke-width="3" stroke-linejoin="round"/>
                ${i === 4 ? '<rect x="28" y="62" width="68" height="40" rx="6" fill="#0c1326" stroke="#4a7dff" stroke-width="3" stroke-dasharray="6 6"/>' : '<rect x="46" y="76" width="32" height="48" rx="4" fill="#16275a" stroke="#e9eef9" stroke-width="3"/>'}
                <text x="62" y="160" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="21" fill="#c1cae0">${t}</text>
              </svg></div>`;
          });
          a += `<div class="abs" style="left:10px;top:300px;width:728px;height:14px;border-radius:7px;background:#1a2442"></div>`;
          a += `<div class="abs" style="left:10px;top:326px;font-size:21px;color:var(--muted)">reviews + the listing text, into one stream →</div>`;
          for (let k = 0; k < 10; k++) a += `<div class="mini s3-mc" id="s3-mc${k}"><i style="width:${22 + (k % 3) * 10}px"></i><b></b></div>`;
          html += plate("A", "code", "01", "Every channel in", "Woo sync · marketplace imports · paste", a);

          /* B — redaction */
          let b = `<div class="rcard" style="left:44px;top:18px;width:660px;height:330px;padding:26px 30px">
            <div class="st">${stars(2)}</div>
            <div style="margin-top:10px;font-size:27px;color:var(--text)">“Bahannya bagus tetapi laptop tidak muat.”</div>
            <div class="abs" style="left:30px;top:150px;font-size:26px">Hubungi saya:</div>
            <div class="abs" id="s3-pii1" style="left:30px;top:196px;font-size:27px;color:var(--text)">WA 0812 5550 1234</div>
            <div class="abs" id="s3-bar1" style="left:24px;top:192px;width:300px;height:44px;border-radius:8px;background:#2a3656;transform-origin:0 50%"><span style="position:absolute;left:14px;top:8px;font-size:20px;color:var(--muted)">[phone removed]</span></div>
            <div class="abs" id="s3-pii2" style="left:30px;top:252px;font-size:27px;color:var(--text)">rina.s@contoh.id</div>
            <div class="abs" id="s3-bar2" style="left:24px;top:248px;width:300px;height:44px;border-radius:8px;background:#2a3656;transform-origin:0 50%"><span style="position:absolute;left:14px;top:8px;font-size:20px;color:var(--muted)">[e-mail removed]</span></div>
          </div>
          <div class="abs" id="s3-marker" style="left:0;top:0;width:60px;height:120px">
            <svg viewBox="0 0 60 120"><rect x="14" y="0" width="32" height="78" rx="8" fill="#e9eef9"/><rect x="14" y="54" width="32" height="12" fill="#4a7dff"/><path d="M18 78 H42 L36 104 H24 Z" fill="#4a7dff"/><rect x="20" y="8" width="8" height="40" rx="4" fill="#c1cae0"/></svg></div>
          <div class="abs" id="s3-piichip" style="left:420px;top:210px"><span class="dq-chip dq-chip--code">removed before storage</span></div>`;
          html += plate("B", "code", "02", "PII redaction", "phones, e-mails, addresses scrubbed first", b);

          /* C — database */
          let c = `<svg viewBox="0 0 748 380">
              <g id="s3-db" transform="translate(374 0)">
                <path d="M-120 120 V300 A120 36 0 0 0 120 300 V120" fill="#e9eef9" stroke="#e9eef9" stroke-width="3"/>
                <path d="M-120 180 A120 36 0 0 0 120 180 M-120 240 A120 36 0 0 0 120 240" fill="none" stroke="#0a1733" stroke-width="4"/>
                <ellipse cx="0" cy="120" rx="120" ry="36" fill="#c1cae0" stroke="#0a1733" stroke-width="4"/>
                <ellipse cx="0" cy="120" rx="70" ry="18" fill="#0a1733"/>
                <g id="s3-lock" transform="translate(0 262)"><rect x="-22" y="-12" width="44" height="34" rx="6" fill="#0a1733"/><path d="M-12 -12 V-22 A12 12 0 0 1 12 -22 V-12" fill="none" stroke="#0a1733" stroke-width="6"/></g>
              </g></svg>`;
          for (let k = 0; k < 3; k++) c += `<div class="mini s3-dbc" id="s3-dbc${k}" style="left:337px;top:-40px"><i></i><b></b></div>`;
          c += `<div class="mini" id="s3-dbsame" style="left:337px;top:-40px;border-color:#93a0bd"><i style="background:#93a0bd"></i><b></b></div>
            <div class="abs" id="s3-samechip" style="left:520px;top:40px"><span class="dq-chip dq-chip--muted">same version · skipped</span></div>
            <div class="abs" id="s3-wschip" style="left:0px;top:40px"><span class="dq-chip dq-chip--code">1 workspace / account</span></div>`;
          html += plate("C", "code", "03", "Workspace database", "unchanged data is never re-run", c);

          /* D — triage */
          const bins = ["size / fit", "material", "delivery"];
          let d = "";
          bins.forEach((t, i) => {
            d += `<div class="abs s3-bin" id="s3-bin${i}" style="left:${24 + i * 240}px;top:160px;width:210px;height:180px;border-radius:0 0 22px 22px;border:4px solid #e9eef9;border-top:none;background:rgba(233,238,249,0.04)">
              <div style="position:absolute;left:0;right:0;bottom:-38px;text-align:center;font-weight:700;font-size:23px;color:var(--soft)">${t}</div></div>`;
          });

          cam(T.C - 1.0, C3, R1 - 20, 1.25, 1.0, "power2.inOut", 4);
          plateIn("C", T.C - 0.6);
          /* ---- C database ---- */
          gsap.set(["#s3-samechip", "#s3-wschip"], { opacity: 0 });
          for (let k = 0; k < 3; k++) {
            const t0 = T.C + 0.2 + k * 0.42;
            tl.fromTo(`#s3-dbc${k}`, { y: -30, opacity: 0 }, { y: 100, opacity: 1, duration: 0.45, ease: "power2.in" }, t0);
            tl.to(`#s3-dbc${k}`, { y: 128, scale: 0.4, opacity: 0, duration: 0.2 }, t0 + 0.45);
            tl.fromTo("#s3-db", { y: 0 }, { y: 8, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.out" }, t0 + 0.45);
          }
          pop("#s3-wschip", T.C + 0.5);
          tl.fromTo("#s3-dbsame", { y: -30, opacity: 0 }, { y: 70, opacity: 1, duration: 0.4, ease: "power2.in" }, T.C + 1.6);
          tl.to("#s3-dbsame", { x: 250, y: 40, rotation: 12, duration: 0.5, ease: "power3.out" }, T.C + 2.0);
          tl.to("#s3-dbsame", { opacity: 0.5, duration: 0.3 }, T.C + 2.4);
          pop("#s3-samechip", T.C + 2.1);
          tl.fromTo("#s3-lock", { y: 262, scale: 1 }, { y: 262, scale: 1.25, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, T.C + 2.6);
          /* C -> D */
          hop(T.D - 0.9, "#s3-w3", [[3810, R1], [4240, R1]], 0.9);
          cam(T.D - 1.0, C4, R1 - 20, 1.25, 1.0, "power2.inOut", 4);
          plateIn("D", T.D - 0.6);
          /* ---- D triage ---- */
          gsap.set(["#s3-trchip", "#s3-trtag"], { opacity: 0 });
          pop("#s3-trchip", T.D + 0.1);
          const binOf = [0, 1, 0, 2, 0], stackN = [0, 0, 0];
          binOf.forEach((bn, k) => {
            const t0 = T.D + 0.4 + k * 0.42;
            const bx = 24 + bn * 240 + 68, by = 300 - stackN[bn] * 40; stackN[bn]++;
            tl.fromTo(`#s3-tc${k}`, { x: 0, y: 0, opacity: 0, rotation: 0 }, { opacity: 1, duration: 0.15 }, t0);
            tl.to(`#s3-tc${k}`, { x: bx - 337, duration: 0.45, ease: "power2.out" }, t0);
            tl.to(`#s3-tc${k}`, { y: by + 20, rotation: (k % 2 ? -8 : 7), duration: 0.45, ease: "power2.in" }, t0);
          });
          tl.to("#s3-bin0", { borderColor: "#4a7dff", backgroundColor: "rgba(74,125,255,0.14)", duration: 0.3 }, T.D + 2.5);
          pop("#s3-trtag", T.D + 2.6);

          /* D -> E : lane change (pull out, dive) */
          hud(T.E - 1.2, 1, "#4a7dff");
          hop(T.E - 1.1, "#s3-w4", [[C4, 1020], [C4, 1330]], 0.9);
          tl.to(camO, { scale: 0.62, duration: 0.7, ease: "power2.in" }, T.E - 1.3);
          tl.to(camI, { x: 960 - (C4 - 300), y: 540 - (R1 + R2) / 2, duration: 0.7, ease: "power2.in" }, T.E - 1.3);
          cam(T.E - 0.6, C4, R2 - 20, 1.25, 0.9, "power4.out");
          plateIn("E", T.E - 1.0);
          tl.fromTo("#s3-ll1", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T.E - 0.9);
          /* ---- E discovery ---- */
          gsap.set("#s3-find", { opacity: 0 });
          tl.fromTo("#s3-mag", { x: 40, y: 50, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, T.E);
          tl.to("#s3-mag", { x: 250, y: 90, duration: 0.6, ease: "power2.inOut" }, T.E + 0.4);
          tl.to("#s3-mag", { x: 40, y: 140, duration: 0.6, ease: "power2.inOut" }, T.E + 1.0);
          tl.to("#s3-mag", { x: 220, y: 210, duration: 0.6, ease: "power3.out" }, T.E + 1.6);
          tl.fromTo("#s3-gapbox", { scale: 1 }, { scale: 1.07, duration: 0.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.E + 2.2);
          tl.fromTo("#s3-find", { x: -300, y: 110, scale: 0.3, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power4.out" }, T.E + 2.8);
          tl.to("#s3-mag", { opacity: 0.25, duration: 0.4 }, T.E + 2.9);
          /* E -> F */
          hop(T.F - 0.9, "#s3-w5", [[4240, R2], [3810, R2]], 0.9);
          cam(T.F - 1.0, C3, R2 - 20, 1.25, 1.0, "power2.inOut", 4);
          plateIn("F", T.F - 0.6);
          /* ---- F membership ---- */
          gsap.set("#s3-notthis", { opacity: 0 });
          tl.fromTo("#s3-iF .s3-fr", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, stagger: 0.12, ease: "power3.out" }, T.F - 0.2);
          tl.fromTo("#s3-ffind", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, T.F + 0.2);
          [0, 1, 2].forEach((i) => {
            tl.to(`#s3-str${i}`, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, T.F + 0.8 + i * 0.4);
            tl.to(`#s3-fr${i}`, { borderColor: "#4a7dff", duration: 0.2 }, T.F + 1.2 + i * 0.4);
          });
          tl.to("#s3-fr3", { opacity: 0.4, duration: 0.3 }, T.F + 2.2);
          pop("#s3-notthis", T.F + 2.3);
          /* F -> G (branch) */
          tl.to("#s3-wg", { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, T.G - 0.8);
          cam(T.G - 0.8, C2 + 60, R2 - 10, 1.25, 0.8, "power3.inOut", 3);
          plateIn("G", T.G - 0.6);
          gsap.set("#s3-rulechip", { opacity: 0 });
          tl.to("#s3-knob", { x: -120, duration: 0.45, ease: "power3.inOut" }, T.G + 0.3);
          tl.to("#s3-knobbg", { opacity: 0, duration: 0.45 }, T.G + 0.3);
          tl.to(["#s3-pE", "#s3-pF"], { opacity: 0.35, duration: 0.5 }, T.G + 0.5);
          pop("#s3-rulechip", T.G + 0.7);
          tl.to(["#s3-pE", "#s3-pF"], { opacity: 1, duration: 0.4 }, T.H - 0.9);
          tl.to("#s3-knob", { x: 0, duration: 0.3 }, T.H - 1.2);
          tl.to("#s3-knobbg", { opacity: 1, duration: 0.3 }, T.H - 1.2);

          /* F -> H : lane change down */
          hud(T.H - 1.2, 2, "#e9eef9");
          hop(T.H - 1.4, "#s3-w6", [[C3, 1970], [C3, 2130], [C1, 2130], [C1, 2280]], 1.3);
          tl.to(camO, { scale: 0.5, duration: 0.8, ease: "power2.in" }, T.H - 1.5);
          tl.to(camI, { x: 960 - (C2 + 300), y: 540 - 2130, duration: 0.8, ease: "power2.in" }, T.H - 1.5);
          cam(T.H - 0.7, C1, R3 - 20, 1.25, 1.0, "power4.out");
          plateIn("H", T.H - 1.0);
          tl.fromTo("#s3-ll2", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T.H - 0.8);
          /* ---- H verifier ---- */
          gsap.set(["#s3-stamp", "#s3-cntchip"], { opacity: 0 }); gsap.set("#s3-wipe", { scaleX: 0 });
          gsap.set("#s3-trace", { y: -150, x: 30 });
          tl.fromTo("#s3-trace", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.H + 0.1);
          tl.to("#s3-trace", { y: 0, x: 0, duration: 0.8, ease: "power3.inOut" }, T.H + 0.4);
          tl.to("#s3-src", { opacity: 0, duration: 0.15 }, T.H + 1.15);
          tl.to("#s3-wipe", { scaleX: 1, duration: 0.8, ease: "steps(20)" }, T.H + 1.25);
          tl.fromTo("#s3-stamp", { scale: 2.2, rotation: -25, opacity: 0 }, { scale: 1, rotation: -10, opacity: 1, duration: 0.3, ease: "power4.in" }, T.H + 2.1);
          const cnt = { v: 0 };
          tl.to(cnt, { v: 3, duration: 0.9, ease: "power1.inOut", onUpdate: () => { document.getElementById("s3-cnt").textContent = Math.round(cnt.v); } }, T.H + 2.3);
          pop("#s3-cntchip", T.H + 3.1);
          /* H -> I */
          hop(T.I - 0.9, "#s3-w7", [[1310, R3], [1740, R3]], 0.9);
          cam(T.I - 1.0, C2, R3 - 20, 1.25, 1.0, "power2.inOut", 4);
          plateIn("I", T.I - 0.6);
          /* ---- I fact gate (held) ---- */
          gsap.set(["#s3-held", "#s3-ready"], { opacity: 0 });
          gsap.set("#s3-arm", { rotation: 0, svgOrigin: "437 191" });
          tl.fromTo("#s3-draft", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T.I);
          tl.to("#s3-draft", { x: 36, duration: 0.3, ease: "power3.in" }, T.I + 0.6);
          tl.to("#s3-draft", { x: 20, duration: 0.25, ease: "power2.out" }, T.I + 0.9);
          tl.fromTo("#s3-pI", { x: 0 }, { x: 10, duration: 0.05, repeat: 5, yoyo: true, ease: "none" }, T.I + 0.9);
          pop("#s3-held", T.I + 1.0);
          tl.to("#s3-pI", { borderColor: "rgba(224,87,75,0.8)", duration: 0.3 }, T.I + 1.0);
          /* I -> J : go ask the seller */
          hop(T.J - 0.9, "#s3-w8", [[2560, R3], [2990, R3]], 0.9);
          cam(T.J - 1.0, C3, R3 - 20, 1.25, 1.0, "power2.inOut", 4);
          plateIn("J", T.J - 0.6);
          /* ---- J seller measures ---- */
          gsap.set(["#s3-approve", "#s3-fact"], { opacity: 0 }); gsap.set("#s3-tape", { scaleX: 0 }); gsap.set("#s3-meas", { opacity: 0 });
          tl.to("#s3-tape", { scaleX: 1, duration: 1.0, ease: "power3.out" }, T.J + 0.1);
          tl.to("#s3-meas", { opacity: 1, duration: 0.2 }, T.J + 0.4);
          const mm = { w: 0, h: 0 };
          tl.to(mm, { w: 32, h: 24, duration: 1.0, ease: "power2.out", onUpdate: () => {
            document.getElementById("s3-mw").textContent = Math.round(mm.w); document.getElementById("s3-mh").textContent = Math.round(mm.h); } }, T.J + 0.4);
          tl.fromTo("#s3-meas", { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1 }, T.J + 1.4);
          /* fact flies back to the gate; camera follows */
          const fx0 = C3 - 150, fy0 = R3 - 250, fx1 = C2 + 40, fy1 = R3 - 250;
          gsap.set("#s3-fact", { x: fx0, y: fy0, opacity: 0, scale: 0.6 });
          tl.to("#s3-fact", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, T.J + 1.8);
          tl.to("#s3-fact", { x: fx1, duration: 1.1, ease: "power2.inOut" }, T.J + 2.3);
          tl.to("#s3-fact", { y: fy0 - 160, duration: 0.55, ease: "power2.out" }, T.J + 2.3);
          tl.to("#s3-fact", { y: fy1, duration: 0.55, ease: "power2.in" }, T.J + 2.85);
          cam(T.J + 2.2, C2 + 200, R3 - 60, 0.95, 1.3, "power2.inOut");
          tl.to("#s3-fact", { opacity: 0, scale: 0.6, duration: 0.25 }, T.Ig - 0.15);
          /* ---- I gate passes ---- */
          tl.to(["#s3-slotvt", "#s3-slotut"], { opacity: 1, duration: 0.2 }, T.Ig);
          tl.to(["#s3-slotv", "#s3-slotu"], { borderColor: "#5fd39c", borderStyle: "solid", duration: 0.2 }, T.Ig);
          tl.to("#s3-arm", { rotation: -80, duration: 0.5, ease: "back.out(1.6)" }, T.Ig + 0.3);
          tl.to("#s3-draftv", { opacity: 0, y: -10, duration: 0.2 }, T.Ig + 0.3);
          tl.fromTo("#s3-draftv2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 }, T.Ig + 0.35);
          tl.to("#s3-held", { opacity: 0, scale: 0.8, duration: 0.2 }, T.Ig + 0.35);
          pop("#s3-ready", T.Ig + 0.5);
          tl.to("#s3-pI", { borderColor: "rgba(95,211,156,0.8)", duration: 0.3 }, T.Ig + 0.5);
          tl.to("#s3-draft", { borderColor: "#1f9d63", duration: 0.3 }, T.Ig + 0.5);
          cam(T.Ig + 0.1, C2, R3 - 20, 1.25, 0.8, "power3.out");

          /* ---- proof: illustrated draft → real UI (R4 → R6) ---- */
          const P1 = T.P1;
          tl.to("#s3-dim", { opacity: 1, duration: 0.4 }, P1);
          tl.fromTo("#s3-proofA", { opacity: 0, scale: 0.28, x: -520, y: 60 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.6, ease: "power4.out" }, P1);
          gsap.set("#s3-r6", { opacity: 0 });
          tl.fromTo("#s3-ringA", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, P1 + 0.7);
          tl.to("#s3-r6", { opacity: 1, duration: 0.3 }, P1 + 1.9);
          tl.to("#s3-ringA", { borderColor: "#1f9d63", boxShadow: "0 0 0 8px rgba(31,157,99,0.3)", duration: 0.3 }, P1 + 1.9);
          tl.fromTo("#s3-proofA", { scale: 1 }, { scale: 1.06, duration: 2.0, ease: "sine.inOut", immediateRender: false }, P1 + 0.6);
          tl.to("#s3-proofA", { opacity: 0, scale: 0.3, x: 520, y: 80, duration: 0.5, ease: "power3.in" }, P1 + 3.5);
          tl.to("#s3-dim", { opacity: 0, duration: 0.4 }, P1 + 3.7);

          /* I -> J -> K : approve, apply, watch */
          hop(T.K - 1.7, "#s3-w8", [[2560, R3], [2990, R3]], 0.5);
          cam(T.K - 1.8, C3, R3 - 20, 1.0, 0.7, "power2.inOut", 3);
          pop("#s3-approve", T.K - 1.2);
          hop(T.K - 0.9, "#s3-w9", [[3810, R3], [4240, R3]], 0.8);
          cam(T.K - 0.9, C4, R3 - 20, 1.25, 0.9, "power2.inOut", 4);
          plateIn("K", T.K - 0.7);
          /* ---- K watch ---- */
          gsap.set(["#s3-came", "#s3-bell", "#s3-newrev"], { opacity: 0 });
          tl.fromTo("#s3-applied", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, T.K);
          tl.to("#s3-cal1", { rotationX: -95, duration: 0.6, ease: "power2.in", transformPerspective: 600 }, T.K + 0.6);
          tl.fromTo("#s3-newrev", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out" }, T.K + 1.3);
          tl.to("#s3-applied", { opacity: 0, rotationX: 90, duration: 0.2 }, T.K + 1.9);
          tl.fromTo("#s3-came", { opacity: 0, rotationX: -90 }, { opacity: 1, rotationX: 0, duration: 0.3, ease: "power2.out" }, T.K + 2.05);
          const kq = { v: 3 };
          tl.to(kq, { v: 4, duration: 0.3, ease: "none", onUpdate: () => { const n = Math.round(kq.v); document.getElementById("s3-kk").textContent = n + "/" + n; } }, T.K + 2.1);
          tl.to("#s3-pK", { borderColor: "#e0574b", duration: 0.3 }, T.K + 2.1);
          pop("#s3-bell", T.K + 2.6);
          tl.fromTo("#s3-bell", { rotation: 0 }, { rotation: 8, duration: 0.08, yoyo: true, repeat: 5 }, T.K + 2.9);

          /* ---- proof: R7 came back ---- */
          const P2 = T.P2;
          tl.to("#s3-dim", { opacity: 1, duration: 0.35 }, P2);
          tl.fromTo("#s3-proofB", { opacity: 0, scale: 0.3, x: 380, y: 80 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.6, ease: "power4.out" }, P2);
          tl.fromTo("#s3-ringB", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3 }, P2 + 0.7);
          tl.to("#s3-proofB", { opacity: 0, scale: 0.3, x: 380, y: 80, duration: 0.3, ease: "power3.in" }, P2 + 2.2);
          tl.to("#s3-dim", { opacity: 0, duration: 0.3 }, P2 + 2.35);

          /* ---- pull-out: the whole map + loop ---- */
          const O = T.OUT;
          hud(O, 3, "#a9c2ff");
          cam(O, 2800, 1520, 0.335, 2.6, "power3.inOut");
          tl.to("#s3-loopdraw", { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, O + 1.2);
          tl.to("#s3-looplbl", { opacity: 1, duration: 0.5 }, O + 2.2);
          tl.to(["#s3-pE", "#s3-pF"], { opacity: 1, duration: 0.2 }, O);
          // packets race the whole wire once, then the loop
          const route = [[1310, R1], [4240, R1], [C4, 1020], [C4, 1330], [4240, R2], [3810, R2], [C3, 1970], [C3, 2130], [C1, 2130], [C1, 2280], [1310, R3], [4240, R3], [5060, R3], [5380, R3], [5380, 150], [C1, 150], [C1, 380]];
          hop(O + 2.4, null, route, 2.6);
          tl.to(pk, { scale: 2.6, duration: 0.3 }, O + 2.4);
          tl.to(["#s3-hud-prog", "#s3-hud-lane", "#s3-hud-brand"], { opacity: 0, duration: 0.4 }, O + 3.0);
          cam(O + 2.9, 2800, 1500 + 130 / 0.25, 0.25, 1.1, "power3.inOut");
          tl.fromTo("#s3-final", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, O + 3.5);

          window.__timelines["s3-journey"] = tl;
        })();
      </script>
    </template>
