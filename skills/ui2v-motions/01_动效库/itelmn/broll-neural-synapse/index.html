<!doctype html><html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"signal","type":"color","label":"Signal color","default":"#ffb11b"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--bg:#16090e;--ink:#ffe9d4;--tissue:#b64a4d;--muted:#a67878}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}#clip{position:absolute;inset:0;overflow:hidden}
.wash{position:absolute;inset:0;background:radial-gradient(circle at 25% 45%,rgba(182,74,77,.2),transparent 30%),radial-gradient(circle at 82% 50%,color-mix(in srgb,var(--signal) 10%,transparent),transparent 22%)}
header{position:absolute;left:88px;right:88px;top:66px;display:flex;justify-content:space-between;z-index:3}header h1{margin:0;font:800 58px/.95 Arial,sans-serif;letter-spacing:-.045em}
header small{font:700 18px "Courier New",monospace;color:var(--signal);letter-spacing:.14em;padding-top:16px}
#neuron{position:absolute;left:55px;top:165px;width:1810px;height:720px}.fiber{fill:none;stroke:var(--tissue);stroke-width:24;stroke-linecap:round}.dendrite{fill:none;stroke:#85373e;stroke-width:16;stroke-linecap:round}
.soma{fill:#7e2f39;stroke:var(--ink);stroke-width:5}.nucleus{fill:var(--tissue)}.myelin{fill:#f0c6a5;stroke:var(--bg);stroke-width:5}.terminal{fill:none;stroke:var(--tissue);stroke-width:17;stroke-linecap:round}
.post{fill:none;stroke:#6f3039;stroke-width:25;stroke-linecap:round}.receptor{fill:var(--ink)}#pulse{fill:var(--signal);stroke:var(--ink);stroke-width:5;filter:drop-shadow(0 0 18px var(--signal))}
.vesicle{fill:var(--signal);stroke:var(--ink);stroke-width:3;opacity:0}.cleft{fill:none;stroke:var(--signal);stroke-width:3;opacity:.2}.label{fill:var(--ink);font:800 17px "Courier New",monospace;letter-spacing:.08em}.lead{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 7}
.trace{position:absolute;left:90px;right:90px;bottom:60px;height:118px;border-top:2px solid #56303a;padding-top:16px;display:flex;align-items:flex-start;gap:24px}.trace b{font:800 17px "Courier New",monospace;letter-spacing:.09em;color:var(--signal)}
#wave{width:1220px;height:75px}.wave-base{stroke:#56303a;stroke-width:2}.wave-line{fill:none;stroke:var(--signal);stroke-width:5;stroke-linecap:round}.trace-state{margin-left:auto;text-align:right;font:700 17px/1.45 "Courier New",monospace;color:var(--muted)}
.no-labels header,.no-labels .label,.no-labels .lead,.no-labels .trace{opacity:0}
</style></head><body>
<div id="stage" data-composition-id="broll-neural-synapse" data-start="0" data-duration="8.5" data-fps="30" data-width="1920" data-height="1080"><div id="clip" class="clip" data-start="0" data-duration="8.5" data-track-index="1"><div class="wash"></div>
<header><h1>AN ELECTRICAL SIGNAL BECOMES CHEMICAL</h1><small>NEUROSCIENCE / SYNAPTIC TRANSMISSION</small></header>
<svg id="neuron" viewBox="0 0 1810 720" aria-label="Neural impulse traveling down an axon and crossing a synapse">
<path class="dendrite" d="M210 345 C120 260 100 190 45 145 M210 345 C105 355 70 410 25 455 M210 345 C130 450 145 545 80 610 M210 345 C165 225 205 150 170 75"/>
<circle class="soma" cx="250" cy="345" r="118"/><circle class="nucleus" cx="250" cy="345" r="44"/>

<g id="myelin"><rect class="myelin" x="455" y="292" width="145" height="70" rx="35" transform="rotate(5 527 327)"/><rect class="myelin" x="650" y="327" width="145" height="70" rx="35" transform="rotate(2 722 362)"/><rect class="myelin" x="850" y="294" width="145" height="70" rx="35" transform="rotate(-8 922 329)"/><rect class="myelin" x="1050" y="285" width="145" height="70" rx="35" transform="rotate(4 1122 320)"/><rect class="myelin" x="1240" y="318" width="145" height="70" rx="35" transform="rotate(-2 1312 353)"/></g>

<ellipse class="cleft" cx="1640" cy="350" rx="100" ry="142"/><circle id="pulse" cx="355" cy="345" r="19"/>

<path class="lead" d="M250 200 V120 H410"/><text class="label" x="425" y="126">CELL BODY</text><path class="lead" d="M910 250 V190 H1050"/><text class="label" x="1065" y="196">MYELIN SHEATH</text><path class="lead" d="M1620 240 H1730 V195"/><text class="label" x="1625" y="175">SYNAPTIC CLEFT</text>
</svg>
<div class="trace"><b>ACTION POTENTIAL</b><svg id="wave" viewBox="0 0 1220 75"><line class="wave-base" x1="0" y1="55" x2="1220" y2="55"/><path id="wave-line" class="wave-line" d="M0 55 H180 C230 55 255 50 285 50 C320 50 330 7 350 7 C372 7 380 68 405 68 C430 68 440 55 475 55 H1220"/></svg><div class="trace-state" id="trace-state">POLARIZED<br/>−70 mV</div></div>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const axon=document.getElementById('axon'),pulse=document.getElementById('pulse'),len=axon.getTotalLength(),driver={p:0};const wave=document.getElementById('wave-line'),wl=wave.getTotalLength();const tl=gsap.timeline({paused:true});
function move(){const p=axon.getPointAtLength(driver.p*len);pulse.setAttribute('cx',p.x);pulse.setAttribute('cy',p.y);}
tl.fromTo('header',{y:-38,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);
tl.fromTo('.dendrite,.fiber,.terminal,.post',{strokeDasharray:900,strokeDashoffset:900},{strokeDashoffset:0,duration:1.15,stagger:.05,ease:'power2.inOut'},.15);
tl.fromTo('.soma,.nucleus,.myelin',{scale:.35,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.5,stagger:.035,ease:'back.out(1.5)'},.45);
tl.fromTo('#pulse',{scale:.2,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.35,ease:'back.out(2)'},1.25);
tl.to(driver,{p:1,duration:3.7,ease:'power1.inOut',onUpdate:move},1.45);
tl.fromTo(wave,{strokeDasharray:wl,strokeDashoffset:wl},{strokeDashoffset:0,duration:3.7,ease:'power1.inOut'},1.45);
tl.set('#trace-state',{textContent:'DEPOLARIZING / +30 mV'},3.2);tl.set('#trace-state',{textContent:'TERMINAL REACHED'},5.05);
tl.fromTo('.vesicle',{x:0,autoAlpha:0,scale:.3},{x:105,autoAlpha:1,scale:1,duration:.72,stagger:.07,ease:'power2.out'},5.25);
tl.to('.cleft',{opacity:.8,strokeWidth:7,duration:.45,yoyo:true,repeat:1,ease:'sine.inOut'},5.35);
tl.to('.receptor',{fill:'var(--signal)',duration:.35,stagger:.08,yoyo:true,repeat:1,ease:'sine.inOut'},6.05);
tl.set('#trace-state',{textContent:'NEUROTRANSMITTER RELEASED'},6.2);tl.to('#clip',{autoAlpha:0,duration:.34,ease:'power2.in'},8.12);
tl.seek(0);window.__timelines['broll-neural-synapse']=tl;
</script></body></html>
