<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0f1c; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 40% 40%, #111827 0%, #0a0f1c 70%);
      }
      .copy {
        position: absolute; left: 140px; top: 220px; color: #e5e7eb;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #34d399; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 88px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 24px; font-size: 28px; color: #9ca3af; max-width: 480px; line-height: 1.45; }
      .board {
        position: absolute; right: 140px; top: 180px; width: 920px;
        background: #111827; border: 1px solid #1f2937; border-radius: 24px;
        padding: 40px; box-shadow: 0 28px 70px rgba(0,0,0,0.4);
      }
      .board h3 {
        font-family: "Segoe UI", sans-serif; font-size: 24px; color: #9ca3af;
        letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 28px;
      }
      .grid {
        display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px;
      }
      .cell {
        aspect-ratio: 1; border-radius: 8px; background: #1f2937;
      }
      .legend {
        margin-top: 28px; display: flex; justify-content: space-between;
        font-family: "Segoe UI", sans-serif; font-size: 20px; color: #6b7280;
      }
      .swatches { display: flex; gap: 8px; align-items: center; }
      .swatches i { width: 18px; height: 18px; border-radius: 4px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Activity · Pulse</div>
        <div class="title">Heatmap Pulse</div>
        <div class="sub">Contribution cells light in a weekly activity wave.</div>
      </div>
      <div id="board" class="clip board" data-start="0" data-duration="4.5" data-track-index="1">
        <h3>Publish activity · last 12 weeks</h3>
        <div class="grid" id="grid"></div>
        <div class="legend">
          <span>Less</span>
          <div class="swatches">
            <i style="background:#1f2937"></i>
            <i style="background:#064e3b"></i>
            <i style="background:#059669"></i>
            <i style="background:#34d399"></i>
            <i style="background:#a7f3d0"></i>
          </div>
          <span>More</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const grid = document.getElementById("grid");
      const colors = ["#1f2937", "#064e3b", "#059669", "#34d399", "#a7f3d0"];
      const pattern = [
        0,1,0,2,1,0,3,1,0,2,4,1,
        1,0,2,1,3,2,1,4,2,1,3,2,
        0,2,1,3,2,4,3,2,1,3,4,3,
        1,1,2,2,3,3,4,3,2,4,3,2,
        0,1,1,2,1,2,3,2,1,2,3,4,
        1,0,1,1,2,1,2,3,2,1,2,3,
        0,1,0,1,1,2,1,2,1,0,1,2
      ];
      const cells = pattern.map((lvl, i) => {
        const el = document.createElement("div");
        el.className = "cell";
        el.id = "c" + i;
        el.dataset.level = String(lvl);
        grid.appendChild(el);
        return el;
      });
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#board", { opacity: 0, y: 24 });
      cells.forEach((el) => gsap.set(el, { backgroundColor: colors[0] }));
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#board", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3);
      cells.forEach((el, i) => {
        const lvl = Number(el.dataset.level);
        if (lvl === 0) return;
        tl.to(el, {
          backgroundColor: colors[lvl],
          duration: 0.25,
          ease: "power1.out"
        }, 0.8 + (i % 12) * 0.08 + Math.floor(i / 12) * 0.12);
      });
      tl.to("#board", { y: -8, duration: 1.1, ease: "sine.inOut" }, 3.3);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    </script>
  </body>
</html>
