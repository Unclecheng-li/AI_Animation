<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1317; }
      body { font-family: ui-monospace, Menlo, monospace; color: #F2F5F4; }
      .clip { position: absolute; inset: 0; }
      svg text { font-family: ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div class="clip" id="scene" data-start="0" data-duration="12">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="2.2" fill="#1C262B"/></pattern>
    <symbol id="ghosty" viewBox="0 0 120 140"><image xlink:href="assets/ghosty.png" x="0" y="0" width="120" height="140" preserveAspectRatio="xMidYMid meet"/></symbol>
    <symbol id="ficha" viewBox="0 0 60 60">
      <rect x="4" y="4" width="52" height="52" rx="8" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
      <text x="30" y="43" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="900" text-anchor="middle" fill="#0E1317">4</text>
    </symbol>
  </defs>
  <rect width="1920" height="1080" fill="#0E1317"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <text x="960" y="120" text-anchor="middle" font-size="56" font-weight="900" fill="#F2F5F4">¿Por qué le llaman World?</text>
  <text x="960" y="172" text-anchor="middle" font-size="28" fill="#85DDCB">el mismo Ghosty, la misma ficha, tres mundos distintos</text>

  <!-- ===== Panel 1: mundo local (escritorio con laptop y carpeta) ===== -->
  <g id="w1">
    <rect x="120" y="250" width="520" height="560" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="120" y="250" width="520" height="560" rx="16" fill="#141C21" stroke="#F2F5F4" stroke-width="4"/>
    <!-- escritorio -->
    <rect x="160" y="640" width="440" height="16" rx="4" fill="#F2F5F4"/>
    <!-- carpeta .eve/.workflow-data -->
    <path d="M170,560 h50 l16,-20 h60 v20 h60 v80 h-186 z" fill="#8DCF6E" stroke="#F2F5F4" stroke-width="4" stroke-linejoin="round"/>
    <text x="263" y="612" text-anchor="middle" font-size="15" font-weight="900" fill="#0E1317">.workflow-data</text>
    <!-- ghosty -->
    <use href="#ghosty" x="440" y="470" width="150" height="175"/>
    <use href="#ficha" x="405" y="560" width="60" height="60" transform="rotate(-12 435 590)"/>
    <text x="380" y="740" text-anchor="middle" font-size="30" font-weight="900" fill="#85DDCB">local</text>
    <text x="380" y="776" text-anchor="middle" font-size="22" fill="#7C8A8E">una carpeta en disco</text>
  </g>

  <!-- ===== Panel 2: mundo Postgres (pasillo con archivero) ===== -->
  <g id="w2">
    <rect x="700" y="250" width="520" height="560" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="700" y="250" width="520" height="560" rx="16" fill="#141C21" stroke="#F2F5F4" stroke-width="4"/>
    <!-- piso de pasillo -->
    <polygon points="740,656 1180,656 1100,560 820,560" fill="#1C262B" stroke="#F2F5F4" stroke-width="4" stroke-linejoin="round"/>
    <!-- archivero de metal -->
    <rect x="770" y="420" width="150" height="220" rx="8" fill="#37AB93" stroke="#F2F5F4" stroke-width="4"/>
    <rect x="786" y="436" width="118" height="56" rx="6" fill="#85DDCB" stroke="#F2F5F4" stroke-width="3"/>
    <rect x="786" y="502" width="118" height="56" rx="6" fill="#85DDCB" stroke="#F2F5F4" stroke-width="3"/>
    <rect x="786" y="568" width="118" height="56" rx="6" fill="#85DDCB" stroke="#F2F5F4" stroke-width="3"/>
    <rect x="830" y="458" width="30" height="10" rx="5" fill="#F2F5F4"/><rect x="830" y="524" width="30" height="10" rx="5" fill="#F2F5F4"/><rect x="830" y="590" width="30" height="10" rx="5" fill="#F2F5F4"/>
    <!-- ghosty -->
    <use href="#ghosty" x="990" y="470" width="150" height="175"/>
    <use href="#ficha" x="960" y="560" width="60" height="60" transform="rotate(-12 990 590)"/>
    <text x="960" y="740" text-anchor="middle" font-size="30" font-weight="900" fill="#85DDCB">Postgres</text>
    <text x="960" y="776" text-anchor="middle" font-size="22" fill="#7C8A8E">una base de datos compartida</text>
  </g>

  <!-- ===== Panel 3: mundo Vercel (nube) ===== -->
  <g id="w3">
    <rect x="1280" y="250" width="520" height="560" rx="16" fill="#0E1317" transform="translate(12,12)"/>
    <rect x="1280" y="250" width="520" height="560" rx="16" fill="#141C21" stroke="#F2F5F4" stroke-width="4"/>
    <!-- nube -->
    <path d="M1380,640 a50,50 0 0 1 50,-70 a70,70 0 0 1 130,-16 a50,50 0 0 1 90,50 a40,40 0 0 1 -10,60 h-250 a40,40 0 0 1 -10,-24 z" fill="#37AB93" stroke="#F2F5F4" stroke-width="4" stroke-linejoin="round"/>
    <!-- ghosty parado sobre la nube -->
    <use href="#ghosty" x="1470" y="360" width="150" height="175"/>
    <use href="#ficha" x="1440" y="450" width="60" height="60" transform="rotate(-12 1470 480)"/>
    <text x="1540" y="740" text-anchor="middle" font-size="30" font-weight="900" fill="#85DDCB">Vercel</text>
    <text x="1540" y="776" text-anchor="middle" font-size="22" fill="#7C8A8E">una nube que otro opera</text>
  </g>

  <!-- ===== cita ===== -->
  <rect x="220" y="870" width="1480" height="110" rx="12" fill="#0E1317" transform="translate(8,8)"/>
  <rect x="220" y="870" width="1480" height="110" rx="12" fill="#85DDCB" stroke="#F2F5F4" stroke-width="4"/>
  <text x="960" y="916" text-anchor="middle" font-size="26" font-weight="900" fill="#0E1317">"A World is the abstraction that allows workflows to run on any infrastructure."</text>
  <text x="960" y="956" text-anchor="middle" font-size="22" fill="#0E1317">el código del agente no cambia; cambia el mundo donde vive — workflow-sdk.dev/worlds</text>
</svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // entrada estándar de un elemento: sube 24px con rebote suave (sin scale ni svgOrigin: sin vibración)
      const rise = (sel, t, d = .45) => tl.from(sel, { y: 24, opacity: 0, duration: d, ease: "power3.out", immediateRender: false }, t);
      const pop = (sel, t) => tl.from(sel, { opacity: 0, duration: .2, immediateRender: false }, t);
      const draw = (sel, t, d = .6) => { tl.set(sel, { strokeDasharray: 2000, strokeDashoffset: 2000 }, 0); tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t); };

      // fotograma 0 completo; lo que se anima es el foco: cada mundo se levanta un poco cuando se nombra
      const focus = (sel, t) => { tl.to(sel, { y: -16, duration: .35, ease: "back.out(2)" }, t); tl.to(sel, { y: 0, duration: .35, ease: "power2.inOut" }, t + 1.6); };
      focus("#w1", 1.0); focus("#w2", 3.2); focus("#w3", 5.4);
      // los tres Ghosty se mecen a la vez: misma ficha, mismo personaje
      tl.to("#w1 use[href='#ghosty'], #w2 use[href='#ghosty'], #w3 use[href='#ghosty']", { y: -10, duration: .7, yoyo: true, repeat: 5, ease: "sine.inOut" }, 7.6);
  
      tl.set({}, {}, 12);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
