<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c0f14; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #0c0f14;
      }
      .copy {
        position: absolute; left: 120px; top: 240px; color: #e5e7eb;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #34d399; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 88px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 24px; font-size: 28px; color: #9ca3af; max-width: 500px; line-height: 1.45; }
      .editor {
        position: absolute; right: 120px; top: 140px; width: 980px; height: 800px;
        background: #111827; border-radius: 20px; border: 1px solid #1f2937;
        overflow: hidden; box-shadow: 0 28px 70px rgba(0,0,0,0.45);
        font-family: Consolas, "Courier New", monospace;
      }
      .bar {
        height: 56px; background: #0b1220; border-bottom: 1px solid #1f2937;
        display: flex; align-items: center; gap: 10px; padding: 0 22px;
      }
      .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
      .bar i:nth-child(1) { background: #f87171; }
      .bar i:nth-child(2) { background: #fbbf24; }
      .bar i:nth-child(3) { background: #34d399; }
      .bar span { margin-left: 14px; color: #6b7280; font-size: 20px; font-family: "Segoe UI", sans-serif; }
      .code { padding: 36px 0; font-size: 28px; line-height: 1.7; color: #d1d5db; }
      .line { padding: 0 36px; display: flex; gap: 28px; white-space: pre; }
      .ln { width: 36px; color: #4b5563; text-align: right; flex: none; }
      .line.add { background: rgba(16, 185, 129, 0.14); color: #a7f3d0; }
      .line.del { background: rgba(239, 68, 68, 0.12); color: #fecaca; }
      .mark { width: 18px; flex: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Code · Review</div>
        <div class="title">Diff Highlight</div>
        <div class="sub">Added and removed lines light up for PR explainers.</div>
      </div>
      <div id="editor" class="clip editor" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="bar"><i></i><i></i><i></i><span>motions.ts</span></div>
        <div class="code">
          <div class="line" id="l1"><span class="ln">41</span><span class="mark"> </span><span>const limit = hourlyNewMotionLimit;</span></div>
          <div class="line del" id="l2"><span class="ln">42</span><span class="mark">-</span><span>if (count >= limit) throw rateLimit;</span></div>
          <div class="line add" id="l3"><span class="ln">42</span><span class="mark">+</span><span>if (!isStaff &amp;&amp; count >= limit) throw rateLimit;</span></div>
          <div class="line" id="l4"><span class="ln">43</span><span class="mark"> </span><span>return await insertMotion(ctx, args);</span></div>
          <div class="line" id="l5"><span class="ln">44</span><span class="mark"> </span><span>}</span></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -18 });
      gsap.set("#editor", { opacity: 0, y: 24 });
      gsap.set(["#l1", "#l4", "#l5"], { opacity: 0.35 });
      gsap.set(["#l2", "#l3"], { opacity: 0, x: -12 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#editor", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.25)
        .to(["#l1", "#l4", "#l5"], { opacity: 1, duration: 0.4 }, 0.7)
        .to("#l2", { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 1.2)
        .to("#l3", { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 1.75)
        .to("#l3", { backgroundColor: "rgba(16,185,129,0.28)", duration: 0.35 }, 2.4)
        .to("#l3", { backgroundColor: "rgba(16,185,129,0.14)", duration: 0.45 }, 2.85)
        .to("#editor", { y: -8, duration: 1.2, ease: "sine.inOut" }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
