<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fde68a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fde68a; }
      .title {
        position: absolute; left: 120px; top: 70px;
        font-family: Georgia, serif; font-size: 68px; color: #78350f;
      }
      .board {
        position: absolute; left: 120px; top: 180px; width: 1680px; height: 780px;
        display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px;
      }
      .col {
        background: #fffbeb; border: 2px solid #fbbf24; border-radius: 22px;
        padding: 28px; position: relative; overflow: hidden;
      }
      .col h3 {
        font-family: "Segoe UI", sans-serif; font-size: 26px; letter-spacing: 0.14em;
        text-transform: uppercase; color: #b45309; margin-bottom: 22px;
      }
      .sticky {
        background: #fef08a; border-radius: 14px; padding: 26px 24px;
        font-family: "Segoe UI", sans-serif; font-size: 30px; color: #78350f;
        box-shadow: 0 10px 0 rgba(120, 53, 15, 0.1);
        margin-bottom: 18px;
      }
      .sticky.muted { opacity: 0.55; }
      #mover {
        position: absolute; left: 28px; top: 92px; width: calc(100% - 56px);
        z-index: 5; margin: 0;
      }
      #doneCol { transition: none; }
      .done-glow { box-shadow: inset 0 0 0 4px #16a34a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="0">Kanban Move</div>
      <div id="board" class="clip board" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="col" id="col1">
          <h3>Backlog</h3>
          <div class="sticky muted">Write brief</div>
          <div class="sticky muted">Gather refs</div>
        </div>
        <div class="col" id="col2">
          <h3>Doing</h3>
          <div class="sticky" id="mover">Compose hero pack</div>
        </div>
        <div class="col" id="doneCol">
          <h3>Done</h3>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#title", { opacity: 0, y: 14 });
      gsap.set("#board", { opacity: 0, y: 28 });
      gsap.set("#mover", { x: 0, rotate: 0 });
      tl.to("#title", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to("#board", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25)
        .to("#mover", { x: 592, duration: 1.45, ease: "power3.inOut" }, 1.15)
        .add(() => { document.getElementById("doneCol").classList.add("done-glow"); }, 2.55)
        .to("#mover", { rotate: -2.5, y: -6, duration: 0.9, ease: "sine.inOut" }, 2.7);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
