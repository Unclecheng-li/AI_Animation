<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #18181b; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #18181b; }
      .loader {
        position: absolute; left: 50%; top: 50%; width: 160px; height: 160px; margin: -80px;
      }
      .shape {
        position: absolute; inset: 0; border-radius: 28px;
        border: 8px solid #f4f4f5; box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="loader" class="clip loader" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="shape" id="shape"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#loader", { opacity: 0, scale: 0.7 });
      gsap.set("#shape", { borderRadius: "28px", rotation: 0 });
      tl.to("#loader", { opacity: 1, scale: 1, duration: 0.45 }, 0.15)
        .to("#shape", { borderRadius: "50%", duration: 0.7, ease: "power2.inOut" }, 0.7)
        .to("#shape", { rotation: 180, duration: 0.9, ease: "power2.inOut" }, 1.4)
        .to("#shape", { borderRadius: "28px", scaleX: 1.35, scaleY: 0.7, duration: 0.7, ease: "power2.inOut" }, 2.3)
        .to("#shape", { borderRadius: "50%", scaleX: 1, scaleY: 1, rotation: 360, duration: 0.9, ease: "power2.inOut" }, 3.1)
        .to("#loader", { scale: 1.06, duration: 0.7, ease: "sine.inOut" }, 3.7);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
