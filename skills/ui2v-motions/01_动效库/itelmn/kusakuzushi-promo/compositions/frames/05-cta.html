<template>
  <style>

    .f5-logo {
      position: absolute;

    /* The grains that build the wordmark are the grass cells themselves — same
       square, same green ramp. Green stays content-only everywhere else in this
       video; here it is the product's own signature (the title is made of grass). */
    .f5-grain {
      position: absolute;
      width: 14px;

  </style>

  <div data-hf-id="hf-yh4m" id="root" data-composition-id="05-cta" data-start="0" data-duration="3.5" data-width="1080" data-height="1080">

    <div data-hf-id="hf-cmsw" id="f5-ground" class="f5-ground clip" data-start="0" data-duration="3.5" data-track-index="0"></div>

    <div data-hf-id="hf-nv4v" class="f5-grains clip" id="f5-grains" data-start="0" data-duration="3.5" data-track-index="1"></div>

    <div data-hf-id="hf-ag65" class="f5-logo clip" id="f5-logo" data-start="0" data-duration="3.5" data-track-index="2">草崩し</div>

    <div data-hf-id="hf-2ayh" class="f5-rule clip" id="f5-rule" data-start="0" data-duration="3.5" data-track-index="3"></div>

    <div data-hf-id="hf-dowk" class="f5-url clip" id="f5-url" data-start="0" data-duration="3.5" data-track-index="4">kusakuzushi.toshi0607.com</div>

    <div data-hf-id="hf-u83u" class="f5-hint clip" id="f5-hint" data-start="0" data-duration="3.5" data-track-index="5">GitHubのユーザー名だけ</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Seeded LCG, not Math.random — the render seeks frame by frame and must
      // produce the identical scatter on every pass.
      let seed = 7;
      const rnd = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const GRASS = ["#0e4429", "#006d32", "#26a641", "#39d353"];
      const host = document.getElementById("f5-grains");
      const grains = [];

      // Scattered across the strip the board occupied in frames 1-4, so the
      // grains read as what is left of the grass that was just cleared.
      for (let i = 0; i < 44; i += 1) {
        const grain = document.createElement("div");
        grain.className = "f5-grain";
        grain.style.background = GRASS[Math.floor(rnd() * GRASS.length)];
        grain.style.left = Math.round(rnd() * 1052) + "px";
        grain.style.top = Math.round(660 + rnd() * 138) + "px";
        host.appendChild(grain);
        grains.push(grain);
      }

      // Scene 1 (0.0-1.3s) — cluster→outward expansion run backwards: the grains
      // converge on the wordmark's center instead of flying out of it, and the
      // logo resolves as they arrive.
      grains.forEach((grain, i) => {
        const dx = 540 - parseFloat(grain.style.left);
        const dy = 470 - parseFloat(grain.style.top);
        tl.fromTo(
          grain,
          { x: 0, y: 0, opacity: 1, scale: 1 },
          {
            x: dx,
            y: dy,
            opacity: 0,
            scale: 0.3,
            duration: 1.15,
            ease: "power3.inOut",
          },
          0.05 + (i % 11) * 0.018,
        );
      });

      tl.fromTo("#f5-logo", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.75);

      // Scene 2 (1.3-2.3s) — the rule draws under the settled wordmark, then the URL.
      tl.fromTo("#f5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.35);
      tl.fromTo("#f5-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.6);

      // Scene 3 (2.3-3.5s) — the one instruction, then hold.
      tl.fromTo("#f5-hint", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 2.3);

      window.__timelines["05-cta"] = tl;
    })();
  </script>
