<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fef9c3; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fef9c3; }
      .title {
        position: absolute; left: 160px; top: 140px;
        font-family: Georgia, serif; font-size: 84px; color: #854d0e;
      }
      .sub {
        position: absolute; left: 160px; top: 260px;
        font-family: "Segoe UI", sans-serif; font-size: 32px; color: #a16207;
      }
      .folder {
        position: absolute; left: 900px; top: 280px; width: 620px; height: 420px;
      }
      .back {
        position: absolute; left: 0; top: 60px; width: 620px; height: 360px;
        background: #facc15; border-radius: 18px; box-shadow: 0 18px 40px rgba(133, 77, 14, 0.2);
      }
      .tab {
        position: absolute; left: 40px; top: 0; width: 180px; height: 70px;
        background: #eab308; border-radius: 14px 14px 0 0;
      }
      .front {
        position: absolute; left: 0; top: 120px; width: 620px; height: 300px;
        background: #fde047; border-radius: 18px; transform-origin: 50% 100%;
        box-shadow: 0 -8px 20px rgba(133, 77, 14, 0.12);
      }
      .paper {
        position: absolute; left: 70px; top: 90px; width: 480px; height: 280px;
        background: #fff; border-radius: 10px; padding: 36px;
        font-family: "Segoe UI", sans-serif; color: #713f12; font-size: 28px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="0">Folder Expand</div>
      <div id="sub" class="clip sub" data-start="0" data-duration="4.5" data-track-index="1">Open the project sleeve</div>
      <div id="folder" class="clip folder" data-start="0" data-duration="4.5" data-track-index="2">
        <div class="tab"></div>
        <div class="back"></div>
        <div class="paper" id="paper">registry-item.json<br/>index.html<br/>SKILL.md</div>
        <div class="front" id="front"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#title", "#sub"], { opacity: 0, y: 14 });
      gsap.set("#folder", { opacity: 0, y: 24 });
      gsap.set("#front", { rotateX: 0 });
      gsap.set("#paper", { y: 40, opacity: 0 });
      tl.to("#title", { opacity: 1, y: 0, duration: 0.4 }, 0.1)
        .to("#sub", { opacity: 1, y: 0, duration: 0.4 }, 0.25)
        .to("#folder", { opacity: 1, y: 0, duration: 0.55 }, 0.4)
        .to("#front", { rotateX: -78, duration: 1.0, ease: "power3.inOut" }, 1.1)
        .to("#paper", { opacity: 1, y: -30, duration: 0.7, ease: "power3.out" }, 1.7)
        .to("#paper", { y: -40, duration: 1.5, ease: "sine.inOut" }, 2.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
