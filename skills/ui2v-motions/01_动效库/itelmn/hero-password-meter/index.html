<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1c1917; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 30% 40%, #292524 0%, #1c1917 65%);
      }
      .copy {
        position: absolute; left: 140px; top: 290px; color: #fafaf9;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #fbbf24; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 88px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 24px; font-size: 28px; color: #a8a29e; max-width: 520px; line-height: 1.45; }
      .card {
        position: absolute; right: 160px; top: 240px; width: 780px;
        background: #292524; border: 1px solid #44403c; border-radius: 28px;
        padding: 48px 52px; box-shadow: 0 28px 70px rgba(0,0,0,0.35);
      }
      .label {
        font-family: "Segoe UI", sans-serif; font-size: 22px; letter-spacing: 0.16em;
        text-transform: uppercase; color: #a8a29e; margin-bottom: 16px;
      }
      .field {
        height: 88px; background: #1c1917; border: 2px solid #57534c; border-radius: 16px;
        display: flex; align-items: center; padding: 0 28px;
        font-family: Consolas, "Courier New", monospace; font-size: 34px; color: #fafaf9;
        letter-spacing: 0.12em;
      }
      .meter {
        margin-top: 36px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      }
      .seg {
        height: 14px; border-radius: 999px; background: #44403c;
      }
      .meta {
        margin-top: 22px; display: flex; justify-content: space-between;
        font-family: "Segoe UI", sans-serif; font-size: 24px; color: #a8a29e;
      }
      #strength { color: #fbbf24; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Auth · Security</div>
        <div class="title">Password Meter</div>
        <div class="sub">Strength segments fill as the passphrase grows.</div>
      </div>
      <div id="card" class="clip card" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="label">New password</div>
        <div class="field" id="field">••••</div>
        <div class="meter">
          <div class="seg" id="s1"></div>
          <div class="seg" id="s2"></div>
          <div class="seg" id="s3"></div>
          <div class="seg" id="s4"></div>
        </div>
        <div class="meta">
          <span id="strength">Weak</span>
          <span>min 12 · mixed case</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const field = document.getElementById("field");
      const strength = document.getElementById("strength");
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#card", { opacity: 0, y: 24 });
      gsap.set(["#s1", "#s2", "#s3", "#s4"], { backgroundColor: "#44403c" });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#card", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to({}, { duration: 0.01, onStart: () => { field.textContent = "••••••••"; } }, 1.0)
        .to("#s1", { backgroundColor: "#ef4444", duration: 0.25 }, 1.05)
        .to({}, { duration: 0.01, onStart: () => { strength.textContent = "Weak"; strength.style.color = "#ef4444"; } }, 1.05)
        .to({}, { duration: 0.01, onStart: () => { field.textContent = "••••••••••••"; } }, 1.55)
        .to("#s2", { backgroundColor: "#f59e0b", duration: 0.25 }, 1.6)
        .to({}, { duration: 0.01, onStart: () => { strength.textContent = "Fair"; strength.style.color = "#f59e0b"; } }, 1.6)
        .to({}, { duration: 0.01, onStart: () => { field.textContent = "••••••••••••••••"; } }, 2.15)
        .to("#s3", { backgroundColor: "#84cc16", duration: 0.25 }, 2.2)
        .to({}, { duration: 0.01, onStart: () => { strength.textContent = "Good"; strength.style.color = "#84cc16"; } }, 2.2)
        .to("#s4", { backgroundColor: "#22c55e", duration: 0.3 }, 2.75)
        .to({}, { duration: 0.01, onStart: () => { strength.textContent = "Strong"; strength.style.color = "#22c55e"; } }, 2.75)
        .to("#card", { y: -8, duration: 1.2, ease: "sine.inOut" }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
