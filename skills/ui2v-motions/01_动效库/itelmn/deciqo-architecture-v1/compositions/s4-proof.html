<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); font-family: var(--f-body); }
        #s4-glow { position: absolute; left: 50%; top: 60%; width: 2000px; height: 1200px; margin: -600px 0 0 -1000px; background: radial-gradient(closest-side, rgba(74,125,255,0.28), rgba(74,125,255,0) 72%); }
        #s4-stage { position: absolute; inset: 0; perspective: 2200px; }
        #s4-laptop { position: absolute; left: 340px; top: 190px; width: 1240px; height: 840px; transform-style: preserve-3d; }
        .s4-shot { position: absolute; left: 0; top: 0; width: 100%; }
        #s4-head { position: absolute; left: 120px; top: 56px; display: flex; align-items: baseline; gap: 26px; white-space: nowrap; }
        #s4-head h1 { margin: 0; font-family: var(--f-title); font-weight: 900; font-size: 76px; letter-spacing: -0.03em; color: var(--text); }
        #s4-head .sub { font-size: 28px; color: var(--muted); }
        #s4-ring { left: 0; top: 0; width: 160px; height: 76px; }
        #s4-lbl { position: absolute; left: 0; top: 0; }
        .s4-note { position: absolute; width: 230px; font-size: 24px; line-height: 1.35; color: var(--soft); }
        .s4-note b { display: block; font-family: var(--f-title); font-weight: 700; font-size: 30px; color: var(--text); margin-bottom: 6px; }
        #s4-n1 { left: 70px; top: 470px; }
        #s4-n2 { right: 70px; top: 470px; text-align: right; }
      </style>
      <div data-hf-id="hf-te5v" id="root" data-composition-id="s4-proof" data-width="1920" data-height="1080">
        <div data-hf-id="hf-cl7a" id="s4-glow"></div>
        <div data-hf-id="hf-fgxb" id="s4-head"><h1 data-hf-id="hf-q25i">Running today.</h1><span data-hf-id="hf-h11u" class="dq-realtag" style="position:static">Real Deciqo build · <b data-hf-id="hf-nuyu">synthetic demo store</b></span></div>
        <div data-hf-id="hf-sepl" id="s4-stage">
          <div data-hf-id="hf-t0zd" id="s4-laptop">
            <div data-hf-id="hf-29v7" class="dq-laptop" style="inset:0">
              <div data-hf-id="hf-oakv" class="dq-laptop__lid"></div>
              <div data-hf-id="hf-f1t4" class="dq-laptop__screen">
                <img data-hf-id="hf-6kz7" class="s4-shot" id="s4-r10" src="assets/footage/R10_agent_pipeline.png" alt="">
                <img data-hf-id="hf-frxj" class="s4-shot" id="s4-r2" src="assets/footage/R2_decision_plan.png" alt="">
              </div>
              <div data-hf-id="hf-o1sr" class="dq-laptop__base"><div data-hf-id="hf-ce42" class="dq-laptop__notch"></div></div>
            </div>
            <div data-hf-id="hf-2huy" id="s4-ring" class="dq-ring"></div>
          </div>
        </div>
        <div data-hf-id="hf-x7uj" class="s4-note" id="s4-n1"><b data-hf-id="hf-m530">Agent pipeline</b>same order every time; each step shows what it kept and refused</div>
        <div data-hf-id="hf-nkxz" class="s4-note" id="s4-n2"><b data-hf-id="hf-co6e">Decision plan</b>which fix comes first, every reason computed from stored reviews</div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // R10/R2 are 1920 wide; screen inner width = 1240 - 52 = 1188 → k = 0.61875
          const k = 1188 / 1920, ox = 26, oy = 26;
          const box = (x, y, w, h, pad = 6) => ({ x: ox + x * k - pad, y: oy + y * k - pad, w: w * k + pad * 2, h: h * k + pad * 2 });
          const steps = [box(452, 540, 258, 121), box(722, 540, 257, 121), box(991, 540, 258, 121), box(1261, 540, 257, 121), box(1530, 540, 258, 121), box(452, 673, 258, 121)];
          const plan = box(452, 280, 1336, 128);
          gsap.set("#s4-r2", { opacity: 0, yPercent: 8 });
          gsap.set("#s4-ring", { opacity: 0, x: steps[0].x, y: steps[0].y, width: steps[0].w, height: steps[0].h });
          gsap.set(["#s4-n1", "#s4-n2"], { opacity: 0 });
          tl.fromTo("#s4-head h1", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.2);
          // tilt-to-flatten
          tl.fromTo("#s4-laptop", { rotationX: 38, rotationY: -26, rotationZ: 6, z: -500, y: 140, opacity: 0 }, { rotationX: 0, rotationY: 0, rotationZ: 0, z: 0, y: 0, opacity: 1, duration: 1.6, ease: "expo.out" }, 0);
          // ring walks the six steps
          tl.to("#s4-ring", { opacity: 1, duration: 0.25 }, 1.4);
          steps.forEach((s, i) => {
            if (i === 0) return;
            tl.to("#s4-ring", { x: s.x, y: s.y, width: s.w, height: s.h, duration: 0.42, ease: "power3.inOut" }, 1.4 + i * 0.55);
          });
          tl.fromTo("#s4-n1", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.6);
          // slow push toward the pipeline
          tl.fromTo("#s4-laptop", { scale: 1 }, { scale: 1.05, duration: 3.4, ease: "sine.inOut", immediateRender: false }, 1.4);
          // swap to the decision plan
          tl.to("#s4-n1", { opacity: 0, duration: 0.3 }, 5.0);
          tl.to("#s4-r10", { opacity: 0, yPercent: -8, duration: 0.6, ease: "power3.inOut" }, 5.2);
          tl.to("#s4-r2", { opacity: 1, yPercent: 0, duration: 0.6, ease: "power3.inOut" }, 5.2);
          tl.to("#s4-ring", { x: plan.x, y: plan.y, width: plan.w, height: plan.h, duration: 0.6, ease: "power3.inOut" }, 5.4);
          tl.to("#s4-laptop", { scale: 1, duration: 0.8, ease: "power2.inOut" }, 5.2);
          tl.fromTo("#s4-n2", { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.8);
          tl.fromTo("#s4-laptop", { rotationY: 0 }, { rotationY: -6, rotationX: 4, duration: 3.6, ease: "sine.inOut", immediateRender: false }, 6.2);
          window.__timelines["s4-proof"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
