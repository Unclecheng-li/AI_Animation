<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Transformation Map"},
  {"id":"stages","type":"string","label":"Stages (JSON)","default":"[{\"year\":\"2024\",\"label\":\"Foundation\",\"desc\":\"Governance structures established. PMO stood up. Initial capability baseline completed. Key sponsors identified and engaged.\"},{\"year\":\"2025\",\"label\":\"Build\",\"desc\":\"Core systems implemented. First cohort of project managers certified. Pilot programs launched across three business units.\"},{\"year\":\"2026\",\"label\":\"Scale\",\"desc\":\"Enterprise rollout. All project managers operating at target maturity. Integrated reporting live across portfolio.\"},{\"year\":\"2027\",\"label\":\"Optimise\",\"desc\":\"Continuous improvement cycles embedded. Lessons-learned library operational. External benchmark comparison completed annually.\"}]"},
  {"id":"milestones","type":"string","label":"Milestones (JSON)","default":""},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"accentColor","type":"color","label":"Active Color","default":"#2f765f"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerStage","type":"number","label":"Seconds per Stage","default":4,"min":2,"max":8,"step":0.5},
  {"id":"durPerItem","type":"number","label":"Seconds per Item","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #285f9f; --accent: #2f765f; --bg: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #07131f;
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; color: #eaf5ff; }
    #el-fade { position: absolute; inset: 0; z-index: 80; background: #02060b; opacity: 0; pointer-events: none; }
    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 76% 19%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 25%),
        radial-gradient(circle at 22% 72%, rgba(46, 110, 179, 0.38), transparent 27%),
        linear-gradient(145deg, #06111f 0%, #102940 46%, #edf4ed 142%);
    }
    .sky::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 72px 72px;
      transform: perspective(680px) rotateX(58deg) translateY(210px) scale(1.25);
      transform-origin: 50% 100%;
      opacity: 0.34;
    }
    .cloud-band {
      position: absolute;
      left: -90px;
      right: -90px;
      bottom: -52px;
      height: 252px;
      background:
        radial-gradient(ellipse at 12% 58%, rgba(255,255,255,0.24), transparent 46%),
        radial-gradient(ellipse at 36% 44%, rgba(255,255,255,0.18), transparent 45%),
        radial-gradient(ellipse at 70% 61%, rgba(255,255,255,0.22), transparent 48%),
        linear-gradient(180deg, transparent, rgba(255,255,255,0.18));
      filter: blur(5px);
      opacity: 0.72;
    }
    .hud-ring {
      position: absolute;
      left: 126px;
      top: 118px;
      width: 1680px;
      height: 760px;
      border-radius: 50%;
      border: 1px solid rgba(226, 244, 255, 0.13);
      box-shadow: inset 0 0 70px rgba(120, 198, 255, 0.08);
      transform: perspective(820px) rotateX(56deg);
      opacity: 0.76;
    }
    .title {
      position: absolute;
      left: 78px;
      top: 54px;
      width: 810px;
      opacity: 0;
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      color: color-mix(in srgb, var(--accent) 62%, #fff);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .kicker::before {
      content: "";
      width: 42px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    h1 {
      margin-top: 14px;
      color: #f5fbff;
      font-size: 55px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 20px 44px rgba(0,0,0,0.38);
    }
    .mission-strip {
      position: absolute;
      left: 80px;
      bottom: 74px;
      display: flex;
      gap: 14px;
      opacity: 0;
    }
    .mission-pill {
      min-width: 154px;
      padding: 13px 15px 14px;
      border-radius: 8px;
      background: rgba(5, 16, 27, 0.72);
      border: 1px solid rgba(214, 239, 255, 0.16);
      box-shadow: 0 18px 42px rgba(0,0,0,0.2);
      backdrop-filter: blur(18px);
    }
    .mission-pill strong {
      display: block;
      color: #eef8ff;
      font-size: 19px;
      font-weight: 900;
    }
    .mission-pill span {
      display: block;
      margin-top: 4px;
      color: rgba(220, 237, 246, 0.72);
      font-size: 12px;
      font-weight: 700;
    }
    .route-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 50% 52%;
      opacity: 0;
    }
    .route-svg {
      position: absolute;
      inset: 0;
      overflow: visible;
    }
    .route-shadow,
    .route-glow,
    .route-path,
    .route-thread {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 2300;
      stroke-dashoffset: 2300;
    }
    .route-shadow { stroke: rgba(0,0,0,0.34); stroke-width: 24; filter: blur(10px); }
    .route-glow { stroke: color-mix(in srgb, var(--accent) 58%, transparent); stroke-width: 20; filter: blur(7px); }
    .route-path { stroke: color-mix(in srgb, var(--primary) 75%, #ffffff); stroke-width: 7; }
    .route-thread { stroke: rgba(255,255,255,0.9); stroke-width: 2; }
    .waypoint {
      position: absolute;
      width: 88px;
      height: 88px;
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    .waypoint::before {
      content: "";
      position: absolute;
      inset: 19px;
      border-radius: 50%;
      background: #f8fdff;
      border: 9px solid var(--primary);
      box-shadow: 0 18px 42px rgba(0,0,0,0.26), 0 0 0 12px rgba(255,255,255,0.12);
    }
    .waypoint.active::before {
      border-color: var(--accent);
      box-shadow: 0 18px 42px rgba(0,0,0,0.28), 0 0 0 14px color-mix(in srgb, var(--accent) 34%, transparent);
    }
    .waypoint::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.36);
    }
    .wp-label {
      position: absolute;
      left: 48px;
      top: 62px;
      min-width: 146px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(4, 15, 25, 0.74);
      border: 1px solid rgba(222, 242, 255, 0.16);
      box-shadow: 0 16px 36px rgba(0,0,0,0.24);
      backdrop-filter: blur(14px);
    }
    .wp-label strong {
      color: #f8fdff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }
    .wp-label span {
      display: block;
      margin-top: 4px;
      color: rgba(223, 239, 246, 0.76);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
    }
    .plane {
      position: absolute;
      left: 0;
      top: 0;
      width: 118px;
      height: 118px;
      offset-path: path("M 178 744 C 392 683 464 524 645 500 C 841 474 924 332 1122 334 C 1308 336 1394 454 1642 358");
      offset-distance: 0%;
      offset-rotate: auto;
      offset-anchor: 50% 50%;
      filter: drop-shadow(0 24px 24px rgba(0,0,0,0.38));
      opacity: 0;
      z-index: 6;
    }
    .plane-core {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    .plane svg { width: 100%; height: 100%; overflow: visible; }
    .contrail {
      position: absolute;
      width: 190px;
      height: 22px;
      left: -132px;
      top: 48px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.72));
      filter: blur(3px);
      opacity: 0.78;
    }
    .info-panel {
      position: absolute;
      right: 82px;
      top: 184px;
      width: 620px;
      min-height: 316px;
      padding: 30px 34px 34px;
      border-radius: 8px;
      background: rgba(8, 23, 36, 0.74);
      border: 1px solid rgba(221, 241, 255, 0.16);
      box-shadow: 0 34px 90px rgba(0,0,0,0.34);
      backdrop-filter: blur(22px);
      opacity: 0;
    }
    .info-year {
      color: color-mix(in srgb, var(--accent) 72%, #ffffff);
      font-size: 88px;
      line-height: 0.86;
      font-weight: 900;
      opacity: 0.34;
    }
    .info-label {
      margin-top: -4px;
      color: #f7fbff;
      font-size: 39px;
      line-height: 1;
      font-weight: 900;
    }
    .info-desc {
      margin-top: 20px;
      color: rgba(230, 240, 246, 0.84);
      font-size: 21px;
      line-height: 1.56;
      font-weight: 500;
    }
    .readout {
      position: absolute;
      right: 88px;
      bottom: 82px;
      width: 610px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      opacity: 0;
    }
    .readout div {
      padding: 14px 16px 16px;
      border-radius: 8px;
      background: rgba(5, 16, 27, 0.7);
      border: 1px solid rgba(226, 244, 255, 0.14);
      color: rgba(229, 241, 247, 0.7);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .readout strong {
      display: block;
      margin-top: 8px;
      color: #ffffff;
      font-size: 25px;
      letter-spacing: 0;
      text-transform: none;
    }
    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      opacity: 0.34;
      transform: translateY(-20px);
    }
  </style>
</head>
<body>
  <div data-composition-id="transformation-map-flight-mode" data-width="1920" data-height="1080" data-duration="17" data-start="0">
    <div class="sky"></div>
    <div class="hud-ring"></div>
    <div class="cloud-band"></div>
    <div class="scanline" id="scanline"></div>
    <div id="routeWrap" class="route-wrap">
      <svg class="route-svg" viewBox="0 0 1920 1080" aria-hidden="true">
        <path id="routeShadow" class="route-shadow" d="M 178 744 C 392 683 464 524 645 500 C 841 474 924 332 1122 334 C 1308 336 1394 454 1642 358"/>
        <path id="routeGlow" class="route-glow" d="M 178 744 C 392 683 464 524 645 500 C 841 474 924 332 1122 334 C 1308 336 1394 454 1642 358"/>
        <path id="routePath" class="route-path" d="M 178 744 C 392 683 464 524 645 500 C 841 474 924 332 1122 334 C 1308 336 1394 454 1642 358"/>
        <path id="routeThread" class="route-thread" d="M 178 744 C 392 683 464 524 645 500 C 841 474 924 332 1122 334 C 1308 336 1394 454 1642 358"/>
      </svg>
      <div id="plane" class="plane">
        <div class="contrail"></div>
        <div id="planeCore" class="plane-core">
          <svg viewBox="-64 -64 128 128">
            <path d="M 58 0 C 52 -10 37 -15 15 -16 L -18 -56 C -23 -62 -34 -58 -32 -49 L -21 -15 L -48 -12 C -56 -11 -60 -6 -60 0 C -60 6 -56 11 -48 12 L -21 15 L -32 49 C -34 58 -23 62 -18 56 L 15 16 C 37 15 52 10 58 0 Z" fill="#ffffff"/>
            <path d="M 54 0 C 46 -6 33 -9 14 -10 L -19 -50 C -21 -53 -25 -52 -25 -47 L -15 -10 L -49 -6 C -53 -5 -55 -2 -55 0 C -55 2 -53 5 -49 6 L -15 10 L -25 47 C -25 52 -21 53 -19 50 L 14 10 C 33 9 46 6 54 0 Z" fill="var(--accent)"/>
            <circle cx="18" cy="0" r="6" fill="#eff8ff" opacity="0.95"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="title">
      <div class="kicker">Flight Mode</div>
      <h1 id="mainTitle"></h1>
    </div>
    <div id="infoPanel" class="info-panel">
      <div id="infoYear" class="info-year"></div>
      <div id="infoLabel" class="info-label"></div>
      <div id="infoDesc" class="info-desc"></div>
    </div>
    <div id="missionStrip" class="mission-strip"></div>
    <div class="readout" id="readout">
      <div>Altitude<strong id="altitude">00%</strong></div>
      <div>Vector<strong id="vector">INIT</strong></div>
      <div>Status<strong id="statusReadout">Ready</strong></div>
    </div>
    <div id="el-fade"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var raw = vars.stages || vars.milestones || '[]';
      var stages = JSON.parse(raw).map(function(s) {
        return {
          year: s.year || '',
          label: s.label || s.heading || '',
          desc: s.desc || s.body || ''
        };
      });
      var pc = vars.primaryColor || '#285f9f';
      var ac = vars.accentColor || '#2f765f';
      var bgColor = vars.bgColor || '#f5f2ea';
      var dur = Number(vars.durationPerStage || vars.durPerItem) || 4;
      document.documentElement.style.setProperty('--primary', pc);
      document.documentElement.style.setProperty('--accent', ac);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.getElementById('mainTitle').textContent = vars.title || 'Transformation Map';

      var coords = [{x:178,y:744},{x:645,y:500},{x:1122,y:334},{x:1642,y:358}];
      var missionStrip = document.getElementById('missionStrip');
      var routeWrap = document.getElementById('routeWrap');
      var wpEls = [];
      stages.forEach(function(s, i) {
        var c = coords[i] || coords[coords.length - 1];
        var wp = document.createElement('div');
        wp.className = 'waypoint';
        wp.style.left = c.x + 'px';
        wp.style.top = c.y + 'px';
        wp.innerHTML = '<div class="wp-label"><strong>' + s.year + '</strong><span>' + s.label + '</span></div>';
        routeWrap.appendChild(wp);
        wpEls.push(wp);

        var pill = document.createElement('div');
        pill.className = 'mission-pill';
        pill.innerHTML = '<strong>' + s.year + '</strong><span>' + s.label + '</span>';
        missionStrip.appendChild(pill);
      });

      var infoYear = document.getElementById('infoYear');
      var infoLabel = document.getElementById('infoLabel');
      var infoDesc = document.getElementById('infoDesc');
      var altitude = document.getElementById('altitude');
      var vector = document.getElementById('vector');
      var statusReadout = document.getElementById('statusReadout');
      function setStage(idx) {
        var s = stages[idx] || stages[0] || {year:'', label:'', desc:''};
        infoYear.textContent = s.year;
        infoLabel.textContent = s.label;
        infoDesc.textContent = s.desc;
        altitude.textContent = Math.round(((idx + 1) / stages.length) * 100) + '%';
        vector.textContent = s.year || 'LIVE';
        statusReadout.textContent = idx === stages.length - 1 ? 'Arrived' : 'In flight';
        wpEls.forEach(function(wp, i) { wp.classList.toggle('active', i === idx); });
      }
      setStage(0);

      var TOTAL = Math.max(stages.length * dur + 1, 17);
      var tl = gsap.timeline({ paused: true, defaults: { overwrite: 'auto' } });
      tl.from('.sky', { scale: 1.08, opacity: 0, duration: 0.8, ease: 'power2.out' }, 0);
      tl.to('#scanline', { y: 1100, duration: 2.8, repeat: 5, ease: 'none' }, 0);
      tl.to('.title', { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.25);
      tl.from('.title', { y: 24, duration: 0.6, ease: 'power3.out' }, 0.25);
      tl.to('#routeWrap', { opacity: 1, scale: 1, duration: 0.7, ease: 'power2.out' }, 0.45);
      tl.from('#routeWrap', { scale: 1.08, y: 24, duration: 0.7, ease: 'power2.out' }, 0.45);
      tl.to('#infoPanel', { opacity: 1, x: -18, duration: 0.55, ease: 'power3.out' }, 0.75);
      tl.to('#missionStrip', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.8);
      tl.to('#readout', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.9);
      tl.from('.mission-pill', { y: 18, opacity: 0, duration: 0.32, stagger: 0.08, ease: 'back.out(1.8)' }, 0.92);
      tl.fromTo('.waypoint', { scale: 0.24, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, stagger: 0.12, ease: 'back.out(2.4)' }, 1.05);
      tl.from('#plane', { scale: 0.45, opacity: 0, duration: 0.34, ease: 'back.out(2.3)' }, 1.2);
      tl.to('#plane', { opacity: 1, duration: 0.18 }, 1.2);
      tl.to('#routeShadow', { strokeDashoffset: 0, duration: TOTAL - 3.1, ease: 'sine.inOut' }, 1.25);
      tl.to('#routeGlow', { strokeDashoffset: 0, duration: TOTAL - 3.0, ease: 'sine.inOut' }, 1.28);
      tl.to('#routePath', { strokeDashoffset: 0, duration: TOTAL - 2.9, ease: 'sine.inOut' }, 1.32);
      tl.to('#routeThread', { strokeDashoffset: 0, duration: TOTAL - 3.2, ease: 'sine.inOut' }, 1.38);
      tl.to('#plane', { offsetDistance: '100%', duration: TOTAL - 3.1, ease: 'sine.inOut' }, 1.28);
      tl.to('#planeCore', { scale: 1.08, duration: 0.18, repeat: Math.round((TOTAL - 2) / 0.36), yoyo: true, ease: 'sine.inOut' }, 1.3);

      for (var i = 0; i < stages.length; i++) {
        (function(idx) {
          var t = 1.35 + idx * ((TOTAL - 3.3) / Math.max(stages.length - 1, 1));
          tl.call(function() { setStage(idx); }, null, t);
          tl.fromTo(wpEls[idx], { scale: 0.88 }, { scale: 1.14, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t);
          tl.fromTo('#infoPanel', { scale: 0.98 }, { scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, t + 0.06);
        })(i);
      }

      tl.to('#planeCore', { scale: 1.25, duration: 0.16, ease: 'back.out(3)' }, TOTAL - 1.25);
      tl.to('#planeCore', { scale: 1, duration: 0.28, ease: 'elastic.out(1, 0.45)' }, TOTAL - 1.05);
      tl.to('#el-fade', { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);

      document.querySelector('[data-composition-id="transformation-map-flight-mode"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['transformation-map-flight-mode'] = tl;
    </script>
  </div>
</body>
</html>
