<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(70% 60% at 50% 40%, #1e293b, #020617);
      }
      .copy {
        position: absolute; left: 140px; top: 340px; color: #f8fafc;
        font-family: "Segoe UI", sans-serif;
      }
      .eyebrow { font-size: 24px; letter-spacing: 0.3em; text-transform: uppercase; color: #fbbf24; margin-bottom: 22px; }
      .title { font-size: 108px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 28px; font-size: 32px; color: #cbd5e1; }
      .badge {
        position: absolute; left: 1080px; top: 220px; width: 560px; height: 560px;
      }
      .medal {
        position: absolute; left: 80px; top: 40px; width: 400px; height: 400px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 45%, #b45309 100%);
        border: 14px solid #fef3c7;
        box-shadow: 0 24px 60px rgba(245, 158, 11, 0.35), inset 0 0 40px rgba(255,255,255,0.25);
        display: flex; align-items: center; justify-content: center;
        font-family: Georgia, serif; font-size: 64px; font-weight: 700; color: #78350f;
        text-align: center; line-height: 1.1;
      }
      .ribbon-l, .ribbon-r {
        position: absolute; bottom: 40px; width: 90px; height: 180px;
        background: #dc2626;
      }
      .ribbon-l { left: 170px; transform: skewX(12deg); }
      .ribbon-r { left: 300px; transform: skewX(-12deg); background: #b91c1c; }
      .burst {
        position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px;
        border-radius: 50%; border: 3px dashed rgba(253, 230, 138, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Achievement</div>
        <div class="title">Badge Earn</div>
        <div class="sub">Unlock moment with medal + ribbon</div>
      </div>
      <div id="badge" class="clip badge" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="burst" id="burst"></div>
        <div class="ribbon-l" id="rl"></div>
        <div class="ribbon-r" id="rr"></div>
        <div class="medal" id="medal">SHIP<br/>IT</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, x: -18 });
      gsap.set("#medal", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" });
      gsap.set(["#rl", "#rr"], { opacity: 0, y: -40 });
      gsap.set("#burst", { opacity: 0, scale: 0.6, rotation: 0 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.5 }, 0.15)
        .to("#medal", { opacity: 1, scale: 1.08, duration: 0.65, ease: "back.out(2)" }, 0.55)
        .to("#medal", { scale: 1, duration: 0.22 }, 1.28)
        .to(["#rl", "#rr"], { opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: "power3.out" }, 1.25)
        .to("#burst", { opacity: 1, scale: 1, duration: 0.6 }, 1.35)
        .to("#burst", { rotation: 40, duration: 2.4, ease: "none" }, 1.7)
        .to("#medal", { y: -10, duration: 1.8, ease: "sine.inOut" }, 2.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
