<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ecfeff; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(160deg, #cffafe 0%, #ecfeff 50%, #f0f9ff 100%);
      }
      .title {
        position: absolute; left: 140px; top: 90px;
        font-family: Georgia, serif; font-size: 72px; color: #0e7490;
      }
      .thread {
        position: absolute; left: 520px; top: 220px; width: 880px; height: 700px;
      }
      .bubble {
        max-width: 640px; padding: 28px 32px; border-radius: 28px;
        font-family: "Segoe UI", sans-serif; font-size: 34px; line-height: 1.35;
        margin-bottom: 28px; box-shadow: 0 12px 30px rgba(8, 145, 178, 0.12);
      }
      .them {
        background: #fff; color: #0f172a; border-bottom-left-radius: 8px;
      }
      .me {
        background: #0891b2; color: #ecfeff; margin-left: auto; border-bottom-right-radius: 8px;
      }
      .meta {
        font-size: 20px; opacity: 0.65; margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="title" class="clip title" data-start="0" data-duration="4.5" data-track-index="0">Chat Bubbles</div>
      <div id="thread" class="clip thread" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="bubble them" id="b1">
          Can you ship a hero pack today?
          <div class="meta">Alex · 09:41</div>
        </div>
        <div class="bubble me" id="b2">
          Already composing — one style each.
          <div class="meta">You · 09:41</div>
        </div>
        <div class="bubble them" id="b3">
          Perfect. Pin the best three on homepage.
          <div class="meta">Alex · 09:42</div>
        </div>
        <div class="bubble me" id="b4">
          On it ✓
          <div class="meta">You · 09:42</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#title", { opacity: 0, y: 14 });
      gsap.set(["#b1", "#b2", "#b3", "#b4"], { opacity: 0, y: 28, scale: 0.96 });
      tl.to("#title", { opacity: 1, y: 0, duration: 0.45 }, 0.1)
        .to("#b1", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 0.4)
        .to("#b2", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 1.15)
        .to("#b3", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 2.0)
        .to("#b4", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 2.85)
        .to("#b4", { scale: 1.03, duration: 0.7, ease: "sine.inOut" }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
