<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Motion Mania — from repo to reel</title>
  <link rel="stylesheet" href="scene.css">
  <style>
    @font-face { font-family: 'Liberation Sans'; src: url('assets/fonts/LiberationSans-Regular.ttf') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'Liberation Sans'; src: url('assets/fonts/LiberationSans-Bold.ttf') format('truetype'); font-weight: 700; }
  </style>
</head>
<body>
  <main id="film" data-composition-id="motion-mania" data-width="__WIDTH__" data-height="__HEIGHT__" data-duration="__DURATION__" data-fps="__FPS__">
    <section id="scene-hook" class="clip scene hook" data-start="0" data-duration="3" data-track-index="0">
      <div class="headline"><div class="word">YOUR CODE.</div><div class="word accent">IN MOTION.</div><p class="intro">A new life for your next big idea.</p></div>
      <div class="hook-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
    <section id="scene-build" class="clip scene build" data-start="3" data-duration="3.5" data-track-index="0">
      <div class="build-copy"><h1><span>BRIEF.</span><span>BUILD.</span><span class="accent">MAKE IT MOVE.</span></h1></div>
      <div class="files">
        <div class="file brief"><div class="file-label">brief.md</div><div class="rule wide"></div><div class="rule"></div><div class="rule short"></div><p>One idea. A clear direction.</p></div>
        <div class="file source"><div class="file-label">scene.js</div><div class="code-line"><b>timeline</b>.fromTo(</div><div class="code-line indent">idea, motion</div><div class="code-line">);</div><div class="timeline"><i></i><i></i><i></i><i></i><div class="playhead"></div></div></div>
      </div>
    </section>
    <section id="scene-review" class="clip scene review" data-start="6.5" data-duration="4" data-track-index="0">
      <h1><span>LOOK.</span> <span>TWEAK.</span> <span>REPEAT.</span></h1>
      <div class="frames">
        <div class="frame"><div class="mini word-mini">Aa</div><div class="caption">COMPOSITION</div></div>
        <div class="frame middle"><div class="mini shapes"><i></i><i></i><i></i></div><div class="caption">MOVEMENT</div></div>
        <div class="frame"><div class="mini bars"><i></i><i></i><i></i><i></i><i></i></div><div class="caption">RHYTHM</div></div>
      </div>
      <p class="review-note">Render it. See it. Make it better.</p>
    </section>
    <section id="scene-end" class="clip scene end" data-start="10.5" data-duration="4.5" data-track-index="0">
      <div class="format-pair" aria-hidden="true"><div class="format portrait"><img src="assets/logo.svg" alt=""></div><div class="format landscape"><img src="assets/logo.svg" alt=""></div></div>
      <div class="lockup"><img src="assets/logo.svg" alt="Motion Mania mark"><h1>MOTION<span>MANIA.</span></h1><p>FROM REPO TO REEL.</p></div>
    </section>
    <audio id="score" src="assets/score.wav" data-start="0" data-duration="15" data-track-index="1" data-volume="0.8"></audio>
  </main>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="scene.js"></script>
</body>
</html>
