<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #000814;
        --accent: #FFC300;
        --text: #FFFFFF;
        --secondary: #FFD60A;
        --surface: #001D3D;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 1920px;
        height: 1080px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Fraunces', serif;
        overflow: hidden;
      }

      #root {
        width: 1920px;
        height: 1080px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 160px;
        text-align: center;
      }

      .scene-content {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 600px;
        gap: 80px;
      }

      .clip {
        opacity: 1; /* GSAP handles visibility */
      }

      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .line-wrapper {
        overflow: hidden;
        display: block;
        padding: 15px 0; /* Extra padding for rotation/back eases */
      }

      .text-large {
        font-size: 84px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      .text-accent {
        color: var(--accent);
        font-style: italic;
      }

      .text-highlight {
        font-family: 'Instrument Sans', sans-serif;
        font-weight: 300;
        font-size: 36px;
        text-transform: uppercase;
        letter-spacing: 0.5em;
        color: var(--secondary);
      }

      .ambient-glow {
        position: absolute;
        width: 2400px;
        height: 1400px;
        background: radial-gradient(circle, rgba(255, 195, 0, 0.08) 0%, rgba(0, 8, 20, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: -1;
      }

      .grain {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.04;
        pointer-events: none;
        z-index: 100;
      }

      .simple-badge {
        padding: 10px 32px;
        border: 1px solid var(--accent);
        border-radius: 100px;
        font-family: 'Instrument Sans', sans-serif;
        font-size: 24px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-top: 40px;
      }

      .divider {
        width: 1px;
        height: 500px;
        background: linear-gradient(to bottom, rgba(255, 195, 0, 0), rgba(255, 195, 0, 0.2), rgba(255, 195, 0, 0));
      }

      .header-area {
        position: absolute;
        top: 100px;
        width: 100%;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div class="grain"></div>
      <div id="glow" class="ambient-glow clip" data-start="0" data-duration="6" data-track-index="0"></div>

      <div id="header-area" class="header-area clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="headline" class="text-highlight">What is Empathy?</div>
      </div>

      <div id="scene-content" class="scene-content clip" data-start="0" data-duration="6" data-track-index="2">
        <!-- Man Column -->
        <div id="col-man" class="column">
          <div class="text-large">
            <span class="line-wrapper"><span class="v-text">A <span class="text-accent">Man</span> wishes</span></span>
            <span class="line-wrapper"><span class="v-text">to be admired</span></span>
            <span class="line-wrapper"><span class="v-text">& appreciated,</span></span>
          </div>
        </div>

        <div id="div-1" class="divider"></div>

        <!-- Woman Column -->
        <div id="col-woman" class="column">
          <div class="text-large">
            <span class="line-wrapper"><span class="v-text">a <span class="text-accent">Woman</span> wishes</span></span>
            <span class="line-wrapper"><span class="v-text">to be loved</span></span>
            <span class="line-wrapper"><span class="v-text">and respected.</span></span>
          </div>
        </div>

        <div id="div-2" class="divider"></div>

        <!-- Simple Column -->
        <div id="col-simple" class="column">
          <div class="text-large">
            <span class="line-wrapper"><span class="v-text">It's that</span></span>
            <span class="line-wrapper"><span class="text-accent v-text">simple.</span></span>
          </div>
          <div id="badge" class="simple-badge">The Core</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ambient Animation - More dynamic breathing
      tl.to("#glow", {
        scale: 1.2,
        opacity: 0.8,
        duration: 3,
        repeat: 1,
        yoyo: true,
        ease: "power2.inOut"
      }, 0);

      // Headline - High energy entrance
      tl.from("#headline", {
        y: -100,
        scale: 0.7,
        opacity: 0,
        duration: 1.2,
        ease: "elastic.out(1, 0.75)"
      }, 0.1);

      // Apply the "Core" effect (elastic/back) to all lines
      const lines = document.querySelectorAll(".v-text");
      lines.forEach((line, index) => {
        tl.from(line, {
          y: 150,
          scale: 0.5,
          rotationX: -60,
          opacity: 0,
          duration: 1.4,
          ease: "elastic.out(1, 0.6)"
        }, 0.3 + (index * 0.1));
        
        // Ambient drift after entry to keep it "alive"
        tl.to(line, {
          y: "-=15",
          rotationZ: index % 2 === 0 ? 1 : -1,
          duration: 2.5,
          repeat: 1,
          yoyo: true,
          ease: "sine.inOut"
        }, 1.5 + (index * 0.1));
      });

      // Dividers - Smooth expansion
      tl.from(".divider", {
        scaleY: 0,
        opacity: 0,
        duration: 1.4,
        stagger: 0.2,
        ease: "expo.inOut"
      }, 0.6);

      // Badge - Fun pop
      tl.from("#badge", {
        scale: 0,
        rotation: -25,
        opacity: 0,
        duration: 1.2,
        ease: "elastic.out(1.2, 0.5)"
      }, 2.0);

      // Final Fade Out
      tl.to("#root", {
        opacity: 0,
        duration: 0.5,
        ease: "power2.in"
      }, 5.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
