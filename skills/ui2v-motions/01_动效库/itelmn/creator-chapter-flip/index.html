<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:Mont;src:url('assets/montserrat.woff2')}*{box-sizing:border-box}body{margin:0}#stage{width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Noto}.clip{position:absolute;inset:0;overflow:hidden}.world{width:1920px;height:1080px;perspective:2000px;display:flex}.wing{width:960px;height:1080px;position:relative;transform-style:preserve-3d;overflow:hidden}.left{background:var(--orange);transform-origin:left center}.right{background:var(--paper);transform-origin:right center;border-left:1px solid var(--ink)}.inside{height:100%;padding:100px 110px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{font-family:Mont;font-size:28px;letter-spacing:4px}.digit{font-family:Mont;font-weight:800;font-size:600px;line-height:620px;letter-spacing:-55px;display:flex;align-items:center;justify-content:center;color:var(--ink)}.left .digit{color:var(--paper)}.foot{font-size:30px;letter-spacing:6px}.sidehead{position:absolute;right:115px;top:105px;font-size:28px;letter-spacing:8px;writing-mode:vertical-rl}.title-wrap{position:absolute;right:125px;bottom:110px;z-index:5;overflow:hidden}.title{font-size:104px;font-weight:800;letter-spacing:2px}.title::after{content:'';display:block;height:7px;background:var(--orange);margin-top:24px}.seam{position:absolute;left:950px;top:0;width:20px;height:1080px;background:var(--ink);transform-origin:center;z-index:8}.corner{position:absolute;right:125px;top:100px;width:55px;height:55px;border-top:4px solid var(--ink);border-right:4px solid var(--ink)}.rail{position:absolute;left:100px;right:100px;bottom:80px;height:1px;background:var(--ink);opacity:.25}.numberTwo{position:relative;top:-100px;line-height:530px;height:530px;font-size:560px}.title-pad{position:absolute;inset:0;background:var(--paper);z-index:-1}.back-mark{position:absolute;left:100px;top:95px;font-family:Mont;font-size:28px;letter-spacing:5px;color:var(--ink)}
</style></head><body><div id="stage" data-composition-id="chapter" data-width="1920" data-height="1080" data-fps="30" data-start="0" data-duration="8"><div id="chapter-clip" class="clip" data-start="0" data-duration="8"><div class="world"><div class="wing left" data-layout-allow-overflow><div class="inside"><div class="eyebrow" id="english"></div><div class="digit" id="first"></div><div class="foot">一隅观察 / 影像手记</div></div></div><div class="wing right" data-layout-allow-overflow><div class="inside"><div class="eyebrow" id="chapterName"></div><div class="digit numberTwo" id="second"></div><div class="foot">&nbsp;</div></div><div class="corner"></div><div class="title-wrap"><div class="title" data-layout-allow-overflow id="title"></div></div></div></div><div class="seam"></div></div></div><script>
// CONFIG: keep chapter number two digits; recommended title <= 5 Chinese characters.
const CONFIG={number:'02',chapterName:'第二章',title:'换个角度',english:'CHAPTER / 02',orange:'#DD5724',paper:'#FBF4E7',ink:'#211D19'};['orange','paper','ink'].forEach(k=>document.documentElement.style.setProperty('--'+k,CONFIG[k]));['chapterName','title','english'].forEach(k=>document.getElementById(k).textContent=CONFIG[k]);document.getElementById('first').textContent=CONFIG.number[0];document.getElementById('second').textContent=CONFIG.number[1];
// Adapted split-tilt-cards opposite-wing/book-open primitive; cards redesigned as full-height dimensional chapter doors, with stable readable hold.
const tl=gsap.timeline({paused:true});tl.fromTo('.left',{x:1920,rotationY:35},{x:0,rotationY:0,duration:1,ease:'power4.out'},0).fromTo('.right',{x:1100,rotationY:-50},{x:0,rotationY:0,duration:1.1,ease:'power4.out'},.12).fromTo('.digit',{y:180,opacity:0},{y:0,opacity:1,duration:.85,stagger:.15,ease:'power4.out'},.4).fromTo('.eyebrow,.foot,.corner',{opacity:0},{opacity:1,duration:.65},.9).fromTo('.seam',{scaleY:0},{scaleY:1,duration:.7,ease:'power3.out'},.65).to('.left',{rotationY:12,duration:.8,ease:'power2.inOut'},2).to('.right',{rotationY:-12,duration:.8,ease:'power2.inOut'},2).to('.seam',{scaleX:0,duration:.5},2).to('.left,.right',{rotationY:0,duration:.9,ease:'power3.inOut'},3.1).fromTo('.title',{y:150},{y:0,duration:.75,ease:'power4.out'},3.75).to('.left',{x:-1050,rotationY:-70,duration:1.2,ease:'power3.inOut'},6).to('.right',{x:1050,rotationY:70,duration:1.2,ease:'power3.inOut'},6.12);window.__timelines=window.__timelines||{};window.__timelines.chapter=tl;tl.seek(0);
</script></body></html>
