<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #0b1224 0%, #020617 70%);
      }
      .orb {
        position: absolute; left: 50%; top: 50%; width: 280px; height: 280px;
        margin: -140px 0 0 -140px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #7dd3fc 0%, #0284c7 45%, #0c4a6e 100%);
        box-shadow: 0 0 80px rgba(56, 189, 248, 0.45), 0 0 160px rgba(14, 165, 233, 0.25);
      }
      .ring {
        position: absolute; left: 50%; top: 50%; border-radius: 50%;
        border: 2px solid rgba(125, 211, 252, 0.35);
        transform: translate(-50%, -50%);
      }
      .r1 { width: 420px; height: 420px; }
      .r2 { width: 560px; height: 560px; border-style: dashed; }
      .r3 { width: 720px; height: 720px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="r3" class="clip ring r3" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="r2" class="clip ring r2" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="r1" class="clip ring r1" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="orb" class="clip orb" data-start="0" data-duration="4.5" data-track-index="3"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#orb", { scale: 0.2, opacity: 0 });
      gsap.set(["#r1", "#r2", "#r3"], { scale: 0.4, opacity: 0 });
      tl.to("#orb", { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0.15)
        .to("#r1", { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.45)
        .to("#r2", { opacity: 0.9, scale: 1, duration: 0.9, ease: "power2.out" }, 0.65)
        .to("#r3", { opacity: 0.55, scale: 1, duration: 1.0, ease: "power2.out" }, 0.85)
        .to("#orb", { scale: 1.08, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4)
        .to("#r2", { rotation: 28, duration: 2.4, ease: "sine.inOut" }, 1.2)
        .to("#r3", { rotation: -18, duration: 2.4, ease: "sine.inOut" }, 1.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
