<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b1220; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background:
          radial-gradient(60% 50% at 20% 20%, rgba(56,189,248,0.25), transparent 60%),
          radial-gradient(50% 40% at 80% 70%, rgba(167,139,250,0.22), transparent 55%),
          #0b1220;
      }
      .glass {
        position: absolute; left: 520px; top: 220px; width: 880px; height: 560px;
        border-radius: 36px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        backdrop-filter: blur(18px);
        padding: 64px 72px;
        color: #f8fafc;
        font-family: "Segoe UI", sans-serif;
      }
      .badge {
        display: inline-block; padding: 10px 18px; border-radius: 999px;
        background: rgba(34,211,238,0.15); color: #67e8f9; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;
      }
      .title { margin-top: 36px; font-size: 88px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
      .row { margin-top: 48px; display: flex; gap: 18px; }
      .pill {
        flex: 1; padding: 22px 20px; border-radius: 18px;
        background: rgba(15,23,42,0.45); border: 1px solid rgba(148,163,184,0.25);
        font-size: 26px;
      }
      .pill strong { display: block; font-size: 34px; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="glass" class="clip glass" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="badge" id="badge">Workspace</div>
        <div class="title" id="title">Glass Panel</div>
        <div class="row" id="row">
          <div class="pill"><strong>12</strong>Active previews</div>
          <div class="pill"><strong>98%</strong>Render health</div>
          <div class="pill"><strong>3</strong>Shared boards</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#glass", { opacity: 0, y: 60, scale: 0.94, transformOrigin: "50% 50%" });
      gsap.set("#badge", { opacity: 0, y: 12 });
      gsap.set("#title", { opacity: 0, y: 24 });
      gsap.set("#row", { opacity: 0, y: 20 });
      tl.to("#glass", { opacity: 1, y: 0, scale: 1, duration: 0.95, ease: "power3.out" }, 0.15)
        .to("#badge", { opacity: 1, y: 0, duration: 0.45 }, 0.55)
        .to("#title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.7)
        .to("#row", { opacity: 1, y: 0, duration: 0.6 }, 1.0)
        .to("#glass", { y: -10, duration: 2.4, ease: "sine.inOut" }, 1.8);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
