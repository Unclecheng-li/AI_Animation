<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Destination accent","default":"#6d5dfc"}]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .gd-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e9e7e0;
          color: #171a18;
          font-family: Inter, sans-serif;
          --accent: #6d5dfc;
        }
        .gd-page,
        .gd-ghost {
          position: absolute;
          inset: 0;
        }
        .gd-variant-b {
          opacity: 0;
        }
        .gd-ui {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          padding: 72px 86px;
          background: #e9e7e0;
        }
        .gd-variant-b .gd-ui,
        .gd-b-ui {
          background: #171a18;
          color: #f5f3ed;
        }
        .gd-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 18px;
          font-weight: 900;
          letter-spacing: 3px;
        }
        .gd-head b {
          font-size: 34px;
          letter-spacing: -1px;
        }
        .gd-grid {
          display: grid;
          grid-template-columns: 270px 1fr;
          gap: 28px;
          margin-top: 54px;
        }
        .gd-side,
        .gd-main {
          height: 760px;
          padding: 28px;
          border: 1px solid #c9c7c0;
          border-radius: 20px;
          background: #faf9f5;
        }
        .gd-variant-b .gd-side,
        .gd-variant-b .gd-main,
        .gd-b-ui .gd-side,
        .gd-b-ui .gd-main {
          border-color: #404440;
          background: #252a26;
        }
        .gd-line {
          width: 72%;
          height: 14px;
          margin-bottom: 18px;
          border-radius: 8px;
          background: #999b96;
        }
        .gd-main {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
        .gd-card {
          position: relative;
          min-height: 210px;
          padding: 26px;
          border-radius: 18px;
          background: #d7d5ce;
          overflow: hidden;
        }
        .gd-variant-b .gd-card,
        .gd-b-ui .gd-card {
          background: #313632;
        }
        .gd-card.hot:after {
          content: "";
          position: absolute;
          left: 26px;
          right: 26px;
          bottom: 28px;
          height: 78px;
          border-radius: 12px;
          background: linear-gradient(135deg, var(--accent), #4236a8);
        }
        .gd-ghost {
          opacity: 0;
          pointer-events: none;
        }
        .gd-ghost-dark {
          filter: brightness(0.45);
        }
        .gd-ghost-bright {
          filter: invert(1);
        }
        .gd-tears {
          position: absolute;
          inset: 0;
          opacity: 0;
          overflow: hidden;
        }
        .gd-strip {
          position: absolute;
          left: 0;
          width: 1920px;
          height: 67.5px;
          overflow: hidden;
        }
        .gd-sheet {
          position: absolute;
          left: 0;
          width: 1920px;
          height: 1080px;
        }
        .gd-caption {
          position: absolute;
          left: 54px;
          bottom: 38px;
          z-index: 20;
          padding: 10px 14px;
          border-radius: 8px;
          background: rgba(20, 22, 20, 0.9);
          color: #fff;
          font-size: 14px;
          font-weight: 900;
          letter-spacing: 3px;
        }
      </style>
      <div
        id="gd-root"
        data-hf-id="hf-gd-root"
        data-composition-id="shot-glitch-displace"
        data-start="0"
        data-duration="4.5"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="gd-fill">
          <div class="gd-page gd-variant-a">
            <div class="gd-ui">
              <div class="gd-head">
                <b data-layout-allow-overlap data-layout-allow-occlusion
                  >SYSTEM / A</b
                ><span data-layout-allow-overlap data-layout-allow-occlusion
                  >LIVE GRID</span
                >
              </div>
              <div class="gd-grid">
                <div class="gd-side">
                  <div class="gd-line"></div>
                  <div class="gd-line"></div>
                  <div class="gd-line"></div>
                </div>
                <div class="gd-main">
                  <div class="gd-card"><div class="gd-line"></div></div>
                  <div class="gd-card hot"><div class="gd-line"></div></div>
                  <div class="gd-card hot"><div class="gd-line"></div></div>
                  <div class="gd-card"><div class="gd-line"></div></div>
                </div>
              </div>
            </div>
          </div>
          <div class="gd-page gd-variant-b">
            <div class="gd-ui gd-b-ui">
              <div class="gd-head">
                <b data-layout-allow-overlap data-layout-allow-occlusion
                  >SYSTEM / B</b
                ><span data-layout-allow-overlap data-layout-allow-occlusion
                  >RECONNECTED</span
                >
              </div>
              <div class="gd-grid">
                <div class="gd-side">
                  <div class="gd-line"></div>
                  <div class="gd-line"></div>
                  <div class="gd-line"></div>
                </div>
                <div class="gd-main">
                  <div class="gd-card hot"><div class="gd-line"></div></div>
                  <div class="gd-card"><div class="gd-line"></div></div>
                  <div class="gd-card"><div class="gd-line"></div></div>
                  <div class="gd-card hot"><div class="gd-line"></div></div>
                </div>
              </div>
            </div>
          </div>
          <div class="gd-ghost gd-ghost-dark" data-layout-allow-overflow></div>
          <div
            class="gd-ghost gd-ghost-bright"
            data-layout-allow-overflow
          ></div>
          <div class="gd-tears" data-layout-allow-overflow></div>
          <div class="gd-caption">16 STRIPS / 70PX TEAR / HIDDEN CUT</div>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var root = document.querySelector("#gd-root"),
            fill = root.querySelector(".gd-fill"),
            tears = root.querySelector(".gd-tears"),
            a = root.querySelector(".gd-variant-a .gd-ui"),
            b = root.querySelector(".gd-variant-b .gd-ui"),
            tl = gsap.timeline({ paused: true }),
            v = window.__hyperframes.getVariables(),
            strips = [];
          fill.style.setProperty("--accent", v.accent || "#6d5dfc");
          var darkGhost = a.cloneNode(true),
            brightGhost = a.cloneNode(true);
          darkGhost.querySelector(".gd-head").remove();
          brightGhost.querySelector(".gd-head").remove();
          root.querySelector(".gd-ghost-dark").appendChild(darkGhost);
          root.querySelector(".gd-ghost-bright").appendChild(brightGhost);
          for (var i = 0; i < 16; i++) {
            var strip = document.createElement("div"),
              sa = document.createElement("div"),
              sb = document.createElement("div");
            strip.className = "gd-strip";
            strip.style.top = i * 67.5 + "px";
            sa.className = "gd-sheet gd-strip-a";
            sb.className = "gd-sheet gd-strip-b";
            sa.style.top = -i * 67.5 + "px";
            sb.style.top = -i * 67.5 + "px";
            sb.style.opacity = "0";
            sa.appendChild(a.cloneNode(true));
            sb.appendChild(b.cloneNode(true));
            strip.appendChild(sa);
            strip.appendChild(sb);
            tears.appendChild(strip);
            strips.push(strip);
          }
          function hash(n) {
            var s = Math.sin(n * 127.3) * 43758.5453;
            return s - Math.floor(s);
          }
          tl.set("#gd-root .gd-tears", { opacity: 1 }, 1.5)
            .set("#gd-root .gd-ghost-dark", { opacity: 0.35, x: 12 }, 1.5)
            .set("#gd-root .gd-ghost-bright", { opacity: 0.28, x: -12 }, 1.5);
          for (var f = 45; f <= 62; f++) {
            var rise = Math.min(1, (f - 45) / 3),
              decay = Math.max(0, Math.min(1, (62 - f) / 6)),
              env = Math.min(1 - Math.pow(1 - rise, 3), decay);
            for (var j = 0; j < 16; j++)
              tl.set(
                strips[j],
                { x: (hash(j * 31 + f * 7) * 2 - 1) * 70 * env },
                f / 30,
              );
            tl.set(
              "#gd-root .gd-ghost-dark",
              { opacity: 0.35 * env },
              f / 30,
            ).set("#gd-root .gd-ghost-bright", { opacity: 0.28 * env }, f / 30);
          }
          tl.set(
            "#gd-root > .gd-fill > .gd-variant-a,#gd-root .gd-strip-a",
            { opacity: 0 },
            58 / 30,
          )
            .set(
              "#gd-root > .gd-fill > .gd-variant-b,#gd-root .gd-strip-b",
              { opacity: 1 },
              58 / 30,
            )
            .set(
              "#gd-root .gd-tears,#gd-root .gd-ghost",
              { opacity: 0 },
              62 / 30,
            );
          window.__timelines["shot-glitch-displace"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
