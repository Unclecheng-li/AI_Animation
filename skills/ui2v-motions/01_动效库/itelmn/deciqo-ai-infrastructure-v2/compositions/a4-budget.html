      </style>

          <div data-hf-id="hf-et5x" id="a4-clip" style="position:absolute;left:0;top:280px;width:960px;height:720px;overflow:hidden"><div data-hf-id="hf-8vig" id="a4-rows"></div></div>

          <div data-hf-id="hf-hffg" class="a4-h disp">Triage</div>

        </div>
        <div data-hf-id="hf-vb9r" class="a4-half" id="a4-R">
          <div data-hf-id="hf-3hc4" class="a4-h disp" style="color:var(--ai2)">Budget first</div>
          <div data-hf-id="hf-3fkd" class="a4-s">the worst case is reserved before the call leaves</div>
          <div data-hf-id="hf-tlum" id="a4-illus">ILLUSTRATIVE CALL</div>
          <div data-hf-id="hf-4in2" id="a4-meter"><div data-hf-id="hf-jj4w" id="a4-fill"></div><div data-hf-id="hf-uu2z" id="a4-res"></div></div>
          <div data-hf-id="hf-kvce" id="a4-mlbl"><span data-hf-id="hf-6ooc">DECIQO_AI_BUDGET_USD</span><span data-hf-id="hf-l2rd" id="a4-left">$5.000 left</span></div>
          <div data-hf-id="hf-qvee" class="a4-f" style="top:460px" id="a4-f1"></div>
          <div data-hf-id="hf-cl6o" class="a4-f" style="top:506px" id="a4-f2"></div>
          <div data-hf-id="hf-y1fe" class="a4-f" style="top:552px" id="a4-f3"></div>
          <div data-hf-id="hf-i8qv" class="a4-f" style="top:620px;color:var(--ai2);font-weight:700" id="a4-f4"></div>
          <div data-hf-id="hf-2ktu" id="a4-rcpt">
            <div data-hf-id="hf-uwov" class="a4-rl" id="a4-r1"><span data-hf-id="hf-eltr">ledger · discovery</span><span data-hf-id="hf-k8c1">reserved</span><span data-hf-id="hf-vguk" style="color:var(--ai2)">$0.025</span></div>
            <div data-hf-id="hf-k178" class="a4-rl" id="a4-r2"><span data-hf-id="hf-82yn">ledger · discovery</span><span data-hf-id="hf-z7xh">ok · real usage</span><span data-hf-id="hf-h3c2" style="color:var(--ok)">$0.007</span></div>
            <div data-hf-id="hf-cukf" class="a4-rl" id="a4-r3" style="color:var(--bad)"><span data-hf-id="hf-8fsh">over budget?</span><span data-hf-id="hf-ivs0">no call →</span><span data-hf-id="hf-oebm">rule mode</span></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const R = [
            ["mantap barang bagus", 0], ["Laptop 14 inci saya tidak muat.", 1], ["packing rapi", 0], ["tidak jelas apa ukuran nya", 1],
            ["recommend", 0], ["Tas kekecilan untuk laptop saya", 1], ["suara lumayan", 0], ["bahan nya tipis", 1],
            ["standar sesuai harga", 0], ["paket datang kardus penyok & robek", 1], ["mantap barang bagus", 0], ["dikirimnya lama", 1],
            ["Bahannya bagus tetapi laptop tidak muat.", 1], ["belum dibuka", 0], ["sedikit kebesaran", 1], ["recommend", 0],
          ];
          const rows = document.getElementById("a4-rows");
          rows.innerHTML = R.map(([t, c], i) => `<div class="a4-row" id="a4-q${i}"><span class="t">${c ? "" : ""}${t}</span><span class="g" style="${c ? "background:#ecebe6;color:#0b0b0c" : "border:2px solid rgba(236,235,230,0.24);color:#8a8a86"}">${c ? "CANDIDATE" : "SKIP"}</span></div>`).join("");
          const tl = gsap.timeline({ paused: true });
          const ROW = 64, LASER = 640 - 280;
          gsap.set("#a4-rows", { y: 720 });
          gsap.set("#a4-R", { xPercent: 100 });
          gsap.set(["#a4-r1", "#a4-r2", "#a4-r3"], { opacity: 0 });
          gsap.set("#a4-res", { scaleX: 0 });
          // rows scroll up through the laser; each changes state as it crosses
                    tl.to("#a4-rows", { y: LASER - R.length * ROW - 40, duration: 7.2, ease: "none" }, 0);
          const speed = (720 - (LASER - R.length * ROW - 40)) / 7.2;
          R.forEach(([t, c], i) => {
            const cross = (720 + i * ROW + ROW / 2 - LASER) / speed;
            tl.to(`#a4-q${i}`, { color: c ? "#ecebe6" : "#3a3a38", duration: 0.12 }, cross);
            tl.to(`#a4-q${i} .g`, { opacity: 1, duration: 0.12 }, cross);
            if (c) tl.fromTo(`#a4-q${i}`, { x: 0 }, { x: 16, duration: 0.2, ease: "power2.out" }, cross);
          });
          tl.fromTo("#a4-laser", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.1);
          // right half slides in
          tl.to("#a4-R", { xPercent: 0, duration: 0.7, ease: "expo.out" }, 0.9);
          V2.type(tl, "#a4-f1", "input ≈ characters / 2 tokens", 1.8, 0.5);
          V2.type(tl, "#a4-f2", "× $0.25 per 1M input", 2.3, 0.4);
          V2.type(tl, "#a4-f3", "+ 12,000 max output × $2.00 per 1M", 2.7, 0.6);
          V2.type(tl, "#a4-f4", "reserve ≈ $0.025", 3.4, 0.35);
          tl.to("#a4-res", { scaleX: 0.02, duration: 0.5, ease: "power3.out" }, 3.5);
          tl.to("#a4-r1", { opacity: 1, duration: 0.15 }, 3.9);
          tl.fromTo("#a4-r1", { x: -30 }, { x: 0, duration: 0.3, ease: "power3.out" }, 3.9);
          tl.to("#a4-r2", { opacity: 1, duration: 0.15 }, 5.0);
          tl.fromTo("#a4-r2", { x: -30 }, { x: 0, duration: 0.3, ease: "power3.out" }, 5.0);
          tl.to("#a4-res", { scaleX: 0.006, duration: 0.4 }, 5.0);
          V2.count(tl, "#a4-left", 5, 4.993, 5.0, 0.4, (v) => `$${v.toFixed(3)} left`);
          tl.to("#a4-r3", { opacity: 1, duration: 0.15 }, 6.2);
          tl.fromTo("#a4-r3", { x: -30 }, { x: 0, duration: 0.3, ease: "power3.out" }, 6.2);
          window.__timelines["a4-budget"] = tl;
        })();
      </script>
    </template>
