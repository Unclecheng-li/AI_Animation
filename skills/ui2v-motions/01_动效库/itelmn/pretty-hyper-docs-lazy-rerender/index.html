<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=560" />
    <title>pretty-hyper-docs — lazy re-render decision</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js" integrity="sha384-bRevQK3DiusS1XALpRyWfXNcSVNuNxBOUk12Tk44IsnfepFlBwFe8h/82zWbDxqi" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Menlo"; src: local("Menlo"); }
      html, body { width: 1600px; height: 560px; overflow: hidden; background: #101418; }
      #root { position: relative; width: 1600px; height: 560px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1600" data-height="560">
      <section id="scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <svg id="stage" viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace">
          <rect width="1600" height="560" rx="19" fill="#101418"/>

          <!-- kicker -->
          <text x="120" y="86" font-size="26" letter-spacing="8" fill="#4cc38a">LAZY RE-RENDER</text>
          <text x="120" y="122" font-size="22" fill="#8a97a3">hash comparison decides; unchanged visuals are reused</text>

          <!-- rails -->
          <g fill="none" stroke="#3d4854" stroke-width="2.5" stroke-dasharray="7 7">
            <path id="rail-1" class="rail" d="M 380 205 C 460 205 480 305 543 305"/>
            <path id="rail-2" class="rail" d="M 380 305 H 543"/>
            <path id="rail-3" class="rail" d="M 380 405 C 460 405 480 305 543 305"/>
            <path id="rail-r" class="rail" d="M 737 305 C 840 305 860 195 978 195"/>
            <path id="rail-x" class="rail" d="M 737 305 C 840 305 860 415 978 415"/>
            <path id="rail-w" class="rail" d="M 1302 415 H 1358"/>
          </g>

          <!-- hash chips -->
          <g id="chip-facts">
            <rect x="120" y="170" width="260" height="70" rx="10" fill="#1a2027" stroke="#2c353f" stroke-width="2.5"/>
            <text x="144" y="200" font-size="22" fill="#dbe4ec">facts_hash</text>
            <text x="144" y="228" font-size="18" fill="#8a97a3">what it asserts</text>
            <text x="352" y="213" font-size="26" fill="#4cc38a" text-anchor="middle">=</text>
          </g>
          <g id="chip-src">
            <rect id="src-box" x="120" y="270" width="260" height="70" rx="10" fill="#1a2027" stroke="#2c353f" stroke-width="2.5"/>
            <text x="144" y="300" font-size="22" fill="#dbe4ec">src_hash</text>
            <text x="144" y="328" font-size="18" fill="#8a97a3">its composition</text>
            <text id="src-eq" x="352" y="313" font-size="26" fill="#4cc38a" text-anchor="middle">=</text>
            <text id="src-neq" x="352" y="313" font-size="26" fill="#d9a856" text-anchor="middle" opacity="0">≠</text>
          </g>
          <g id="chip-design">
            <rect x="120" y="370" width="260" height="70" rx="10" fill="#1a2027" stroke="#2c353f" stroke-width="2.5"/>
            <text x="144" y="400" font-size="22" fill="#dbe4ec">design_hash</text>
            <text x="144" y="428" font-size="18" fill="#8a97a3">the design system</text>
            <text x="352" y="413" font-size="26" fill="#4cc38a" text-anchor="middle">=</text>
          </g>

          <!-- decision diamond -->
          <g>
            <polygon id="dmd-glow-ok" points="640,200 745,305 640,410 535,305" fill="none" stroke="#4cc38a" stroke-width="7" opacity="0"/>
            <polygon id="dmd-glow-warn" points="640,200 745,305 640,410 535,305" fill="none" stroke="#d9a856" stroke-width="7" opacity="0"/>
            <polygon points="640,200 745,305 640,410 535,305" fill="#1a2027" stroke="#8a97a3" stroke-width="2.5"/>
            <text x="640" y="298" font-size="22" fill="#dbe4ec" text-anchor="middle">hashes</text>
            <text x="640" y="328" font-size="22" fill="#dbe4ec" text-anchor="middle">match?</text>
          </g>

          <!-- outcomes -->
          <g id="card-reuse">
            <rect x="980" y="150" width="320" height="90" rx="12" fill="#1a2027" stroke="#4cc38a" stroke-width="2.5"/>
            <text x="1010" y="188" font-size="26" font-weight="700" fill="#4cc38a">REUSE</text>
            <text x="1010" y="220" font-size="20" fill="#8a97a3">0 renders — embed as-is</text>
          </g>
          <g id="card-rerender">
            <rect x="980" y="370" width="320" height="90" rx="12" fill="#1a2027" stroke="#d9a856" stroke-width="2.5"/>
            <text x="1010" y="408" font-size="26" font-weight="700" fill="#d9a856">RE-RENDER</text>
            <text x="1010" y="440" font-size="20" fill="#8a97a3">gate loop → new webp</text>
          </g>
          <g id="chip-webp">
            <rect id="webp-box" x="1366" y="380" width="114" height="70" rx="10" fill="#1a2027" stroke="#2c353f" stroke-width="2.5"/>
            <text x="1423" y="422" font-size="22" fill="#dbe4ec" text-anchor="middle">.webp</text>
          </g>

          <!-- traveling pulses (invisible at rest) -->
          <circle id="p-1" r="7" fill="#4cc38a" opacity="0"/>
          <circle id="p-2" r="7" fill="#4cc38a" opacity="0"/>
          <circle id="p-3" r="7" fill="#4cc38a" opacity="0"/>
          <circle id="p-r" r="7" fill="#4cc38a" opacity="0"/>
          <circle id="p-x" r="7" fill="#d9a856" opacity="0"/>

          <!-- caption -->
          <text x="120" y="512" font-size="20" fill="#8a97a3">a prose-only edit changes no hash → zero renders</text>
        </svg>
      </section>
    </div>

    <script>
      gsap.registerPlugin(MotionPathPlugin);
      window.__timelines = window.__timelines || {};
      const D = 12;
      const tl = gsap.timeline({ paused: true });
      const mp = (path, s = 0, e = 1) => ({ path, start: s, end: e });

      // rails flow — 6 whole dash periods (7+7=14 → 84) over D, linear → seamless
      tl.fromTo(".rail", { strokeDashoffset: 0 }, { strokeDashoffset: -84, duration: D, ease: "none" }, 0);

      // helper: a pulse that fades in at a path start, travels it, fades out
      const pulse = (dot, rail, t, dur) => {
        tl.set(dot, { motionPath: mp(rail, 0.0001, 0.0001) }, t);
        tl.to(dot, { opacity: 1, duration: 0.25 }, t);
        tl.to(dot, { motionPath: mp(rail), duration: dur, ease: "power1.inOut" }, t);
        tl.to(dot, { opacity: 0, duration: 0.25 }, t + dur - 0.25);
      };

      // ---- half A (0–6s): everything matches → REUSE ----
      pulse("#p-1", "#rail-1", 0.4, 1.2);
      pulse("#p-2", "#rail-2", 0.4, 1.2);
      pulse("#p-3", "#rail-3", 0.4, 1.2);
      tl.to("#dmd-glow-ok", { opacity: 0.55, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 }, 1.7);
      pulse("#p-r", "#rail-r", 2.4, 1.0);
      tl.fromTo("#card-reuse", { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.035, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 3.4);

      // ---- half B (6–12s): src_hash changed → RE-RENDER, then hashes agree again ----
      tl.to("#src-eq", { opacity: 0, duration: 0.3 }, 6.2);
      tl.to("#src-neq", { opacity: 1, duration: 0.3 }, 6.2);
      tl.to("#src-box", { attr: { stroke: "#d9a856" }, duration: 0.3 }, 6.2);
      pulse("#p-1", "#rail-1", 6.9, 1.2);
      pulse("#p-x", "#rail-2", 6.9, 1.2);
      pulse("#p-3", "#rail-3", 6.9, 1.2);
      tl.to("#dmd-glow-warn", { opacity: 0.55, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 }, 8.2);
      pulse("#p-x", "#rail-x", 8.9, 1.0);
      tl.fromTo("#card-rerender", { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.035, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 9.9);
      // the new render lands: webp chip flashes green
      tl.to("#webp-box", { attr: { stroke: "#4cc38a" }, duration: 0.3 }, 10.4);
      tl.fromTo("#chip-webp", { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.05, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 10.4);
      // stored hash updates with the render → state returns to "matches" (= t=0 state)
      tl.to("#src-neq", { opacity: 0, duration: 0.35 }, 11.2);
      tl.to("#src-eq", { opacity: 1, duration: 0.35 }, 11.2);
      tl.to("#src-box", { attr: { stroke: "#2c353f" }, duration: 0.35 }, 11.2);
      tl.to("#webp-box", { attr: { stroke: "#2c353f" }, duration: 0.35 }, 11.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
