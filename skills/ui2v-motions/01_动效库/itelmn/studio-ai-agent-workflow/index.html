<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AI Agent Workflow</title><script src="assets/gsap.min.js"></script><style>@font-face{font-family:'Montserrat';src:url('assets/montserrat-100-900.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}@font-face{font-family:'IBM Plex Mono';src:url('assets/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:block}@font-face{font-family:'IBM Plex Mono';src:url('assets/ibm-plex-mono-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:block}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{font-family:Montserrat,sans-serif;color:#f2f8f5;background:#101c1b}#root{position:relative;width:1920px;height:1080px;overflow:hidden;--accent:#9ce7be;--bg:#101c1b;--fg:#f2f8f5}.clip,.stage{position:absolute;inset:0;width:1920px;height:1080px}.stage{overflow:hidden}.abs,.vector{position:absolute}.mono{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.06em}.eyebrow{position:absolute;left:80px;top:62px;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.16em}.index{position:absolute;right:80px;top:62px;font-family:'IBM Plex Mono',monospace;font-size:22px}.footer{position:absolute;left:80px;bottom:56px;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.06em}.progress{position:absolute;left:80px;bottom:33px;width:1760px;height:2px;background:#f2f8f524}.progress i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:left}.title{font-size:74px;font-weight:700;letter-spacing:-.055em;line-height:1.08}.small{font-size:25px;line-height:1.5}.label{font-size:21px;font-family:'IBM Plex Mono',monospace}.card{position:absolute;border-radius:28px}.metric{font-size:66px;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.vector{inset:0}.muted{opacity:.72}

round"/><path class="beam" d="M805 490 C850 490 850 690 900 690" fill="none" stroke="#b4ffd5" stroke-width="5" stroke-linecap="round"/><path class="route-base" d="M1200 355 C1260 355 1260 490 1305 490" fill="none" stroke="#7ca78d" stroke-width="3" stroke-linecap="round"/><path class="beam" d="M1200 355 C1260 355 1260 490 1305 490" fill="none" stroke="#b4ffd5" stroke-width="5" stroke-linecap="round"/><path class="route-base" d="M1200 690 C1260 690 1260 490 1305 490" fill="none" stroke="#7ca78d" stroke-width="3" stroke-linecap="round"/><path class="beam" d="M1200 690 C1260 690 1260 490 1305 490" fill="none" stroke="#b4ffd5" stroke-width="5" stroke-linecap="round"/></svg><div class="node n0" style="left:120px;top:405px;width:300px;height:170px;"><div class="label">INPUT</div><div class="name">Research brief</div><div class="led"></div></div><div class="node n1" style="left:505px;top:405px;width:300px;height:170px;"><div class="label">PLANNER</div><div class="name">Build a plan</div><div class="led"></div></div><div class="node n2" style="left:900px;top:270px;width:300px;height:170px;"><div class="label">RESEARCH</div><div class="name">Collect sources</div><div class="led"></div></div><div class="node n3" style="left:900px;top:605px;width:300px;height:170px;"><div class="label">ANALYST</div><div class="name">Find the signal</div><div class="led"></div></div><div class="node n4" style="left:1305px;top:405px;width:300px;height:170px;"><div class="label">REVIEW</div><div class="name">Verify output</div><div class="led"></div></div><div class="abs label" style="left:125px;top:817px;width:500px;height:40px;">01 INPUT → 02 THINK → 03 DELIVER</div><div class="abs result" style="left:1295px;top:790px;width:530px;height:90px;">✓  Brief ready. Sources verified.</div><div class="eyebrow">AI AGENT WORKFLOW</div><div class="index">02 / 08</div><div class="footer">MOTION STUDIES / FORM IN MOTION</div><div class="progress"><i></i></div></div></div></div><script>
window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
