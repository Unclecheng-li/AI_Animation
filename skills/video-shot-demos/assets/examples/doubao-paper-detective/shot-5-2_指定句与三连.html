<script>
/* ===== [底盘] 播放器引导：虚拟时钟 ===== */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();};
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>

<script>
/* ===== [底盘] SFX 引擎 ===== */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';var f=330+Math.random()*90;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);
    env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);
  }
  function whoosh(durS,vol){
    if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
    bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);
  }
  function swipe(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;
    bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);
    var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);
  }
  function type(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=1400+Math.random()*900;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;
    env(g,t,0.004,0.1*vol,0.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);
  }
  function ding(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime;
    [[660,0.2],[990,0.09]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];
      env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);
    });
  }
  function thud(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);
  }
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

#hudrow{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:14px;color:#e8dcc0;background:rgba(43,38,32,.94);backdrop-filter:blur(4px)}
#hud button{pointer-events:auto;background:transparent;border:1px solid #a8946f;color:#e0d4b8;font-family:inherit;font-size:14px;padding:2px 14px;margin-left:8px;border-radius:3px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.12)}
#replay.done{animation:pulse 1.2s infinite;border-color:#9db4f0;color:#9db4f0}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(157,180,240,.8)}}
</style>
</head>
<body>
<div id="stage">

  <div id="cam">
    <div id="coffee"></div>

    <!-- 干花装饰 -->

      <path d="M40 200 C 90 150, 130 110, 190 60" stroke="#8a9464" stroke-width="4"/>
      <path d="M90 200 C 130 160, 180 130, 250 100" stroke="#9aa06e" stroke-width="3.5"/>
      <path d="M150 205 C 180 175, 220 160, 290 140" stroke="#8a9464" stroke-width="3"/>
      <g fill="#c9a0a8" stroke="none">
        <circle cx="190" cy="58" r="13"/><circle cx="172" cy="70" r="9"/><circle cx="206" cy="72" r="8"/>
        <circle cx="250" cy="98" r="11"/><circle cx="236" cy="112" r="7"/>
        <circle cx="290" cy="138" r="9"/><circle cx="276" cy="150" r="6"/>
      </g>
      <g fill="#b08e96" stroke="none"><circle cx="181" cy="64" r="4"/><circle cx="243" cy="105" r="3.5"/><circle cx="283" cy="144" r="3"/></g>
      <path d="M120 170 q 18 -6 26 8 M150 150 q 16 -10 28 2" stroke="#8a9464" stroke-width="3"/>

    <!-- 回形针 -->

    </svg>

    <!-- 明信片 -->
    <div id="pcardWrap">
      <div id="pcard">
        <!-- ===== 正面 ===== -->
        <div class="face front">
          <div class="innerline"></div>
          <div class="tape t1"></div><div class="tape t2"></div>

          <div id="flow">
            <div class="fstep" id="fs1"><div class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.5h5M10.5 8v5"/></svg></div><div class="flab">拆解</div></div>
            <div class="farr"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h17M15 6l6 6-6 6"/></svg></div>
            <div class="fstep" id="fs2"><div class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9M10 20V4M16 20v-8M22 20H2"/></svg></div><div class="flab">对比</div></div>
            <div class="farr"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h17M15 6l6 6-6 6"/></svg></div>
            <div class="fstep" id="fs3"><div class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M3 21h18"/></svg></div><div class="flab">画图</div></div>
            <div class="farr"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h17M15 6l6 6-6 6"/></svg></div>
            <div class="fstep" id="fs4"><div class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="flab">验证</div></div>
            <div class="farr"><svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h17M15 6l6 6-6 6"/></svg></div>
            <div class="fstep" id="fs5"><div class="ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div><div class="flab">沉淀</div></div>
          </div>

          <div id="stampBox">
            <svg viewBox="0 0 122 152">
              <rect x="3" y="3" width="116" height="146" rx="3" fill="#eef2fd" stroke="#3E63DD" stroke-width="2.5"/>
              <image href="doubaoicon.png" x="27" y="14" width="68" height="68"/>
              <path d="M14 100 Q 40 82 61 96 T 108 92" stroke="#3E63DD" stroke-width="3" fill="none"/>
              <text x="61" y="128" text-anchor="middle" font-family="'Noto Serif SC'" font-weight="700" font-size="16" fill="#3E63DD">豆包</text>
              <text x="61" y="145" text-anchor="middle" font-family="Caveat" font-size="15" fill="#8fa3ec">2026</text>
            </svg>
          </div>
          <div id="postmark">
            <svg viewBox="0 0 150 150">
              <circle cx="75" cy="75" r="66" fill="none" stroke="#8a6d4a" stroke-width="3" opacity=".85"/>
              <circle cx="75" cy="75" r="52" fill="none" stroke="#8a6d4a" stroke-width="1.6" opacity=".7"/>
              <text x="75" y="68" text-anchor="middle" font-family="Ma Shan Zheng" font-size="26" fill="#8a6d4a" opacity=".9">开学季</text>
              <text x="75" y="96" text-anchor="middle" font-family="Caveat" font-size="19" fill="#8a6d4a" opacity=".9">2026.08</text>
            </svg>
          </div>

          <div id="hw"></div>
          <div id="hwline"></div>

          <div id="quote">
            <div class="qtape"></div>
            <div class="qtag">key sentence</div>
            <div class="qtext">搞学术，自己的思考和研究是 AI <span class="hl-red" id="hlR">替代不了</span>的，<br>但用好 AI 能实实在在地<span class="hl-green" id="hlG">提效</span></div>
          </div>
        </div>

        <!-- ===== 背面 ===== -->
        <div class="face back">
          <div class="innerline"></div>
          <div class="bdiv"></div>
          <div id="bquestion"></div>
          <div id="dbLogo"><img src="doubaoicon.png" alt="豆包"><span class="dbcap">AI 科研搭子</span></div>
          <div id="bcta">评论区聊聊 →</div>
          <svg id="barrow" viewBox="0 0 300 150" fill="none" stroke="#8a7a58" stroke-width="4" stroke-linecap="round">
            <path d="M10 20 C 90 90, 180 100, 268 74 M 240 58 l 30 14 -24 22"/>
          </svg>
          <div class="bline" id="bl1"></div><div class="bline" id="bl2"></div><div class="bline" id="bl3"></div>
          <div id="bstampHint"></div>
          <div id="btriLab">~ if it helps ~</div>

          <div id="halo"></div>
          <div id="triple">
            <div class="tbtn" id="t1" style="--mx:172px;--rr:-3deg">
              <div class="ring"><svg viewBox="0 0 24 24"><path d="M7 10v10H4.4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1H7z"/><path d="M7 10l3.6-6.6a1.6 1.6 0 0 1 2.9 1.2L12.6 9h6.5a1.6 1.6 0 0 1 1.6 1.9l-1.3 7.6a2 2 0 0 1-2 1.5H7"/></svg></div>
              <div class="tlab">点赞</div><div class="pop"></div>
            </div>
            <div class="tbtn" id="t2" style="--mx:0px;--rr:2deg">
              <div class="ring"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.2"/><path d="M12 3.6v3M12 17.4v3M3.6 12h3M17.4 12h3"/></svg></div>
              <div class="tlab">投币</div><div class="pop"></div>
            </div>
            <div class="tbtn" id="t3" style="--mx:-172px;--rr:-2deg">
              <div class="ring"><svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6L12 16.4l-5.1 2.8 1.1-5.6-4.2-3.9 5.7-.7z"/></svg></div>
              <div class="tlab">收藏</div><div class="pop"></div>
            </div>
          </div>

          <div id="thanks">感谢三连<small>LIKE · COIN · FAVORITE</small></div>
          <div id="postmark2">
            <svg viewBox="0 0 150 150">
              <circle cx="75" cy="75" r="66" fill="none" stroke="#8a6d4a" stroke-width="3" opacity=".85"/>
              <circle cx="75" cy="75" r="52" fill="none" stroke="#8a6d4a" stroke-width="1.6" opacity=".7"/>
              <text x="75" y="68" text-anchor="middle" font-family="Ma Shan Zheng" font-size="24" fill="#8a6d4a" opacity=".9">已送达</text>
              <text x="75" y="96" text-anchor="middle" font-family="Caveat" font-size="19" fill="#8a6d4a" opacity=".9">2026.08</text>
            </svg>
          </div>
          <div id="sign">我是 <span class="u">Uncle城</span>，我们下期视频再见<span class="wave">~</span></div>
        </div>
      </div>
    </div>

    <!-- 纸飞机 -->
    <svg id="plane" viewBox="0 0 120 90" style="opacity:0">
      <path d="M4 46 L116 8 L78 82 L56 56 Z" fill="#fffdf5" stroke="#c4b491" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M56 56 L116 8" stroke="#c4b491" stroke-width="2.5"/>
      <path d="M56 56 L46 78 L78 82" fill="#efe6d2" stroke="#c4b491" stroke-width="2" stroke-linejoin="round"/>
    </svg>

    <!-- 安安们 -->
    <div id="anan15">
      <div class="say">这句是认真的</div>
      <img src="anan - emotion rename/15_平举素纸_认真以待.png" alt="安安·认真以待">
    </div>
    <div id="anan10">
      <img src="anan - emotion rename/10_闭目含笑_恬静满足.png" alt="安安·恬静满足">
    </div>
  </div><!-- /cam -->

  <div id="dim"></div>
  <div id="lbT"></div><div id="lbB"></div>

  <div class="corner" id="chap">Part3 / 收尾</div>
  <div class="corner" id="src"><img class="cdb" src="doubaoicon.png" alt="豆包">#人类对豆包的开发不足百分之一 #豆包还能干这个</div>
</div>

<div id="hud">
  <div id="track"><div id="bar"></div></div>
  <div id="hudrow"><span>镜头 5-2 · 指定句与三连 · 20s</span><span><span id="tc" style="margin-right:10px">00:00</span><button id="pauseBtn">暂停</button><button id="replay" onclick="location.reload()">重播</button></span></div>
</div>

<script>
/* ===== [底盘] 时间轴引擎 ===== */
const DUR=20000;
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const after=(ms,f)=>on(performance.now()-t0+ms,f);
function fly(el,x1,y1,x2,y2,dur,arc,ease,done){tws.push({t:performance.now()-t0,d:dur,e:ease||eio,done,f:p=>{el.style.left=(x1+(x2-x1)*p)+'px';el.style.top=(y1+(y2-y1)*p-Math.sin(p*Math.PI)*(arc||0))+'px'}})}
function cnt(el,from,to,dur){tws.push({t:performance.now()-t0,d:dur,e:eo,f:p=>{el.textContent=Math.round(from+(to-from)*p).toLocaleString('en-US')}})}
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [底盘] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}

/* ===== 手写逐字 ===== */
function buildChars(el,text,step){
  el.innerHTML='';
  [...text].forEach((c,i)=>{
    const s=document.createElement('span');s.className='ch';
    s.style.transitionDelay=(i*step)+'ms';
    s.textContent=c===' '?'\u00A0':c;el.appendChild(s);
  });
}
buildChars($('#hw'),'我自己要干的，就是最后动脑子判断',85);
const bq=$('#bquestion');
bq.innerHTML='';
[...'你是怎么用豆包|提高科研效率的？'].forEach((c,i)=>{
  if(c==='|'){bq.appendChild(document.createElement('br'));return}
  const s=document.createElement('span');s.className='ch'+(i>=7?' qhl':'');
  s.style.transitionDelay=(i*95)+'ms';s.textContent=c;bq.appendChild(s);
});

/* ────────────────────────────────────────────────
   本镜头 cue（20s）
   ──────────────────────────────────────────────── */
on(300,()=>{camTo(0,0,1,1.8);$('#pcardWrap').classList.add('in')});
on(700,()=>$('#flow').classList.add('show'));
['#fs1','#fs2','#fs3','#fs4','#fs5'].forEach((id,i)=>on(900+i*420,()=>$(id).classList.add('lit')));
on(1500,()=>$('#postmark').classList.add('stamp'));

on(5000,()=>$('#hw').classList.add('write'));
on(6500,()=>$('#hwline').classList.add('go'));

on(7000,()=>{camFocus(960,640,1.12,0.9);$('#quote').classList.add('in')});
on(7500,()=>$('#anan15').classList.add('show'));
on(9000,()=>$('#hlR').classList.add('brush'));
on(12000,()=>$('#hlG').classList.add('brush'));

on(11000,()=>{camTo(0,0,1,0.8);$('#anan15').classList.remove('show')});
on(12000,()=>$('#pcard').classList.add('flipped'));
on(12300,()=>{const p=$('#plane');p.style.opacity='1';fly(p,-260,640,2120,240,2400,150,eio,()=>{p.style.opacity='0'})});
on(16000,()=>$('#bquestion').classList.add('write'));
on(16700,()=>$('#dbLogo').classList.add('stampIn'));   // “豆包”二字手写落定 → logo 贴纸啪地贴上
on(16500,()=>{$('#bcta').classList.add('show');$('#barrow').classList.add('go')});

on(14000,()=>{camFocus(1180,620,1.14,0.8);$('#triple').classList.add('in');$('#btriLab').classList.add('show')});
on(14500,()=>$('#t1').classList.add('lit'));
on(15100,()=>$('#t2').classList.add('lit'));
on(15700,()=>$('#t3').classList.add('lit'));
on(16300,()=>{$('#triple').classList.add('merge');$('#halo').classList.add('go')});
on(17500,()=>$('#thanks').classList.add('show'));

on(19000,()=>{$('#sign').classList.add('show');$('#anan10').classList.add('show')});

on(19500,()=>{camTo(0,0,1,1.7);$('#postmark2').classList.add('stamp')});

/* ===== 音效 ===== */
on(300,()=>__sfx.whoosh(1.4,0.7));
on(900,()=>__sfx.pop(0.55));
on(1320,()=>__sfx.pop(0.55));
on(1740,()=>__sfx.pop(0.55));
on(2160,()=>__sfx.pop(0.55));
on(2580,()=>__sfx.pop(0.55));
on(1500,()=>__sfx.thud(0.55));
on(5000,()=>__sfx.pop(0.5));
for(let i=0;i<14;i++)on(5000+i*85,()=>__sfx.type(0.32));
on(6500,()=>__sfx.swipe(0.55));
on(7000,()=>__sfx.swipe(0.7));
on(7500,()=>__sfx.pop(0.6));
on(9000,()=>__sfx.swipe(0.45));
on(12000,()=>__sfx.swipe(0.45));
on(11000,()=>__sfx.whoosh(0.8,0.6));
on(12000,()=>__sfx.swipe(0.9));
on(12300,()=>__sfx.whoosh(1.8,0.55));
on(16500,()=>__sfx.pop(0.55));
on(14000,()=>__sfx.pop(0.6));
on(14500,()=>__sfx.ding(0.75));
on(15100,()=>__sfx.ding(0.75));
on(15700,()=>__sfx.ding(0.75));
on(16300,()=>__sfx.pop(0.65));
on(19000,()=>__sfx.pop(0.6));
on(17500,()=>__sfx.ding(0.7));
on(16000,()=>__sfx.pop(0.4));                                                             // 提问手写起笔
for(let i=0;i<10;i++)on(16050+i*160,()=>__sfx.type(0.24));                                // 提问逐字键音
on(16700,()=>__sfx.thud(0.5));                                                            // 豆包贴纸贴上
on(19500,()=>__sfx.whoosh(1.5,0.55));
on(19500,()=>__sfx.thud(0.6));                                                            // 邮戳②盖章（原18900提前600ms已归位）
</script>
</body>
</html>
