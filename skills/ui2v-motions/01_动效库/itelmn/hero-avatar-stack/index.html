<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff7ed; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 30% 40%, #ffedd5 0%, #fff7ed 60%);
      }
      .copy {
        position: absolute; left: 140px; top: 300px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #7c2d12;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #ea580c; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 26px; font-size: 30px; color: #9a3412; max-width: 540px; line-height: 1.45; }
      .panel {
        position: absolute; right: 160px; top: 280px; width: 820px;
        background: #fff; border-radius: 28px; padding: 52px 56px;
        box-shadow: 0 24px 60px rgba(124, 45, 18, 0.12);
        border: 1px solid #fed7aa;
      }
      .panel h3 {
        font-family: "Segoe UI", sans-serif; font-size: 28px; color: #9a3412;
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 36px;
      }
      .stack { display: flex; align-items: center; }
      .av {
        width: 120px; height: 120px; border-radius: 50%; border: 5px solid #fff;
        display: grid; place-items: center; font-family: "Segoe UI", sans-serif;
        font-size: 36px; font-weight: 800; color: #fff; margin-left: -28px;
        box-shadow: 0 10px 24px rgba(124, 45, 18, 0.18);
      }
      .av:first-child { margin-left: 0; }
      .a1 { background: #ea580c; }
      .a2 { background: #c2410c; }
      .a3 { background: #9a3412; }
      .a4 { background: #7c2d12; }
      .a5 { background: #fff7ed; color: #9a3412; border-color: #fdba74; font-size: 32px; }
      .meta {
        margin-top: 40px; font-family: "Segoe UI", sans-serif; font-size: 28px; color: #9a3412;
      }
      .meta strong { color: #7c2d12; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Team · Collab</div>
        <div class="title">Avatar Stack</div>
        <div class="sub">Collaborators land in an overlapping face pile.</div>
      </div>
      <div id="panel" class="clip panel" data-start="0" data-duration="4.5" data-track-index="1">
        <h3>Shared workspace</h3>
        <div class="stack">
          <div class="av a1" id="a1">IT</div>
          <div class="av a2" id="a2">MK</div>
          <div class="av a3" id="a3">JL</div>
          <div class="av a4" id="a4">RS</div>
          <div class="av a5" id="a5">+8</div>
        </div>
        <div class="meta" id="meta"><strong>1</strong> editor online</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const meta = document.getElementById("meta");
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#panel", { opacity: 0, y: 24 });
      gsap.set(["#a1", "#a2", "#a3", "#a4", "#a5"], { opacity: 0, scale: 0.7, x: 24 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#panel", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#a1", { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.85)
        .to({}, { duration: 0.01, onStart: () => { meta.innerHTML = "<strong>1</strong> editor online"; } }, 0.85)
        .to("#a2", { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 1.2)
        .to({}, { duration: 0.01, onStart: () => { meta.innerHTML = "<strong>2</strong> editors online"; } }, 1.2)
        .to("#a3", { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 1.55)
        .to({}, { duration: 0.01, onStart: () => { meta.innerHTML = "<strong>3</strong> editors online"; } }, 1.55)
        .to("#a4", { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 1.9)
        .to({}, { duration: 0.01, onStart: () => { meta.innerHTML = "<strong>4</strong> editors online"; } }, 1.9)
        .to("#a5", { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 2.25)
        .to({}, { duration: 0.01, onStart: () => { meta.innerHTML = "<strong>12</strong> people in this workspace"; } }, 2.25)
        .to("#panel", { y: -8, duration: 1.2, ease: "sine.inOut" }, 3.1);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
