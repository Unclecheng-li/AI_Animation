<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #070a10; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: linear-gradient(180deg, #101826 0%, #070a10 55%, #0c1220 100%);
      }
      .horizon {
        position: absolute; left: 0; right: 0; top: 620px; height: 2px;
        background: linear-gradient(90deg, transparent, #67e8f9 20%, #fff 50%, #a78bfa 80%, transparent);
        box-shadow: 0 0 24px rgba(103, 232, 249, 0.55);
      }
      .scan {
        position: absolute; left: -200px; top: 0; width: 180px; height: 1080px;
        background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.18), transparent);
      }
      .grid-line {
        position: absolute; left: 0; right: 0; height: 1px; background: rgba(148, 163, 184, 0.12);
      }
      .copy { position: absolute; left: 140px; top: 280px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(103, 232, 249, 0.85); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="g1" class="clip grid-line" style="top:480px" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="g2" class="clip grid-line" style="top:540px" data-start="0" data-duration="4.5" data-track-index="1"></div>
      <div id="g3" class="clip grid-line" style="top:700px" data-start="0" data-duration="4.5" data-track-index="2"></div>
      <div id="g4" class="clip grid-line" style="top:760px" data-start="0" data-duration="4.5" data-track-index="3"></div>
      <div id="horizon" class="clip horizon" data-start="0" data-duration="4.5" data-track-index="4"></div>
      <div id="scan" class="clip scan" data-start="0" data-duration="4.5" data-track-index="5"></div>
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="6">
        <div class="eyebrow">UI2V · Sweep</div>
        <div class="title">Horizon Scan</div>
        <div class="sub">A clean scanline across infinite ground</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#g1","#g2","#g3","#g4"], { scaleX: 0, transformOrigin: "50% 50%", opacity: 0 });
      gsap.set("#horizon", { scaleX: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#scan", { x: 0, opacity: 0 });
      gsap.set("#copy", { opacity: 0, y: 28 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 24 });
      gsap.set(".sub", { opacity: 0, y: 16 });
      tl.to(["#g1","#g2","#g3","#g4"], { opacity: 1, scaleX: 1, duration: 0.8, stagger: 0.08, ease: "power2.out" }, 0.1)
        .to("#horizon", { opacity: 1, scaleX: 1, duration: 0.9, ease: "power3.out" }, 0.35)
        .to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.45)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.45)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.6)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.85)
        .to("#scan", { opacity: 1, duration: 0.2 }, 1.1)
        .to("#scan", { x: 2100, duration: 2.6, ease: "power1.inOut" }, 1.15);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
