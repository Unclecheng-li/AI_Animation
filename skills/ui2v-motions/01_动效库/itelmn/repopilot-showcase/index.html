<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1117;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1117;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div data-hf-id="hf-fnlw" id="el-s1" data-composition-id="s1-lost" data-composition-src="compositions/s1-lost.html" data-start="0" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-2tvq" id="el-s2" data-composition-id="s2-who" data-composition-src="compositions/s2-who.html" data-start="6" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-a41j" id="el-s3" data-composition-id="s3-graph" data-composition-src="compositions/s3-graph.html" data-start="13" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-p0mw" id="el-s4" data-composition-id="s4-lenses" data-composition-src="compositions/s4-lenses.html" data-start="20" data-duration="10" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-aien" id="el-s5" data-composition-id="s5-shape" data-composition-src="compositions/s5-shape.html" data-start="30" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-9c0h" id="el-s6" data-composition-id="s6-receipts" data-composition-src="compositions/s6-receipts.html" data-start="38" data-duration="9" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-l99n" id="el-s7" data-composition-id="s7-flagged" data-composition-src="compositions/s7-flagged.html" data-start="47" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-xbvk" id="el-s8" data-composition-id="s8-lockup" data-composition-src="compositions/s8-lockup.html" data-start="53" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Narration on its own track, well above the visual track, so playback survives
           every scene cut. Each line is placed against its measured duration, not an
           estimate. The two silences stay silent: the scroll's hard stop at 4.6s sits
           before line 1, and the stalled thread at 48.34-48.76s sits before line 7. -->
      <audio data-hf-id="hf-3vs7" id="vo-1" src="assets/vo/line-1.wav" data-start="4.3" data-duration="2.94" data-track-index="10"></audio>
      <audio data-hf-id="hf-6txn" id="vo-2" src="assets/vo/line-2.wav" data-start="7.4" data-duration="4.3" data-track-index="10"></audio>
      <audio data-hf-id="hf-bf0n" id="vo-3" src="assets/vo/line-3.wav" data-start="14.7" data-duration="4.93" data-track-index="10"></audio>
      <audio data-hf-id="hf-n1jz" id="vo-4" src="assets/vo/line-4.wav" data-start="21.2" data-duration="6.05" data-track-index="10"></audio>
      <audio data-hf-id="hf-t7yo" id="vo-5" src="assets/vo/line-5.wav" data-start="31.8" data-duration="5.4" data-track-index="10"></audio>
      <audio data-hf-id="hf-w73o" id="vo-6" src="assets/vo/line-6.wav" data-start="38.6" data-duration="7.12" data-track-index="10"></audio>
      <audio data-hf-id="hf-12yv" id="vo-7" src="assets/vo/line-7.wav" data-start="49.2" data-duration="4.25" data-track-index="10"></audio>
      <audio data-hf-id="hf-jixk" id="vo-8" src="assets/vo/line-8.wav" data-start="54.2" data-duration="4.46" data-track-index="10"></audio>

      <!-- Music bed on its own track, ~13 dB under the voice. The two ducks are BAKED
           INTO THE ASSET (assets/bgm/track-ducked.mp3, built from track.mp3 with an
           ffmpeg volume envelope) rather than tweened here: timeline volume keyframes
           applied the outro fade but measurably did NOT apply the two mid-timeline dips,
           so the bed sat flat through both silences. Baked, they are -14 dB at the
           scroll's hard stop and -18 dB at the stalled thread. Re-bake if timings move;
           the envelope expression is recorded in frame.md. -->
      <audio data-hf-id="hf-prk0" id="bgm" src="assets/bgm/track-ducked.mp3" data-start="0" data-duration="60" data-track-index="11" data-volume="0.18"></audio>

      <!-- SFX marks. Every cue is tied to a beat; no decorative whooshes on the cuts,
           which are hard cuts by design. The riser is the opening hook: its energy lives
           in the source's FIRST 5.2s (measured — it peaks near full scale around 5s and is
           silent after), so it plays from 0 and is still climbing when the picture freezes. -->
      <audio data-hf-id="hf-e5ix" id="sfx-riser" src="assets/sfx/riser.mp3" data-start="0" data-duration="4.6" data-media-start="0" data-track-index="12" data-volume="0.35"></audio>
      <audio data-hf-id="hf-vdh2" id="sfx-stop" src="assets/sfx/impact-bass-1.mp3" data-start="4.62" data-duration="2.1" data-track-index="12" data-volume="0.3"></audio>
      <audio data-hf-id="hf-gjo4" id="sfx-type-1" src="assets/sfx/typing.mp3" data-start="7.95" data-duration="1.5" data-track-index="12" data-volume="0.16"></audio>
      <audio data-hf-id="hf-nrt2" id="sfx-type-2" src="assets/sfx/typing.mp3" data-start="9.5" data-duration="1.5" data-track-index="12" data-volume="0.16"></audio>
      <audio data-hf-id="hf-lyto" id="sfx-lens-1" src="assets/sfx/click-soft.mp3" data-start="21.75" data-duration="0.36" data-track-index="12" data-volume="0.22"></audio>
      <audio data-hf-id="hf-e5ch" id="sfx-lens-2" src="assets/sfx/click-soft.mp3" data-start="24.65" data-duration="0.36" data-track-index="12" data-volume="0.22"></audio>
      <audio data-hf-id="hf-q6ru" id="sfx-lens-3" src="assets/sfx/click-soft.mp3" data-start="27.55" data-duration="0.36" data-track-index="12" data-volume="0.22"></audio>
      <audio data-hf-id="hf-5a1t" id="sfx-src-1" src="assets/sfx/ping.mp3" data-start="39.35" data-duration="1.32" data-track-index="12" data-volume="0.16"></audio>
      <audio data-hf-id="hf-hscz" id="sfx-src-2" src="assets/sfx/ping.mp3" data-start="41" data-duration="1.32" data-track-index="12" data-volume="0.16"></audio>
      <audio data-hf-id="hf-ptfh" id="sfx-src-3" src="assets/sfx/ping.mp3" data-start="42.8" data-duration="1.32" data-track-index="12" data-volume="0.16"></audio>
      <audio data-hf-id="hf-ksqj" id="sfx-stamp" src="assets/sfx/impact-bass-2.mp3" data-start="49.32" data-duration="2.59" data-track-index="12" data-volume="0.28"></audio>
    </div>

    <script>
      // Root timeline is intentionally empty: every scene animates inside its own
      // sub-composition, and the music bed's ducking is baked into its asset.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
