<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070c; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #05070c;
      }
      .col {
        position: absolute; top: -120px; width: 18px; display: flex; flex-direction: column; gap: 10px;
      }
      .px {
        width: 18px; height: 18px; border-radius: 3px;
        background: #22d3ee;
      }
      .copy { position: absolute; left: 140px; top: 340px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; z-index: 2; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(34, 211, 238, 0.9); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="c0" class="clip col" style="left:980px" data-start="0" data-duration="4.5" data-track-index="0"><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div></div>
      <div id="c1" class="clip col" style="left:1040px" data-start="0" data-duration="4.5" data-track-index="1"><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div></div>
      <div id="c2" class="clip col" style="left:1100px" data-start="0" data-duration="4.5" data-track-index="2"><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div><div class="px" style="background:#a78bfa"></div></div>
      <div id="c3" class="clip col" style="left:1160px" data-start="0" data-duration="4.5" data-track-index="3"><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div><div class="px" style="background:#f472b6"></div></div>
      <div id="c4" class="clip col" style="left:1220px" data-start="0" data-duration="4.5" data-track-index="4"><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div></div>
      <div id="c5" class="clip col" style="left:1280px" data-start="0" data-duration="4.5" data-track-index="5"><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div><div class="px" style="background:#818cf8"></div></div>
      <div id="c6" class="clip col" style="left:1340px" data-start="0" data-duration="4.5" data-track-index="6"><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div><div class="px" style="background:#38bdf8"></div></div>
      <div id="c7" class="clip col" style="left:1400px" data-start="0" data-duration="4.5" data-track-index="7"><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div><div class="px" style="background:#c084fc"></div></div>
      <div id="c8" class="clip col" style="left:1460px" data-start="0" data-duration="4.5" data-track-index="8"><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div></div>
      <div id="c9" class="clip col" style="left:1520px" data-start="0" data-duration="4.5" data-track-index="9"><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div><div class="px" style="background:#67e8f9"></div></div>
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="10">
        <div class="eyebrow">UI2V · Matrix</div>
        <div class="title">Pixel Rain</div>
        <div class="sub">Falling columns for digital atmosphere</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const cols = ["#c0","#c1","#c2","#c3","#c4","#c5","#c6","#c7","#c8","#c9"];
      gsap.set(cols, { y: -200, opacity: 0 });
      gsap.set("#copy", { opacity: 0, y: 28 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 24 });
      gsap.set(".sub", { opacity: 0, y: 16 });
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.15)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.15)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.3)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.55);
      cols.forEach((id, i) => {
        tl.to(id, { opacity: 0.9, y: 200 + (i % 4) * 80, duration: 1.1, ease: "power2.out" }, 0.4 + i * 0.08);
        tl.to(id, { y: `+=${420 + (i % 3) * 40}`, duration: 2.4, ease: "none" }, 1.5 + i * 0.05);
      });
      window.__timelines.main = tl;
    </script>
  </body>
</html>
