<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Achievements & Challenges"},
  {"id":"leftTitle","type":"string","label":"Left Column Title","default":"Achievements"},
  {"id":"rightTitle","type":"string","label":"Right Column Title","default":"Challenges"},
  {"id":"items","type":"string","label":"Items (JSON)","default":"[{\"left\":\"Exceeded revenue targets by 24% across all business units in FY2025.\",\"right\":\"Supply chain disruptions caused 8-week delays on two major product lines.\"},{\"left\":\"Launched three new products, each reaching profitability within 6 months.\",\"right\":\"Talent retention in engineering fell to 78% — industry average is 85%.\"},{\"left\":\"Achieved Net Promoter Score of 72, up from 58 the previous year.\",\"right\":\"Regulatory changes in EU markets required significant compliance investment.\"}]"},
  {"id":"leftColor","type":"color","label":"Left/Positive Color","default":"#2f765f"},
  {"id":"rightColor","type":"color","label":"Right/Negative Color","default":"#cd5746"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerItem","type":"number","label":"Seconds per Item","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --left: #2f765f; --right: #cd5746; --bg: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body {
      width: 1920px; height: 1080px;
      background-color: var(--bg);
      background-image: var(--base-plate);
      background-size: 1920px 1080px; background-position: 0 0; background-repeat: no-repeat;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      overflow: hidden; position: relative;
    }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .container { display: flex; height: 100%; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 60px; position: relative; }
    .col-title { position: absolute; top: calc(50% - 72px); left: 50%; transform: translateX(-50%); width: 100%; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: 2px; text-align: center; text-transform: uppercase; margin-bottom: 0; opacity: 0; }
    .col.left .col-title { color: var(--left); }
    .col.right .col-title { color: var(--right); }
    .item-panel { font-size: 28px; line-height: 1.5; text-align: center; max-width: 760px; position: absolute; top: 50%; transform: translateY(-50%); padding: 0 40px; opacity: 0; }
    .col.left .item-panel { color: #182026; }
    .col.right .item-panel { color: #182026; }
    .divider { position: absolute; left: 50%; top: 15%; width: 3px; height: 70%; background: #d8d2c8; transform: translateX(-50%); opacity: 0; }
    .main-title { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 42px; font-weight: 700; color: #182026; white-space: nowrap; opacity: 0; }
    .progress { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; opacity: 0; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #d8d2c8; }
    .dot.active { background: #5a6e78; }
  </style>
</head>
<body>
  <div data-composition-id="achievements-challenges" data-width="1920" data-height="1080" data-duration="12" data-start="0">
    <div id="el-fade"></div>
    <div class="main-title" id="mainTitle"></div>
    <div class="divider"></div>
    <div class="container">
      <div class="col left">
        <div class="col-title" id="leftColTitle"></div>
      </div>
      <div class="col right">
        <div class="col-title" id="rightColTitle"></div>
      </div>
    </div>
    <div class="progress" id="progress"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var items = JSON.parse(vars.items || '[]');
      var leftC = vars.leftColor || '#2f765f';
      var rightC = vars.rightColor || '#cd5746';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var dur = Number(vars.durationPerItem) || 4;
      document.documentElement.style.setProperty('--left', leftC);
      document.documentElement.style.setProperty('--right', rightC);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');
      document.getElementById('mainTitle').textContent = vars.title || 'Achievements & Challenges';
      document.getElementById('leftColTitle').textContent = vars.leftTitle || 'Achievements';
      document.getElementById('rightColTitle').textContent = vars.rightTitle || 'Challenges';

      var leftCol = document.querySelector('.col.left');
      var rightCol = document.querySelector('.col.right');
      var leftPanels = [], rightPanels = [];
      items.forEach(function(item, i) {
        var lp = document.createElement('div'); lp.className = 'item-panel'; lp.textContent = item.left;
        leftCol.appendChild(lp); leftPanels.push(lp);
        var rp = document.createElement('div'); rp.className = 'item-panel'; rp.textContent = item.right;
        rightCol.appendChild(rp); rightPanels.push(rp);
        if (i !== 0) { gsap.set(lp, { opacity: 0 }); gsap.set(rp, { opacity: 0 }); }
      });

      var progress = document.getElementById('progress');
      var dots = [];
      items.forEach(function(_, i) {
        var d = document.createElement('div'); d.className = 'dot' + (i === 0 ? ' active' : '');
        progress.appendChild(d); dots.push(d);
      });

      var TOTAL = items.length * dur + 1;
      var tl = gsap.timeline({ paused: true });
      tl.to('#mainTitle', { opacity: 1, y: -10, duration: 0.5 }, 0);
      tl.to('.col-title', { opacity: 1, duration: 0.5, stagger: 0.15 }, 0.2);
      tl.to('.divider', { opacity: 1, duration: 0.6 }, 0.4);
      tl.to(leftPanels[0], { opacity: 1, y: -10, duration: 0.5 }, 0.5);
      tl.to(rightPanels[0], { opacity: 1, y: -10, duration: 0.5 }, 0.6);
      tl.to('#progress', { opacity: 1, duration: 0.4 }, 0.7);

      for (var i = 1; i < items.length; i++) {
        (function(idx) {
          var t = idx * dur;
          var prev = idx - 1;
          tl.to([leftPanels[prev], rightPanels[prev]], { opacity: 0, duration: 0.25 }, t);
          tl.to([leftPanels[idx], rightPanels[idx]], { opacity: 1, y: -10, duration: 0.5 }, t + 0.3);
          tl.to(dots[prev], { backgroundColor: '#d8d2c8', duration: 0.2 }, t);
          tl.to(dots[idx], { backgroundColor: '#5a6e78', duration: 0.2 }, t + 0.1);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="achievements-challenges"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['achievements-challenges'] = tl;
    </script>
  </div>
</body>
</html>
