<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Plotbeat — Bar Race</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./generated/data.js"></script>
    <script src="./runtime/plotbeat-styles.js"></script>
  </head>
  <body style="margin:0;background:#070c0f;overflow:hidden">
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px;overflow:hidden">
      <div id="bar-race" class="clip" data-composition-id="bar-chart-race" data-composition-src="compositions/bar-chart-race.html" data-start="0" data-duration="18" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio id="background-music" src="./assets/audio/upbeat-data-loop.mp3" preload="auto" data-start="0" data-duration="18" data-track-index="2" data-volume="0.56" aria-label="Upbeat electronic background music"></audio>
      <section id="transition-cover" class="clip" data-start="0" data-duration="18" data-track-index="3" data-layout-ignore style="position:absolute;inset:0;pointer-events:none">
        <div id="cover-panel" style="position:absolute;inset:0;background:#070c0f;opacity:1"></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.PlotbeatStyles.apply(window.HF_VIDEO_SPEC.style);
      const duration = Number(document.getElementById("root").dataset.duration);
      const backgroundMusic = document.getElementById("background-music");
      const tl = gsap.timeline({ paused: true });
      tl.to("#cover-panel", { opacity: 0, duration: 0.9, ease: "power3.inOut" }, 0.18);
      tl.to("#cover-panel", { opacity: 1, duration: 0.9, ease: "power3.inOut" }, Math.max(0, duration - 0.9));
      tl.fromTo(backgroundMusic, { volume: 0 }, { volume: 0.56, duration: 0.8, ease: "power2.out" }, 0);
      tl.to(backgroundMusic, { volume: 0, duration: 1.1, ease: "power2.inOut" }, Math.max(0, duration - 1.1));
      tl.seek(0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
