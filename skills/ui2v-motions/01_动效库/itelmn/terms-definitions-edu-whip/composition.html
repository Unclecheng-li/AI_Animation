<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Key Project Management Terms"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"Key Project Management Terminology"},
  {"id":"terms","type":"string","label":"Terms (JSON array)","default":"[{\"icon\":\"📋\",\"label\":\"Scope\",\"definition\":\"The defined boundaries of a project - what work will and will not be included. A clear scope statement prevents scope creep and gives the team a shared understanding of deliverables, constraints, and exclusions.\"},{\"icon\":\"⏱\",\"label\":\"Schedule\",\"definition\":\"A time-ordered plan that sequences tasks, assigns durations, and identifies dependencies. The schedule is the primary tool for tracking progress and communicating timeline commitments to stakeholders.\"},{\"icon\":\"💰\",\"label\":\"Budget\",\"definition\":\"The approved financial baseline for the project, covering labour, materials, and overheads. Effective budget management requires tracking actuals against the baseline and forecasting spend to completion.\"},{\"icon\":\"⚠️\",\"label\":\"Risk\",\"definition\":\"An uncertain event or condition that, if it occurs, has a positive or negative effect on project objectives. Risk management involves identification, assessment, response planning, and ongoing monitoring throughout the project lifecycle.\"}]"},
  {"id":"accentColor","type":"color","label":"Accent Color","default":"#285f9f"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerTerm","type":"number","label":"Seconds per Term","default":5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #285f9f;
      --accent-soft: rgba(40, 95, 159, 0.12);
      --accent-glow: rgba(40, 95, 159, 0.34);
      --bg: #f5f2ea;
      --ink: #17212b;
      --muted: #667681;
      --paper: #fffdfa;
      --warm: #f2b84b;
      --coral: #d96a4f;
      --mint: #4aa980;
      --line: rgba(61, 72, 79, 0.14);
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    #terms-definitions {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--bg);
      background-image: url("v2-base-blue.png");
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
    }

    .edu-grid {
      position: absolute;
      inset: 52px 74px 74px;
      background:
        linear-gradient(90deg, rgba(40,95,159,0.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(40,95,159,0.04) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 58% 54%, #000 0, transparent 74%);
      opacity: 0.75;
      pointer-events: none;
    }

    .chalk-line {
      position: absolute;
      left: 610px;
      top: 190px;
      width: 3px;
      height: 704px;
      background: linear-gradient(180deg, transparent, var(--accent), var(--mint), transparent);
      opacity: 0.28;
      border-radius: 99px;
    }

    .orbital-note {
      position: absolute;
      width: 236px;
      height: 78px;
      border-radius: 18px;
      background: rgba(255,253,250,0.72);
      border: 1px solid rgba(255,255,255,0.82);
      box-shadow: 0 18px 50px rgba(26,35,42,0.08);
      transform: rotate(-8deg);
      opacity: 0.75;
    }

    .orbital-note.one { right: 142px; top: 128px; }
    .orbital-note.two { left: 116px; bottom: 120px; transform: rotate(7deg); }

    .wrap {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 530px 1fr;
      column-gap: 58px;
      padding: 92px 130px 86px 130px;
    }

    .left {
      position: relative;
      padding-top: 56px;
    }

    .kicker {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--coral);
      opacity: 0;
    }

    .title {
      margin-top: 18px;
      width: 420px;
      color: var(--accent);
      font-size: 42px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
      opacity: 0;
    }

    .subtitle {
      margin-top: 18px;
      width: 390px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
      opacity: 0;
    }

    .term-list {
      margin-top: 54px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      opacity: 0;
    }

    .term-row {
      position: relative;
      width: 410px;
      min-height: 82px;
      display: grid;
      grid-template-columns: 74px 1fr;
      align-items: center;
      gap: 18px;
      padding: 10px 18px 10px 10px;
      border-radius: 20px;
      background: rgba(255,253,250,0.58);
      border: 1px solid rgba(255,255,255,0.74);
      box-shadow: 0 14px 36px rgba(29,40,48,0.06);
      transform-origin: left center;
    }

    .term-row::after {
      content: "";
      position: absolute;
      right: -74px;
      top: 50%;
      width: 58px;
      height: 3px;
      border-radius: 99px;
      background: var(--accent);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
    }

    .term-icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(40,95,159,0.11);
      color: var(--accent);
      font-size: 30px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82);
    }

    .term-label {
      color: #53616b;
      font-size: 20px;
      line-height: 1.15;
      font-weight: 800;
    }

    .term-meta {
      margin-top: 6px;
      color: #87939c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .board {
      position: relative;
      margin-top: 166px;
      width: 1090px;
      height: 560px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 92% 12%, rgba(242,184,75,0.14), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(255,253,250,0.92));
      border: 1px solid rgba(255,255,255,0.82);
      box-shadow: 0 34px 92px rgba(28,40,48,0.16), inset 0 1px 0 rgba(255,255,255,0.96);
      overflow: hidden;
      opacity: 0;
      transform-origin: center;
    }

    .board::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 18px;
      background: linear-gradient(180deg, var(--accent), var(--mint), var(--warm));
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .board-top {
      position: absolute;
      left: 82px;
      top: 48px;
      right: 66px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lesson-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      padding: 0 16px;
      border-radius: 99px;
      background: rgba(217,106,79,0.1);
      color: var(--coral);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .lesson-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warm);
      box-shadow: 0 0 16px rgba(242,184,75,0.7);
    }

    .progress {
      width: 250px;
      height: 8px;
      border-radius: 99px;
      background: rgba(102,118,129,0.16);
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--mint), var(--warm));
    }

    .term-panel {
      position: absolute;
      inset: 116px 74px 64px 82px;
      opacity: 0;
      transform: translateX(140px) skewX(-5deg);
      filter: blur(10px);
    }

    .term-word {
      color: var(--accent);
      font-size: 74px;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
    }

    .term-type {
      margin-top: 14px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .divider {
      width: 68px;
      height: 5px;
      margin-top: 28px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--warm));
    }

    .definition {
      margin-top: 30px;
      max-width: 850px;
      color: var(--ink);
      font-size: 27px;
      line-height: 1.56;
      font-weight: 500;
    }

    .ghost-word {
      position: absolute;
      right: 110px;
      bottom: 52px;
      color: var(--warm);
      font-size: 88px;
      font-weight: 900;
      line-height: 1;
      opacity: 0.11;
      pointer-events: none;
      max-width: 420px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .swipe-band {
      position: absolute;
      left: -220px;
      top: 0;
      width: 180px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.68), transparent);
      transform: skewX(-16deg);
      opacity: 0;
      pointer-events: none;
      z-index: 8;
    }

    .edu-chip {
      position: absolute;
      right: 166px;
      top: 870px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #5f6f79;
      font-size: 16px;
      font-weight: 800;
      opacity: 0;
    }

    .edu-chip span {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fffdfa;
      background: var(--mint);
      box-shadow: 0 12px 26px rgba(74,169,128,0.25);
    }

    #el-fade {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>
  <div id="terms-definitions"
       data-composition-id="terms-definitions"
       data-width="1920"
       data-height="1080"
       data-duration="16"
       data-start="0">
    <div class="edu-grid"></div>
    <div class="chalk-line"></div>
    <div class="orbital-note one"></div>
    <div class="orbital-note two"></div>

    <div class="wrap">
      <section class="left">
        <div class="kicker">Glossary Focus</div>
        <div class="title" id="panelTitle"></div>
        <div class="subtitle" id="subtitleEl"></div>
        <div class="term-list" id="termList"></div>
      </section>

      <section class="board" id="defCard">
        <div class="swipe-band" id="swipeBand"></div>
        <div class="board-top">
          <div class="lesson-pill"><span class="lesson-dot"></span> Key concept</div>
          <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div id="panelHost"></div>
      </section>
    </div>

    <div class="edu-chip" id="eduChip"><span>✓</span> Learner-ready definition</div>
    <div id="el-fade"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var terms = JSON.parse(vars.terms || "[]");
      var accentColor = vars.accentColor || "#285f9f";
      var bgColor = vars.bgColor || "#f5f2ea";
      var basePlateImage = vars.basePlateImage || "v2-base-blue.png";
      var durPerTerm = Number(vars.durationPerTerm) || 5;
      var TOTAL = terms.length * durPerTerm + 1;

      function hexToRgb(hex) {
        var clean = String(hex).replace("#", "");
        var value = parseInt(clean.length === 3 ? clean.split("").map(function(c){ return c + c; }).join("") : clean, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
      }

      var rgb = hexToRgb(accentColor);
      var root = document.documentElement;
      root.style.setProperty("--accent", accentColor);
      root.style.setProperty("--accent-soft", "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.12)");
      root.style.setProperty("--accent-glow", "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.34)");
      root.style.setProperty("--bg", bgColor);

      var comp = document.getElementById("terms-definitions");
      comp.style.backgroundImage = 'url("' + basePlateImage + '")';
      comp.style.backgroundColor = bgColor;
      comp.setAttribute("data-duration", TOTAL);

      document.getElementById("panelTitle").textContent = vars.title || "Terms & Definitions";
      document.getElementById("subtitleEl").textContent = vars.subtitle || "";

      var list = document.getElementById("termList");
      var host = document.getElementById("panelHost");
      var rowEls = [];
      var panels = [];
      var count = Math.max(terms.length, 1);

      terms.forEach(function(term, i) {
        var word = term.word || term.label || "";
        var termType = term.type || "Term " + (i + 1);
        var row = document.createElement("div");
        row.className = "term-row";
        row.id = "row" + i;
        row.innerHTML =
          '<div class="term-icon">' + (term.icon || "•") + '</div>' +
          '<div><div class="term-label">' + word + '</div><div class="term-meta">' + termType + '</div></div>';
        list.appendChild(row);
        rowEls.push(row);

        var panel = document.createElement("div");
        panel.className = "term-panel";
        panel.id = "termPanel" + i;
        panel.innerHTML =
          '<div class="term-word">' + word + '</div>' +
          '<div class="term-type">' + termType + '</div>' +
          '<div class="divider"></div>' +
          '<div class="definition">' + (term.definition || "") + '</div>' +
          '<div class="ghost-word">' + word + '</div>';
        host.appendChild(panel);
        panels.push(panel);
      });

      var tl = gsap.timeline({ paused: true });

      gsap.set(panels[0], { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)" });
      gsap.set(rowEls[0], {
        backgroundColor: "rgba(255,253,250,0.95)",
        scale: 1.04,
        boxShadow: "0 20px 50px rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.18)"
      });
      gsap.set(rowEls[0].querySelector(".term-icon"), {
        backgroundColor: accentColor,
        color: "#fffdfa",
        scale: 1.08,
        boxShadow: "0 12px 28px rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.32)"
      });
      gsap.set("#progressFill", { width: count > 1 ? (100 / count) + "%" : "100%" });

      tl.fromTo(".edu-grid", { opacity: 0, y: 30 }, { opacity: 0.75, y: 0, duration: 0.8, ease: "power2.out" }, 0);
      tl.to(".kicker", { opacity: 1, y: -8, duration: 0.42, ease: "power2.out" }, 0.05);
      tl.fromTo(".title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.58, ease: "back.out(1.35)" }, 0.18);
      tl.fromTo(".subtitle", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" }, 0.38);
      tl.fromTo(".term-list", { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: 0.62, ease: "power2.out" }, 0.6);
      tl.fromTo("#defCard", { opacity: 0, x: 80, rotateY: -8, scale: 0.96 }, { opacity: 1, x: 0, rotateY: 0, scale: 1, duration: 0.72, ease: "back.out(1.25)" }, 0.72);
      tl.fromTo("#eduChip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.0);

      for (var i = 1; i < terms.length; i++) {
        (function(idx) {
          var t = idx * durPerTerm;
          var prev = idx - 1;
          var progress = ((idx + 1) / count) * 100;

          tl.to("#swipeBand", { opacity: 1, x: 1460, duration: 0.34, ease: "power3.in" }, t - 0.05);
          tl.set("#swipeBand", { opacity: 0, x: 0 }, t + 0.31);

          tl.to(panels[prev], { opacity: 0, x: -180, skewX: 6, filter: "blur(12px)", duration: 0.28, ease: "power3.in" }, t);
          tl.fromTo(panels[idx],
            { opacity: 0, x: 210, skewX: -7, filter: "blur(14px)" },
            { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
            t + 0.16
          );

          tl.to(rowEls[prev], {
            backgroundColor: "rgba(255,253,250,0.58)",
            scale: 1,
            boxShadow: "0 14px 36px rgba(29,40,48,0.06)",
            duration: 0.25
          }, t);
          tl.to(rowEls[prev].querySelector(".term-icon"), {
            backgroundColor: "rgba(40,95,159,0.11)",
            color: accentColor,
            scale: 1,
            boxShadow: "inset 0 1px 0 rgba(255,255,255,0.82)",
            duration: 0.25
          }, t);
          tl.to(rowEls[prev], { "--afterOpacity": 0, duration: 0.1 }, t);

          tl.to(rowEls[idx], {
            backgroundColor: "rgba(255,253,250,0.96)",
            scale: 1.04,
            boxShadow: "0 20px 50px rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.18)",
            duration: 0.32,
            ease: "back.out(1.9)"
          }, t + 0.12);
          tl.to(rowEls[idx].querySelector(".term-icon"), {
            backgroundColor: accentColor,
            color: "#fffdfa",
            scale: 1.1,
            boxShadow: "0 12px 28px rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.32)",
            duration: 0.3,
            ease: "back.out(2.2)"
          }, t + 0.12);

          tl.to("#defCard", { x: -18, scale: 1.012, duration: 0.14, ease: "power2.out" }, t + 0.04);
          tl.to("#defCard", { x: 0, scale: 1, duration: 0.42, ease: "elastic.out(1,0.48)" }, t + 0.2);
          tl.to("#progressFill", { width: progress + "%", duration: 0.45, ease: "power3.out" }, t + 0.12);
        })(i);
      }

      tl.fromTo("#el-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.in" }, TOTAL - 0.5);
      tl.set("#el-fade", { opacity: 1 }, TOTAL);

      window.__timelines = window.__timelines || {};
      window.__timelines["terms-definitions"] = tl;
    </script>
  </div>
</body>
</html>
