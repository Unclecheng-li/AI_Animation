<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"No-Fail Strategies to Succeed as an E-Learning Freelancer"},
  {"id":"tips","type":"string","label":"Tips (JSON)","default":"[{\"heading\":\"Build Your Portfolio First\",\"body\":\"Before chasing clients, create 3-5 sample courses that showcase your range. Use real tools, demonstrate interactivity, and write compelling learning objectives. A strong portfolio speaks louder than any resume.\"},{\"heading\":\"Price for Value, Not Hours\",\"body\":\"Stop charging by the hour. Price your work based on the value it delivers — improved performance, saved training costs, faster onboarding. Clients pay for outcomes, not time spent.\"},{\"heading\":\"Specialise in a Niche\",\"body\":\"Generalists compete with everyone. Specialists command premium rates. Pick an industry (healthcare, compliance, tech) or a tool (Articulate, Captivate, Camtasia) and become the go-to expert.\"},{\"heading\":\"Manage Client Expectations\",\"body\":\"Scope creep kills profitability. Define deliverables, revision rounds, and timelines in writing before starting. Use a simple statement of work — it protects both you and the client.\"}]"},
  {"id":"accentColor","type":"color","label":"Accent Color","default":"#285f9f"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"durationPerTip","type":"number","label":"Seconds per Tip","default":4,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --accent: #285f9f; --bg: #f5f2ea; --base-plate: url("v2-base-blue.png"); }
    body { width: 1920px; height: 1080px; background-color: var(--bg); background-image: var(--base-plate); background-size: 1920px 1080px; background-position: 0 0; background-repeat: no-repeat; font-family: 'Inter', Arial, Helvetica, sans-serif; overflow: hidden; position: relative; }
    [data-composition-id] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
    [data-composition-id] > * { z-index: 1; }
    #el-fade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 99; pointer-events: none; }
    .sidebar { position: absolute; left: 0; top: 0; width: 80px; height: 100%; background: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; opacity: 0; }
    .s-dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.3); }
    .content { position: absolute; left: 160px; top: 0; right: 0; height: 100%; display: flex; align-items: center; padding: 80px; }
    .card { max-width: 1100px; width: 100%; opacity: 0; }
    .card .divider { width: 60px; height: 4px; background: var(--accent); border-radius: 2px; margin-bottom: 24px; }
    .card-inner { position: relative; }
    .tip-block { position: absolute; inset: 0; opacity: 0; }
    .tip-block:first-child { position: relative; opacity: 1; }
    .t-heading { font-size: 44px; font-weight: 700; color: var(--accent); line-height: 1.2; margin-bottom: 24px; }
    .t-body { font-size: 22px; line-height: 1.7; color: #5a6e78; max-width: 900px; }
  </style>
</head>
<body>
  <div data-composition-id="freelancer-tips" data-width="1920" data-height="1080" data-duration="16" data-start="0">
    <div id="el-fade"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="content">
      <div class="card" id="card">
        <div class="divider"></div>
        <div class="card-inner" id="cardInner"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars = __hyperframes.getVariables();
      var tips = JSON.parse(vars.tips || '[]');
      var accentColor = vars.accentColor || '#285f9f';
      var bgColor = vars.bgColor || '#f5f2ea';
      var basePlateImage = vars.basePlateImage || 'v2-base-blue.png';
      var dur = Number(vars.durationPerTip) || 4;
      document.documentElement.style.setProperty('--accent', accentColor);
      document.documentElement.style.setProperty('--bg', bgColor);
      document.documentElement.style.setProperty('--base-plate', 'url("' + basePlateImage + '")');

      var sidebar = document.getElementById('sidebar');
      var cardInner = document.getElementById('cardInner');
      var dotEls = [], tipPanels = [];

      tips.forEach(function(tip, i) {
        var d = document.createElement('div'); d.className = 's-dot';
        if (i === 0) d.style.background = '#fff';
        sidebar.appendChild(d); dotEls.push(d);

        var panel = document.createElement('div');
        panel.innerHTML = '<div class="t-heading">' + tip.heading + '</div><div class="t-body">' + tip.body + '</div>';
        if (i === 0) { panel.style.position = 'relative'; panel.style.opacity = '1'; }
        else { panel.className = 'tip-block'; }
        cardInner.appendChild(panel); tipPanels.push(panel);
        if (i !== 0) gsap.set(panel, { opacity: 0 });
      });

      var TOTAL = tips.length * dur + 1;
      var tl = gsap.timeline({ paused: true });
      tl.to('#sidebar', { opacity: 1, duration: 0.5 }, 0);
      tl.to('#card', { opacity: 1, x: -30, duration: 0.5, ease: 'power2.out' }, 0.3);
      tl.from('.divider', { width: 0, duration: 0.6, ease: 'power2.out' }, 0.5);

      for (var i = 1; i < tips.length; i++) {
        (function(idx) {
          var t = idx * dur;
          var prev = idx - 1;
          tl.to(tipPanels[prev], { opacity: 0, duration: 0.2 }, t);
          tl.to(tipPanels[idx], { opacity: 1, duration: 0.4, ease: 'power2.out' }, t + 0.25);
          tl.to(dotEls[prev], { backgroundColor: 'rgba(255,255,255,0.3)', width: 14, height: 14, duration: 0.2 }, t);
          tl.to(dotEls[idx], { backgroundColor: '#fff', width: 18, height: 18, duration: 0.2 }, t + 0.1);
        })(i);
      }

      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);
      document.querySelector('[data-composition-id="freelancer-tips"]').setAttribute('data-duration', TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines['freelancer-tips'] = tl;
    </script>
  </div>
</body>
</html>
