<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8fafc; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #f8fafc;
      }
      .copy {
        position: absolute; left: 120px; top: 260px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #0f172a;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #0f766e; margin-bottom: 20px; font-weight: 600;
      }
      .title { font-size: 88px; font-weight: 700; letter-spacing: -0.045em; }
      .sub { margin-top: 24px; font-size: 28px; color: #64748b; max-width: 480px; line-height: 1.45; }
      .invoice {
        position: absolute; right: 120px; top: 120px; width: 900px; height: 840px;
        background: #fff; border-radius: 24px; border: 1px solid #e2e8f0;
        padding: 56px 60px; box-shadow: 0 28px 70px rgba(15, 23, 42, 0.08);
        font-family: "Segoe UI", sans-serif;
      }
      .inv-head {
        display: flex; justify-content: space-between; align-items: start; margin-bottom: 48px;
      }
      .inv-head h3 { font-size: 36px; color: #0f172a; font-weight: 700; }
      .inv-head span { display: block; margin-top: 10px; font-size: 22px; color: #94a3b8; }
      .badge {
        background: #ecfdf5; color: #0f766e; font-size: 20px; font-weight: 700;
        letter-spacing: 0.12em; padding: 12px 18px; border-radius: 999px;
      }
      .row {
        display: flex; justify-content: space-between; padding: 22px 0;
        border-bottom: 1px solid #f1f5f9; font-size: 28px; color: #334155;
      }
      .row em { font-style: normal; color: #0f172a; font-weight: 600; }
      .total {
        margin-top: 36px; display: flex; justify-content: space-between; align-items: end;
        padding-top: 28px; border-top: 2px solid #0f172a;
      }
      .total label { font-size: 24px; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; }
      .total strong { font-size: 64px; letter-spacing: -0.04em; color: #0f172a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Billing · Clear</div>
        <div class="title">Invoice Total</div>
        <div class="sub">Line items settle, then the total locks in.</div>
      </div>
      <div id="invoice" class="clip invoice" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="inv-head">
          <div>
            <h3>Invoice #2048</h3>
            <span>UI2V Studio · Net 15</span>
          </div>
          <div class="badge">PAID</div>
        </div>
        <div class="row" id="r1"><span>Composition license × 20</span><em>$480</em></div>
        <div class="row" id="r2"><span>Priority review</span><em>$90</em></div>
        <div class="row" id="r3"><span>Asset hosting</span><em>$40</em></div>
        <div class="total" id="total">
          <label>Total due</label>
          <strong id="sum">$0</strong>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const sum = document.getElementById("sum");
      const counter = { v: 0 };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#invoice", { opacity: 0, y: 28 });
      gsap.set(["#r1", "#r2", "#r3", "#total"], { opacity: 0, y: 14 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#invoice", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to("#r1", { opacity: 1, y: 0, duration: 0.35 }, 0.9)
        .to("#r2", { opacity: 1, y: 0, duration: 0.35 }, 1.2)
        .to("#r3", { opacity: 1, y: 0, duration: 0.35 }, 1.5)
        .to("#total", { opacity: 1, y: 0, duration: 0.4 }, 1.95)
        .to(counter, {
          v: 610, duration: 1.1, ease: "power2.out",
          onUpdate: () => { sum.textContent = "$" + Math.round(counter.v); }
        }, 2.1)
        .to("#invoice", { y: -8, duration: 1.1, ease: "sine.inOut" }, 3.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
