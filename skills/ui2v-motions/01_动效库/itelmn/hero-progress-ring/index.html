<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 35% 45%, #1e293b 0%, #0f172a 62%);
      }
      .copy {
        position: absolute; left: 140px; top: 300px; color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase;
        color: #38bdf8; margin-bottom: 22px; font-weight: 600;
      }
      .title { font-size: 92px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; }
      .sub { margin-top: 28px; font-size: 30px; color: #94a3b8; max-width: 560px; line-height: 1.45; }
      .ring-wrap {
        position: absolute; right: 220px; top: 190px; width: 700px; height: 700px;
      }
      .ring-card {
        width: 100%; height: 100%; border-radius: 36px; background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.18);
        display: grid; place-items: center;
        box-shadow: 0 30px 80px rgba(2, 6, 23, 0.45);
      }
      .ring { width: 460px; height: 460px; position: relative; }
      .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .track { fill: none; stroke: #334155; stroke-width: 22; }
      .arc {
        fill: none; stroke: #38bdf8; stroke-width: 22; stroke-linecap: round;
        stroke-dasharray: 1131; stroke-dashoffset: 1131;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.45));
      }
      .pct {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-family: "Segoe UI", sans-serif; font-size: 108px; font-weight: 700;
        color: #f8fafc; letter-spacing: -0.04em;
      }
      .pct span { font-size: 42px; color: #94a3b8; margin-left: 4px; font-weight: 600; }
      .hint {
        position: absolute; bottom: 72px; left: 0; right: 0; text-align: center;
        font-family: "Segoe UI", sans-serif; font-size: 24px; color: #64748b; letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Onboarding · Complete</div>
        <div class="title">Progress Ring</div>
        <div class="sub">Circular completion meter for setup, sync, and install flows.</div>
      </div>
      <div id="ringWrap" class="clip ring-wrap" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="ring-card">
          <div class="ring">
            <svg viewBox="0 0 400 400">
              <circle class="track" cx="200" cy="200" r="180" />
              <circle id="arc" class="arc" cx="200" cy="200" r="180" />
            </svg>
            <div class="pct"><span id="num">0</span><span>%</span></div>
          </div>
          <div class="hint">SETUP COMPLETE</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { v: 0 };
      const numEl = document.getElementById("num");
      gsap.set("#copy", { opacity: 0, x: -20 });
      gsap.set("#ringWrap", { opacity: 0, y: 28, scale: 0.96 });
      gsap.set("#arc", { strokeDashoffset: 1131 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.5 }, 0.1)
        .to("#ringWrap", { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" }, 0.25)
        .to("#arc", { strokeDashoffset: 0, duration: 2.4, ease: "power2.inOut" }, 0.85)
        .to(counter, {
          v: 100, duration: 2.4, ease: "power2.inOut",
          onUpdate: () => { numEl.textContent = String(Math.round(counter.v)); }
        }, 0.85)
        .to("#ringWrap", { y: -10, duration: 1.1, ease: "sine.inOut" }, 3.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
