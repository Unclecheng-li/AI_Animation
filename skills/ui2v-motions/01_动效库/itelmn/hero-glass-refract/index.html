<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #09090b; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #09090b; }
      .photo {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        filter: contrast(1.05) saturate(1.1);
      }
      .glass {
        position: absolute; left: 220px; top: 160px; width: 720px; height: 760px;
        border-radius: 36px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.22);
        backdrop-filter: blur(18px);
        box-shadow: 0 30px 80px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        overflow: hidden;
      }
      .shine {
        position: absolute; top: -20%; left: -40%; width: 40%; height: 140%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        transform: skewX(-18deg);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <img id="photo" class="clip photo" data-start="0" data-duration="4.5" data-track-index="0" src="assets/liquid-metal.jpg" alt="" />
      <div id="glass" class="clip glass" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="shine" id="shine"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#photo", { scale: 1.1, opacity: 0 });
      gsap.set("#glass", { opacity: 0, y: 40, rotate: -2 });
      gsap.set("#shine", { x: 0 });
      tl.to("#photo", { opacity: 1, scale: 1.02, duration: 1.0, ease: "power2.out" }, 0.15)
        .to("#glass", { opacity: 1, y: 0, rotate: 0, duration: 0.8, ease: "power3.out" }, 0.7)
        .to("#shine", { x: 900, duration: 1.4, ease: "power2.inOut" }, 1.6)
        .to("#glass", { y: -12, duration: 1.5, ease: "sine.inOut" }, 3.0)
        .to("#photo", { scale: 1, duration: 1.5, ease: "sine.inOut" }, 3.0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
