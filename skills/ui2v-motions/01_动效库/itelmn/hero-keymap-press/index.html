<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fafaf9; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fafaf9; }
      .copy {
        position: absolute; left: 140px; top: 200px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #1c1917;
      }
      .eyebrow {
        font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase;
        color: #78716c; margin-bottom: 18px; font-weight: 600;
      }
      .title { font-size: 84px; font-weight: 700; letter-spacing: -0.04em; }
      .sub { margin-top: 22px; font-size: 28px; color: #57534c; max-width: 520px; }
      .board {
        position: absolute; right: 140px; top: 260px; width: 980px;
        background: #1c1917; border-radius: 28px; padding: 48px;
        box-shadow: 0 28px 70px rgba(28, 25, 23, 0.2);
      }
      .row {
        display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
      }
      .key {
        min-width: 88px; height: 88px; border-radius: 14px;
        background: #292524; color: #e7e5e4; border: 2px solid #44403c;
        display: grid; place-items: center;
        font-family: "Segoe UI", sans-serif; font-size: 28px; font-weight: 700;
        box-shadow: 0 8px 0 #0c0a09;
      }
      .key.wide { min-width: 140px; font-size: 22px; letter-spacing: 0.08em; }
      .key.hit {
        background: #fbbf24; color: #1c1917; border-color: #f59e0b;
        box-shadow: 0 4px 0 #92400e; transform: translateY(4px);
      }
      .chord {
        margin-top: 36px; text-align: center;
        font-family: "Segoe UI", sans-serif; font-size: 28px; color: #a8a29e;
      }
      .chord strong { color: #fbbf24; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Productivity · Shortcut</div>
        <div class="title">Keymap Press</div>
        <div class="sub">A publish chord lights key by key on a dark board.</div>
      </div>
      <div id="board" class="clip board" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="row">
          <div class="key wide" id="k1">Ctrl</div>
          <div class="key wide" id="k2">Shift</div>
          <div class="key" id="k3">P</div>
        </div>
        <div class="chord" id="chord">Press to publish</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const chord = document.getElementById("chord");
      const press = (id, on) => {
        const el = document.getElementById(id);
        if (on) el.classList.add("hit"); else el.classList.remove("hit");
      };
      gsap.set("#copy", { opacity: 0, x: -16 });
      gsap.set("#board", { opacity: 0, y: 24 });
      tl.to("#copy", { opacity: 1, x: 0, duration: 0.45 }, 0.1)
        .to("#board", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3)
        .to({}, { duration: 0.01, onStart: () => press("k1", true) }, 1.1)
        .to({}, { duration: 0.01, onStart: () => { press("k2", true); chord.innerHTML = "<strong>Ctrl</strong> + Shift + P"; } }, 1.45)
        .to({}, { duration: 0.01, onStart: () => { press("k3", true); chord.innerHTML = "<strong>Ctrl + Shift + P</strong> · publish"; } }, 1.85)
        .to("#board", { scale: 1.02, duration: 0.2, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 2.2)
        .to({}, { duration: 0.01, onStart: () => { chord.textContent = "Queued · hero-keymap-press@1.0.0"; chord.style.color = "#fbbf24"; } }, 2.6)
        .to("#board", { y: -8, duration: 1.2, ease: "sine.inOut" }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
