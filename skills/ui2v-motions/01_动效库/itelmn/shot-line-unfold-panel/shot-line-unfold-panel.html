<!doctype html>
<html
  lang="en"
  data-composition-variables='[
  {"id":"accent","type":"color","label":"HUD accent","default":"#f4f4ef"}
]'
>
  <head></head>
  <body>
    <template>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        .lup-fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #1c1c1b;
          font-family: Inter, sans-serif;
          color: #f4f4ef;
        }
        .lup-title {
          position: absolute;
          left: 0;
          right: 0;
          top: 116px;
          text-align: center;
          color: #777873;
          font-size: 52px;
          font-weight: 850;
          letter-spacing: 2px;
        }
        .lup-shell {
          position: absolute;
          left: 580px;
          top: 310px;
          width: 760px;
          height: 460px;
          border: 2px solid var(--accent);
          border-radius: 14px;
          background: #292a28;
          box-shadow: 0 0 42px rgba(255, 255, 245, 0.18);
          overflow: hidden;
          opacity: 0;
        }
        .lup-content {
          position: absolute;
          inset: 0;
          padding: 44px;
          opacity: 0;
        }
        .lup-kicker {
          font-family: ui-monospace, monospace;
          color: #9da099;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 3px;
        }
        .lup-head {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          margin-top: 26px;
        }
        .lup-number {
          font-size: 82px;
          font-weight: 880;
          letter-spacing: -5px;
          line-height: 1;
        }
        .lup-status {
          padding: 9px 15px;
          border: 1px solid #747772;
          border-radius: 99px;
          color: #c9ccc6;
          font-size: 15px;
          letter-spacing: 1px;
        }
        .lup-rule {
          height: 1px;
          margin: 34px 0 26px;
          background: #565854;
        }
        .lup-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }
        .lup-cell {
          height: 90px;
          padding: 18px;
          border: 1px solid #50524e;
          border-radius: 10px;
        }
        .lup-cell b {
          display: block;
          font-size: 16px;
          letter-spacing: 0.5px;
        }
        .lup-cell span {
          display: block;
          margin-top: 11px;
          color: #8f928c;
          font-size: 14px;
        }
        .lup-glow {
          position: absolute;
          inset: 0;
          background: var(--accent);
          box-shadow: 0 0 65px rgba(255, 255, 245, 0.9);
          opacity: 1;
        }
      </style>
      <div
        data-hf-id="hf-lup-root"
        id="lup-root"
        data-composition-id="shot-line-unfold-panel"
        data-start="0"
        data-duration="4"
        data-width="1920"
        data-height="1080"
        style="
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        "
      >
        <div class="lup-fill" style="--accent: #f4f4ef">
          <h1 class="lup-title">LINE UNFOLD PANEL</h1>
          <section data-hf-id="hf-lup-shell" id="lup-shell" class="lup-shell">
            <div id="lup-glow" class="lup-glow"></div>
            <div id="lup-content" class="lup-content">
              <p class="lup-kicker">SYSTEM / SIGNAL 04</p>
              <div class="lup-head">
                <strong class="lup-number">98.4</strong
                ><span class="lup-status">NOMINAL</span>
              </div>
              <div class="lup-rule"></div>
              <div class="lup-grid">
                <div class="lup-cell">
                  <b>RESPONSE</b><span>12 ms · stable</span>
                </div>
                <div class="lup-cell">
                  <b>THROUGHPUT</b><span>4.8 GB/s</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var v = window.__hyperframes.getVariables(),
            root = document.getElementById("lup-root"),
            fill = root.querySelector(".lup-fill"),
            tl = gsap.timeline({ paused: true });
          fill.style.setProperty("--accent", v.accent || "#f4f4ef");
          gsap.set("#lup-shell", { opacity: 0, scaleX: 0.004, scaleY: 0.0065 });
          tl.set("#lup-shell", { opacity: 1 }, 0.4)
            .to(
              "#lup-shell",
              { scaleX: 1, duration: 0.167, ease: "power4.out" },
              0.4,
            )
            .to(
              "#lup-shell",
              { scaleY: 1, duration: 0.3, ease: "power3.out" },
              0.567,
            )
            .set("#lup-glow", { opacity: 0 }, 0.69)
            .to(
              "#lup-content",
              { opacity: 1, duration: 0.267, ease: "power2.out" },
              0.767,
            )
            .to(
              "#lup-content",
              { opacity: 0, duration: 0.2, ease: "none" },
              2.467,
            )
            .to(
              "#lup-shell",
              { scaleY: 0.0065, duration: 0.233, ease: "power3.in" },
              2.6,
            )
            .set("#lup-glow", { opacity: 1 }, 2.82)
            .to(
              "#lup-shell",
              { scaleX: 0.004, duration: 0.2, ease: "power4.in" },
              2.834,
            )
            .to(
              "#lup-shell",
              { opacity: 0, duration: 0.133, ease: "power2.in" },
              3.035,
            );
          window.__timelines["shot-line-unfold-panel"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
