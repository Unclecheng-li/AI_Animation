<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #071018; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(90% 70% at 55% 60%, #0f2433 0%, #071018 70%);
      }
      .wave-wrap {
        position: absolute; left: 120px; top: 520px; width: 1680px; height: 280px;
        display: flex; align-items: flex-end; gap: 14px;
      }
      .bar {
        flex: 1; height: 40%; border-radius: 10px 10px 4px 4px;
        background: linear-gradient(180deg, #67e8f9, #2563eb);
        transform-origin: 50% 100%;
      }
      .copy { position: absolute; left: 140px; top: 220px; color: #f8fafc; font-family: "Segoe UI", sans-serif; letter-spacing: -0.04em; }
      .eyebrow { font-size: 28px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(103, 232, 249, 0.85); margin-bottom: 28px; }
      .title { font-size: 120px; font-weight: 700; line-height: 0.92; }
      .sub { margin-top: 36px; font-size: 34px; color: rgba(226, 232, 240, 0.78); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">UI2V · Audio Visual</div>
        <div class="title">Signal Wave</div>
        <div class="sub">Equalizer bars for product energy</div>
      </div>
      <div id="wave" class="clip wave-wrap" data-start="0" data-duration="4.5" data-track-index="1">
        <div class="bar" id="b0"></div><div class="bar" id="b1"></div><div class="bar" id="b2"></div><div class="bar" id="b3"></div>
        <div class="bar" id="b4"></div><div class="bar" id="b5"></div><div class="bar" id="b6"></div><div class="bar" id="b7"></div>
        <div class="bar" id="b8"></div><div class="bar" id="b9"></div><div class="bar" id="b10"></div><div class="bar" id="b11"></div>
        <div class="bar" id="b12"></div><div class="bar" id="b13"></div><div class="bar" id="b14"></div><div class="bar" id="b15"></div>
        <div class="bar" id="b16"></div><div class="bar" id="b17"></div><div class="bar" id="b18"></div><div class="bar" id="b19"></div>
        <div class="bar" id="b20"></div><div class="bar" id="b21"></div><div class="bar" id="b22"></div><div class="bar" id="b23"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const heights = [0.35,0.55,0.4,0.75,0.5,0.9,0.45,0.8,0.6,0.95,0.55,0.7,0.42,0.88,0.5,0.78,0.36,0.92,0.48,0.66,0.58,0.84,0.4,0.72];
      gsap.set("#copy", { opacity: 0, y: 24 });
      gsap.set(".eyebrow", { opacity: 0, y: 12 });
      gsap.set(".title", { opacity: 0, y: 22 });
      gsap.set(".sub", { opacity: 0, y: 14 });
      gsap.set(".bar", { scaleY: 0.08, opacity: 0.4 });
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.15 }, 0.15)
        .to(".eyebrow", { opacity: 1, y: 0, duration: 0.45 }, 0.15)
        .to(".title", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.3)
        .to(".sub", { opacity: 1, y: 0, duration: 0.55 }, 0.55);
      heights.forEach((h, i) => {
        tl.to(`#b${i}`, { scaleY: h, opacity: 1, duration: 0.55, ease: "power2.out" }, 0.35 + i * 0.03);
        tl.to(`#b${i}`, { scaleY: Math.max(0.2, 1 - h + 0.25), duration: 0.7, ease: "sine.inOut" }, 1.5 + (i % 6) * 0.08);
        tl.to(`#b${i}`, { scaleY: h, duration: 0.8, ease: "sine.inOut" }, 2.4 + (i % 5) * 0.07);
      });
      window.__timelines.main = tl;
    </script>
  </body>
</html>
