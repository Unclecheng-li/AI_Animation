<!-- ============================================================
  ◆ 分镜演示页：镜头 0-3 · 实战预告（21s）◆  [可视化 v4 · 瑞士国际主义]
  主视觉：瑞士海报式大字 + 倒计时刻度（lieflat F2 发丝刻度）+ 目标网站示意
  视觉：纸底 #F0EFEB × 墨 #1C1C1A × 灰阶阶梯 × 唯一强调橙 #F5572F（主角 = flag）
============================================================= -->
<script>
/* ===== [不动] 播放器引导：虚拟时钟黑场启动 ===== */
(function(){
  (function(){
    var realRAF=window.requestAnimationFrame.bind(window);
    var realPerf=performance.now.bind(performance);
    var started=false,startReal=0;
    function clock(){return started?(realPerf()-startReal):0;}
    window.__startPlayback=function(){if(started)return;started=true;startReal=realPerf();};
    performance.now=clock;
    window.requestAnimationFrame=function(cb){return realRAF(function(){cb(clock());});};
  })();
  var css=document.createElement('style');
  css.textContent='#introZ{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1.4s ease}#introZ .btn{pointer-events:auto;cursor:pointer;font-family:"Cascadia Mono","Microsoft YaHei","PingFang SC",sans-serif;font-size:28px;letter-spacing:8px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:16px 52px;transition:background .3s,transform .2s,opacity .4s}#introZ .btn:hover{background:rgba(255,255,255,.18)}#introZ .btn:active{transform:scale(.96)}#introZ .hint{margin-top:20px;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;color:#8a8a8a;letter-spacing:2px;opacity:.7}#hud{transition:opacity .35s ease}body.hud-off #hud{opacity:0!important;pointer-events:none}';
  document.head.appendChild(css);
  function boot(){
    var z=document.createElement('div');z.id='introZ';
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='启 动 播 放';
    var h=document.createElement('div');h.className='hint';h.textContent='点击开始 · 黑场渐变后播放';
    z.appendChild(b);z.appendChild(h);document.body.appendChild(z);
    var playing=false;
    function showHud(){document.body.classList.remove('hud-off');}
    function hideHud(){document.body.classList.add('hud-off');}
    hideHud();
    addEventListener('mousemove',function(e){if(!playing)return;if(innerHeight-e.clientY<=60)showHud();else hideHud();});
    addEventListener('mouseleave',function(){if(playing)hideHud();});
    b.addEventListener('click',function(){
      if(playing)return;playing=true;
      b.style.pointerEvents='none';b.style.opacity='0';h.style.opacity='0';
      setTimeout(function(){z.style.opacity='0';z.style.pointerEvents='none';},600);
      setTimeout(function(){window.__startPlayback();},2000);
    });
    if(location.hash.indexOf('auto')>=0)setTimeout(function(){b.click();},80); /* QA 无头自动起播 */
  }
  if(document.body)boot();else addEventListener('DOMContentLoaded',boot);
})();
</script>
<script>
/* ===== [不动] SFX 引擎：WebAudio 合成 ===== */
window.__sfx=(function(){
  var ctx=null,master=null,noiseBuf=null;
  function ensure(){
    if(ctx)return ctx;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0.24;
      var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;
      master.connect(lp);lp.connect(ctx.destination);
      var len=Math.floor(ctx.sampleRate*1.2);noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ctx=null}
    return ctx;
  }
  addEventListener('pointerdown',function(){var c=ensure();if(c&&c.state==='suspended')c.resume();});
  function ok(){return !!(ctx&&ctx.state==='running'&&master);}
  function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);}
  function pop(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';var f=330+Math.random()*90;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.05,t+0.09);
    env(g,t,0.012,0.5*vol,0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);
  }
  function whoosh(durS,vol){
    if(!ok())return;var d=Math.max(0.25,Math.min(durS||1,1.8));vol=vol||0.9;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
    bp.frequency.setValueAtTime(330,t);bp.frequency.exponentialRampToValueAtTime(1300,t+d*0.55);bp.frequency.exponentialRampToValueAtTime(430,t+d);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.3*vol,t+d*0.4);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+d+0.05);
  }
  function swipe(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,src=ctx.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.3;
    bp.frequency.setValueAtTime(2500,t);bp.frequency.exponentialRampToValueAtTime(720,t+0.22);
    var g=ctx.createGain();env(g,t,0.02,0.26*vol,0.26);
    src.connect(bp);bp.connect(g);g.connect(master);src.start(t);src.stop(t+0.32);
  }
  function type(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square';o.frequency.value=1400+Math.random()*900;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2700;
    env(g,t,0.004,0.1*vol,0.05);
    o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+0.07);
  }
  function ding(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime;
    [[660,0.2],[990,0.09]].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p[0];
      env(g,t,0.01,p[1]*vol,0.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.7);
    });
  }
  function thud(vol){
    if(!ok())return;vol=vol||1;
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(60,t+0.16);
    env(g,t,0.008,0.5*vol,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.28);
  }
  return {pop:pop,whoosh:whoosh,swipe:swipe,type:type,ding:ding,thud:thud};
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Inter','Noto Sans SC',sans-serif}
body.paused *{animation-play-state:paused!important}
:root{--paper:#F0EFEB;--card:#FFFFFF;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6;--accent:#F5572F}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);overflow:hidden;background:var(--paper)}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.6;
  background-image:linear-gradient(90deg,rgba(28,28,26,.05) 1px,transparent 1px);background-size:132px 100%}

/* ===== [不动] 镜头层 ===== */
#cam{position:absolute;inset:0;transform-origin:0 0;transform:scale(1);transition:transform var(--cd,1.4s) cubic-bezier(.16,1,.3,1);z-index:10}

/* 幕结构：硬切 */
.act{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .1s linear}
.act.on{opacity:1;visibility:visible}

/* ───────── ACT0 倒计时（发丝刻度 + 抽象光圈） ───────── */

#cdCrossV{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--grid)}
#cdRing{position:absolute;left:50%;top:50%;width:430px;height:430px;margin:-215px 0 0 -215px;border-radius:50%;
  border:1.5px solid var(--ink);transition:transform .42s cubic-bezier(.6,0,.9,.4),opacity .42s ease}
#cdRing::after{content:'';position:absolute;inset:56px;border-radius:50%;border:1px dashed rgba(28,28,26,.35)}
#cdRing.wipe{transform:scale(9);opacity:0}
#cdNum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:900 200px/1 'Inter';
  color:var(--ink);letter-spacing:-.02em}
#cdNum.tick{animation:numFlick .26s steps(4)}
@keyframes numFlick{0%{opacity:.55;transform:translate(-50%,-50%) scale(1.14)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#actCount.off #cdNum,#actCount.off #cdCrossH,#actCount.off #cdCrossV,#actCount.off #cdScale{opacity:0;transition:opacity .26s}
/* lieflat F2 · 发丝刻度：倒计时基线 + 可数刻度（1 刻度 = 1 拍 · 每 5 拍加重） */

#titleRule{position:absolute;left:50%;top:632px;width:300px;height:2px;margin-left:-150px;background:var(--accent);
  transform:scaleX(0);transition:transform .45s cubic-bezier(.2,.9,.3,1)}

#pwRow{position:absolute;left:0;right:0;top:206px;text-align:center}

#flagName.in{opacity:1;transform:scale(1) rotate(-3deg)}
#flagName .plate{display:inline-block;font:900 90px/1.16 'Inter';color:var(--accent);

#stamp{position:absolute;left:1002px;top:712px;opacity:0;transform:rotate(7deg) scale(2.9);

/* ───────── 黑边（预告片画幅） ───────── */
#lbT,#lbB{position:absolute;left:0;right:0;height:0;background:var(--ink);z-index:40;overflow:hidden;
  transition:height .72s cubic-bezier(.7,0,.3,1)}

.barin{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;
  opacity:0;transition:opacity .45s ease .5s}
#lbT.on .barin,#lbB.on .barin{opacity:1}
.barin .pe{position:absolute;left:0;right:0;text-align:center;font:600 13px 'IBM Plex Mono';
  font-size:13px;letter-spacing:.5em;color:rgba(240,239,235,.5);text-indent:.5em}
.barin .brand{position:absolute;left:56px;font:800 19px 'Inter';letter-spacing:.24em;color:var(--paper)}
.barin .bcap{position:absolute;right:56px;font:500 16px 'Noto Sans SC';letter-spacing:.2em;color:#B0AFA9}

/* ───────── 角注 / HUD ───────── */
.corner{position:absolute;font:500 14px 'IBM Plex Mono','Noto Sans SC';color:var(--muted);
  letter-spacing:.1em;z-index:41}
#chap{left:52px;bottom:106px}
#src{right:52px;bottom:106px}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:60;font-family:'IBM Plex Mono';pointer-events:none}
#track{height:5px;background:rgba(255,255,255,.1)}
#bar{height:100%;width:0;background:var(--accent)}
#hudrow{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;background:rgba(28,28,26,.94);color:#C6C5BF}
#hud button{pointer-events:auto;background:transparent;border:1px solid #555;color:#ccc;font-family:inherit;font-size:12px;padding:3px 14px;margin-left:8px;border-radius:3px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.12)}
#replay.done{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="stage">
  <div id="cam">

    <!-- ACT0 · 倒计时 -->
    <div class="act" id="actCount">
      <div id="cdCrossH"></div><div id="cdCrossV"></div>
      <div id="cdRing"></div>
      <div id="cdNum"></div>
      <!-- lieflat F2 发丝刻度（倒计时刻度，由脚本生成） -->
      <div id="cdScale"><div class="base"></div></div>
    </div>

    <!-- ACT1 · 开场字卡 -->
    <div class="act" id="actTitle">
      <div id="titleEn">VULNCLAW · PREVIEW</div>
      <div id="brushTitle"><span class="ch">实</span><span class="ch">战</span><span class="ch">预</span><span class="ch">告</span></div>
      <div id="titleRule"></div>
    </div>

    <!-- ACT2 · CTF -->
    <div class="act" id="actCTF">
      <div id="ctfKick">— CAPTURE THE FLAG —</div>
      <div id="ctfMain">CTF</div>
      <div id="ctfCN">夺旗赛</div>
      <div id="ctfCap"><span id="ctfCapTx"></span><span class="caret sm"></span></div>
    </div>

    <!-- ACT3 · 目标网站 -->
    <div class="act" id="actSite">
      <div id="sitePanel">
        <div id="spHead"><span id="spLabel">TARGET</span><span id="spTag">目标网站</span></div>
        <div class="wblock" id="wb1"></div>
        <div class="wblock" id="wb2"></div>
        <div class="wline" id="wl1"></div>
        <div class="wline" id="wl2"></div>
        <div class="wline" id="wl3"></div>
      </div>
      <svg id="siteSvg" viewBox="0 0 1920 1080">
        <path id="crackGlow" d="M640,352 L742,468 L688,556 L884,612 L1006,522 L1122,646 L1290,590 L1362,700"
          fill="none" stroke="#C6C5BF" stroke-width="11" opacity=".6" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="2000" stroke-dashoffset="2000"/>
        <path id="crack" d="M640,352 L742,468 L688,556 L884,612 L1006,522 L1122,646 L1290,590 L1362,700"
          fill="none" stroke="#1C1C1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="2000" stroke-dashoffset="2000"/>
        <path id="beamGlow" d="M470,918 L876,600" fill="none" stroke="#C6C5BF" stroke-width="11" opacity=".6"
          stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
        <path id="beam" d="M470,918 L876,600" fill="none" stroke="#1C1C1A" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
        <polygon id="beamHead" points="876,600 863.6,619.9 853.8,607.3" fill="#1C1C1A" opacity="0"/>
        <!-- diagram-design 发丝引线标注：标志 → 目标落点 -->
        <g id="ldV" class="annoLd">
          <path class="hair" d="M1172 508 C1156 566 1136 610 1124 638"/>
          <circle class="hairdot" cx="1122" cy="642" r="2.6"/>
        </g>
        <g id="ldU" class="annoLd">
          <path class="hair" d="M824 682 C826 666 826 654 826 641"/>
          <circle class="hairdot" cx="826" cy="638" r="2.6"/>
        </g>
      </svg>
      <div id="vulnTag">漏洞</div>
      <div id="useLabel">利用漏洞</div>
      <div id="pwRow"><span class="pg">█</span><span class="pg">▓</span><span class="pg">█</span><span class="pg">▒</span><span class="pg">█</span><span class="pg">▓</span><span class="pg">█</span><span class="pg">▒</span><span class="pg">█</span><span class="pg">▓</span></div>
      <div id="flagName"><span class="plate">flag</span></div>
      <div id="stamp"><span class="sp"><span class="st1">找到即通关</span><span class="st2">CLEARED</span></span></div>
    </div>

    <!-- ACT4 · 终幕 -->
    <div class="act" id="actFinal">
      <div id="finKicker"><span id="finKickTx"></span><span class="caret sm"></span></div>
      <div id="aiChip"><span class="box"><span class="u">用</span><b>AI</b></span></div>
      <div id="heroCN"><span class="hc">亲</span><span class="hc">手</span><span class="hc">打</span><span class="hc">穿</span></div>
      <div id="heroSub">这样一道题</div>
      <div id="miniPanel">
        <div class="mh mhL"><div class="mi">
          <div class="mline" style="left:30px;top:44px;width:178px"></div>
          <div class="mline" style="left:30px;top:80px;width:126px"></div>
          <svg class="mcrack" viewBox="0 0 460 240"><path d="M38,26 L148,94 L104,138 L232,172 L318,118 L388,196"/></svg>
        </div></div>
        <div class="mh mhR"><div class="mi">
          <div class="mline" style="left:30px;top:44px;width:178px"></div>
          <div class="mline" style="left:30px;top:80px;width:126px"></div>
          <svg class="mcrack" viewBox="0 0 460 240"><path d="M38,26 L148,94 L104,138 L232,172 L318,118 L388,196"/></svg>
        </div></div>
      </div>
      <svg id="slashSvg" viewBox="0 0 1920 1080">
        <path id="slashP" d="M600,556 L1332,912"/>
      </svg>
      <div id="flagEmblem">
        <svg width="84" height="148" viewBox="0 0 86 150">
          <rect class="fpole" x="18" y="6" width="7" height="138" rx="3.5"/>
          <path class="fcloth" d="M25,12 L82,40 L25,72 Z"/>
        </svg>
        <span class="fl">flag</span>
      </div>
    </div>
  </div>

  <!-- 大肥鱼（提前定场 · 由 actFinal 移出以便 ≤60% 进场） -->
  <div id="fish1" style="z-index:36">
    <div class="say">轮到我<b>上场</b>了！</div>
    <img src="Shark-GIF/006_双手身前微笑乖巧期待.gif" alt="大肥鱼">
  </div>

  <div id="lbT"><div class="barin"><span class="pe">P R E V I E W</span></div></div>
  <div id="lbB"><div class="barin"><span class="brand">VULNCLAW</span><span class="bcap">实战预告</span></div></div>

  <div class="corner" id="chap">00 / 开场 · 实战预告</div>
  <div class="corner" id="src">口播对齐 timeline.md · 预告片风格</div>
</div>

<div id="hud">
  <div id="track"><div id="bar"></div></div>
  <div id="hudrow"><span>镜头 0-3 · 实战预告 · 21s</span><span><span id="tc" style="margin-right:10px">00:00</span><button id="pauseBtn">暂停</button><button id="replay" onclick="location.reload()">重播</button></span></div>
</div>

<script>
/* ===== [不动] 时间轴引擎 ===== */
const DUR=21000;
const $=s=>document.querySelector(s);
let t0=performance.now(),paused=false,pStart=0;
const cues=[],on=(t,f)=>cues.push({t,f,done:false});
const tws=[],eo=p=>1-Math.pow(1-p,3),ei=p=>p*p,eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function tick(now){if(paused)return;const el=now-t0;
  for(const c of cues)if(!c.done&&el>=c.t){c.done=true;c.f()}
  for(let i=tws.length-1;i>=0;i--){const tw=tws[i],p=(el-tw.t)/tw.d;if(p<0)continue;const q=Math.min(1,p);tw.f(tw.e?tw.e(q):q);if(q>=1){tws.splice(i,1);if(tw.done)tw.done()}}
  $('#bar').style.width=Math.min(100,el/DUR*100)+'%';
  const t=el/1000;$('#tc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  if(el<DUR+2500)requestAnimationFrame(tick);else $('#replay').classList.add('done');
}
requestAnimationFrame(tick);
$('#pauseBtn').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);$('#pauseBtn').textContent=paused?'继续':'暂停';if(paused){pStart=performance.now()}else{t0+=performance.now()-pStart;requestAnimationFrame(tick)}};
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== [不动] 镜头调度 ===== */
const cam=$('#cam');
function camTo(tx,ty,s,dur){cam.style.setProperty('--cd',dur+'s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(window.__sfx)__sfx.whoosh(dur,0.65)}
function camFocus(fx,fy,s,dur){let tx=960-fx*s,ty=540-fy*s;
  tx=Math.min(0,Math.max(1920-1920*s,tx));ty=Math.min(0,Math.max(1080-1080*s,ty));camTo(tx,ty,s,dur)}
function camCut(tx,ty,s){cam.style.setProperty('--cd','0.001s');cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}

/* ───────── 本镜头专用小工具 ───────── */
function cutTo(id){['actCount','actTitle','actCTF','actSite','actFinal'].forEach(a=>{
  const el=document.getElementById(a);if(el)el.classList.toggle('on',a===id)});}
function setNum(n){const e=$('#cdNum');e.textContent=n;e.classList.remove('tick');void e.offsetWidth;e.classList.add('tick');__sfx.type(.5);}
function aperture(){$('#cdRing').classList.add('wipe');$('#actCount').classList.add('off');}
function barsOn(){$('#lbT').classList.add('on');$('#lbB').classList.add('on');}
function typeText(id,text,start,step){
  const el=document.getElementById(id);
  for(let i=0;i<text.length;i++)on(start+i*step,()=>{el.textContent=text.slice(0,i+1);__sfx.type(.2);});
}
function scramble(el,charset,dur,start,settle){
  let last=-1;
  tws.push({t:start,d:dur,f:p=>{const k=Math.floor(p*16);if(k!==last){last=k;
    let s='';for(let i=0;i<settle.length;i++)s+=charset[Math.floor(Math.random()*charset.length)];
    el.textContent=s;__sfx.type(.14);}},done:()=>{el.textContent=settle}});
}
function shakePanel(){const el=$('#sitePanel');
  tws.push({t:performance.now()-t0,d:340,f:p=>{const k=1-p;
    el.style.transform=`translate(${Math.sin(p*44)*7*k}px,${Math.cos(p*36)*5*k}px) scale(1)`},
    done:()=>{el.style.transform=''}});}
function sparks(x,y,n,parentId){
  const host=document.getElementById(parentId);
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';
    const a=Math.random()*Math.PI*2,r=60+Math.random()*140;
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(a)*r).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*r).toFixed(1)+'px');
    s.style.animationDuration=(.4+Math.random()*.35)+'s';
    host.appendChild(s);setTimeout(()=>s.remove(),950);}
}
function risePw(){
  const pgs=[...document.querySelectorAll('#pwRow .pg')];
  pgs.forEach((g,i)=>{
    tws.push({t:10100+i*120,d:420,e:eo,f:p=>{
      g.style.opacity=Math.min(1,p*1.7);
      g.style.transform=`translate(${(80*(1-p)).toFixed(1)}px,${(330*(1-p)).toFixed(1)}px)`;
    },done:()=>{g.style.transform='none';}});
    on(10100+i*120,()=>__sfx.type(.24));
  });
}
function scramblePw(){
  const pgs=[...document.querySelectorAll('#pwRow .pg')];
  const CS='█▉▊▋▌░▒▓#%&';
  let last=-1;
  tws.push({t:12000,d:620,f:p=>{const k=Math.floor(p*18);if(k!==last){last=k;
    pgs.forEach(g=>g.textContent=CS[Math.floor(Math.random()*CS.length)]);__sfx.type(.13);}},
    done:()=>{pgs.forEach(g=>g.textContent='█')}});
}
/* lieflat F2 发丝刻度：倒计时刻度生成（1 刻度 = 1 拍 · 每 5 拍加重） */
(function(){
  const box=document.getElementById('cdScale');if(!box)return;
  const W=760;
  for(let i=0;i<=38;i++){
    const t=document.createElement('i');t.className='tk'+(i%5===0?' mj':'');t.style.left=(i*20)+'px';box.appendChild(t);
  }
  [[0,'0'],[19,'2'],[38,'21s']].forEach(([i,txt])=>{const l=document.createElement('span');l.className='lb';l.style.left=(i*20)+'px';l.textContent=txt;box.appendChild(l);});
})();

/* ───────── 镜头 0-3 叙事 cue（21s · 实战预告 · 预告片风格） ───────── */
/* 0:49「先给大家看一眼实战」 */
on(200,()=>{$('#actCount').classList.add('on');__sfx.whoosh(.5,.35);});
on(260,()=>{barsOn();setNum('3');});
on(610,()=>setNum('2'));
on(960,()=>setNum('1'));
on(1150,()=>{aperture();__sfx.whoosh(1.0,.5);});
on(1250,()=>{cutTo('actTitle');$('#brushTitle').classList.add('in');$('#titleEn').classList.add('in');$('#titleRule').classList.add('in');__sfx.pop(.6);});
/* 0:51「安全圈的练手比赛叫做CTF」 */
on(2000,()=>{cutTo('actCTF');__sfx.thud(.45);camFocus(960,520,1.06,.45);});
on(2150,()=>scramble($('#ctfMain'),'ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&',520,2150,'CTF'));
on(2720,()=>{$('#ctfCN').classList.add('in');__sfx.pop(.65);});
/* 0:54「比赛会搭建一个带有漏洞的网站」 */
on(5000,()=>{cutTo('actSite');camCut(0,0,1);__sfx.pop(.6);$('#sitePanel').classList.add('in');});
on(5450,()=>{$('#crack').classList.add('draw');$('#crackGlow').classList.add('draw');$('#vulnTag').classList.add('on');__sfx.swipe(.5);});
on(5650,()=>__sfx.thud(.4));
/* 0:56「参赛选手需要利用网站的漏洞」 */
on(7000,()=>{$('#beam').classList.add('shoot');$('#beamGlow').classList.add('shoot');$('#beamHead').classList.add('shoot');__sfx.swipe(.6);camFocus(905,585,1.12,.4);});
on(7280,()=>{shakePanel();__sfx.thud(.5);sparks(905,585,9,'actSite');});
on(7650,()=>{$('#useLabel').classList.add('in');__sfx.pop(.45);});
/* 0:59「来获取预先藏在网站里面的密码」——密码块升起在 risePw() 中注册 */
/* 1:01「然后这一串密码叫做flag」 */
on(12000,()=>scramblePw());
on(12680,()=>{$('#flagName').classList.add('in');__sfx.thud(.65);__sfx.ding(.35);camFocus(960,470,1.14,.45);});
on(13500,()=>camTo(0,0,1,.6));
/* 1:03「找到它就算通关」 */
on(14200,()=>{$('#stamp').classList.add('in');__sfx.thud(.6);});
/* 1:04「在视频的最后你会看到你用AI」 */
on(15000,()=>{cutTo('actFinal');camCut(0,0,1);__sfx.whoosh(.8,.45);});
on(15920,()=>{$('#aiChip').classList.add('in');__sfx.pop(.6);});
/* 1:07「自己亲手打穿这样一道题」 */
on(16600,()=>{$('#heroCN').classList.add('in');__sfx.thud(.4);});
on(16780,()=>__sfx.pop(.4));
on(16960,()=>__sfx.pop(.4));
on(17140,()=>__sfx.pop(.4));
on(11800,()=>{$('#fish1').classList.add('in');__sfx.pop(.6);});
on(12200,()=>{$('#fish1').classList.add('bub');__sfx.pop(.35);});
on(17480,()=>$('#miniPanel').classList.add('in'));
on(17680,()=>{$('#heroSub').classList.add('in');});
on(18000,()=>{$('#slashP').classList.add('go');__sfx.swipe(.7);camFocus(960,600,1.06,.4);});
on(18220,()=>{$('#miniPanel').classList.add('split');__sfx.thud(.6);sparks(960,760,10,'actFinal');});
on(19350,()=>$('#slashP').classList.add('dim'));
/* 1:09「并且获取flag」 */
on(20000,()=>{$('#flagEmblem').classList.add('in');__sfx.ding(.6);});
on(20600,()=>{camFocus(960,650,1.09,.7);__sfx.ding(.35);});

/* 增补节拍：发丝引线与标志同步登场（不动既有 cue） */
on(5480,()=>$('#ldV').classList.add('on'));
on(7680,()=>$('#ldU').classList.add('on'));

/* 载入期注册：打字机 / 密码块升起 */
typeText('ctfCapTx','安全圈的练手比赛',3200,110);
typeText('finKickTx','在视频的最后',15260,120);
risePw();

/* 路径粒子（时间轴驱动，可冻结） */
function flowDots(host,path,n,startMs,dur,opt){
  opt=opt||{};
  const L=path.getTotalLength(),dots=[];
  for(let i=0;i<n;i++){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',opt.r||5);c.setAttribute('fill',opt.fill||'#1C1C1A');
    c.setAttribute('stroke',opt.stroke||'none');c.setAttribute('stroke-width',opt.sw||0);
    c.style.opacity='0';
    host.appendChild(c);dots.push(c);
  }
  tws.push({tag:'dots',t:startMs,d:dur,f:p=>{
    const k0=p%1;
    dots.forEach((c,i)=>{
      const pt=path.getPointAtLength(((k0+i/n)%1)*L);
      c.setAttribute('cx',pt.x.toFixed(1));c.setAttribute('cy',pt.y.toFixed(1));
      c.style.opacity=String(opt.op||0.95);
    });
  },done:()=>{dots.forEach(c=>{c.style.opacity='0'});}});
}
/* 0:54「比赛会搭建一个带有漏洞的网站」——裂痕绘完后沿裂痕流动的粒子 */
on(6200,()=>flowDots(document.getElementById('siteSvg'),document.getElementById('crack'),6,6200,7300,
  {r:4,fill:'#1C1C1A',stroke:'#F0EFEB',sw:1,op:.95}));
/* 0:56「参赛选手需要利用网站的漏洞」——利用光束补沿光束流动的粒子 */
on(7100,()=>flowDots(document.getElementById('siteSvg'),document.getElementById('beam'),4,7100,6400,
  {r:5,fill:'#1C1C1A',stroke:'#F0EFEB',sw:1,op:1}));

/* ===== QA 专用（正常播放不触发）：hash 带 t=毫秒 → 起播后跳转该时刻并冻结 ===== */
(function(){
  var m=/t=(\d+)/.exec(location.hash||'');
  if(!m)return;
  var MS=+m[1];
  var st=document.createElement('style');st.textContent='*{transition:none!important}';
  var orig=window.__startPlayback;
  window.__startPlayback=function(){
    orig();
    t0=performance.now()-MS;
    tick(performance.now());
    paused=true;document.body.classList.add('paused');document.head.appendChild(st);
  };
})();
</script>
</body>
</html>
