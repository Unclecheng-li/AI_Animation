<!DOCTYPE html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Contingency Plan"},
  {"id":"nodes","type":"string","label":"Flow Nodes (JSON)","default":"[{\"id\":\"01\",\"label\":\"Identify Risks\",\"desc\":\"Brainstorm and catalogue all potential risks that could impact the project. Consider internal and external factors, past project data, and stakeholder input.\"},{\"id\":\"02\",\"label\":\"Assess Impact\",\"desc\":\"Evaluate each risk using the Probability vs Impact matrix. Rate risks as Low, Medium, or High across both dimensions to prioritise your response planning.\"},{\"id\":\"03\",\"label\":\"Plan Response\",\"desc\":\"For each high-priority risk, develop a specific mitigation strategy. Define triggers, assign owners, and establish clear escalation paths before the risk materialises.\"},{\"id\":\"04\",\"label\":\"Monitor & Review\",\"desc\":\"Continuously track identified risks and scan for new ones. Schedule regular review cycles. Update the plan as project conditions evolve and new information emerges.\"}]"},
  {"id":"activeNode","type":"number","label":"Active Node (0-based)","default":0,"min":0,"max":3},
  {"id":"primaryColor","type":"color","label":"Primary Color","default":"#285f9f"},
  {"id":"accentColor","type":"color","label":"Accent Color","default":"#cd5746"},
  {"id":"basePlateImage","type":"string","label":"Base Plate Image","default":"v2-base-blue.png"},
  {"id":"bgColor","type":"color","label":"Background","default":"#f5f2ea"},
  {"id":"durationPerNode","type":"number","label":"Seconds per Node","default":3.5,"min":2,"max":8,"step":0.5}
]'>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #285f9f;
      --accent:  #cd5746;
      --bg:      #f5f2ea;
      --ink:     #182026;
      --plate-image: url("v2-base-blue.png");
    }

    body {
      width: 1920px; height: 1080px;
      background-color: var(--bg);
      background-image: var(--plate-image);
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      position: relative;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    [data-composition-id="contingency-plan"] {
      position: absolute; inset: 0;
      width: 1920px; height: 1080px;
      overflow: hidden;
      background-color: var(--bg);
      background-image: var(--plate-image);
      background-size: 1920px 1080px;
      background-position: center;
      background-repeat: no-repeat;
    }

    [data-composition-id="contingency-plan"] > * { z-index: 1; }

    /* Title */
    .cp-title {
      position: absolute; top: 60px; left: 100px;
      font-size: 42px; font-weight: 700;
      color: var(--primary); opacity: 0;
    }

    /* Left — flow nodes */
    .flow-area {
      position: absolute; left: 100px; top: 180px;
      width: 880px; height: 700px; opacity: 0;
    }

    .flow-node {
      position: absolute;
      display: flex; align-items: center; gap: 18px;
    }

    .node-circle {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; flex-shrink: 0;
    }

    .node-label {
      font-size: 20px; font-weight: 600;
      color: var(--primary);
    }

    /* Right — info panel */
    .info-panel {
      position: absolute; left: 965px; top: 292px;
      width: 760px; height: 520px;
      opacity: 0;
    }

    .info-block {
      position: absolute; inset: 0;
      overflow: visible;
    }

    .info-number {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 86px; font-weight: 800;
      color: #d9534e; opacity: 1;
      line-height: 1;
      z-index: 1;
    }

    .info-heading {
      font-size: 42px; font-weight: 700;
      color: var(--primary);
      margin: 138px 0 30px;
      position: relative;
      z-index: 2;
    }

    .info-desc {
      font-size: 23px; line-height: 1.55;
      color: var(--ink); max-width: 720px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div data-composition-id="contingency-plan"
       data-width="1920" data-height="1080"
       data-duration="15" data-start="0" data-track-index="0">

    <div class="cp-title" id="cpTitle"></div>

    <div class="flow-area" id="flowArea">
      <svg style="position:absolute;inset:0;pointer-events:none;width:880px;height:700px"
           viewBox="0 0 880 700">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#285f9f" opacity="0.3"/>
          </marker>
        </defs>
        <line x1="62" y1="72" x2="62" y2="590"
              stroke="#285f9f" stroke-width="2" opacity="0.15"
              marker-end="url(#arrowhead)"/>
      </svg>
    </div>

    <div class="info-panel" id="infoPanel"></div>

    <div id="el-fade" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      var vars      = __hyperframes.getVariables();
      var title     = vars.title           || 'Contingency Plan';
      var nodes     = JSON.parse(vars.nodes || '[]');
      var primary   = vars.primaryColor    || '#285f9f';
      var accent    = vars.accentColor     || '#cd5746';
      var basePlate = vars.basePlateImage  || 'v2-base-blue.png';
      var bgColor   = vars.bgColor         || '#f5f2ea';
      var durPer    = Number(vars.durationPerNode) || 3.5;
      var TOTAL     = nodes.length * durPer + 1;

      // Apply CSS variables
      var r = document.documentElement;
      r.style.setProperty('--primary',     primary);
      r.style.setProperty('--accent',      accent);
      r.style.setProperty('--bg',          bgColor);
      r.style.setProperty('--plate-image', 'url("' + basePlate + '")');
      var comp = document.querySelector('[data-composition-id="contingency-plan"]');
      comp.style.backgroundImage = 'url("' + basePlate + '")';
      comp.style.backgroundColor = bgColor;
      document.body.style.backgroundImage = 'url("' + basePlate + '")';
      document.body.style.backgroundColor = bgColor;
      comp.setAttribute('data-duration', TOTAL);

      document.getElementById('cpTitle').textContent = title;

      // ── Flow nodes ─────────────────────────────────────────────
      var flowArea = document.getElementById('flowArea');
      var circles  = [];
      var lblEls   = [];

      nodes.forEach(function(n, i) {
        var node = document.createElement('div');
        node.className = 'flow-node';
        node.style.left = '30px';
        node.style.top  = (40 + i * 160) + 'px';
        node.innerHTML =
          '<div class="node-circle" id="nc' + i + '">' + n.id + '</div>' +
          '<span class="node-label" id="nl' + i + '">' + n.label + '</span>';
        flowArea.appendChild(node);
        circles.push(document.getElementById('nc' + i));
        lblEls.push(document.getElementById('nl' + i));
      });

      // Pre-set node 0 as active
      gsap.set(circles[0], {
        backgroundColor: accent,
        scale: 1.2,
        boxShadow: '0 4px 20px ' + accent + '55'
      });

      // ── Info blocks ────────────────────────────────────────────
      var infoPanel = document.getElementById('infoPanel');
      var iBlocks   = [];

      nodes.forEach(function(n, i) {
        var block = document.createElement('div');
        block.className = 'info-block';
        block.id = 'ib' + i;
        block.innerHTML =
          '<div class="info-number">'  + n.id    + '</div>' +
          '<div class="info-heading">' + n.label + '</div>' +
          '<div class="info-desc">'    + n.desc  + '</div>';
        infoPanel.appendChild(block);
        iBlocks.push(block);
        if (i !== 0) gsap.set(block, { opacity: 0 });
      });

      // ── Timeline ───────────────────────────────────────────────
      var tl = gsap.timeline({ paused: true });

      // Intro
      tl.to('#cpTitle',   { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0);
      tl.to('#flowArea',  { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.3);
      tl.from('.flow-node', { opacity: 0, x: -28, duration: 0.4, stagger: 0.14, ease: 'power2.out' }, 0.5);
      tl.to('#infoPanel', { opacity: 1, x: -14, duration: 0.5, ease: 'power2.out' }, 1.1);

      // Node transitions
      for (var i = 1; i < nodes.length; i++) {
        (function(idx) {
          var t    = idx * durPer;
          var prev = idx - 1;

          // Info block crossfade
          tl.to(iBlocks[prev], { opacity: 0, duration: 0.22, ease: 'power2.in'  }, t);
          tl.to(iBlocks[idx],  { opacity: 1, duration: 0.45, ease: 'power2.out' }, t + 0.22);

          // Deactivate previous circle
          tl.to(circles[prev], {
            backgroundColor: primary, scale: 1, boxShadow: 'none', duration: 0.3
          }, t);

          // Activate current circle
          tl.to(circles[idx], {
            backgroundColor: accent, scale: 1.2,
            boxShadow: '0 4px 20px ' + accent + '55',
            duration: 0.3
          }, t + 0.1);

          // Panel bounce
          tl.to('#infoPanel', { scale: 0.97, duration: 0.12 }, t + 0.1);
          tl.to('#infoPanel', { scale: 1, duration: 0.45, ease: 'back.out(1.3)' }, t + 0.22);
        })(i);
      }

      // Fade-to-black outro (V3 standard)
      tl.fromTo('#el-fade', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.in' }, TOTAL - 0.5);
      tl.set('#el-fade', { opacity: 1 }, TOTAL);

      window.__timelines = window.__timelines || {};
      window.__timelines['contingency-plan'] = tl;
    </script>
  </div>
</body>
</html>
