<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1c1917; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1c1917; }
      .copy {
        position: absolute; left: 120px; top: 280px; color: #fafaf9;
        font-family: "Segoe UI", sans-serif; letter-spacing: -0.03em;
      }
      .eyebrow { font-size: 24px; letter-spacing: 0.28em; text-transform: uppercase; color: #fdba74; margin-bottom: 24px; }
      .title { font-size: 108px; font-weight: 700; line-height: 0.95; }
      .sub { margin-top: 28px; font-size: 32px; color: rgba(245,245,244,0.7); }
      .card {
        position: absolute; width: 420px; height: 560px; border-radius: 28px; padding: 40px;
        font-family: "Segoe UI", sans-serif; color: #1c1917; box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      }
      .c1 { left: 980px; top: 220px; background: #fed7aa; z-index: 1; }
      .c2 { left: 1040px; top: 250px; background: #fdba74; z-index: 2; }
      .c3 { left: 1100px; top: 280px; background: #fb923c; z-index: 3; }
      .card h3 { font-size: 42px; margin-bottom: 18px; }
      .card p { font-size: 26px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080" data-fps="30">
      <div id="copy" class="clip copy" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="eyebrow">Product deck</div>
        <div class="title">Stack Cards</div>
        <div class="sub">Deal features one layer at a time</div>
      </div>
      <div id="c1" class="clip card c1" data-start="0" data-duration="4.5" data-track-index="1"><h3>Brief</h3><p>Capture intent before any composition starts.</p></div>
      <div id="c2" class="clip card c2" data-start="0" data-duration="4.5" data-track-index="2"><h3>Build</h3><p>Compose with seek-safe timelines and clips.</p></div>
      <div id="c3" class="clip card c3" data-start="0" data-duration="4.5" data-track-index="3"><h3>Ship</h3><p>Publish the block to the UI2V registry.</p></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#copy", { opacity: 0, y: 24 });
      gsap.set(["#c1","#c2","#c3"], { opacity: 0, y: 120, rotate: 8 });
      tl.to("#copy", { opacity: 1, y: 0, duration: 0.55 }, 0.15)
        .to("#c1", { opacity: 1, y: 0, rotate: -6, duration: 0.7, ease: "power3.out" }, 0.45)
        .to("#c2", { opacity: 1, y: 0, rotate: -2, duration: 0.7, ease: "power3.out" }, 0.7)
        .to("#c3", { opacity: 1, y: 0, rotate: 3, duration: 0.7, ease: "power3.out" }, 0.95)
        .to("#c3", { y: -16, rotate: 1, duration: 1.8, ease: "sine.inOut" }, 2.0)
        .to("#c2", { y: -8, duration: 1.8, ease: "sine.inOut" }, 2.0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
