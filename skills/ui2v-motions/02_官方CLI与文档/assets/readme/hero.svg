<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">UI2V video motion asset library</title>
  <desc id="desc">Discover, install, publish, and share reusable HyperFrames video motion packages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7bd88f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <path d="M56 278H1144" stroke="#243244" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="72" fill="#91a4bb" font-size="20" letter-spacing="3">AI-READY VIDEO MOTION ASSETS</text>
    <text x="56" y="132" fill="#f8fafc" font-size="58" font-weight="700">UI2V</text>
    <text x="56" y="170" fill="#cbd5e1" font-size="24">Discover, reuse, and share HyperFrames motion.</text>
    <text x="56" y="210" fill="#7bd88f" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">search  →  install  →  publish  →  share</text>
    <g transform="translate(650 74)">
      <rect width="470" height="154" rx="18" fill="#0b1626" stroke="#334155"/>
      <text x="28" y="34" fill="#94a3b8" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">HYPERFRAMES PACKAGE</text>
      <text x="28" y="74" fill="#f8fafc" font-size="25" font-weight="600">logo-sting@1.2.0</text>
      <g transform="translate(28 100)">
        <circle cx="8" cy="8" r="8" fill="#00d4ff"/>
        <text x="28" y="14" fill="#cbd5e1" font-size="17">registry-item.json</text>
        <circle cx="190" cy="8" r="8" fill="#7bd88f"/>
        <text x="210" y="14" fill="#cbd5e1" font-size="17">index.html</text>
      </g>
    </g>
    <g transform="translate(56 298)" fill="#64748b" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <text x="0" y="0">HyperFrames creates motion</text>
      <text x="370" y="0">UI2V distributes it</text>
      <text x="760" y="0">@ui2v/cli</text>
    </g>
  </g>
</svg>
