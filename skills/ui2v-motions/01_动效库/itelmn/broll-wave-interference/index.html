<!doctype html><html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"waveA","type":"color","label":"Wave A","default":"#67e8f9"},{"id":"waveB","type":"color","label":"Wave B","default":"#ffb454"},{"id":"showLabels","type":"boolean","label":"Show labels","default":true}]'>
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--bg:#081013;--panel:#101b1f;--grid:#254047;--ink:#eefdf8;--muted:#91aaa5;--result:#d8fff2}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(circle at 76% 20%,#123139 0,transparent 30%),var(--bg)}#clip{position:absolute;inset:0;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(103,232,249,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.055) 1px,transparent 1px);background-size:48px 48px}
header{position:absolute;left:92px;right:92px;top:60px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3}h1{margin:0;font:900 64px/.95 Arial,sans-serif;letter-spacing:-.05em}header small{font:700 17px "Courier New",monospace;letter-spacing:.16em;color:var(--muted);padding-top:16px}
#scope{position:absolute;left:90px;top:176px;width:1740px;height:730px;border:2px solid #31515a;background:rgba(5,13,16,.68);box-shadow:0 28px 70px rgba(0,0,0,.35)}.lane{fill:var(--panel);stroke:#29464e;stroke-width:2}.axis{stroke:#46636a;stroke-width:2;stroke-dasharray:7 11}.wave{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 12px currentColor)}#wave-a{stroke:var(--waveA)}#wave-b{stroke:var(--waveB)}#wave-sum{stroke:var(--result);stroke-width:9}.sample{stroke:var(--result);stroke-width:2;stroke-dasharray:5 8;opacity:.55}.sample-dot{fill:var(--result)}
.label{fill:var(--ink);font:900 22px Arial,sans-serif;letter-spacing:.04em}.formula{fill:var(--muted);font:700 16px "Courier New",monospace;letter-spacing:.09em}.plus{fill:var(--result);font:900 46px Arial,sans-serif;text-anchor:middle}.result-label{fill:var(--result)}
.footer{position:absolute;left:92px;right:92px;bottom:52px;display:flex;justify-content:space-between;border-top:2px solid #31515a;padding-top:15px;font:700 17px "Courier New",monospace;letter-spacing:.08em;color:var(--muted)}.footer b{color:var(--result)}.no-labels header,.no-labels .label,.no-labels .formula,.no-labels .plus,.no-labels .footer{opacity:0}
</style></head><body>
<div id="stage" data-composition-id="broll-wave-interference" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080"><div id="clip" class="clip" data-start="0" data-duration="8" data-track-index="1"><div class="grid"></div>
<header><h1>WAVES ADD POINT BY POINT</h1><small>PHYSICS / SUPERPOSITION</small></header>
<svg id="scope" viewBox="0 0 1740 730" aria-label="Two source waves combining into an interference pattern">
<g id="source-a"><rect class="lane" x="26" y="26" width="1688" height="188" rx="22"/><line class="axis" x1="190" y1="120" x2="1660" y2="120"/><text class="label" x="65" y="100">WAVE A</text><text class="formula" x="65" y="130">y₁(x,t)</text><path id="wave-a" class="wave" d=""/></g>
<g id="source-b"><rect class="lane" x="26" y="238" width="1688" height="188" rx="22"/><line class="axis" x1="190" y1="332" x2="1660" y2="332"/><text class="label" x="65" y="312">WAVE B</text><text class="formula" x="65" y="342">y₂(x,t)</text><path id="wave-b" class="wave" d=""/></g>
<text id="plus" class="plus" x="870" y="464">+</text>
<g id="result"><rect class="lane" x="26" y="486" width="1688" height="218" rx="22"/><line class="axis" x1="190" y1="595" x2="1660" y2="595"/><text class="label result-label" x="65" y="574">RESULT</text><text class="formula" x="65" y="604">y₁ + y₂</text><path id="wave-sum" class="wave" d=""/><line id="sample-line" class="sample" x1="1160" y1="45" x2="1160" y2="686"/><circle id="sample-a" class="sample-dot" cx="1160" cy="120" r="7"/><circle id="sample-b" class="sample-dot" cx="1160" cy="332" r="7"/><circle id="sample-sum" class="sample-dot" cx="1160" cy="595" r="10"/></g>
</svg>
<div class="footer"><span>CONSTRUCTIVE ↔ DESTRUCTIVE INTERFERENCE</span><span>LOCAL AMPLITUDE <b id="reading">0.00</b></span></div>
</div></div>
<script>
const vars=window.__hyperframes.getVariables();if(!vars.showLabels)document.getElementById('stage').classList.add('no-labels');
const waveA=document.getElementById('wave-a'),waveB=document.getElementById('wave-b'),waveSum=document.getElementById('wave-sum'),reading=document.getElementById('reading');const dots=[document.getElementById('sample-a'),document.getElementById('sample-b'),document.getElementById('sample-sum')];const driver={phase:0,mix:0};
function valuesAt(x){const a=Math.sin(x*.012+driver.phase);const b=Math.sin(x*.012-driver.phase*.62+1.08);return[a,b,a+b];}
function pathFor(base,kind){let d='';for(let x=190;x<=1660;x+=10){const v=valuesAt(x)[kind];const amp=kind===2?66*driver.mix:58;const y=base-v*amp;d+=(x===190?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';}return d;}
function draw(){waveA.setAttribute('d',pathFor(120,0));waveB.setAttribute('d',pathFor(332,1));waveSum.setAttribute('d',pathFor(595,2));const s=valuesAt(1160);dots[0].setAttribute('cy',(120-s[0]*58).toFixed(1));dots[1].setAttribute('cy',(332-s[1]*58).toFixed(1));dots[2].setAttribute('cy',(595-s[2]*66*driver.mix).toFixed(1));reading.textContent=(s[2]*driver.mix).toFixed(2);}
draw();const tl=gsap.timeline({paused:true});tl.fromTo('header',{y:-36,autoAlpha:0},{y:0,autoAlpha:1,duration:.55,ease:'power3.out'},0);tl.fromTo('#scope',{scale:.96,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.65,ease:'power2.out'},.12);tl.fromTo(['#source-a','#source-b'],{x:-70,autoAlpha:0},{x:0,autoAlpha:1,duration:.65,stagger:.16,ease:'power3.out'},.45);tl.fromTo('#result',{y:70,autoAlpha:0},{y:0,autoAlpha:1,duration:.65,ease:'power3.out'},1.08);tl.fromTo('#plus',{scale:.2,autoAlpha:0,transformOrigin:'center'},{scale:1,autoAlpha:1,duration:.42,ease:'back.out(1.8)'},1.45);tl.to(driver,{mix:1,duration:1.35,ease:'power2.inOut',onUpdate:draw},1.6);tl.to(driver,{phase:Math.PI*5,duration:5.7,ease:'none',onUpdate:draw},1.1);tl.fromTo('#sample-line',{autoAlpha:0},{autoAlpha:1,duration:.35},2.55);tl.fromTo('.sample-dot',{scale:0,transformOrigin:'center'},{scale:1,duration:.35,stagger:.08,ease:'back.out(2)'},2.62);tl.to('#wave-sum',{strokeWidth:13,duration:.5,yoyo:true,repeat:3,ease:'sine.inOut'},3.4);tl.to('#clip',{autoAlpha:0,duration:.3,ease:'power2.in'},7.68);tl.seek(0);window.__timelines['broll-wave-interference']=tl;
</script></body></html>
